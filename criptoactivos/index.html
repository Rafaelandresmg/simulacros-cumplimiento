 "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "Las medidas intensificadas deben aplicarse, entre otros casos, a:", "o": ["Relaciones con países de mayor riesgo", "Todos los clientes extranjeros sin excepción", "Clientes que paguen con tarjeta de crédito", "Operaciones realizadas en fin de semana"], "a": 0, "e": "El riesgo determina la intensidad."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, como medida de debida diligencia, el sujeto puede rastrear y registrar:", "o": ["Las direcciones IP de los equipos del cliente", "Las contraseñas personales usadas por el cliente", "Las conversaciones privadas del cliente en redes", "Las claves privadas de las billeteras de terceros"], "a": 0, "e": "Arts. 40 y 45.3."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el intermediario de una cadena de transferencias también debe reportar operaciones sospechosas y congelar cuando corresponda.", "a": true, "e": "Art. 43."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la debida diligencia que corresponde a un cliente de riesgo alto es:", "o": ["Intensificada", "Mejorada", "Estándar", "Reducida"], "a": 0, "e": "Art. 45."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Programa Anual de Capacitación está dirigido a:", "o": ["Todo el personal, directivos, ejecutivos y autorizados", "Solo al oficial de cumplimiento y a su suplente", "Solo a los empleados del área de tecnología", "Solo a los trabajadores de nuevo ingreso"], "a": 0, "e": "Art. 65."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las billeteras destinadas al pago de nómina quedan exceptuadas de verificación si los datos los da oficialmente el patrono.", "a": true, "e": "Art. 54."}, {"t": "mc", "q": "El control dual en operaciones sensibles consiste en:", "o": ["Que dos personas intervengan en el mismo proceso", "Que el sistema registre dos veces la operación", "Que el cliente firme por duplicado", "Que la operación se revise al año siguiente"], "a": 0, "e": "Reduce el riesgo de actuación individual indebida."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "La prohibición de enviar divisas por encomiendas busca evitar:", "o": ["El traslado de valores fuera de todo control", "La competencia a la banca tradicional", "El encarecimiento del servicio postal para los usuarios", "La pérdida de paquetes en tránsito"], "a": 0, "e": "Cierra una vía de traslado oculto."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "mc", "q": "En la arquitectura de la LOCDOFT, ¿qué diferencia a la ONCDOFT de la UNIF?", "o": ["ONCDOFT rige la política; UNIF analiza reportes financieros", "La primera analiza los reportes; la segunda dicta la política nacional", "La primera supervisa a las aseguradoras; la segunda a los bancos", "La primera investiga penalmente; la segunda sanciona administrativamente"], "a": 0, "e": "Son órganos distintos y dependen de ministerios distintos."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "Según la LOCDOFT, las facultades de organización, control y supervisión de la materia corresponden a:", "o": ["La ONCDOFT", "La UNIF", "El BCV", "El SENIAT"], "a": 0, "e": "Art. 5."}, {"t": "mc", "q": "Un sujeto obligado con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector asegurador"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "mc", "q": "La evaluación nacional de riesgos sirve principalmente para que:", "o": ["El país y sus sectores enfoquen recursos donde más riesgo hay", "Cada empresa copie su contenido en su manual", "Se publiquen los nombres de los sujetos que han sido reportados", "Se fijen las multas aplicables por incumplimiento"], "a": 0, "e": "Es el insumo del enfoque basado en riesgo a nivel país."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "Siempre existe norma sectorial para todo el país", "Debe esperar a que se dicte la norma prudencial de su sector", "Solo responden los sectores con superintendencia"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Quien dicta las normas prudenciales para el sector bancario venezolano es:", "o": ["La Superintendencia de las Instituciones del Sector Bancario", "La Superintendencia Nacional de Valores", "La Superintendencia de la Actividad Aseguradora del país", "El Banco Central de Venezuela"], "a": 0, "e": "SUDEBAN para la banca; SUNAVAL para valores."}, {"t": "mc", "q": "El enfoque basado en riesgo implica, en esencia:", "o": ["Más controles a mayor riesgo y medidas simplificadas a menor riesgo", "El mismo nivel de control para todos los clientes por igual", "Eliminar controles donde el riesgo nunca se haya materializado", "Concentrar todos los controles en las operaciones de alto monto"], "a": 0, "e": "Lógica de proporcionalidad."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Las multas que la LOCDOFT prevé para los sujetos obligados se expresan en:", "o": ["Unidades tributarias", "Salarios mínimos mensuales", "Dólares de los Estados Unidos", "Petros o criptoactivos soberanos"], "a": 0, "e": "El régimen sancionatorio se expresa en U.T."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "mc", "q": "Un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "La LOCDOFT exige conservar los soportes para que, años después, se pueda:", "o": ["Reconstruir la operación y acreditarla ante la autoridad", "Justificar el pago de los impuestos del ejercicio fiscal", "Demostrar la rentabilidad del contrato", "Acreditar la antigüedad del cliente"], "a": 0, "e": "Trazabilidad probatoria."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre aseguradora y asegurado"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "La corrupción se vincula con el lavado de activos porque:", "o": ["Los fondos ilícitos necesitan legitimarse para poder usarse", "Ambos delitos requieren organizaciones de tres o más personas", "El lavado es un elemento del tipo penal de corrupción", "La corrupción solo ocurre con fondos en efectivo"], "a": 0, "e": "La corrupción es delito determinante del lavado."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "mc", "q": "Si la UNIF pide información a un sujeto obligado sobre un cliente, el sujeto obligado debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "Un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "La condición de PEP de un cliente debe revisarse:", "o": ["De forma periódica, porque los cargos cambian", "Solo al momento de aceptarlo como cliente", "Solo si el cliente lo informa por escrito", "Solo cuando lo exija la superintendencia"], "a": 0, "e": "El perfil debe mantenerse actualizado."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada aseguradora", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "mc", "q": "Según la LOCDOFT, la condición de sujeto obligado nace de:", "o": ["Estar bajo el control de un órgano o ente de control", "Tener un volumen de operaciones elevado", "Operar con clientes extranjeros", "Estar inscrito en el registro mercantil de su domicilio"], "a": 0, "e": "Definición legal del término."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "mc", "q": "Según el Decreto 3.656, el objeto de la UNIF es centralizar, procesar y analizar:", "o": ["Los reportes de actividades sospechosas", "Las declaraciones de impuestos del país", "Las licencias de los sujetos obligados", "Los registros mercantiles de empresas"], "a": 0, "e": "Art. 2 del Decreto de Adecuación, G.O. 41.522."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "La «colocación» en el lavado de activos consiste en:", "o": ["Introducir el producto del delito al sistema financiero", "Ocultar el origen mediante transferencias sucesivas", "Reincorporar los fondos blanqueados con apariencia lícita", "Cobrar un siniestro con documentos falsos"], "a": 0, "e": "Primera etapa; suele involucrar efectivo."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "¿Por qué el decomiso es una herramienta clave contra el crimen organizado?", "o": ["Priva a las organizaciones de su lucro y capacidad operativa", "Sustituye por completo a la pena privativa de libertad", "Financia los programas de trabajo de la ONCDOFT", "Se aplica sin necesidad de un proceso penal previo"], "a": 0, "e": "Privar al delito de su lucro."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Diferir una solicitud de asistencia, en lugar de negarla, sirve para:", "o": ["No entorpecer una investigación nacional en curso", "Cobrar los gastos del trámite por adelantado", "Esperar a que prescriba la acción penal", "Obtener reciprocidad del otro Estado"], "a": 0, "e": "Es una figura distinta de la denegación."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la LOCDOFT, los agentes cuya actividad principal es la intermediación de bienes raíces son:", "o": ["Sujetos obligados", "Órganos de control", "Usuarios ocasionales", "Entes de autorregulación"], "a": 0, "e": "Art. 9, numeral 10, literal a."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un reporte con información incompleta o errónea enviado a la UNIF:", "o": ["Reduce la utilidad de la inteligencia y es un incumplimiento", "Es preferible a no reportar y no tiene consecuencia alguna", "La UNIF lo corrige de oficio sin mayor trámite alguno", "Obliga a la UNIF a archivarlo sin análisis de ningún tipo"], "a": 0, "e": "La calidad del reporte importa."}, {"t": "mc", "q": "¿Por qué las normas exigen capacitación periódica al personal?", "o": ["Es la primera línea de detección de señales de alerta", "Es un requisito de acreditación que fija el supervisor", "Reduce las primas que se pagan a los reaseguradores", "Lo exige expresamente el Código de Comercio vigente"], "a": 0, "e": "Un sistema sin personal capacitado no detecta."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a un sujeto obligado por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "La protección legal a quien reporta de buena fe existe porque sin ella:", "o": ["Nadie reportaría por temor a represalias", "Los reportes serían siempre anónimos", "El cliente podría exigir una indemnización", "La UNIF no podría analizar los casos"], "a": 0, "e": "Objetivo: no inhibir el reporte."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "mc", "q": "Según la LOCDOFT, el destinatario de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Arts. 13, 24 y 25 en concordancia con el Decreto 3.656."}, {"t": "mc", "q": "La «estratificación» en el lavado de activos consiste en:", "o": ["Muchas operaciones para distanciar los fondos de su origen", "Introducir el efectivo ilícito en el sistema financiero", "Reincorporar los fondos blanqueados a la economía formal", "Fraccionar depósitos para evadir el reporte de efectivo"], "a": 0, "e": "Colocación, estratificación e integración."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las primas de seguros", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "El sector turismo cuenta con un regulador propio en esta materia, que es:", "o": ["El Ministerio del Poder Popular para el Turismo", "La Superintendencia de la Actividad Aseguradora", "La Comisión Nacional de Casinos", "La Superintendencia de Valores"], "a": 0, "e": "El ministerio del sector ejerce la supervisión."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el registro unificado de sujetos obligados se identifica como:", "o": ["RUSO-ONCDOFT", "RUAP-ONCDOFT", "RIF-ONCDOFT", "SIAR-ONCDOFT"], "a": 0, "e": "G.O. 42.118. El RUAP es el registro de actuación de los contadores."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "Las sanciones a las personas jurídicas de la LOCDOFT buscan:", "o": ["Evitar que la estructura societaria sirva de escudo", "Sustituir la pena que corresponde a las personas naturales", "Recaudar fondos para el órgano rector", "Castigar a los accionistas minoritarios"], "a": 0, "e": "Responsabilidad propia de la persona jurídica."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "La figura del «órgano rector» en la LOCDOFT existe para:", "o": ["Coordinar la política nacional contra estos delitos", "Centralizar los reportes de operaciones sospechosas", "Sustituir a las superintendencias sectoriales", "Dictar sentencias contra personas jurídicas"], "a": 0, "e": "Rectoría, coordinación, registro y lineamientos."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "mc", "q": "La imprescriptibilidad de la acción penal en la LOCDOFT significa que:", "o": ["El Estado puede perseguir el delito sin límite de tiempo", "La pena nunca se extingue ni con la muerte", "Los bienes que fueron decomisados no se devuelven jamás", "El proceso penal no puede sobreseerse"], "a": 0, "e": "Afecta a la acción penal, no a otras instituciones."}, {"t": "mc", "q": "El decomiso de bienes en la LOCDOFT se distingue de la multa en que el decomiso:", "o": ["Recae sobre bienes vinculados al delito", "Se paga en unidades tributarias", "Lo impone el órgano de control", "Se aplica solo a personas naturales"], "a": 0, "e": "Multa es sanción pecuniaria; decomiso recae sobre el producto o instrumento."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede sustituirla libremente cuando la otra sea más exigente", "Debe aplicar siempre la del sector bancario", "Puede elegir la que prefiera cada año"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Según la LOCDOFT, ser PEP implica por sí mismo que el cliente debe ser rechazado.", "a": false, "e": "La condición de PEP eleva el riesgo y exige medidas reforzadas; no implica ilicitud ni rechazo automático."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "vf", "q": "La acción penal de los delitos previstos en la LOCDOFT no prescribe.", "a": true, "e": "Característica reforzada del régimen."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de seguros", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la prima se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "Según la LOCDOFT, el traslado de efectivo por frontera se controla mediante:", "o": ["Una declaración obligatoria por encima de un umbral", "Una autorización previa otorgada por el órgano rector", "Una prohibición total de llevar efectivo", "Un impuesto a la salida de divisas"], "a": 0, "e": "Declaración, no prohibición."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "La razón por la que los notarios y registradores figuran como sujetos obligados es que:", "o": ["Intervienen en actos que transfieren bienes de alto valor", "Reciben pagos en efectivo de parte de sus usuarios", "Dependen del Ministerio de Justicia", "Emiten documentos con fe pública"], "a": 0, "e": "El traspaso de inmuebles y sociedades es vía típica de integración."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "La Recomendación 33 exige a los países mantener:", "o": ["Estadísticas sobre la efectividad de su sistema", "Un registro de todas las operaciones en efectivo", "Un listado público de personas sancionadas", "Una base de datos de clientes de alto riesgo"], "a": 0, "e": "Reportes, investigaciones, condenas y decomisos."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes", "Juzga a los sujetos obligados que hayan incumplido", "Representa al Estado ante los tribunales"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Es siempre el único responsable de los incumplimientos", "No tiene ninguna responsabilidad por ser asesor", "Solo responde si es abogado colegiado"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Condena penal contra los directivos de las instituciones", "Desaparición del país como miembro del grupo", "Ninguna consecuencia práctica para el país"], "a": 0, "e": "Presión entre pares y co e un saldo de riesgo"], "a": 0, "e": "Art. 54."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, las categorías de riesgo que establece la providencia son:", "o": ["Bajo, moderado y alto", "Bajo, medio, alto y crítico", "Aceptable, moderado y grave", "Verde, amarillo y rojo"], "a": 0, "e": "Art. 36."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si solo un sujeto obligado interviene en la transferencia, debe cumplir la regla respecto de su propio cliente.", "a": true, "e": "Art. 41."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la apertura injustificada de una nueva billetera por un cliente ya vinculado exige medidas mejoradas o intensificadas.", "a": true, "e": "Art. 57.2."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de cumplimiento se ubica jerárquicamente:", "o": ["Un nivel por debajo del presidente del sujeto", "En el mismo nivel jerárquico del presidente", "Dos niveles por debajo de la gerencia general", "Bajo la dependencia del auditor interno"], "a": 0, "e": "Art. 15.2. Trampa: en la norma de seguros la posición es distinta."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, entre los productos y servicios de alto riesgo enunciados figura:", "o": ["El intercambio directo entre pares", "El pago de nómina del sector público", "La emisión de estados de cuenta", "La atención telefónica al usuario"], "a": 0, "e": "Art. 37.2.d."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Plan Operativo Anual estará a disposición de SUNACRIP:", "o": ["En los primeros quince días hábiles de su vigencia", "En los últimos quince días hábiles del año anterior", "En los noventa días calendario luego del cierre", "En los primeros treinta días continuos del semestre"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la segmentación separa los elementos en grupos:", "o": ["Homogéneos a lo interno y heterogéneos entre sí", "Heterogéneos a l }, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la verificación de identidad no presencial puede corroborarse con bases de datos públicas o fuentes confiables e independientes.", "a": true, "e": "Art. 40."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, respecto de los casos investigados o reportados, los auditores:", "o": ["No pueden tener acceso a esa información", "Tienen acceso pleno para elaborar su informe", "Acceden solo con la autorización del cliente", "Acceden solo si el caso ya está archivado"], "a": 0, "e": "Arts. 83 y 84."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los familiares cercanos y estrechos colaboradores de una PEP entran en la categoría de alto riesgo.", "a": true, "e": "Art. 37.1.b."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el umbral de transacción ocasional que activa los procesos de debida diligencia es superior a:", "o": ["1.000 euros", "15.000 euros", "10.000 dólares", "1.500 dólares"], "a": 0, "e": "Art. 40. Trampa: 15.000 es el umbral general del GAFI y 10.000 dólares el de la LOCDOFT."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una plataforma extranjera autorizada que opera desde Venezuela y cuya regla de origen es más estricta debe:", "o": ["Aplicar la providencia y añadir la regla más estricta", "Aplicar solamente la regla de su país de origen", "Aplicar solamente la norma venezolana vigente", "Elegir libremente cuál de las dos reglas seguir"], "a": 0, "e": "Art. 2: se suman las medidas más estrictas de la jurisdicción de origen."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un pronunciamiento desfavorable del auditor puede dar lugar a una inspección especial de SUNACRIP.", "a": true, "e": "Art. 87."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, SUNACRIP impone a todos los sujetos una única herramienta obligatoria para evaluar riesgos.", "a": false, "e": "Art. 32: el sujeto aplica la metodología que considere conveniente."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, las estadísticas de alertas y casos del área operativa deben emitirse con frecuencia:", "o": ["Mensual", "Trimestral", "Semestral", "Anual"], "a": 0, "e": "Art. 20.10. No confundir con los informes trimestrales del oficial."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las claves públicas, direcciones o cuentas del cliente forman parte de su expediente.", "a": true, "e": "Art. 50."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un activo virtual se define como una representación digital de valor que:", "o": ["Se comercializa o transfiere digitalmente para pago o inversión", "Representa digitalmente una moneda de curso legal del país", "Solo puede ser emitida por un ente del Estado venezolano", "Debe tener siempre respaldo en un activo físico verificable"], "a": 0, "e": "Art. 4.a: excluye las representaciones digitales de monedas fiduciarias."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para reportar no se requiere certeza de que se trata de una actividad delictiva.", "a": true, "e": "Art. 92."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Informe Anual de prevención se remite a la UNIF y a SUNACRIP dentro de:", "o": ["Noventa días calendario luego del cierre anual", "Sesenta días continuos luego del cierre anual", "Treinta días hábiles luego del cierre anual", "Quince días hábiles luego del cierre anual"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida sufrida por el sujeto obligado debido a la conducta de un relacionado que influye sobre él es riesgo:", "o": ["De contagio", "Legal", "Residual", "Inherente"], "a": 0, "e": "Art. 4.s."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las señales de alerta son indicadores cualitativos y cuantitativos de comportamientos atípicos de variables definidas por el sujeto.", "a": true, "e": "Art. 4.aa."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los clientes no residentes figuran entre los factores de alto riesgo enunciados.", "a": true, "e": "Art. 37.1.e."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la debida diligencia que corresponde a un cliente de riesgo alto es:", "o": ["Intensificada", "Mejorada", "Estándar", "Reducida"], "a": 0, "e": "Art. 45."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un saldo en bolívares mostrado en la aplicación de un banco es un activo virtual porque es una representación digital.", "a": false, "e": "Art. 4.a: no incluye representaciones digitales de monedas fiduciarias."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Programa Anual de Capacitación está dirigido a:", "o": ["Todo el personal, directivos, ejecutivos y autorizados", "Solo al oficial de cumplimiento y a su suplente", "Solo a los empleados del área de tecnología", "Solo a los trabajadores de nuevo ingreso"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, las directrices se vinculan especialmente con la Recomendación del GAFI:", "o": ["15, sobre nuevas tecnologías", "10, sobre debida diligencia", "20, sobre reporte sospechoso", "28, sobre supervisión APNFD"], "a": 0, "e": "Providencia 054-2022, que difunde la Circular UNIF-DDG-DSU-03078."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, como medida de debida diligencia, el sujeto puede rastrear y registrar:", "o": ["Las direcciones IP de los equipos del cliente", "Las contraseñas personales usadas por el cliente", "Las conversaciones privadas del cliente en redes", "Las claves privadas de las billeteras de terceros"], "a": 0, "e": "Arts. 40 y 45.3."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el intermediario de una cadena de transferencias también debe reportar operaciones sospechosas y congelar cuando corresponda.", "a": true, "e": "Art. 43."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las billeteras destinadas al pago de nómina quedan exceptuadas de verificación si los datos los da oficialmente el patrono.", "a": true, "e": "Art. 54."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los documentos de una persona jurídica constituida en el exterior deben estar:", "o": ["Legalizados o apostillados, según corresponda", "Traducidos y publicados en la Gaceta Oficial", "Registrados previamente ante la UNIF del país", "Certificados por la casa de intercambio matriz"], "a": 0, "e": "Art. 48.c2."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los registros que comprueban las operaciones deben conservarse por un mínimo de:", "o": ["Cinco años", "Diez años", "Tres años", "Quince años"], "a": 0, "e": "Arts. 31.13 y 61."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el beneficiario final de un cliente persona jurídica es:", "o": ["La persona natural que en definitiva lo posee o controla", "La persona jurídica que figura como accionista directo", "El representante legal que firmó la apertura de cuenta", "El apoderado que opera diariamente la billetera virtual"], "a": 0, "e": "Art. 4.d.1."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, una evaluación de riesgos debe permanecer a disposición de SUNACRIP para las revisiones que considere necesarias.", "a": true, "e": "Arts. 30 y 34."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, aprobada la excepción, las funciones del oficial las asume adicionalmente:", "o": ["El socio, accionista o directivo de mayor jerarquía", "El empleado con menor antigüedad en la empresa", "El auditor independiente que haya sido contratado", "Un funcionario designado por la superintendencia"], "a": 0, "e": "Art. 22."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la información de una fuente creíble tiene efectos de ley y determina automáticamente que un caso es de mayor riesgo.", "a": false, "e": "Art. 4.i: no tiene efectos de ley ni es determinación automática."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación en la que se omite una de las fases del procedimiento establecido se considera:", "o": ["No convencional", "En tránsito", "Estructurada", "Ocasional"], "a": 0, "e": "Art. 4.o."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la regla de información en transferencias se aplica a montos mayores a:", "o": ["1.000 euros o su equivalente", "1.000 dólares sin equivalente", "10.000 dólares o su equivalente", "15.000 euros o su equivalente"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "La norma de SUNACRIP sobre riesgos LC/FT/FPADM de los proveedores de activos virtuales se publicó en:", "o": ["G.O. 42.110 del 21-04-2021", "G.O. 41.575 del 30-01-2019", "G.O. 41.522 del 12-11-2018", "G.O. 39.912 del 30-04-2012"], "a": 0, "e": "La 41.575 es el Decreto Constituyente de criptoactivos, la 41.522 el decreto de la UNIF y la 39.912 la LOCDOFT."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, además de la dirección de la billetera, debe recabarse información que permita asociarla a una persona real.", "a": true, "e": "Art. 61.c."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los riesgos asociados que enumera la norma son:", "o": ["Reputacional, legal, operativo y de contagio", "Crediticio, de mercado, de liquidez y de tasa", "Soberano, cambiario, de volatilidad y de custodia", "Técnico, de suscripción, de reservas y de reaseguro"], "a": 0, "e": "Art. 4.r."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el análisis, control y detección de operaciones sospechosas está a cargo de:", "o": ["El área operativa que maneja las plataformas y sistemas", "La auditoría independiente contratada por la junta", "La unidad de atención al cliente de cada sucursal", "La gerencia de mercadeo y de relaciones públicas"], "a": 0, "e": "Art. 19."}]}, {"titulo": "Normativa prudencial del sector y sus  0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno l onas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["E  0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su póliza se anula automáticamente", "Su prima debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Que la empresa conozca el propósito de la relación con el cliente permite:", "o": ["Detectar después lo que no encaja con ese propósito", "Ofrecerle productos adicionales de la cartera", "Reducir el plazo de emisión de la póliza", "Justificar un aumento de la prima"], "a": 0, "e": "El propósito es la vara para medir lo inusual."}, {"t": "mc", "q": "Una medida típica de la debida diligencia intensificada es:", "o": ["Verificar el origen de los fondos y de la riqueza", "Solicitar una copia adicional de la cédula de identidad", "Cobrar una prima más elevada", "Reduc eso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}]}, {"titulo": "Enfoque basado en riesgo · modelo 2", "q": [{"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "mc", "q": "Lo contrario del enfoque basado en riesgo es un enfoque:", "o": ["De cumplimiento uniforme y formalista", "De supervisión consolidada", "De debida diligencia continua para toda la cartera", "De gestión por procesos"], "a": 0, "e": "El modelo de «misma medida para todos» desperdicia recursos."}, {"t": "vf", "q": "El sistema de administración de riesgos debe combinar controles preventivos, detectivos y correctivos.", "a": true, "e": "Las tres capas se complementan."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "In
