datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "mc", "q": "La evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "vf", "q": "Según el GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según el GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "El «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de servicios"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "Un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Son nuevas y aún no están reguladas por ley", "Son costosas para las instituciones financieras", "Son ilegales en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "En una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según el GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "mc", "q": "Las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "Según el GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "vf", "q": "Según el GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Según el GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según el GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Según el GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según el GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según el GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según el GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "vf", "q": "Según el GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según el GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}]}]}, {"titulo": "Normativa prudencial del sector y sus guías", "exams": [{"titulo": "Normativa prudencial del sector y sus guías · modelo 1", "q": [{"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la investigación previa a la denuncia contra un empleado la realiza el oficial de cumplimiento.", "a": false, "e": "Art. 64: la gerencia de seguridad o unidad equivalente. Trampa: se cambia el sujeto."}, {"t": "vf", "q": "Según la Circular UNIF 03889 de 2023, la evaluación de riesgos del sector debe considerar amenazas de seguridad cibernética como el ransomware.", "a": true, "e": "Numeral 7."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación cuya cuantía no guarda relación con la actividad económica y el perfil del cliente es:", "o": ["Inusual", "En tránsito", "Convencional", "Simplificada"], "a": 0, "e": "Art. 4.n."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la información de la regla de viaje puede transmitirse por un canal distinto de la cadena de bloques si es efectivo, inmediato y seguro.", "a": true, "e": "Art. 42."}, {"t": "vf", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, un cliente que opera con una fintech sin autorización del ente de control presenta una señal de alerta.", "a": true, "e": "Sección de señales de alerta."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, ante un programa estatal de inclusión, la cédula laminada como único requisito se compensa principalmente con:", "o": ["Monitoreo de las billeteras y de sus transacciones", "Una declaración notariada de cada nuevo participante", "Una visita domiciliaria a la totalidad de los clientes", "Un límite fijo de un euro por cada operación diaria"], "a": 0, "e": "Art. 60."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un manual copiado de otra casa de intercambio cumple la norma si está aprobado por la junta directiva.", "a": false, "e": "Art. 30: debe diseñarse según las características propias y una evaluación previa de riesgos."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para reportar no se requiere certeza de que se trata de una actividad delictiva.", "a": true, "e": "Art. 92."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la falsedad de los datos de un cliente se descubre durante la aceptación y, en otro caso, después de prestado el servicio. Corresponde:", "o": ["Negar el servicio; y luego analizar y reportar", "Reportar en ambos casos sin más análisis", "Negar el servicio en ambos casos solamente", "Aceptar y corregir los datos en ambos casos"], "a": 0, "e": "Arts. 55 y 56."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el intermediario de una cadena de transferencias debe transmitir la información del originador y del beneficiario, pero no necesita conservar registro.", "a": false, "e": "Art. 42: debe mantener su registro. Trampa: la primera mitad es correcta."}, {"t": "mc", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, la creación de desarrollos financieros descentralizados sin Conozca a su Cliente se identifica como:", "o": ["Un riesgo del ecosistema fintech", "Un control interno recomendado", "Una excepción al reporte a la UNIF", "Una modalidad de auditoría interna"], "a": 0, "e": "Sección de riesgos."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la información de una fuente creíble tiene efectos de ley y determina automáticamente que un caso es de mayor riesgo.", "a": false, "e": "Art. 4.i: no tiene efectos de ley ni es determinación automática."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si SUNACRIP considera deficiente el informe del auditor, puede exigir al sujeto obligado que cambie de auditor.", "a": true, "e": "Art. 86. Trampa: en seguros se exige una nueva auditoría."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un analista invoca la Resolución 083.18 para exigir controles a una casa de intercambio. El error es que esa resolución:", "o": ["Rige al sector bancario, no al de activos virtuales", "Fue dictada por la propia SUNACRIP en el año 2021", "Solo es aplicable a las fintech sin licencia vigente", "Regula únicamente a los cajeros de activos virtuales"], "a": 0, "e": "Art. 2: el sujeto obligado de criptoactivos se rige por la norma de SUNACRIP."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una alerta individual en la plataforma de un exchange obliga, por sí misma, a:", "o": ["Aumentar el control y evaluar si reportar", "Presentar de inmediato un RAS a la UNIF", "Suspender la billetera sin notificación", "Comunicar el caso a SUNACRIP en 72 horas"], "a": 0, "e": "Art. 71.2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un saldo en bolívares mostrado en la aplicación de un banco es un activo virtual porque es una representación digital.", "a": false, "e": "Art. 4.a: no incluye representaciones digitales de monedas fiduciarias."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los propietarios y operadores de cajeros automáticos de activos virtuales son sujetos obligados.", "a": true, "e": "Art. 2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las claves públicas, direcciones o cuentas del cliente forman parte de su expediente.", "a": true, "e": "Art. 50."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, basta con que el sujeto obligado tenga los controles por escrito, sin necesidad de demostrar que los aplica.", "a": false, "e": "Art. 3: debe demostrar que los ha implementado cuando se le requiera."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los informes del oficial a la junta y las estadísticas del área operativa tienen, respectivamente, frecuencia:", "o": ["Trimestral y mensual", "Mensual y trimestral", "Semestral y mensual", "Anual y semestral"], "a": 0, "e": "Arts. 13.5, 17.5 y 20.10."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, SUNACRIP impone a todos los sujetos una única herramienta obligatoria para evaluar riesgos.", "a": false, "e": "Art. 32: el sujeto aplica la metodología que considere conveniente."}, {"t": "vf", "q": "Según la ": true, "e": "Art. 43."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial descarta una alerta tras analizarla. Debe:", "o": ["Dejar constancia en un informe de sus razones", "Borrarla para no afectar el perfil del cliente", "Remitirla a la UNIF como reporte preventivo", "Comunicar la decisión al cliente afectado"], "a": 0, "e": "Art. 17.10."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la designación del nuevo oficial, en caso de falta absoluta, debe hacerse dentro de treinta días continuos contados desde:", "o": ["La declaratoria de la falta por el presidente", "El inicio de la ausencia temporal del oficial", "El vencimiento de los sesenta días de ausencia", "La notificación de la falta a SUNACRIP"], "a": 0, "e": "Art. 18. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el SIAR debe estar soportado en soluciones informáticas que permitan el análisis de grandes volúmenes de datos.", "a": true, "e": "Art. 6."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para los documentos que acreditan una operación, el lapso de conservación corre desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión de un RAS a la UNIF", "La última revisión del expediente"], "a": 0, "e": "Art. 61.2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, en una transferencia de más de 1.000 euros basta incluir el nombre del originador y del beneficiario.", "a": false, "e": "Art. 41: también billetera o referencia única, y dirección, identidad o fecha y lugar de nacimiento del originador. Trampa: se recorta el contenido."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, cada miembro de la junta directiva debe asumir, en forma individual y por escrito:", "o": ["El Compromiso Institucional", "La Declaración de Conocimiento", "La Ficha de Identificación", "La Declaración de Origen"], "a": 0, "e": "Arts. 13.6 y 29."}, s billeteras, constituye:", "o": ["Una transacción estructurada", "Una operación en tránsito", "Una operación convencional", "Una custodia compartida"], "a": 0, "e": "Art. 4.dd."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los factores de alto riesgo enunciados conllevan la necesidad de aplicar debida diligencia intensificada.", "a": true, "e": "Art. 37."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, declarada la falta absoluta del oficial, el nuevo debe designarse dentro de:", "o": ["Treinta días continuos", "Diez días hábiles", "Sesenta días continuos", "Cinco días hábiles"], "a": 0, "e": "Art. 18. Trampa: en otros sectores el plazo difiere."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una empresa que, para otros y como conducta empresarial, custodia claves privadas de clientes es:", "o": ["Proveedor de servicios de activos virtuales", "Un simple usuario ocasional del sistema", "Un sujeto no alcanzado por la providencia", "Una institución bancaria especializada"], "a": 0, "e": "Art. 2: custodia o control de claves privadas de otra persona."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el nivel de riesgo propio de la actividad, sin considerar el efecto de los controles, es el riesgo:", "o": ["Inherente", "Residual", "De contagio", "Operacional"], "a": 0, "e": "Art. 4.u."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, SUNACRIP puede sancionar la emisión de reportes incompletos o evaluados deficientemente.", "a": true, "e": "Art. 93."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un indicador de alerta equivale, sin más, a la obligación automática de presentar un RAS.", "a": false, "e": "Art. 71.2: da lugar a mayor control; el reporte procede cuando corresponda."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, si la falsedad se descubre después de prestado el servicio, el oficial debe analizar el caso y, si procede:", "o": ["Reportarlo a la UNIF in }, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el POA, elaborado en el último trimestre del año anterior, debe estar a disposición de SUNACRIP dentro de los primeros:", "o": ["Quince días hábiles del año", "Quince días continuos del año", "Treinta días hábiles del año", "Diez días hábiles del año"], "a": 0, "e": "Art. 23. Trampa: se cambia el número o la unidad."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el área operativa puede fijar listas de exceptuados de las alertas con base en el conocimiento razonable del cliente.", "a": true, "e": "Art. 20.6."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el secreto profesional puede oponerse a las solicitudes de información de las autoridades competentes.", "a": false, "e": "Art. 90.2."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el riesgo inherente de un activo virtual se incrementa cuando sus características conllevan exposición a:", "o": ["Anonimizadores del protocolo de internet", "Auditorías anuales de sus operaciones", "Registros públicos de su emisión total", "Controles de identidad de sus usuarios"], "a": 0, "e": "Art. 37.5."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las mejores prácticas internacionales deben aplicarse aunque colidan con la normativa nacional vigente.", "a": false, "e": "Art. 7: sirven de pauta siempre que no colidan con la norma nacional."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para un Reporte de Actividades Sospechosas, el lapso de conservación corre desde:", "o": ["Su remisión a la UNIF", "La detección de la alerta", "El cierre del ejercicio", "El fin de la relación"], "a": 0, "e": "Art. 61.3."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la junta directiva debe aprobar anualmente una partida presupuestaria específica e identificable para la prevención.", "a": true, "e": "Art. 13.3."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las auditorías al programa de cumplimiento deben efectuarse cada dos años.", "a": false, "e": "Art. 83: anualmente. Trampa: se cambia la frecuencia."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la debida diligencia que corresponde a un cliente de riesgo bajo es:", "o": ["Estándar", "Mejorada", "Intensificada", "Ampliada"], "a": 0, "e": "Art. 45. Trampa: en seguros el riesgo bajo admite simplificada."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el compromiso institucional lo asumen tanto los miembros principales como los suplentes de la junta directiva.", "a": true, "e": "Art. 29. Trampa: se suele excluir a los suplentes."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las señales de alerta son indicadores cualitativos y cuantitativos de comportamientos atípicos de variables definidas por el sujeto.", "a": true, "e": "Art. 4.aa."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial estará ausente setenta días continuos por enfermedad. Conforme a la norma:", "o": ["Se considera falta absoluta y hay 30 días para designar", "Sigue siendo falta temporal al ser justificada", "Se considera falta absoluta y hay 10 días para designar", "Se considera falta temporal y hay 60 días para designar"], "a": 0, "e": "Art. 18: más de sesenta días continuos; treinta días continuos para designar."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, en los procesos estatales de inclusión al Sistema Integral de Criptoactivos, la cédula laminada puede ser el único requisito.", "a": true, "e": "Art. 60. Trampa: parece contradecir la debida diligencia, pero es literal."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para detectar financiamiento al terrorismo, la norma advierte que los fondos pueden:", "o": ["Tener bajo valor y provenir de fuentes legales", "Tener siempre alto valor y un origen ilícito", "Transferirse solo mediante cuentas bancarias", "Provenir únicamente del tráfico de drogas"], "a": 0, "e": "Art. 77."}, {"t": "mc", "q": "Según la Circular UNIF 03889 de 2023, dentro de las Recomendaciones del GAFI están, entre otros, los servicios de cambio de activos virtuales, mientras que fuera se ubican:", "o": ["Los validadores y los mineros", "Los monederos de activos virtuales", "Las plataformas de negociación", "Los proveedores de ofertas iniciales"], "a": 0, "e": "Numeral 4."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para ofrecer servicios con activos virtuales en o desde Venezuela, el sujeto obligado debe contar con:", "o": ["Autorización o licencia otorgada por SUNACRIP", "Inscripción previa ante la UNIF únicamente", "Autorización del Banco Central de Venezuela", "Registro mercantil, sin ningún otro requisito"], "a": 0, "e": "Art. 2, último aparte."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para evitar sanciones, el sujeto obligado debe emitir un RAS ante cualquier duda, aunque no esté documentado.", "a": false, "e": "Art. 93: deben minimizarse los falsos positivos; se sancionan los reportes incompletos o mal evaluados. Trampa: se invierte el objetivo."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la apertura injustificada de una nueva billetera por un cliente ya vinculado exige medidas mejoradas o intensificadas.", "a": true, "e": "Art. 57.2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, aplicar medidas simplificadas está permitido incluso cuando existe sospecha de LC/FT/FPADM, si el monto es bajo.", "a": false, "e": "Art. 35."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las decisiones del oficial de cumplimiento obligan a todas las unidades desde que él las adopta.", "a": false, "e": "Art. 16: obligan una vez aprobadas por la junta directiva. Trampa: se suprime la condición."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un factor de riesgo propio de este sector, además de clientes, productos, canales y tecnologías, es:", "o": ["El tipo de activo virtual involucrado en la operación", "La capitalización bursátil de la empresa supervisada", "El número de sucursales físicas que tenga el sujeto", "La antigüedad de los miembros de su junta directiva"], "a": 0, "e": "Art. 4.f."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el universo de clientes debe evaluarse globalmente cada veinticuatro meses.", "a": false, "e": "Art. 46, num. 1: cada doce meses. Trampa: se cambia el período."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay indicios de que un empleado cometió un delito en el marco de su trabajo, basta un RAS a la UNIF, sin denuncia penal.", "a": false, "e": "Art. 64: hay obligación de denunciar, previa averiguación de la gerencia de seguridad. Trampa: se cambia el cauce."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una falla de seguridad o un plan de contingencia desactualizado se vincula principalmente con el riesgo:", "o": ["Operacional", "De contagio", "De reputación", "Residual"], "a": 0, "e": "Art. 4.w."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, las políticas del sujeto obligado deben exigir que funcionarios y empleados antepongan:", "o": ["El cumplimiento en materia de riesgos a las metas comerciales", "Las metas comerciales a los controles de menor importancia", "La captación de clientes a la verificación de identidad", "La velocidad de cada operación al análisis de las alertas"], "a": 0, "e": "Art. 9.c."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, corresponde al sujeto obligado determinar el tipo de actividad criminal que realiza el cliente antes de reportar.", "a": false, "e": "Art. 77.7."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, al recibir un pago, se confirma que el beneficiario figura en una lista de la ONU. La reacción correcta es:", "o": ["Congelar sin demora e informar a la UNIF", "Devolver los fondos a su originador", "Ejecutar la operación y reportar luego", "Pedir antes autorización a un juez"], "a": 0, "e": "Art. 41."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, hay financiamiento al terrorismo aunque los fondos recolectados no hayan llegado a utilizarse.", "a": true, "e": "Art. 4.g."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la evaluación anual del nivel de riesgo del sujeto obligado se efectúa:", "o": ["Durante el último trimestre del ejercicio", "Dentro de 60 días después del cierre", "Durante el primer trimestre del año", "Dentro de 90 días después del cierre"], "a": 0, "e": "Art. 34. Trampa: en seguros la autoevaluación se remite sesenta días después del cierre."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el Manual de Administración de Riesgos debe elaborarse necesariamente en formato físico.", "a": false, "e": "Art. 30: físico o digital. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación ocasional de 900 euros no genera ninguna duda sobre el cliente. Respecto del umbral:", "o": ["No se activa, por no superar 1.000 euros", "Se activa, por superar los 500 euros", "Se activa siempre con activos virtuales", "No se activa, por no llegar a 15.000 euros"], "a": 0, "e": "Art. 40; con dudas sobre la veracidad sí procede aunque no llegue al umbral."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el informe anual de prevención se remite a:", "o": ["La UNIF y SUNACRIP, en 90 días calendario", "SUNACRIP solamente, en 60 días hábiles", "La ONCDOFT y la UNIF, en 45 días continuos", "La UNIF solamente, en 30 días calendario"], "a": 0, "e": "Art. 84."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el informe de ejecución del POA se elabora por lo menos cada semestre.", "a": false, "e": "Art. 25: por lo menos cada trimestre. Trampa: se cambia la frecuencia."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de una casa de intercambio pretende reportar directo al presidente, un nivel por debajo de él. Sobre ese esquema:", "o": ["La posición es correcta, pero reporta a la junta", "La posición y el reporte son correctos", "Debe ubicarse al mismo nivel y reportar a él", "Debe ubicarse dos niveles abajo y reportar a él"], "a": 0, "e": "Art. 15: un nivel por debajo del presidente y reporta a la junta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si solo un sujeto obligado interviene en la transferencia, debe cumplir la regla respecto de su propio cliente.", "a": true, "e": "Art. 41."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un cliente pide fraccionar una transferencia simple en varias etapas sin razón aparente. Lo que hace compleja la operación es:", "o": ["La orden del cliente que complica una transacción simple", "El tipo de activo virtual que se decidió utilizar", "El monto total, siempre superior al umbral fijado", "El hecho de que intervenga un empleado nuevo"], "a": 0, "e": "Art. 4.l."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un empleado detecta falsedad en los datos de un nuevo cliente durante la debida diligencia. Debe:", "o": ["Negar el servicio e informar a su supervisor inmediato", "Prestar el servicio e informar al final del trimestre", "Comunicárselo a la UNIF de forma directa y personal", "Corregir por sí mismo los datos en la ficha del cliente"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los clientes no residentes figuran entre los factores de alto riesgo enunciados.", "a": true, "e": "Art. 37.1.e."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación en la que se omite una de las fases del procedimiento establecido se considera:", "o": ["No convencional", "En tránsito", "Estructurada", "Ocasional"], "a": 0, "e": "Art. 4.o."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida por incumplir normas o prácticas prescritas de cualquier jurisdicción donde se opera es riesgo:", "o": ["Legal", "De reputación", "De contagio", "Residual"], "a": 0, "e": "Art. 4.v."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un exchange usa un mezclador porque, según afirma, sus clientes lo piden por privacidad. Esa prestación:", "o": ["Está prohibida", "Se permite con diligencia intensificada", "Se permite por debajo del umbral", "Se permite con aval de la junta"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "La norma de SUNACRIP sobre riesgos LC/FT/FPADM de los proveedores de activos virtuales se publicó en:", "o": ["G.O. 42.110 del 21-04-2021", "G.O. 41.575 del 30-01-2019", "G.O. 41.522 del 12-11-2018", "G.O. 39.912 del 30-04-2012"], "a": 0, "e": "La 41.575 es el Decreto Constituyente de criptoactivos, la 41.522 el decreto de la UNIF y la 39.912 la LOCDOFT."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay indicios de que el cliente no actúa por cuenta propia, el sujeto debe:", "o": ["Pedir el poder y conocer por cuenta de quién actúa", "Negar el servicio y publicar la situación del caso", "Aceptar la operación sin solicitar otros recaudos", "Pedir autorización al originador de los fondos"], "a": 0, "e": "Art. 49."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida originada por la opinión negativa que afecta la imagen del sujeto obligado es riesgo:", "o": ["De reputación", "Legal", "Operacional", "Inherente"], "a": 0, "e": "Art. 4.x."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, si un sujeto no puede mitigar adecuadamente el riesgo de tecnologías que favorecen el anonimato, debe:", "o": ["No involucrarse en esas actividades", "Reportar cada una de ellas a la UNIF", "Aumentar la comisión que cobra al cliente", "Pedir al cliente una declaración jurada"], "a": 0, "e": "Art. 33."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 3", "q": [{"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sistema de administración de riesgos que deben implantar los sujetos obligados se denomina:", "o": ["SIAR LC/FT/FPADM", "SARLAFT de activos virtuales", "SIPAR de criptoactivos", "SICAD LC/FT/FPADM"], "a": 0, "e": "Art. 6. SARLAFT es colombiano y SIPAR nicaragüense."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, se pueden mantener billeteras virtuales anónimas si el cliente opera por debajo del umbral.", "a": false, "e": "Art. 39."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el umbral de transacción ocasional que activa los procesos de debida diligencia es superior a:", "o": ["1.000 euros", "15.000 euros", "10.000 dólares", "1.500 dólares"], "a": 0, "e": "Art. 40. Trampa: 15.000 es el umbral general del GAFI y 10.000 dólares el de la LOCDOFT."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida sufrida por el sujeto obligado debido a la conducta de un relacionado que influye sobre él es riesgo:", "o": ["De contagio", "Legal", "Residual", "Inherente"], "a": 0, "e": "Art. 4.s."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una transacción ocasional de 400 euros genera dudas sobre la veracidad de los datos del cliente. Procede:", "o": ["Aplicar debida diligencia aunque no se alcance el umbral", "No hacer nada, porque no supera el umbral exigido", "Cerrar la operación y avisar de ello al propio cliente", "Esperar a que se acumulen operaciones por 1.000 euros"], "a": 0, "e": "Arts. 40 y 44."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, en una transferencia sin cuenta ni billetera, la información debe incluir un número único de referencia que permita rastrearla.", "a": true, "e": "Art. 41, lit. b. Trampa: se cree que sin billetera no hay dato que incluir."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay sospecha de LC/FT/FPADM, se identifica y verifica al cliente y al beneficiario final aunque no se alcance el umbral.", "a": true, "e": "Art. 44. Trampa: se cree que el umbral siempre manda."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un auditor quiere revisar los reportes enviados a la UNIF para probar la calidad del programa. Debe saber que:", "o": ["No puede acceder a casos investigados o reportados", "Puede acceder solo con la firma del oficial", "Puede acceder si guarda secreto profesional", "Puede acceder solo a los archivados sin reporte"], "a": 0, "e": "Arts. 83 y 84."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado que crea poder cumplir sin oficial de cumplimiento puede prescindir de él con solo notificarlo a SUNACRIP.", "a": false, "e": "Art. 21: debe presentar las justificaciones para su revisión y aprobación. Trampa: se convierte una solicitud en un aviso."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la política de aceptación no debe ser tan restrictiva que niegue el acceso del público en general a los servicios.", "a": true, "e": "Art. 39."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, SUNACRIP pide datos de un cliente el lunes a las 9:00. El sujeto debe poder obtenerlos, a más tardar:", "o": ["El jueves a las 9:00", "El martes a las 9:00", "El miércoles a las 9:00", "El lunes siguiente"], "a": 0, "e": "Art. 62: no mayor de setenta y dos horas."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, se permite mantener billeteras virtuales innominadas si se aplica debida diligencia intensificada.", "a": false, "e": "Art. 39: están prohibidas las billeteras anónimas, innominadas o ficticias. Trampa: se agrega una excepción."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, cada vez que se imparte capacitación, directivos y trabajadores suscriben individualmente:", "o": ["La Declaración de Conocimiento", "El Compromiso Institucional", "La Ficha de Identificación", "El Formato de Origen de Fondos"], "a": 0, "e": "Art. 68."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una organización sin fines de lucro dedicada habitualmente a recolectar fondos se considera cliente de riesgo:", "o": ["Alto", "Bajo", "Moderado", "Nulo"], "a": 0, "e": "Art. 37.1.a."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un cliente de alto riesgo inicial mantiene por largo tiempo transacciones bajas. La norma:", "o": ["Permite tratarlo como de menor riesgo", "Obliga a mantenerlo en alto indefinidamente", "Obliga a terminar la relación comercial", "Permite excluirlo de todo monitoreo"], "a": 0, "e": "Art. 38.2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la ejecución del Plan Operativo Anual debe ser flexible ante los cambios en los factores de riesgo.", "a": true, "e": "Art. 23."}, {"t": "vf", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, las fintech solo interesan al sector bancario y no alcanzan a seguros, valores o APNFD.", "a": false, "e": "La norma señala que su uso es transversal."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las medidas simplificadas para entes públicos siguen siendo aplicables aunque exista sospecha de LC/FT/FPADM sobre la operación.", "a": false, "e": "Arts. 35 y 47."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la providencia permite identificar a los clientes de forma remota si el sistema es idóneo, confiable, independiente y auditable.", "a": true, "e": "Art. 47. Trampa: se cree que la identificación no presencial está prohibida."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado que sirve de escala entre el origen y el destino de una operación realiza una operación:", "o": ["En tránsito", "No convencional", "Estructurada", "Compleja"], "a": 0, "e": "Art. 4.m."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un medio publica que un cliente es investigado por delitos graves. La consecuencia inmediata es que:", "o": ["Se notifica a la UNIF, sin RAS automático", "Se genera un RAS automático a la UNIF", "Se cierra de inmediato su billetera", "Se ignora si no existe orden judicial"], "a": 0, "e": "Art. 94."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado debe poder obtener cualquier información requerida en un plazo no mayor de:", "o": ["Setenta y dos horas", "Cuarenta y ocho horas", "Cinco días hábiles", "Diez días continuos"], "a": 0, "e": "Art. 62."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la verificación de identidad no presencial puede corroborarse con bases de datos públicas o fuentes confiables e independientes.", "a": true, "e": "Art. 40."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la recepción de una solicitud de información de una autoridad obliga a emitir un RAS automático sobre el investigado.", "a": false, "e": "Art. 100: solo se reporta si el análisis revela indicios. Trampa: se convierte en automático."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial debe evaluar los nuevos productos con activos virtuales antes de su lanzamiento.", "a": true, "e": "Art. 17.13."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los entes del sector público pueden recibir medidas simplificadas por ser considerados factores de bajo riesgo.", "a": true, "e": "Art. 47."}, {"t": "mc", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, el centro para la recepción y análisis de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La SUNACRIP", "La ONCDOFT", "El Ministerio Público"], "a": 0, "e": "Sección de reportes y Recomendación 29 del GAFI."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una transacción por internet sin presencia física de las partes representa un factor de alto riesgo por:", "o": ["Canal de distribución", "Actividad económica", "Zona geográfica", "Perfil de empleado"], "a": 0, "e": "Art. 37.3.a."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el resultado de la evaluación anual de riesgo debe remitirse obligatoriamente a SUNACRIP.", "a": false, "e": "Art. 34: permanece a disposición de SUNACRIP para inspecciones o cuando lo solicite. Trampa: se cambia conservar por remitir."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, al sospechar de un cliente, pedirle datos adicionales es improcedente si con ello se le alerta de la investigación.", "a": true, "e": "Art. 46.5."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, se prohíbe prestar servicios con activos virtuales a niños, niñas y adolescentes.", "a": false, "e": "Art. 57: se permite con debida diligencia mejorada o intensificada. Trampa: una precaución se convierte en prohibición."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las relaciones de larga duración con contacto frecuente presentan, en principio, menos riesgos.", "a": true, "e": "Art. 38.3."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, cuando resulte esencial no interrumpir el negocio, la verificación de identidad puede completarse:", "o": ["Tan pronto como sea razonablemente factible", "Dentro de los treinta días siguientes", "Al cierre del ejercicio económico", "En la siguiente evaluación anual"], "a": 0, "e": "Art. 54. Trampa: la norma no fija un plazo en días."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, una evaluación de riesgos debe permanecer a disposición de SUNACRIP para las revisiones que considere necesarias.", "a": true, "e": "Arts. 30 y 34."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para documentos de identificación del cliente, el lapso de conservación se cuenta desde:", "o": ["El día en que finaliza la relación", "El día en que se abrió la cuenta", "El cierre del ejercicio económico", "La fecha de la última inspección"], "a": 0, "e": "Art. 61.1."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una empresa, tras evaluar su tamaño, quiere prescindir del oficial. Si SUNACRIP acepta la excepción, sus funciones las asume:", "o": ["El socio, accionista o directivo de mayor jerarquía", "El auditor interno o quien haga sus veces", "El presidente del área operativa designada por ella", "Un asesor externo contratado por la junta"], "a": 0, "e": "Arts. 21 y 22."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los informes de gestión del oficial de cumplimiento ante la junta directiva son:", "o": ["Trimestrales y anuales", "Mensuales y semestrales", "Semestrales únicamente", "Anuales únicamente"], "a": 0, "e": "Arts. 13.5 y 17.5."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la huella dactilar del pulgar o índice derecho se exige a quienes usan servicios por medio de:", "o": ["Canales físicos de distribución (taquillas)", "Aplicaciones móviles del sujeto obligado", "Cualquier canal digital o presencial", "Cajeros automáticos inteligentes"], "a": 0, "e": "Art. 59. Trampa: se amplía a canales que la norma no menciona."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para que exista sospecha debe estar probado que los fondos tienen origen delictivo.", "a": false, "e": "Art. 4.bb y 92: la sospecha es un criterio fundado en indicios y en la experiencia."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la Tesorería de Criptoactivos de Venezuela queda fuera del ámbito de la norma por ser un ente público.", "a": false, "e": "Art. 2: la norma la nombra expresamente entre los sujetos obligados."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, NO es una de las actividades que definen al proveedor de servicios de activos virtuales:", "o": ["Comprar criptoactivos con recursos propios para sí", "Intercambiar activos virtuales y moneda fiduciaria", "Transferir activos virtuales en nombre de otro", "Custodiar activos virtuales de una tercera persona"], "a": 0, "e": "Art. 2: la actividad debe realizarse para o en nombre de otro."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, quien solo otorga financiamiento con recursos propios representados en activos virtuales:", "o": ["No debe establecer SIAR, pero sí suministrar información", "Debe establecer un SIAR completo igual al de las casas", "Queda exento de suministrar información a la autoridad", "Debe contratar a un oficial de cumplimiento exclusivo"], "a": 0, "e": "Art. 12, último aparte."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Plan Operativo Anual se elabora:", "o": ["Durante el último trimestre del año anterior", "Durante el primer trimestre de su vigencia", "Dentro de los quince días hábiles del año", "Dentro de los treinta días del cierre"], "a": 0, "e": "Art. 23. Trampa: quince días hábiles es el plazo para tenerlo a disposición de SUNACRIP."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si un cliente pide una transferencia con indicios de LC/FT, el trabajador debe ejecutarla y reportar después para no alertarlo.", "a": false, "e": "Art. 96: debe negarle el servicio e informar al oficial. Trampa: la LOCDOFT prohíbe suspender durante una investigación, que es un supuesto distinto."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las decisiones del oficial aprobadas por la junta directiva son de observancia obligatoria para ejecutivos y empleados.", "a": true, "e": "Art. 16."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un pronunciamiento desfavorable del auditor puede dar lugar a una inspección especial de SUNACRIP.", "a": true, "e": "Art. 87."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, en las ausencias temporales del oficial de cumplimiento, designa un suplente:", "o": ["La junta directiva o el órgano equivalente", "El presidente del sujeto obligado", "El propio oficial antes de ausentarse", "SUNACRIP, a solicitud del sujeto obligado"], "a": 0, "e": "Art. 18. Trampa: en seguros el presidente ejerce directamente las funciones."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de cumplimiento se ubica jerárquicamente:", "o": ["Un nivel por debajo del presidente del sujeto", "En el mismo nivel jerárquico del presidente", "Dos niveles por debajo de la gerencia general", "Bajo la dependencia del auditor interno"], "a": 0, "e": "Art. 15.2. Trampa: en la norma de seguros la posición es distinta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de cumplimiento debe estar jerárquicamente un nivel por debajo de la junta directiva.", "a": false, "e": "Art. 15, num. 2: un nivel por debajo del presidente. Trampa: el num. 1 dice que reporta a la junta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un oficial de cumplimiento puede dirigir también el área comercial si dispone de tiempo suficiente.", "a": false, "e": "Art. 15.4: dedicación exclusiva a la prevención y control."}]}]}, {"titulo": "Convenios internacionales: Viena, Palermo, Mérida y otros", "exams": [{"titulo": "Convenios internacionales · modelo 1", "q": [{"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención de Viena de 1988", "Solo la Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "mc", "q": "La «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Solo penalización y extradición", "Solo medidas preventivas del sector público", "Solo la cooperación entre las unidades de inteligencia financiera"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "El migrante no consiente y la finalidad es el cruce de frontera", "La trata exige cruzar una frontera y el tráfico de migrantes no", "El tráfico de migrantes protege a la persona y la trata al Estado"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para un sujeto obligado venezolano es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado en lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las R.3 y R.36 a R.40 del GAFI", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}]}, {"titulo": "Convenios internacionales · modelo 2", "q": [{"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}, {"t": "mc", "q": "Palermo permite, respecto de la carga de la prueba en el decomiso, que los Estados:", "o": ["Consideren exigir al imputado demostrar el origen lícito", "Deban invertir la carga de la prueba en estos delitos", "Presuman ilícito todo bien de un condenado por delito grave", "Trasladen la prueba del origen al Estado requirente"], "a": 0, "e": "Es una posibilidad que la Convención invita a considerar."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "Según los datos del Convenio de 1999 contra la financiación del terrorismo, su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, regist
