e cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según el GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según el GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según el GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "vf", "q": "Según el GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según el GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la investigación previa a la denuncia contra un empleado la realiza el oficial de cumplimiento.", "a": false, "e": "Art. 64: la gerencia de seguridad o unidad equivalente. Trampa: se cambia el sujeto."}, {"t": "vf", "q": "Según la Circular UNIF 03889 de 2023, la evaluación de riesgos del sector debe considerar amenazas de seguridad cibernética como el ransomware.", "a": true, "e": "Numeral 7."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación cuya cuantía no guarda relación con la actividad económica y el perfil del cliente es:", "o": ["Inusual", "En tránsito", "Convencional", "Simplificada"], "a": 0, "e": "Art. 4.n."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la información de la regla de viaje puede transmitirse por un canal distinto de la cadena de bloques si es efectivo, inmediato y seguro.", "a": true, "e": "Art. 42."}, {"t": "vf", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, un cliente que opera con una fintech sin autorización del ente de control presenta una señal de alerta.", "a": true, "e": "Sección de señales de alerta."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, ante un programa estatal de inclusión, la cédula laminada como único requisito se compensa principalmente con:", "o": ["Monitoreo de las billeteras y de sus transacciones", "Una declaración notariada de cada nuevo participante", "Una visita domiciliaria a la totalidad de los clientes", "Un límite fijo de un euro por cada operación diaria"], "a": 0, "e": "Art. 60."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un manual copiado de otra casa de intercambio cumple la norma si está aprobado por la junta directiva.", "a": false, "e": "Art. 30: debe diseñarse según las características propias y una evaluación previa de riesgos."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para reportar no se requiere certeza de que se trata de una actividad delictiva.", "a": true, "e": "Art. 92."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la falsedad de los datos de un cliente se descubre durante la aceptación y, en otro caso, después de prestado el servicio. Corresponde:", "o": ["Negar el servicio; y luego analizar y reportar", "Reportar en ambos casos sin más análisis", "Negar el servicio en ambos casos solamente", "Aceptar y corregir los datos en ambos casos"], "a": 0, "e": "Arts. e Venezuela, el sujeto obligado debe contar con:", "o": ["Autorización o licencia otorgada por SUNACRIP", "Inscripción previa ante la UNIF únicamente", "Autorización del Banco Central de Venezuela", "Registro mercantil, sin ningún otro requisito"], "a": 0, "e": "Art. 2, último aparte."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para evitar sanciones, el sujeto obligado debe emitir un RAS ante cualquier duda, aunque no esté documentado.", "a": false, "e": "Art. 93: deben minimizarse los falsos positivos; se sancionan los reportes incompletos o mal evaluados. Trampa: se invierte el objetivo."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la apertura injustificada de una nueva billetera por un cliente ya vinculado exige medidas mejoradas o intensificadas.", "a": true, "e": "Art. 57.2."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, aplicar medidas simplificadas está permitido incluso cuando existe sospecha de LC/FT/FPADM, si el monto es bajo.", "a": false, "e": "Art. 35."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las decisiones del oficial de cumplimiento obligan a todas las unidades desde que él las adopta.", "a": false, "e": "Art. 16: obligan una vez aprobadas por la junta directiva. Trampa: se suprime la condición."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un factor de riesgo propio de este sector, además de clientes, productos, canales y tecnologías, es:", "o": ["El tipo de activo virtual involucrado en la operación", "La capitalización bursátil de la empresa supervisada", "El número de sucursales físicas que tenga el sujeto", "La antigüedad de los miembros de su junta directiva"], "a": 0, "e": "Art. 4.f."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el universo de clientes debe evaluarse globalmente cada veinticuatro meses.", "a": false, "e": "Art. 46, num. 1: cada doce meses. Trampa: se cambia el período."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay indicios de que un empleado cometió un delito en el marco de su trabajo, basta un RAS a la UNIF, sin denuncia penal.", "a": false, "e": "Art. 64: hay obligación de denunciar, previa averiguación de la gerencia de seguridad. Trampa: se cambia el cauce."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una falla de seguridad o un plan de contingencia desactualizado se vincula principalmente con el riesgo:", "o": ["Operacional", "De contagio", "De reputación", "Residual"], "a": 0, "e": "Art. 4.w."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, las políticas del sujeto obligado deben exigir que funcionarios y empleados antepongan:", "o": ["El cumplimiento en materia de riesgos a las metas comerciales", "Las metas comerciales a los controles de menor importancia", "La captación de clientes a la verificación de identidad", "La velocidad de cada operación al análisis de las alertas"], "a": 0, "e": "Art. 9.c."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, corresponde al sujeto obligado determinar el tipo de actividad criminal que realiza el cliente antes de reportar.", "a": false, "e": "Art. 77.7."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, al recibir un pago, se confirma que el beneficiario figura en una lista de la ONU. La reacción correcta es:", "o": ["Congelar sin demora e informar a la UNIF", "Devolver los fondos a su originador", "Ejecutar la operación y reportar luego", "Pedir antes autorización a un juez"], "a": 0, "e": "Art. 41."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, hay financiamiento al terrorismo aunque los fondos recolectados no hayan llegado a utilizarse.", "a": true, "e": "Art. 4.g."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la evaluación anual del nivel de riesgo del sujeto obligado se efectúa:", "o": ["Durante el último trimestre del ejercicio", "Dentro de 60 días después del cierre", "Durante el primer trimestre del año", "Dentro de 90 días después del cierre"], "a": 0, "e": "Art. 34. Trampa: en seguros la autoevaluación se remite sesenta días después del cierre."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el Manual de Administración de Riesgos debe elaborarse necesariamente en formato físico.", "a": false, "e": "Art. 30: físico o digital. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación ocasional de 900 euros no genera ninguna duda sobre el cliente. Respecto del umbral:", "o": ["No se activa, por no superar 1.000 euros", "Se activa, por superar los 500 euros", "Se activa siempre con activos virtuales", "No se activa, por no llegar a 15.000 euros"], "a": 0, "e": "Art. 40; con dudas sobre la veracidad sí procede aunque no llegue al umbral."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el informe anual de prevención se remite a:", "o": ["La UNIF y SUNACRIP, en 90 días calendario", "SUNACRIP solamente, en 60 días hábiles", "La ONCDOFT y la UNIF, en 45 días continuos", "La UNIF solamente, en 30 días calendario"], "a": 0, "e": "Art. 84."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el informe de ejecución del POA se elabora por lo menos cada semestre.", "a": false, "e": "Art. 25: por lo menos cada trimestre. Trampa: se cambia la frecuencia."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de una casa de intercambio pretende reportar directo al presidente, un nivel por debajo de él. Sobre ese esquema:", "o": ["La posición es correcta, pero reporta a la junta", "La posición y el reporte son correctos", "Debe ubicarse al mismo nivel y reportar a él", "Debe ubicarse dos niveles abajo y reportar a él"], "a": 0, "e": "Art. 15: un nivel por debajo del presidente y reporta a la junta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si solo un sujeto obligado interviene en la transferencia, debe cumplir la regla respecto de su propio cliente.", "a": true, "e": "Art. 41."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un cliente pide fraccionar una transferencia simple en varias etapas sin razón aparente. Lo que hace compleja la operación es:", "o": ["La orden del cliente que complica una transacción simple", "El tipo de activo virtual que se decidió utilizar", "El monto total, siempre superior al umbral fijado", "El hecho de que intervenga un empleado nuevo"], "a": 0, "e": "Art. 4.l."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un empleado detecta falsedad en los datos de un nuevo cliente durante la debida diligencia. Debe:", "o": ["Negar el servicio e informar a su supervisor inmediato", "Prestar el servicio e informar al final del trimestre", "Comunicárselo a la UNIF de forma directa y personal", "Corregir por sí mismo los datos en la ficha del cliente"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los clientes no residentes figuran entre los factores de alto riesgo enunciados.", "a": true, "e": "Art. 37.1.e."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una operación en la que se omite una de las fases del procedimiento establecido se considera:", "o": ["No convencional", "En tránsito", "Estructurada", "Ocasional"], "a": 0, "e": "Art. 4.o."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida por incumplir normas o prácticas prescritas de cualquier jurisdicción donde se opera es riesgo:", "o": ["Legal", "De reputación", "De contagio", "Residual"], "a": 0, "e": "Art. 4.v."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un exchange usa un mezclador porque, según afirma, sus clientes lo piden por privacidad. Esa prestación:", "o": ["Está prohibida", "Se permite con diligencia intensificada", "Se permite por debajo del umbral", "Se permite con aval de la junta"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "La norma de SUNACRIP sobre riesgos LC/FT/FPADM de los proveedores de activos virtuales se publicó en:", "o": ["G.O. 42.110 del 21-04-2021", "G.O. 41.575 del 30-01-2019", "G.O. 41.522 del 12-11-2018", "G.O. 39.912 del 30-04-2012"], "a": 0, "e": "La 41.575 es el Decreto Constituyente de criptoactivos, la 41.522 el decreto de la UNIF y la 39.912 la LOCDOFT."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay indicios de que el cliente no actúa por cuenta propia, el sujeto debe:", "o": ["Pedir el poder y conocer por cuenta de quién actúa", "Negar el servicio y publicar la situación del caso", "Aceptar la operación sin solicitar otros recaudos", "Pedir autorización al originador de los fondos"], "a": 0, "e": "Art. 49."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida originada por la opinión negativa que afecta la imagen del sujeto obligado es riesgo:", "o": ["De reputación", "Legal", "Operacional", "Inherente"], "a": 0, "e": "Art. 4.x."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, si un sujeto no puede mitigar adecuadamente el riesgo de tecnologías que favorecen el anonimato, debe:", "o": ["No involucrarse en esas actividades", "Reportar cada una de ellas a la UNIF", "Aumentar la comisión que cobra al cliente", "Pedir al cliente una declaración jurada"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sistema de administración de riesgos que deben implantar los sujetos obligados se denomina:", "o": ["SIAR LC/FT/FPADM", "SARLAFT de activos virtuales", "SIPAR de criptoactivos", "SICAD LC/FT/FPADM"], "a": 0, "e": "Art. 6. SARLAFT es colombiano y SIPAR nicaragüense."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, se pueden mantener billeteras virtuales anónimas si el cliente opera por debajo del umbral.", "a": false, "e": "Art. 39."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el umbral de transacción ocasional que activa los procesos de debida diligencia es superior a:", "o": ["1.000 euros", "15.000 euros", "10.000 dólares", "1.500 dólares"], "a": 0, "e": "Art. 40. Trampa: 15.000 es el umbral general del GAFI y 10.000 dólares el de la LOCDOFT."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la pérdida sufrida por el sujeto obligado debido a la conducta de un relacionado que influye sobre él es riesgo:", "o": ["De contagio", "Legal", "Residual", "Inherente"], "a": 0, "e": "Art. 4.s."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una transacción ocasional de 400 euros genera dudas sobre la veracidad de los datos del cliente. Procede:", "o": ["Aplicar debida diligencia aunque no se alcance el umbral", "No hacer nada, porque no supera el umbral exigido", "Cerrar la operación y avisar de ello al propio cliente", "Esperar a que se acumulen operaciones por 1.000 euros"], "a": 0, "e": "Arts. 40 y 44."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, en una transferencia sin cuenta ni billetera, la información debe incluir un número único de referencia que permita rastrearla.", "a": true, "e": "Art. 41, lit. b. Trampa: se cree que sin billetera no hay dato que incluir."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si hay sospecha de LC/FT/FPADM, se identifica y verifica al cliente y al beneficiario final aunque no se alcance el umbral.", "a": true, "e": "Art. 44. Trampa: se cree que el umbral siempre manda."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un auditor quiere revisar los reportes enviados a la UNIF para probar la calidad del programa. Debe saber que:", "o": ["No puede acceder a casos investigados o reportados", "Puede acceder solo con la firma del oficial", "Puede acceder si guarda secreto profesional", "Puede acceder solo a los archivados sin reporte"], "a": 0, "e": "Arts. 83 y 84."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado que crea poder cumplir sin oficial de cumplimiento puede prescindir de él con solo notificarlo a SUNACRIP.", "a": ible ante los cambios en los factores de riesgo.", "a": true, "e": "Art. 23."}, {"t": "vf", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, las fintech solo interesan al sector bancario y no alcanzan a seguros, valores o APNFD.", "a": false, "e": "La norma señala que su uso es transversal."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las medidas simplificadas para entes públicos siguen siendo aplicables aunque exista sospecha de LC/FT/FPADM sobre la operación.", "a": false, "e": "Arts. 35 y 47."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la providencia permite identificar a los clientes de forma remota si el sistema es idóneo, confiable, independiente y auditable.", "a": true, "e": "Art. 47. Trampa: se cree que la identificación no presencial está prohibida."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado que sirve de escala entre el origen y el destino de una operación realiza una operación:", "o": ["En tránsito", "No convencional", "Estructurada", "Compleja"], "a": 0, "e": "Art. 4.m."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, un medio publica que un cliente es investigado por delitos graves. La consecuencia inmediata es que:", "o": ["Se notifica a la UNIF, sin RAS automático", "Se genera un RAS automático a la UNIF", "Se cierra de inmediato su billetera", "Se ignora si no existe orden judicial"], "a": 0, "e": "Art. 94."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el sujeto obligado debe poder obtener cualquier información requerida en un plazo no mayor de:", "o": ["Setenta y dos horas", "Cuarenta y ocho horas", "Cinco días hábiles", "Diez días continuos"], "a": 0, "e": "Art. 62."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la verificación de identidad no presencial puede corroborarse con bases de datos públicas o fuentes confiables e independientes.", "a": true, "e": "Art. 40."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la recepción de una solicitud de información de una autoridad obliga a emitir un RAS automático sobre el investigado.", "a": false, "e": "Art. 100: solo se reporta si el análisis revela indicios. Trampa: se convierte en automático."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial debe evaluar los nuevos productos con activos virtuales antes de su lanzamiento.", "a": true, "e": "Art. 17.13."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los entes del sector público pueden recibir medidas simplificadas por ser considerados factores de bajo riesgo.", "a": true, "e": "Art. 47."}, {"t": "mc", "q": "Según las directrices FINTECH de la Providencia 054-2022 de SUNACRIP, el centro para la recepción y análisis de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La SUNACRIP", "La ONCDOFT", "El Ministerio Público"], "a": 0, "e": "Sección de reportes y Recomendación 29 del GAFI."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una transacción por internet sin presencia física de las partes representa un factor de alto riesgo por:", "o": ["Canal de distribución", "Actividad económica", "Zona geográfica", "Perfil de empleado"], "a": 0, "e": "Art. 37.3.a."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el resultado de la evaluación anual de riesgo debe remitirse obligatoriamente a SUNACRIP.", "a": false, "e": "Art. 34: permanece a disposición de SUNACRIP para inspecciones o cuando lo solicite. Trampa: se cambia conservar por remitir."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, al sospechar de un cliente, pedirle datos adicionales es improcedente si con ello se le alerta de la investigación.", "a": true, "e": "Art. 46.5."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, se prohíbe prestar servicios con activos virtuales a niños, niñas y adolescentes.", "a": false, "e": "Art. 57: se permite con debida diligencia mejorada o intensificada. Trampa: una precaución se convierte en prohibición."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las relaciones de larga duración con contacto frecuente presentan, en principio, menos riesgos.", "a": true, "e": "Art. 38.3."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, cuando resulte esencial no interrumpir el negocio, la verificación de identidad puede completarse:", "o": ["Tan pronto como sea razonablemente factible", "Dentro de los treinta días siguientes", "Al cierre del ejercicio económico", "En la siguiente evaluación anual"], "a": 0, "e": "Art. 54. Trampa: la norma no fija un plazo en días."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, una evaluación de riesgos debe permanecer a disposición de SUNACRIP para las revisiones que considere necesarias.", "a": true, "e": "Arts. 30 y 34."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, para documentos de identificación del cliente, el lapso de conservación se cuenta desde:", "o": ["El día en que finaliza la relación", "El día en que se abrió la cuenta", "El cierre del ejercicio económico", "La fecha de la última inspección"], "a": 0, "e": "Art. 61.1."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una empresa, tras evaluar su tamaño, quiere prescindir del oficial. Si SUNACRIP acepta la excepción, sus funciones las asume:", "o": ["El socio, accionista o directivo de mayor jerarquía", "El auditor interno o quien haga sus veces", "El presidente del área operativa designada por ella", "Un asesor externo contratado por la junta"], "a": 0, "e": "Arts. 21 y 22."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, los informes de gestión del oficial de cumplimiento ante la junta directiva son:", "o": ["Trimestrales y anuales", "Mensuales y semestrales", "Semestrales únicamente", "Anuales únicamente"], "a": 0, "e": "Arts. 13.5 y 17.5."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, la huella dactilar del pulgar o índice derecho se exige a quienes usan servicios por medio de:", "o": ["Canales físicos de distribución (taquillas)", "Aplicaciones móviles del sujeto obligado", "Cualquier canal digital o presencial", "Cajeros automáticos inteligentes"], "a": 0, "e": "Art. 59. Trampa: se amplía a canales que la norma no menciona."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, para que exista sospecha debe estar probado que los fondos tienen origen delictivo.", "a": false, "e": "Art. 4.bb y 92: la sospecha es un criterio fundado en indicios y en la experiencia."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, la Tesorería de Criptoactivos de Venezuela queda fuera del ámbito de la norma por ser un ente público.", "a": false, "e": "Art. 2: la norma la nombra expresamente entre los sujetos obligados."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, NO es una de las actividades que definen al proveedor de servicios de activos virtuales:", "o": ["Comprar criptoactivos con recursos propios para sí", "Intercambiar activos virtuales y moneda fiduciaria", "Transferir activos virtuales en nombre de otro", "Custodiar activos virtuales de una tercera persona"], "a": 0, "e": "Art. 2: la actividad debe realizarse para o en nombre de otro."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, quien solo otorga financiamiento con recursos propios representados en activos virtuales:", "o": ["No debe establecer SIAR, pero sí suministrar información", "Debe establecer un SIAR completo igual al de las casas", "Queda exento de suministrar información a la autoridad", "Debe contratar a un oficial de cumplimiento exclusivo"], "a": 0, "e": "Art. 12, último aparte."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el Plan Operativo Anual se elabora:", "o": ["Durante el último trimestre del año anterior", "Durante el primer trimestre de su vigencia", "Dentro de los quince días hábiles del año", "Dentro de los treinta días del cierre"], "a": 0, "e": "Art. 23. Trampa: quince días hábiles es el plazo para tenerlo a disposición de SUNACRIP."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, si un cliente pide una transferencia con indicios de LC/FT, el trabajador debe ejecutarla y reportar después para no alertarlo.", "a": false, "e": "Art. 96: debe negarle el servicio e informar al oficial. Trampa: la LOCDOFT prohíbe suspender durante una investigación, que es un supuesto distinto."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, las decisiones del oficial aprobadas por la junta directiva son de observancia obligatoria para ejecutivos y empleados.", "a": true, "e": "Art. 16."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un pronunciamiento desfavorable del auditor puede dar lugar a una inspección especial de SUNACRIP.", "a": true, "e": "Art. 87."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, en las ausencias temporales del oficial de cumplimiento, designa un suplente:", "o": ["La junta directiva o el órgano equivalente", "El presidente del sujeto obligado", "El propio oficial antes de ausentarse", "SUNACRIP, a solicitud del sujeto obligado"], "a": 0, "e": "Art. 18. Trampa: en seguros el presidente ejerce directamente las funciones."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de cumplimiento se ubica jerárquicamente:", "o": ["Un nivel por debajo del presidente del sujeto", "En el mismo nivel jerárquico del presidente", "Dos niveles por debajo de la gerencia general", "Bajo la dependencia del auditor interno"], "a": 0, "e": "Art. 15.2. Trampa: en la norma de seguros la posición es distinta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, el oficial de cumplimiento debe estar jerárquicamente un nivel por debajo de la junta directiva.", "a": false, "e": "Art. 15, num. 2: un nivel por debajo del presidente. Trampa: el num. 1 dice que reporta a la junta."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, un oficial de cumplimiento puede dirigir también el área comercial si dispone de tiempo suficiente.", "a": false, "e": "Art. 15.4: dedicación exclusiva a la prevención y control."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, una plataforma extranjera autorizada que opera desde Venezuela y cuya regla de origen es más estricta debe:", "o": ["Aplicar la providencia y añadir la regla más estricta", "Aplicar solamente la regla de su país de origen", "Aplicar solamente la norma venezolana vigente", "Elegir libremente cuál de las dos reglas seguir"], "a": 0, "e": "Art. 2: se suman las medidas más estrictas de la jurisdicción de origen."}, {"t": "vf", "q": "Según la Providencia 044-2021 de SUNACRIP, los procesos de conocimiento del cliente pueden apoyarse en soluciones seguras de identificación remota.", "a": true, "e": "Art. 10.c."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, las estadísticas de alertas y casos del área operativa deben emitirse con frecuencia:", "o": ["Mensual", "Trimestral", "Semestral", "Anual"], "a": 0, "e": "Art. 20.10. No confundir con los informes trimestrales del oficial."}, {"t": "mc", "q": "Según la Providencia 044-2021 de SUNACRIP, ante una alerta de actividad sospechosa, quien decide si se remite el reporte a la UNIF es:", "o": ["El oficial de cumplimiento", "El gerente de la plataforma", "El presidente del sujeto", "El auditor independiente"], "a": 0, "e": "Art. 17.10 y 92."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención de Viena de 1988", "Solo la Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "mc", "q": "La «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Solo penalización y extradición", "Solo medidas preventivas del sector público", "Solo la cooperación entre las unidades de inteligencia financiera"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "El migrante no consiente y la finalidad es el cruce de frontera", "La trata exige cruzar una frontera y el tráfico de migrantes no", "El tráfico de migrantes protege a la persona y la trata al Estado"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para un sujeto obligado venezolano es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado en lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las R.3 y R.36 a R.40 del GAFI", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}, {"t": "mc", "q": "Palermo permite, respecto de la carga de la prueba en el decomiso, que los Estados:", "o": ["Consideren exigir al imputado demostrar el origen lícito", "Deban invertir la carga de la prueba en estos delitos", "Presuman ilícito todo bien de un condenado por delito grave", "Trasladen la prueba del origen al Estado requirente"], "a": 0, "e": "Es una posibilidad que la Convención invita a considerar."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "Según los datos del Convenio de 1999 contra la financiación del terrorismo, su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "mc", "q": "Según el Convenio de 1999, las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "vf", "q": "Según la Convención de Palermo, la asistencia judicial recíproca no puede negarse invocando el secreto bancario.", "a": true, "e": "Art. 18, párrafo 8. Trampa: se cree que el secreto bancario es una causal de denegación."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, la tentativa de proveer o recolectar fondos:", "o": ["También constituye delito", "Solo es punible si hubo atentado", "Queda a criterio de cada Estado", "No está prevista en el texto"], "a": 0, "e": "Art. 2, párrafo 4. Trampa: se confunde con que los fondos no necesitan usarse."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el Estado requerido no puede negar la asistencia amparándose en:", "o": ["El secreto bancario", "La doble incriminación", "Su propio orden público", "La cosa juzgada"], "a": 0, "e": "Art. XVI. Trampa: las otras causales no están excluidas por ese artículo."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, es decir, quien ofrece y quien acepta", "Solo activa, de quien ofrece el beneficio", "Solo pasiva, es decir, de quien recibe el beneficio", "Solo cuando el funcionario es extranjero"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional y el enriquecimiento ilícito se tipifican con sujeción a la Constitución de cada Estado.", "a": true, "e": "Arts. VIII y IX. Trampa: se cree que son deberes sin reserva."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito cometido en un solo Estado es transnacional si en otro Estado se realiza una parte sustancial de su:", "o": ["Preparación, planificación, dirección o control", "Financiación, ejecución o encubrimiento", "Investigación, juzgamiento o condena", "Beneficio, reparto o reinversión posterior"], "a": 0, "e": "Art. 3, párrafo 2, literal b. Trampa: las otras listas suenan igual de técnicas."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, la responsabilidad de las personas jurídicas debe ser necesariamente penal.", "a": false, "e": "Art. 5: penal, civil o administrativa. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "La función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Según la Convención de Palermo, la disposición del producto decomisado se rige, en primer término, por:", "o": ["El derecho interno del Estado que decomisa", "El acuerdo de reparto por mitades entre Estados", "La decisión del Estado que pidió el decomiso", "Las reglas del fondo de las Naciones Unidas"], "a": 0, "e": "Art. 14, párrafo 1. Trampa: la devolución al requirente es una consideración prioritaria, no la regla base."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "Según la Convención de Palermo, la obstrucción de la justicia se penaliza en su artículo:", "o": ["23", "8", "24", "25"], "a": 0, "e": "El 24 protege a los testigos y el 25 a las víctimas. Trampa: artículos vecinos de materia cercana."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mérida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes por igual", "Ambos son recomendaciones sin efecto jurídico", "El GAFI aprueba los tratados"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "mc", "q": "Según los datos de la Convención Interamericana contra la Corrupción, su entrada en vigor ocurrió en:", "o": ["1997", "1996", "2002", "2005"], "a": 0, "e": "Adoptada en Caracas en 1996. Trampa: 2005 es la entrada en vigor de Mérida."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, una solicitud de asistencia judicial puede negarse por tratarse de un delito fiscal.", "a": false, "e": "Art. 13. Trampa: el art. 14 dice lo mismo respecto del delito político."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según
