 para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "mc", "q": "Al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "El riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el apetito de riesgo lo define el oficial de cumplimiento y lo informa a la junta directiva.", "a": false, "e": "Lo define y aprueba el órgano de dirección. Trampa: se invierte quién decide y quién informa."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "mc", "q": "Documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "mc", "q": "Transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "mc", "q": "Una matriz de riesgo que clasifica a toda la cartera como riesgo bajo probablemente indica:", "o": ["Una metodología mal calibrada", "Una cartera excepcionalmente sana", "Un control interno muy eficaz", "Un supervisor poco exigente"], "a": 0, "e": "La ausencia total de riesgo alto es una señal de alerta metodológica."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica", "Excluye el de baja probabilidad", "Excluye el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el origen de los fondos y el origen de la riqueza son el mismo concepto.", "a": false, "e": "Fondos: de dónde viene el dinero de la operación. Riqueza: cómo se formó el patrimonio total. Trampa: se usan como sinónimos."}, {"t": "mc", "q": "La figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Una decisión consciente, documentada y del nivel adecuado", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "mc", "q": "La trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "vf", "q": "Compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "vf", "q": "Un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "¿Qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "El análisis media entre ambas."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la tolerancia al riesgo, frente al apetito, es:", "o": ["La desviación aceptable respecto del apetito", "El riesgo máximo que la entidad puede soportar", "El riesgo que la entidad desea asumir", "El riesgo que queda tras los controles"], "a": 0, "e": "Trampa: el máximo soportable es la capacidad; el deseado, el apetito; el que queda, el residual."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}, {"t": "vf", "q": "Lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "vf", "q": "Un sujeto obligado que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Un plan operativo que se ejecuta en un cincuenta por ciento revela:", "o": ["Una debilidad que exige acciones correctivas", "Un desempeño aceptable del área", "Un plan demasiado conservador", "Una gestión eficiente de los recursos disponibles"], "a": 0, "e": "El informe de ejecución sirve para corregir."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "vf", "q": "El sistema de administración de riesgos debe combinar controles preventivos, detectivos y correctivos.", "a": true, "e": "Las tres capas se complementan."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "mc", "q": "El intercambio de información entre sujetos obligados sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en el contrato"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una operación inusual debe reportarse de inmediato a la unidad de inteligencia, sin análisis previo.", "a": false, "e": "Lo inusual se analiza; se reporta lo que queda sin justificación razonable. Trampa: se salta el análisis."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "mc", "q": "¿Cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "¿Por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "Si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anó d a quien vigila."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "vf", "q": "El supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "El análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a const GR=D.groups, ALL=D.all, PASS=0.8;
const app=document.getElementById('app');
let st=null, immediate=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){
  st=null;
  let h=`<h1>${esc(D.titulo)}</h1><p class="mut">${esc(D.sub)}</p>`;
  h+=`<div class="card menu"><h2 style="margin-top:0">Simulacro aleatorio</h2>
      <button class="p" onclick="start(-1)"><b>50 preguntas de todo el temario</b><br><span style="opacity:.85">Se arma distinto cada vez, con ${ALL.length} preguntas disponibles</span></button></div>`;
  GR.forEach((g,gi)=>{
    h+=`<h2>${esc(g.titulo)}</h2><div class="card menu">`;
    g.exams.forEach((e,ei)=>{
      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;
    });
    h+='</div>';
  });
  h+=`<label class="t"><input type="checkbox" id="imm" ${immediate?'checked':''} onchange="immediate=this.checked"> Corregir cada pregunta al contestarla. Desactívalo para simular el examen real y ver la nota solo al final.</label>
      <p class="mut">Verdadero o falso y selección simple. Se aprueba con 80 %, es decir 40 de 50. Al terminar verás la nota y la explicación de cada error.</p>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(gi,ei){
  let qs,titulo;
  if(gi===-1){qs=shuffle(ALL).slice(0,50);titulo='Simulacro aleatorio';}
  else{const e=GR[gi].exams[ei];qs=shuffle(e.q);titulo=e.titulo;}
  qs=qs.map(prep);
  st={titulo,qs,i:0,ans:qs.map(()=>null)};
  render();
}
function pick(k){
  const a=st.ans[st.i];
  if(a&&a.locked)return;
  st.ans[st.i]={sel:k,locked:immediate};
  render();
}
function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
