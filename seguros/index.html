el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, la multa por incumplir las obligaciones en materia de administración de riesgos de LC/FT/FPADM va de:", "o": ["25.000 a 50.000 veces el tipo de cambio de referencia", "10.000 a 25.000 veces el tipo de cambio de referencia", "5.000 a 20.000 veces el tipo de cambio de referencia", "50.000 a 100.000 veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 126, num. 4. De 50.000 a 100.000 es la multa del art. 132 por falsear información."}, {"t": "mc", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, queda exceptuado de esa disposición:", "o": ["El fondo de garantía de la Administración Pública Nacional que realice actividad aseguradora", "El actuario independiente que presta servicios técnicos a empresas de seguros y de reaseguros", "El oficial de cumplimiento inscrito en el registro que lleva la Superintendencia del sector", "El auditor externo en materia de LC/FT/FPADM inscrito en el registro de la Superintendencia"], "a": 0, "e": "LAA, art. 3. Los otros tres son sujetos regulados."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿cuál de estas obligaciones corresponde al presidente y NO a la junta directiva?", "o": ["Proponer a la junta la designación del oficial de cumplimiento", "Designar al oficial de cumplimiento y supervisar sus funciones", "Aprobar la designación de los responsables de cumplimiento", "Revisar y aprobar el Informe Anual del auditor externo"], "a": 0, "e": "Art. 9, num. 7. Las otras tres son de la junta (art. 8, nums. 4, 9 y 8). Trampa: todas son funciones reales, pero de otro órgano."}, {"t": "mc", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, ¿cada cuánto se renueva el registro del oficial de cumplimiento y cuánto se paga?", "o": ["Cada tres años, el 25 % de la tasa de inscripción", "Cada tres años, el 50 % de la tasa de inscripción", "Cada cinco años, el 25 % de la tasa de inscripción", "Cada dos años, la tasa de inscripción completa"], "a": 0, "e": "LAA, art. 12, en concordancia con el art. 12 de la Providencia SAA-01-0536-2024."}, {"t": "mc", "q": "Según el artículo 9, numeral 8, de la Providencia SAA-01-0536-2024, ¿qué debe asegurar el presidente respecto de un nuevo producto o servicio?", "o": ["Que mercadeo y negocios consulten al oficial de cumplimiento antes de su lanzamiento", "Que la auditoría externa lo certifique después de su primer año de comercialización", "Que la Superintendencia lo apruebe antes de cualquier campaña publicitaria", "Que la UNIF reciba una copia de sus condiciones generales al lanzarlo"], "a": 0, "e": "Art. 9, num. 8, en concordancia con el art. 13, num. 10."}, {"t": "mc", "q": "Según el artículo 13, numeral 5, de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo, el manual, el plan operativo y su informe de ejecución se remiten a la Superintendencia:", "o": ["Por los medios que disponga la propia Superintendencia", "Por mensajería postal certificada, en original firmado", "Mediante entrega personal en la asamblea de accionistas", "No se remiten: basta archivarlos en la presidencia"], "a": 0, "e": "Art. 13, num. 5."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024, ¿en cuál de estos casos el plazo se cuenta en días continuos y no en días hábiles?", "o": ["La remisión de la autoevaluación de riesgo tras el cierre", "La notificación de la renuncia del oficial de cumplimiento", "La nueva designación del oficial tras su falta absoluta", "La prórroga del lapso para designar al nuevo oficial"], "a": 0, "e": "Art. 20: sesenta días continuos. El art. 9, nums. 4 y 6, usa días hábiles."}, {"t": "mc", "q": "Según el artículo 13, numeral 10, de la Providencia SAA-01-0536-2024, ¿cuándo evalúa el oficial de cumplimiento los nuevos productos y servicios?", "o": ["Antes de su comercialización", "Después de su primer año de comercialización", "Solo cuando un cliente presente una denuncia", "Durante la auditoría externa de cierre de año"], "a": 0, "e": "Art. 13, num. 10."}, {"t": "mc", "q": "Según los artículos 13 y 15 de la Providencia SAA-01-0536-2024, en materia de capacitación el oficial de cumplimiento ___ los planes y la Unidad los ___.", "o": ["coordina / ejecuta", "ejecuta / aprueba", "aprueba / coordina", "financia / ejecuta"], "a": 0, "e": "Art. 13, num. 4 (coordinar) y art. 15, num. 6 (ejecutar)."}, {"t": "mc", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, ¿cómo se define el sistema integral de administración de riesgos de LC/FT/FPADM?", "o": ["Normas y políticas que adopta el sujeto regulado, según su riesgo, para mitigar el uso ilícito de sus productos, servicios, clientes y canales", "Normas que dicta la Superintendencia y que todo sujeto regulado aplica de forma idéntica, sin considerar su propio nivel de riesgo", "Políticas que adopta la UNIF para vigilar, según su riesgo, el uso de los productos, servicios, clientes y canales de los sujetos regulados", "Procedimientos de la auditoría externa para certificar cada año los productos, servicios, clientes y canales del sujeto regulado"], "a": 0, "e": "LAA, art. 4, num. 27. El examen de la ONCDOFT lo cita como artículo 2; en el texto publicado en la G.O. 6.770 Extraordinario es el artículo 4, numeral 27."}]}, {"titulo": "Modelo ONCDOFT 5", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, quien falsee el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM puede ser sancionado con multa y prohibición de ejercer la actividad aseguradora hasta por diez (10) años.", "a": true, "e": "LAA, art. 132: multa de 50.000 a 100.000 veces el tipo de cambio de referencia y prohibición hasta por diez años."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte, falsee o altere información de operaciones relacionadas con LC/FT/FPADM puede ser excluido del registro por un lapso de uno (1) a cinco (5) años.", "a": true, "e": "LAA, art. 138, numeral 3: multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión de uno a cinco años."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento puede compartir su cargo con otras funciones de la empresa si su volumen de trabajo es bajo.", "a": false, "e": "Art. 10: está a dedicación exclusiva. Trampa: se agrega una excepción que la norma no prevé."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, durante las vacaciones del oficial de cumplimiento la junta directiva designa un suplente.", "a": false, "e": "Art. 9, num. 5: las funciones las ejerce el presidente. Trampa: el suplente designado por la junta es la regla de la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, el sistema integral de administración de riesgos de LC/FT/FPADM lo adopta cada sujeto regulado en función de su nivel de riesgo.", "a": true, "e": "LAA, art. 4, num. 27: «Conjunto de normas y políticas adoptadas y ejecutadas por los sujetos regulados, en función de su nivel de riesgo...»."}, {"t": "vf", "q": "Según el artículo 19 de la Ley de la Actividad Aseguradora, la solicitud de autorización de una empresa de seguros debe contar, entre otros, con los manuales de gobierno corporativo y de administración integral de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 19."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente notifica la renuncia del oficial de cumplimiento dentro de los cinco (5) días continuos siguientes.", "a": false, "e": "Art. 9, num. 4: cinco días hábiles. Trampa: se cambia la unidad de cómputo."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, sus normas buscan administrar los riesgos de LC, FT y FPADM, pero no los de otros ilícitos.", "a": false, "e": "Providencia SAA-01-0536-2024, art. 1: incluye expresamente «cometer otros ilícitos»."}, {"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se actualiza cada dos años y no requiere certificación del auditor interno.", "a": false, "e": "Art. 20: se actualiza anualmente, con aprobación de la junta y certificación del auditor interno o quien haga sus veces."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los fondos de garantía de la Administración Pública Nacional que realicen actividad aseguradora quedan exceptuados de esa disposición.", "a": true, "e": "LAA, art. 3: se exceptúan los fondos de garantía de la Administración Pública Nacional, sin perjuicio de su deber de cooperación con la Superintendencia."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia SAA-01-0536-2024, la autorización del oficial de cumplimiento será revocada cuando haya sido sancionado conforme al artículo 138 de la ley que rige la actividad aseguradora.", "a": true, "e": "Art. 12, último aparte."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los actuarios independientes no tienen la condición de sujetos regulados.", "a": false, "e": "LAA, art. 3: los actuarios independientes se consideran también sujetos regulados."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, la sanción al oficial de cumplimiento que falsee información de LC/FT/FPADM excluye la responsabilidad penal.", "a": false, "e": "Art. 138: la multa o exclusión se aplica sin perjuicio de las sanciones penales."}, {"t": "vf", "q": "Según el artículo 8 de la Providencia SAA-01-0536-2024, la junta directiva conoce el Informe Anual del auditor externo, y su aprobación corresponde al presidente.", "a": false, "e": "Art. 8, num. 8: la junta lo revisa y aprueba; el presidente solo lo conoce (art. 9, num. 10). Trampa: se invierten los papeles."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, el representante de una sucursal de reaseguros del exterior es designado responsable de cumplimiento por la Superintendencia.", "a": false, "e": "Art. 7, num. 4: lo designa la casa matriz."}, {"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, basta con el título de bachiller y experiencia comprobada en seguros para optar al cargo de oficial de cumplimiento.", "a": false, "e": "Art. 11, num. 1: título de educación superior o técnico universitario."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, el Ministro de Finanzas puede ajustar las tasas, pero un incremento no puede superar la mitad de los montos previstos.", "a": false, "e": "LAA, art. 12: el incremento no puede ser superior a las dos terceras (2/3) partes de las tasas previstas."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los auditores externos en materia de activos de información están exceptuados de la tasa de inscripción prevista para los auditores externos.", "a": true, "e": "LAA, art. 12, numeral 4: «Se exceptúan los auditores externos en materia de activos de información»."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, la renovación del registro de oficiales de cumplimiento cuesta el veinticinco por ciento (25 %) de la tasa de inscripción, cada tres (3) años.", "a": true, "e": "LAA, art. 12, penúltimo aparte."}, {"t": "vf", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, la junta directiva debe aprobar anualmente un monto de recursos financieros específico e identificable dentro del presupuesto general.", "a": true, "e": "Art. 8, num. 2."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, los contadores públicos en libre ejercicio son sujetos obligados cuando realizan para un cliente, entre otras, la compraventa de inmuebles o la administración de su dinero.", "a": true, "e": "LOCDOFT, art. 9, numeral 9: abogados, administradores, economistas y contadores en libre ejercicio, cuando realicen esas transacciones para un cliente."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los registros allí previstos deben renovarse cada cinco (5) años.", "a": false, "e": "LAA, art. 12: los registros se renuevan cada tres (3) años."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento en el diseño, implementación y funcionamiento del sistema integral de LC/FT/FPADM se sanciona con multa de 25.000 a 50.000 veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 126, numeral 4."}, {"t": "vf", "q": "Según el artículo 8, numeral 3, de la Ley de la Actividad Aseguradora, corresponde al Superintendente emitir los lineamientos de evaluación y administración integral de riesgos de LC/FT/FPADM de los sujetos regulados.", "a": true, "e": "LAA, art. 8, num. 3."}, {"t": "vf", "q": "Según el artículo 8, numeral 9, de la Providencia SAA-01-0536-2024, aprobar la designación de los miembros de la Unidad y de los responsables de cumplimiento corresponde al presidente.", "a": false, "e": "Art. 8, num. 9: corresponde a la junta directiva o al órgano equivalente. El oficial los propone (art. 13, num. 12)."}, {"t": "mc", "q": "Según el artículo 9, numeral 7, de la Providencia SAA-01-0536-2024, ¿ante quién propone el presidente la designación del oficial de cumplimiento?", "o": ["Ante la junta directiva o el órgano equivalente", "Ante la Superintendencia de la Actividad Aseguradora", "Ante el comité de auditoría y control", "Ante la asamblea general de accionistas"], "a": 0, "e": "Art. 9, num. 7. La junta lo designa (art. 8, num. 4)."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿en qué casos ejerce el presidente las funciones del oficial de cumplimiento?", "o": ["En reposo médico, vacaciones y falta absoluta del oficial", "Solo durante las inspecciones presenciales de la Superintendencia", "Solo cuando haya reportes de alto impacto financiero", "Exclusivamente en caso de reposo médico del oficial"], "a": 0, "e": "Art. 9, numerales 5 y 6."}, {"t": "mc", "q": "Según el artículo 12, numeral 4, de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de auditores externos, incluidos los de LC/FT/FPADM, es de:", "o": ["Ciento cincuenta (150) veces el tipo de cambio de referencia", "Cien (100) veces el tipo de cambio de referencia", "Setenta y cinco (75) veces el tipo de cambio de referencia", "Treinta (30) veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 12, num. 4. Cien veces es la de actuarios; setenta y cinco, la de auxiliares personas naturales; treinta, el examen de agente."}, {"t": "mc", "q": "Según el artículo 7, numeral 1, de la Providencia SAA-01-0536-2024, la designación del oficial de cumplimiento y de los responsables es:", "o": ["Obligatoria para todos los sujetos obligados", "Temporal, solo durante el primer año de registro", "Opcional, según el volumen de transacciones", "Exclusiva de empresas con más de cincuenta empleados"], "a": 0, "e": "Art. 7, num. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quiénes integran el sistema integral de AR/LC/FT/FPADM y otros ilícitos?", "o": ["Junta directiva, presidente, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y responsables de cumplimiento", "Junta directiva, auditor externo, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y consultoría jurídica", "Asamblea de accionistas, presidente, oficial de cumplimiento, auditor interno y responsables de cumplimiento", "Presidente, oficial de cumplimiento, comité de riesgos, auditor externo y responsables de cumplimiento"], "a": 0, "e": "Art. 7."}, {"t": "mc", "q": "Según el artículo 126 de la Ley de la Actividad Aseguradora, ¿qué rango de multa corresponde al incumplimiento del sistema integral de LC/FT/FPADM?", "o": ["De 25.000 a 50.000 veces el tipo de cambio (numeral 4)", "De 5.000 a 20.000 veces el tipo de cambio (numeral 1)", "De 10.000 a 25.000 veces el tipo de cambio (numeral 3)", "De 2.000 a 5.000 veces el tipo de cambio (numeral 5)"], "a": 0, "e": "Art. 126, num. 4. Trampa: todos los rangos existen en el artículo, para otras conductas."}, {"t": "mc", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, ¿en qué lapso debe coordinarse la nueva designación?", "o": ["No mayor de diez días hábiles, prorrogable una sola vez por un lapso igual", "No mayor de cinco días continuos, sin derecho a prórroga de ningún tipo", "Quince días hábiles, prorrogables automáticamente por un lapso igual", "Treinta días calendario, contados desde el cese de funciones del oficial"], "a": 0, "e": "Art. 9, num. 6."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia SAA-01-0536-2024, ¿cuál de estos NO figura entre los principios bajo los cuales se aplican las políticas?", "o": ["Rentabilidad", "Autorregulación", "Proporcionalidad", "Transparencia"], "a": 0, "e": "Art. 2: debida diligencia, autorregulación, buena fe, razonabilidad, confianza, proporcionalidad, adecuación y transparencia."}, {"t": "mc", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, ¿cuándo puede el Superintendente imponer medidas administrativas por razones de LC/FT/FPADM?", "o": ["Cuando las operaciones contravengan esa normativa de modo que comprometan el equilibrio del sistema financiero nacional", "Cuando el sujeto regulado remita con un solo día de retraso cualquier reporte de actividad sospechosa a la UNIF", "Cuando el oficial de cumplimiento renuncie y la empresa no notifique el hecho a la Superintendencia ese mismo día", "Cuando la empresa reciba del Ministerio Público una solicitud de información sobre cualquiera de sus clientes"], "a": 0, "e": "LAA, art. 85, num. 5."}, {"t": "mc", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, falsear el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM se sanciona con:", "o": ["Multa de 50.000 a 100.000 veces el tipo de cambio y prohibición de ejercer hasta por diez años", "Multa de 25.000 a 50.000 veces el tipo de cambio y suspensión de la autorización por un año", "Multa de 5.000 a 10.000 veces el tipo de cambio y exclusión del registro de uno a cinco años", "Solo la amonestación pública, sin perjuicio de las sanciones penales a que haya lugar"], "a": 0, "e": "LAA, art. 132."}, {"t": "mc", "q": "Según el artículo 11, numeral 1, de la Providencia SAA-01-0536-2024, el requisito académico para ser oficial de cumplimiento es:", "o": ["Título de educación superior o técnico universitario", "Título de bachiller, con experiencia en seguros", "Título de posgrado en administración de riesgos", "Certificados de cursos libres sin titulación oficial"], "a": 0, "e": "Art. 11, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la Providencia SAA-01-0536-2024, el empleado que conozca irregularidades en la observancia del manual debe informarlas a:", "o": ["La Unidad de AR/LC/FT/FPADM o al oficial de cumplimiento", "La UNIF, de forma directa y anónima", "La Superintendencia, por escrito y con copia al presidente", "Su supervisor inmediato, quien decide si escala el caso"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, ¿en qué lapso notifica el presidente a la Superintendencia la designación, renuncia o ausencia del oficial?", "o": ["Cinco (5) días hábiles", "Tres (3) días continuos", "Diez (10) días hábiles", "Quince (15) días hábiles"], "a": 0, "e": "Art. 9, num. 4."}, {"t": "mc", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, ¿en qué plazo se remite la autoevaluación de riesgo a la Superintendencia?", "o": ["Sesenta (60) días continuos tras el cierre del ejercicio", "Noventa (90) días continuos tras el cierre del ejercicio", "Treinta (30) días hábiles tras el cierre del ejercicio", "Los primeros quince (15) días hábiles de cada año"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia SAA-01-0536-2024, la Unidad de AR/LC/FT/FPADM puede organizarse en las áreas de:", "o": ["Administración de Riesgos; Estadísticas y Análisis Estratégicos; Análisis y Supervisión de Operaciones", "Cumplimiento Legal y Normativo; Auditoría Interna; Atención de Reclamos y Denuncias de Asegurados", "Suscripción de Riesgos; Siniestros y Salvamentos; Reaseguro, Coaseguro y Retrocesión de Riesgos", "Mercadeo, Ventas y Negocios; Tecnología de la Información; Talento Humano y Capacitación Interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 22 de la Providencia SAA-01-0536-2024, ¿cuáles son los factores de riesgo de la autoevaluación?", "o": ["Clientes, productos o servicios, canales de comercialización, zonas geográficas y nuevas tecnologías", "Clientes, empleados, proveedores, accionistas, intermediarios y reaseguradores de la empresa de seguros", "Primas, siniestros, reservas técnicas, inversiones, margen de solvencia y patrimonio propio no comprometido", "Probabilidad, impacto, riesgo inherente, riesgo residual, apetito de riesgo y tolerancia al riesgo"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según el artículo 13, numeral 18, de la Providencia SAA-01-0536-2024, el oficial asiste e informa a la junta sobre la enajenación de bienes de recuperaciones y salvamentos para:", "o": ["Determinar la identidad del beneficiario final", "Fijar el precio mínimo de venta del bien", "Cobrar la comisión del intermediario de seguros", "Liquidar la reserva técnica del siniestro"], "a": 0, "e": "Art. 13, num. 18."}, {"t": "mc", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte o altere información de operaciones de LC/FT/FPADM puede ser sancionado con:", "o": ["Multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión del registro de uno a cinco años", "Multa de 25.000 a 50.000 veces el tipo de cambio de referencia y exclusión definitiva del registro de oficiales", "Amonestación escrita y suspensión del registro por seis meses, sin perjuicio de las sanciones penales", "Multa de 50.000 a 100.000 veces el tipo de cambio de referencia, sin exclusión del registro de oficiales"], "a": 0, "e": "LAA, art. 138, num. 3."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento es un empleado de alto nivel dotado de:", "o": ["Autonomía funcional y poder de decisión, a dedicación exclusiva", "Representación legal exclusiva y firma autorizada de la junta", "Veto absoluto sobre las decisiones de los accionistas", "Dependencia operativa del área de mercadeo y negocios"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 8, numeral 3, de la Providencia SAA-01-0536-2024, el Compromiso Institucional que asume cada miembro de la junta directiva debe constar en:", "o": ["El expediente individual de cada miembro", "El libro de actas de la asamblea de accionistas", "El archivo bajo llave del oficial de cumplimiento", "Una cartelera pública de la institución"], "a": 0, "e": "Art. 8, num. 3: se asume en forma individual y por escrito."}, {"t": "mc", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, ¿qué riesgos deben administrar los sujetos obligados?", "o": ["LC, FT, FPADM y otros ilícitos", "Solo LC y FT", "LC, FT y FPADM, sin otros ilícitos", "Solo los riesgos operativos y reputacionales"], "a": 0, "e": "Providencia SAA-01-0536-2024, art. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quién puede ordenar la conformación de la Unidad de AR/LC/FT/FPADM a un sujeto obligado que esté exceptuado?", "o": ["La Superintendencia de la Actividad Aseguradora", "La junta directiva del propio sujeto obligado", "La Unidad Nacional de Inteligencia Financiera", "La Oficina Nacional Contra la Delincuencia Organizada"], "a": 0, "e": "Art. 7, último aparte."}, {"t": "mc", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, ¿a qué debe dirigir especial atención la junta al aprobar los recursos anuales para la materia?", "o": ["A la capacitación y a las soluciones informáticas y herramientas tecnológicas", "Al pago de honorarios de auditores externos y asesores legales", "A la remodelación de las oficinas de la Unidad de AR/LC/FT/FPADM", "Al pago de multas impuestas por la Superintendencia en ejercicios anteriores"], "a": 0, "e": "Art. 8, num. 2."}, {"t": "mc", "q": "Según el artículo 8, numeral 8, de la Providencia SAA-01-0536-2024, respecto del Informe Anual sobre AR/LC/FT/FPADM del auditor externo, la junta directiva debe:", "o": ["Revisarlo y aprobarlo, para aplicar las acciones correctivas que correspondan", "Solo conocerlo, porque su aprobación corresponde al oficial de cumplimiento", "Elaborarlo junto con el auditor externo antes de remitirlo a la Superintendencia", "Remitirlo a la UNIF dentro de los cinco días hábiles siguientes a su recepción"], "a": 0, "e": "Art. 8, num. 8. El presidente solo lo conoce (art. 9, num. 10)."}, {"t": "mc", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, la multa por incumplir las obligaciones en materia de administración de riesgos de LC/FT/FPADM va de:", "o": ["25.000 a 50.000 veces el tipo de cambio de referencia", "10.000 a 25.000 veces el tipo de cambio de referencia", "5.000 a 20.000 veces el tipo de cambio de referencia", "50.000 a 100.000 veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 126, num. 4. De 50.000 a 100.000 es la multa del art. 132 por falsear información."}]}]}, {"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Informe de Ejecución del Plan Operativo Anual lo aprueba el oficial de cumplimiento antes de remitirlo.", "a": false, "e": "Art. 30: lo aprueba la junta directiva. Trampa: el oficial lo elabora, pero no lo aprueba."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el registro del oficial de cumplimiento ante la superintendencia se renueva:", "o": ["Cada tres años, pagando el 25 % de la tasa", "Cada cinco años, pagando el 25 % de la tasa", "Cada tres años, pagando el 50 % de la tasa", "Cada año, pagando el 25 % de la tasa inicial"], "a": 0, "e": "Art. 12. Trampa: se cambia el período o el porcentaje."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["Que exista sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un cliente propone pagar con efectivo varias pólizas pequeñas el mismo día, justo por debajo del monto de control. La conducta descrita se conoce como:", "o": ["Fraccionamiento o «pitufeo» para evadir controles", "Diversificación legítima de coberturas de seguro", "Planificación fiscal habitual mediante primas pequeñas", "Contratación escalonada propia de un cliente corporativo"], "a": 0, "e": "Es una señal clásica de colocación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el auditor externo solicita revisar los reportes de actividades sospechosas enviados. Corresponde:", "o": ["Negar el acceso a casos y reportes remitidos", "Permitirlo por su deber de independencia", "Autorizarlo con una orden del presidente", "Entregarlos con los nombres ocultos"], "a": 0, "e": "Los auditores externos no tienen acceso a ellos."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "El Convenio de Financiación del Terrorismo", "La Convención de Viena de 1988", "La Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 29 del GAFI, una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los auditores externos, respecto de los casos investigados y los reportes remitidos:", "o": ["No tienen acceso a ellos", "Tienen acceso pleno para su informe", "Acceden solo con permiso del cliente", "Acceden solo si lo pide la UNIF"], "a": 0, "e": "Art. 72. La confidencialidad del reporte es absoluta frente a terceros."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, los pagos recibidos de terceros desconocidos o no asociados figuran entre los ejemplos de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que basta identificar al titular."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación inusual debe reportarse de inmediato a la unidad de inteligencia, sin análisis previo.", "a": false, "e": "Lo inusual se analiza; se reporta lo que queda sin justificación razonable. Trampa: se salta el análisis."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), una política interna que limite el pago de primas en efectivo es:", "o": ["Una medida de mitigación razonable", "Una discriminación prohibida al cliente", "Una exigencia literal de la ley", "Una decisión exclusiva del supervisor"], "a": 0, "e": "Medida de control adoptada por riesgo."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "¿Quiénes están sujetos a la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Personas sometidas a la supervisión y control de SUDEASEG", "Personas sometidas a la supervisión y control de la UNIF", "Solo las empresas de seguros autorizadas para operar", "Toda empresa que contrate seguros con una aseguradora"], "a": 0, "e": "Incluye aseguradoras, reaseguradoras, corredores, financiadoras de primas, medicina prepagada, entre otros."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, recopilar las respuestas a las solicitudes de información de los organismos públicos corresponde a:", "o": ["La unidad de administración de riesgos", "El presidente, como representante legal", "La junta directiva del sujeto obligado", "Los intermediarios de seguros"], "a": 0, "e": "Art. 15, numeral 7. Trampa: se cree que lo hace la presidencia por ejercer la representación legal."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Una constructora, una notaría y una aseguradora son sujetos obligados según la LOCDOFT. Lo que tienen en común es que:", "o": ["Cada una está sometida a un órgano o ente de control", "Cada una depende jerárquicamente de la ONCDOFT", "Cada una reporta sus operaciones a SUDEASEG", "Cada una pertenece al mismo sector económico"], "a": 0, "e": "Sujeto obligado es quien está bajo el control de un órgano de control; cada sector tiene el suyo."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si el supervisor considera insuficientes los mecanismos de una aseguradora, puede:", "o": ["Instruir los ajustes y correcciones necesarias", "Designar a su propio oficial de cumplimiento", "Revocar la licencia sin procedimiento previo", "Reportar el caso directamente al juez penal"], "a": 0, "e": "Art. 87. Potestad correctiva."}, {"t": "vf", "q": "Según la Recomendación 18 del GAFI, un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿quién debe impartir la capacitación en materia de LC/FT al sector asegurador?", "o": ["Facilitadores inscritos en el RUF de la ONCDOFT", "Cualquier profesional con experiencia en seguros", "Exclusivamente el Oficial de Cumplimiento de la empresa", "Solo funcionarios de SUDEASEG designados para ello"], "a": 0, "e": "Art. 31. El RUF asegura idoneidad de los capacitadores."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, para una persona expuesta políticamente extranjera, establecer el origen de su riqueza y de sus fondos es:", "o": ["Obligatorio en todos los casos", "Obligatorio si la relación es de mayor riesgo", "Facultativo, a criterio del oficial", "Exigible si es un cliente ocasional"], "a": 0, "e": "R.12: para las extranjeras es obligatorio; para las nacionales y de organizaciones internacionales, cuando la relación es de mayor riesgo. Trampa: se aplica la regla de las nacionales."}, {"t": "mc", "q": "La Providencia 209 de SUNAVAL se aplica a:", "o": ["Los sujetos regulados por el mercado de valores", "Las empresas de seguros, reaseguros y medicina prepagada", "Las casas de cambio y remesadoras", "Los casinos y salas de bingo"], "a": 0, "e": "Es la norma del sector valores."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, para un nuevo cliente de mayor riesgo, NO figura entre los métodos adicionales de verificación que exige la norma:", "o": ["La declaración jurada notariada del cliente", "La visita al cliente en su domicilio", "Las comunicaciones telefónicas con el cliente", "La verificación independiente de su identidad"], "a": 0, "e": "Art. 40: visita, llamadas y verificación independiente. Trampa: se añade un método que suena formal."}, {"t": "vf", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "Para el GAFI, la debida diligencia sobre el beneficiario de una póliza de vida debe realizarse a más tardar:", "o": ["Al momento del pago", "Al contratar la póliza únicamente", "Al renovarla cada año", "Cuando se cancela la póliza"], "a": 0, "e": "Antes de pagar la prestación."}]}, {"titulo": "Examen integral 2", "q": [{"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "mc", "q": "¿Qué relación guarda la Providencia SAA-01-0536-2024 de SUDEASEG con la LOCDOFT?", "o": ["Desarrolla los deberes de la ley y no puede contradecirla", "La Norma deroga las disposiciones de la LOCDOFT para el sector", "La LOCDOFT no se aplica al sector asegurador por su norma", "Ambas se aplican de forma alternativa, a elección del sujeto"], "a": 0, "e": "Principio de jerarquía: la ley está por encima de la providencia."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas coordinadas y eficaces contra la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal especial contra la corrupción", "Prohibir las donaciones a partidos políticos"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, la política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente exige firmar él mismo cada reporte de sospecha antes de que salga. Ese requisito:", "o": ["Vulnera la autonomía para reportar", "Cumple el control dual del sistema", "Es válido si lo aprueba la junta", "Es válido para reportes de alto monto"], "a": 0, "e": "No se puede negar ni condicionar la remisión."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "Art. 36. La sospecha desplaza la clasificación previa."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado de una aseguradora recibe de un cliente un regalo costoso a cambio de acelerar un trámite. ¿Cómo debe interpretarse?", "o": ["Posible corrupción interna que se reporta al Oficial", "Obsequio normal que puede aceptarse con discreción", "Incentivo aceptable si el trámite es legítimo", "Asunto personal que no concierne a la empresa"], "a": 0, "e": "Art. 66. Prevención de corrupción interna."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado lee en un manual interno la Providencia SAA-01-0530-2024 como norma de prevención. Debe corregirse porque esa providencia regula:", "o": ["El buen gobierno corporativo", "La actividad de reaseguro", "Los reportes sistemáticos", "La medicina prepagada"], "a": 0, "e": "La norma de riesgos es la SAA-01-0536-2024."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Que se decida de forma informada y documentada", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, ¿por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una prima ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, dirigir a los cuerpos de policía de investigaciones penales en estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El juez de control"], "a": 0, "e": "Art. 26. Trampa: el juez autoriza medidas, pero no dirige la investigación."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, además de la declaración jurada de origen de fondos, presentan la declaración de conocimiento en materia de AR/LC/FT/FPADM:", "o": ["Solo los intermediarios personas naturales", "Solo los intermediarios personas jurídicas", "Todos los intermediarios autorizados", "Solo las sociedades de corretaje inscritas"], "a": 0, "e": "Art. 59. Trampa: la declaración de origen la presentan todos; la de conocimiento, solo las personas naturales."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de operaciones sospechosas debe presentarse con prontitud a la unidad de inteligencia financiera.", "a": true, "e": "R.20. Trampa: se cree que puede esperarse al cierre del mes."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una sociedad de corretaje detecta una operación sospechosa y alega que no tiene unidad de administración de riesgos. Esa ausencia:", "o": ["No la exime de informar", "La exime de todo reporte", "Traslada el deber a la aseguradora", "Obliga a constituir la unidad antes"], "a": 0, "e": "No están obligadas a conformarla, pero sí a informar."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una persona expuesta políticamente de una organización internacional recibe medidas menos exigentes que una PEP nacional.", "a": false, "e": "Art. 51: recibe las mismas medidas. Trampa: se crea una diferencia que no existe."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el beneficiario de una póliza de vida, según el estándar, debe:", "o": ["Considerarse factor de riesgo y verificarse antes del pago", "Identificarse solo si es persona jurídica", "Verificarse únicamente en el momento de contratar la póliza", "Quedar fuera del alcance de la diligencia"], "a": 0, "e": "Verificación a más tardar al momento del pago."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la evaluación del riesgo comprende la identificación, el análisis y:", "o": ["La valoración", "El tratamiento", "La comunicación", "El registro"], "a": 0, "e": "Apartado 6.4. Trampa: el tratamiento viene después de la evaluación."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, ante indicios de un hecho punible, presenta informes debidamente fundados a:", "o": ["El Ministerio Público", "El juez de control", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 25, numeral 6. Trampa: la UNIF no se dirige al juez; quien solicita medidas judiciales es el fiscal."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el formulario del expediente del reasegurador lo suscribe el oficial de cumplimiento de la aseguradora cedente.", "a": false, "e": "Art. 61, num. 1: lo suscribe el oficial de la reaseguradora. Trampa: se cambia de empresa al firmante."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un aumento sostenido de pólizas de prima única en una sucursal es:", "o": ["Un indicador que merece revisión específica", "Una señal de buena gestión comercial", "Un dato irrelevante para cumplimiento", "Un asunto exclusivo del área actuarial"], "a": 0, "e": "Los indicadores orientan dónde mirar."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), el siniestro se paga a un tercero sin relación aparente con el asegurado, con documentos poco claros. ¿Qué debe hacer la aseguradora?", "o": ["Analizar, verificar la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, vencidos los diez días para designar al nuevo oficial, la empresa ya usó una prórroga. Puede:", "o": ["No pedir otra, porque solo se admite una vez", "Pedir otra, si la justifica ante la junta", "Dejar el cargo vacante hasta la asamblea", "Pedir prórrogas hasta cubrir sesenta días"], "a": 0, "e": "El plazo es prorrogable una sola vez."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}]}, {"titulo": "Examen integral 3", "q": [{"t": "vf", "q": "Según la Recomendación 3 del GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Según la LOCDOFT, si una aseguradora no tiene manual de prevención, quien tiene competencia para sancionarla administrativamente por esa omisión es:", "o": ["El órgano de control de su sector, es decir, SUDEASEG", "La UNIF, por ser la unidad de inteligencia financiera", "El Ministerio Público, por tratarse de un delito", "El juez de control, previa solicitud fiscal"], "a": 0, "e": "Art. 8, numeral 3. SUDEASEG es el órgano de control del sector asegurador."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, adaptar la gestión del riesgo al contexto externo e interno de la organización corresponde al principio de que sea:", "o": ["Adaptada", "Inclusiva", "Dinámica", "Integrada"], "a": 0, "e": "Apartado 4. Trampa: los otros también son principios, pero no ese."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), dentro del factor producto, eleva el riesgo que la póliza:", "o": ["Permita rescate anticipado o acumule valor", "Cubra responsabilidad civil obligatoria", "Tenga una suma asegurada baja", "Se renueve automáticamente cada año"], "a": 0, "e": "Los productos con valor de rescate son más atractivos para lavar."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora lanza un seguro digital vendido solo por una aplicación móvil. Desde la lógica de la autoevaluación de riesgo, ¿qué debe hacer antes de lanzarlo?", "o": ["Evaluar el riesgo del producto y definir controles", "Lanzarlo y evaluar el riesgo en la próxima autoevaluación", "Esperar a la inspección de SUDEASEG para ajustarlo", "Pedir autorización previa a la UNIF para comercializarlo"], "a": 0, "e": "Art. 13, numeral 10. Productos y canales nuevos exigen evaluación previa."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), para el enfoque basado en riesgo, el uso de efectivo en el sector asegurador:", "o": ["Es un factor que eleva el riesgo y exige controles", "Está prohibido por la norma prudencial del sector", "Es irrelevante si hay recibo de pago", "Solo importa en pólizas de daños"], "a": 0, "e": "El efectivo dificulta la trazabilidad."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "Art. 9. La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la gestión de primera línea es responsable de:", "o": ["Lograr los objetivos y gestionar sus riesgos", "Dar aseguramiento independiente al gobierno", "Aprobar el apetito de riesgo de la entidad", "Auditar los controles de la segunda línea"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: el aseguramiento independiente es de la tercera línea y el apetito lo fija el órgano de gobierno."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, una aseguradora quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de primas de cada ramo", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el comportamiento y el nivel de vida de empleados e intermediarios, cuando no concuerdan con sus ingresos, puede ser una señal de alerta interna.", "a": true, "e": "Arts. 58 y 66. El riesgo también viene de adentro."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la inscripción del oficial debe renovarse con actualización de recaudos en un período menor que los cinco años de la condición PEP.", "a": true, "e": "Renovación cada tres años."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las operaciones que el auditor externo detecte como posiblemente sospechosas deben:", "o": ["Notificarse por escrito al oficial para que decida", "Reportarse por el propio auditor a la UNIF", "Incluirse solo en el Informe Anual del auditor", "Comunicarse a la junta para que decida el reporte"], "a": 0, "e": "Art. 72. Trampa: el auditor no reporta a la UNIF ni la junta decide el reporte."}, {"t": "mc", "q": "¿Qué diferencia hay entre la debida diligencia simplificada, mejorada e intensificada según la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Se gradúan por riesgo: bajo, moderado y alto respectivamente", "Se gradúan por el monto: menor, medio y mayor de la prima", "Se gradúan por nacionalidad: nacional, residente y extranjero", "Son sinónimos aplicables según la preferencia de la empresa"], "a": 0, "e": "Gradación por riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar el inicio de la relación con una compañía constituida en un país que no aplica regulaciones similares corresponde a:", "o": ["La junta directiva o el órgano equivalente", "El oficial de cumplimiento, previo informe", "El presidente, con aviso a la superintendencia", "La unidad de riesgos LC/FT de la empresa"], "a": 0, "e": "Art. 38. Trampa: el oficial analiza, pero no aprueba."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}, {"t": "mc", "q": "Según la LOCDOFT, un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable, sin exigir certeza", "Esperar pruebas documentales del origen ilícito", "Consultar al cliente para descartar la sospecha", "Esperar al próximo ciclo de monitoreo"], "a": 0, "e": "Art. 13. El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una póliza de vida con prima única de USD 2.000 puede considerarse un ejemplo de menor riesgo.", "a": true, "e": "Nota interpretativa de la R.10: prima única inferior a USD/EUR 2.500. Trampa: se aplica el límite de la prima anual."}, {"t": "mc", "q": "Según la LOCDOFT, aprobar la vinculación de un cliente PEP corresponde a la alta gerencia; diseñar y aplicar la debida diligencia sobre ese cliente corresponde a:", "o": ["El sujeto obligado, supervisado por su órgano de control", "El órgano de control, en cada operación del cliente", "La UNIF, al recibir el primer reporte del cliente", "La ONCDOFT, mediante una autorización previa"], "a": 0, "e": "Art. 18. Trampa: el órgano de control supervisa, pero quien diseña y aplica los procedimientos es el sujeto obligado."}, {"t": "mc", "q": "Según la Recomendación 37 del GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una empresa envía el plan operativo un mes después del cierre del ejercicio, junto con su informe de ejecución. El error es:", "o": ["El plan debe enviarse antes del cierre", "El informe debe enviarse antes que el plan", "Ambos deben enviarse en un solo documento", "El plan no se remite a la superintendencia"], "a": 0, "e": "El plan se remite dentro de los cuarenta y cinco días previos al cierre."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, una aseguradora recibe una póliza cuyo tomador es una OSFL que recibe donaciones de varias jurisdicciones. ¿Cuál es el tratamiento adecuado?", "o": ["Entender su propósito y el origen y destino de los fondos", "Rechazarla por recibir donaciones del exterior", "Aceptarla sin ningún análisis por no tener fines de lucro", "Notificar a la UNIF cada donación que reciba"], "a": 0, "e": "Las OSFL no son malas per se; son vulnerables."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Evaluación y Control es de uso restringido y confidencial.", "a": true, "e": "Art. 71. Trampa: se cree que se remite a la superintendencia; solo debe estar disponible en las inspecciones."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando de bienes", "Extradición, asilo, refugio y asistencia judicial recíproca", "Soberanía, jurisdicción, territorio y competencia penal"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo relacionado con el cliente:", "o": ["Una sociedad con accionistas nominales o acciones al portador", "Una empresa que cotiza en bolsa con divulgación de información", "Una entidad pública o una empresa del Estado", "Un plan de pensiones sin opción de rescate anticipado"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se mantiene aunque surjan sospechas, mientras el cliente siga siendo de riesgo bajo en el sistema.", "a": false, "e": "Art. 36. Ante sospecha no se permite DD simplificada."}]}, {"titulo": "Examen integral 4", "q": [{"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los reportes sistemáticos mensuales de pólizas y del registro de trabajadores se remiten dentro de:", "o": ["Diez días hábiles tras el fin de cada mes", "Diez días continuos tras el fin de cada mes", "Cinco días hábiles tras el fin de cada mes", "Quince días hábiles tras el fin de
