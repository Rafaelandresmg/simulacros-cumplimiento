<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector seguros", "sub": "20 exámenes de 50 preguntas. Banco de 774 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "mc", "q": "La debida diligencia que corresponde al riesgo moderado se denomina:", "o": ["Mejorada", "Intensificada", "Ampliada", "Reforzada"], "a": 0, "e": "Intensificada es la del riesgo alto."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven a la aseguradora para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las primas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Si un ROS se envía con información incompleta o errónea, ¿qué consecuencia tiene?", "o": ["Reduce la utilidad de la inteligencia", "Es preferible a no reportar sin consecuencia alguna", "Se corrige automáticamente por la UIF", "Obliga a archivar el caso sin análisis"], "a": 0, "e": "La calidad importa."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "A los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "mc", "q": "¿Qué debe poder hacer el sistema tecnológico de monitoreo de una aseguradora según la norma?", "o": ["Detectar operaciones inusuales y seguir clientes de alto riesgo", "Cerrar automáticamente las pólizas que generen alertas en el sistema", "Bloquear a los clientes sin análisis humano previo", "Reportar directo a la Fiscalía las alertas detectadas"], "a": 0, "e": "El sistema apoya el análisis humano."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "Un supervisor comercial nota que un corredor aumentó de forma inexplicable su cartera de pólizas de prima única y su nivel de vida. ¿Cómo debe interpretarse?", "o": ["Señal de alerta que debe analizar cumplimiento", "Éxito comercial que debe premiarse al intermediario", "Asunto personal ajeno a la aseguradora", "Prueba de buen desempeño del equipo de ventas"], "a": 0, "e": "La norma pide vigilar cambios de conducta y nivel de vida de intermediarios y empleados."}, {"t": "mc", "q": "Una empresa opera en dos sectores regulados a la vez, por ejemplo seguros y valores. Debe:", "o": ["Cumplir las exigencias de ambos supervisores", "Elegir el régimen que considere más favorable", "Cumplir solo el del sector de mayor facturación", "Quedar exenta por el conflicto de normas"], "a": 0, "e": "Los regímenes se acumulan."}, {"t": "mc", "q": "El expediente del reasegurador exige, entre otros recaudos:", "o": ["Estados financieros auditados de años recientes", "Solo la calificación de riesgo publicada en su página web", "Únicamente el contrato de reaseguro", "La póliza original del asegurado cedido"], "a": 0, "e": "El reaseguro también es canal de riesgo."}, {"t": "mc", "q": "El artículo 8 de Palermo obliga a penalizar:", "o": ["La corrupción de funcionarios públicos", "El tráfico de estupefacientes", "El financiamiento del terrorismo", "El contrabando de armas"], "a": 0, "e": "Mérida desarrolla con mucho más detalle esta materia."}, {"t": "mc", "q": "El Convenio de Budapest, cuando se menciona en esta materia, trata de:", "o": ["La ciberdelincuencia y la prueba electrónica", "La corrupción en el deporte", "El tráfico de bienes culturales", "La protección de los datos personales en línea"], "a": 0, "e": "Relevante por el delito informático como delito determinante."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "La Recomendación 16 regula:", "o": ["Las transferencias electrónicas y su información", "La banca corresponsal", "El reporte de operaciones sospechosas a la unidad", "La supervisión de las APNFD"], "a": 0, "e": "Trazabilidad de la cadena de pago."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Un gerente quiere cerrar de inmediato las pólizas de un cliente investigado «para protegerse». Según la LOCDOFT:", "o": ["No cerrar sin autorización judicial, para no frustrar la investigación", "Cerrar de inmediato e informar luego a la UNIF del cierre", "Cerrar la relación con la aprobación de la Junta Directiva de la empresa", "Cerrar si el cliente figura como riesgo alto en el sistema"], "a": 0, "e": "El cierre puede alertar al investigado y destruir evidencia."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su póliza", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "El nombre completo del instrumento conocido como Convención de Viena de 1988 alude a:", "o": ["El tráfico ilícito de estupefacientes y sustancias sicotrópicas", "La delincuencia organizada de carácter transnacional y sus formas", "La corrupción de funcionarios públicos", "El derecho de los tratados entre Estados"], "a": 0, "e": "Cuidado: hay otras convenciones firmadas en Viena sobre materias distintas."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "mc", "q": "La «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "La relación entre el Convenio de 1999 y la Recomendación 5 del GAFI es que:", "o": ["La recomendación exige tipificar conforme a ese convenio", "El convenio deroga a la recomendación", "Son instrumentos sin relación entre sí", "La recomendación sustituye al convenio en los países miembros"], "a": 0, "e": "El estándar remite al tratado."}, {"t": "mc", "q": "Un compañero cita la Resolución 083.18 para fundamentar una obligación de una aseguradora. El error es que esa resolución:", "o": ["Es del sector bancario, no del asegurador", "Está derogada desde el año 2021", "Es una guía sin carácter obligatorio", "Corresponde al mercado de valores"], "a": 0, "e": "Cada sector tiene su norma; citar la ajena es un error frecuente."}, {"t": "mc", "q": "La norma prohíbe tercerizar, entre otras funciones:", "o": ["La identificación del beneficiario final", "El servicio de mensajería de la empresa", "La impresión y despacho de pólizas", "El soporte informático de los sistemas"], "a": 0, "e": "Funciones medulares del conocimiento del cliente."}, {"t": "mc", "q": "El hermano de un gobernador contrata una póliza de alta suma. Según la LOCDOFT, el tratamiento adecuado es:", "o": ["Tratarlo como familiar de PEP, con aprobación de la alta gerencia", "Tratarlo como un cliente ordinario porque el PEP no es el contratante", "Rechazarlo, ya que la ley prohíbe contratar con familiares de PEP", "Notificar al gobernador para que autorice la contratación"], "a": 0, "e": "Los familiares cercanos y allegados forman parte del círculo PEP."}, {"t": "vf", "q": "La aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "La sospecha desplaza la clasificación previa."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "El rescate anticipado de una póliza poco después de contratarla es señal de alerta porque:", "o": ["Sugiere que el objetivo era mover el dinero, no asegurarse", "Indica insatisfacción con el servicio", "Implica una pérdida económica para la aseguradora emisora", "Demuestra falta de capacidad de pago"], "a": 0, "e": "Patrón típico de colocación e integración."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de la UNIF de ampliar información sobre un cliente. ¿Cómo debe interpretarse la obligación?", "o": ["Suministrarla a tiempo: cooperar es parte del deber", "Negarla si el cliente no ha dado su autorización", "Pedir permiso previo al cliente para entregarla", "Ignorarla hasta recibir una orden judicial firme"], "a": 0, "e": "La LOCDOFT obliga a los sujetos a remitir información requerida."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "Un falso positivo en la revisión de listas se resuelve:", "o": ["Documentando la verificación que lo descarta", "Eliminando al cliente del sistema", "Reportándolo igualmente a la autoridad", "Suspendiendo la póliza por precaución"], "a": 0, "e": "El descarte también se documenta."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "El beneficiario de una póliza de vida, según el estándar, debe:", "o": ["Considerarse factor de riesgo y verificarse antes del pago", "Identificarse solo si es persona jurídica", "Verificarse únicamente en el momento de contratar la póliza", "Quedar fuera del alcance de la diligencia"], "a": 0, "e": "Verificación a más tardar al momento del pago."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "La Recomendación 26 trata de:", "o": ["La regulación y supervisión de instituciones financieras", "La creación de la unidad de inteligencia financiera", "La cooperación internacional entre supervisores", "Las sanciones por incumplimiento"], "a": 0, "e": "La 27 define los poderes del supervisor."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "El siniestro se paga a un tercero sin relación aparente con el asegurado, con documentos poco claros. ¿Qué debe hacer la aseguradora?", "o": ["Analizar, verificar la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "mc", "q": "Una persona jurídica nueva, sin historial ni actividad comprobable, solicita contratar un seguro de alta suma con pago en efectivo. ¿Qué alerta presenta?", "o": ["Posible empresa fachada con fondos sin explicar", "Cliente normal que inicia su actividad económica", "Riesgo bajo por tratarse de una persona jurídica", "Operación habitual en el sector asegurador"], "a": 0, "e": "Empresas sin sustancia económica son señal típica."}]}, {"titulo": "Examen integral 2", "q": [{"t": "mc", "q": "La norma extiende el concepto de PEP a los familiares hasta el cuarto grado de consanguinidad y segundo de afinidad y a sus colaboradores cercanos. ¿Qué lógica hay detrás?", "o": ["Evitar el uso de testaferros cercanos al PEP", "Aumentar la carga documental del sector", "Aplicar una sanción indirecta a los familiares", "Reducir el número de clientes de las aseguradoras"], "a": 0, "e": "Los testaferros son el mecanismo típico."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Una aseguradora clasifica a sus clientes en solo dos categorías: riesgo alto y riesgo bajo. ¿Qué observación hace SUDEASEG según su Norma 2024?", "o": ["Los niveles obligatorios son tres: bajo, moderado y alto", "Está bien: la norma permite solo alto y bajo", "Debe tener cinco niveles, con uno crítico y otro muy bajo", "Puede definir sus propios niveles según su política interna"], "a": 0, "e": "La norma fija tres niveles de riesgo."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo data de:", "o": ["1999", "1997", "2001", "2005"], "a": 0, "e": "Adoptado por la Asamblea General en diciembre de 1999."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible erta."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "¿Qué relación hay entre la autoevaluación de riesgo, el manual y el plan operativo?", "o": ["Riesgos identificados, procedimientos y plan de actividades", "Son documentos independientes sin ninguna relación entre sí", "El plan operativo sustituye a la autoevaluación anual", "El manual sustituye al plan operativo de cada ejercicio"], "a": 0, "e": "Coherencia del sistema."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes por igual", "Ambos son recomendaciones sin efecto jurídico", "El GAFI aprueba los tratados"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "La Recomendación 24 aborda la transparencia de:", "o": ["Las personas jurídicas y su beneficiario final", "Los fideicomisos y figuras equivalentes", "Las transferencias electrónicas internacionales", "Las operaciones de banca corresponsal"], "a": 0, "e": "La 25 cubre las estructuras jurídicas."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "mc", "q": "Un cliente PEP solicita un seguro de vida con beneficiarios en el exterior. ¿Qué exige la lógica de la Norma de SUDEASEG 2024?", "o": ["DD intensificada, beneficiario final y aprobación de Junta", "Aceptación con DD simplificada por ser un seguro de vida", "Rechazo automático por tratarse de un cliente PEP", "Aviso previo a los beneficiarios sobre la condición PEP"], "a": 0, "e": "Seguros de vida con PEP exigen aprobación del nivel más alto."}, {"t": "vf", "q": "Un Código de Ética que solo se entrega a gerentes cumple con la norma.", "a": false, "e": "Debe ser conocido y cumplido por todo el personal."}, {"t": "mc", "q": "¿Por qué se dice que la debida diligencia es un principio y no solo un trámite?", "o": ["Orienta toda la relación, de la aceptación al monitoreo", "Se aplica una sola vez al aceptar al cliente en la póliza", "Solo corresponde a clientes clasificados como PEP", "La realiza únicamente el intermediario que capta al cliente"], "a": 0, "e": "Es un proceso continuo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Sol
