suma asegurada", "Consultar primero la política del reasegurador que respalda"], "a": 0, "e": "Art. 16. Sin beneficiario final no hay debida diligencia válida."}, {"t": "vf", "q": "Según la LOCDOFT, la notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Art. 58. Es una garantía procesal."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un intermediario cobra comisiones elevadas por cada póliza de prima única vendida. El riesgo a vigilar es:", "o": ["Conflicto de interés y presión comercial sobre la debida diligencia", "Mayor protección para el asegurado por una suma más alta", "Incumplimiento de las tarifas oficiales del sector asegurador", "Exceso de reservas técnicas por primas únicas elevadas"], "a": 0, "e": "Los incentivos mal diseñados erosionan los controles."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional en la materia, junto con la organización, control y supervisión a nivel nacional, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio de Relaciones Exteriores", "El Ministerio Público"], "a": 0, "e": "Art. 5. Trampa: la UNIF intercambia con sus homólogas, pero la rectoría de la cooperación es del órgano rector."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No configuran delincuencia organizada, que exige tres o más", "Configuran delincuencia organizada, que exige dos o más", "Configuran delincuencia organizada si actúan con fin de lucro", "No configuran delincuencia organizada salvo que sean extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Una aseguradora recibe instrucciones contradictorias de su superintendencia y de la UNIF sobre un reporte. Lo correcto es:", "o": ["Consultar a ambas y dejar constancia escrita", "Obedecer siempre a la superintendencia", "Obedecer siempre a la UNIF", "No reportar hasta que se pongan de acuerdo"], "a": 0, "e": "Nunca dejar de reportar; documentar la consulta."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar la autorización de una aseguradora por razones de prevención corresponde a la UNIF.", "a": false, "e": "Art. 8, numeral 4: corresponde al órgano de control, en este caso la Superintendencia de la Actividad Aseguradora. Trampa: se cambia el organismo."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, la aseguradora no puede anular las pólizas del cliente investigado sin autorización previa de un juez.", "a": true, "e": "Art. 15. Trampa: se cree que basta la decisión de la junta o del oficial."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "El hermano de un gobernador contrata una póliza de alta suma. Según la LOCDOFT, el tratamiento adecuado es:", "o": ["Tratarlo como familiar de PEP, con aprobación de la alta gerencia", "Tratarlo como un cliente ordinario porque el PEP no es el contratante", "Rechazarlo, ya que la ley prohíbe contratar con familiares de PEP", "Notificar al gobernador para que autorice la contratación"], "a": 0, "e": "Los familiares cercanos y allegados forman parte del círculo PEP."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, centralizar a nivel nacional los reportes de actividades sospechosas corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 25, numeral 1. Trampa: la ONCDOFT recibe información para políticas públicas, pero no centraliza los reportes."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Según la LOCDOFT, un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Art. 9, numeral 10. Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Un gerente quiere cerrar de inmediato las pólizas de un cliente investigado «para protegerse». Según la LOCDOFT:", "o": ["No puede cerrarlas sin autorización previa de un juez", "Puede cerrarlas e informar luego del cierre a la UNIF", "Puede cerrarlas con la aprobación de la junta directiva", "No puede cerrarlas salvo que el cliente sea de riesgo alto"], "a": 0, "e": "El cierre puede alertar al investigado y destruir evidencia."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Providencia SAA-01-0536-2024 de SUDEASEG", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "Arts. 1 y 2. El registro es obligatorio para los sujetos alcanzados."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "Según la nota interpretativa de la Recomendación 29 del GAFI, una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["Que exista sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, para una persona expuesta políticamente extranjera, establecer el origen de su riqueza y de sus fondos es:", "o": ["Obligatorio en todos los casos", "Obligatorio si la relación es de mayor riesgo", "Facultativo, a criterio del oficial", "Exigible si es un cliente ocasional"], "a": 0, "e": "R.12: para las extranjeras es obligatorio; para las nacionales y de organizaciones internacionales, cuando la relación es de mayor riesgo. Trampa: se aplica la regla de las nacionales."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "mc", "q": "Para el GAFI, la debida diligencia sobre el beneficiario de una póliza de vida debe realizarse a más tardar:", "o": ["Al momento del pago", "Al contratar la póliza únicamente", "Al renovarla cada año", "Cuando se cancela la póliza"], "a": 0, "e": "Antes de pagar la prestación."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "vf", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "mc", "q": "Un compañero afirma que, como el GAFI recomienda 5 años de conservación, la aseguradora puede conservar los registros digitales solo 5 años. ¿Qué observación corresponde?", "o": ["La norma de SUDEASEG exige 10 años para digital", "Tiene razón: 5 años bastan para todo soporte", "No existe norma sectorial sobre el plazo", "El GAFI exige 10 años para todos los soportes"], "a": 0, "e": "El estándar internacional es un mínimo; la norma local puede ser más estricta."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "vf", "q": "Según la Recomendación 2 del GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente contrata pólizas de alta suma pero evita responder sobre su actividad. ¿Qué principio de la debida diligencia se ve afectado?", "o": ["Entender el propósito de la relación y los fondos", "El secreto comercial del cliente", "La libertad de comercio del cliente", "La reciprocidad entre cliente y aseguradora"], "a": 0, "e": "No se puede perfilar al cliente sin información."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el beneficiario de una póliza de vida, según el estándar, debe:", "o": ["Considerarse factor de riesgo y verificarse antes del pago", "Identificarse solo si es persona jurídica", "Verificarse únicamente en el momento de contratar la póliza", "Quedar fuera del alcance de la diligencia"], "a": 0, "e": "Verificación a más tardar al momento del pago."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de operaciones sospechosas debe presentarse con prontitud a la unidad de inteligencia financiera.", "a": true, "e": "R.20. Trampa: se cree que puede esperarse al cierre del mes."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado de una aseguradora recibe de un cliente un regalo costoso a cambio de acelerar un trámite. ¿Cómo debe interpretarse?", "o": ["Posible corrupción interna que se reporta al Oficial", "Obsequio normal que puede aceptarse con discreción", "Incentivo aceptable si el trámite es legítimo", "Asunto personal que no concierne a la empresa"], "a": 0, "e": "Art. 66. Prevención de corrupción interna."}, {"t": "vf", "q": "Según la Recomendación 28 del GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "¿Por qué las aseguradoras de vida y de inversión están en el foco del GAFI?", "o": ["Productos con rescate sirven para colocar fondos", "Cobran primas más altas que los demás seguros", "Son administradas siempre por el Estado", "Son productos nuevos aún sin regulación"], "a": 0, "e": "Los seguros de vida con componente de ahorro son vulnerables."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, en casinos, la debida diligencia se activa desde transacciones financieras de:", "o": ["USD/EUR 3.000", "USD/EUR 1.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, una compañía de seguros que vende solo ramos generales, frente al estándar:", "o": ["Sigue sujeta a medidas, ajustadas a su riesgo", "Queda excluida por completo del régimen", "Debe aplicar las mismas medidas que la banca", "Solo responde ante su supervisor local"], "a": 0, "e": "El riesgo es menor, no inexistente."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una póliza de vida con prima única de USD 2.000 puede considerarse un ejemplo de menor riesgo.", "a": true, "e": "Nota interpretativa de la R.10: prima única inferior a USD/EUR 2.500. Trampa: se aplica el límite de la prima anual."}, {"t": "mc", "q": "Según la Recomendación 37 del GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}]}, {"titulo": "Normativa internacional · modelo 2", "q": [{"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, si el beneficiario de una póliza de vida es una persona expuesta políticamente de mayor riesgo, debe informarse a la alta gerencia antes del pago.", "a": true, "e": "R.12, medidas para seguros de vida; además se examina la relación y se considera un reporte de sospecha. Trampa: se cree que basta revisarlo después del pago."}, {"t": "vf", "q": "Según la Recomendación 16 del GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la prima y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 5 del GAFI, el financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "mc", "q": "Según la Recomendación 14 del GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 7 del GAFI, la evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Según la Recomendación 34 del GAFI, la información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "mc", "q": "Según la Recomendación 21 del GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Al comprador y también al vendedor", "Al comprador, que es quien aporta los fondos", "Al vendedor, que es quien recibe los fondos", "A quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Un directivo cree que SUDEASEG recibe los ROS del sector asegurador. ¿Qué debe aclararle un oficial de cumplimiento?", "o": ["Los ROS van a la UNIF; SUDEASEG supervisa", "Los ROS van a SUDEASEG y esta los remite a la UNIF", "Los ROS van a la ONCDOFT por ser órgano rector", "Los ROS van directamente al tribunal de control"], "a": 0, "e": "Reparto institucional."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, el «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, una aseguradora detecta que un tomador figura en una lista de designados por la ONU. ¿Qué principio rige?", "o": ["Congelar sin demora y notificar sin avisar al cliente", "Consultar al cliente antes de adoptar medidas", "Esperar una orden judicial para congelar", "Continuar el contrato mientras se verifica el listado"], "a": 0, "e": "«Sin demora» es el estándar."}, {"t": "mc", "q": "Según la Recomendación 32 del GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Un cliente solicita devolver una prima de seguro a una cuenta de un tercero. ¿Qué principio del GAFI y de la práctica aseguradora se pone en juego?", "o": ["Conocer origen, destino y relación entre las partes", "Respetar el secreto bancario del asegurado", "Proteger la libertad de disposición de los fondos", "Aplicar la reciprocidad entre instituciones"], "a": 0, "e": "Pagos a terceros requieren análisis."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en seguros, el estándar internacional concentra su atención en:", "o": ["Los productos de vida y con componente de inversión", "Los seguros obligatorios de responsabilidad civil", "El ramo de incendio y líneas aliadas", "Los seguros de transporte de carga"], "a": 0, "e": "Son los que permiten acumular y rescatar valor."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "vf", "q": "Según la Recomendación 11 del GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, cuando el país anfitrión de una filial es menos exigente que el país de origen, la filial debe aplicar:", "o": ["Las medidas del país de origen, en lo que el anfitrión permita", "Las medidas del país anfitrión, por el principio territorial", "Las medidas que elija la filial según su propio riesgo", "Las medidas del país anfitrión, informando a la matriz"], "a": 0, "e": "R.18. Trampa: el principio territorial."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}]}, {"titulo": "Normativa internacional · modelo 3", "q": [{"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["El cumplimiento técnico y la efectividad del sistema", "La existencia de leyes contra el lavado vigentes", "El número de condenas dictadas por lavado", "El tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Un sujeto obligado tiene dudas entre aplicar la LOCDOFT o la norma sectorial de SUDEASEG. ¿Cuál es la respuesta correcta?", "o": ["Ambas, porque la ley es el marco y la norma lo desarrolla", "La ley, porque prevalece siempre por jerarquía normativa", "La norma, porque es más específica y posterior a la ley", "La que el sujeto obligado elija libremente cada año"], "a": 0, "e": "Jerarquía y complementariedad."}, {"t": "mc", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Se integraron las nueve especiales en las cuarenta", "Se redujeron de cuarenta a veinticinco en total", "Se convirtieron en un tratado vinculante para todos", "Se limitaron a las instituciones del sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "Según la Recomendación 13 del GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "vf", "q": "Según la Recomendación 39 del GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "vf", "q": "Para el GAFI, el beneficiario de una póliza de vida puede considerarse un factor de riesgo relevante para decidir medidas intensificadas.", "a": true, "e": "Es un factor de riesgo."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, la experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "vf", "q": "Según la Recomendación 13 del GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, las medidas intensificadas frente a países de mayor riesgo alcanzan también a personas naturales y jurídicas de esos países, no solo a sus instituciones financieras.", "a": true, "e": "R.19. Trampa: se cree que solo alcanzan a la banca corresponsal."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, puede considerarse de menor riesgo una póliza de seguro de vida cuya prima anual no exceda de:", "o": ["USD/EUR 1.000", "USD/EUR 2.500", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.10, ejemplos de menor riesgo: prima anual de hasta USD/EUR 1.000 o prima única de hasta USD/EUR 2.500. Trampa: 2.500 es el límite de la prima única."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de seguros"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un reporte", "Aceptarlo con monitoreo posterior durante un año", "Iniciar la relación si el pago es por transferencia", "Exigir una garantía y mantener la relación vigente"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, cuando el tercero en quien se confía pertenece al mismo grupo financiero, la autoridad puede dar por cumplidos los requisitos si el grupo:", "o": ["Aplica controles de grupo bajo supervisión competente", "Tiene su casa matriz en un país miembro del GAFI", "Firmó un convenio de confidencialidad con el tercero", "Comparte una misma marca comercial en cada país"], "a": 0, "e": "R.17, supuesto de grupo. Trampa: la marca o la sede no sustituyen los controles de grupo supervisados."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Carecen de regulación legal en todos los países", "Resultan costosas para las instituciones financieras", "Están prohibidas en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "Un familiar de un ministro contrata una póliza. ¿Cómo lo trata el GAFI?", "o": ["Sus familiares y allegados también merecen medidas por riesgo", "Como cliente normal, sin considerar el parentesco", "Con rechazo automático por el parentesco con el ministro", "Ignorando el parentesco si el ministro no es el tomador"], "a": 0, "e": "Se extiende a su círculo cercano."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}]}]}, {"titulo": "Normativa prudencial del sector y sus guías", "exams": [{"titulo": "Normativa prudencial del sector y sus guías · modelo 1", "q": [{"t": "mc", "q": "La Providencia 209 de SUNAVAL se aplica a:", "o": ["Los sujetos regulados por el mercado de valores", "Las empresas de seguros, reaseguros y medicina prepagada", "Las casas de cambio y remesadoras", "Los casinos y salas de bingo"], "a": 0, "e": "Es la norma del sector valores."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el registro del oficial de cumplimiento ante la superintendencia se renueva:", "o": ["Cada tres años, pagando el 25 % de la tasa", "Cada cinco años, pagando el 25 % de la tasa", "Cada tres años, pagando el 50 % de la tasa", "Cada año, pagando el 25 % de la tasa inicial"], "a": 0, "e": "Art. 12. Trampa: se cambia el período o el porcentaje."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Informe de Ejecución del Plan Operativo Anual lo aprueba el oficial de cumplimiento antes de remitirlo.", "a": false, "e": "Art. 30: lo aprueba la junta directiva. Trampa: el oficial lo elabora, pero no lo aprueba."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿quién debe impartir la capacitación en materia de LC/FT al sector asegurador?", "o": ["Facilitadores inscritos en el RUF de la ONCDOFT", "Cualquier profesional con experiencia en seguros", "Exclusivamente el Oficial de Cumplimiento de la empresa", "Solo funcionarios de SUDEASEG designados para ello"], "a": 0, "e": "Art. 31. El RUF asegura idoneidad de los capacitadores."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el auditor externo solicita revisar los reportes de actividades sospechosas enviados. Corresponde:", "o": ["Negar el acceso a casos y reportes remitidos", "Permitirlo por su deber de independencia", "Autorizarlo con una orden del presidente", "Entregarlos con los nombres ocultos"], "a": 0, "e": "Los auditores externos no tienen acceso a ellos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si el supervisor considera insuficientes los mecanismos de una aseguradora, puede:", "o": ["Instruir los ajustes y correcciones necesarias", "Designar a su propio oficial de cumplimiento", "Revocar la licencia sin procedimiento previo", "Reportar el caso directamente al juez penal"], "a": 0, "e": "Art. 87. Potestad correctiva."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, recopilar las respuestas a las solicitudes de información de los organismos públicos corresponde a:", "o": ["La unidad de administración de riesgos", "El presidente, como representante legal", "La junta directiva del sujeto obligado", "Los intermediarios de seguros"], "a": 0, "e": "Art. 15, numeral 7. Trampa: se cree que lo hace la presidencia por ejercer la representación legal."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, para un nuevo cliente de mayor riesgo, NO figura entre los métodos adicionales de verificación que exige la norma:", "o": ["La declaración jurada notariada del cliente", "La visita al cliente en su domicilio", "Las comunicaciones telefónicas con el cliente", "La verificación independiente de su identidad"], "a": 0, "e": "Art. 40: visita, llamadas y verificación independiente. Trampa: se añade un método que suena formal."}, {"t": "mc", "q": "¿Quiénes están sujetos a la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Personas sometidas a la supervisión y control de SUDEASEG", "Personas sometidas a la supervisión y control de la UNIF", "Solo las empresas de seguros autorizadas para operar", "Toda empresa que contrate seguros con una aseguradora"], "a": 0, "e": "Incluye aseguradoras, reaseguradoras, corredores, financiadoras de primas, medicina prepagada, entre otros."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los auditores externos, respecto de los casos investigados y los reportes remitidos:", "o": ["No tienen acceso a ellos", "Tienen acceso pleno para su informe", "Acceden solo con permiso del cliente", "Acceden solo si lo pide la UNIF"], "a": 0, "e": "Art. 72. La confidencialidad del reporte es absoluta frente a terceros."}, {"t": "mc", "q": "Un gerente de una aseguradora prepara su manual de prevención basándose en la Providencia SAA-08-004-2021. ¿Qué observación corresponde?", "o": ["Derogada por la SAA-01-0536-2024; debe ajustarse a esa", "Sigue vigente para los manuales de las aseguradoras de seguros", "Sigue vigente solo para el reaseguro y la medicina prepagada", "Fue derogada por la LOCDOFT de 2012 al entrar en vigor"], "a": 0, "e": "Norma posterior sobre la misma materia deroga la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Oficial de Cumplimiento renuncia y la empresa queda sin él. ¿Cuál es la lógica de la norma?", "o": ["El presidente asume las funciones y avisa a SUDEASEG", "La función se suspende hasta designar a otro", "SUDEASEG designa directamente al nuevo oficial", "La función se retoma en la auditoría externa"], "a": 0, "e": "Art. 9. Continuidad de la función y transparencia con el supervisor."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento presenta a la junta directiva informes de gestión semestrales y anuales.", "a": true, "e": "Art. 13, numeral 9. Trampa: en turismo y criptoactivos los informes son trimestrales."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plan operativo se envía antes del cierre del ejercicio y su informe de ejecución después: son dos documentos y dos plazos distintos.", "a": true, "e": "Arts. 29 y 30. Es una confusión frecuente en los exámenes."}, {"t": "mc", "q": "¿Por qué la Providencia SAA-01-0536-2024 de SUDEASEG ubica al Oficial de Cumplimiento y al presidente en un nivel jerárquico equiparable, cada uno en su ámbito?", "o": ["Asegurar independencia y capacidad de objetar decisiones", "Duplicar controles sobre las decisiones del presidente", "Evitar que SUDEASEG supervise directamente al presidente", "Reflejar la jerarquía de cargos de la estructura comercial"], "a": 0, "e": "La independencia es esencial para que funcione la función de cumplimiento."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo. Trampa: se invierte un solo adjetivo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, para ahorrar, la firma de auditoría externa propone ejecutar también el programa anual de seguimiento. Debe rechazarse porque:", "o": ["Se evaluaría a sí misma", "Solo la junta puede ejecutarlo", "Solo la superintendencia lo ejecuta", "El programa no admite proveedores"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el auditor externo que elabora el informe anual no puede ser contratado por más de:", "o": ["Dos ejercicios fiscales consecutivos", "Un solo ejercicio fiscal", "Tres ejercicios fiscales consecutivos", "Cinco ejercicios fiscales consecutivos"], "a": 0, "e": "Art. 75. Rotación para preservar la independencia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual debe estar a disposición de los empleados vinculados con el sistema, como medio de consulta.", "a": true, "e": "Art. 28. Trampa: se cree que es un documento reservado a la junta y al oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva debe aprobar el monto de recursos para la materia:", "o": ["Anualmente, de forma específica e identificable en el presupuesto", "Anualmente, dentro de la partida general de gastos de la empresa", "Cada tres años, junto con la renovación del registro del oficial", "Cuando lo solicite por escrito el oficial de cumplimiento"], "a": 0, "e": "Art. 8, num. 2. Trampa: no basta una partida general."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una persona expuesta políticamente de una organización internacional recibe medidas menos exigentes que una PEP nacional.", "a": false, "e": "Art. 51: recibe las mismas medidas. Trampa: se crea una diferencia que no existe."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), el siniestro se paga a un tercero sin relación aparente con el asegurado, con documentos poco claros. ¿Qué debe hacer la aseguradora?", "o": ["Analizar, verificar la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente exige firmar él mismo cada reporte de sospecha antes de que salga. Ese requisito:", "o": ["Vulnera la autonomía para reportar", "Cumple el control dual del sistema", "Es válido si lo aprueba la junta", "Es válido para reportes de alto monto"], "a": 0, "e": "No se puede negar ni condicionar la remisión."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una sociedad de corretaje detecta una operación sospechosa y alega que no tiene unidad de administración de riesgos. Esa ausencia:", "o": ["No la exime de informar", "La exime de todo reporte", "Traslada el deber a la aseguradora", "Obliga a constituir la unidad antes"], "a": 0, "e": "No están obligadas a conformarla, pero sí a informar."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado lee en un manual interno la Providencia SAA-01-0530-2024 como norma de prevención. Debe corregirse porque esa providencia regula:", "o": ["El buen gobierno corporativo", "La actividad de reaseguro", "Los reportes sistemáticos", "La medicina prepagada"], "a": 0, "e": "La norma de riesgos es la SAA-01-0536-2024."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, además de la declaración jurada de origen de fondos, presentan la declaración de conocimiento en materia de AR/LC/FT/FPADM:", "o": ["Solo los intermediarios personas naturales", "Solo los intermediarios personas jurídicas", "Todos los intermediarios autorizados", "Solo las sociedades de corretaje inscritas"], "a": 0, "e": "Art. 59. Trampa: la declaración de origen la presentan todos; la de conocimiento, solo las personas naturales."}, {"t": "mc", "q": "¿Qué relación guarda la Providencia SAA-01-0536-2024 de SUDEASEG con la LOCDOFT?", "o": ["Desarrolla los deberes de la ley y no puede contradecirla", "La Norma deroga las disposiciones de la LOCDOFT para el sector", "La LOCDOFT no se aplica al sector asegurador por su norma", "Ambas se aplican de forma alternativa, a elección del sujeto"], "a": 0, "e": "Principio de jerarquía: la ley está por encima de la providencia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el formulario del expediente del reasegurador lo suscribe el oficial de cumplimiento de la aseguradora cedente.", "a": false, "e": "Art. 61, num. 1: lo suscribe el oficial de la reaseguradora. Trampa: se cambia de empresa al firmante."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, vencidos los diez días para designar al nuevo oficial, la empresa ya usó una prórroga. Puede:", "o": ["No pedir otra, porque solo se admite una vez", "Pedir otra, si la justifica ante la junta", "Dejar el cargo vacante hasta la asamblea", "Pedir prórrogas hasta cubrir sesenta días"], "a": 0, "e": "El plazo es prorrogable una sola vez."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "Art. 36. La sospecha desplaza la clasificación previa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando el contrato se celebra mediante intermediario, identificar y verificar los datos del tomador corresponde solo a la aseguradora.", "a": false, "e": "Art. 49: los intermediarios asumen esa obligación. Trampa: se excluye a un sujeto que la norma incluye."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la unidad de administración de riesgos es siempre obligatoria para las empresas de seguros.", "a": false, "e": "Art. 7, num. 2: pueden prescindir de ella según su autoevaluación; lo obligatorio es designar al oficial y a los responsables (num. 1). Trampa: se extiende la obligación."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la aprobación de la junta directiva para un cliente PEP se limita al inicio de la relación comercial.", "a": false, "e": "Art. 51: inicio, permanencia y pago de prestaciones en vida o productos de inversión. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la identificación del beneficiario final en personas y estructuras jurídicas exige:", "o": ["Llegar a la persona natural que ejerce el control", "Identificar al representante legal inscrito", "Conocer al accionista mayoritario formal", "Verificar el domicilio fiscal de la sociedad"], "a": 0, "e": "Art. 41. Se levanta el velo societario."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, pueden impartir la capacitación los facilitadores inscritos en el RUF aunque no estén acreditados en el sector asegurador.", "a": false, "e": "Art. 31: deben estar inscritos en el RUF y acreditados en el sector asegurador. Trampa: se elimina el segundo requisito."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual se remite a la superintendencia en formato físico y digital.", "a": false, "e": "Art. 29: en formato digital. Trampa: físico y digital es la regla de conservación de documentos."}, {"t": "mc", "q": "Una aseguradora funda un procedimiento en el decreto-ley de 2015 sin considerar la reforma de 2023. El riesgo es:", "o": ["Aplicar un texto que ya fue modificado", "Aplicar una norma de otro sector", "Aplicar una norma aún no vigente", "Ninguno, porque el texto no cambió"], "a": 0, "e": "Error de actualización normativa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma vigente entró en vigencia sesenta días después de su publicación en Gaceta Oficial.", "a": false, "e": "Art. 91: entró en vigencia desde su publicación. Trampa: la de turismo sí tiene sesenta días de vacatio."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe notificar la designación o salida del oficial de cumplimiento dentro de:", "o": ["Cinco días hábiles", "Tres días continuos", "Quince días hábiles", "Treinta días continuos"], "a": 0, "e": "Art. 9, numeral 4. Plazo corto para que el supervisor conozca al responsable."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en materia de capacitación, supervisar los programas corresponde al presidente, coordinarlos al oficial y ejecutarlos a:", "o": ["La unidad de administración de riesgos", "Los responsables de cumplimiento", "El área de talento humano", "La junta directiva"], "a": 0, "e": "Arts. 9, num. 3; 13, num. 4; y 15, num. 6. Trampa: cada nivel tiene un verbo distinto."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el comportamiento y el nivel de vida de empleados e intermediarios, cuando no concuerdan con sus ingresos, puede ser una señal de alerta interna.", "a": true, "e": "Arts. 58 y 66. El riesgo también viene de adentro."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar el inicio de la relación con una compañía constituida en un país que no aplica regulaciones similares corresponde a:", "o": ["La junta directiva o el órgano equivalente", "El oficial de cumplimiento, previo informe", "El presidente, con aviso a la superintendencia", "La unidad de riesgos LC/FT de la empresa"], "a": 0, "e": "Art. 38. Trampa: el oficial analiza, pero no aprueba."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la inscripción del oficial debe renovarse con actualización de recaudos en un período menor que los cinco años de la condición PEP.", "a": true, "e": "Renovación cada tres años."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las operaciones que el auditor externo detecte como posiblemente sospechosas deben:", "o": ["Notificarse por escrito al oficial para que decida", "Reportarse por el propio auditor a la UNIF", "Incluirse solo en el Informe Anual del auditor", "Comunicarse a la junta para que decida el reporte"], "a": 0, "e": "Art. 72. Trampa: el auditor no reporta a la UNIF ni la junta decide el reporte."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora lanza un seguro digital vendido solo por una aplicación móvil. Desde la lógica de la autoevaluación de riesgo, ¿qué debe hacer antes de lanzarlo?", "o": ["Evaluar el riesgo del producto y definir controles", "Lanzarlo y evaluar el riesgo en la próxima autoevaluación", "Esperar a la inspección de SUDEASEG para ajustarlo", "Pedir autorización previa a la UNIF para comercializarlo"], "a": 0, "e": "Art. 13, numeral 10. Productos y canales nuevos exigen evaluación previa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Evaluación y Control es de uso restringido y confidencial.", "a": true, "e": "Art. 71. Trampa: se cree que se remite a la superintendencia; solo debe estar disponible en las inspecciones."}, {"t": "mc", "q": "¿Qué diferencia hay entre la debida diligencia simplificada, mejorada e intensificada según la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Se gradúan por riesgo: bajo, moderado y alto respectivamente", "Se gradúan por el monto: menor, medio y mayor de la prima", "Se gradúan por nacionalidad: nacional, residente y extranjero", "Son sinónimos aplicables según la preferencia de la empresa"], "a": 0, "e": "Gradación por riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se mantiene aunque surjan sospechas, mientras el cliente siga siendo de riesgo bajo en el sistema.", "a": false, "e": "Art. 36. Ante sospecha no se permite DD simplificada."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una empresa envía el plan operativo un mes después del cierre del ejercicio, junto con su informe de ejecución. El error es:", "o": ["El plan debe enviarse antes del cierre", "El informe debe enviarse antes que el plan", "Ambos deben enviarse en un solo documento", "El plan no se remite a la superintendencia"], "a": 0, "e": "El plan se remite dentro de los cuarenta y cinco días previos al cierre."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, una aseguradora recibe una póliza cuyo tomador es una OSFL que recibe donaciones de varias jurisdicciones. ¿Cuál es el tratamiento adecuado?", "o": ["Entender su propósito y el origen y destino de los fondos", "Rechazarla por recibir donaciones del exterior", "Aceptarla sin ningún análisis por no tener fines de lucro", "Notificar a la UNIF cada donación que reciba"], "a": 0, "e": "Las OSFL no son malas per se; son vulnerables."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 2", "q": [{"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo bajo realiza de pronto pagos inexplicablemente altos en efectivo
