"La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo alto exige que se actualicen sus datos con frecuencia no mayor a:", "o": ["Un año", "Dos años", "Tres años", "Cinco años"], "a": 0, "e": "Art. 39. Regla del sector asegurador."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el origen de los fondos y el origen de la riqueza son el mismo concepto.", "a": false, "e": "Fondos: de dónde viene el dinero de la operación. Riqueza: cómo se formó el patrimonio total. Trampa: se usan como sinónimos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), que un tercero sin vínculo aparente pague la prima de un asegurado exige:", "o": ["Identificar al pagador y entender la relación", "Rechazar el pago sin más análisis", "Aceptarlo si el monto es moderado", "Trasladar la póliza a nombre del pagador"], "a": 0, "e": "El origen de los fondos forma parte del conocimiento."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Su monto reducido por cada operación", "El volumen total vendido en el año", "El país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), los roles de primera y segunda línea pueden combinarse o separarse según la organización.", "a": true, "e": "Modelo de las tres líneas (2020): no es una estructura rígida. Trampa: se cree que son compartimentos estancos."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), una persona natural que recibe siniestros de múltiples pólizas de empresas distintas, sin relación evidente, genera:", "o": ["Señal de alerta de posible esquema de fraude o lavado", "Patrón normal para una persona asegurada", "Cliente de riesgo bajo por su historial de siniestros", "Compensación habitual entre empresas aseguradas"], "a": 0, "e": "Patrones anómalos requieren análisis."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, el análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, las políticas y controles del sujeto obligado deben permitir, además de gestionar los riesgos identificados:", "o": ["Vigilar su aplicación y reforzarlos si hace falta", "Eliminar por completo los riesgos de la cartera", "Trasladar los riesgos residuales al supervisor", "Prescindir de la evaluación del año siguiente"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: no es un enfoque de riesgo cero ni se traslada la responsabilidad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la comunicación y consulta con las partes interesadas forma parte del proceso de gestión del riesgo.", "a": true, "e": "Apartado 6.2. Trampa: se cree que es un ejercicio técnico interno sin consulta."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), el rescate anticipado de una póliza poco después de contratarla es señal de alerta porque:", "o": ["Sugiere que el objetivo era mover el dinero, no asegurarse", "Indica insatisfacción con el servicio", "Implica una pérdida económica para la aseguradora emisora", "Demuestra falta de capacidad de pago"], "a": 0, "e": "Patrón típico de colocación e integración."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el riesgo se define como:", "o": ["El efecto de la incertidumbre sobre los objetivos", "La probabilidad de que ocurra una pérdida económica", "La suma de las amenazas y vulnerabilidades conocidas", "El daño que causa un evento ya materializado"], "a": 0, "e": "Definición de la norma. Trampa: las otras confunden riesgo con pérdida o con sus componentes."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un asegurado con varias pólizas pequeñas en distintas compañías que suman una cifra elevada muestra:", "o": ["Un posible fraccionamiento entre entidades", "Una estrategia prudente de diversificación", "Un error del sistema de suscripción", "Una conducta irrelevante para el análisis"], "a": 0, "e": "El fraccionamiento también ocurre entre empresas."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la auditoría interna rinde cuentas al órgano de gobierno y es independiente de la gestión.", "a": true, "e": "Modelo de las tres líneas (2020). Trampa: se cree que depende de la gerencia general."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un cliente usa varias pólizas de distintas aseguradoras con sumas bajas que sumadas son altas. ¿Qué técnica describe?", "o": ["Estructuración o fraccionamiento", "Diversificación patrimonial", "Cobertura de riesgos", "Reaseguro de la cartera"], "a": 0, "e": "Evadir umbrales."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las empresas que manejan mucho efectivo figuran entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el riesgo depende solo del monto de cada operación."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), el cambio frecuente de beneficiarios en una póliza de vida es señal de alerta porque:", "o": ["Puede encubrir el traslado de valor a terceros", "Encarece la administración y el control de la póliza", "Dificulta el cálculo de la reserva", "Retrasa el pago de las comisiones"], "a": 0, "e": "El beneficiario es parte del análisis de riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), ¿por qué el seguro de prima única es considerado de mayor riesgo?", "o": ["Permite colocar una suma y rescatarla como lícita", "Es un seguro barato sin documentación exigida", "Se paga mensualmente sin verificar al cliente", "Es obligatorio para cierto tipo de clientes"], "a": 0, "e": "Colocación y recuperación rápidas."}, {"t": "mc", "q": "Según la LOCDOFT, ¿qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "Art. 4, numeral 2. El análisis media entre ambas."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, los contadores públicos en libre ejercicio son sujetos obligados cuando realizan para un cliente, entre otras, la compraventa de inmuebles o la administración de su dinero.", "a": true, "e": "LOCDOFT, art. 9, numeral 9: abogados, administradores, economistas y contadores en libre ejercicio, cuando realicen esas transacciones para un cliente."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los oficiales de cumplimiento y los auditores externos en materia de LC/FT/FPADM se consideran sujetos regulados.", "a": true, "e": "LAA, art. 3: «Se consideran también sujetos regulados: los actuarios independientes; los defensores del tomador...; los oficiales de cumplimiento y los auditores externos»."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los actuarios independientes no tienen la condición de sujetos regulados.", "a": false, "e": "LAA, art. 3: los actuarios independientes se consideran también sujetos regulados."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los fondos de garantía de la Administración Pública Nacional que realicen actividad aseguradora quedan exceptuados de esa disposición.", "a": true, "e": "LAA, art. 3: se exceptúan los fondos de garantía de la Administración Pública Nacional, sin perjuicio de su deber de cooperación con la Superintendencia."}, {"t": "vf", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, el sistema integral de administración de riesgos de LC/FT/FPADM lo adopta cada sujeto regulado en función de su nivel de riesgo.", "a": true, "e": "LAA, art. 4, num. 27: «Conjunto de normas y políticas adoptadas y ejecutadas por los sujetos regulados, en función de su nivel de riesgo...»."}, {"t": "vf", "q": "Según el artículo 8, numeral 3, de la Ley de la Actividad Aseguradora, corresponde al Superintendente emitir los lineamientos de evaluación y administración integral de riesgos de LC/FT/FPADM de los sujetos regulados.", "a": true, "e": "LAA, art. 8, num. 3."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de oficiales de cumplimiento equivale a ciento cincuenta (150) veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 12, numeral 6."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los auditores externos en materia de activos de información están exceptuados de la tasa de inscripción prevista para los auditores externos.", "a": true, "e": "LAA, art. 12, numeral 4: «Se exceptúan los auditores externos en materia de activos de información»."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los registros allí previstos deben renovarse cada cinco (5) años.", "a": false, "e": "LAA, art. 12: los registros se renuevan cada tres (3) años."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, para renovar el registro el interesado paga el veinticinco por ciento (25 %) de la tasa de su inscripción.", "a": true, "e": "LAA, art. 12, penúltimo aparte."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, el Ministro de Finanzas puede ajustar las tasas, pero un incremento no puede superar la mitad de los montos previstos.", "a": false, "e": "LAA, art. 12: el incremento no puede ser superior a las dos terceras (2/3) partes de las tasas previstas."}, {"t": "vf", "q": "Según el artículo 19 de la Ley de la Actividad Aseguradora, la solicitud de autorización de una empresa de seguros debe contar, entre otros, con los manuales de gobierno corporativo y de administración integral de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 19."}, {"t": "vf", "q": "Según el artículo 59 de la Ley de la Actividad Aseguradora, la composición y el funcionamiento del sistema integral de administración de riesgos de LC/FT/FPADM se rigen por las normas que dicte la UNIF.", "a": false, "e": "LAA, art. 59: se rigen por las normas que dicte la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 60 de la Ley de la Actividad Aseguradora, la Superintendencia de la Actividad Aseguradora tiene dentro de su propia estructura un sistema integral de administración de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 60."}, {"t": "vf", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, el Superintendente puede imponer medidas administrativas si las operaciones contravienen la normativa de LC/FT/FPADM de tal manera que comprometan el equilibrio del sistema financiero nacional.", "a": true, "e": "LAA, art. 85, numeral 5."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento en el diseño, implementación y funcionamiento del sistema integral de LC/FT/FPADM se sanciona con multa de 25.000 a 50.000 veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 126, numeral 4."}, {"t": "vf", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, quien falsee el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM puede ser sancionado con multa y prohibición de ejercer la actividad aseguradora hasta por diez (10) años.", "a": true, "e": "LAA, art. 132: multa de 50.000 a 100.000 veces el tipo de cambio de referencia y prohibición hasta por diez años."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte, falsee o altere información de operaciones relacionadas con LC/FT/FPADM puede ser excluido del registro por un lapso de uno (1) a cinco (5) años.", "a": true, "e": "LAA, art. 138, numeral 3: multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión de uno a cinco años."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, sus normas buscan administrar los riesgos de LC, FT y FPADM, pero no los de otros ilícitos.", "a": false, "e": "Providencia SAA-01-0536-2024, art. 1: incluye expresamente «cometer otros ilícitos»."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia SAA-01-0536-2024, quedan sujetas a la norma solo las empresas de seguros y de reaseguros.", "a": false, "e": "Art. 3: quedan sujetas todas las personas naturales y jurídicas sometidas a la supervisión de la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, dentro de la estructura del sistema el oficial de cumplimiento y el presidente se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Providencia SAA-01-0536-2024, art. 7."}, {"t": "vf", "q": "Según el artículo 7, numeral 2, de la Providencia SAA-01-0536-2024, las empresas de seguros pueden conformar la estructura sin la Unidad de AR/LC/FT/FPADM, en función de los resultados de su autoevaluación de riesgo.", "a": true, "e": "Art. 7, num. 2. La Superintendencia puede determinar en la inspección si la estructura es suficiente."}, {"t": "vf", "q": "Según el artículo 7, numeral 3, de la Providencia SAA-01-0536-2024, las sociedades de corretaje de seguros están obligadas a conformar la Unidad de AR/LC/FT/FPADM.", "a": false, "e": "Art. 7, num. 3: no están obligadas, aunque deben suministrar a la Superintendencia la información que les solicite."}, {"t": "vf", "q": "Según el artículo 7, numeral 4, de la Providencia SAA-01-0536-2024, el representante de la sucursal de una empresa de reaseguros del exterior debe ser designado responsable de cumplimiento por la casa matriz.", "a": true, "e": "Art. 7, num. 4."}, {"t": "vf", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, la junta directiva debe aprobar anualmente un monto de recursos financieros específico e identificable dentro del presupuesto general.", "a": true, "e": "Art. 8, num. 2."}, {"t": "vf", "q": "Según el artículo 8, numeral 9, de la Providencia SAA-01-0536-2024, aprobar la designación de los miembros de la Unidad y de los responsables de cumplimiento corresponde al presidente.", "a": false, "e": "Art. 8, num. 9: corresponde a la junta directiva o al órgano equivalente. El oficial los propone (art. 13, num. 12)."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente debe notificar a la Superintendencia la designación, renuncia o ausencia del oficial de cumplimiento dentro de los cinco (5) días hábiles siguientes.", "a": true, "e": "Art. 9, num. 4."}, {"t": "vf", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, la nueva designación debe coordinarse en un lapso no mayor de diez (10) días hábiles, prorrogable una sola vez por un lapso igual.", "a": true, "e": "Art. 9, num. 6."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta directamente a la junta directiva o al órgano equivalente."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, las decisiones del oficial de cumplimiento son de observancia obligatoria para todos los ejecutivos y empleados, previa aprobación de la junta directiva.", "a": true, "e": "Art. 10, segundo aparte."}, {"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, para optar al cargo de oficial de cumplimiento se deben cursar los programas de formación académica que imparte la Superintendencia de la Actividad Aseguradora.", "a": true, "e": "Art. 11, num. 3."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia SAA-01-0536-2024, la autorización del oficial de cumplimiento será revocada cuando haya sido sancionado conforme al artículo 138 de la ley que rige la actividad aseguradora.", "a": true, "e": "Art. 12, último aparte."}, {"t": "vf", "q": "Según el artículo 13, numeral 14, de la Providencia SAA-01-0536-2024, el oficial de cumplimiento analiza las operaciones inusuales y, de ser el caso, elabora y remite el reporte de actividades sospechosas a la UNIF.", "a": true, "e": "Art. 13, num. 14."}, {"t": "vf", "q": "Según el artículo 16 de la Providencia SAA-01-0536-2024, los responsables de cumplimiento se designan individualmente por escrito y cumplen esas funciones además de las propias de su cargo.", "a": true, "e": "Art. 16."}, {"t": "vf", "q": "Según el artículo 17, numeral 4, de la Providencia SAA-01-0536-2024, si un responsable de cumplimiento no conoció operaciones inusuales en el mes anterior, debe notificarlo así a la Unidad y al oficial.", "a": true, "e": "Art. 17, num. 4."}, {"t": "vf", "q": "Según el artículo 19 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo."}, {"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se remite a la Superintendencia dentro de los sesenta (60) días continuos siguientes al cierre del ejercicio, previa aprobación de la junta directiva y certificación del auditor interno.", "a": true, "e": "Art. 20."}, {"t": "mc", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, ¿cómo se define el sistema integral de administración de riesgos de LC/FT/FPADM?", "o": ["Normas y políticas que adopta el sujeto regulado, según su riesgo, para mitigar el uso ilícito de sus productos, servicios, clientes y canales", "Normas que dicta la Superintendencia y que todo sujeto regulado aplica de forma idéntica, sin considerar su propio nivel de riesgo", "Políticas que adopta la UNIF para vigilar, según su riesgo, el uso de los productos, servicios, clientes y canales de los sujetos regulados", "Procedimientos de la auditoría externa para certificar cada año los productos, servicios, clientes y canales del sujeto regulado"], "a": 0, "e": "LAA, art. 4, num. 27. El examen de la ONCDOFT lo cita como artículo 2; en el texto publicado en la G.O. 6.770 Extraordinario es el artículo 4, numeral 27."}, {"t": "mc", "q": "Según el artículo 12, numeral 4, de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de auditores externos, incluidos los de LC/FT/FPADM, es de:", "o": ["Ciento cincuenta (150) veces el tipo de cambio de referencia", "Cien (100) veces el tipo de cambio de referencia", "Setenta y cinco (75) veces el tipo de cambio de referencia", "Treinta (30) veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 12, num. 4. Cien veces es la de actuarios; setenta y cinco, la de auxiliares personas naturales; treinta, el examen de agente."}, {"t": "mc", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, ¿cada cuánto se renueva el registro del oficial de cumplimiento y cuánto se paga?", "o": ["Cada tres años, el 25 % de la tasa de inscripción", "Cada tres años, el 50 % de la tasa de inscripción", "Cada cinco años, el 25 % de la tasa de inscripción", "Cada dos años, la tasa de inscripción completa"], "a": 0, "e": "LAA, art. 12, en concordancia con el art. 12 de la Providencia SAA-01-0536-2024."}, {"t": "mc", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, la multa por incumplir las obligaciones en materia de administración de riesgos de LC/FT/FPADM va de:", "o": ["25.000 a 50.000 veces el tipo de cambio de referencia", "10.000 a 25.000 veces el tipo de cambio de referencia", "5.000 a 20.000 veces el tipo de cambio de referencia", "50.000 a 100.000 veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 126, num. 4. De 50.000 a 100.000 es la multa del art. 132 por falsear información."}, {"t": "mc", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte o altere información de operaciones de LC/FT/FPADM puede ser sancionado con:", "o": ["Multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión del registro de uno a cinco años", "Multa de 25.000 a 50.000 veces el tipo de cambio de referencia y exclusión definitiva del registro de oficiales", "Amonestación escrita y suspensión del registro por seis meses, sin perjuicio de las sanciones penales", "Multa de 50.000 a 100.000 veces el tipo de cambio de referencia, sin exclusión del registro de oficiales"], "a": 0, "e": "LAA, art. 138, num. 3."}, {"t": "mc", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, falsear el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM se sanciona con:", "o": ["Multa de 50.000 a 100.000 veces el tipo de cambio y prohibición de ejercer hasta por diez años", "Multa de 25.000 a 50.000 veces el tipo de cambio y suspensión de la autorización por un año", "Multa de 5.000 a 10.000 veces el tipo de cambio y exclusión del registro de uno a cinco años", "Solo la amonestación pública, sin perjuicio de las sanciones penales a que haya lugar"], "a": 0, "e": "LAA, art. 132."}, {"t": "mc", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, ¿cuándo puede el Superintendente imponer medidas administrativas por razones de LC/FT/FPADM?", "o": ["Cuando las operaciones contravengan esa normativa de modo que comprometan el equilibrio del sistema financiero nacional", "Cuando el sujeto regulado remita con un solo día de retraso cualquier reporte de actividad sospechosa a la UNIF", "Cuando el oficial de cumplimiento renuncie y la empresa no notifique el hecho a la Superintendencia ese mismo día", "Cuando la empresa reciba del Ministerio Público una solicitud de información sobre cualquiera de sus clientes"], "a": 0, "e": "LAA, art. 85, num. 5."}, {"t": "mc", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, queda exceptuado de esa disposición:", "o": ["El fondo de garantía de la Administración Pública Nacional que realice actividad aseguradora", "El actuario independiente que presta servicios técnicos a empresas de seguros y de reaseguros", "El oficial de cumplimiento inscrito en el registro que lleva la Superintendencia del sector", "El auditor externo en materia de LC/FT/FPADM inscrito en el registro de la Superintendencia"], "a": 0, "e": "LAA, art. 3. Los otros tres son sujetos regulados."}, {"t": "mc", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, ¿qué riesgos deben administrar los sujetos obligados?", "o": ["LC, FT, FPADM y otros ilícitos", "Solo LC y FT", "LC, FT y FPADM, sin otros ilícitos", "Solo los riesgos operativos y reputacionales"], "a": 0, "e": "Providencia SAA-01-0536-2024, art. 1."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia SAA-01-0536-2024, ¿cuál de estos NO figura entre los principios bajo los cuales se aplican las políticas?", "o": ["Rentabilidad", "Autorregulación", "Proporcionalidad", "Transparencia"], "a": 0, "e": "Art. 2: debida diligencia, autorregulación, buena fe, razonabilidad, confianza, proporcionalidad, adecuación y transparencia."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quiénes integran el sistema integral de AR/LC/FT/FPADM y otros ilícitos?", "o": ["Junta directiva, presidente, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y responsables de cumplimiento", "Junta directiva, auditor externo, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y consultoría jurídica", "Asamblea de accionistas, presidente, oficial de cumplimiento, auditor interno y responsables de cumplimiento", "Presidente, oficial de cumplimiento, comité de riesgos, auditor externo y responsables de cumplimiento"], "a": 0, "e": "Art. 7."}, {"t": "mc", "q": "Según el artículo 7, numeral 1, de la Providencia SAA-01-0536-2024, la designación del oficial de cumplimiento y de los responsables es:", "o": ["Obligatoria para todos los sujetos obligados", "Temporal, solo durante el primer año de registro", "Opcional, según el volumen de transacciones", "Exclusiva de empresas con más de cincuenta empleados"], "a": 0, "e": "Art. 7, num. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quién puede ordenar la conformación de la Unidad function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){

function start(gi,ei){
