 "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "mc", "q": "Una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "vf", "q": "El financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "Según el GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "Un directivo cree que SUDEASEG recibe los ROS del sector asegurador. ¿Qué debe aclararle un oficial de cumplimiento?", "o": ["Los ROS van a la UNIF; SUDEASEG supervisa", "Los ROS van a SUDEASEG y esta los remite a la UNIF", "Los ROS van a la ONCDOFT por ser órgano rector", "Los ROS van directamente al tribunal de control"], "a": 0, "e": "Reparto institucional."}, {"t": "mc", "q": "Un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "En seguros, el estándar internacional concentra su atención en:", "o": ["Los productos de vida y con componente de inversión", "Los seguros obligatorios de responsabilidad civil", "El ramo de incendio y líneas aliadas", "Los seguros de transporte de carga"], "a": 0, "e": "Son los que permiten acumular y rescatar valor."}, {"t": "mc", "q": "Un supervisor encuentra que una aseguradora ha reportado cero ROS en cinco años pese a un volumen alto de operaciones. ¿Qué lectura es razonable?", "o": ["Posibles fallas de detección o de reporte", "Cartera limpia sin riesgo de lavado", "Mérito que reconoce el supervisor en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Según el GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "vf", "q": "Según el GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "mc", "q": "Si un ROS se envía con información incompleta o errónea, ¿qué consecuencia tiene?", "o": ["Reduce la utilidad de la inteligencia", "Equivale a no haber reportado", "Anula la protección legal del reportante", "Traslada el análisis al órgano de control"], "a": 0, "e": "La calidad importa."}, {"t": "mc", "q": "Una aseguradora detecta que un tomador figura en una lista de designados por la ONU. ¿Qué principio rige?", "o": ["Congelar sin demora y notificar sin avisar al cliente", "Consultar al cliente antes de adoptar medidas", "Esperar una orden judicial para congelar", "Continuar el contrato mientras se verifica el listado"], "a": 0, "e": "«Sin demora» es el estándar."}, {"t": "mc", "q": "El autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "mc", "q": "Un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Según el GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "mc", "q": "Un cliente solicita devolver una prima de seguro a una cuenta de un tercero. ¿Qué principio del GAFI y de la práctica aseguradora se pone en juego?", "o": ["Conocer origen, destino y relación entre las partes", "Respetar el secreto bancario del asegurado", "Proteger la libertad de disposición de los fondos", "Aplicar la reciprocidad entre instituciones"], "a": 0, "e": "Pagos a terceros requieren análisis."}, {"t": "vf", "q": "Las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "Una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "vf", "q": "Según el GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según el GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "vf", "q": "Según el GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "vf", "q": "Según el GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "vf", "q": "Según el GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["Cumplimiento técnico y efectividad del sistema", "Solo si el país tiene leyes contra el lavado vigentes", "Solo el número de condenas dictadas por lavado", "Solo el tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "mc", "q": "Según el GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "Un sujeto obligado tiene dudas entre aplicar la LOCDOFT o la norma sectorial de SUDEASEG. ¿Cuál es la respuesta correcta?", "o": ["Ambas: la ley es el marco, la norma lo desarrolla", "Solo la ley, por jerarquía normativa", "Solo la norma, por ser más específica", "La que el sujeto obligado elija libremente cada año"], "a": 0, "e": "Jerarquía y complementariedad."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de información de una autoridad extranjera por vía no oficial. ¿Qué debe hacer?", "o": ["Canalizarla por mecanismos oficiales", "Responder directamente para colaborar", "Ignorarla por provenir del extranjero", "Informar al cliente de la solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según el GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "vf", "q": "Según el GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de seguros"], "a": 0, "e": "También protege al reportante."}, {"t": "vf", "q": "Para el GAFI, el beneficiario de una póliza de vida puede considerarse un factor de riesgo relevante para decidir medidas intensificadas.", "a": true, "e": "Es un factor de riesgo."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}]}, {"titulo": "Normativa internacional · modelo 3", "q": [{"t": "vf", "q": "Según el GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "Si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "mc", "q": "Según el GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "mc", "q": "Según el GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Responde por todo incumplimiento ocurrido durante su gestión", "Responde en lo administrativo, pero no en lo penal ni civil", "Responde la junta directiva, pues el oficial solo recomienda"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "vf", "q": "Según el GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según el GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según el GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "Según el GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "vf", "q": "Según el GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "vf", "q": "Según el GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "mc", "q": "Según el GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Para el GAFI, la debida diligencia sobre el beneficiario de una póliza de vida debe realizarse a más tardar:", "o": ["Al momento del pago", "Al contratar la póliza únicamente", "Al renovarla cada año", "Cuando se cancela la póliza"], "a": 0, "e": "Antes de pagar la prestación."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "mc", "q": "Según el GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "vf", "q": "Según el GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según el GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "Según el GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "El «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Son nuevas y aún no están reguladas por ley", "Son costosas para las instituciones financieras", "Son ilegales en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "mc", "q": "Un familiar de un ministro contrata una póliza. ¿Cómo lo trata el GAFI?", "o": ["Sus familiares y allegados también merecen medidas por riesgo", "Como cliente normal, sin considerar el parentesco", "Con rechazo automático por el parentesco con el ministro", "Ignorando el parentesco si el ministro no es el tomador"], "a": 0, "e": "Se extiende a su círculo cercano."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "vf", "q": "Según el GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "vf", "q": "Según el GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según el GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "Según el GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "vf", "q": "Según el GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "vf", "q": "Según el GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "mc", "q": "¿Qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "Según el GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Tanto al comprador como al vendedor", "Solo al comprador, que aporta los fondos", "Solo al vendedor, que recibe los fondos", "Solo a quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}]}]}, {"titulo": "Normativa prudencial del sector y sus guías", "exams": [{"titulo": "Normativa prudencial del sector y sus guías · modelo 1", "q": [{"t": "mc", "q": "El programa anual de seguimiento, evaluación y control no puede ser ejecutado por:", "o": ["La firma que hace la auditoría externa del sujeto", "El oficial de cumplimiento de la empresa", "Los responsables de cumplimiento de cada una de las áreas", "La unidad de administración de riesgos"], "a": 0, "e": "Evita que el auditor evalúe su propio trabajo."}, {"t": "mc", "q": "El sistema de administración de riesgos debe diseñarse considerando, entre otros elementos:", "o": ["Estructura, clientes, productos, canales y tecnologías", "Solo el capital social y el monto de las reservas técnicas", "Solo el número de pólizas emitidas al año", "Solo la ubicación de la casa matriz"], "a": 0, "e": "El diseño es a la medida del sujeto obligado."}, {"t": "mc", "q": "La identificación del beneficiario final en personas y estructuras jurídicas exige:", "o": ["Llegar a la persona natural que ejerce el control", "Identificar al representante legal inscrito", "Conocer al accionista mayoritario formal", "Verificar el domicilio fiscal de la sociedad"], "a": 0, "e": "Se levanta el velo societario."}, {"t": "mc", "q": "Un compañero cita la Resolución 083.18 para fundamentar una obligación de una aseguradora. El error es que esa resolución:", "o": ["Es del sector bancario, no del asegurador", "Está derogada desde el año 2021", "Es una guía sin carácter obligatorio", "Corresponde al mercado de valores"], "a": 0, "e": "Cada sector tiene su norma; citar la ajena es un error frecuente."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un proveedor externo ofrece verificar identidades, hallar beneficiarios finales y analizar alertas. La empresa puede:", "o": ["Tercerizar solo tareas de apoyo, no esas", "Tercerizarlas si responde el proveedor", "Tercerizarlas si lo aprueba la junta", "Tercerizarlas si avisa a la superintendencia"], "a": 0, "e": "Funciones medulares no tercerizables; la responsabilidad no se delega."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, la suficiencia de la estructura del sistema de una empresa de seguros puede ser determinada por la superintendencia:", "o": ["Durante los procedimientos de inspección", "Al autorizar el manual de políticas", "Al recibir la autoevaluación anual", "Al inscribir al oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2. Trampa: los otros momentos existen, pero no son los que fija el numeral."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el expediente de un reasegurador debe incluir estados financieros auditados de, por lo menos:", "o": ["Los tres últimos años", "Los dos últimos años", "Los cinco últimos años", "El último ejercicio cerrado"], "a": 0, "e": "Art. 61, num. 4. Trampa: se cambia el número de años."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, para ahorrar, la firma de auditoría externa propone ejecutar también el programa anual de seguimiento. Debe rechazarse porque:", "o": ["Se evaluaría a sí misma", "Solo la junta puede ejecutarlo", "Solo la superintendencia lo ejecuta", "El programa no admite proveedores"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el Programa Anual de Evaluación y Control lo elabora y ejecuta:", "o": ["La auditoría interna o quien haga sus veces", "El oficial de cumplimiento con su unidad", "El auditor externo inscrito en el registro", "Los responsables de cumplimiento de cada área"], "a": 0, "e": "Art. 71. Trampa: el Programa Anual de Seguimiento lo ejecutan los responsables de cumplimiento (art. 17)."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la unidad de administración de riesgos es siempre obligatoria para las empresas de seguros.", "a": false, "e": "Art. 7, num. 2: pueden prescindir de ella según su autoevaluación; lo obligatorio es designar al oficial y a los responsables (num. 1). Trampa: se extiende la obligación."}, {"t": "mc", "q": "El sistema que la norma exige implantar en la aseguradora se identifica con las siglas:", "o": ["SIAR/LC/FT/FPADM y otros ilícitos", "SARLAFT del sector asegurador", "SIPAR de prevención sectorial", "SICAD de administración de riesgos"], "a": 0, "e": "SARLAFT es colombiano y SIPAR nicaragüense: trampas regionales."}, {"t": "vf", "q": "La Providencia SAA-01-0530-2024 y la SAA-01-0536-2024 regulan lo mismo: la administración de riesgos de LC/FT/FPADM.", "a": false, "e": "La 0530-2024 trata del Buen Gobierno Corporativo; la 0536-2024 es la norma de riesgos de LC/FT/FPADM."}, {"t": "mc", "q": "Una aseguradora funda un procedimiento en el decreto-ley de 2015 sin considerar la reforma de 2023. El riesgo es:", "o": ["Aplicar un texto que ya fue modificado", "Aplicar una norma de otro sector", "Aplicar una norma aún no vigente", "Ninguno, porque el texto no cambió"], "a": 0, "e": "Error de actualización normativa."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda porque «no está 100% seguro» de que una operación sea delictiva. ¿Qué principio debe guiar su decisión?", "o": ["Reportar con sospecha razonable: la certeza es de la justicia", "Esperar a reunir pruebas del origen ilícito de los fondos", "Preguntar al cliente para descartar la sospecha primero", "Consultar con otra aseguradora si ha visto al cliente"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, las variables de segmentación de riesgo que enumera la norma son taxativas, de modo que la empresa no puede añadir otras.", "a": false, "e": "Art. 23: son enunciativas y no taxativas. Trampa: se invierte el carácter de la lista."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la inscripción del oficial debe renovarse con actualización de recaudos en un período menor que los cinco años de la condición PEP.", "a": true, "e": "Renovación cada tres años."}, {"t": "mc", "q": "¿Qué relación guarda la Norma de SUDEASEG 2024 con la LOCDOFT?", "o": ["Desarrolla los deberes de la ley y no puede contradecirla", "La Norma deroga las disposiciones de la LOCDOFT para el sector", "La LOCDOFT no se aplica al sector asegurador por su norma", "Ambas se aplican de forma alternativa, a elección del sujeto"], "a": 0, "e": "Principio de jerarquía: la ley está por encima de la providencia."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el formulario del expediente del reasegurador lo suscribe el oficial de cumplimiento de la aseguradora cedente.", "a": false, "e": "Art. 61, num. 1: lo suscribe el oficial de la reaseguradora. Trampa: se cambia de empresa al firmante."}, {"t": "mc", "q": "Los auditores externos, respecto de los casos investigados y los reportes remitidos:", "o": ["No tienen acceso a ellos", "Tienen acceso pleno para su informe", "Acceden solo con permiso del cliente", "Acceden solo si lo pide la UNIF"], "a": 0, "e": "La confidencialidad del reporte es absoluta frente a terceros."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, una firma auditó en lo externo dos ejercicios seguidos y la empresa quiere contratarla para el tercero. Lo correcto es que:", "o": ["No puede, por superar el límite consecutivo", "Puede, si la junta aprueba la renovación", "Puede, si cambia al socio que firma", "No puede volver a contratarla jamás"], "a": 0, "e": "No más de dos ejercicios fiscales consecutivos."}, {"t": "mc", "q": "¿Quién debe impartir la capacitación en materia de LC/FT al sector asegurador según la lógica de la norma?", "o": ["Facilitadores inscritos en el RUF de la ONCDOFT", "Cualquier profesional con experiencia en seguros", "Exclusivamente el Oficial de Cumplimiento de la empresa", "Solo funcionarios de SUDEASEG designados para ello"], "a": 0, "e": "El RUF asegura idoneidad de los capacitadores."}, {"t": "vf", "q": "Una aseguradora que terceriza una función de cumplimiento sigue siendo responsable frente al supervisor.", "a": true, "e": "La responsabilidad final no se delega."}, {"t": "mc", "q": "Una aseguradora recibe una póliza cuyo tomador es una OSFL que recibe donaciones de varias jurisdicciones. ¿Cuál es el tratamiento adecuado?", "o": ["Aplicar EBR: entender propósito, origen y destino de fondos", "Rechazarla por ser una OSFL con donaciones del exterior", "Aceptarla sin análisis por no tener fines de lucro", "Aceptarla y notificar a la UNIF por cada donación recibida"], "a": 0, "e": "Las OSFL no son malas per se; son vulnerables."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, una empresa envía el plan operativo un mes después del cierre del ejercicio, junto con su informe de ejecución. El error es:", "o": ["El plan debe enviarse antes del cierre", "El informe debe enviarse antes que el plan", "Ambos deben enviarse en un solo documento", "El plan no se remite a la superintendencia"], "a": 0, "e": "El plan se remite dentro de los cuarenta y cinco días previos al cierre."}, {"t": "vf", "q": "Si la Junta Directiva no está de acuerdo con la remisión de un ROS, puede impedirla.", "a": false, "e": "No puede negar la remisión."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, de estos documentos, el que se computa en días hábiles es:", "o": ["Las declaraciones juradas de intermediarios", "El informe anual del auditor externo", "La autoevaluación de riesgo de la empresa", "Ninguno: todos se cuentan en días continuos"], "a": 0, "e": "Sesenta días hábiles frente a sesenta continuos: trampa de cómputo."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el oficial de cumplimiento renuncia de forma intempestiva. La secuencia correcta es:", "o": ["Asume el presidente, aviso en 5 hábiles y nuevo en 10", "Asume el auditor, aviso en 10 hábiles y nuevo en 5", "Asume la unidad, aviso en 5 hábiles y nuevo en 30", "Asume la junta, aviso en 10 continuos y nuevo en 60"], "a": 0, "e": "Falta absoluta: el presidente asume; notificación en cinco días hábiles; designación en diez días hábiles, prorrogable una sola vez."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, si no puede verificar un dato aportado por el cliente, la empresa debe enviar de inmediato un reporte a la UNIF, sin análisis previo.", "a": false, "e": "Art. 44: el oficial analiza el caso y notifica a la UNIF si lo considera procedente. Trampa: se elimina el análisis."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el envío del reporte de actividades sospechosas no acarrea responsabilidad civil ni penal, pero sí puede acarrear responsabilidad administrativa al oficial.", "a": false, "e": "Art. 83: tampoco acarrea responsabilidad administrativa. Trampa: media frase verdadera."}, {"t": "mc", "q": "¿Ante quién responde el Oficial de Cumplimiento dentro de la estructura de gobierno de la aseguradora?", "o": ["Ante la Junta Directiva o el órgano equivalente", "Ante el presidente de la aseguradora, de forma exclusiva", "Ante el gerente de la unidad de operaciones comerciales", "Ante SUDEASEG, como funcionario delegado del supervisor"], "a": 0, "e": "Reporta a la Junta Directiva para preservar su independencia."}, {"t": "mc", "q": "La inscripción del oficial de cumplimiento en el registro de la superintendencia debe renovarse cada:", "o": ["Tres años", "Un año", "Dos años", "Cinco años"], "a": 0, "e": "Con pago parcial de la tasa y actualización de recaudos."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la junta directiva firma el compromiso institucional en un acta colectiva única que se actualiza cada tres años.", "a": false, "e": "Arts. 8 y 34: se firma individualmente y se actualiza cada año. Trampa: se cambian la forma y la frecuencia."}, {"t": "mc", "q": "Una aseguradora clasifica a sus clientes en solo dos categorías: riesgo alto y riesgo bajo. ¿Qué observación hace SUDEASEG según su Norma 2024?", "o": ["Los niveles obligatorios son tres: bajo, moderado y alto", "Está bien: la norma permite solo alto y bajo", "Debe tener cinco niveles, con uno crítico y otro muy bajo", "Puede definir sus propios niveles según su política interna"], "a": 0, "e": "La norma fija tres niveles de riesgo."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el informe del auditor externo se remite dentro de los sesenta días continuos siguientes al cierre, con el acta de aprobación de la junta.", "a": true, "e": "Art. 72. Trampa: se suele pensar en días hábiles."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el registro del oficial de cumplimiento ante la superintendencia se renueva:", "o": ["Cada tres años, pagando el 25 % de la tasa", "Cada cinco años, pagando el 25 % de la tasa", "Cada tres años, pagando el 50 % de la tasa", "Cada año, pagando el 25 % de la tasa inicial"], "a": 0, "e": "Art. 12. Trampa: se cambia el período o el porcentaje."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el Programa Anual de Evaluación y Control es de uso restringido y confidencial.", "a": true, "e": "Art. 71. Trampa: se cree que se remite a la superintendencia; solo debe estar disponible en las inspecciones."}, {"t": "mc", "q": "¿Qué diferencia hay entre la debida diligencia simplificada, mejorada e intensificada según la Norma de SUDEASEG 2024?", "o": ["Se gradúan por riesgo: bajo, moderado y alto respectivamente", "Se gradúan por el monto: menor, medio y mayor de la prima", "Se gradúan por nacionalidad: nacional, residente y extranjero", "Son sinónimos aplicables según la preferencia de la empresa"], "a": 0, "e": "Gradación por riesgo."}, {"t": "mc", "q": "La Providencia 209 de SUNAVAL se aplica a:", "o": ["Los sujetos regulados por el mercado de valores", "Las empresas de seguros, reaseguros y medicina prepagada", "Las casas de cambio y remesadoras", "Los casinos y salas de bingo"], "a": 0, "e": "Es la norma del sector valores."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos frecuentes de clientes y vive por encima de su sueldo. ¿Qué debe hacer el supervisor?", "o": ["Reportar al Oficial por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Conversar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "¿Por qué en seguros de vida y productos de inversión el beneficiario es relevante para la debida diligencia?", "o": ["Quien cobra puede ser distinto del tomador y es riesgo", "El beneficiario es siempre un familiar del tomador", "El beneficiario no es relevante para la debida diligencia", "El beneficiario solo se verifica al contratar la póliza"], "a": 0, "e": "Se identifica y verifica al beneficiario a más tardar al pagar."}, {"t": "mc", "q": "El presidente debe notificar la designación o salida del oficial de cumplimiento dentro de:", "o": ["Cinco días hábiles", "Tres días continuos", "Quince días hábiles", "Treinta días continuos"], "a": 0, "e": "Plazo corto para que el supervisor conozca al responsable."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la norma vigente entró en vigencia sesenta días después de su publicación en Gaceta Oficial.", "a": false, "e": "Art. 91: entró en vigencia desde su publicación. Trampa: la de turismo sí tiene sesenta días de vacatio."}, {"t": "mc", "q": "Una aseguradora designa como Oficial de Cumplimiento al gerente de ventas «mientras consigue otro». ¿Qué problema de fondo presenta?", "o": ["Conflicto de interés: el cargo exige dedicación exclusiva", "Ninguno, si el gerente de ventas tiene experiencia comercial", "Solo falta su inscripción en el registro de SUDEASEG", "Es válido si es una designación transitoria de la Junta"], "a": 0, "e": "El Oficial de Cumplimiento debe tener autonomía funcional y dedicación exclusiva."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un empleado lee en un manual interno la Providencia SAA-01-0530-2024 como norma de prevención. Debe corregirse porque esa providencia regula:", "o": ["El buen gobierno corporativo", "La actividad de reaseguro", "Los reportes sistemáticos", "La medicina prepagada"], "a": 0, "e": "La norma de riesgos es la SAA-01-0536-2024."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la prohibición de tercerizar la verificación de datos y la identificación del beneficiario final no admite excepción alguna.", "a": false, "e": "Art. 40: salvo disposición en contrario. Trampa: un absoluto que el texto no tiene."}, {"t": "mc", "q": "¿Quiénes están sujetos a la Norma de SUDEASEG 2024?", "o": ["Personas sometidas a la supervisión y control de SUDEASEG", "Personas sometidas a la supervisión y control de la UNIF", "Solo las empresas de seguros autorizadas para operar", "Toda empresa que contrate seguros con una aseguradora"], "a": 0, "e": "Incluye aseguradoras, reaseguradoras, corredores, financiadoras de primas, medicina prepagada, entre otros."}, {"t": "vf", "q": "Una Junta Directiva puede designar al Oficial de Cumplimiento y supervisar su desempeño, pero no puede negarle la remisión de un reporte de actividades sospechosas.", "a": true, "e": "Se distingue entre designación/supervisión y la autonomía en el reporte."}, {"t": "mc", "q": "Una persona jurídica nueva, sin historial ni actividad comprobable, solicita contratar un seguro de alta suma con pago en efectivo. ¿Qué alerta presenta?", "o": ["Posible empresa fachada con fondos sin explicar", "Cliente normal que inicia su actividad económica", "Riesgo bajo por tratarse de una persona jurídica", "Operación habitual en el sector asegurador"], "a": 0, "e": "Empresas sin sustancia económica son señal típica."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la notificación de la ausencia del oficial de cumplimiento a la superintendencia corresponde a la junta directiva.", "a": false, "e": "Art. 9, num. 4: corresponde al presidente, dentro de cinco días hábiles. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Una empresa de seguros pequeña pregunta si debe conformar una Unidad de Administración de Riesgos. ¿Qué respuesta interpreta correctamente la norma?", "o": ["Depende de su autoevaluación; SUDEASEG puede ordenarla", "Siempre debe conformarla, sin excepciones por tamaño", "Nunca debe conformarla si tiene menos de cien empleados", "Solo la conforma si SUDEASEG la inspecciona por primera vez"], "a": 0, "e": "Criterio basado en riesgo, con control del supervisor."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 2", "q": [{"t": "mc", "q": "Las sociedades de corretaje, las financiadoras de primas y la medicina prepagada, respecto de la unidad:", "o": ["No están obligadas a conformarla, pero sí a informar", "Deben conformarla siempre sin excepción", "Están exentas de todo el sistema", "Deben compartir la unidad con una empresa de seguros"], "a": 0, "e": "Proporcionalidad según el tipo de sujeto."}, {"t": "vf", "q": "La debida diligencia simplificada se mantiene aunque surjan sospechas, mientras el cliente siga siendo de riesgo bajo en el sistema.", "a": false, "e": "Ante sospecha no se permite DD simplificada."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el oficial cita el plazo de conservación de la LOCDOFT para justificar guardar registros digitales solo cinco años. Su error es que:", "o": ["La norma del sector exige diez en digital", "La LOCDOFT exige diez años en digital", "La norma del sector exige tres en digital", "La LOCDOFT no fija plazo de conservación"], "a": 0, "e": "La norma sectorial es más exigente que el mínimo legal."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el presidente debe asistir a las actividades de capacitación convocadas por el oficial de cumplimiento.", "a": true, "e": "Art. 9, num. 11. Trampa: se cree que la capacitación es solo para el personal."}, {"t": "vf", "q": "Las normas de LC/FT del sector bancario y del sector asegurador comparten principios, pero no son intercambiables como fundamento jurídico.", "a": true, "e": "Cada sujeto obligado se rige por la norma de su supervisor."}, {"t": "vf", "q": "Aunque una aseguradora contrate a un tercero para tareas de apoyo, la responsabilidad del cumplimiento sigue siendo suya frente al supervisor.", "a": true, "e": "La responsabilidad no se delega."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la aprobación de la junta directiva para un cliente PEP se limita al inicio de la relación comercial.", "a": false, "e": "Art. 51: inicio, permanencia y pago de prestaciones en vida o productos de inversión. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, vencidos los diez días para designar al nuevo oficial, la empresa ya usó una prórroga. Puede:", "o": ["No pedir otra, porque solo se admite una vez", "Pedir otra, si la justifica ante la junta", "Dejar el cargo vacante hasta la asamblea", "Pedir prórrogas hasta cubrir sesenta días"], "a": 0, "e": "El plazo es prorrogable una sola vez."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el Plan Operativo Anual y su Informe de Ejecución se remiten, respectivamente:", "o": ["45 días antes del cierre y 30 días después", "30 días antes del cierre y 45 días después", "45 días después del cierre y 30 días antes", "60 días antes del cierre y 60 días después"], "a": 0, "e": "Arts. 29 y 30. Trampa: se cruzan los plazos de los dos instrumentos."}, {"t": "mc", "q": "La reforma de la Ley de la Actividad Aseguradora de 2023 entró en vigencia:", "o": ["A los ciento veinte días continuos de su publicación", "El mismo día de su publicación", "A los treinta días continuos de su publicación oficial", "Al inicio del ejercicio siguiente"], "a": 0, "e": "Vacancia expresa de la ley."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, si la superintendencia considera que el informe del auditor externo no cumple la norma, puede exigir una nueva auditoría.", "a": true, "e": "Art. 74. Trampa: en criptoactivos se puede exigir el cambio de auditor."}, {"t": "mc", "q": "El siniestro se paga a un tercero sin relación aparente con el asegurado, con documentos poco claros. ¿Qué debe hacer la aseguradora?", "o": ["Analizar, verificar la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, pueden impartir la capacitación los facilitadores inscritos en el RUF aunque no estén acreditados en el sector asegurador.", "a": false, "e": "Art. 31: deben estar inscritos en el RUF y acreditados en el sector asegurador. Trampa: se elimina el segundo requisito."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el Informe Anual del auditor externo se remite junto con:", "o": ["La certificación del acta de aprobación de la junta", "El dictamen del auditor interno de la empresa", "La opinión escrita del oficial de cumplimiento", "El Plan Operativo Anual del ejercicio siguiente"], "a": 0, "e": "Art. 72. Trampa: el auditor interno certifica la autoevaluación, no este informe."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, la verificación de datos debe incluir los listados publicados y mantenidos por:", "o": ["El Consejo de Seguridad de las Naciones Unidas", "La Unidad Nacional de Inteligencia Financiera", "El Grupo de Acción Financiera del Caribe", "La Oficina Nacional contra la Delincuencia"], "a": 0, "e": "Art. 40, conforme a las recomendaciones del GAFI. Trampa: el GAFI recomienda, pero las listas son del Consejo de Seguridad."}, {"t": "mc", "q": "Un intermediario llena la planilla de un cliente analfabeto y firma por él la declaración de origen de fondos «para ayudar». ¿Qué problema hay?", "o": ["Prohibido: el intermediario no firma por el cliente", "Es válido si el cliente lo autoriza por escrito antes", "Es recomendable cuando el cliente no sabe escribir", "Es válido si el supervisor comercial lo revisa luego"], "a": 0, "e": "La declaración debe ser personal y real."}, {"t": "vf", "q": "El principio de «buena fe» exime al sujeto obligado de documentar sus decisiones de cumplimiento.", "a": false, "e": "La buena fe no sustituye la demostración documental de los controles."}, {"t": "mc", "q": "¿Qué relación hay entre la autoevaluación de riesgo, el manual y el plan operativo?", "o": ["Riesgos identificados, procedimientos y plan de actividades", "Son documentos independientes sin ninguna relación entre sí", "El plan operativo sustituye a la autoevaluación anual", "El manual sustituye al plan operativo de cada ejercicio"], "a": 0, "e": "Coherencia del sistema."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el plazo para remitir el manual a la superintendencia se empieza a contar desde:", "o": ["La inscripción como sujeto obligado", "La aprobación de la junta directiva", "El cierre del ejercicio económico", "La designación del oficial"], "a": 0, "e": "El plazo corre desde la inscripción."}, {"t": "mc", "q": "La norma coloca al oficial de cumplimiento en un nivel jerárquico equiparable al del presidente para:", "o": ["Que pueda objetar decisiones sin presión interna", "Que pueda firmar pólizas en su ausencia", "Igualar su remuneración con la del resto de la gerencia", "Permitirle representar a la empresa"], "a": 0, "e": "Independencia funcional real."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la condición de PEP alcanza a los familiares hasta el cuarto grado de consanguinidad y el segundo de afinidad.", "a": true, "e": "Art. 51. Trampa: es frecuente invertir los grados."}, {"t": "mc", "q": "Ante la falta absoluta del oficial, quien asume sus funciones de forma inmediata es:", "o": ["El presidente o quien haga sus veces", "El auditor interno de la empresa", "Un funcionario designado por el supervisor", "El responsable de cumplimiento más antiguo"], "a": 0, "e": "La función no puede quedar acéfala."}, {"t": "mc", "q": "El Oficial de Cumplimiento renuncia y la empresa queda sin él. ¿Cuál es la lógica de la norma?", "o": ["La función no queda vacía: el presidente asume y avisa a SUDEASEG", "La función se suspende hasta la designación del siguiente Oficial", "SUDEASEG designa al nuevo Oficial de forma directa", "La función se retoma en la próxima auditoría externa anual"], "a": 0, "e": "Continuidad de la función y transparencia con el supervisor."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el informe de ejecución del Plan Operativo Anual debe indicar, de cada aspecto de su contenido:", "o": ["El porcentaje de cumplimiento, con soportes", "El costo ejecutado, con sus facturas", "El responsable y su firma autógrafa", "La opinión del auditor externo"], "a": 0, "e": "Art. 30. Trampa: los otros datos suenan a control, pero la norma pide porcentaje y soportes de medición."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, una sociedad de corretaje detecta una operación sospechosa y alega que no tiene unidad de administración de riesgos. Esa ausencia:", "o": ["No la exime de informar", "La exime de todo reporte", "Traslada el deber a la aseguradora", "Obliga a constituir la unidad antes"], "a": 0, "e": "No están obligadas a conformarla, pero sí a informar."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, las decisiones del oficial de cumplimiento obligan a todos los empleados desde que él las adopta, sin aprobación posterior.", "a": false, "e": "Art. 10: obligan previa aprobación de la junta directiva. Trampa: se suprime la condición."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, las sociedades de corretaje de reaseguros están obligadas a conformar la unidad de administración de riesgos.", "a": false, "e": "Art. 7, num. 3: no están obligadas, pero deben proporcionar la información requerida. Trampa: se confunde con el deber de informar."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, en una póliza de vida, el beneficiario final debe identificarse:", "o": ["Antes del pago de prestaciones o capitales", "Dentro de los treinta días siguientes al pago", "Solo al momento de emitir la póliza", "Cuando lo requiera la superintendencia"], "a": 0, "e": "Art. 51. Trampa: no basta la identificación inicial."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, los reportes sistemáticos mensuales de pólizas y del registro de trabajadores se remiten dentro de:", "o": ["Diez días hábiles tras el fin de cada mes", "Diez días continuos tras el fin de cada mes", "Cinco días hábiles tras el fin de cada mes", "Quince días hábiles tras el fin de cada mes"], "a": 0, "e": "Arts. 76 y 77. Trampa: se cambia la unidad o el número."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el presidente exige firmar él mismo cada reporte de sospecha antes de que salga. Ese requisito:", "o": ["Vulnera la autonomía para reportar", "Cumple el control dual del sistema", "Es válido si lo aprueba la junta", "Es válido para reportes de alto monto"], "a": 0, "e": "No se puede negar ni condicionar la remisión."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, aprobar el inicio de la relación con una compañía constituida en un país que no aplica regulaciones similares corresponde a:", "o": ["La junta directiva o el órgano equivalente", "El oficial de cumplimiento, previo informe", "El presidente, con aviso a la superintendencia", "La unidad de riesgos LC/FT de la empresa"], "a": 0, "e": "Art. 38. Trampa: el oficial analiza, pero no aprueba."}, {"t": "vf", "q": "La norma del sector asegurador entró en vigencia con su publicación en la Gaceta Oficial, sin período de vacancia.", "a": true, "e": "Vigencia inmediata desde la publicación."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un cliente de riesgo alto actualizó sus datos hace dieciocho meses. La situación:", "o": ["Incumple el máximo de un año", "Cumple el máximo de dos años", "Cumple el máximo de cinco años", "Solo incumple si hubo operaciones"], "a": 0, "e": "Para riesgo alto no puede exceder de un año."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta a la junta directiva. Trampa: el presidente lo suple, pero no es su superior."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el presupuesto específico que aprueba la junta cubre la materia de riesgos y también el buen gobierno corporativo.", "a": true, "e": "Art. 8, num. 2. Trampa: se cree que solo cubre la prevención."}, {"t": "mc", "q": "Una aseguradora lanza un seguro digital vendido solo por una aplicación móvil. Desde la lógica de la autoevaluación de riesgo, ¿qué debe hacer antes de lanzarlo?", "o": ["Evaluar el riesgo del producto y definir controles", "Lanzarlo y evaluar el riesgo en la próxima autoevaluación", "Esperar a la inspección de SUDEASEG para ajustarlo", "Pedir autorización previa a la UNIF para comercializarlo"], "a": 0, "e": "Productos y canales nuevos exigen evaluación previa."}, {"t": "vf", "q": "La norma del sector alterna plazos en días hábiles y en días continuos, y confundirlos puede significar un incumplimiento.", "a": true, "e": "Conviene memorizar cuál es cuál."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el rechazo de un empleado a ascensos o traslados es una conducta que los supervisores deben vigilar.", "a": true, "e": "Art. 66. Trampa: parece una conducta positiva, pero la norma la lista como señal."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, durante las vacaciones o el reposo médico del oficial de cumplimiento, sus funciones las ejerce:", "o": ["El presidente o quien haga sus veces", "El jefe de la unidad de riesgos LC/FT", "Un responsable de cumplimiento designado", "El auditor interno o quien haga sus veces"], "a": 0, "e": "Art. 9, num. 5. Trampa: en criptoactivos la junta designa un suplente."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, es familiar comprendido en el concepto de PEP del sector:", "o": ["Un primo hermano de la persona expuesta", "El cónyuge del primo de la persona expuesta", "Un concuñado de la persona expuesta", "Un sobrino político en cuarto grado"], "a": 0, "e": "Hasta cuarto grado de consanguinidad y segundo de afinidad."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, los documentos de una persona jurídica no domiciliada deben estar legalizados o apostillados, pero basta una traducción simple al castellano.", "a": false, "e": "Art. 47: traducción por intérprete público. Trampa: la primera mitad es correcta."}, {"t": "vf", "q": "El plan operativo se envía antes del cierre del ejercicio y su informe de ejecución después: son dos documentos y dos plazos distintos.", "a": true, "e": "Es una confusión frecuente en los exámenes."}, {"t": "mc", "q": "¿Qué significa el principio de «autorregulación» en la Norma de SUDEASEG 2024?", "o": ["El sujeto obligado diseña, aplica y demuestra sus controles", "El sujeto obligado queda exento de la supervisión de SUDEASEG", "SUDEASEG diseña los controles que cada empresa debe aplicar", "El sujeto obligado decide libremente si cumple la norma"], "a": 0, "e": "El sujeto obligado debe demostrar el cumplimiento."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, los requerimientos del Ministerio Público se atienden en un plazo fijo de cinco días hábiles.", "a": false, "e": "Art. 84: en el plazo prudencial que indique la superintendencia. Trampa: cinco días hábiles es el plazo para notificar la ausencia del oficial."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el Informe de Ejecución del Plan Operativo Anual lo aprueba el oficial de cumplimiento antes de remitirlo.", "a": false, "e": "Art. 30: lo aprueba la junta directiva. Trampa: el oficial lo elabora, pero no lo aprueba."}, {"t": "mc", "q": "El auditor externo que elabora el informe anual no puede ser contratado por más de:", "o": ["Dos ejercicios fiscales consecutivos", "Un solo ejercicio fiscal", "Tres ejercicios fiscales consecutivos", "Cinco ejercicios fiscales consecutivos"], "a": 0, "e": "Rotación para preservar la independencia."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, cuando no se puede verificar un dato, la notificación a la UNIF debe indicar los datos verdaderos del cliente, si se obtuvieron.", "a": true, "e": "Art. 44. Trampa: se cree que basta señalar el dato dudoso."}, {"t": "mc", "q": "¿Por qué la Norma de SUDEASEG 2024 ubica al Oficial de Cumplimiento y al presidente en un nivel jerárquico equiparable, cada uno en su ámbito?", "o": ["Asegurar independencia y capacidad de objetar decisiones", "Duplicar controles sobre las decisiones del presidente", "Evitar que SUDEASEG supervise directamente al presidente", "Reflejar la jerarquía de cargos de la estructura comercial"], "a": 0, "e": "La independencia es esencial para que funcione la función de cumplimiento."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, los programas de formación que debe cursar el aspirante a oficial de cumplimiento son los que imparte la ONCDOFT.", "a": false, "e": "Art. 11, num. 3: los imparte la Superintendencia de la Actividad Aseguradora. Trampa: en turismo los imparte INATUR."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la junta directiva puede negar al oficial la remisión de un reporte cuando lo considere infundado.", "a": false, "e": "Art. 83: no puede negarla. Trampa: se añade una excepción."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 3", "q": [{"t": "vf", "q": "Según la Norma de SUDEASEG 2024, los supervisores deben vigilar el amplio incremento de la cartera de negocios de prima única de los intermediarios.", "a": true, "e": "Art. 58. Trampa: parece un éxito comercial, pero la norma lo lista como objeto de atención."}, {"t": "mc", "q": "¿Qué factores deben considerarse al hacer la autoevaluación de riesgo de una aseguradora?", "o": ["Clientes, productos, canales, zonas y tecnologías", "Solo clientes y productos que se comercializan", "Solo la ubicación y el tamaño de las oficinas", "Capital social, reservas técnicas y número de empleados"], "a": 0, "e": "Esos son los factores de riesgo base."}, {"t": "vf", "q": "El comportamiento y el nivel de vida de empleados e intermediarios, cuando no concuerdan con sus ingresos, puede ser una señal de alerta interna.", "a": true, "e": "El riesgo también viene de adentro."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, cuando el contrato se celebra mediante intermediario, identificar y verificar los datos del tomador corresponde solo a la aseguradora.", "a": false, "e": "Art. 49: los intermediarios asumen esa obligación. Trampa: se excluye a un sujeto que la norma incluye."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, para un nuevo cliente de mayor riesgo, NO figura entre los métodos adicionales de verificación que exige la norma:", "o": ["La declaración jurada notariada del cliente", "La visita al cliente en su domicilio", "Las comunicaciones telefónicas con el cliente", "La verificación independiente de su identidad"], "a": 0, "e": "Art. 40: visita, llamadas y verificación independiente. Trampa: se añade un método que suena formal."}, {"t": "mc", "q": "Un presidente de una aseguradora dice que «el Oficial de Cumplimiento puede reportar a la UNIF solo si yo lo autorizo». ¿Cuál es la respuesta correcta?", "o": ["No puede impedirlo: no se puede negar la remisión de un ROS", "Tiene razón: el presidente debe autorizar todo reporte", "El Oficial debe pedir permiso previo a SUDEASEG para reportar", "El Oficial debe consultar antes el reporte con el cliente"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el reporte mensual de proveedores debe incluir también a los proveedores de servicios públicos.", "a": false, "e": "Art. 77, num. 3: quedan excluidos. Trampa: se incluye lo que la norma excluye."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la autoevaluación de riesgo se remite dentro de los sesenta días continuos siguientes al cierre, certificada por el auditor interno.", "a": true, "e": "Art. 20. Trampa: suena a que debe certificarla el auditor externo, que interviene en el informe anual."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el manual de políticas se remite a la superintendencia solo para su conocimiento.", "a": false, "e": "Art. 28: para su revisión, autorización e implementación. Trampa: se rebaja el trámite."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, una persona expuesta políticamente de una organización internacional recibe medidas menos exigentes que una PEP nacional.", "a": false, "e": "Art. 51: recibe las mismas medidas. Trampa: se crea una diferencia que no existe."}, {"t": "mc", "q": "Si el supervisor considera insuficientes los mecanismos de una aseguradora, puede:", "o": ["Instruir los ajustes y correcciones necesarias", "Designar a su propio oficial de cumplimiento", "Revocar la licencia sin procedimiento previo", "Reportar el caso directamente al juez penal"], "a": 0, "e": "Potestad correctiva."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el informe de ejecución del Plan Operativo Anual debe justificar las actividades no ejecutadas o reprogramadas.", "a": true, "e": "Art. 30. Trampa: se cree que solo recoge lo cumplido."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el beneficiario de una póliza de vida de una PEP se presenta a cobrar. Para el pago se requiere:", "o": ["La aprobación de la junta directiva", "La aprobación del oficial de cumplimiento", "La autorización de la superintendencia", "Solo la verificación del documento"], "a": 0, "e": "La aprobación alcanza la relación y el pago."}, {"t": "mc", "q": "SUDEASEG ejerce amplias facultades de supervisión sobre los sujetos obligados mediante su Oficina de Administración de Riesgos de LC/FT/FPADM. ¿Cuál es un efecto práctico?", "o": ["Ordenar ajustes si los mecanismos son insuficientes", "Solo observar y dejar constancia en un acta", "Solo cobrar tasas de supervisión al sujeto", "Solo recomendar mejoras sin carácter obligatorio"], "a": 0, "e": "Poder correctivo del supervisor."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, cuando no es posible obtener la huella dactilar, la empresa queda dispensada de cualquier control biométrico.", "a": false, "e": "Art. 45: debe usar otros controles biométricos alternos. Trampa: se convierte la dificultad en dispensa."}, {"t": "mc", "q": "Una guía o instructivo del supervisor sobre el formato de un reporte tiene por función:", "o": ["Precisar cómo cumplir la obligación ya establecida", "Crear obligaciones nuevas no previstas en la norma", "Derogar la parte de la norma que contradice", "Sustituir la autoevaluación de riesgo anual"], "a": 0, "e": "Las guías operacionalizan, no sustituyen."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el plazo de diez días hábiles para coordinar la designación del nuevo oficial se cuenta desde:", "o": ["La ocurrencia de la falta absoluta", "La notificación a la superintendencia", "La siguiente reunión de la junta directiva", "El cierre del mes en que ocurrió"], "a": 0, "e": "Art. 9, num. 6. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, un corredor puede llenar y firmar la declaración de origen de fondos si el cliente se lo autoriza verbalmente.", "a": false, "e": "Se prohíbe al intermediario llenar y suscribir la declaración."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, una aseguradora digitaliza sus expedientes y destruye el físico al tercer año. Considerando los plazos del sector:", "o": ["Incumple: el físico debe guardarse cinco años", "Cumple: basta el digital durante diez años", "Cumple: basta el físico durante tres años", "Incumple: el físico debe guardarse diez años"], "a": 0, "e": "Cinco años en físico y diez en digital."}, {"t": "mc", "q": "Un cliente de riesgo bajo, sin señales de alerta, puede recibir debida diligencia:", "o": ["Simplificada", "Intensificada", "Mejorada", "Ninguna medida"], "a": 0, "e": "Simplificada no significa ausencia de medidas."}, {"t": "vf", "q": "Durante las vacaciones del Oficial de Cumplimiento, sus funciones deben quedar cubiertas, no suspendidas.", "a": true, "e": "La función es continua."}, {"t": "mc", "q": "Un cliente de riesgo bajo realiza de pronto pagos inexplicablemente altos en efectivo. ¿Qué corresponde?", "o": ["Reclasificarlo y evaluar un ROS; no cabe DD simplificada", "Mantenerlo en bajo hasta la actualización anual de datos", "Cancelar la póliza y devolver la prima a una cuenta indicada", "Informarle que sus movimientos serán revisados por la UNIF"], "a": 0, "e": "La DD simplificada no es válida ante sospechas."}, {"t": "mc", "q": "¿Qué consecuencia puede tener que SUDEASEG considere que el informe del auditor externo no cumple los extremos de la norma?", "o": ["Puede exigir una nueva auditoría y acciones correctivas", "Nada, porque el informe es vinculante para SUDEASEG", "La empresa debe ser liquidada de inmediato por el órgano", "El informe se considera aprobado por silencio administrativo"], "a": 0, "e": "El supervisor puede verificar la exactitud del informe."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el manual aprobado por la junta se remite a la superintendencia dentro de:", "o": ["Treinta días continuos desde la inscripción", "Treinta días hábiles desde su aprobación", "Sesenta días continuos desde la inscripción", "Cuarenta y cinco días previos al cierre"], "a": 0, "e": "Art. 28. Trampa: se mezclan el plazo y el hecho que lo inicia."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo. Trampa: se invierte un solo adjetivo."}, {"t": "mc", "q": "Un gerente de una aseguradora prepara su manual de prevención basándose en la Providencia SAA-08-004-2021. ¿Qué observación corresponde?", "o": ["Derogada por la SAA-01-0536-2024; debe ajustarse a esa", "Sigue vigente para los manuales de las aseguradoras de seguros", "Sigue vigente solo para el reaseguro y la medicina prepagada", "Fue derogada por la LOCDOFT de 2012 al entrar en vigor"], "a": 0, "e": "Norma posterior sobre la misma materia deroga la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un exministro dejó su cargo hace cuatro años y solicita una póliza. Respecto de su condición:", "o": ["Sigue siendo PEP hasta cumplir cinco años", "Perdió la condición al cesar en el cargo", "Sigue siendo PEP de por vida sin excepción", "Solo es PEP si mantiene un cargo partidista"], "a": 0, "e": "La condición se mantiene cinco años tras el cese."}, {"t": "mc", "q": "La norma de seguros se titula «sobre administración de riesgos de LC/FT/FPADM y otros ilícitos». Los «otros ilícitos» incluyen:", "o": ["Fraude, corrupción y delitos conexos al sector", "Solo infracciones tributarias del asegurado", "Faltas administrativas del personal", "Incumplimientos contractuales del tomador"], "a": 0, "e": "Amplía el objeto más allá del lavado y el financiamiento."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un extranjero no residente que contrata una póliza se identifica con:", "o": ["El pasaporte vigente", "La cédula de extranjero vigente", "La cédula de su país de origen", "El RIF y una referencia bancaria"], "a": 0, "e": "Art. 47. Trampa: la cédula laminada es para venezolanos y extranjeros residentes."}, {"t": "mc", "q": "La Ley de la Actividad Aseguradora ha tenido distintas versiones. ¿Cuál es la lógica correcta de su evolución?", "o": ["Ley 2010, Decreto-Ley 2015 y Reforma 2023, vigente la última", "Ley 2010 y Decreto-Ley 2015, vigente el decreto-ley de 2015", "Decreto-Ley 2015 derogó la Reforma de 2023 por ser especial", "Reforma 2023 derogó solo la Ley de 2010 y mantiene la de 2015"], "a": 0, "e": "Cuidado con citar versiones anteriores como vigentes."}, {"t": "vf", "q": "La confidencialidad de un reporte protege tanto la investigación como al personal que reporta.", "a": true, "e": "Por eso su violación es sancionada."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, la renovación del registro del oficial de cumplimiento exige pagar la fracción de la tasa y:", "o": ["Actualizar la documentación", "Aprobar un nuevo examen", "Presentar aval de la junta", "Cursar otro programa académico"], "a": 0, "e": "Art. 12. Trampa: la norma no pide examen ni aval."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el manual debe estar a disposición de los empleados vinculados con el sistema, como medio de consulta.", "a": true, "e": "Art. 28. Trampa: se cree que es un documento reservado a la junta y al oficial."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el Plan Operativo Anual lo elabora, diseña y ejecuta:", "o": ["El oficial de cumplimiento", "La junta directiva", "La unidad de auditoría interna", "El presidente de la empresa"], "a": 0, "e": "Art. 29. Trampa: la junta aprueba su informe de ejecución, pero no elabora el plan."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, la junta directiva debe aprobar el monto de recursos para la materia:", "o": ["Anualmente, de forma específica e identificable en el presupuesto", "Anualmente, dentro de la partida general de gastos de la empresa", "Cada tres años, junto con la renovación del registro del oficial", "Cuando lo solicite por escrito el oficial de cumplimiento"], "a": 0, "e": "Art. 8, num. 2. Trampa: no basta una partida general."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, además de la declaración jurada de origen de fondos, presentan la declaración de conocimiento en materia de AR/LC/FT/FPADM:", "o": ["Solo los intermediarios personas naturales", "Solo los intermediarios personas jurídicas", "Todos los intermediarios autorizados", "Solo las sociedades de corretaje inscritas"], "a": 0, "e": "Art. 59. Trampa: la declaración de origen la presentan todos; la de conocimiento, solo las personas naturales."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, un cliente clasificado en riesgo moderado debe recibir debida diligencia:", "o": ["Mejorada", "Simplificada", "Intensificada", "Estándar"], "a": 0, "e": "Trampa: en criptoactivos el riesgo bajo es estándar; en cajas el moderado es controlada."}, {"t": "mc", "q": "¿Cuál es la función de los «responsables de cumplimiento» en las distintas áreas de la aseguradora?", "o": ["Extender la función de cumplimiento a cada área", "Sustituir al Oficial de Cumplimiento en sus ausencias", "Aprobar pólizas de clientes clasificados como riesgo alto", "Auditar el cumplimiento de la Unidad ante la Junta"], "a": 0, "e": "Extienden la función de cumplimiento a las áreas."}, {"t": "mc", "q": "Una aseguradora contrata una empresa externa para que «haga toda la debida diligencia de sus clientes». ¿Qué restricción impone la norma?", "o": ["No tercerizar verificación, beneficiario final ni análisis", "Puede tercerizar todo si el proveedor es de prestigio", "Solo puede tercerizar la identificación del cliente", "La tercerización de la debida diligencia es obligatoria"], "a": 0, "e": "La responsabilidad indelegable es de la aseguradora."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, la debida diligencia simplificada se admite para un cliente de riesgo bajo aunque exista sospecha de LC/FT, si el monto es reducido.", "a": false, "e": "Art. 36: no se permite la simplificada si existen sospechas. Trampa: se agrega una excepción por monto que la norma no tiene."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el Plan Operativo Anual se remite a la superintendencia en formato físico y digital.", "a": false, "e": "Art. 29: en formato digital. Trampa: físico y digital es la regla de conservación de documentos."}, {"t": "mc", "q": "La información que pidan el Ministerio Público u otros organismos competentes se remite:", "o": ["En el plazo prudencial que indique el supervisor", "Solo con orden judicial expresa", "Dentro de las veinticuatro horas siguientes, en todo caso", "Previa autorización escrita del cliente"], "a": 0, "e": "Deber de colaboración."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, el auditor externo solicita revisar los reportes de actividades sospechosas enviados. Corresponde:", "o": ["Negar el acceso a casos y reportes remitidos", "Darle acceso, por su deber de independencia", "Darle acceso previa orden del presidente", "Darle acceso con los nombres ocultos en lista"], "a": 0, "e": "Los auditores externos no tienen acceso a ellos."}, {"t": "vf", "q": "La aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "La sospecha desplaza la clasificación previa."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el presidente y el o
