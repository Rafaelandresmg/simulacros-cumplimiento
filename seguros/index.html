<!DOCTYPE html>

<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector seguros", "sub": "25 exámenes de 50 preguntas, 5 de ellos con el formato de la prueba de la ONCDOFT. Banco de 871 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Modelo ONCDOFT (RUF): 25 de verdadero o falso y 25 de selección simple, con el artículo citado", "exams": [{"titulo": "Modelo ONCDOFT 1", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, la nueva designación debe coordinarse en un lapso no mayor de diez (10) días hábiles, prorrogable una sola vez por un lapso igual.", "a": true, "e": "Art. 9, num. 6."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente notifica la renuncia del oficial de cumplimiento dentro de los cinco (5) días continuos siguientes.", "a": false, "e": "Art. 9, num. 4: cinco días hábiles. Trampa: se cambia la unidad de cómputo."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta directamente a la junta directiva o al órgano equivalente."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, sus normas buscan administrar los riesgos de LC, FT y FPADM, pero no los de otros ilícitos.", "a": false, "e": "Providencia SAA-01-0536-2024, art. 1: incluye expresamente «cometer otros ilícitos»."}, {"t": "vf", "q": "Según el artículo 19 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia SAA-01-0536-2024, quedan sujetas a la norma solo las empresas de seguros y de reaseguros.", "a": false, "e": "Art. 3: quedan sujetas todas las personas naturales y jurídicas sometidas a la supervisión de la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia SAA-01-0536-2024, la autorización del oficial de cumplimiento será revocada cuando haya sido sancionado conforme al artículo 138 de la ley que rige la actividad aseguradora.", "a": true, "e": "Art. 12, último aparte."}, {"t": "vf", "q": "Según el artículo 7, numeral 4, de la Providencia SAA-01-0536-2024, el representante de la sucursal de una empresa de reaseguros del exterior debe ser designado responsable de cumplimiento por la casa matriz.", "a": true, "e": "Art. 7, num. 4."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, para renovar el registro el interesado paga el veinticinco por ciento (25 %) de la tasa de su inscripción.", "a": true, "e": "LAA, art. 12, penúltimo aparte."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente debe notificar a la Superintendencia la designación, renuncia o ausencia del oficial de cumplimiento dentro de los cinco (5) días hábiles siguientes.", "a": true, "e": "Art. 9, num. 4."}, {"t": "vf", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, el Superintendente puede imponer medidas administrativas si las operaciones contravienen la normativa de LC/FT/FPADM de tal manera que comprometan el equilibrio del sistema financiero nacional.", "a": true, "e": "LAA, art. 85, numeral 5."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento de las normas de LC/FT/FPADM se sanciona con multa de 5.000 a 20.000 veces el tipo de cambio de referencia.", "a": false, "e": "Art. 126, num. 4: de 25.000 a 50.000. De 5.000 a 20.000 es la del numeral 1 (medidas administrativas). Trampa: se toma el rango de otro numeral."}, {"t": "vf", "q": "Según el artículo 7, numeral 3, de la Providencia SAA-01-0536-2024, las sociedades de corretaje de seguros están obligadas a conformar la Unidad de AR/LC/FT/FPADM.", "a": false, "e": "Art. 7, num. 3: no están obligadas, aunque deben suministrar a la Superintendencia la información que les solicite."}, {"t": "vf", "q": "Según el artículo 59 de la Ley de la Actividad Aseguradora, la composición y el funcionamiento del sistema integral de administración de riesgos de LC/FT/FPADM se rigen por las normas que dicte la UNIF.", "a": false, "e": "LAA, art. 59: se rigen por las normas que dicte la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 17 de la Providencia SAA-01-0536-2024, el Programa Anual de Seguimiento, Evaluación y Control lo elabora el oficial de cumplimiento para cada área.", "a": false, "e": "Art. 17, num. 3: lo elaboran y ejecutan los responsables de cumplimiento y lo presentan al oficial."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, dentro de la estructura del sistema el oficial de cumplimiento y el presidente se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Providencia SAA-01-0536-2024, art. 7."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento puede compartir su cargo con otras funciones de la empresa si su volumen de trabajo es bajo.", "a": false, "e": "Art. 10: está a dedicación exclusiva. Trampa: se agrega una excepción que la norma no prevé."}, {"t": "vf", "q": "Según el artículo 8, numeral 3, de la Ley de la Actividad Aseguradora, corresponde al Superintendente emitir los lineamientos de evaluación y administración integral de riesgos de LC/FT/FPADM de los sujetos regulados.", "a": true, "e": "LAA, art. 8, num. 3."}, {"t": "vf", "q": "Según el artículo 13, numeral 14, de la Providencia SAA-01-0536-2024, el oficial de cumplimiento analiza las operaciones inusuales y, de ser el caso, elabora y remite el reporte de actividades sospechosas a la UNIF.", "a": true, "e": "Art. 13, num. 14."}, {"t": "vf", "q": "Según el artículo 8, numeral 9, de la Providencia SAA-01-0536-2024, aprobar la designación de los miembros de la Unidad y de los responsables de cumplimiento corresponde al presidente.", "a": false, "e": "Art. 8, num. 9: corresponde a la junta directiva o al órgano equivalente. El oficial los propone (art. 13, num. 12)."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, las decisiones del oficial de cumplimiento son de observancia obligatoria para todos los ejecutivos y empleados, previa aprobación de la junta directiva.", "a": true, "e": "Art. 10, segundo aparte."}, {"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, para optar al cargo de oficial de cumplimiento se deben cursar los programas de formación académica que imparte la Superintendencia de la Actividad Aseguradora.", "a": true, "e": "Art. 11, num. 3."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, durante las vacaciones del oficial de cumplimiento la junta directiva designa un suplente.", "a": false, "e": "Art. 9, num. 5: las funciones las ejerce el presidente. Trampa: el suplente designado por la junta es la regla de la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los auditores externos en materia de LC/FT/FPADM son sujetos regulados, pero no están obligados a indicar su carácter en su denominación.", "a": true, "e": "Art. 3: se exceptúa de esa obligación a los actuarios independientes y a los auditores externos."}, {"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se actualiza cada dos años y no requiere certificación del auditor interno.", "a": false, "e": "Art. 20: se actualiza anualmente, con aprobación de la junta y certificación del auditor interno o quien haga sus veces."}, {"t": "mc", "q": "Según el artículo 12, numeral 4, de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de auditores externos, incluidos los de LC/FT/FPADM, es de:", "o": ["Ciento cincuenta (150) veces el tipo de cambio de referencia", "Cien (100) veces el tipo de cambio de referencia", "Setenta y cinco (75) veces el tipo de cambio de referencia", "Treinta (30) veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 12, num. 4. Cien veces es la de actuarios; setenta y cinco, la de auxiliares personas naturales; treinta, el examen de agente."}, {"t": "mc", "q": "Según el artículo 7, numeral 1, de la Providencia SAA-01-0536-2024, la designación del oficial de cumplimiento y de los responsables es:", "o": ["Obligatoria para todos los sujetos obligados", "Temporal, solo durante el primer año de registro", "Opcional, según el volumen de transacciones", "Exclusiva de empresas con más de cincuenta empleados"], "a": 0, "e": "Art. 7, num. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quiénes integran el sistema integral de AR/LC/FT/FPADM y otros ilícitos?", "o": ["Junta directiva, presidente, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y responsables de cumplimiento", "Junta directiva, auditor externo, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y consultoría jurídica", "Asamblea de accionistas, presidente, oficial de cumplimiento, auditor interno y responsables de cumplimiento", "Presidente, oficial de cumplimiento, comité de riesgos, auditor externo y responsables de cumplimiento"], "a": 0, "e": "Art. 7."}, {"t": "mc", "q": "Según el artículo 126 de la Ley de la Actividad Aseguradora, ¿qué rango de multa corresponde al incumplimiento del sistema integral de LC/FT/FPADM?", "o": ["De 25.000 a 50.000 veces el tipo de cambio (numeral 4)", "De 5.000 a 20.000 veces el tipo de cambio (numeral 1)", "De 10.000 a 25.000 veces el tipo de cambio (numeral 3)", "De 2.000 a 5.000 veces el tipo de cambio (numeral 5)"], "a": 0, "e": "Art. 126, num. 4. Trampa: todos los rangos existen en el artículo, para otras conductas."}, {"t": "mc", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, ¿en qué lapso debe coordinarse la nueva designación?", "o": ["No mayor de diez días hábiles, prorrogable una sola vez por un lapso igual", "No mayor de cinco días continuos, sin derecho a prórroga de ningún tipo", "Quince días hábiles, prorrogables automáticamente por un lapso igual", "Treinta días calendario, contados desde el cese de funciones del oficial"], "a": 0, "e": "Art. 9, num. 6."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia SAA-01-0536-2024, ¿cuál de estos NO figura entre los principios bajo los cuales se aplican las políticas?", "o": ["Rentabilidad", "Autorregulación", "Proporcionalidad", "Transparencia"], "a": 0, "e": "Art. 2: debida diligencia, autorregulación, buena fe, razonabilidad, confianza, proporcionalidad, adecuación y transparencia."}, {"t": "mc", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, ¿cuándo puede el Superintendente imponer medidas administrativas por razones de LC/FT/FPADM?", "o": ["Cuando las operaciones contravengan esa normativa de modo que comprometan el equilibrio del sistema financiero nacional", "Cuando el sujeto regulado remita con un solo día de retraso cualquier reporte de actividad sospechosa a la UNIF", "Cuando el oficial de cumplimiento renuncie y la empresa no notifique el hecho a la Superintendencia ese mismo día", "Cuando la empresa reciba del Ministerio Público una solicitud de información sobre cualquiera de sus clientes"], "a": 0, "e": "LAA, art. 85, num. 5."}, {"t": "mc", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, falsear el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM se sanciona con:", "o": ["Multa de 50.000 a 100.000 veces el tipo de cambio y prohibición de ejercer hasta por diez años", "Multa de 25.000 a 50.000 veces el tipo de cambio y suspensión de la autorización por un año", "Multa de 5.000 a 10.000 veces el tipo de cambio y exclusión del registro de uno a cinco años", "Solo la amonestación pública, sin perjuicio de las sanciones penales a que haya lugar"], "a": 0, "e": "LAA, art. 132."}, {"t": "mc", "q": "Según el artículo 11, numeral 1, de la Providencia SAA-01-0536-2024, el requisito académico para ser oficial de cumplimiento es:", "o": ["Título de educación superior o técnico universitario", "Título de bachiller, con experiencia en seguros", "Título de posgrado en administración de riesgos", "Certificados de cursos libres sin titulación oficial"], "a": 0, "e": "Art. 11, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la Providencia SAA-01-0536-2024, el empleado que conozca irregularidades en la observancia del manual debe informarlas a:", "o": ["La Unidad de AR/LC/FT/FPADM o al oficial de cumplimiento", "La UNIF, de forma directa y anónima", "La Superintendencia, por escrito y con copia al presidente", "Su supervisor inmediato, quien decide si escala el caso"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, ¿en qué lapso notifica el presidente a la Superintendencia la designación, renuncia o ausencia del oficial?", "o": ["Cinco (5) días hábiles", "Tres (3) días continuos", "Diez (10) días hábiles", "Quince (15) días hábiles"], "a": 0, "e": "Art. 9, num. 4."}, {"t": "mc", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, ¿en qué plazo se remite la autoevaluación de riesgo a la Superintendencia?", "o": ["Sesenta (60) días continuos tras el cierre del ejercicio", "Noventa (90) días continuos tras el cierre del ejercicio", "Treinta (30) días hábiles tras el cierre del ejercicio", "Los primeros quince (15) días hábiles de cada año"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia SAA-01-0536-2024, la Unidad de AR/LC/FT/FPADM puede organizarse en las áreas de:", "o": ["Administración de Riesgos; Estadísticas y Análisis Estratégicos; Análisis y Supervisión de Operaciones", "Cumplimiento Legal y Normativo; Auditoría Interna; Atención de Reclamos y Denuncias de Asegurados", "Suscripción de Riesgos; Siniestros y Salvamentos; Reaseguro, Coaseguro y Retrocesión de Riesgos", "Mercadeo, Ventas y Negocios; Tecnología de la Información; Talento Humano y Capacitación Interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 22 de la Providencia SAA-01-0536-2024, ¿cuáles son los factores de riesgo de la autoevaluación?", "o": ["Clientes, productos o servicios, canales de comercialización, zonas geográficas y nuevas tecnologías", "Clientes, empleados, proveedores, accionistas, intermediarios y reaseguradores de la empresa de seguros", "Primas, siniestros, reservas técnicas, inversiones, margen de solvencia y patrimonio propio no comprometido", "Probabilidad, impacto, riesgo inherente, riesgo residual, apetito de riesgo y tolerancia al riesgo"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según el artículo 13, numeral 18, de la Providencia SAA-01-0536-2024, el oficial asiste e informa a la junta sobre la enajenación de bienes de recuperaciones y salvamentos para:", "o": ["Determinar la identidad del beneficiario final", "Fijar el precio mínimo de venta del bien", "Cobrar la comisión del intermediario de seguros", "Liquidar la reserva técnica del siniestro"], "a": 0, "e": "Art. 13, num. 18."}, {"t": "mc", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte o altere información de operaciones de LC/FT/FPADM puede ser sancionado con:", "o": ["Multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión del registro de uno a cinco años", "Multa de 25.000 a 50.000 veces el tipo de cambio de referencia y exclusión definitiva del registro de oficiales", "Amonestación escrita y suspensión del registro por seis meses, sin perjuicio de las sanciones penales", "Multa de 50.000 a 100.000 veces el tipo de cambio de referencia, sin exclusión del registro de oficiales"], "a": 0, "e": "LAA, art. 138, num. 3."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento es un empleado de alto nivel dotado de:", "o": ["Autonomía funcional y poder de decisión, a dedicación exclusiva", "Representación legal exclusiva y firma autorizada de la junta", "Veto absoluto sobre las decisiones de los accionistas", "Dependencia operativa del área de mercadeo y negocios"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 8, numeral 3, de la Providencia SAA-01-0536-2024, el Compromiso Institucional que asume cada miembro de la junta directiva debe constar en:", "o": ["El expediente individual de cada miembro", "El libro de actas de la asamblea de accionistas", "El archivo bajo llave del oficial de cumplimiento", "Una cartelera pública de la institución"], "a": 0, "e": "Art. 8, num. 3: se asume en forma individual y por escrito."}, {"t": "mc", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, ¿qué riesgos deben administrar los sujetos obligados?", "o": ["LC, FT, FPADM y otros ilícitos", "Solo LC y FT", "LC, FT y FPADM, sin otros ilícitos", "Solo los riesgos operativos y reputacionales"], "a": 0, "e": "Providencia SAA-01-0536-2024, art. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quién puede ordenar la conformación de la Unidad de AR/LC/FT/FPADM a un sujeto obligado que esté exceptuado?", "o": ["La Superintendencia de la Actividad Aseguradora", "La junta directiva del propio sujeto obligado", "La Unidad Nacional de Inteligencia Financiera", "La Oficina Nacional Contra la Delincuencia Organizada"], "a": 0, "e": "Art. 7, último aparte."}, {"t": "mc", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, ¿a qué debe dirigir especial atención la junta al aprobar los recursos anuales para la materia?", "o": ["A la capacitación y a las soluciones informáticas y herramientas tecnológicas", "Al pago de honorarios de auditores externos y asesores legales", "A la remodelación de las oficinas de la Unidad de AR/LC/FT/FPADM", "Al pago de multas impuestas por la Superintendencia en ejercicios anteriores"], "a": 0, "e": "Art. 8, num. 2."}, {"t": "mc", "q": "Según el artículo 8, numeral 8, de la Providencia SAA-01-0536-2024, respecto del Informe Anual sobre AR/LC/FT/FPADM del auditor externo, la junta directiva debe:", "o": ["Revisarlo y aprobarlo, para aplicar las acciones correctivas que correspondan", "Solo conocerlo, porque su aprobación corresponde al oficial de cumplimiento", "Elaborarlo junto con el auditor externo antes de remitirlo a la Superintendencia", "Remitirlo a la UNIF dentro de los cinco días hábiles siguientes a su recepción"], "a": 0, "e": "Art. 8, num. 8. El presidente solo lo conoce (art. 9, num. 10)."}, {"t": "mc", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, la multa por incumplir las obligaciones en materia de administración de riesgos de LC/FT/FPADM va de:", "o": ["25.000 a 50.000 veces el tipo de cambio de referencia", "10.000 a 25.000 veces el tipo de cambio de referencia", "5.000 a 20.000 veces el tipo de cambio de referencia", "50.000 a 100.000 veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 126, num. 4. De 50.000 a 100.000 es la multa del art. 132 por falsear información."}, {"t": "mc", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, queda exceptuado de esa disposición:", "o": ["El fondo de garantía de la Administración Pública Nacional que realice actividad aseguradora", "El actuario independiente que presta servicios técnicos a empresas de seguros y de reaseguros", "El oficial de cumplimiento inscrito en el registro que lleva la Superintendencia del sector", "El auditor externo en materia de LC/FT/FPADM inscrito en el registro de la Superintendencia"], "a": 0, "e": "LAA, art. 3. Los otros tres son sujetos regulados."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿cuál de estas obligaciones corresponde al presidente y NO a la junta directiva?", "o": ["Proponer a la junta la designación del oficial de cumplimiento", "Designar al oficial de cumplimiento y supervisar sus funciones", "Aprobar la designación de los responsables de cumplimiento", "Revisar y aprobar el Informe Anual del auditor externo"], "a": 0, "e": "Art. 9, num. 7. Las otras tres son de la junta (art. 8, nums. 4, 9 y 8). Trampa: todas son funciones reales, pero de otro órgano."}]}, {"titulo": "Modelo ONCDOFT 2", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 7, numeral 2, de la Providencia SAA-01-0536-2024, las empresas de seguros pueden conformar la estructura sin la Unidad de AR/LC/FT/FPADM, en función de los resultados de su autoevaluación de riesgo.", "a": true, "e": "Art. 7, num. 2. La Superintendencia puede determinar en la inspección si la estructura es suficiente."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de oficiales de cumplimiento equivale a ciento cincuenta (150) veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 12, numeral 6."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, la sanción al oficial de cumplimiento que falsee información de LC/FT/FPADM excluye la responsabilidad penal.", "a": false, "e": "Art. 138: la multa o exclusión se aplica sin perjuicio de las sanciones penales."}, {"t": "vf", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, la junta directiva debe aprobar anualmente un monto de recursos financieros específico e identificable dentro del presupuesto general.", "a": true, "e": "Art. 8, num. 2."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte, falsee o altere información de operaciones relacionadas con LC/FT/FPADM puede ser excluido del registro por un lapso de uno (1) a cinco (5) años.", "a": true, "e": "LAA, art. 138, numeral 3: multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión de uno a cinco años."}, {"t": "vf", "q": "Según el artículo 60 de la Ley de la Actividad Aseguradora, la Superintendencia de la Actividad Aseguradora tiene dentro de su propia estructura un sistema integral de administración de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 60."}, {"t": "vf", "q": "Según el artículo 16 de la Providencia SAA-01-0536-2024, los responsables de cumplimiento se designan individualmente por escrito y cumplen esas funciones además de las propias de su cargo.", "a": true, "e": "Art. 16."}, {"t": "vf", "q": "Según el artículo 8, numeral 9, de la Providencia SAA-01-0536-2024, aprobar la designación de los miembros de la Unidad y de los responsables de cumplimiento corresponde al presidente.", "a": false, "e": "Art. 8, num. 9: corresponde a la junta directiva o al órgano equivalente. El oficial los propone (art. 13, num. 12)."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los registros allí previstos deben renovarse cada cinco (5) años.", "a": false, "e": "LAA, art. 12: los registros se renuevan cada tres (3) años."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, el representante de una sucursal de reaseguros del exterior es designado responsable de cumplimiento por la Superintendencia.", "a": false, "e": "Art. 7, num. 4: lo designa la casa matriz."}, {"t": "vf", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, el sistema integral de administración de riesgos de LC/FT/FPADM lo adopta cada sujeto regulado en función de su nivel de riesgo.", "a": true, "e": "LAA, art. 4, num. 27: «Conjunto de normas y políticas adoptadas y ejecutadas por los sujetos regulados, en función de su nivel de riesgo...»."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente notifica la renuncia del oficial de cumplimiento dentro de los cinco (5) días continuos siguientes.", "a": false, "e": "Art. 9, num. 4: cinco días hábiles. Trampa: se cambia la unidad de cómputo."}, {"t": "vf", "q": "Según el artículo 17, numeral 4, de la Providencia SAA-01-0536-2024, si un responsable de cumplimiento no conoció operaciones inusuales en el mes anterior, debe notificarlo así a la Unidad y al oficial.", "a": true, "e": "Art. 17, num. 4."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento puede compartir su cargo con otras funciones de la empresa si su volumen de trabajo es bajo.", "a": false, "e": "Art. 10: está a dedicación exclusiva. Trampa: se agrega una excepción que la norma no prevé."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, el Ministro de Finanzas puede ajustar las tasas, pero un incremento no puede superar la mitad de los montos previstos.", "a": false, "e": "LAA, art. 12: el incremento no puede ser superior a las dos terceras (2/3) partes de las tasas previstas."}, {"t": "vf", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, quien falsee el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM puede ser sancionado con multa y prohibición de ejercer la actividad aseguradora hasta por diez (10) años.", "a": true, "e": "LAA, art. 132: multa de 50.000 a 100.000 veces el tipo de cambio de referencia y prohibición hasta por diez años."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, durante las vacaciones del oficial de cumplimiento la junta directiva designa un suplente.", "a": false, "e": "Art. 9, num. 5: las funciones las ejerce el presidente. Trampa: el suplente designado por la junta es la regla de la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los auditores externos en materia de activos de información están exceptuados de la tasa de inscripción prevista para los auditores externos.", "a": true, "e": "LAA, art. 12, numeral 4: «Se exceptúan los auditores externos en materia de activos de información»."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los oficiales de cumplimiento y los auditores externos en materia de LC/FT/FPADM se consideran sujetos regulados.", "a": true, "e": "LAA, art. 3: «Se consideran también sujetos regulados: los actuarios independientes; los defensores del tomador...; los oficiales de cumplimiento y los auditores externos»."}, {"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, basta con el título de bachiller y experiencia comprobada en seguros para optar al cargo de oficial de cumplimiento.", "a": false, "e": "Art. 11, num. 1: título de educación superior o técnico universitario."}, {"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se remite a la Superintendencia dentro de los sesenta (60) días continuos siguientes al cierre del ejercicio, previa aprobación de la junta directiva y certificación del auditor interno.", "a": true, "e": "Art. 20."}, {"t": "vf", "q": "Según el artículo 8 de la Providencia SAA-01-0536-2024, la junta directiva conoce el Informe Anual del auditor externo, y su aprobación corresponde al presidente.", "a": false, "e": "Art. 8, num. 8: la junta lo revisa y aprueba; el presidente solo lo conoce (art. 9, num. 10). Trampa: se invierten los papeles."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los actuarios independientes no tienen la condición de sujetos regulados.", "a": false, "e": "LAA, art. 3: los actuarios independientes se consideran también sujetos regulados."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento en el diseño, implementación y funcionamiento del sistema integral de LC/FT/FPADM se sanciona con multa de 25.000 a 50.000 veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 126, numeral 4."}, {"t": "vf", "q": "Según el artículo 13, numeral 12, de la Providencia SAA-01-0536-2024, el oficial de cumplimiento propone a la junta directiva la designación de los miembros de la Unidad y de los responsables de cumplimiento.", "a": true, "e": "Art. 13, num. 12. La junta aprueba (art. 8, num. 9)."}, {"t": "mc", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, ¿cada cuánto se renueva el registro del oficial de cumplimiento y cuánto se paga?", "o": ["Cada tres años, el 25 % de la tasa de inscripción", "Cada tres años, el 50 % de la tasa de inscripción", "Cada cinco años, el 25 % de la tasa de inscripción", "Cada dos años, la tasa de inscripción completa"], "a": 0, "e": "LAA, art. 12, en concordancia con el art. 12 de la Providencia SAA-01-0536-2024."}, {"t": "mc", "q": "Según el artículo 9, numeral 8, de la Providencia SAA-01-0536-2024, ¿qué debe asegurar el presidente respecto de un nuevo producto o servicio?", "o": ["Que mercadeo y negocios consulten al oficial de cumplimiento antes de su lanzamiento", "Que la auditoría externa lo certifique después de su primer año de comercialización", "Que la Superintendencia lo apruebe antes de cualquier campaña publicitaria", "Que la UNIF reciba una copia de sus condiciones generales al lanzarlo"], "a": 0, "e": "Art. 9, num. 8, en concordancia con el art. 13, num. 10."}, {"t": "mc", "q": "Según el artículo 13, numeral 5, de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo, el manual, el plan operativo y su informe de ejecución se remiten a la Superintendencia:", "o": ["Por los medios que disponga la propia Superintendencia", "Por mensajería postal certificada, en original firmado", "Mediante entrega personal en la asamblea de accionistas", "No se remiten: basta archivarlos en la presidencia"], "a": 0, "e": "Art. 13, num. 5."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024, ¿en cuál de estos casos el plazo se cuenta en días continuos y no en días hábiles?", "o": ["La remisión de la autoevaluación de riesgo tras el cierre", "La notificación de la renuncia del oficial de cumplimiento", "La nueva designación del oficial tras su falta absoluta", "La prórroga del lapso para designar al nuevo oficial"], "a": 0, "e": "Art. 20: sesenta días continuos. El art. 9, nums. 4 y 6, usa días hábiles."}, {"t": "mc", "q": "Según el artículo 13, numeral 10, de la Providencia SAA-01-0536-2024, ¿cuándo evalúa el oficial de cumplimiento los nuevos productos y servicios?", "o": ["Antes de su comercialización", "Después de su primer año de comercialización", "Solo cuando un cliente presente una denuncia", "Durante la auditoría externa de cierre de año"], "a": 0, "e": "Art. 13, num. 10."}, {"t": "mc", "q": "Según los artículos 13 y 15 de la Providencia SAA-01-0536-2024, en materia de capacitación el oficial de cumplimiento ___ los planes y la Unidad los ___.", "o": ["coordina / ejecuta", "ejecuta / aprueba", "aprueba / coordina", "financia / ejecuta"], "a": 0, "e": "Art. 13, num. 4 (coordinar) y art. 15, num. 6 (ejecutar)."}, {"t": "mc", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, ¿cómo se define el sistema integral de administración de riesgos de LC/FT/FPADM?", "o": ["Normas y políticas que adopta el sujeto regulado, según su riesgo, para mitigar el uso ilícito de sus productos, servicios, clientes y canales", "Normas que dicta la Superintendencia y que todo sujeto regulado aplica de forma idéntica, sin considerar su propio nivel de riesgo", "Políticas que adopta la UNIF para vigilar, según su riesgo, el uso de los productos, servicios, clientes y canales de los sujetos regulados", "Procedimientos de la auditoría externa para certificar cada año los productos, servicios, clientes y canales del sujeto regulado"], "a": 0, "e": "LAA, art. 4, num. 27. El examen de la ONCDOFT lo cita como artículo 2; en el texto publicado en la G.O. 6.770 Extraordinario es el artículo 4, numeral 27."}, {"t": "mc", "q": "Según el artículo 9, numeral 7, de la Providencia SAA-01-0536-2024, ¿ante quién propone el presidente la designación del oficial de cumplimiento?", "o": ["Ante la junta directiva o el órgano equivalente", "Ante la Superintendencia de la Actividad Aseguradora", "Ante el comité de auditoría y control", "Ante la asamblea general de accionistas"], "a": 0, "e": "Art. 9, num. 7. La junta lo designa (art. 8, num. 4)."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿en qué casos ejerce el presidente las funciones del oficial de cumplimiento?", "o": ["En reposo médico, vacaciones y falta absoluta del oficial", "Solo durante las inspecciones presenciales de la Superintendencia", "Solo cuando haya reportes de alto impacto financiero", "Exclusivamente en caso de reposo médico del oficial"], "a": 0, "e": "Art. 9, numerales 5 y 6."}, {"t": "mc", "q": "Según el artículo 12, numeral 4, de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de auditores externos, incluidos los de LC/FT/FPADM, es de:", "o": ["Ciento cincuenta (150) veces el tipo de cambio de referencia", "Cien (100) veces el tipo de cambio de referencia", "Setenta y cinco (75) veces el tipo de cambio de referencia", "Treinta (30) veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 12, num. 4. Cien veces es la de actuarios; setenta y cinco, la de auxiliares personas naturales; treinta, el examen de agente."}, {"t": "mc", "q": "Según el artículo 7, numeral 1, de la Providencia SAA-01-0536-2024, la designación del oficial de cumplimiento y de los responsables es:", "o": ["Obligatoria para todos los sujetos obligados", "Temporal, solo durante el primer año de registro", "Opcional, según el volumen de transacciones", "Exclusiva de empresas con más de cincuenta empleados"], "a": 0, "e": "Art. 7, num. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quiénes integran el sistema integral de AR/LC/FT/FPADM y otros ilícitos?", "o": ["Junta directiva, presidente, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y responsables de cumplimiento", "Junta directiva, auditor externo, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y consultoría jurídica", "Asamblea de accionistas, presidente, oficial de cumplimiento, auditor interno y responsables de cumplimiento", "Presidente, oficial de cumplimiento, comité de riesgos, auditor externo y responsables de cumplimiento"], "a": 0, "e": "Art. 7."}, {"t": "mc", "q": "Según el artículo 126 de la Ley de la Actividad Aseguradora, ¿qué rango de multa corresponde al incumplimiento del sistema integral de LC/FT/FPADM?", "o": ["De 25.000 a 50.000 veces el tipo de cambio (numeral 4)", "De 5.000 a 20.000 veces el tipo de cambio (numeral 1)", "De 10.000 a 25.000 veces el tipo de cambio (numeral 3)", "De 2.000 a 5.000 veces el tipo de cambio (numeral 5)"], "a": 0, "e": "Art. 126, num. 4. Trampa: todos los rangos existen en el artículo, para otras conductas."}, {"t": "mc", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, ¿en qué lapso debe coordinarse la nueva designación?", "o": ["No mayor de diez días hábiles, prorrogable una sola vez por un lapso igual", "No mayor de cinco días continuos, sin derecho a prórroga de ningún tipo", "Quince días hábiles, prorrogables automáticamente por un lapso igual", "Treinta días calendario, contados desde el cese de funciones del oficial"], "a": 0, "e": "Art. 9, num. 6."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia SAA-01-0536-2024, ¿cuál de estos NO figura entre los principios bajo los cuales se aplican las políticas?", "o": ["Rentabilidad", "Autorregulación", "Proporcionalidad", "Transparencia"], "a": 0, "e": "Art. 2: debida diligencia, autorregulación, buena fe, razonabilidad, confianza, proporcionalidad, adecuación y transparencia."}, {"t": "mc", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, ¿cuándo puede el Superintendente imponer medidas administrativas por razones de LC/FT/FPADM?", "o": ["Cuando las operaciones contravengan esa normativa de modo que comprometan el equilibrio del sistema financiero nacional", "Cuando el sujeto regulado remita con un solo día de retraso cualquier reporte de actividad sospechosa a la UNIF", "Cuando el oficial de cumplimiento renuncie y la empresa no notifique el hecho a la Superintendencia ese mismo día", "Cuando la empresa reciba del Ministerio Público una solicitud de información sobre cualquiera de sus clientes"], "a": 0, "e": "LAA, art. 85, num. 5."}, {"t": "mc", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, falsear el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM se sanciona con:", "o": ["Multa de 50.000 a 100.000 veces el tipo de cambio y prohibición de ejercer hasta por diez años", "Multa de 25.000 a 50.000 veces el tipo de cambio y suspensión de la autorización por un año", "Multa de 5.000 a 10.000 veces el tipo de cambio y exclusión del registro de uno a cinco años", "Solo la amonestación pública, sin perjuicio de las sanciones penales a que haya lugar"], "a": 0, "e": "LAA, art. 132."}, {"t": "mc", "q": "Según el artículo 11, numeral 1, de la Providencia SAA-01-0536-2024, el requisito académico para ser oficial de cumplimiento es:", "o": ["Título de educación superior o técnico universitario", "Título de bachiller, con experiencia en seguros", "Título de posgrado en administración de riesgos", "Certificados de cursos libres sin titulación oficial"], "a": 0, "e": "Art. 11, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la Providencia SAA-01-0536-2024, el empleado que conozca irregularidades en la observancia del manual debe informarlas a:", "o": ["La Unidad de AR/LC/FT/FPADM o al oficial de cumplimiento", "La UNIF, de forma directa y anónima", "La Superintendencia, por escrito y con copia al presidente", "Su supervisor inmediato, quien decide si escala el caso"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, ¿en qué lapso notifica el presidente a la Superintendencia la designación, renuncia o ausencia del oficial?", "o": ["Cinco (5) días hábiles", "Tres (3) días continuos", "Diez (10) días hábiles", "Quince (15) días hábiles"], "a": 0, "e": "Art. 9, num. 4."}, {"t": "mc", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, ¿en qué plazo se remite la autoevaluación de riesgo a la Superintendencia?", "o": ["Sesenta (60) días continuos tras el cierre del ejercicio", "Noventa (90) días continuos tras el cierre del ejercicio", "Treinta (30) días hábiles tras el cierre del ejercicio", "Los primeros quince (15) días hábiles de cada año"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia SAA-01-0536-2024, la Unidad de AR/LC/FT/FPADM puede organizarse en las áreas de:", "o": ["Administración de Riesgos; Estadísticas y Análisis Estratégicos; Análisis y Supervisión de Operaciones", "Cumplimiento Legal y Normativo; Auditoría Interna; Atención de Reclamos y Denuncias de Asegurados", "Suscripción de Riesgos; Siniestros y Salvamentos; Reaseguro, Coaseguro y Retrocesión de Riesgos", "Mercadeo, Ventas y Negocios; Tecnología de la Información; Talento Humano y Capacitación Interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 22 de la Providencia SAA-01-0536-2024, ¿cuáles son los factores de riesgo de la autoevaluación?", "o": ["Clientes, productos o servicios, canales de comercialización, zonas geográficas y nuevas tecnologías", "Clientes, empleados, proveedores, accionistas, intermediarios y reaseguradores de la empresa de seguros", "Primas, siniestros, reservas técnicas, inversiones, margen de solvencia y patrimonio propio no comprometido", "Probabilidad, impacto, riesgo inherente, riesgo residual, apetito de riesgo y tolerancia al riesgo"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según el artículo 13, numeral 18, de la Providencia SAA-01-0536-2024, el oficial asiste e informa a la junta sobre la enajenación de bienes de recuperaciones y salvamentos para:", "o": ["Determinar la identidad del beneficiario final", "Fijar el precio mínimo de venta del bien", "Cobrar la comisión del intermediario de seguros", "Liquidar la reserva técnica del siniestro"], "a": 0, "e": "Art. 13, num. 18."}, {"t": "mc", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte o altere información de operaciones de LC/FT/FPADM puede ser sancionado con:", "o": ["Multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión del registro de uno a cinco años", "Multa de 25.000 a 50.000 veces el tipo de cambio de referencia y exclusión definitiva del registro de oficiales", "Amonestación escrita y suspensión del registro por seis meses, sin perjuicio de las sanciones penales", "Multa de 50.000 a 100.000 veces el tipo de cambio de referencia, sin exclusión del registro de oficiales"], "a": 0, "e": "LAA, art. 138, num. 3."}]}, {"titulo": "Modelo ONCDOFT 3", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, basta con el título de bachiller y experiencia comprobada en seguros para optar al cargo de oficial de cumplimiento.", "a": false, "e": "Art. 11, num. 1: título de educación superior o técnico universitario."}, {"t": "vf", "q": "Según el artículo 8, numeral 3, de la Ley de la Actividad Aseguradora, corresponde al Superintendente emitir los lineamientos de evaluación y administración integral de riesgos de LC/FT/FPADM de los sujetos regulados.", "a": true, "e": "LAA, art. 8, num. 3."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los registros allí previstos deben renovarse cada cinco (5) años.", "a": false, "e": "LAA, art. 12: los registros se renuevan cada tres (3) años."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, los contadores públicos en libre ejercicio son sujetos obligados cuando realizan para un cliente, entre otras, la compraventa de inmuebles o la administración de su dinero.", "a": true, "e": "LOCDOFT, art. 9, numeral 9: abogados, administradores, economistas y contadores en libre ejercicio, cuando realicen esas transacciones para un cliente."}, {"t": "vf", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, el Superintendente puede imponer medidas administrativas si las operaciones contravienen la normativa de LC/FT/FPADM de tal manera que comprometan el equilibrio del sistema financiero nacional.", "a": true, "e": "LAA, art. 85, numeral 5."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia SAA-01-0536-2024, quedan sujetas a la norma solo las empresas de seguros y de reaseguros.", "a": false, "e": "Art. 3: quedan sujetas todas las personas naturales y jurídicas sometidas a la supervisión de la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 8 de la Providencia SAA-01-0536-2024, la junta directiva conoce el Informe Anual del auditor externo, y su aprobación corresponde al presidente.", "a": false, "e": "Art. 8, num. 8: la junta lo revisa y aprueba; el presidente solo lo conoce (art. 9, num. 10). Trampa: se invierten los papeles."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, el representante de una sucursal de reaseguros del exterior es designado responsable de cumplimiento por la Superintendencia.", "a": false, "e": "Art. 7, num. 4: lo designa la casa matriz."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia SAA-01-0536-2024, la autorización del oficial de cumplimiento será revocada cuando haya sido sancionado conforme al artículo 138 de la ley que rige la actividad aseguradora.", "a": true, "e": "Art. 12, último aparte."}, {"t": "vf", "q": "Según el artículo 17 de la Providencia SAA-01-0536-2024, el Programa Anual de Seguimiento, Evaluación y Control lo elabora el oficial de cumplimiento para cada área.", "a": false, "e": "Art. 17, num. 3: lo elaboran y ejecutan los responsables de cumplimiento y lo presentan al oficial."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los actuarios independientes no tienen la condición de sujetos regulados.", "a": false, "e": "LAA, art. 3: los actuarios independientes se consideran también sujetos regulados."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, sus normas buscan administrar los riesgos de LC, FT y FPADM, pero no los de otros ilícitos.", "a": false, "e": "Providencia SAA-01-0536-2024, art. 1: incluye expresamente «cometer otros ilícitos»."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento de las normas de LC/FT/FPADM se sanciona con multa de 5.000 a 20.000 veces el tipo de cambio de referencia.", "a": false, "e": "Art. 126, num. 4: de 25.000 a 50.000. De 5.000 a 20.000 es la del numeral 1 (medidas administrativas). Trampa: se toma el rango de otro numeral."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, la renovación del registro de oficiales de cumplimiento cuesta el veinticinco por ciento (25 %) de la tasa de inscripción, cada tres (3) años.", "a": true, "e": "LAA, art. 12, penúltimo aparte."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento en el diseño, implementación y funcionamiento del sistema integral de LC/FT/FPADM se sanciona con multa de 25.000 a 50.000 veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 126, numeral 4."}, {"t": "vf", "q": "Según el artículo 19 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los fondos de garantía de la Administración Pública Nacional que realicen actividad aseguradora quedan exceptuados de esa disposición.", "a": true, "e": "LAA, art. 3: se exceptúan los fondos de garantía de la Administración Pública Nacional, sin perjuicio de su deber de cooperación con la Superintendencia."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, el Ministro de Finanzas puede ajustar las tasas, pero un incremento no puede superar la mitad de los montos previstos.", "a": false, "e": "LAA, art. 12: el incremento no puede ser superior a las dos terceras (2/3) partes de las tasas previstas."}, {"t": "vf", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, la sanción al oficial de cumplimiento que falsee información de LC/FT/FPADM excluye la responsabilidad penal.", "a": false, "e": "Art. 138: la multa o exclusión se aplica sin perjuicio de las sanciones penales."}, {"t": "vf", "q": "Según el artículo 59 de la Ley de la Actividad Aseguradora, la composición y el funcionamiento del sistema integral de administración de riesgos de LC/FT/FPADM se rigen por las normas que dicte la UNIF.", "a": false, "e": "LAA, art. 59: se rigen por las normas que dicte la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 13, numeral 14, de la Providencia SAA-01-0536-2024, el oficial de cumplimiento analiza las operaciones inusuales y, de ser el caso, elabora y remite el reporte de actividades sospechosas a la UNIF.", "a": true, "e": "Art. 13, num. 14."}, {"t": "vf", "q": "Según el artículo 7, numeral 4, de la Providencia SAA-01-0536-2024, el representante de la sucursal de una empresa de reaseguros del exterior debe ser designado responsable de cumplimiento por la casa matriz.", "a": true, "e": "Art. 7, num. 4."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta directamente a la junta directiva o al órgano equivalente."}, {"t": "vf", "q": "Según el artículo 19 de la Ley de la Actividad Aseguradora, la solicitud de autorización de una empresa de seguros debe contar, entre otros, con los manuales de gobierno corporativo y de administración integral de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 19."}, {"t": "vf", "q": "Según el artículo 11 de la Providencia SAA-01-0536-2024, para optar al cargo de oficial de cumplimiento se deben cursar los programas de formación académica que imparte la Superintendencia de la Actividad Aseguradora.", "a": true, "e": "Art. 11, num. 3."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento es un empleado de alto nivel dotado de:", "o": ["Autonomía funcional y poder de decisión, a dedicación exclusiva", "Representación legal exclusiva y firma autorizada de la junta", "Veto absoluto sobre las decisiones de los accionistas", "Dependencia operativa del área de mercadeo y negocios"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 8, numeral 3, de la Providencia SAA-01-0536-2024, el Compromiso Institucional que asume cada miembro de la junta directiva debe constar en:", "o": ["El expediente individual de cada miembro", "El libro de actas de la asamblea de accionistas", "El archivo bajo llave del oficial de cumplimiento", "Una cartelera pública de la institución"], "a": 0, "e": "Art. 8, num. 3: se asume en forma individual y por escrito."}, {"t": "mc", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, ¿qué riesgos deben administrar los sujetos obligados?", "o": ["LC, FT, FPADM y otros ilícitos", "Solo LC y FT", "LC, FT y FPADM, sin otros ilícitos", "Solo los riesgos operativos y reputacionales"], "a": 0, "e": "Providencia SAA-01-0536-2024, art. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quién puede ordenar la conformación de la Unidad de AR/LC/FT/FPADM a un sujeto obligado que esté exceptuado?", "o": ["La Superintendencia de la Actividad Aseguradora", "La junta directiva del propio sujeto obligado", "La Unidad Nacional de Inteligencia Financiera", "La Oficina Nacional Contra la Delincuencia Organizada"], "a": 0, "e": "Art. 7, último aparte."}, {"t": "mc", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, ¿a qué debe dirigir especial atención la junta al aprobar los recursos anuales para la materia?", "o": ["A la capacitación y a las soluciones informáticas y herramientas tecnológicas", "Al pago de honorarios de auditores externos y asesores legales", "A la remodelación de las oficinas de la Unidad de AR/LC/FT/FPADM", "Al pago de multas impuestas por la Superintendencia en ejercicios anteriores"], "a": 0, "e": "Art. 8, num. 2."}, {"t": "mc", "q": "Según el artículo 8, numeral 8, de la Providencia SAA-01-0536-2024, respecto del Informe Anual sobre AR/LC/FT/FPADM del auditor externo, la junta directiva debe:", "o": ["Revisarlo y aprobarlo, para aplicar las acciones correctivas que correspondan", "Solo conocerlo, porque su aprobación corresponde al oficial de cumplimiento", "Elaborarlo junto con el auditor externo antes de remitirlo a la Superintendencia", "Remitirlo a la UNIF dentro de los cinco días hábiles siguientes a su recepción"], "a": 0, "e": "Art. 8, num. 8. El presidente solo lo conoce (art. 9, num. 10)."}, {"t": "mc", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, la multa por incumplir las obligaciones en materia de administración de riesgos de LC/FT/FPADM va de:", "o": ["25.000 a 50.000 veces el tipo de cambio de referencia", "10.000 a 25.000 veces el tipo de cambio de referencia", "5.000 a 20.000 veces el tipo de cambio de referencia", "50.000 a 100.000 veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 126, num. 4. De 50.000 a 100.000 es la multa del art. 132 por falsear información."}, {"t": "mc", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, queda exceptuado de esa disposición:", "o": ["El fondo de garantía de la Administración Pública Nacional que realice actividad aseguradora", "El actuario independiente que presta servicios técnicos a empresas de seguros y de reaseguros", "El oficial de cumplimiento inscrito en el registro que lleva la Superintendencia del sector", "El auditor externo en materia de LC/FT/FPADM inscrito en el registro de la Superintendencia"], "a": 0, "e": "LAA, art. 3. Los otros tres son sujetos regulados."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿cuál de estas obligaciones corresponde al presidente y NO a la junta directiva?", "o": ["Proponer a la junta la designación del oficial de cumplimiento", "Designar al oficial de cumplimiento y supervisar sus funciones", "Aprobar la designación de los responsables de cumplimiento", "Revisar y aprobar el Informe Anual del auditor externo"], "a": 0, "e": "Art. 9, num. 7. Las otras tres son de la junta (art. 8, nums. 4, 9 y 8). Trampa: todas son funciones reales, pero de otro órgano."}, {"t": "mc", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, ¿cada cuánto se renueva el registro del oficial de cumplimiento y cuánto se paga?", "o": ["Cada tres años, el 25 % de la tasa de inscripción", "Cada tres años, el 50 % de la tasa de inscripción", "Cada cinco años, el 25 % de la tasa de inscripción", "Cada dos años, la tasa de inscripción completa"], "a": 0, "e": "LAA, art. 12, en concordancia con el art. 12 de la Providencia SAA-01-0536-2024."}, {"t": "mc", "q": "Según el artículo 9, numeral 8, de la Providencia SAA-01-0536-2024, ¿qué debe asegurar el presidente respecto de un nuevo producto o servicio?", "o": ["Que mercadeo y negocios consulten al oficial de cumplimiento antes de su lanzamiento", "Que la auditoría externa lo certifique después de su primer año de comercialización", "Que la Superintendencia lo apruebe antes de cualquier campaña publicitaria", "Que la UNIF reciba una copia de sus condiciones generales al lanzarlo"], "a": 0, "e": "Art. 9, num. 8, en concordancia con el art. 13, num. 10."}, {"t": "mc", "q": "Según el artículo 13, numeral 5, de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo, el manual, el plan operativo y su informe de ejecución se remiten a la Superintendencia:", "o": ["Por los medios que disponga la propia Superintendencia", "Por mensajería postal certificada, en original firmado", "Mediante entrega personal en la asamblea de accionistas", "No se remiten: basta archivarlos en la presidencia"], "a": 0, "e": "Art. 13, num. 5."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024, ¿en cuál de estos casos el plazo se cuenta en días continuos y no en días hábiles?", "o": ["La remisión de la autoevaluación de riesgo tras el cierre", "La notificación de la renuncia del oficial de cumplimiento", "La nueva designación del oficial tras su falta absoluta", "La prórroga del lapso para designar al nuevo oficial"], "a": 0, "e": "Art. 20: sesenta días continuos. El art. 9, nums. 4 y 6, usa días hábiles."}, {"t": "mc", "q": "Según el artículo 13, numeral 10, de la Providencia SAA-01-0536-2024, ¿cuándo evalúa el oficial de cumplimiento los nuevos productos y servicios?", "o": ["Antes de su comercialización", "Después de su primer año de comercialización", "Solo cuando un cliente presente una denuncia", "Durante la auditoría externa de cierre de año"], "a": 0, "e": "Art. 13, num. 10."}, {"t": "mc", "q": "Según los artículos 13 y 15 de la Providencia SAA-01-0536-2024, en materia de capacitación el oficial de cumplimiento ___ los planes y la Unidad los ___.", "o": ["coordina / ejecuta", "ejecuta / aprueba", "aprueba / coordina", "financia / ejecuta"], "a": 0, "e": "Art. 13, num. 4 (coordinar) y art. 15, num. 6 (ejecutar)."}, {"t": "mc", "q": "Según el artículo 4, numeral 27, de la Ley de la Actividad Aseguradora, ¿cómo se define el sistema integral de administración de riesgos de LC/FT/FPADM?", "o": ["Normas y políticas que adopta el sujeto regulado, según su riesgo, para mitigar el uso ilícito de sus productos, servicios, clientes y canales", "Normas que dicta la Superintendencia y que todo sujeto regulado aplica de forma idéntica, sin considerar su propio nivel de riesgo", "Políticas que adopta la UNIF para vigilar, según su riesgo, el uso de los productos, servicios, clientes y canales de los sujetos regulados", "Procedimientos de la auditoría externa para certificar cada año los productos, servicios, clientes y canales del sujeto regulado"], "a": 0, "e": "LAA, art. 4, num. 27. El examen de la ONCDOFT lo cita como artículo 2; en el texto publicado en la G.O. 6.770 Extraordinario es el artículo 4, numeral 27."}, {"t": "mc", "q": "Según el artículo 9, numeral 7, de la Providencia SAA-01-0536-2024, ¿ante quién propone el presidente la designación del oficial de cumplimiento?", "o": ["Ante la junta directiva o el órgano equivalente", "Ante la Superintendencia de la Actividad Aseguradora", "Ante el comité de auditoría y control", "Ante la asamblea general de accionistas"], "a": 0, "e": "Art. 9, num. 7. La junta lo designa (art. 8, num. 4)."}, {"t": "mc", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, ¿en qué casos ejerce el presidente las funciones del oficial de cumplimiento?", "o": ["En reposo médico, vacaciones y falta absoluta del oficial", "Solo durante las inspecciones presenciales de la Superintendencia", "Solo cuando haya reportes de alto impacto financiero", "Exclusivamente en caso de reposo médico del oficial"], "a": 0, "e": "Art. 9, numerales 5 y 6."}, {"t": "mc", "q": "Según el artículo 12, numeral 4, de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de auditores externos, incluidos los de LC/FT/FPADM, es de:", "o": ["Ciento cincuenta (150) veces el tipo de cambio de referencia", "Cien (100) veces el tipo de cambio de referencia", "Setenta y cinco (75) veces el tipo de cambio de referencia", "Treinta (30) veces el tipo de cambio de referencia"], "a": 0, "e": "LAA, art. 12, num. 4. Cien veces es la de actuarios; setenta y cinco, la de auxiliares personas naturales; treinta, el examen de agente."}, {"t": "mc", "q": "Según el artículo 7, numeral 1, de la Providencia SAA-01-0536-2024, la designación del oficial de cumplimiento y de los responsables es:", "o": ["Obligatoria para todos los sujetos obligados", "Temporal, solo durante el primer año de registro", "Opcional, según el volumen de transacciones", "Exclusiva de empresas con más de cincuenta empleados"], "a": 0, "e": "Art. 7, num. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quiénes integran el sistema integral de AR/LC/FT/FPADM y otros ilícitos?", "o": ["Junta directiva, presidente, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y responsables de cumplimiento", "Junta directiva, auditor externo, oficial de cumplimiento, Unidad de AR/LC/FT/FPADM y consultoría jurídica", "Asamblea de accionistas, presidente, oficial de cumplimiento, auditor interno y responsables de cumplimiento", "Presidente, oficial de cumplimiento, comité de riesgos, auditor externo y responsables de cumplimiento"], "a": 0, "e": "Art. 7."}, {"t": "mc", "q": "Según el artículo 126 de la Ley de la Actividad Aseguradora, ¿qué rango de multa corresponde al incumplimiento del sistema integral de LC/FT/FPADM?", "o": ["De 25.000 a 50.000 veces el tipo de cambio (numeral 4)", "De 5.000 a 20.000 veces el tipo de cambio (numeral 1)", "De 10.000 a 25.000 veces el tipo de cambio (numeral 3)", "De 2.000 a 5.000 veces el tipo de cambio (numeral 5)"], "a": 0, "e": "Art. 126, num. 4. Trampa: todos los rangos existen en el artículo, para otras conductas."}, {"t": "mc", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, ¿en qué lapso debe coordinarse la nueva designación?", "o": ["No mayor de diez días hábiles, prorrogable una sola vez por un lapso igual", "No mayor de cinco días continuos, sin derecho a prórroga de ningún tipo", "Quince días hábiles, prorrogables automáticamente por un lapso igual", "Treinta días calendario, contados desde el cese de funciones del oficial"], "a": 0, "e": "Art. 9, num. 6."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia SAA-01-0536-2024, ¿cuál de estos NO figura entre los principios bajo los cuales se aplican las políticas?", "o": ["Rentabilidad", "Autorregulación", "Proporcionalidad", "Transparencia"], "a": 0, "e": "Art. 2: debida diligencia, autorregulación, buena fe, razonabilidad, confianza, proporcionalidad, adecuación y transparencia."}, {"t": "mc", "q": "Según el artículo 85, numeral 5, de la Ley de la Actividad Aseguradora, ¿cuándo puede el Superintendente imponer medidas administrativas por razones de LC/FT/FPADM?", "o": ["Cuando las operaciones contravengan esa normativa de modo que comprometan el equilibrio del sistema financiero nacional", "Cuando el sujeto regulado remita con un solo día de retraso cualquier reporte de actividad sospechosa a la UNIF", "Cuando el oficial de cumplimiento renuncie y la empresa no notifique el hecho a la Superintendencia ese mismo día", "Cuando la empresa reciba del Ministerio Público una solicitud de información sobre cualquiera de sus clientes"], "a": 0, "e": "LAA, art. 85, num. 5."}]}, {"titulo": "Modelo ONCDOFT 4", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se actualiza cada dos años y no requiere certificación del auditor interno.", "a": false, "e": "Art. 20: se actualiza anualmente, con aprobación de la junta y certificación del auditor interno o quien haga sus veces."}, {"t": "vf", "q": "Según el artículo 17, numeral 4, de la Providencia SAA-01-0536-2024, si un responsable de cumplimiento no conoció operaciones inusuales en el mes anterior, debe notificarlo así a la Unidad y al oficial.", "a": true, "e": "Art. 17, num. 4."}, {"t": "vf", "q": "Según el artículo 8, numeral 9, de la Providencia SAA-01-0536-2024, aprobar la designación de los miembros de la Unidad y de los responsables de cumplimiento corresponde al presidente.", "a": false, "e": "Art. 8, num. 9: corresponde a la junta directiva o al órgano equivalente. El oficial los propone (art. 13, num. 12)."}, {"t": "vf", "q": "Según el artículo 16 de la Providencia SAA-01-0536-2024, los responsables de cumplimiento se designan individualmente por escrito y cumplen esas funciones además de las propias de su cargo.", "a": true, "e": "Art. 16."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente debe notificar a la Superintendencia la designación, renuncia o ausencia del oficial de cumplimiento dentro de los cinco (5) días hábiles siguientes.", "a": true, "e": "Art. 9, num. 4."}, {"t": "vf", "q": "Según el artículo 7, numeral 2, de la Providencia SAA-01-0536-2024, las empresas de seguros pueden conformar la estructura sin la Unidad de AR/LC/FT/FPADM, en función de los resultados de su autoevaluación de riesgo.", "a": true, "e": "Art. 7, num. 2. La Superintendencia puede determinar en la inspección si la estructura es suficiente."}, {"t": "vf", "q": "Según el artículo 13, numeral 12, de la Providencia SAA-01-0536-2024, el oficial de cumplimiento propone a la junta directiva la designación de los miembros de la Unidad y de los responsables de cumplimiento.", "a": true, "e": "Art. 13, num. 12. La junta aprueba (art. 8, num. 9)."}, {"t": "vf", "q": "Según el artículo 15 de la Providencia SAA-01-0536-2024, la Unidad de AR/LC/FT/FPADM ejecuta los planes de capacitación que coordina el oficial de cumplimiento.", "a": true, "e": "Art. 15, num. 6, y art. 13, num. 4."}, {"t": "vf", "q": "Según el artículo 17 de la Providencia SAA-01-0536-2024, el Programa Anual de Seguimiento, Evaluación y Control lo elabora el oficial de cumplimiento para cada área.", "a": false, "e": "Art. 17, num. 3: lo elaboran y ejecutan los responsables de cumplimiento y lo presentan al oficial."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, los registros allí previstos deben renovarse cada cinco (5) años.", "a": false, "e": "LAA, art. 12: los registros se renuevan cada tres (3) años."}, {"t": "vf", "q": "Según el artículo 126, numeral 4, de la Ley de la Actividad Aseguradora, el incumplimiento de las normas de LC/FT/FPADM se sanciona con multa de 5.000 a 20.000 veces el tipo de cambio de referencia.", "a": false, "e": "Art. 126, num. 4: de 25.000 a 50.000. De 5.000 a 20.000 es la del numeral 1 (medidas administrativas). Trampa: se toma el rango de otro numeral."}, {"t": "vf", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo se remite a la Superintendencia dentro de los sesenta (60) días continuos siguientes al cierre del ejercicio, previa aprobación de la junta directiva y certificación del auditor interno.", "a": true, "e": "Art. 20."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta directamente a la junta directiva o al órgano equivalente."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento puede compartir su cargo con otras funciones de la empresa si su volumen de trabajo es bajo.", "a": false, "e": "Art. 10: está a dedicación exclusiva. Trampa: se agrega una excepción que la norma no prevé."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia SAA-01-0536-2024, quedan sujetas a la norma solo las empresas de seguros y de reaseguros.", "a": false, "e": "Art. 3: quedan sujetas todas las personas naturales y jurídicas sometidas a la supervisión de la Superintendencia de la Actividad Aseguradora."}, {"t": "vf", "q": "Según el artículo 19 de la Providencia SAA-01-0536-2024, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, para renovar el registro el interesado paga el veinticinco por ciento (25 %) de la tasa de su inscripción.", "a": true, "e": "LAA, art. 12, penúltimo aparte."}, {"t": "vf", "q": "Según el artículo 9, numeral 6, de la Providencia SAA-01-0536-2024, ante la falta absoluta del oficial, la nueva designación debe coordinarse en un lapso no mayor de diez (10) días hábiles, prorrogable una sola vez por un lapso igual.", "a": true, "e": "Art. 9, num. 6."}, {"t": "vf", "q": "Según el artículo 3 de la Ley de la Actividad Aseguradora, los oficiales de cumplimiento y los auditores externos en materia de LC/FT/FPADM se consideran sujetos regulados.", "a": true, "e": "LAA, art. 3: «Se consideran también sujetos regulados: los actuarios independientes; los defensores del tomador...; los oficiales de cumplimiento y los auditores externos»."}, {"t": "vf", "q": "Según el artículo 7, numeral 3, de la Providencia SAA-01-0536-2024, las sociedades de corretaje de seguros están obligadas a conformar la Unidad de AR/LC/FT/FPADM.", "a": false, "e": "Art. 7, num. 3: no están obligadas, aunque deben suministrar a la Superintendencia la información que les solicite."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia SAA-01-0536-2024, durante las vacaciones del oficial de cumplimiento la junta directiva designa un suplente.", "a": false, "e": "Art. 9, num. 5: las funciones las ejerce el presidente. Trampa: el suplente designado por la junta es la regla de la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según el artículo 12 de la Ley de la Actividad Aseguradora, la tasa por inscripción en el registro de oficiales de cumplimiento equivale a ciento cincuenta (150) veces el tipo de cambio de referencia.", "a": true, "e": "LAA, art. 12, numeral 6."}, {"t": "vf", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, el presidente notifica la renuncia del oficial de cumplimiento dentro de los cinco (5) días continuos siguientes.", "a": false, "e": "Art. 9, num. 4: cinco días hábiles. Trampa: se cambia la unidad de cómputo."}, {"t": "vf", "q": "Según el artículo 60 de la Ley de la Actividad Aseguradora, la Superintendencia de la Actividad Aseguradora tiene dentro de su propia estructura un sistema integral de administración de riesgos de LC/FT/FPADM.", "a": true, "e": "LAA, art. 60."}, {"t": "vf", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, dentro de la estructura del sistema el oficial de cumplimiento y el presidente se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Providencia SAA-01-0536-2024, art. 7."}, {"t": "mc", "q": "Según el artículo 132 de la Ley de la Actividad Aseguradora, falsear el informe de ejecución del plan operativo anual en materia de LC/FT/FPADM se sanciona con:", "o": ["Multa de 50.000 a 100.000 veces el tipo de cambio y prohibición de ejercer hasta por diez años", "Multa de 25.000 a 50.000 veces el tipo de cambio y suspensión de la autorización por un año", "Multa de 5.000 a 10.000 veces el tipo de cambio y exclusión del registro de uno a cinco años", "Solo la amonestación pública, sin perjuicio de las sanciones penales a que haya lugar"], "a": 0, "e": "LAA, art. 132."}, {"t": "mc", "q": "Según el artículo 11, numeral 1, de la Providencia SAA-01-0536-2024, el requisito académico para ser oficial de cumplimiento es:", "o": ["Título de educación superior o técnico universitario", "Título de bachiller, con experiencia en seguros", "Título de posgrado en administración de riesgos", "Certificados de cursos libres sin titulación oficial"], "a": 0, "e": "Art. 11, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la Providencia SAA-01-0536-2024, el empleado que conozca irregularidades en la observancia del manual debe informarlas a:", "o": ["La Unidad de AR/LC/FT/FPADM o al oficial de cumplimiento", "La UNIF, de forma directa y anónima", "La Superintendencia, por escrito y con copia al presidente", "Su supervisor inmediato, quien decide si escala el caso"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 9, numeral 4, de la Providencia SAA-01-0536-2024, ¿en qué lapso notifica el presidente a la Superintendencia la designación, renuncia o ausencia del oficial?", "o": ["Cinco (5) días hábiles", "Tres (3) días continuos", "Diez (10) días hábiles", "Quince (15) días hábiles"], "a": 0, "e": "Art. 9, num. 4."}, {"t": "mc", "q": "Según el artículo 20 de la Providencia SAA-01-0536-2024, ¿en qué plazo se remite la autoevaluación de riesgo a la Superintendencia?", "o": ["Sesenta (60) días continuos tras el cierre del ejercicio", "Noventa (90) días continuos tras el cierre del ejercicio", "Treinta (30) días hábiles tras el cierre del ejercicio", "Los primeros quince (15) días hábiles de cada año"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia SAA-01-0536-2024, la Unidad de AR/LC/FT/FPADM puede organizarse en las áreas de:", "o": ["Administración de Riesgos; Estadísticas y Análisis Estratégicos; Análisis y Supervisión de Operaciones", "Cumplimiento Legal y Normativo; Auditoría Interna; Atención de Reclamos y Denuncias de Asegurados", "Suscripción de Riesgos; Siniestros y Salvamentos; Reaseguro, Coaseguro y Retrocesión de Riesgos", "Mercadeo, Ventas y Negocios; Tecnología de la Información; Talento Humano y Capacitación Interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 22 de la Providencia SAA-01-0536-2024, ¿cuáles son los factores de riesgo de la autoevaluación?", "o": ["Clientes, productos o servicios, canales de comercialización, zonas geográficas y nuevas tecnologías", "Clientes, empleados, proveedores, accionistas, intermediarios y reaseguradores de la empresa de seguros", "Primas, siniestros, reservas técnicas, inversiones, margen de solvencia y patrimonio propio no comprometido", "Probabilidad, impacto, riesgo inherente, riesgo residual, apetito de riesgo y tolerancia al riesgo"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según el artículo 13, numeral 18, de la Providencia SAA-01-0536-2024, el oficial asiste e informa a la junta sobre la enajenación de bienes de recuperaciones y salvamentos para:", "o": ["Determinar la identidad del beneficiario final", "Fijar el precio mínimo de venta del bien", "Cobrar la comisión del intermediario de seguros", "Liquidar la reserva técnica del siniestro"], "a": 0, "e": "Art. 13, num. 18."}, {"t": "mc", "q": "Según el artículo 138 de la Ley de la Actividad Aseguradora, el oficial de cumplimiento que oculte o altere información de operaciones de LC/FT/FPADM puede ser sancionado con:", "o": ["Multa de 5.000 a 10.000 veces el tipo de cambio de referencia o exclusión del registro de uno a cinco años", "Multa de 25.000 a 50.000 veces el tipo de cambio de referencia y exclusión definitiva del registro de oficiales", "Amonestación escrita y suspensión del registro por seis meses, sin perjuicio de las sanciones penales", "Multa de 50.000 a 100.000 veces el tipo de cambio de referencia, sin exclusión del registro de oficiales"], "a": 0, "e": "LAA, art. 138, num. 3."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia SAA-01-0536-2024, el oficial de cumplimiento es un empleado de alto nivel dotado de:", "o": ["Autonomía funcional y poder de decisión, a dedicación exclusiva", "Representación legal exclusiva y firma autorizada de la junta", "Veto absoluto sobre las decisiones de los accionistas", "Dependencia operativa del área de mercadeo y negocios"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 8, numeral 3, de la Providencia SAA-01-0536-2024, el Compromiso Institucional que asume cada miembro de la junta directiva debe constar en:", "o": ["El expediente individual de cada miembro", "El libro de actas de la asamblea de accionistas", "El archivo bajo llave del oficial de cumplimiento", "Una cartelera pública de la institución"], "a": 0, "e": "Art. 8, num. 3: se asume en forma individual y por escrito."}, {"t": "mc", "q": "Según el artículo 1 de la Providencia SAA-01-0536-2024, ¿qué riesgos deben administrar los sujetos obligados?", "o": ["LC, FT, FPADM y otros ilícitos", "Solo LC y FT", "LC, FT y FPADM, sin otros ilícitos", "Solo los riesgos operativos y reputacionales"], "a": 0, "e": "Providencia SAA-01-0536-2024, art. 1."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia SAA-01-0536-2024, ¿quién puede ordenar la conformación de la Unidad de AR/LC/FT/FPADM a un sujeto obligado que esté exceptuado?", "o": ["La Superintendencia de la Actividad Aseguradora", "La junta directiva del propio sujeto obligado", "La Unidad Nacional de Inteligencia Financiera", "La Oficina Nacional Contra la Delincuencia Organizada"], "a": 0, "e": "Art. 7, último aparte."}, {"t": "mc", "q": "Según el artículo 8, numeral 2, de la Providencia SAA-01-0536-2024, ¿a qué debe dirigir especial atención la junta al aprobar los recursos anuales para la materia?", "o": ["A la capacitación y a las soluciones informáticas y herramientas tecnológicas", "Al pago de honorarios de auditores externos y asesores legales", "A la remodelación de las oficinas de la Unidad de AR/LC/FT/FPADM", "Al pago de multas impuestas por la Superintendencia en ejercicios anteriores"], "a": 0, "e": "Art. 8, num. 2."}, {"t": "mc", "q": "Según el artículo 8, numeral 8, de la Providencia SAA-01-0536-2024, respecto del Informe Anual sobre AR/LC/FT/FPADM del auditor externo, la junta directiva debe:", "o": ["Revisarlo y aprobarlo, para aplicar las acciones correctivas que correspondan", "Solo conocerlo, porque su aprobación corresponde al oficial de cumplimiento", "Elaborarlo junto con el auditor externo antes de remitirlo a la Superintendencia", "Remitirlo a la UNIF dentro de los cinco días hábiles siguientes a su recepción"], "a": 0, "e": "Art. 8, num. 8. El presidente solo lo conoce (art. 9, num. 10)."}, {"t": "mc", "q": "Según
