"El mismo día de su publicación", "A los treinta días continuos de su publicación oficial", "Al inicio del ejercicio siguiente"], "a": 0, "e": "Vacancia expresa de la ley."}, {"t": "mc", "q": "¿Qué sentido tiene que el Oficial de Cumplimiento esté inscrito en un registro de SUDEASEG y lo renueve periódicamente?", "o": ["Garantizar idoneidad y control del supervisor sobre el cargo", "Recaudar la tasa de inscripción que cobra SUDEASEG", "Impedir que el Oficial cambie de empresa del sector", "Reemplazar el título universitario del Oficial de Cumplimiento"], "a": 0, "e": "Es un control de idoneidad."}, {"t": "mc", "q": "Un cliente exige que no se verifiquen sus datos porque «tiene prisa». ¿Qué corresponde?", "o": ["No avanzar: la verificación no es negociable", "Aceptarlo por tratarse de un cliente importante", "Verificar después de emitir la póliza, sin avisarle", "Cobrar una prima mayor por la omisión de datos"], "a": 0, "e": "La presión del cliente es una señal de alerta."}, {"t": "mc", "q": "¿Qué factores deben considerarse al hacer la autoevaluación de riesgo de una aseguradora?", "o": ["Clientes, productos, canales, zonas y tecnologías", "Solo clientes y productos que se comercializan", "Solo la ubicación y el tamaño de las oficinas", "Capital social, reservas técnicas y número de empleados"], "a": 0, "e": "Esos son los factores de riesgo base."}, {"t": "mc", "q": "¿Qué consecuencia puede tener que SUDEASEG considere que el informe del auditor externo no cumple los extremos de la norma?", "o": ["Puede exigir una nueva auditoría y acciones correctivas", "Nada, porque el informe es vinculante para SUDEASEG", "La empresa debe ser liquidada de inmediato por el órgano", "El informe se considera aprobado por silencio administrativo"], "a": 0, "e": "El supervisor puede verificar la exactitud del informe."}, {"t": "mc", "q": "Una aseguradora contrata una empresa externa para que «haga toda la debida diligencia de sus clientes». ¿Qué restricción impone la norma?", "o": ["No tercerizar verificación, beneficiario final ni análisis", "Puede tercerizar todo si el proveedor es de prestigio", "Solo puede tercerizar la identificación del cliente", "La tercerización de la debida diligencia es obligatoria"], "a": 0, "e": "La responsabilidad indelegable es de la aseguradora."}, {"t": "mc", "q": "Un extranjero no residente se identifica ante la aseguradora con:", "o": ["Pasaporte vigente", "Cédula de identidad laminada", "Carnet consular de su país", "Licencia de conducir internacional"], "a": 0, "e": "Los residentes se identifican con cédula vigente."}, {"t": "vf", "q": "El principio de «buena fe» exime al sujeto obligado de documentar sus decisiones de cumplimiento.", "a": false, "e": "La buena fe no sustituye la demostración documental de los controles."}, {"t": "mc", "q": "El sistema de administración de riesgos debe diseñarse considerando, entre otros elementos:", "o": ["Estructura, clientes, productos, canales y tecnologías", "Solo el capital social y el monto de las reservas técnicas", "Solo el número de pólizas emitidas al año", "Solo la ubicación de la casa matriz"], "a": 0, "e": "El diseño es a la medida del sujeto obligado."}, {"t": "mc", "q": "La instrucción al personal de no informar al cliente sobre verificaciones y notificaciones busca:", "o": ["Preservar la reserva de la investigación", "Evitar reclamos comerciales del cliente", "Reducir la carga de trabajo del área", "Cumplir la ley de protección de datos"], "a": 0, "e": "Prohibición de revelación."}, {"t": "mc", "q": "¿Quiénes están sujetos a la Norma de SUDEASEG 2024?", "o": ["Personas sometidas a la supervisión y control de SUDEASEG", "Personas sometidas a la supervisión y control de la UNIF", "Solo las empresas de seguros autorizadas para operar", "Toda empresa que contrate seguros con una aseguradora"], "a": 0, "e": "Incluye aseguradoras, reaseguradoras, corredores, financiadoras de primas, medicina prepagada, entre otros."}, {"t": "mc", "q": "¿Por qué la Norma de SUDEASEG 2024 ubica al Oficial de Cumplimiento y al presidente en un nivel jerárquico equiparable, cada uno en su ámbito?", "o": ["Asegurar independencia y capacidad de objetar decisiones", "Duplicar controles sobre las decisiones del presidente", "Evitar que SUDEASEG supervise directamente al presidente", "Reflejar la jerarquía de cargos de la estructura comercial"], "a": 0, "e": "La independencia es esencial para que funcione la función de cumplimiento."}, {"t": "mc", "q": "¿Qué diferencia hay entre la debida diligencia simplificada, mejorada e intensificada según la Norma de SUDEASEG 2024?", "o": ["Se gradúan por riesgo: bajo, moderado y alto respectivamente", "Se gradúan por el monto: menor, medio y mayor de la prima", "Se gradúan por nacionalidad: nacional, residente y extranjero", "Son sinónimos aplicables según la preferencia de la empresa"], "a": 0, "e": "Gradación por riesgo."}, {"t": "mc", "q": "Los clientes que son APNFD u organizaciones sin fines de lucro deben recibir:", "o": ["Tratamiento conforme al enfoque basado en riesgo", "Rechazo automático por su actividad", "Clasificación obligatoria en el nivel de riesgo alto", "Exención de la debida diligencia"], "a": 0, "e": "Riesgo evaluado, no presunción."}, {"t": "vf", "q": "Una Junta Directiva puede designar al Oficial de Cumplimiento y supervisar su desempeño, pero no puede negarle la remisión de un reporte de actividades sospechosas.", "a": true, "e": "Se distingue entre designación/supervisión y la autonomía en el reporte."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 2", "q": [{"t": "mc", "q": "Una persona jurídica constituida en el exterior desea contratar una póliza en Venezuela. ¿Qué requisitos documentales exige la lógica de la norma para sus documentos?", "o": ["Legalizados o apostillados y traducidos oficialmente", "Presentados en copia simple del país de origen", "Presentados solo con el RIF de la sociedad extranjera", "Sin requisito alguno por tratarse de un cliente extranjero"], "a": 0, "e": "Se busca autenticidad de documentos extranjeros."}, {"t": "vf", "q": "Durante las vacaciones del Oficial de Cumplimiento, sus funciones deben quedar cubiertas, no suspendidas.", "a": true, "e": "La función es continua."}, {"t": "mc", "q": "¿Qué es un «ilícito distinto del LC/FT» que el sistema de administración de riesgos también busca prevenir?", "o": ["Otros delitos como fraude, corrupción o evasión", "Errores contables que no constituyen delito", "Solo delitos informáticos contra los sistemas", "Solo infracciones administrativas del sector"], "a": 0, "e": "El título de la norma incluye «otros ilícitos»."}, {"t": "mc", "q": "La conservación de documentos que exige la norma del sector es de:", "o": ["Cinco años en físico y diez en digital", "Cinco años en cualquier soporte", "Diez años en físico y cinco en digital", "Tres años en físico y cinco en digital"], "a": 0, "e": "Más exigente que el mínimo legal."}, {"t": "mc", "q": "¿Dónde debe constar la declaración de origen de los fondos del cliente?", "o": ["En la solicitud del contrato", "En un documento aparte archivado por el auditor", "En el manual", "En el informe anual"], "a": 0, "e": "Forma parte del proceso de aceptación del cliente."}, {"t": "mc", "q": "Una aseguradora usa solo un listado manual en Excel para monitorear 200.000 pólizas. ¿Qué crítica proporcional corresponde?", "o": ["Herramientas desproporcionadas al volumen y riesgo", "Ninguna: un listado manual es suficiente para cualquier volumen", "Que debe usar solo registros en papel para mayor control", "Que no necesita monitoreo por ser una cartera masiva"], "a": 0, "e": "Proporcionalidad exige herramientas adecuadas al riesgo."}, {"t": "mc", "q": "La supervisión de la materia dentro de la superintendencia se ejerce a través de:", "o": ["Su oficina de administración de riesgos de LC/FT/FPADM", "La unidad de inteligencia financiera de alcance nacional", "La oficina del órgano rector en el sector", "La gerencia de actuaría y reservas"], "a": 0, "e": "Unidad especializada dentro del supervisor."}, {"t": "mc", "q": "Un asesor de seguros recibe presión de su gerente para cerrar una póliza de un cliente sospechoso porque «es una cuenta grande». ¿Qué debe hacer?", "o": ["Informar al Oficial: la presión no justifica omitir", "Cerrar la póliza para no perder la cuenta importante", "Callar para evitar conflictos con el gerente comercial", "Hablar con el cliente para aclarar el origen de fondos"], "a": 0, "e": "El conflicto entre ventas y cumplimiento se resuelve a favor del cumplimiento."}, {"t": "mc", "q": "La unidad de administración de riesgos se define en la norma como:", "o": ["El órgano técnico operativo del sistema", "El comité que aprueba las políticas", "La auditoría interna especializada", "La representación del supervisor en la empresa"], "a": 0, "e": "Es el brazo técnico y operativo."}, {"t": "mc", "q": "¿Qué evidencia debe conservar una aseguradora para demostrar su capacitación?", "o": ["Documento con contenido y firmas de participantes", "Constancia verbal del facilitador sobre la asistencia", "Fotos de la actividad publicadas en redes de la empresa", "Solo el certificado emitido por la empresa capacitadora"], "a": 0, "e": "Lo que no se documenta no se puede demostrar."}, {"t": "mc", "q": "La identificación del beneficiario final en personas y estructuras jurídicas exige:", "o": ["Llegar a la persona natural que ejerce el control", "Identificar al representante legal inscrito", "Conocer al accionista mayoritario formal", "Verificar el domicilio fiscal de la sociedad"], "a": 0, "e": "Se levanta el velo societario."}, {"t": "mc", "q": "¿Qué son las APNFD y por qué importan al asegurador como clientes?", "o": ["Profesiones y actividades no financieras de riesgo propio", "Instituciones financieras reguladas por la norma bancaria", "Organismos que supervisan a las aseguradoras", "Un tipo de póliza para profesionales independientes"], "a": 0, "e": "Conocer su estatus ayuda a calibrar el riesgo." ticas corresponde a:", "o": ["La junta directiva u órgano equivalente", "El oficial de cumplimiento exclusivamente", "La superintendencia antes de su uso", "La asamblea de accionistas"], "a": 0, "e": "Compromete a toda la organización."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos frecuentes de clientes y vive por encima de su sueldo. ¿Qué debe hacer el supervisor?", "o": ["Reportar al Oficial por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Conversar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Los auditores externos, respecto de los casos investigados y los reportes remitidos:", "o": ["No tienen acceso a ellos", "Tienen acceso pleno para su informe", "Acceden solo con permiso del cliente", "Acceden solo si lo pide la UNIF"], "a": 0, "e": "La confidencialidad del reporte es absoluta frente a terceros."}, {"t": "vf", "q": "Una aseguradora que terceriza una función de cumplimiento sigue siendo responsable frente al supervisor.", "a": true, "e": "La responsabilidad final no se delega."}, {"t": "mc", "q": "La Junta Directiva de una aseguradora aprueba cada año un presupuesto específico para cumplimiento. ¿Qué principio busca asegurar la norma con esto?", "o": ["Que la función cuente con recursos reales", "La Junta controle el presupuesto personal del Oficial", "Se reduzcan los costos de capacitación del personal", "Se pague una compensación al presidente por el control"], "a": 0, "e": "Sin recursos, el sistema es solo formal."}, {"t": "mc", "q": "Frente a la decisión del oficial de remitir un reporte, la junta directiva:", "o": ["No puede negarla", "Puede vetarla con mayoría calificada", "Debe aprobarla previamente en acta", "Puede diferirla por treinta días"], "a": 0, "e": "Garantía de independencia de la función."}, {"t": "mc", "q": "La Providencia 209 de SUNAVAL se pedirla.", "a": false, "e": "No puede negar la remisión."}, {"t": "mc", "q": "Una sociedad de corretaje de seguros pregunta si está obligada por la Norma de SUDEASEG 2024. ¿Qué respuesta es correcta?", "o": ["Sí, con estructura proporcional a su riesgo", "No, porque la norma solo obliga a las empresas de seguros", "No, porque las sociedades de corretaje las supervisa la UNIF", "Sí, pero solo respecto de los siniestros que intermedie"], "a": 0, "e": "Proporcionalidad: obligación sí, estructura según riesgo y tamaño."}, {"t": "mc", "q": "Un cliente persona natural extranjera no residente contrata una póliza. ¿Qué documento de identificación corresponde según la lógica de la norma?", "o": ["Pasaporte vigente", "Cédula laminada vigente", "Licencia de conducir", "Solo el RIF"], "a": 0, "e": "El pasaporte es el documento para extranjeros no residentes."}]}]}, {"titulo": "Convenios internacionales: Viena, Palermo, Mérida y otros", "exams": [{"titulo": "Convenios internacionales · modelo 1", "q": [{"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "El nombre completo del instrumento conocido como Convención de Viena de 1988 alude a:", "o": ["El tráfico ilícito de estupefacientes y sustancias sicotrópicas", "La delincuencia organizada de carácter transnacional y sus formas", "La corrupción de funcionarios públicos", "El derecho de los tratados entre Estados"], "a": 0, "e": "Cuidado: hay otras convenciones firmadas en Viena sobre materias distintas."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": {"t": "mc", "q": "El Convenio de Budapest, cuando se menciona en esta materia, trata de:", "o": ["La ciberdelincuencia y la prueba electrónica", "La corrupción en el deporte", "El tráfico de bienes culturales", "La protección de los datos personales en línea"], "a": 0, "e": "Relevante por el delito informático como delito determinante."}, {"t": "mc", "q": "¿Qué instrumento universal aborda de forma específica la recuperación y restitución de activos producto de corrupción?", "o": ["La Convención de Mérida", "La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo"], "a": 0, "e": "Capítulo V de Mérida."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "Comparando Palermo con la LOCDOFT en el concepto de delito grave:", "o": ["Palermo usa cuatro años y la ley venezolana más de cinco", "Ambas usan exactamente cuatro años de pena", "Palermo usa cinco años y la ley venezolana cuatro años", "La ley venezolana no define el concepto"], "a": 0, "e": "Es una de las trampas más repetidas."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "El protocolo de Palermo sobre trata de personas se conoce como:", "o": ["Protocolo de Palermo contra la trata, en especial de mujeres y niños", "Protocolo de Nueva York sobre el trabajo forzoso y la servidumbre", "Protocolo adicional sobre explotación laboral", "Protocolo de Ginebra sobre migración"], "a": 0, "e": "Es el primer instrumento universal con definición de trata."}, {"t": "mc", "q": "Para Palermo, un «delito grave» es el que tiene una pena privativa de libertad máx s"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "mc", "q": "Para que Palermo se aplique se requiere, por regla general:", "o": ["Carácter transnacional y un grupo delictivo organizado", "Que el delito tenga una pena máxima mayor a diez años", "Que intervenga un funcionario público", "Que el delito se cometa con violencia"], "a": 0, "e": "Ambos elementos, salvo las excepciones del propio texto."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Serán siempre delitos políticos", "Quedarán sujetos a la discreción del requerido", "Solo se extraditarán entr nformación."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "El artículo 31 de Mérida regula:", "o": ["Embargo preventivo, incautación y decomiso", "La protección de denunciantes", "La cooperación con el sector privado", "El acceso a la información pública"], "a": 0, "e": "Instrumentos sobre los bienes."}]}, {"titulo": "Convenios internacionales · modelo 2", "q": [{"t": "mc", "q": "El grupo delictivo organizado que define Palermo requiere un número mínimo de:", "o": ["Tres personas", "Dos personas", "Cinco personas", "Cuatro personas"], "a": 0, "e": "Tres o más, actuando concertadamente."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo (2002) se adoptó en el marco de:", "o": ["La OEA, en Bridgetown, Barbados", "La ONU, en Nueva York", "La OEA, en Caracas", "La ONU, en Viena"], "a": 0, "e": "Instrumento regional contra el terrorismo y su financiamiento."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "mc", "q": "Cuando un Estado ratifica un tratado de esta materia, debe:", "o": ["Adecuar su legislación interna para poder cumplirlo", "Aplicarlo solo si su constitución repite su contenido", "Esperar la autorización del GAFI", "Someterlo a referendo cada diez años"], "a": 0, "e": "Obligación de adecuación normativa."}, {"t": "mc", "q": "El artículo 18 del Convenio de 1999 pide a los Estados exigir a las instituciones financieras:", "o": ["Identificar clientes y reportar operaciones sospechosas", "Limitar las transferencias internacionales", "Cerrar las cuentas de todas las organizaciones benéficas", "Depositar reservas en el banco central"], "a": 0, "e": "Medidas preventivas de corte antilavado."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "vf", "q": "Según el Convenio de 1999, no es necesario que los fondos se hayan utilizado efectivamente para que exista delito.", "a": true, "e": "La consumación es anticipada."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Según el Convenio de 1999, comete delito de financiación del terrorismo quien:", "o": ["Provee o recolecta fondos sabiendo su uso terrorista", "Comete personalmente el acto terrorista con sus fondos", "Solo quien recibe fondos de origen ilícito", "Solo quien traslada efectivo por una frontera"], "a": 0, "e": "Art. 2: basta la intención o el conocimiento del uso de los fondos."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana contra la Corrupción es conocido como:", "o": ["MESICIC", "GAFIC", "CICAD", "MONEYVAL"], "a": 0, "e": "Mecanismo de Seguimiento de la Implementación de la Convención Interamericana contra la Corrupción."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Palermo prevé los equipos conjuntos de investigación para:", "o": ["Permitir que autoridades de varios Estados trabajen juntas", "Sustituir a los tribunales nacionales", "Crear una policía internacional permanente", "Juzgar los hechos en el territorio de un tercer Estado"], "a": 0, "e": "Herramienta de cooperación operativa."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "vf", "q": "Palermo cuenta con protocolos sobre trata de personas, tráfico ilícito de migrantes y armas de fuego.", "a": true, "e": "Son sus tres protocolos complementarios."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para una aseguradora venezolana es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado en lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción fue adoptada en 1996 en:", "o": ["Caracas, en el marco de la OEA", "Mérida, México, en el marco de la ONU", "Palermo, Italia, en el marco de la ONU", "Washington, en el marco de la OEA"], "a": 0, "e": "Instrumento regional pionero; no confundir con la de Mérida."}, {"t": "mc", "q": "La función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "La Convención de Viena de 1988 es la Convención de las Naciones Unidas contra:", "o": ["Tráfico ilícito de estupefacientes y sicotrópicos", "La delincuencia organizada transnacional y sus protocolos", "La corrupción y la recuperación de activos", "El terrorismo y su financiamiento"], "a": 0, "e": "Es el origen del régimen internacional contra el lavado de activos."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las R.3 y R.36 a R.40 del GAFI", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, es decir, quien ofrece y quien acepta", "Solo activa, de quien ofrece el beneficio", "Solo pasiva, es decir, de quien recibe el beneficio", "Solo cuando el funcionario es extranjero"], "a": 0, "e": "Ambas modalidades."}]}, {"titulo": "Convenios internacionales · modelo 3", "q": [{"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "Un Estado que ratifica un tratado como Palermo debe, en lo esencial:", "o": ["Adecuar su legislación interna y cooperar con otros Estados", "Transferir su competencia penal a la ONU", "Ceder su jurisdicción sobre delitos transnacionales", "Crear un tribunal propio para cada delito"], "a": 0, "e": "Los tratados obligan a incorporar sus disposiciones al derecho interno."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Solo penalización y extradición", "Solo medidas preventivas del sector público", "Solo la cooperación entre las unidades de inteligencia financiera"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mérida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "El Convenio de 1999 pide a los Estados medidas para que las instituciones financieras:", "o": ["Identifiquen clientes y reporten sospechas", "Cierren cuentas de todas las ONG", "Reduzcan montos máximos de transferencia", "Eviten operar con efectivo"], "a": 0, "e": "Art. 18: medidas preventivas de identificación y reporte."}, {"t": "mc", "q": "¿Qué exige Mérida a las instituciones financieras respecto de las cuentas de personas expuestas políticamente?", "o": ["Un examen más estricto de esas cuentas", "Cerrarlas de inmediato", "Prohibir su apertura en el exterior", "Informar al funcionario sobre su monitoreo"], "a": 0, "e": "Art. 52: debida diligencia reforzada para quienes desempeñan o han desempeñado funciones públicas prominentes."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "Del siguiente grupo, el instrumento que NO pertenece al sistema universal de la ONU es:", "o": ["La Convención Interamericana contra la Corrupción", "La Convención de Palermo", "La Convención de Mérida", "El Convenio para la Represión de la Financiación del Terrorismo"], "a": 0, "e": "La Interamericana es de la OEA."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se conoce como Convención de:", "o": ["Mérida", "Palermo", "Viena", "Caracas"], "a": 0, "e": "Adoptada en 2003; el nombre proviene de la ciudad mexicana donde se abrió a firma."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se adoptó en:", "o": ["2003", "1996", "2000", "2005"], "a": 0, "e": "Aprobada por la Asamblea General en 2003."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "La Convención de Estrasburgo de 1990, en el ámbito europeo, trata de:", "o": ["Blanqueo, investigación, incautación y decomiso del producto del delito", "Protección de los derechos humanos", "Cooperación aduanera entre Estados", "Reconocimiento y ejecución de sentencias civiles extranjeras"], "a": 0, "e": "Instrumento regional europeo sobre decomiso."}, {"t": "mc", "q": "La diferencia esencial entre un convenio y una recomendación del GAFI es que el convenio:", "o": ["Obliga jurídicamente al Estado que lo ratifica", "Se aplica solo a las instituciones financieras", "Puede modificarse por decisión del GAFI", "Tiene vigencia limitada a cinco años"], "a": 0, "e": "Fuerza vinculante frente a estándar."}, {"t": "mc", "q": "Un delito es transnacional para Palermo cuando, entre otros supuestos:", "o": ["Se comete en más de un Estado", "Lo comete un extranjero en territorio nacional", "Los fondos se depositan en un banco extranjero", "La víctima tiene otra nacionalidad"], "a": 0, "e": "También: preparación en otro Estado, grupo que opera en varios, o efectos sustanciales en otro."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "El artículo 16 de Palermo se refiere a:", "o": ["La extradición entre los Estados parte", "La asistencia judicial recíproca", "La protección de los testigos", "Las técnicas especiales de investigación"], "a": 0, "e": "El 18 regula la asistencia judicial recíproca."}, {"t": "mc", "q": "Una aseguradora recibe una póliza de alto valor de la esposa de un alto funcionario público. ¿Qué instrumento internacional aporta el marco sobre PEP?", "o": ["Mérida, junto con las Recomendaciones del GAFI", "Viena, por tratarse de seguros de vida", "El Convenio de Financiación del Terrorismo", "Palermo, por ser un delito organizado"], "a": 0, "e": "Mérida (art. 52) exige examen más estricto de cuentas de PEP; el GAFI lo desarrolla en la R.12."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "Palermo permite, respecto de la carga de la prueba en el decomiso, que los Estados:", "o": ["Consideren exigir al imputado demostrar el origen lícito", "Inviertan siempre la carga de la prueba en estos delitos", "Prescindan de todo proceso judicial", "Decomisen sin identificar los bienes"], "a": 0, "e": "Es una posibilidad que la Convención invita a considerar."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "vf", "q": "La Convención de Viena de 1988 dispone que el secreto bancario no debe ser obstáculo para la asistencia judicial en materia de decomiso.", "a": true, "e": "Viena y los tratados posteriores desalientan invocar el secreto bancario frente a investigaciones penales."}, {"t": "mc", "q": "El artículo 18 de Palermo regula:", "o": ["La asistencia judicial recíproca más amplia posible", "El traslado de personas condenadas entre Estados", "La creación de equipos conjuntos", "La protección de las víctimas"], "a": 0, "e": "Es uno de los artículos más extensos del tratado."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Un alumno dice que la Convención de Viena de 1988 regula el derecho de los tratados. El error es que:", "o": ["Esa es la Convención de Viena de 1969, de otra materia", "No existe ninguna convención firmada en Viena en 1969", "La de 1988 derogó a la de 1969", "Ambas regulan exactamente lo mismo"], "a": 0, "e": "Trampa clásica por coincidencia de ciudad."}, {"t": "mc", "q": "Palermo contempla la responsabilidad de las personas jurídicas por participación en delitos graves en que intervenga un grupo delictivo organizado. Esto significa que:", "o": ["La empresa responde sin condena de una persona", "Solo los directivos responden penalmente", "La empresa queda exenta si no obtuvo lucro", "La responsabilidad es solo moral"], "a": 0, "e": "Art. 10 de Palermo: responsabilidad penal, civil o administrativa, sin perjuicio de la de las personas naturales."}, {"t": "mc", "q": "La protección de testigos en Palermo incluye medidas como:", "o": ["Reubicación y limitación de la divulgación de su identidad", "Inmunidad penal absoluta para el testigo", "Pago de una pensión vitalicia estatal", "Traslado obligatorio del testigo a otro Estado parte"], "a": 0, "e": "Artículo 24 de la Convención."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención de Viena de 1988", "Solo la Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}]}]}, {"titulo": "Enfoque basado en riesgo", "exams": [{"titulo": "Enfoque basado en riesgo · modelo 1", "q": [{"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven a la aseguradora para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las primas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su póliza", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "mc", "q": "Un falso positivo en la revisión de listas se resuelve:", "o": ["Documentando la verificación que lo descarta", "Eliminando al cliente del sistema", "Reportándolo igualmente a la autoridad", "Suspendiendo la póliza por precaución"], "a": 0, "e": "El descarte también se documenta."}, {"t": "mc", "q": "El rescate anticipado de una póliza poco después de contratarla es señal de alerta porque:", "o": ["Sugiere que el objetivo era mover el dinero, no asegurarse", "Indica insatisfacción con el servicio", "Implica una pérdida económica para la aseguradora emisora", "Demuestra falta de capacidad de pago"], "a": 0, "e": "Patrón típico de colocación e integración."}, {"t": "mc", "q": "La integración del área de cumplimiento en el diseño de productos busca:", "o": ["Identificar riesgos antes de salir al mercado", "Retrasar el lanzamiento de la competencia", "Aumentar el precio final del producto", "Sustituir al área de mercadeo"], "a": 0, "e": "Cumplimiento desde el diseño."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "mc", "q": "Una medida típica de la debida diligencia intensificada es:", "o": ["Verificar el origen de los fondos y de la riqueza", "Solicitar una copia adicional de la cédula de identidad", "Cobrar una prima más elevada", "Reducir la suma asegurada ofrecida"], "a": 0, "e": "Se profundiza en el conocimiento, no en el precio."}, {"t": "mc", "q": "El plan operativo anual en materia de prevención debe contener:", "o": ["Actividades, responsables, plazos y recursos", "Las metas comerciales del ejercicio", "El listado de clientes de alto riesgo", "Las tarifas aprobadas por el supervisor"], "a": 0, "e": "Instrumento de gestión, no declarativo."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Pagar una indemnización a una cuenta distinta de la del asegurado requiere:", "o": ["Verificar la instrucción y la relación con el titular", "Ejecutarla siempre que el asegurado la pida por escrito", "Rechazarla siempre sin análisis", "Dividir el pago en varias partes"], "a": 0, "e": "El destino de los fondos también se controla."}, {"t": "mc", "q": "Un corredor cuyo nivel de vida no guarda relación con sus comisiones debe:", "o": ["Ser objeto de análisis por el área de cumplimiento", "Ser premiado por su desempeño comercial", "Ser cambiado de zona geográfica", "Ser ignorado por tratarse de su vida privada"], "a": 0, "e": "Riesgo interno previsto en la norma."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "mc", "q": "El cambio frecuente de beneficiarios en una póliza de vida es señal de alerta porque:", "o": ["Puede encubrir el traslado de valor a terceros", "Encarece la administración y el control de la póliza", "Dificulta el cálculo de la reserva", "Retrasa el pago de las comisiones"], "a": 0, "e": "El beneficiario es parte del análisis de riesgo."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "mc", "q": "El programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Una aseguradora documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de las pólizas"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Un asegurado con varias pólizas pequeñas en distintas compañías que suman una cifra elevada muestra:", "o": ["Un posible fraccionamiento entre entidades", "Una estrategia prudente de diversificación", "Un error del sistema de suscripción", "Una conducta irrelevante para el análisis"], "a": 0, "e": "El fraccionamiento también ocurre entre empresas."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "vf", "q": "Una aseguradora que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "vf", "q": "Un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "mc", "q": "La matriz de riesgo combina habitualmente dos dimensiones, que son:", "o": ["Probabilidad e impacto", "Prima y siniestralidad", "Antigüedad y volumen", "Solvencia y liquidez"], "a": 0, "e": "Cada riesgo se ubica según ambas."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "El riesgo reputacional derivado de un caso de lavado consiste en:", "o": ["La pérdida de confianza de clientes y contrapartes", "El costo de la multa impuesta", "La pérdida de la reserva técnica constituida", "El aumento de la siniestralidad"], "a": 0, "e": "Es distinto del riesgo legal y del financiero."}, {"t": "mc", "q": "Un asegurado que contrata una suma muy superior a su capacidad económica declarada:", "o": ["Genera una alerta sobre el origen de los fondos", "Demuestra previsión financiera", "Debe recibir un descuento comercial por fidelidad", "Solo interesa al área actuarial"], "a": 0, "e": "Incoherencia entre perfil y operación."}, {"t": "mc", "q": "Un siniestro reclamado poco después de contratar una póliza de alto valor exige:", "o": ["Análisis reforzado por posible fraude o lavado", "Pago inmediato para evitar reclamos", "Cancelación automática del contrato de seguro", "Traslado del caso al reasegurador"], "a": 0, "e": "El fraude también es un ilícito cubierto por el sistema."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "El intercambio de información entre aseguradoras sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en la póliza"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "mc", "q": "Los factores de riesgo que ordena considerar la norma del sector asegurador son:", "o": ["Clientes, productos, canales, zonas y tecnologías", "Primas, siniestros, reservas y comisiones", "Activos, pasivos, patrimonio, resultados y reservas", "Personal, oficinas, equipos y sistemas"], "a": 0, "e": "Cinco factores expresos."}, {"t": "mc", "q": "Un asegurado cancela una póliza de prima única a las pocas semanas y pide el reembolso a otra cuenta. ¿Cómo debe interpretarse?", "o": ["Señal de alerta que requiere análisis", "Conducta normal de un asegurado", "Cortesía comercial de la aseguradora", "Error operativo del área de cobranzas"], "a": 0, "e": "Rescate anticipado."}, {"t": "mc", "q": "Una aseguradora quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de primas de cada ramo", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Frente a un hallazgo del auditor, la respuesta adecuada incluye:", "o": ["Un plan con responsable, acción y fecha", "Una nota explicando que es un criterio discutible", "El archivo del hallazgo por no ser material", "La espera a la próxima auditoría"], "a": 0, "e": "Los hallazgos se cierran con acciones verificables."}, {"t": "mc", "q": "Evaluar la capacitación mediante una prueba sirve para:", "o": ["Comprobar que el mensaje fue comprendido", "Cumplir un requisito administrativo", "Justificar el pago al facilitador", "Clasificar al personal por antigüedad"], "a": 0, "e": "Sin medición no se conoce la eficacia."}, {"t": "mc", "q": "Un intermediario que concentra pólizas de prima única de clientes no residentes:", "o": ["Es un foco de riesgo que debe supervisarse", "Demuestra una gestión comercial destacada", "Reduce el riesgo al centralizar la cartera", "Solo interesa al área de comisiones"], "a": 0, "e": "Concentración de riesgo en un canal."}, {"t": "mc", "q": "Que un tercero sin vínculo aparente pague la prima de un asegurado exige:", "o": ["Identificar al pagador y entender la relación", "Rechazar el pago sin más análisis", "Aceptarlo si el monto es moderado", "Trasladar la póliza a nombre del pagador"], "a": 0, "e": "El origen de los fondos forma parte del conocimiento."}, {"t": "mc", "q": "Una persona natural que recibe siniestros de múltiples pólizas de empresas distintas, sin relación evidente, genera:", "o": ["Señal de alerta de posible esquema de fraude o lavado", "Patrón normal para una persona asegurada", "Cliente de riesgo bajo por su historial de siniestros", "Compensación habitual entre empresas aseguradas"], "a": 0, "e": "Patrones anómalos requieren análisis."}]}, {"titulo": "Enfoque basado en riesgo · modelo 2", "q": [{"t": "mc", "q": "Dentro del factor cliente, un elemento que eleva el riesgo es:", "o": ["Que el cliente sea una persona expuesta políticamente", "Que el cliente pague por transferencia bancaria", "Que el cliente tenga domicilio en la capital", "Que el cliente contrate varios ramos"], "a": 0, "e": "La exposición política es factor reconocido."}, {"t": "mc", "q": "Para un cliente de riesgo bajo, la frecuencia de actualización:", "o": ["Puede ser mayor, siempre que esté justificada", "Debe ser igual a la del riesgo alto", "No es necesaria en ningún caso", "La fija el intermediario que captó al cliente"], "a": 0, "e": "Proporcionalidad documentada."}, {"t": "mc", "q": "Dentro del factor tecnológico, eleva el riesgo el uso de:", "o": ["Medios que permiten anonimato o fragmentación", "Firmas electrónicas certificadas", "Sistemas de monitoreo automatizados de operaciones", "Bases de datos centralizadas"], "a": 0, "e": "La tecnología puede reducir o aumentar riesgo según su uso."}, {"t": "mc", "q": "La figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Una decisión consciente, documentada y del nivel adecuado", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "Al evaluar un canal de venta digital, un control compensatorio adecuado es:", "o": ["La verificación reforzada de identidad a distancia", "La reducción del horario de atención", "El aumento del precio del producto", "La limitación de la venta a clientes de la capital"], "a": 0, "e": "Mitigar la ausencia de contacto presencial."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Una aseguradora decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "mc", "q": "La «cultura de cumplimiento» en una organización se evidencia principalmente por:", "o": ["El ejemplo de la alta dirección", "El número de manuales de la empresa", "El tamaño del departamento de cumplimiento", "La decoración de las oficinas de la empresa"], "a": 0, "e": "Es práctica, no papel."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "¿Por qué el seguro de prima única es considerado de mayor riesgo?", "o": ["Permite colocar una suma y rescatarla como lícita", "Es un seguro barato sin documentación exigida", "Se paga mensualmente sin verificar al cliente", "Es obligatorio para cierto tipo de clientes"], "a": 0, "e": "Colocación y recuperación rápidas."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "mc", "q": "El presupuesto específico para cumplimiento que aprueba la junta busca:", "o": ["Que el sistema cuente con medios reales", "Reducir el gasto general de la empresa", "Financiar la expansión comercial", "Cubrir las multas del supervisor"], "a": 0, "e": "Sin recursos el sistema es nominal."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "vf", "q": "El supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación ident do de los empleados clave", "Evitar nuevas contrataciones en cumplimiento"], "a": 0, "e": "Riesgo interno."}, {"t": "mc", "q": "El indicador más útil para medir la salud del sistema de prevención es:", "o": ["La calidad del análisis de las alertas generadas", "El número de páginas que tiene el manual vigente", "La cantidad de personal del área", "El presupuesto ejecutado en el año"], "a": 0, "e": "Calidad del proceso, no insumos."}, {"t": "mc", "q": "Documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Dentro del factor producto, eleva el riesgo que la póliza:", "o": ["Permita rescate anticipado o acumule valor", "Cubra responsabilidad civil obligatoria", "Tenga una suma asegurada baja", "Se renueve automáticamente cada año"], "a": 0, "e": "Los productos con valor de rescate son más atractivos para lavar."}, {"t": "mc", "q": "Al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Rechazarlas como clientes por el principio de prudencia", "Tratarlas siempre como riesgo bajo", "Exigirles una garantía bancaria"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "mc", "q": "Un cliente de riesgo alto exige que se actualicen sus datos con frecuencia no mayor a:", "o": ["Un año", "Dos años", "Tres años", "Cinco años"], "a": 0, "e": "Regla del sector asegurador."}, {"t": "mc", "q": "La trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."
