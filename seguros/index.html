undada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Evitar un riesgo, en el lenguaje de la gestión, significa:", "o": ["No realizar la actividad que lo genera", "Contratar un seguro que lo cubra", "Reducir su probabilidad con controles", "Aceptarlo y monitorearlo"], "a": 0, "e": "Evitar, mitigar, transferir y aceptar son las cuatro respuestas."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "¿Qué exige la Recomendación 1 del GAFI a los países?", "o": ["Evaluar riesgos y aplicar enfoque basado en riesgo", "Aplicar el mismo control a todos los clientes", "Prohibir el uso de efectivo en el sistema financiero", "Crear una unidad de inteligencia en cada banco"], "a": 0, "e": "Base del sistema."}, {"t": "mc", "q": "Una señal de que la cultura de cumplimiento es débil es que:", "o": ["Las excepciones al procedimiento se vuelvan rutina", "El manual se actualice todos los años", "La capacitación sea obligatoria para todo el personal", "La junta reciba informes trimestrales"], "a": 0, "e": "La excepción normalizada erosiona el control."}, {"t": "mc", "q": "Un plan de mitigación debe indicar, para cada riesgo identificado:", "o": ["El control, el responsable y el plazo", "El monto de la pérdida esperada", "La prima que compensa ese riesgo", "El número de clientes afectados"], "a": 0, "e": "Sin responsable y plazo no hay gestión."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, " jos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Un cambio que obliga a revisar la autoevaluación antes del plazo ordinario es:", "o": ["El lanzamiento de un canal de venta digital", "La contratación de un nuevo mensajero", "El cambio de proveedor de papelería", "La renovación del mobiliario de oficina"], "a": 0, "e": "Nuevos canales alteran el perfil de riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "mc", "q": "La debida diligencia simplificada corresponde al riesgo:", "o": ["Bajo", "Moderado", "Alto", "Crítico"], "a": 0, "e": "Y nunca ante sospecha."}]}]}], "all": [{"t": "mc", "q": "El hermano de un gobernador contrata una póliza de alta suma. Según la LOCDOFT, el tratamiento adecuado es:", "o": ["Tratarlo como familiar de PEP, con aprobación de la alta gerencia", "Tratarlo como un cliente ordinario porque el PEP no es el contratante", "Rechazarlo, ya que la ley prohíbe contratar con familiares de PEP", "Notificar al gobernador para que autorice la contratación"], "a": 0, "e": "Los familiares cercanos y allegados forman parte del círculo PEP."}, {"t": "mc", "q": "Un gerente quiere cerrar de inmediato las pólizas de un cliente investigado «para protegerse». Según la LOCDOFT:", "o": ["No cerrar sin autorización judicial, para no frustrar la investigación", "Cerrar de inmediato e informar luego a la UNIF del cierre", "Cerrar la relación con la aprobación de la Junta Directiva de la empresa", "Cerrar si el cliente figura como riesgo alto en el sistema"], "a": 0, "e": "El cierre puede alertar al investigado y destruir evidencia."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "A los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "mc", "q": "Una empresa opera en dos sectores regulados a la vez, por ejemplo seguros y valores. Debe:", "o": ["Cumplir las exigencias de ambos supervisores", "Elegir el régimen que considere más favorable", "Cumplir solo el del sector de mayor facturación", "Quedar exenta por el conflicto de normas"], "a": 0, "e": "Los regímenes se acumulan."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Un funcionario recibe una póliza de vida «de regalo» pagada por un contratista del Estado. La lectura adecuada es:", "o": ["Posible beneficio indebido que exige análisis anticorrupción", "Obsequio comercial normal sin ninguna implicación legal", "Acto lícito siempre que el funcionario lo declare después", "Operación de riesgo bajo por tratarse de un seguro de vida"], "a": 0, "e": "Los PEP exigen especial atención a dádivas y regalos."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "La Norma de SUDEASEG 2024 exige conservar 10 años en formato digital, mientras la LOCDOFT exige cinco. ¿Cómo debe una aseguradora aplicar ambas?", "o": ["El más exigente: la norma sectorial puede endurecer el mínimo legal", "El de la ley, porque la ley prevalece sobre la providencia", "El que la aseguradora elija según el soporte documental", "El de la norma, pero solo durante las inspecciones del órgano"], "a": 0, "e": "La ley fija mínimos; la norma sectorial puede ser más estricta."}, {"t": "mc", "q": "Una constructora, una notaría y una aseguradora son sujetos obligados según la LOCDOFT. Lo que tienen en común es que:", "o": ["Están bajo el control de un órgano o ente de control", "Todas dependen jerárquicamente de la ONCDOFT", "Todas reportan sus operaciones directamente a SUDEASEG", "Todas están en el mismo sector económico regulado"], "a": 0, "e": "Sujeto obligado es quien está bajo el control de un órgano de control; cada sector tiene el suyo."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "En seguros, ¿cuál de las siguientes es una señal de alerta típica de lavado?", "o": ["Cancelar una prima única y devolverla a un tercero", "Pago puntual de primas por débito desde la cuenta del asegurado", "Renovación anual con ajuste normal de la suma asegurada", "Reclamo por siniestro con inspección completa"], "a": 0, "e": "Prima única, rescate rápido y pagos a terceros son patrones de lavado."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las primas de seguros", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la LOCDOFT, el traslado de efectivo por frontera se controla mediante:", "o": ["Una declaración obligatoria por encima de un umbral", "Una autorización previa otorgada por el órgano rector", "Una prohibición total de llevar efectivo", "Un impuesto a la salida de divisas"], "a": 0, "e": "Declaración, no prohibición."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Una aseguradora recibe una citación del Ministerio Público sobre un asegurado y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de información del Ministerio Público sobre un asegurado. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "Si una aseguradora no tiene manual de prevención, quien tiene competencia para sancionarla administrativamente por esa omisión es:", "o": ["El órgano de control de su sector, es decir, SUDEASEG", "La UNIF, por ser la unidad de inteligencia financiera", "El Ministerio Público, por tratarse de un delito", "El juez de control, previa solicitud fiscal"], "a": 0, "e": "SUDEASEG es el órgano de control del sector asegurador."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Una aseguradora quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada aseguradora", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede sustituirla libremente cuando la otra sea más exigente", "Debe aplicar siempre la del sector bancario", "Puede elegir la que prefiera cada año"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "La razón por la que los notarios y registradores figuran como sujetos obligados es que:", "o": ["Intervienen en actos que transfieren bienes de alto valor", "Reciben pagos en efectivo de parte de sus usuarios", "Dependen del Ministerio de Justicia", "Emiten documentos con fe pública"], "a": 0, "e": "El traspaso de inmuebles y sociedades es vía típica de integración."}, {"t": "mc", "q": "Si la UNIF pide información a una aseguradora sobre un cliente, la aseguradora debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de todas las transacciones en efectivo del mes anterior se remite a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El Banco Central"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "Un intermediario cobra comisiones elevadas por cada póliza de prima única vendida. El riesgo a vigilar es:", "o": ["Conflicto de interés y presión comercial sobre la debida diligencia", "Mayor protección para el asegurado por una suma más alta", "Incumplimiento de las tarifas oficiales del sector asegurador", "Exceso de reservas técnicas por primas únicas elevadas"], "a": 0, "e": "Los incentivos mal diseñados erosionan los controles."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Quien dicta las normas prudenciales para el sector bancario venezolano es:", "o": ["La Superintendencia de las Instituciones del Sector Bancario", "La Superintendencia Nacional de Valores", "La Superintendencia de la Actividad Aseguradora del país", "El Banco Central de Venezuela"], "a": 0, "e": "SUDEBAN para la banca; SUNAVAL para valores."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Un cliente propone pagar con efectivo varias pólizas pequeñas el mismo día, justo por debajo del monto de control. La conducta descrita se conoce como:", "o": ["Fraccionamiento o «pitufeo» para evadir controles", "Diversificación legítima de coberturas de seguro", "Planificación fiscal habitual mediante primas pequeñas", "Contratación escalonada propia de un cliente corporativo"], "a": 0, "e": "Es una señal clásica de colocación."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Una aseguradora con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector asegurador"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Una aseguradora recibe instrucciones contradictorias de su superintendencia y de la UNIF sobre un reporte. Lo correcto es:", "o": ["Consultar a ambas y dejar constancia escrita", "Obedecer siempre a la superintendencia", "Obedecer siempre a la UNIF", "No reportar hasta que se pongan de acuerdo"], "a": 0, "e": "Nunca dejar de reportar; documentar la consulta."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a una aseguradora por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Una aseguradora pequeña dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: las aseguradoras pequeñas quedan exentas", "Debe copiar el manual de una aseguradora de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "En la arquitectura venezolana, quien dicta normas prudenciales para las aseguradoras es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera", "El Ministerio Público"], "a": 0, "e": "Cada supervisor dicta las normas de su sector."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Un cliente persona jurídica extranjera con varias capas societarias en jurisdicciones opacas pide una póliza de alto valor. Lo primero es:", "o": ["Identificar a la persona natural que lo controla en última instancia", "Pedir el RIF y el acta constitutiva de la sociedad cliente", "Exigir una garantía bancaria por el equivalente a la suma asegurada", "Consultar primero la política del reasegurador que respalda"], "a": 0, "e": "Sin beneficiario final no hay debida diligencia válida."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de seguros", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "Una aseguradora, un banco y una casa de bolsa tienen deberes equivalentes de prevención pero distinto supervisor. Eso se explica porque la LOCDOFT:", "o": ["Fija deberes comunes y asigna cada sector a su órgano de control", "Obliga a todos a reportar ante su propia superintendencia sectorial", "Deja a cada sector definir sus propios deberes", "Aplica solo al sector bancario y por analogía al resto"], "a": 0, "e": "Deberes comunes, supervisión sectorial, reporte centralizado en la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Un cliente paga la prima con un cheque de un tercero sin vínculo aparente. Corresponde:", "o": ["Identificar al tercero, entender el motivo y evaluar el riesgo", "Aceptar el pago, porque el cheque tiene fondos suficientes", "Devolver el cheque sin pedir ninguna explicación al cliente", "Aceptar el pago y pasar al cliente a riesgo moderado"], "a": 0, "e": "El pagador real forma parte del conocimiento del cliente y del origen de fondos."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una aseguradora identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre aseguradora y asegurado"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, ser PEP implica por sí mismo que el cliente debe ser rechazado.", "a": false, "e": "La condición de PEP eleva el riesgo y exige medidas reforzadas; no implica ilicitud ni rechazo automático."}, {"t": "mc", "q": "El decomiso de bienes en la LOCDOFT se distingue de la multa en que el decomiso:", "o": ["Recae sobre bienes vinculados al delito", "Se paga en unidades tributarias", "Lo impone el órgano de control", "Se aplica solo a personas naturales"], "a": 0, "e": "Multa es sanción pecuniaria; decomiso recae sobre el producto o instrumento."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la prima se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "Siempre existe norma sectorial para todo el país", "Debe esperar a que se dicte la norma prudencial de su sector", "Solo responden los sectores con superintendencia"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación.  "Viena, Palermo, Mérida y el Convenio de 1999."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "La Recomendación 34 se refiere a:", "o": ["Guía y retroalimentación a los sujetos obligados", "Sanciones administrativas y penales", "Cooperación entre unidades de inteligencia", "Supervisión consolidada de grupos"], "a": 0, "e": "El supervisor debe orientar, no solo sancionar."}, {"t": "mc", "q": "Según el GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes", "Juzga a los sujetos obligados que hayan incumplido", "Representa al Estado ante los tribunales"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Un cliente solicita devolver una prima de seguro a una cuenta de un tercero. ¿Qué principio del GAFI y de la práctica aseguradora se pone en juego?", "o": ["Conocer origen, destino y relación entre las partes", "Respetar el secreto bancario del asegurado", "Proteger la libertad de disposición de los fondos", "Aplicar la reciprocidad entre instituciones"], "a": 0, "e": "Pagos a terceros requieren análisis."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas pa ", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de la UNIF de ampliar información sobre un cliente. ¿Cómo debe interpretarse la obligación?", "o": ["Suministrarla a tiempo: cooperar es parte del deber", "Negarla si el cliente no ha dado su autorización", "Pedir permiso previo al cliente para entregarla", "Ignorarla hasta recibir una orden judicial firme"], "a": 0, "e": "La LOCDOFT obliga a los sujetos a remitir información requerida."}, {"t": "mc", "q": "Un supervisor comercial nota que un corredor aumentó de forma inexplicable su cartera de pólizas de prima única y su nivel de vida. ¿Cómo debe interpretarse?", "o": ["Señal de alerta que debe analizar cumplimiento", "Éxito comercial que debe premiarse al intermediario", "Asunto personal ajeno a la aseguradora", "Prueba de buen desempeño del equipo de ventas"], "a": 0, "e": "La norma pide vigilar cambios de conducta y nivel de r la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "vf", "q": "La aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "La sospecha desplaza la clasificación previa."}, {"t": "mc", "q": "El expediente del reasegurador exige, entre otros recaudos:", "o": ["Estados financieros auditados de años recientes", "Solo la calificación de riesgo publicada en su página web", "Únicamente el contrato de reaseguro", "La póliza original del asegurado cedido"], "a": 0, "e": "El reaseguro también es canal de riesgo."}, {"t": "mc", "q": "¿Qué busca la norma al prohibir que el intermediario suscriba por el cliente?", "o": ["Garantizar la autenticidad de la declaración", "Reducir los costos de gestión del intermediario", "Evitar la intervención de intermediarios en el sector", "Facilitar el llenado de formularios a clientes nuevos"], "a": 0, "e": "Una declaración falsa no puede ser atribuida al cliente."}, {"t": "vf", "q": "La Providencia SAA-01-0530-2024 y la SAA-01-0536-2024 regulan lo mismo: la administración de riesgos de LC/FT/FPADM.", "a": false, "e": "La 0530-2024 trata del Buen Gobierno Corporativo; la 0536-2024 es la norma de riesgos de LC/FT/FPADM."}, {"t": "mc", "q": "¿Quién debe impartir la capacitación en materia de LC/FT al sector asegurador según la lógica de la norma?", "o": ["Facilitadores inscritos en el RUF de la ONCDOFT", "Cualquier profesional con experiencia en seguros", "Exclusivamente el Oficial de Cumplimiento de la empresa", "Solo funcionarios de SUDEASEG designados para ello"], "a": 0, "e": "El RUF asegura idoneidad de los capacitadores."}, {"t": "mc", "q": "¿Qué busca la actualización periódica de datos de clientes de alto riesgo?", "o": ["Mantener el perfil vi ": ["Riesgo de otros ilícitos que genera fondos a legitimar", "Tema ajeno al sistema por ser fraude interno", "Tema laboral que corresponde solo a recursos humanos", "Tema penal que atañe únicamente a las autoridades"], "a": 0, "e": "El fraude puede ser delito determinante."}, {"t": "mc", "q": "La norma extiende el concepto de PEP a los familiares hasta el cuarto grado de consanguinidad y segundo de afinidad y a sus colaboradores cercanos. ¿Qué lógica hay detrás?", "o": ["Evitar el uso de testaferros cercanos al PEP", "Aumentar la carga documental del sector", "Aplicar una sanción indirecta a los familiares", "Reducir el número de clientes de las aseguradoras"], "a": 0, "e": "Los testaferros son el mecanismo típico."}, {"t": "mc", "q": "¿Para qué sirve la autoevaluación de riesgo?", "o": ["Identificar y ponderar riesgos y ajustar controles", "Cumplir una formalidad que se presenta cada año", "Permitir que SUDEASEG fije las primas del sector", "Sancionar a los clientes que presenten riesgo alto"], "a": 0, "e": "Es la base del enfoque basado en riesgo."}, {"t": "mc", "q": "Una aseguradora clasifica a sus clientes en solo dos categorías: riesgo alto y riesgo bajo. ¿Qué observación hace SUDEASEG según su Norma 2024?", "o": ["Los niveles obligatorios son tres: bajo, moderado y alto", "Está bien: la norma permite solo alto y bajo", "Debe tener cinco niveles, con uno crítico y otro muy bajo", "Puede definir sus propios niveles según su política interna"], "a": 0, "e": "La norma fija tres niveles de riesgo."}, {"t": "mc", "q": "¿Qué relación hay entre la autoevaluación de riesgo, el manual y el plan operativo?", "o": ["Riesgos identificados, procedimientos y plan de actividades", "Son documentos independientes sin ninguna relación entre sí", "El plan operativo sustituye a la autoevaluación anual", "El manual sustituye al plan operativo de cada ejercicio"], "a": 0, "e": "Coherencia del sistema."}, {"t": "mc", "q": "Un cliente PEP solicita un seguro de vida con beneficiarios
