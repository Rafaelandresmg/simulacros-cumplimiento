nacionalidad", "Determinar las primas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "vf", "q": "Según el GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "A los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "mc", "q": "Una aseguradora quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el presupuesto específico que aprueba la junta cubre la materia de riesgos y también el buen gobierno corporativo.", "a": true, "e": "Art. 8, num. 2. Trampa: se cree que solo cubre la prevención."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según la Norma de SUDEASEG 2024, es familiar comprendido en el concepto de PEP del sector:", "o": ["Un primo hermano de la persona expuesta", "El cónyuge del primo de la persona expuesta", "Un concuñado de la persona expuesta", "Un sobrino político en cuarto grado"], "a": 0, "e": "Hasta cuarto grado de consanguinidad y segundo de afinidad."}, {"t": "mc", "q": "Según el GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["Cumplimiento técnico y efectividad del sistema", "Solo si el país tiene leyes contra el lavado vigentes", "Solo el número de condenas dictadas por lavado", "Solo el tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "vf", "q": "Según el GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Una aseguradora lanza un seguro digital vendido solo por una aplicación móvil. Desde la lógica de la autoevaluación de riesgo, ¿qué debe hacer antes de lanzarlo?", "o": ["Evaluar el riesgo del producto y definir controles", "Lanzarlo y evaluar el riesgo en la próxima autoevaluación", "Esperar a la inspección de SUDEASEG para ajustarlo", "Pedir autorización previa a la UNIF para comercializarlo"], "a": 0, "e": "Productos y canales nuevos exigen evaluación previa."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "vf", "q": "Según la Norma de SUDEASEG 2024, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta a la junta directiva. Trampa: el presidente lo suple, pero no es su superior."}, {"t": "vf", "q": "La norma del sector alterna plazos en días hábiles y en días continuos, y confundirlos puede significar un incumplimiento.", "a": true, "e": "Conviene memorizar cuál es cuál."}, {"t": "mc", "q": "Dentro del factor producto, eleva el riesgo que la póliza:", "o": ["Permita rescate anticipado o acumule valor", "Cubra responsabilidad civil obligatoria", "Tenga una suma asegurada baja", "Se renueve automáticamente cada año"], "a": 0, "e": "Los productos con valor de rescate son más atractivos para lavar."}, {"t": "vf", "q": "La norma del sector asegurador entró en vigencia con su publicación en la Gaceta Oficial, sin período de vacancia.", "a": true, "e": "Vigencia inmediata desde la publicación."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "Un cliente propone pagar con efectivo varias pólizas pequeñas el mismo día, justo por debajo del monto de control. La conducta descrita se conoce como:", "o": ["Fraccionamiento o «pitufeo» para evadir controles", "Diversificación legítima de coberturas de seguro", "Planificación fiscal habitual mediante primas pequeñas", "Contratación escalonada propia de un cliente corporativo"], "a": 0, "e": "Es una señal clásica de colocación."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "Una aseguradora con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector asegurador"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "mc", "q": "Según la LOCDOFT, mantener cuentas anónimas o con nombres ficticios se sanciona con multa de:", "o": ["500 a 1.000 U.T.", "300 a 500 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 11. Trampa: 1.000 a 3.000 U.T. es la multa por no identificar al beneficiario final."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales no figura:", "o": ["La UNIF", "La Fuerza Armada Nacional Bolivariana", "El Cuerpo de Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26. Trampa: sorprende que la Fuerza Armada sí figure y la UNIF no."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "Una constructora, una notaría y una aseguradora son sujetos obligados según la LOCDOFT. Lo que tienen en común es que:", "o": ["Están bajo el control de un órgano o ente de control", "Todas dependen jerárquicamente de la ONCDOFT", "Todas reportan sus operaciones directamente a SUDEASEG", "Todas están en el mismo sector económico regulado"], "a": 0, "e": "Sujeto obligado es quien está bajo el control de un órgano de control; cada sector tiene el suyo."}, {"t": "mc", "q": "En la arquitectura venezolana, quien dicta normas prudenciales para las aseguradoras es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera", "El Ministerio Público"], "a": 0, "e": "Cada supervisor dicta las normas de su sector."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Según la LOCDOFT, los documentos deben conservarse por el plazo legal en forma:", "o": ["Física y digital", "Física, y digital si el órgano de control lo exige", "Digital, y física solo para los originales", "Física o digital, a elección del sujeto obligado"], "a": 0, "e": "Art. 10. Trampa: las dos formas son acumulativas, no alternativas."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "mc", "q": "Una aseguradora, un banco y una casa de bolsa tienen deberes equivalentes de prevención pero distinto supervisor. Eso se explica porque la LOCDOFT:", "o": ["Fija deberes comunes y asigna cada sector a su órgano de control", "Obliga a todos a reportar ante su propia superintendencia sectorial", "Deja a cada sector definir sus propios deberes", "Aplica solo al sector bancario y por analogía al resto"], "a": 0, "e": "Deberes comunes, supervisión sectorial, reporte centralizado en la UNIF."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, la delincuencia organizada supone la acción u omisión de:", "o": ["Tres o más personas asociadas por cierto tiempo", "Dos o más personas asociadas por cierto tiempo", "Tres o más personas reunidas de forma ocasional", "Cinco o más personas con jerarquía definida"], "a": 0, "e": "Art. 4, numeral 9. Trampa: se cambia el número o se quita la permanencia."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre aseguradora y asegurado"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Una empresa opera en dos sectores regulados a la vez, por ejemplo seguros y valores. Debe:", "o": ["Cumplir las exigencias de ambos supervisores", "Elegir el régimen que considere más favorable", "Cumplir solo el del sector de mayor facturación", "Quedar exenta por el conflicto de normas"], "a": 0, "e": "Los regímenes se acumulan."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Si una aseguradora no tiene manual de prevención, quien tiene competencia para sancionarla administrativamente por esa omisión es:", "o": ["El órgano de control de su sector, es decir, SUDEASEG", "La UNIF, por ser la unidad de inteligencia financiera", "El Ministerio Público, por tratarse de un delito", "El juez de control, previa solicitud fiscal"], "a": 0, "e": "SUDEASEG es el órgano de control del sector asegurador."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Una aseguradora identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "mc", "q": "Según la LOCDOFT, no reportar una actividad sospechosa se sanciona con multa de:", "o": ["500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 13. Trampa: revelar el reporte se castiga más, con 1.000 a 3.000 U.T."}, {"t": "mc", "q": "La Norma de SUDEASEG 2024 exige conservar 10 años en formato digital, mientras la LOCDOFT exige cinco. ¿Cómo debe una aseguradora aplicar ambas?", "o": ["El más exigente: la norma sectorial puede endurecer el mínimo legal", "El de la ley, porque la ley prevalece sobre la providencia", "El que la aseguradora elija según el soporte documental", "El de la norma, pero solo durante las inspecciones del órgano"], "a": 0, "e": "La ley fija mínimos; la norma sectorial puede ser más estricta."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Un funcionario recibe una póliza de vida «de regalo» pagada por un contratista del Estado. La lectura adecuada es:", "o": ["Posible beneficio indebido que exige análisis anticorrupción", "Obsequio comercial normal sin ninguna implicación legal", "Acto lícito siempre que el funcionario lo declare después", "Operación de riesgo bajo por tratarse de un seguro de vida"], "a": 0, "e": "Los PEP exigen especial atención a dádivas y regalos."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una aseguradora recibe una citación del Ministerio Público sobre un asegurado y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "vf", "q": "Según la LOCDOFT, revelar un reporte al cliente se sanciona con una multa mayor que la de no reportar.", "a": true, "e": "Arts. 13 y 14: 1.000 a 3.000 U.T. frente a 500 a 1.000 U.T. Trampa: se espera que omitir el reporte sea lo más grave."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "mc", "q": "Un intermediario cobra comisiones elevadas por cada póliza de prima única vendida. El riesgo a vigilar es:", "o": ["Conflicto de interés y presión comercial sobre la debida diligencia", "Mayor protección para el asegurado por una suma más alta", "Incumplimiento de las tarifas oficiales del sector asegurador", "Exceso de reservas técnicas por primas únicas elevadas"], "a": 0, "e": "Los incentivos mal diseñados erosionan los controles."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "A los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Una aseguradora quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de información del Ministerio Público sobre un asegurado. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "vf", "q": "Según la LOCDOFT, las organizaciones con fines políticos y los grupos de electores son sujetos obligados.", "a": true, "e": "Art. 9, numeral 7. Trampa: se suele pensar solo en actividades económicas."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la prima se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Un cliente persona jurídica extranjera con varias capas societarias en jurisdicciones opacas pide una póliza de alto valor. Lo primero es:", "o": ["Identificar a la persona natural que lo controla en última instancia", "Pedir el RIF y el acta constitutiva de la sociedad cliente", "Exigir una garantía bancaria por el equivalente a la suma asegurada", "Consultar primero la política del reasegurador que respalda"], "a": 0, "e": "Sin beneficiario final no hay debida diligencia válida."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "vf", "q": "Según la LOCDOFT, no remitir el reporte de transacciones en efectivo se sanciona con la misma multa que no reportar una actividad sospechosa.", "a": true, "e": "Arts. 13 y 17: 500 a 1.000 U.T. en ambos casos. Trampa: se espera una escala distinta."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a una aseguradora por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "El hermano de un gobernador contrata una póliza de alta suma. Según la LOCDOFT, el tratamiento adecuado es:", "o": ["Tratarlo como familiar de PEP, con aprobación de la alta gerencia", "Tratarlo como un cliente ordinario porque el PEP no es el contratante", "Rechazarlo, ya que la ley prohíbe contratar con familiares de PEP", "Notificar al gobernador para que autorice la contratación"], "a": 0, "e": "Los familiares cercanos y allegados forman parte del círculo PEP."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Una aseguradora recibe instrucciones contradictorias de su superintendencia y de la UNIF sobre un reporte. Lo correcto es:", "o": ["Consultar a ambas y dejar constancia escrita", "Obedecer siempre a la superintendencia", "Obedecer siempre a la UNIF", "No reportar hasta que se pongan de acuerdo"], "a": 0, "e": "Nunca dejar de reportar; documentar la consulta."}, {"t": "mc", "q": "Un gerente quiere cerrar de inmediato las pólizas de un cliente investigado «para protegerse». Según la LOCDOFT:", "o": ["No cerrar sin autorización judicial, para no frustrar la investigación", "Cerrar de inmediato e informar luego a la UNIF del cierre", "Cerrar la relación con la aprobación de la Junta Directiva de la empresa", "Cerrar si el cliente figura como riesgo alto en el sistema"], "a": 0, "e": "El cierre puede alertar al investigado y destruir evidencia."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de seguros", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "El beneficiario de una póliza de vida, según el estándar, debe:", "o": ["Considerarse factor de riesgo y verificarse antes del pago", "Identificarse solo si es persona jurídica", "Verificarse únicamente en el momento de contratar la póliza", "Quedar fuera del alcance de la diligencia"], "a": 0, "e": "Verificación a más tardar al momento del pago."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "La información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según el GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Según el GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "Según el GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "vf", "q": "Según el GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Según el GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "La evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Según el GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "vf", "q": "Según el GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Un compañero afirma que, como el GAFI recomienda 5 años de conservación, la aseguradora puede conservar los registros digitales solo 5 años. ¿Qué observación corresponde?", "o": ["La norma de SUDEASEG exige 10 años para digital", "Tiene razón: 5 años bastan para todo soporte", "No existe norma sectorial sobre el plazo", "El GAFI exige 10 años para todos los soportes"], "a": 0, "e": "El estándar internacional es un mínimo; la norma local puede ser más estricta."}, {"t": "mc", "q": "El estándar internacional sobre los seguros de vida y la UIF implica que el reporte lo hace:", "o": ["La propia aseguradora como sujeto obligado", "El intermediario que vendió la póliza", "El reasegurador que asume el riesgo", "El banco donde se paga la prestación"], "a": 0, "e": "El sujeto obligado responde por su operación."}, {"t": "mc", "q": "Según el GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "La verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "vf", "q": "Según el GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Según el GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según el GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "vf", "q": "Según el GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según el GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "En una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "Un cliente contrata pólizas de alta suma pero evita responder sobre su actividad. ¿Qué principio de la debida diligencia se ve afectado?", "o": ["Entender el propósito de la relación y los fondos", "El secreto comercial del cliente", "La libertad de comercio del cliente", "La reciprocidad entre cliente y aseguradora"], "a": 0, "e": "No se puede perfilar al cliente sin información."}, {"t": "mc", "q": "Según el GAFI, cuando el país anfitrión de una filial es menos exigente que el país de origen, la filial debe aplicar:", "o": ["Las medidas del país de origen, en lo que el anfitrión permita", "Las medidas del país anfitrión, por el principio territorial", "Las medidas que elija la filial según su propio riesgo", "Las medidas del país anfitrión, informando a la matriz"], "a": 0, "e": "R.18. Trampa: el principio territorial."}, {"t": "mc", "q": "¿Por qué las aseguradoras de vida y de inversión están en el foco del GAFI?", "o": ["Productos con rescate sirven para colocar fondos", "Cobran primas más altas que los demás seguros", "Son administradas siempre por el Estado", "Son productos nuevos aún sin regulación"], "a": 0, "e": "Los seguros de vida con componente de ahorro son vulnerables."}, {"t": "mc", "q": "Según el GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "mc", "q": "Una compañía de seguros que vende solo ramos generales, frente al estándar:", "o": ["Sigue sujeta a medidas, ajustadas a su riesgo", "Queda excluida por completo del régimen", "Debe aplicar las mismas medidas que la banca", "Solo responde ante su supervisor local"], "a": 0, "e": "El riesgo es menor, no inexistente."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "vf", "q": "Según el GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Según el GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la prima y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "mc", "q": "Los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "vf", "q": "Según el GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Según el GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "vf", "q": "Según el GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}]}, {"titulo": "Normativa internacional · modelo 2", "q": [{"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Según el GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "mc", "q": "Según el GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "vf", "q": "Según el GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares",
