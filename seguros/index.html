a Recomendación 10 del GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, las medidas intensificadas frente a países de mayor riesgo alcanzan también a personas naturales y jurídicas de esos países, no solo a sus instituciones financieras.", "a": true, "e": "R.19. Trampa: se cree que solo alcanzan a la banca corresponsal."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, puede considerarse de menor riesgo una póliza de seguro de vida cuya prima anual no exceda de:", "o": ["USD/EUR 1.000", "USD/EUR 2.500", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.10, ejemplos de menor riesgo: prima anual de hasta USD/EUR 1.000 o prima única de hasta USD/EUR 2.500. Trampa: 2.500 es el límite de la prima única."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de seguros"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un reporte", "Aceptarlo con monitoreo posterior durante un año", "Iniciar la relación si el pago es por transferencia", "Exigir una garantía y mantener la relación vigente"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, cuando el tercero en quien se confía pertenece al mismo grupo financiero, la autoridad puede dar por cumplidos los requisitos si el grupo:", "o": ["Aplica controles de grupo bajo supervisión competente", "Tiene su casa matriz en un país miembro del GAFI", "Firmó un convenio de confidencialidad con el tercero", "Comparte una misma marca comercial en cada país"], "a": 0, "e": "R.17, supuesto de grupo. Trampa: la marca o la sede no sustituyen los controles de grupo supervisados."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Carecen de regulación legal en todos los países", "Resultan costosas para las instituciones financieras", "Están prohibidas en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "Un familiar de un ministro contrata una póliza. ¿Cómo lo trata el GAFI?", "o": ["Sus familiares y allegados también merecen medidas por riesgo", "Como cliente normal, sin considerar el parentesco", "Con rechazo automático por el parentesco con el ministro", "Ignorando el parentesco si el ministro no es el tomador"], "a": 0, "e": "Se extiende a su círculo cercano."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según la Recomendación 9 del GAFI, ¿qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "vf", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera debe poder pedir información adicional a los sujetos obligados.", "a": true, "e": "R.29. Trampa: se cree que solo recibe lo que se le envía."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 3 del GAFI, el autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "vf", "q": "Según la Recomendación 5 del GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar no impide compartir información dentro del grupo financiero conforme a la Recomendación 18.", "a": true, "e": "R.21 y su nota interpretativa. Trampa: se cree que la reserva prohíbe todo intercambio interno."}, {"t": "mc", "q": "La Providencia 209 de SUNAVAL se aplica a:", "o": ["Los sujetos regulados por el mercado de valores", "Las empresas de seguros, reaseguros y medicina prepagada", "Las casas de cambio y remesadoras", "Los casinos y salas de bingo"], "a": 0, "e": "Es la norma del sector valores."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el registro del oficial de cumplimiento ante la superintendencia se renueva:", "o": ["Cada tres años, pagando el 25 % de la tasa", "Cada cinco años, pagando el 25 % de la tasa", "Cada tres años, pagando el 50 % de la tasa", "Cada año, pagando el 25 % de la tasa inicial"], "a": 0, "e": "Art. 12. Trampa: se cambia el período o el porcentaje."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Informe de Ejecución del Plan Operativo Anual lo aprueba el oficial de cumplimiento antes de remitirlo.", "a": false, "e": "Art. 30: lo aprueba la junta directiva. Trampa: el oficial lo elabora, pero no lo aprueba."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿quién debe impartir la capacitación en materia de LC/FT al sector asegurador?", "o": ["Facilitadores inscritos en el RUF de la ONCDOFT", "Cualquier profesional con experiencia en seguros", "Exclusivamente el Oficial de Cumplimiento de la empresa", "Solo funcionarios de SUDEASEG designados para ello"], "a": 0, "e": "Art. 31. El RUF asegura idoneidad de los capacitadores."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el auditor externo solicita revisar los reportes de actividades sospechosas enviados. Corresponde:", "o": ["Negar el acceso a casos y reportes remitidos", "Permitirlo por su deber de independencia", "Autorizarlo con una orden del presidente", "Entregarlos con los nombres ocultos"], "a": 0, "e": "Los auditores externos no tienen acceso a ellos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si el supervisor considera insuficientes los mecanismos de una aseguradora, puede:", "o": ["Instruir los ajustes y correcciones necesarias", "Designar a su propio oficial de cumplimiento", "Revocar la licencia sin procedimiento previo", "Reportar el caso directamente al juez penal"], "a": 0, "e": "Art. 87. Potestad correctiva."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, recopilar las respuestas a las solicitudes de información de los organismos públicos corresponde a:", "o": ["La unidad de administración de riesgos", "El presidente, como representante legal", "La junta directiva del sujeto obligado", "Los intermediarios de seguros"], "a": 0, "e": "Art. 15, numeral 7. Trampa: se cree que lo hace la presidencia por ejercer la representación legal."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, para un nuevo cliente de mayor riesgo, NO figura entre los métodos adicionales de verificación que exige la norma:", "o": ["La declaración jurada notariada del cliente", "La visita al cliente en su domicilio", "Las comunicaciones telefónicas con el cliente", "La verificación independiente de su identidad"], "a": 0, "e": "Art. 40: visita, llamadas y verificación independiente. Trampa: se añade un método que suena formal."}, {"t": "mc", "q": "¿Quiénes están sujetos a la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Personas sometidas a la supervisión y control de SUDEASEG", "Personas sometidas a la supervisión y control de la UNIF", "Solo las empresas de seguros autorizadas para operar", "Toda empresa que contrate seguros con una aseguradora"], "a": 0, "e": "Incluye aseguradoras, reaseguradoras, corredores, financiadoras de primas, medicina prepagada, entre otros."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los auditores externos, respecto de los casos investigados y los reportes remitidos:", "o": ["No tienen acceso a ellos", "Tienen acceso pleno para su informe", "Acceden solo con permiso del cliente", "Acceden solo si lo pide la UNIF"], "a": 0, "e": "Art. 72. La confidencialidad del reporte es absoluta frente a terceros."}, {"t": "mc", "q": "Un gerente de una aseguradora prepara su manual de prevención basándose en la Providencia SAA-08-004-2021. ¿Qué observación corresponde?", "o": ["Derogada por la SAA-01-0536-2024; debe ajustarse a esa", "Sigue vigente para los manuales de las aseguradoras de seguros", "Sigue vigente solo para el reaseguro y la medicina prepagada", "Fue derogada por la LOCDOFT de 2012 al entrar en vigor"], "a": 0, "e": "Norma posterior sobre la misma materia deroga la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Oficial de Cumplimiento renuncia y la empresa queda sin él. ¿Cuál es la lógica de la norma?", "o": ["El presidente asume las funciones y avisa a SUDEASEG", "La función se suspende hasta designar a otro", "SUDEASEG designa directamente al nuevo oficial", "La función se retoma en la auditoría externa"], "a": 0, "e": "Art. 9. Continuidad de la función y transparencia con el supervisor."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento presenta a la junta directiva informes de gestión semestrales y anuales.", "a": true, "e": "Art. 13, numeral 9. Trampa: en turismo y criptoactivos los informes son trimestrales."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plan operativo se envía antes del cierre del ejercicio y su informe de ejecución después: son dos documentos y dos plazos distintos.", "a": true, "e": "Arts. 29 y 30. Es una confusión frecuente en los exámenes."}, {"t": "mc", "q": "¿Por qué la Providencia SAA-01-0536-2024 de SUDEASEG ubica al Oficial de Cumplimiento y al presidente en un nivel jerárquico equiparable, cada uno en su ámbito?", "o": ["Asegurar independencia y capacidad de objetar decisiones", "Duplicar controles sobre las decisiones del presidente", "Evitar que SUDEASEG supervise directamente al presidente", "Reflejar la jerarquía de cargos de la estructura comercial"], "a": 0, "e": "La independencia es esencial para que funcione la función de cumplimiento."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la autoevaluación de riesgo es un proceso prospectivo con el que la empresa proyecta sus riesgos futuros.", "a": false, "e": "Art. 19: es un proceso retrospectivo. Trampa: se invierte un solo adjetivo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, para ahorrar, la firma de auditoría externa propone ejecutar también el programa anual de seguimiento. Debe rechazarse porque:", "o": ["Se evaluaría a sí misma", "Solo la junta puede ejecutarlo", "Solo la superintendencia lo ejecuta", "El programa no admite proveedores"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el auditor externo que elabora el informe anual no puede ser contratado por más de:", "o": ["Dos ejercicios fiscales consecutivos", "Un solo ejercicio fiscal", "Tres ejercicios fiscales consecutivos", "Cinco ejercicios fiscales consecutivos"], "a": 0, "e": "Art. 75. Rotación para preservar la independencia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual debe estar a disposición de los empleados vinculados con el sistema, como medio de consulta.", "a": true, "e": "Art. 28. Trampa: se cree que es un documento reservado a la junta y al oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva debe aprobar el monto de recursos para la materia:", "o": ["Anualmente, de forma específica e identificable en el presupuesto", "Anualmente, dentro de la partida general de gastos de la empresa", "Cada tres años, junto con la renovación del registro del oficial", "Cuando lo solicite por escrito el oficial de cumplimiento"], "a": 0, "e": "Art. 8, num. 2. Trampa: no basta una partida general."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una persona expuesta políticamente de una organización internacional recibe medidas menos exigentes que una PEP nacional.", "a": false, "e": "Art. 51: recibe las mismas medidas. Trampa: se crea una diferencia que no existe."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), el siniestro se paga a un tercero sin relación aparente con el asegurado, con documentos poco claros. ¿Qué debe hacer la aseguradora?", "o": ["Analizar, verificar la relación y evaluar un ROS", "Pagar sin preguntas por tratarse del siniestro cubierto", "Negar el siniestro sin ningún análisis previo", "Pagar y pedir una prima adicional de ajuste"], "a": 0, "e": "El pago a terceros es señal de alerta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente exige firmar él mismo cada reporte de sospecha antes de que salga. Ese requisito:", "o": ["Vulnera la autonomía para reportar", "Cumple el control dual del sistema", "Es válido si lo aprueba la junta", "Es válido para reportes de alto monto"], "a": 0, "e": "No se puede negar ni condicionar la remisión."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una sociedad de corretaje detecta una operación sospechosa y alega que no tiene unidad de administración de riesgos. Esa ausencia:", "o": ["No la exime de informar", "La exime de todo reporte", "Traslada el deber a la aseguradora", "Obliga a constituir la unidad antes"], "a": 0, "e": "No están obligadas a conformarla, pero sí a informar."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado lee en un manual interno la Providencia SAA-01-0530-2024 como norma de prevención. Debe corregirse porque esa providencia regula:", "o": ["El buen gobierno corporativo", "La actividad de reaseguro", "Los reportes sistemáticos", "La medicina prepagada"], "a": 0, "e": "La norma de riesgos es la SAA-01-0536-2024."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, además de la declaración jurada de origen de fondos, presentan la declaración de conocimiento en materia de AR/LC/FT/FPADM:", "o": ["Solo los intermediarios personas naturales", "Solo los intermediarios personas jurídicas", "Todos los intermediarios autorizados", "Solo las sociedades de corretaje inscritas"], "a": 0, "e": "Art. 59. Trampa: la declaración de origen la presentan todos; la de conocimiento, solo las personas naturales."}, {"t": "mc", "q": "¿Qué relación guarda la Providencia SAA-01-0536-2024 de SUDEASEG con la LOCDOFT?", "o": ["Desarrolla los deberes de la ley y no puede contradecirla", "La Norma deroga las disposiciones de la LOCDOFT para el sector", "La LOCDOFT no se aplica al sector asegurador por su norma", "Ambas se aplican de forma alternativa, a elección del sujeto"], "a": 0, "e": "Principio de jerarquía: la ley está por encima de la providencia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el formulario del expediente del reasegurador lo suscribe el oficial de cumplimiento de la aseguradora cedente.", "a": false, "e": "Art. 61, num. 1: lo suscribe el oficial de la reaseguradora. Trampa: se cambia de empresa al firmante."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, vencidos los diez días para designar al nuevo oficial, la empresa ya usó una prórroga. Puede:", "o": ["No pedir otra, porque solo se admite una vez", "Pedir otra, si la justifica ante la junta", "Dejar el cargo vacante hasta la asamblea", "Pedir prórrogas hasta cubrir sesenta días"], "a": 0, "e": "El plazo es prorrogable una sola vez."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la aparición de una sospecha impide seguir aplicando debida diligencia simplificada, aunque el cliente siga clasificado como de riesgo bajo.", "a": true, "e": "Art. 36. La sospecha desplaza la clasificación previa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando el contrato se celebra mediante intermediario, identificar y verificar los datos del tomador corresponde solo a la aseguradora.", "a": false, "e": "Art. 49: los intermediarios asumen esa obligación. Trampa: se excluye a un sujeto que la norma incluye."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la unidad de administración de riesgos es siempre obligatoria para las empresas de seguros.", "a": false, "e": "Art. 7, num. 2: pueden prescindir de ella según su autoevaluación; lo obligatorio es designar al oficial y a los responsables (num. 1). Trampa: se extiende la obligación."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la aprobación de la junta directiva para un cliente PEP se limita al inicio de la relación comercial.", "a": false, "e": "Art. 51: inicio, permanencia y pago de prestaciones en vida o productos de inversión. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la identificación del beneficiario final en personas y estructuras jurídicas exige:", "o": ["Llegar a la persona natural que ejerce el control", "Identificar al representante legal inscrito", "Conocer al accionista mayoritario formal", "Verificar el domicilio fiscal de la sociedad"], "a": 0, "e": "Art. 41. Se levanta el velo societario."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, pueden impartir la capacitación los facilitadores inscritos en el RUF aunque no estén acreditados en el sector asegurador.", "a": false, "e": "Art. 31: deben estar inscritos en el RUF y acreditados en el sector asegurador. Trampa: se elimina el segundo requisito."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual se remite a la superintendencia en formato físico y digital.", "a": false, "e": "Art. 29: en formato digital. Trampa: físico y digital es la regla de conservación de documentos."}, {"t": "mc", "q": "Una aseguradora funda un procedimiento en el decreto-ley de 2015 sin considerar la reforma de 2023. El riesgo es:", "o": ["Aplicar un texto que ya fue modificado", "Aplicar una norma de otro sector", "Aplicar una norma aún no vigente", "Ninguno, porque el texto no cambió"], "a": 0, "e": "Error de actualización normativa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma vigente entró en vigencia sesenta días después de su publicación en Gaceta Oficial.", "a": false, "e": "Art. 91: entró en vigencia desde su publicación. Trampa: la de turismo sí tiene sesenta días de vacatio."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe notificar la designación o salida del oficial de cumplimiento dentro de:", "o": ["Cinco días hábiles", "Tres días continuos", "Quince días hábiles", "Treinta días continuos"], "a": 0, "e": "Art. 9, numeral 4. Plazo corto para que el supervisor conozca al responsable."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en materia de capacitación, supervisar los programas corresponde al presidente, coordinarlos al oficial y ejecutarlos a:", "o": ["La unidad de administración de riesgos", "Los responsables de cumplimiento", "El área de talento humano", "La junta directiva"], "a": 0, "e": "Arts. 9, num. 3; 13, num. 4; y 15, num. 6. Trampa: cada nivel tiene un verbo distinto."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el comportamiento y el nivel de vida de empleados e intermediarios, cuando no concuerdan con sus ingresos, puede ser una señal de alerta interna.", "a": true, "e": "Arts. 58 y 66. El riesgo también viene de adentro."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar el inicio de la relación con una compañía constituida en un país que no aplica regulaciones similares corresponde a:", "o": ["La junta directiva o el órgano equivalente", "El oficial de cumplimiento, previo informe", "El presidente, con aviso a la superintendencia", "La unidad de riesgos LC/FT de la empresa"], "a": 0, "e": "Art. 38. Trampa: el oficial analiza, pero no aprueba."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la inscripción del oficial debe renovarse con actualización de recaudos en un período menor que los cinco años de la condición PEP.", "a": true, "e": "Renovación cada tres años."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las operaciones que el auditor externo detecte como posiblemente sospechosas deben:", "o": ["Notificarse por escrito al oficial para que decida", "Reportarse por el propio auditor a la UNIF", "Incluirse solo en el Informe Anual del auditor", "Comunicarse a la junta para que decida el reporte"], "a": 0, "e": "Art. 72. Trampa: el auditor no reporta a la UNIF ni la junta decide el reporte."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora lanza un seguro digital vendido solo por una aplicación móvil. Desde la lógica de la autoevaluación de riesgo, ¿qué debe hacer antes de lanzarlo?", "o": ["Evaluar el riesgo del producto y definir controles", "Lanzarlo y evaluar el riesgo en la próxima autoevaluación", "Esperar a la inspección de SUDEASEG para ajustarlo", "Pedir autorización previa a la UNIF para comercializarlo"], "a": 0, "e": "Art. 13, numeral 10. Productos y canales nuevos exigen evaluación previa."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Evaluación y Control es de uso restringido y confidencial.", "a": true, "e": "Art. 71. Trampa: se cree que se remite a la superintendencia; solo debe estar disponible en las inspecciones."}, {"t": "mc", "q": "¿Qué diferencia hay entre la debida diligencia simplificada, mejorada e intensificada según la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["Se gradúan por riesgo: bajo, moderado y alto respectivamente", "Se gradúan por el monto: menor, medio y mayor de la prima", "Se gradúan por nacionalidad: nacional, residente y extranjero", "Son sinónimos aplicables según la preferencia de la empresa"], "a": 0, "e": "Gradación por riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se mantiene aunque surjan sospechas, mientras el cliente siga siendo de riesgo bajo en el sistema.", "a": false, "e": "Art. 36. Ante sospecha no se permite DD simplificada."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una empresa envía el plan operativo un mes después del cierre del ejercicio, junto con su informe de ejecución. El error es:", "o": ["El plan debe enviarse antes del cierre", "El informe debe enviarse antes que el plan", "Ambos deben enviarse en un solo documento", "El plan no se remite a la superintendencia"], "a": 0, "e": "El plan se remite dentro de los cuarenta y cinco días previos al cierre."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, una aseguradora recibe una póliza cuyo tomador es una OSFL que recibe donaciones de varias jurisdicciones. ¿Cuál es el tratamiento adecuado?", "o": ["Entender su propósito y el origen y destino de los fondos", "Rechazarla por recibir donaciones del exterior", "Aceptarla sin ningún análisis por no tener fines de lucro", "Notificar a la UNIF cada donación que reciba"], "a": 0, "e": "Las OSFL no son malas per se; son vulnerables."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo bajo realiza de pronto pagos inexplicablemente altos en efectivo. ¿Qué corresponde?", "o": ["Reclasificarlo y evaluar un ROS; no cabe DD simplificada", "Mantenerlo en bajo hasta la actualización anual de datos", "Cancelar la póliza y devolver la prima a una cuenta indicada", "Informarle que sus movimientos serán revisados por la UNIF"], "a": 0, "e": "Art. 36. La DD simplificada no es válida ante sospechas."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, de estos documentos, el que se computa en días hábiles es:", "o": ["Las declaraciones juradas de intermediarios", "El informe anual del auditor externo", "La autoevaluación de riesgo de la empresa", "Ninguno: todos se cuentan en días continuos"], "a": 0, "e": "Sesenta días hábiles frente a sesenta continuos: trampa de cómputo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plazo de diez días hábiles para coordinar la designación del nuevo oficial se cuenta desde:", "o": ["La ocurrencia de la falta absoluta", "La notificación a la superintendencia", "La siguiente reunión de la junta directiva", "El cierre del mes en que ocurrió"], "a": 0, "e": "Art. 9, num. 6. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo alto actualizó sus datos hace dieciocho meses. La situación:", "o": ["Incumple el máximo de un año", "Cumple el máximo de dos años", "Cumple el máximo de cinco años", "Solo incumple si hubo operaciones"], "a": 0, "e": "Para riesgo alto no puede exceder de un año."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante vacaciones o reposo del oficial de cumplimiento, la empresa debe asegurar la cobertura de sus funciones.", "a": true, "e": "Art. 9, numeral 5. La continuidad es obligatoria."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva firma el compromiso institucional en un acta colectiva única que se actualiza cada tres años.", "a": false, "e": "Arts. 8 y 34: se firma individualmente y se actualiza cada año. Trampa: se cambian la forma y la frecuencia."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿cuál es la función de los «responsables de cumplimiento» en las distintas áreas de la aseguradora?", "o": ["Extender la función de cumplimiento a cada área", "Sustituir al Oficial de Cumplimiento en sus ausencias", "Aprobar pólizas de clientes clasificados como riesgo alto", "Auditar el cumplimiento de la Unidad ante la Junta"], "a": 0, "e": "Arts. 16 y 17. Extienden la función de cumplimiento a las áreas."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta a la junta directiva. Trampa: el presidente lo suple, pero no es su superior."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la inscripción del oficial de cumplimiento en el registro de la superintendencia debe renovarse cada:", "o": ["Tres años", "Un año", "Dos años", "Cinco años"], "a": 0, "e": "Art. 12. Con pago parcial de la tasa y actualización de recaudos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿ante quién responde el Oficial de Cumplimiento dentro de la estructura de gobierno de la aseguradora?", "o": ["Ante la Junta Directiva o el órgano equivalente", "Ante el presidente de la aseguradora, de forma exclusiva", "Ante el gerente de la unidad de operaciones comerciales", "Ante SUDEASEG, como funcionario delegado del supervisor"], "a": 0, "e": "Art. 10. Reporta a la Junta Directiva para preservar su independencia."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual aprobado por la junta se remite a la superintendencia dentro de:", "o": ["Treinta días continuos desde la inscripción", "Treinta días hábiles desde su aprobación", "Sesenta días continuos desde la inscripción", "Cuarenta y cinco días previos al cierre"], "a": 0, "e": "Art. 28. Trampa: se mezclan el plazo y el hecho que lo inicia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un corredor puede llenar y firmar la declaración de origen de fondos si el cliente se lo autoriza verbalmente.", "a": false, "e": "Se prohíbe al intermediario llenar y suscribir la declaración."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los programas de formación que debe cursar el aspirante a oficial de cumplimiento son los que imparte la ONCDOFT.", "a": false, "e": "Art. 11, num. 3: los imparte la Superintendencia de la Actividad Aseguradora. Trampa: en turismo los imparte INATUR."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los reportes sistemáticos mensuales de pólizas y del registro de trabajadores se remiten dentro de:", "o": ["Diez días hábiles tras el fin de cada mes", "Diez días continuos tras el fin de cada mes", "Cinco días hábiles tras el fin de cada mes", "Quince días hábiles tras el fin de cada mes"], "a": 0, "e": "Arts. 76 y 77. Trampa: se cambia la unidad o el número."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un intermediario llena la planilla de un cliente analfabeto y firma por él la declaración de origen de fondos «para ayudar». ¿Qué problema hay?", "o": ["El intermediario tiene prohibido suscribirla", "Es válido con autorización escrita del cliente", "Procede si el cliente no sabe escribir", "Basta que el supervisor comercial lo revise"], "a": 0, "e": "Art. 50. La declaración debe ser personal y real."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento renuncia de forma intempestiva. La secuencia correcta es:", "o": ["Asume el presidente, aviso en 5 hábiles y nuevo en 10", "Asume el auditor, aviso en 10 hábiles y nuevo en 5", "Asume la unidad, aviso en 5 hábiles y nuevo en 30", "Asume la junta, aviso en 10 continuos y nuevo en 60"], "a": 0, "e": "Falta absoluta: el presidente asume; notificación en cinco días hábiles; designación en diez días hábiles, prorrogable una sola vez."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual lo elabora, diseña y ejecuta:", "o": ["El oficial de cumplimiento", "La junta directiva", "La unidad de auditoría interna", "El presidente de la empresa"], "a": 0, "e": "Art. 29. Trampa: la junta aprueba su informe de ejecución, pero no elabora el plan."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un reasegurador extranjero propone contratar con una aseguradora venezolana. ¿Qué debe revisar la aseguradora para conocerlo?", "o": ["Estados auditados, impuestos y estructura de control", "Solo su nombre y su calificación de riesgo publicada", "Solo el tratado de reaseguro firmado con la cedente", "Únicamente su inscripción ante un regulador extranjero"], "a": 0, "e": "Art. 61. El reaseguro también es un canal de riesgo."}, {"t": "mc", "q": "¿Qué consecuencia puede tener que SUDEASEG considere que el informe del auditor externo no cumple los extremos de la norma?", "o": ["Puede exigir una nueva auditoría y acciones correctivas", "Nada, porque el informe es vinculante para SUDEASEG", "La empresa debe ser liquidada de inmediato por el órgano", "El informe se considera aprobado por silencio administrativo"], "a": 0, "e": "El supervisor puede verificar la exactitud del informe."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando no es posible obtener la huella dactilar, la empresa queda dispensada de cualquier control biométrico.", "a": false, "e": "Art. 45: debe usar otros controles biométricos alternos. Trampa: se convierte la dificultad en dispensa."}, {"t": "mc", "q": "Una aseguradora clasifica a sus clientes en solo dos categorías: riesgo alto y riesgo bajo. ¿Qué observación hace SUDEASEG según su Norma 2024?", "o": ["Los niveles obligatorios son tres: bajo, moderado y alto", "Está bien: la norma permite solo alto y bajo", "Debe tener cinco niveles, con uno crítico y otro muy bajo", "Puede definir sus propios niveles según su política interna"], "a": 0, "e": "La norma fija tres niveles de riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las decisiones del oficial de cumplimiento obligan a todos los empleados desde que él las adopta, sin aprobación posterior.", "a": false, "e": "Art. 10: obligan previa aprobación de la junta directiva. Trampa: se suprime la condición."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la verificación de datos debe incluir los listados publicados y mantenidos por:", "o": ["El Consejo de Seguridad de las Naciones Unidas", "La Unidad Nacional de Inteligencia Financiera", "El Grupo de Acción Financiera del Caribe", "La Oficina Nacional contra la Delincuencia"], "a": 0, "e": "Art. 40, conforme a las recomendaciones del GAFI. Trampa: el GAFI recomienda, pero las listas son del Consejo de Seguridad."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), una persona jurídica nueva, sin historial ni actividad comprobable, solicita contratar un seguro de alta suma con pago en efectivo. ¿Qué alerta presenta?", "o": ["Posible empresa fachada con fondos sin explicar", "Cliente normal que inicia su actividad económica", "Riesgo bajo por tratarse de una persona jurídica", "Operación habitual en el sector asegurador"], "a": 0, "e": "Empresas sin sustancia económica son señal típica."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presupuesto específico que aprueba la junta cubre la materia de riesgos y también el buen gobierno corporativo.", "a": true, "e": "Art. 8, num. 2. Trampa: se cree que solo cubre la prevención."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la información que pidan el Ministerio Público u otros organismos competentes se remite:", "o": ["En el plazo prudencial que indique el supervisor", "Solo con orden judicial expresa", "Dentro de las veinticuatro horas siguientes, en todo caso", "Previa autorización escrita del cliente"], "a": 0, "e": "Art. 84. Deber de colaboración."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe de ejecución del Plan Operativo Anual debe indicar, de cada aspecto de su contenido:", "o": ["El porcentaje de cumplimiento, con soportes", "El costo ejecutado de cada actividad, con facturas", "El responsable de cada actividad y su firma", "La opinión escrita del auditor externo"], "a": 0, "e": "Art. 30. Trampa: los otros datos suenan a control, pero la norma pide porcentaje y soportes de medición."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora designa como Oficial de Cumplimiento al gerente de ventas «mientras consigue otro». ¿Qué problema de fondo presenta?", "o": ["Un conflicto de interés con un cargo de dedicación exclusiva", "Ninguno, si tiene experiencia comercial suficiente en el ramo", "Solo la falta de su inscripción en el registro de oficiales", "Ninguno, si la junta lo designa de forma transitoria"], "a": 0, "e": "Art. 10. El Oficial de Cumplimiento debe tener autonomía funcional y dedicación exclusiva."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un manual aprobado hace cinco años y nunca revisado, pese a cambios de productos y canales, incumple el espíritu de la norma.", "a": true, "e": "Art. 28. El sistema debe actualizarse cuando cambia el perfil de riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la condición de PEP alcanza a los familiares hasta el cuarto grado de consanguinidad y el segundo de afinidad.", "a": true, "e": "Art. 51. Trampa: es frecuente invertir los grados."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo bajo, sin señales de alerta, puede recibir debida diligencia:", "o": ["Simplificada", "Intensificada", "Mejorada", "Ninguna medida"], "a": 0, "e": "Art. 36. Simplificada no significa ausencia de medidas."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva puede negar al oficial la remisión de un reporte cuando lo considere infundado.", "a": false, "e": "Art. 83: no puede negarla. Trampa: se añade una excepción."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el tratamiento de una PEP en un seguro de vida exige, además de la diligencia intensificada:", "o": ["Aprobación de la junta para la relación y el pago", "Autorización escrita del propio cliente PEP", "Notificación previa a la superintendencia", "Constitución de una garantía adicional"], "a": 0, "e": "Art. 51. El nivel más alto de la organización decide."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante las vacaciones del Oficial de Cumplimiento, sus funciones deben quedar cubiertas, no suspendidas.", "a": true, "e": "Art. 9, numeral 5. La función es continua."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se admite para un cliente de riesgo bajo aunque exista sospecha de LC/FT, si el monto es reducido.", "a": false, "e": "Art. 36: no se permite la simplificada si existen sospechas. Trampa: se agrega una excepción por monto que la norma no tiene."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el expediente de un reasegurador debe incluir estados financieros auditados de, por lo menos:", "o": ["Los tres últimos años", "Los dos últimos años", "Los cinco últimos años", "El último ejercicio cerrado"], "a": 0, "e": "Art. 61, num. 4. Trampa: se cambia el número de años."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar la designación de los miembros de la unidad de administración de riesgos y de los responsables de cumplimiento corresponde a:", "o": ["La junta directiva", "El oficial de cumplimiento", "El presidente", "La superintendencia"], "a": 0, "e": "Art. 8, numeral 9. Trampa: el oficial los propone (art. 13, num. 12), pero no los aprueba."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los requerimientos del Ministerio Público se atienden en un plazo fijo de cinco días hábiles.", "a": false, "e": "Art. 84: en el plazo prudencial que indique la superintendencia. Trampa: cinco días hábiles es el plazo para notificar la ausencia del oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la renovación del registro del oficial de cumplimiento exige pagar la fracción de la tasa y:", "o": ["Actualizar la documentación", "Aprobar un nuevo examen", "Presentar aval de la junta", "Cursar otro programa académico"], "a": 0, "e": "Art. 12. Trampa: la norma no pide examen ni aval."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente y el oficial de cumplimiento se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Art. 7. Trampa: se espera que el oficial esté por debajo del presidente."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en una póliza de vida, el beneficiario final debe identificarse:", "o": ["Antes del pago de prestaciones o capitales", "Dentro de los treinta días siguientes al pago", "Solo al momento de emitir la póliza", "Cuando lo requiera la superintendencia"], "a": 0, "e": "Art. 51. Trampa: no basta la identificación inicial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la notificación de la ausencia del oficial de cumplimiento a la superintendencia corresponde a la junta directiva.", "a": false, "e": "Art. 9, num. 4: corresponde al presidente, dentro de cinco días hábiles. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una firma auditó en lo externo dos ejercicios seguidos y la empresa quiere contratarla para el tercero. Lo correcto es que:", "o": ["No puede, por superar el límite consecutivo", "Puede, si la junta aprueba la renovación", "Puede, si cambia al socio que firma", "No puede volver a contratarla jamás"], "a": 0, "e": "No más de dos ejercicios fiscales consecutivos."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el reporte mensual de proveedores debe incluir también a los proveedores de servicios públicos.", "a": false, "e": "Art. 77, num. 3: quedan excluidos. Trampa: se incluye lo que la norma excluye."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe del auditor externo se remite dentro de los sesenta días continuos siguientes al cierre, con el acta de aprobación de la junta.", "a": true, "e": "Art. 72. Trampa: se suele pensar en días hábiles."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las sociedades de corretaje de reaseguros están obligadas a conformar la unidad de administración de riesgos.", "a": false, "e": "Art. 7, num. 3: no están obligadas, pero deben proporcionar la información requerida. Trampa: se confunde con el deber de informar."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las variables de segmentación de riesgo que enumera la norma son taxativas, de modo que la empresa no puede añadir otras.", "a": false, "e": "Art. 23: son enunciativas y no taxativas. Trampa: se invierte el carácter de la lista."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿por qué en seguros de vida y productos de inversión el beneficiario es relevante para la debida diligencia?", "o": ["Quien cobra puede ser distinto del tomador", "Suele ser un familiar cercano del tomador", "Solo se verifica al contratar la póliza", "No recibe fondos directamente del asegurador"], "a": 0, "e": "Art. 51. Se identifica y verifica al beneficiario a más tardar al pagar."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, es familiar comprendido en el concepto de PEP del sector:", "o": ["Un primo hermano de la persona expuesta", "El cónyuge del primo de la persona expuesta", "Un concuñado de la persona expuesta", "Un sobrino político en cuarto grado"], "a": 0, "e": "Hasta cuarto grado de consanguinidad y segundo de afinidad."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente clasificado en riesgo moderado debe recibir debida diligencia:", "o": ["Mejorada", "Simplificada", "Intensificada", "Estándar"], "a": 0, "e": "Trampa: en criptoactivos el riesgo bajo es estándar; en cajas el moderado es controlada."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si la superintendencia considera que el informe del auditor externo no cumple la norma, puede exigir una nueva auditoría.", "a": true, "e": "Art. 74. Trampa: en criptoactivos se puede exigir el cambio de auditor."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plazo para remitir el manual a la superintendencia se empieza a contar desde:", "o": ["La inscripción como sujeto obligado", "La aprobación de la junta directiva", "El cierre del ejercicio económico", "La designación del oficial"], "a": 0, "e": "El plazo corre desde la inscripción."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma coloca al oficial de cumplimiento en un nivel jerárquico equiparable al del presidente para:", "o": ["Que pueda objetar decisiones sin presión interna", "Que pueda firmar pólizas en su ausencia", "Igualar su remuneración con la del resto de la gerencia", "Permitirle representar a la empresa"], "a": 0, "e": "Art. 7. Independencia funcional real."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma del sector asegurador entró en vigencia con su publicación en la Gaceta Oficial, sin período de vacancia.", "a": true, "e": "Art. 91. Vigencia inmediata desde la publicación."}, {"t": "mc", "q": "¿Qué significa el principio de «autorregulación» en la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["El sujeto obligado diseña, aplica y demuestra sus controles", "El sujeto obligado queda exento de la supervisión de SUDEASEG", "SUDEASEG diseña los controles que cada empresa debe aplicar", "El sujeto obligado decide libremente si cumple la norma"], "a": 0, "e": "El sujeto obligado debe demostrar el cumplimiento."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si no puede verificar un dato aportado por el cliente, la empresa debe enviar de inmediato un reporte a la UNIF, sin análisis previo.", "a": false, "e": "Art. 44: el oficial analiza el caso y notifica a la UNIF si lo considera procedente. Trampa: se elimina el análisis."}, {"t": "mc", "q": "Una aseguradora incumple la Providencia SAA-01-0536-2024 de SUDEASEG en materia de prevención. ¿Qué marco de sanciones puede aplicarse?", "o": ["El de la Ley de la Actividad Aseguradora y el de la LOCDOFT", "El previsto únicamente en la Ley de la Actividad Aseguradora", "El previsto únicamente en la LOCDOFT para el órgano rector", "El del Código de Comercio para las sociedades mercantiles"], "a": 0, "e": "La norma remite expresamente a ambos regímenes."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, revisar y aprobar el Informe Anual del auditor externo corresponde a:", "o": ["La junta directiva", "El presidente", "El oficial de cumplimiento", "La auditoría interna"], "a": 0, "e": "Art. 8, numeral 8. Trampa: el presidente lo conoce (art. 9, num. 10), pero no lo aprueba."}, {"t": "mc", "q": "La reforma de la Ley de la Actividad Aseguradora de 2023 entró en vigencia:", "o": ["A los ciento veinte días continuos de su publicación", "El mismo día de su publicación", "A los treinta días continuos de su publicación oficial", "Al inicio del ejercicio siguiente"], "a": 0, "e": "Vacancia expresa de la ley."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un exministro dejó su cargo hace cuatro años y solicita una póliza. Respecto de su condición:", "o": ["Sigue siendo PEP hasta cumplir cinco años", "Perdió la condición al cesar en el cargo", "Sigue siendo PEP de por vida sin excepción", "Solo es PEP si mantiene un cargo partidista"], "a": 0, "e": "La condición se mantiene cinco años tras el cese."}, {"t": "mc", "q": "Un presidente de una aseguradora dice que «el Oficial de Cumplimiento puede reportar a la UNIF solo si yo lo autorizo». ¿Cuál es la respuesta correcta?", "o": ["No puede impedirlo: no se puede negar la remisión de un ROS", "Tiene razón: el presidente debe autorizar todo reporte", "El Oficial debe pedir permiso previo a SUDEASEG para reportar", "El Oficial debe consultar antes el reporte con el cliente"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en los documentos de vinculación inicial se obtendrá, siempre que sea posible, la huella del dedo:", "o": ["Pulgar o índice de la mano derecha", "Pulgar o índice de la mano izquierda", "Pulgar de ambas manos del cliente", "Índice o medio de la mano derecha"], "a": 0, "e": "Art. 45: la mano izquierda solo de ser el caso. Trampa: se cambia la mano o el dedo."}, {"t": "vf", "q": "Citar el Decreto-Ley de 2015 como texto vigente sin considerar la reforma de 2023 es un error de actualización normativa.", "a": true, "e": "La reforma de 2023 modificó el régimen vigente."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿qué relación hay entre la autoevaluación de riesgo, el manual y el plan operativo?", "o": ["Riesgos identificados, procedimientos y plan de actividades", "Son documentos independientes sin ninguna relación entre sí", "El plan operativo sustituye a la autoevaluación anual", "El manual sustituye al plan operativo de cada ejercicio"], "a": 0, "e": "Arts. 20, 28 y 29. Coherencia del sistema."}, {"t": "mc", "q": "Un cliente PEP solicita un seguro de vida con beneficiarios en el exterior. ¿Qué exige la lógica de la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["DD intensificada, beneficiario final y aprobación de Junta", "Aceptación con DD simplificada por ser un seguro de vida", "Rechazo automático por tratarse de un cliente PEP", "Aviso previo a los beneficiarios sobre la condición PEP"], "a": 0, "e": "Seguros de vida con PEP exigen aprobación del nivel más alto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora contrata una empresa externa para que «haga toda la debida diligencia de sus clientes». ¿Qué restricción impone la norma?", "o": ["No tercerizar verificación, beneficiario final ni análisis", "Puede tercerizar todo si el proveedor es de prestigio", "Solo puede tercerizar la identificación del cliente", "La tercerización de la debida diligencia es obligatoria"], "a": 0, "e": "Art. 40. La responsabilidad indelegable es de la aseguradora."}, {"t": "mc", "q": "Una sociedad de corretaje de seguros pregunta si está obligada por la Providencia SAA-01-0536-2024 de SUDEASEG. ¿Qué respuesta es correcta?", "o": ["Sí, con estructura proporcional a su riesgo", "No, porque la norma solo obliga a las empresas de seguros", "No, porque las sociedades de corretaje las supervisa la UNIF", "Sí, pero solo respecto de los siniestros que intermedie"], "a": 0, "e": "Proporcionalidad: obligación sí, estructura según riesgo y tamaño."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe asistir a las actividades de capacitación convocadas por el oficial de cumplimiento.", "a": true, "e": "Art. 9, num. 11. Trampa: se cree que la capacitación es solo para el personal."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el rechazo de un empleado a ascensos o traslados es una conducta que los supervisores deben vigilar.", "a": true, "e": "Art. 66. Trampa: parece una conducta positiva, pero la norma la lista como señal."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una Junta Directiva puede designar al Oficial de Cumplimiento y supervisar su desempeño, pero no puede negarle la remisión de un reporte de actividades sospechosas.", "a": true, "e": "Arts. 8 y 83. Se distingue entre designación/supervisión y la autonomía en el reporte."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un extranjero no residente que contrata una póliza se identifica con:", "o": ["El pasaporte vigente", "La cédula de extranjero vigente", "La cédula de su país de origen", "El RIF y una referencia bancaria"], "a": 0, "e": "Art. 47. Trampa: la cédula laminada es para venezolanos y extranjeros residentes."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los documentos de una persona jurídica no domiciliada deben estar legalizados o apostillados, pero basta una traducción simple al castellano.", "a": false, "e": "Art. 47: traducción por intérprete público. Trampa: la primera mitad es correcta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, proponer a la junta directiva la designación de los miembros de la unidad y de los responsables de cumplimiento corresponde a:", "o": ["El oficial de cumplimiento", "El presidente", "La auditoría interna", "El área de talento humano"], "a": 0, "e": "Art. 13, numeral 12. Trampa: el presidente propone al oficial (art. 9, num. 7), no a la unidad."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un proveedor externo ofrece verificar identidades, hallar beneficiarios finales y analizar alertas. La empresa puede:", "o": ["Debe realizarlas ella misma, pues no son tercerizables", "Puede tercerizarlas si el proveedor responde por ellas", "Requiere solo la aprobación previa de la junta directiva", "Basta con notificar el contrato a la superintendencia"], "a": 0, "e": "Funciones medulares no tercerizables; la responsabilidad no se delega."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial cita el plazo de conservación de la LOCDOFT para justificar guardar registros digitales solo cinco años. Su error es que:", "o": ["La norma del sector exige diez en digital", "La LOCDOFT exige diez años en digital", "La norma del sector exige tres en digital", "La LOCDOFT no fija plazo de conservación"], "a": 0, "e": "La norma sectorial es más exigente que el mínimo legal."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe con los hallazgos del Programa Anual de Evaluación y Control se presenta a la junta directiva con copia a:", "o": ["El oficial de cumplimiento y el presidente", "La superintendencia y la UNIF, por separado", "El auditor externo y la unidad de riesgos", "Los responsables de cumplimiento de cada área"], "a": 0, "e": "Art. 71. Trampa: es un informe interno que la superintendencia verifica en la inspección."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la autoevaluación de riesgo se remite dentro de los sesenta días continuos siguientes al cierre, certificada por el auditor interno.", "a": true, "e": "Art. 20. Trampa: suena a que debe certificarla el auditor externo, que interviene en el informe anual."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el personal mínimo de la unidad de administración de riesgos debe estar a dedicación exclusiva.", "a": true, "e": "Art. 14. Trampa: se cree que la dedicación exclusiva solo se exige al oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe asegurar que las unidades de mercadeo y negocios consulten al oficial antes de lanzar un nuevo producto.", "a": true, "e": "Art. 9, numeral 8. Trampa: se cree que esa obligación es solo del oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado nunca toma vacaciones, recibe regalos frecuentes de clientes y vive por encima de su sueldo. ¿Qué debe hacer el supervisor?", "o": ["Reportar al Oficial por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Conversar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Art. 66. Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, proponer a la junta directiva la designación del oficial de cumplimiento corresponde a:", "o": ["El presidente o quien haga sus veces", "La unidad de administración de riesgos", "El auditor interno de la empresa", "La asamblea de accionistas"], "a": 0, "e": "Art. 9, num. 7. Trampa: la junta designa, pero la propuesta es del presidente."}, {"t": "mc", "q": "SUDEASEG ejerce amplias facultades de supervisión sobre los sujetos obligados mediante su Oficina de Administración de Riesgos de LC/FT/FPADM. ¿Cuál es un efecto práctico?", "o": ["Ordenar ajustes si los mecanismos son insuficientes", "Observar y dejar constancia de la situación en un acta", "Cobrar tasas de supervisión al sujeto obligado", "Recomendar mejoras sin ningún carácter obligatorio"], "a": 0, "e": "Poder correctivo del supervisor."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ante la falta absoluta del oficial, quien asume sus funciones de forma inmediata es:", "o": ["El presidente o quien haga sus veces", "El auditor interno de la empresa", "Un funcionario designado por el supervisor", "El responsable de cumplimiento más antiguo"], "a": 0, "e": "Art. 9, numeral 6. La función no puede quedar acéfala."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Informe Anual del auditor externo se remite junto con:", "o": ["La certificación del acta de aprobación de la junta", "El dictamen del auditor interno de la empresa", "La opinión escrita del oficial de cumplimiento", "El Plan Operativo Anual del ejercicio siguiente"], "a": 0, "e": "Art. 72. Trampa: el auditor interno certifica la autoevaluación, no este informe."}, {"t": "vf", "q": "La Providencia SAA-01-0530-2024 y la SAA-01-0536-2024 regulan lo mismo: la administración de riesgos de LC/FT/FPADM.", "a": false, "e": "La 0530-2024 trata del Buen Gobierno Corporativo; la 0536-2024 es la norma de riesgos de LC/FT/FPADM."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las sociedades de corretaje, las financiadoras de primas y la medicina prepagada, respecto de la unidad:", "o": ["No están obligadas a conformarla, pero sí a informar", "Deben conformarla siempre sin excepción", "Están exentas de todo el sistema", "Deben compartir la unidad con una empresa de seguros"], "a": 0, "e": "Art. 7. Proporcionalidad según el tipo de sujeto."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el envío del reporte de actividades sospechosas no acarrea responsabilidad civil ni penal, pero sí puede acarrear responsabilidad administrativa al oficial.", "a": false, "e": "Art. 83: tampoco acarrea responsabilidad administrativa. Trampa: media frase verdadera."}, {"t": "mc", "q": "La Ley de la Actividad Aseguradora ha tenido distintas versiones. ¿Cuál es la lógica correcta de su evolución?", "o": ["Ley 2010, Decreto-Ley 2015 y Reforma 2023, vigente la última", "Ley 2010 y Decreto-Ley 2015, vigente el decreto-ley de 2015", "Decreto-Ley 2015 derogó la Reforma de 2023 por ser especial", "Reforma 2023 derogó solo la Ley de 2010 y mantiene la de 2015"], "a": 0, "e": "Cuidado con citar versiones anteriores como vigentes."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual de políticas se remite a la superintendencia solo para su conocimiento.", "a": false, "e": "Art. 28: para su revisión, autorización e implementación. Trampa: se rebaja el trámite."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando no se puede verificar un dato, la notificación a la UNIF debe indicar los datos verdaderos del cliente, si se obtuvieron.", "a": true, "e": "Art. 44. Trampa: se cree que basta señalar el dato dudoso."}, {"t": "mc", "q": "Un compañero cita la Resolución 083.18 para fundamentar una obligación de una aseguradora. El error es que esa resolución:", "o": ["Es del sector bancario, no del asegurador", "Está derogada desde el año 2021", "Es una guía sin carácter obligatorio", "Corresponde al mercado de valores"], "a": 0, "e": "Cada sector tiene su norma; citar la ajena es un error frecuente."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la frecuencia de actualización de los datos se fija según el nivel de riesgo y debe dejarse constancia en el expediente.", "a": true, "e": "Art. 39: para riesgo alto no puede ser mayor a un año. Trampa: se cree que es anual para todos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Seguimiento, Evaluación y Control lo elaboran y ejecutan:", "o": ["Los responsables de cumplimiento", "La auditoría interna o quien haga sus veces", "El auditor externo inscrito en el registro", "La junta directiva o el órgano equivalente"], "a": 0, "e": "Art. 17, numeral 3. Trampa: la auditoría interna ejecuta otro instrumento, el Programa Anual de Evaluación y Control (art. 71)."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva asume la corresponsabilidad del cumplimiento de las normas de prevención.", "a": true, "e": "Art. 8, numeral 12. Trampa: se cree que la responsabilidad recae solo en el oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los responsables de cumplimiento dejan sus funciones habituales para dedicarse solo a la prevención.", "a": false, "e": "Art. 16: cumplen esas funciones adicionalmente a las propias. Trampa: se confunde con la dedicación exclusiva del oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la prohibición de tercerizar la verificación de datos y la identificación del beneficiario final no admite excepción alguna.", "a": false, "e": "Art. 40: salvo disposición en contrario. Trampa: un absoluto que el texto no tiene."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la suficiencia de la estructura del sistema de una empresa de seguros puede ser determinada por la superintendencia:", "o": ["Al practicar los procedimientos de inspección", "Al autorizar el manual de políticas", "Al recibir la autoevaluación anual", "Al inscribir al oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2. Trampa: los otros momentos existen, pero no son los que fija el numeral."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual y su Informe de Ejecución se remiten, respectivamente:", "o": ["45 días antes del cierre y 30 días después", "30 días antes del cierre y 45 días después", "45 días después del cierre y 30 días antes", "60 días antes del cierre y 60 días después"], "a": 0, "e": "Arts. 29 y 30. Trampa: se cruzan los plazos de los dos instrumentos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una empresa de seguros pequeña pregunta si debe conformar una Unidad de Administración de Riesgos. ¿Qué respuesta interpreta correctamente la norma?", "o": ["Depende de su autoevaluación; SUDEASEG puede ordenarla", "Siempre debe conformarla, sin excepciones por tamaño", "Nunca debe conformarla si tiene menos de cien empleados", "Solo la conforma si SUDEASEG la inspecciona por primera vez"], "a": 0, "e": "Art. 7. Criterio basado en riesgo, con control del supervisor."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si la Junta Directiva no está de acuerdo con la remisión de un ROS, puede impedirla.", "a": false, "e": "Art. 83. No puede negar la remisión."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Evaluación y Control lo elabora y ejecuta:", "o": ["La auditoría interna o quien haga sus veces", "El oficial de cumplimiento con su unidad", "El auditor externo inscrito en el registro", "Los responsables de cumplimiento de cada área"], "a": 0, "e": "Art. 71. Trampa: el Programa Anual de Seguimiento lo ejecutan los responsables de cumplimiento (art. 17)."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los supervisores deben vigilar el amplio incremento de la cartera de negocios de prima única de los intermediarios.", "a": true, "e": "Art. 58. Trampa: parece un éxito comercial, pero la norma lo lista como objeto de atención."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora digitaliza sus expedientes y destruye el físico al tercer año. Considerando los plazos del sector:", "o": ["Incumple: el físico debe guardarse cinco años", "Cumple: basta el digital durante diez años", "Cumple: basta el físico durante tres años", "Incumple: el físico debe guardarse diez años"], "a": 0, "e": "Cinco años en físico y diez en digital."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante las vacaciones o el reposo médico del oficial de cumplimiento, sus funciones las ejerce:", "o": ["El presidente o quien haga sus veces", "El jefe de la unidad de riesgos LC/FT", "Un responsable de cumplimiento designado", "El auditor interno o quien haga sus veces"], "a": 0, "e": "Art. 9, num. 5. Trampa: en criptoactivos la junta designa un suplente."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los responsables de cumplimiento deben notificar a la unidad y al oficial cuando no hayan conocido operaciones inusuales en el mes anterior.", "a": true, "e": "Art. 17, numeral 4. Trampa: se cree que solo se informa cuando hay hallazgos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora remite su autoevaluación certificada por el auditor externo y aprobada por la junta. El defecto es que:", "o": ["Debe certificarla el auditor interno", "Debe aprobarla el oficial, no la junta", "Debe certificarla la superintendencia", "No requiere certificación de ningún tipo"], "a": 0, "e": "El auditor externo interviene en el informe anual."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe de ejecución del Plan Operativo Anual debe justificar las actividades no ejecutadas o reprogramadas.", "a": true, "e": "Art. 30. Trampa: se cree que solo recoge lo cumplido."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el beneficiario de una póliza de vida de una PEP se presenta a cobrar. Para el pago se requiere:", "o": ["La aprobación de la junta directiva", "La aprobación del oficial de cumplimiento", "La autorización de la superintendencia", "Solo la verificación del documento"], "a": 0, "e": "La aprobación alcanza la relación y el pago."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "El Convenio de Financiación del Terrorismo", "La Convención de Viena de 1988", "La Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, de quien ofrece y de quien acepta", "Activa, de quien ofrece el beneficio indebido", "Pasiva, de quien recibe el beneficio indebido", "Extranjera, cuando interviene otro Estado"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "A
