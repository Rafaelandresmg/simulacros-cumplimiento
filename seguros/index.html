cada mes"], "a": 0, "e": "Arts. 76 y 77. Trampa: se cambia la unidad o el número."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una cesión de cartera o una fusión obligan a considerar la actualización de la autoevaluación de riesgo.", "a": true, "e": "Art. 20. Trampa: se cree que la autoevaluación solo se actualiza una vez al año."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los programas de formación que debe cursar el aspirante a oficial de cumplimiento son los que imparte la ONCDOFT.", "a": false, "e": "Art. 11, num. 3: los imparte la Superintendencia de la Actividad Aseguradora. Trampa: en turismo los imparte INATUR."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Al comprador y también al vendedor", "Al comprador, que es quien aporta los fondos", "Al vendedor, que es quien recibe los fondos", "A quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "mc", "q": "Según la Recomendación 34 del GAFI, la información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento renuncia de forma intempestiva. La secuencia correcta es:", "o": ["Asume el presidente, aviso en 5 hábiles y nuevo en 10", "Asume el auditor, aviso en 10 hábiles y nuevo en 5", "Asume la unidad, aviso en 5 hábiles y nuevo en 30", "Asume la junta, aviso en 10 continuos y nuevo en 60"], "a": 0, "e": "Falta absoluta: el presidente asume; notificación en cinco días hábiles; designación en diez días hábiles, prorrogable una sola vez."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "vf", "q": "Según la LOCDOFT, la ONCDOFT depende jerárquicamente del ministerio con competencia en planificación y finanzas.", "a": false, "e": "Art. 5: depende del ministerio con competencia en relaciones interiores y justicia. Trampa: planificación y finanzas es el ministerio de la UNIF (art. 24)."}, {"t": "mc", "q": "¿Qué consecuencia puede tener que SUDEASEG considere que el informe del auditor externo no cumple los extremos de la norma?", "o": ["Puede exigir una nueva auditoría y acciones correctivas", "Nada, porque el informe es vinculante para SUDEASEG", "La empresa debe ser liquidada de inmediato por el órgano", "El informe se considera aprobado por silencio administrativo"], "a": 0, "e": "El supervisor puede verificar la exactitud del informe."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción", "Las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según la Recomendación 14 del GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un reasegurador extranjero propone contratar con una aseguradora venezolana. ¿Qué debe revisar la aseguradora para conocerlo?", "o": ["Estados auditados, impuestos y estructura de control", "Solo su nombre y su calificación de riesgo publicada", "Solo el tratado de reaseguro firmado con la cedente", "Únicamente su inscripción ante un regulador extranjero"], "a": 0, "e": "Art. 61. El reaseguro también es un canal de riesgo."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 7 del GAFI, la evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, entre los principios de la gestión del riesgo figura que esta sea:", "o": ["Integrada en todas las actividades de la organización", "Delegada por completo en el área de cumplimiento", "Realizada cuando lo exija el supervisor del sector", "Limitada a los riesgos de cuantía significativa"], "a": 0, "e": "Apartado 4: integrada, estructurada, adaptada, inclusiva y dinámica. Trampa: delegarla o limitarla contradice la integración."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes para todos los Estados por igual", "Ambos son recomendaciones sin ningún efecto jurídico práctico", "El GAFI aprueba los tratados que firman sus miembros"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un corredor puede llenar y firmar la declaración de origen de fondos si el cliente se lo autoriza verbalmente.", "a": false, "e": "Se prohíbe al intermediario llenar y suscribir la declaración."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual lo elabora, diseña y ejecuta:", "o": ["El oficial de cumplimiento", "La junta directiva", "La unidad de auditoría interna", "El presidente de la empresa"], "a": 0, "e": "Art. 29. Trampa: la junta aprueba su informe de ejecución, pero no elabora el plan."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual aprobado por la junta se remite a la superintendencia dentro de:", "o": ["Treinta días continuos desde la inscripción", "Treinta días hábiles desde su aprobación", "Sesenta días continuos desde la inscripción", "Cuarenta y cinco días previos al cierre"], "a": 0, "e": "Art. 28. Trampa: se mezclan el plazo y el hecho que lo inicia."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando no es posible obtener la huella dactilar, la empresa queda dispensada de cualquier control biométrico.", "a": false, "e": "Art. 45: debe usar otros controles biométricos alternos. Trampa: se convierte la dificultad en dispensa."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Según los datos del Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la norma establece un único método obligatorio para calcular el riesgo inherente.", "a": false, "e": "La norma ofrece principios, un marco y un proceso, no un método único de cálculo. Trampa: se confunde un marco de referencia con una metodología cerrada."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), a los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "Según la Recomendación 21 del GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un intermediario llena la planilla de un cliente analfabeto y firma por él la declaración de origen de fondos «para ayudar». ¿Qué problema hay?", "o": ["El intermediario tiene prohibido suscribirla", "Es válido con autorización escrita del cliente", "Procede si el cliente no sabe escribir", "Basta que el supervisor comercial lo revise"], "a": 0, "e": "Art. 50. La declaración debe ser personal y real."}]}, {"titulo": "Examen integral 5", "q": [{"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante las vacaciones del Oficial de Cumplimiento, sus funciones deben quedar cubiertas, no suspendidas.", "a": true, "e": "Art. 9, numeral 5. La función es continua."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo bajo, sin señales de alerta, puede recibir debida diligencia:", "o": ["Simplificada", "Intensificada", "Mejorada", "Ninguna medida"], "a": 0, "e": "Art. 36. Simplificada no significa ausencia de medidas."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva puede negar al oficial la remisión de un reporte cuando lo considere infundado.", "a": false, "e": "Art. 83: no puede negarla. Trampa: se añade una excepción."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los requerimientos del Ministerio Público se atienden en un plazo fijo de cinco días hábiles.", "a": false, "e": "Art. 84: en el plazo prudencial que indique la superintendencia. Trampa: cinco días hábiles es el plazo para notificar la ausencia del oficial."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, una aseguradora detecta que un tomador figura en una lista de designados por la ONU. ¿Qué principio rige?", "o": ["Congelar sin demora y notificar sin avisar al cliente", "Consultar al cliente antes de adoptar medidas", "Esperar una orden judicial para congelar", "Continuar el contrato mientras se verifica el listado"], "a": 0, "e": "«Sin demora» es el estándar."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, los factores humanos y culturales influyen en todos los aspectos de la gestión del riesgo.", "a": true, "e": "Apartado 4. Trampa: se cree que basta un buen modelo técnico."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la renovación del registro del oficial de cumplimiento exige pagar la fracción de la tasa y:", "o": ["Actualizar la documentación", "Aprobar un nuevo examen", "Presentar aval de la junta", "Cursar otro programa académico"], "a": 0, "e": "Art. 12. Trampa: la norma no pide examen ni aval."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se admite para un cliente de riesgo bajo aunque exista sospecha de LC/FT, si el monto es reducido.", "a": false, "e": "Art. 36: no se permite la simplificada si existen sospechas. Trampa: se agrega una excepción por monto que la norma no tiene."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un siniestro reclamado poco después de contratar una póliza de alto valor exige:", "o": ["Análisis reforzado por posible fraude o lavado", "Pago inmediato para evitar reclamos", "Cancelación automática del contrato de seguro", "Traslado del caso al reasegurador"], "a": 0, "e": "El fraude también es un ilícito cubierto por el sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la ONCDOFT asesora técnicamente, en las relaciones internacionales sobre la materia, al ministerio con competencia en:", "o": ["Relaciones exteriores", "Planificación y finanzas", "Relaciones interiores y justicia", "Economía y comercio"], "a": 0, "e": "Art. 6, numeral 7. Trampa: la ONCDOFT depende del de relaciones interiores, pero asesora al de relaciones exteriores."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutarlo conforme al derecho interno del Estado requerido", "Aplicar directamente la ley del Estado que lo solicita", "Someter el caso a la Corte Internacional de Justicia", "Obtener antes el consentimiento expreso del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el tratamiento de una PEP en un seguro de vida exige, además de la diligencia intensificada:", "o": ["Aprobación de la junta para la relación y el pago", "Autorización escrita del propio cliente PEP", "Notificación previa a la superintendencia", "Constitución de una garantía adicional"], "a": 0, "e": "Art. 51. El nivel más alto de la organización decide."}, {"t": "vf", "q": "Según la LOCDOFT, mantener un registro actualizado de sus sujetos obligados es una obligación de cada órgano o ente de control.", "a": true, "e": "Art. 8, numeral 13. Trampa: se cree que solo el órgano rector lleva registros."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el apetito de riesgo lo define el oficial de cumplimiento y lo informa a la junta directiva.", "a": false, "e": "Lo define y aprueba el órgano de dirección. Trampa: se invierte quién decide y quién informa."}, {"t": "mc", "q": "Según la LOCDOFT, si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "Arts. 13 y 17. El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el expediente de un reasegurador debe incluir estados financieros auditados de, por lo menos:", "o": ["Los tres últimos años", "Los dos últimos años", "Los cinco últimos años", "El último ejercicio cerrado"], "a": 0, "e": "Art. 61, num. 4. Trampa: se cambia el número de años."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Según la LOCDOFT, en la arquitectura venezolana, quien dicta normas prudenciales para las aseguradoras es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera", "El Ministerio Público"], "a": 0, "e": "Arts. 7, numeral 2, y 8, numeral 10. Cada supervisor dicta las normas de su sector."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar la designación de los miembros de la unidad de administración de riesgos y de los responsables de cumplimiento corresponde a:", "o": ["La junta directiva", "El oficial de cumplimiento", "El presidente", "La superintendencia"], "a": 0, "e": "Art. 8, numeral 9. Trampa: el oficial los propone (art. 13, num. 12), pero no los aprueba."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación entre los organismos nacionales de investigación y el sector privado se regula en su artículo:", "o": ["39", "38", "12", "14"], "a": 0, "e": "El 38 trata la cooperación entre organismos nacionales; el 12, el sector privado en la prevención; el 14, las medidas contra el blanqueo."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, una aseguradora identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según la Recomendación 32 del GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente y el oficial de cumplimiento se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Art. 7. Trampa: se espera que el oficial esté por debajo del presidente."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "mc", "q": "Un cliente solicita devolver una prima de seguro a una cuenta de un tercero. ¿Qué principio del GAFI y de la práctica aseguradora se pone en juego?", "o": ["Conocer origen, destino y relación entre las partes", "Respetar el secreto bancario del asegurado", "Proteger la libertad de disposición de los fondos", "Aplicar la reciprocidad entre instituciones"], "a": 0, "e": "Pagos a terceros requieren análisis."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), un cliente propone pagar con efectivo varias pólizas pequeñas el mismo día, justo por debajo del monto de control. La conducta descrita se conoce como:", "o": ["Fraccionamiento o «pitufeo» para evadir controles", "Diversificación legítima de coberturas de seguro", "Planificación fiscal habitual mediante primas pequeñas", "Contratación escalonada propia de un cliente corporativo"], "a": 0, "e": "Es una señal clásica de colocación."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "Una constructora, una notaría y una aseguradora son sujetos obligados según la LOCDOFT. Lo que tienen en común es que:", "o": ["Cada una está sometida a un órgano o ente de control", "Cada una depende jerárquicamente de la ONCDOFT", "Cada una reporta sus operaciones a SUDEASEG", "Cada una pertenece al mismo sector económico"], "a": 0, "e": "Sujeto obligado es quien está bajo el control de un órgano de control; cada sector tiene el suyo."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, establecer mecanismos para detectar transacciones inusuales o sospechosas, aun con justificación económica aparente, es deber de:", "o": ["Los sujetos obligados", "Los órganos de control", "La UNIF", "La ONCDOFT"], "a": 0, "e": "Art. 12. Trampa: los órganos de control dictan instructivos y supervisan, pero la detección es deber del sujeto obligado."}, {"t": "mc", "q": "Una aseguradora, un banco y una casa de bolsa tienen deberes equivalentes de prevención pero distinto supervisor. Eso se explica porque la LOCDOFT:", "o": ["Fija deberes comunes y asigna cada sector a su órgano de control", "Obliga a todos a reportar ante su propia superintendencia sectorial", "Deja a cada sector definir sus propios deberes", "Aplica solo al sector bancario y por analogía al resto"], "a": 0, "e": "Deberes comunes, supervisión sectorial, reporte centralizado en la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, una aseguradora recibe una citación del Ministerio Público sobre un asegurado y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Art. 13. Son deberes distintos y concurrentes."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la Providencia SAA-01-0536-2024 de SUDEASEG es más exigente para digital."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Arts. 13 y 17. Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, la política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, dirigir a los cuerpos de policía de investigaciones penales en estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El juez de control"], "a": 0, "e": "Art. 26. Trampa: el juez autoriza medidas, pero no dirige la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, ante indicios de un hecho punible, presenta informes debidamente fundados a:", "o": ["El Ministerio Público", "El juez de control", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 25, numeral 6. Trampa: la UNIF no se dirige al juez; quien solicita medidas judiciales es el fiscal."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Debe declararlos porque exceden el umbral de US$10.000", "No debe declararlos porque el umbral es de US$15.000", "Debe declararlos solo si es extranjero no residente", "No debe declararlos si los fondos son de origen lícito"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "Art. 8, numeral 10. El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Art. 4, numeral 2. Estructuración para evadir el reporte."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la LOCDOFT, si una aseguradora no tiene manual de prevención, quien tiene competencia para sancionarla administrativamente por esa omisión es:", "o": ["El órgano de control de su sector, es decir, SUDEASEG", "La UNIF, por ser la unidad de inteligencia financiera", "El Ministerio Público, por tratarse de un delito", "El juez de control, previa solicitud fiscal"], "a": 0, "e": "Art. 8, numeral 3. SUDEASEG es el órgano de control del sector asegurador."}, {"t": "mc", "q": "Según la LOCDOFT, aprobar la vinculación de un cliente PEP corresponde a la alta gerencia; diseñar y aplicar la debida diligencia sobre ese cliente corresponde a:", "o": ["El sujeto obligado, supervisado por su órgano de control", "El órgano de control, en cada operación del cliente", "La UNIF, al recibir el primer reporte del cliente", "La ONCDOFT, mediante una autorización previa"], "a": 0, "e": "Art. 18. Trampa: el órgano de control supervisa, pero quien diseña y aplica los procedimientos es el sujeto obligado."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "Art. 9. La ley obliga; la norma sectorial detalla."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "mc", "q": "Según la LOCDOFT, un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable, sin exigir certeza", "Esperar pruebas documentales del origen ilícito", "Consultar al cliente para descartar la sospecha", "Esperar al próximo ciclo de monitoreo"], "a": 0, "e": "Art. 13. El estándar es de sospecha, no de prueba."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las empresas de seguros en materia de prevención es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Superintendencia de las Instituciones del Sector Bancario", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera"], "a": 0, "e": "Art. 7, numeral 2. Trampa: la ONCDOFT es rectora y la UNIF recibe reportes; el control sectorial es de la superintendencia."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 de SUDEASEG exige conservar 10 años en formato digital, mientras la LOCDOFT exige cinco. ¿Cómo debe una aseguradora aplicar ambas?", "o": ["El plazo más exigente, que endurece el mínimo legal", "El plazo de la ley, que prevalece sobre la providencia", "El plazo que elija la aseguradora según el soporte", "El plazo de la norma, solo durante las inspecciones"], "a": 0, "e": "La ley fija mínimos; la norma sectorial puede ser más estricta."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la Recomendación 24 del GAFI, una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Según la LOCDOFT, un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar, porque el deber legal no depende del cargo", "Consultar al cliente antes de decidir el reporte", "Dejar constancia interna y abstenerse de reportar", "Renunciar al cargo antes de presentar el reporte"], "a": 0, "e": "Art. 13. La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede requerir a los sujetos obligados información sobre transacciones que puedan vincularse con estos delitos, aunque no exista un reporte previo.", "a": true, "e": "Art. 25, numeral 2. Trampa: se cree que solo analiza lo que recibe por reporte."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), a los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "Según la LOCDOFT, la ONCDOFT depende jerárquicamente del ministerio con competencia en planificación y finanzas.", "a": false, "e": "Art. 5: depende del ministerio con competencia en relaciones interiores y justicia. Trampa: planificación y finanzas es el ministerio de la UNIF (art. 24)."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Según la LOCDOFT, dictar normas e instructivos que ayuden a los sujetos obligados a detectar patrones sospechosos corresponde a:", "o": ["Los órganos y entes de control", "La UNIF, mediante sus circulares", "La ONCDOFT, como órgano rector", "El Ministerio Público"], "a": 0, "e": "Art. 8, numeral 10. Trampa: la UNIF emite circulares sobre reportes, pero la ley asigna esta función a los órganos de control."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "mc", "q": "Según la LOCDOFT, las empresas de seguros son sujetos obligados porque su actividad está regulada por:", "o": ["La ley que rige la actividad aseguradora", "Una norma prudencial dictada por la UNIF", "El Código de Comercio de la República", "Una providencia administrativa de la ONCDOFT"], "a": 0, "e": "Art. 9, numeral 2. Trampa: la condición nace de la ley sectorial, no de una providencia."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "Según la LOCDOFT, diseñar las directrices para el plan operativo anual de prevención de los órganos de control corresponde a la UNIF.", "a": false, "e": "Art. 6, numeral 2: corresponde a la ONCDOFT. Trampa: se cambia el organismo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "La antigüedad del cliente justifica relajar los controles", "La condición de empresa regulada exime de los controles", "La autorización del oficial basta para relajar los controles"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Según la LOCDOFT, si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "Arts. 13 y 17. El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "vf", "q": "Según la LOCDOFT, mantener un registro actualizado de sus sujetos obligados es una obligación de cada órgano o ente de control.", "a": true, "e": "Art. 8, numeral 13. Trampa: se cree que solo el órgano rector lleva registros."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "mc", "q": "Según la LOCDOFT, en la arquitectura venezolana, quien dicta normas prudenciales para las aseguradoras es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera", "El Ministerio Público"], "a": 0, "e": "Arts. 7, numeral 2, y 8, numeral 10. Cada supervisor dicta las normas de su sector."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "mc", "q": "Según la LOCDOFT, la ONCDOFT asesora técnicamente, en las relaciones internacionales sobre la materia, al ministerio con competencia en:", "o": ["Relaciones exteriores", "Planificación y finanzas", "Relaciones interiores y justicia", "Economía y comercio"], "a": 0, "e": "Art. 6, numeral 7. Trampa: la ONCDOFT depende del de relaciones interiores, pero asesora al de relaciones exteriores."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, una aseguradora identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo usa cuatro años de pena máxima y la LOCDOFT más de cinco", "Palermo usa cinco años de pena máxima y la LOCDOFT solo cuatro", "Palermo usa diez años y la LOCDOFT no define el concepto", "Palermo y la LOCDOFT usan cuatro años de pena máxima"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales no figura:", "o": ["La UNIF", "La Fuerza Armada Nacional Bolivariana", "El Cuerpo de Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26. Trampa: sorprende que la Fuerza Armada sí figure y la UNIF no."}, {"t": "vf", "q": "Según la LOCDOFT, remitir a la UNIF la información que esta requiera, en los plazos que fije, es también una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 9. Trampa: se cree que solo los sujetos obligados envían información a la UNIF."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una aseguradora contribuye intencionalmente a estos delitos, el Ministerio Público notifica a la Superintendencia de la Actividad Aseguradora para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia del oficial para reportar", "Refuerza el control interno sobre los reportes", "Requiere solo la aprobación previa del supervisor", "Aplica únicamente a los reportes de monto elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "Según la LOCDOFT, una aseguradora recibe una solicitud de información del Ministerio Público sobre un asegurado. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF proporciona a la ONCDOFT la información necesaria para el diseño de políticas públicas.", "a": true, "e": "Art. 25, numeral 9. Trampa: se cree que la reserva impide compartirla con el órgano rector."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Según la LOCDOFT, varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Art. 22. Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "Art. 8, numeral 3. La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "Según la LOCDOFT, un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Art. 32, numeral 4. Sanción de carácter reputacional."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "Art. 36. La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Evaluar el riesgo de los productos antes de lanzarlos", "Garantizar la autonomía del oficial frente a la junta", "Mantener la gratuidad de la función de cumplimiento", "Respetar la buena fe contractual con el cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, los representantes en el país de bancos o financiadoras extranjeras quedan sometidos a las disposiciones de la ley.", "a": true, "e": "Art. 20, parte final. Trampa: se cree que la regulación de su país de origen los exime."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Según la LOCDOFT, la delincuencia organizada supone la acción u omisión de:", "o": ["Tres o más personas asociadas por cierto tiempo", "Dos o más personas asociadas por cierto tiempo", "Tres o más personas reunidas de forma ocasional", "Cinco o más personas con jerarquía definida"], "a": 0, "e": "Art. 4, numeral 9. Trampa: se cambia el número o se quita la permanencia."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un reporte de sospecha", "Aceptarlo con monitoreo reforzado durante el primer año", "Iniciar la relación si el pago es por transferencia", "Pedir el dato en la renovación y vincularlo de inmediato"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF coordina con la ONCDOFT y los órganos de control las acciones para promover la adecuada supervisión de los sujetos obligados.", "a": true, "e": "Art. 25, numeral 8. Trampa: se cree que la UNIF no interviene en la supervisión."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, los documentos deben conservarse por el plazo legal en forma:", "o": ["Física y digital", "Física, y digital si el órgano de control lo exige", "Digital, y física solo para los originales", "Física o digital, a elección del sujeto obligado"], "a": 0, "e": "Art. 10. Trampa: las dos formas son acumulativas, no alternativas."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente persona jurídica extranjera con varias capas societarias en jurisdicciones opacas pide una póliza de alto valor. Lo primero es:", "o": ["Identificar a la persona natural que lo controla en última instancia", "Pedir el RIF y el acta constitutiva de la sociedad cliente", "Exigir una garantía bancaria por el equivalente a la
