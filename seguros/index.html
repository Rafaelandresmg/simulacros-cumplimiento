s organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Rechazarlas como clientes por el principio de prudencia", "Tratarlas siempre como riesgo bajo", "Exigirles una garantía bancaria"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "vf", "q": "Según el GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "Una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Según la norma del sector, la condición de PEP se extiende tras el cese del cargo por:", "o": ["Cinco años", "Dos años", "Diez años", "De forma indefinida"], "a": 0, "e": "Plazo expreso de la norma sectorial."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "SUDEASEG ejerce amplias facultades de supervisión sobre los sujetos obligados mediante su Oficina de Administración de Riesgos de LC/FT/FPADM. ¿Cuál es un efecto práctico?", "o": ["Ordenar ajustes si los mecanismos son insuficientes", "Solo observar y dejar constancia en un acta", "Solo cobrar tasas de supervisión al sujeto", "Solo recomendar mejoras sin carácter obligatorio"], "a": 0, "e": "Poder correctivo del supervisor."}, {"t": "mc", "q": "La Recomendación 32 regula:", "o": ["El transporte transfronterizo de efectivo", "La elaboración de estadísticas nacionales", "La orientación a los sujetos obligados", "El régimen de sanciones aplicables"], "a": 0, "e": "Declaración o divulgación en frontera."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para una aseguradora venezolana es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado en lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "La Recomendación 2 se refiere a:", "o": ["Cooperación y coordinación entre autoridades nacionales", "Debida diligencia del cliente", "Sanciones financieras dirigidas sobre el terrorismo", "Transparencia de fideicomisos"], "a": 0, "e": "Coordinación interna del país."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Únicamente su monto reducido por operación", "Únicamente el volumen total vendido del año", "Únicamente el país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["Cumplimiento técnico y efectividad del sistema", "Solo si el país tiene leyes contra el lavado vigentes", "Solo el número de condenas dictadas por lavado", "Solo el tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Una aseguradora recibe instrucciones contradictorias de su superintendencia y de la UNIF sobre un reporte. Lo correcto es:", "o": ["Consultar a ambas y dejar constancia escrita", "Obedecer siempre a la superintendencia", "Obedecer siempre a la UNIF", "No reportar hasta que se pongan de acuerdo"], "a": 0, "e": "Nunca dejar de reportar; documentar la consulta."}, {"t": "mc", "q": "Frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "mc", "q": "¿Por qué la firma que realiza la auditoría externa no puede ejecutar también el programa anual de evaluación y control?", "o": ["Evitar que el auditor se evalúe a sí mismo", "Porque no cuenta con personal capacitado en la materia", "Porque SUDEASEG prohíbe cualquier contrato adicional", "Porque la UNIF exige separar ambos servicios por costo"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su póliza se anula automáticamente", "Su prima debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "La norma coloca al oficial de cumplimiento en un nivel jerárquico equiparable al del presidente para:", "o": ["Que pueda objetar decisiones sin presión interna", "Que pueda firmar pólizas en su ausencia", "Igualar su remuneración con la del resto de la gerencia", "Permitirle representar a la empresa"], "a": 0, "e": "Independencia funcional real."}, {"t": "mc", "q": "SUDEASEG informa a los sujetos obligados señales de alerta del sector manteniendo reserva sobre las personas involucradas. ¿Por qué?", "o": ["Orientar sin vulnerar la confidencialidad de los ROS", "Exhibir los nombres de los clientes reportados", "Cumplir una costumbre del supervisor del sector", "Sancionar por adelantado a los sujetos con alertas"], "a": 0, "e": "Equilibrio entre orientación y reserva."}, {"t": "mc", "q": "¿Qué significa «conoce a tu empleado» como principio de cumplimiento?", "o": ["Seleccionar y vigilar al personal", "Evaluar la estatura profesional del candidato", "Limitar el sueldo de los empleados clave", "Evitar nuevas contrataciones en cumplimiento"], "a": 0, "e": "Riesgo interno."}, {"t": "vf", "q": "La confidencialidad de un reporte protege tanto la investigación como al personal que reporta.", "a": true, "e": "Por eso su violación es sancionada."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "El hermano de un gobernador contrata una póliza de alta suma. Según la LOCDOFT, el tratamiento adecuado es:", "o": ["Tratarlo como familiar de PEP, con aprobación de la alta gerencia", "Tratarlo como un cliente ordinario porque el PEP no es el contratante", "Rechazarlo, ya que la ley prohíbe contratar con familiares de PEP", "Notificar al gobernador para que autorice la contratación"], "a": 0, "e": "Los familiares cercanos y allegados forman parte del círculo PEP."}, {"t": "mc", "q": "Un gerente quiere cerrar de inmediato las pólizas de un cliente investigado «para protegerse». Según la LOCDOFT:", "o": ["No cerrar sin autorización judicial, para no frustrar la investigación", "Cerrar de inmediato e informar luego a la UNIF del cierre", "Cerrar la relación con la aprobación de la Junta Directiva de la empresa", "Cerrar si el cliente figura como riesgo alto en el sistema"], "a": 0, "e": "El cierre puede alertar al investigado y destruir evidencia."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Una aseguradora detecta pagos de primas incompatibles con los ingresos declarados de un cliente. Según la LOCDOFT, el reporte de actividad sospechosa se dirige a:", "o": ["La Unidad Nacional de Inteligencia Financiera (UNIF)", "La Oficina Nacional contra la Delincuencia Organizada (ONCDOFT)", "La Superintendencia de la Actividad Aseguradora (SUDEASEG)", "El Ministerio Público, mediante denuncia formal"], "a": 0, "e": "La UNIF centraliza y analiza los ROS y luego, de proceder, los remite al Ministerio Público. La ONCDOFT es el órgano rector; SUDEASEG supervisa."}, {"t": "mc", "q": "A los pocos días de contratar una póliza de vida, el tomador cambia al beneficiario por una empresa recién creada. El sujeto obligado debe:", "o": ["Analizar, aplicar diligencia reforzada y evaluar un ROS", "Procesar el cambio porque el tomador tiene derecho a modificarlo", "Cancelar la póliza y devolver la prima", "Informar al tomador que el cambio será reportado"], "a": 0, "e": "El cambio inusual de beneficiario es señal de alerta."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "mc", "q": "Una empresa opera en dos sectores regulados a la vez, por ejemplo seguros y valores. Debe:", "o": ["Cumplir las exigencias de ambos supervisores", "Elegir el régimen que considere más favorable", "Cumplir solo el del sector de mayor facturación", "Quedar exenta por el conflicto de normas"], "a": 0, "e": "Los regímenes se acumulan."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Un funcionario recibe una póliza de vida «de regalo» pagada por un contratista del Estado. La lectura adecuada es:", "o": ["Posible beneficio indebido que exige análisis anticorrupción", "Obsequio comercial normal sin ninguna implicación legal", "Acto lícito siempre que el funcionario lo declare después", "Operación de riesgo bajo por tratarse de un seguro de vida"], "a": 0, "e": "Los PEP exigen especial atención a dádivas y regalos."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "La Norma de SUDEASEG 2024 exige conservar 10 años en formato digital, mientras la LOCDOFT exige cinco. ¿Cómo debe una aseguradora aplicar ambas?", "o": ["El más exigente: la norma sectorial puede endurecer el mínimo legal", "El de la ley, porque la ley prevalece sobre la providencia", "El que la aseguradora elija según el soporte documental", "El de la norma, pero solo durante las inspecciones del órgano"], "a": 0, "e": "La ley fija mínimos; la norma sectorial puede ser más estricta."}, {"t": "mc", "q": "Una constructora, una notaría y una aseguradora son sujetos obligados según la LOCDOFT. Lo que tienen en común es que:", "o": ["Están bajo el control de un órgano o ente de control", "Todas dependen jerárquicamente de la ONCDOFT", "Todas reportan sus operaciones directamente a SUDEASEG", "Todas están en el mismo sector económico regulado"], "a": 0, "e": "Sujeto obligado es quien está bajo el control de un órgano de control; cada sector tiene el suyo."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "En seguros, ¿cuál de las siguientes es una señal de alerta típica de lavado?", "o": ["Cancelar una prima única y devolverla a un tercero", "Pago puntual de primas por débito desde la cuenta del asegurado", "Renovación anual con ajuste normal de la suma asegurada", "Reclamo por siniestro con inspección completa"], "a": 0, "e": "Prima única, rescate rápido y pagos a terceros son patrones de lavado."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las primas de seguros", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la LOCDOFT, el traslado de efectivo por frontera se controla mediante:", "o": ["Una declaración obligatoria por encima de un umbral", "Una autorización previa otorgada por el órgano rector", "Una prohibición total de llevar efectivo", "Un impuesto a la salida de divisas"], "a": 0, "e": "Declaración, no prohibición."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Una aseguradora recibe una citación del Ministerio Público sobre un asegurado y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Una aseguradora recibe una solicitud de información del Ministerio Público sobre un asegurado. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "Si una aseguradora no tiene manual de prevención, quien tiene competencia para sancionarla administrativamente por esa omisión es:", "o": ["El órgano de control de su sector, es decir, SUDEASEG", "La UNIF, por ser la unidad de inteligencia financiera", "El Ministerio Público, por tratarse de un delito", "El juez de control, previa solicitud fiscal"], "a": 0, "e": "SUDEASEG es el órgano de control del sector asegurador."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Una aseguradora quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada aseguradora", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede sustituirla libremente cuando la otra sea más exigente", "Debe aplicar siempre la del sector bancario", "Puede elegir la que prefiera cada año"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "La razón por la que los notarios y registradores figuran como sujetos obligados es que:", "o": ["Intervienen en actos que transfieren bienes de alto valor", "Reciben pagos en efectivo de parte de sus usuarios", "Dependen del Ministerio de Justicia", "Emiten documentos con fe pública"], "a": 0, "e": "El traspaso de inmuebles y sociedades es vía típica de integración."}, {"t": "mc", "q": "Si la UNIF pide información a una aseguradora sobre un cliente, la aseguradora debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de todas las transacciones en efectivo del mes anterior se remite a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El Banco Central"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "Un intermediario cobra comisiones elevadas por cada póliza de prima única vendida. El riesgo a vigilar es:", "o": ["Conflicto de interés y presión comercial sobre la debida diligencia", "Mayor protección para el asegurado por una suma más alta", "Incumplimiento de las tarifas oficiales del sector asegurador", "Exceso de reservas técnicas por primas únicas elevadas"], "a": 0, "e": "Los incentivos mal diseñados erosionan los controles."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Quien dicta las normas prudenciales para el sector bancario venezolano es:", "o": ["La Superintendencia de las Instituciones del Sector Bancario", "La Superintendencia Nacional de Valores", "La Superintendencia de la Actividad Aseguradora del país", "El Banco Central de Venezuela"], "a": 0, "e": "SUDEBAN para la banca; SUNAVAL para valores."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Un cliente propone pagar con efectivo varias pólizas pequeñas el mismo día, justo por debajo del monto de control. La conducta descrita se conoce como:", "o": ["Fraccionamiento o «pitufeo» para evadir controles", "Diversificación legítima de coberturas de seguro", "Planificación fiscal habitual mediante primas pequeñas", "Contratación escalonada propia de un cliente corporativo"], "a": 0, "e": "Es una señal clásica de colocación."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Una aseguradora con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector asegurador"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Una aseguradora recibe instrucciones contradictorias de su superintendencia y de la UNIF sobre un reporte. Lo correcto es:", "o": ["Consultar a ambas y dejar constancia escrita", "Obedecer siempre a la superintendencia", "Obedecer siempre a la UNIF", "No reportar hasta que se pongan de acuerdo"], "a": 0, "e": "Nunca dejar de reportar; documentar la consulta."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Una aseguradora dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a una aseguradora por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero y aseguradora"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Una aseguradora pequeña dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: las aseguradoras pequeñas quedan exentas", "Debe copiar el manual de una aseguradora de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "En la arquitectura venezolana, quien dicta normas prudenciales para las aseguradoras es:", "o": ["La Superintendencia de la Actividad Aseguradora", "La Oficina Nacional contra la Delincuencia Organizada", "La Unidad Nacional de Inteligencia Financiera", "El Ministerio Público"], "a": 0, "e": "Cada supervisor dicta las normas de su sector."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Un cliente persona jurídica extranjera con varias capas societarias en jurisdicciones opacas pide una póliza de alto valor. Lo primero es:", "o": ["Identificar a la persona natural que lo controla en última instancia", "Pedir el RIF y el acta constitutiva de la sociedad cliente", "Exigir una garantía bancaria por el equivalente a la suma asegurada", "Consultar primero la política del reasegurador que respalda"], "a": 0, "e": "Sin beneficiario final no hay debida diligencia válida."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de seguros", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "Una aseguradora, un banco y una casa de bolsa tienen deberes equivalentes de prevención pero distinto supervisor. Eso se explica porque la LOCDOFT:", "o": ["Fija deberes comunes y asigna cada sector a su órgano de control", "Obliga a todos a reportar ante su propia superintendencia sectorial", "Deja a cada sector definir sus propios deberes", "Aplica solo al sector bancario y por analogía al resto"], "a": 0, "e": "Deberes comunes, supervisión sectorial, reporte centralizado en la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Un cliente paga la prima con un cheque de un tercero sin vínculo aparente. Corresponde:", "o": ["Identificar al tercero, entender el motivo y evaluar el riesgo", "Aceptar el pago, porque el cheque tiene fondos suficientes", "Devolver el cheque sin pedir ninguna explicación al cliente", "Aceptar el pago y pasar al cliente a riesgo moderado"], "a": 0, "e": "El pagador real forma parte del conocimiento del cliente y del origen de fondos."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una aseguradora identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre aseguradora y asegurado"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, ser PEP implica por sí mismo que el cliente debe ser rechazado.", "a": false, "e": "La condición de PEP eleva el riesgo y exige medidas reforzadas; no implica ilicitud ni rechazo automático."}, {"t": "mc", "q": "El decomiso de bienes en la LOCDOFT se distingue de la multa en que el decomiso:", "o": ["Recae sobre bienes vinculados al delito", "Se paga en unidades tributarias", "Lo impone el órgano de control", "Se aplica solo a personas naturales"], "a": 0, "e": "Multa es sanción pecuniaria; decomiso recae sobre el producto o instrumento."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la prima se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "La Recomendación 16 regula:", "o": ["Las transferencias electrónicas y su información", "La banca corresponsal", "El reporte de operaciones sospechosas a la unidad", "La supervisión de las APNFD"], "a": 0, "e": "Trazabilidad de la cadena de pago."}, {"t": "mc", "q": "El beneficiario de una póliza de vida, según el estándar, debe:", "o": ["Considerarse factor de riesgo y verificarse antes del pago", "Identificarse solo si es persona jurídica", "Verificarse únicamente en el momento de contratar la póliza", "Quedar fuera del alcance de la diligencia"], "a": 0, "e": "Verificación a más tardar al momento del pago."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "La Recomendación 26 trata de:", "o": ["La regulación y supervisión de instituciones financieras", "La creación de la unidad de inteligencia financiera", "La cooperación internacional entre supervisores", "Las sanciones por incumplimiento"], "a": 0, "e": "La 27 define los poderes del supervisor."}, {"t": "mc", "q": "Si un ROS se envía con información incompleta o errónea, ¿qué consecuencia tiene?", "o": ["Reduce la utilidad de la inteligencia", "Es preferible a no reportar sin consecuencia alguna", "Se corrige automáticamente por la UIF", "Obliga a archivar el caso sin análisis"], "a": 0, "e": "La calidad importa."}, {"t": "mc", "q": "Un directivo cree que SUDEASEG recibe los ROS del sector asegurador. ¿Qué debe aclararle un oficial de cumplimiento?", "o": ["Los ROS van a la UNIF; SUDEASEG supervisa", "Los ROS van a SUDEASEG y esta los remite a la UNIF", "Los ROS van a la ONCDOFT por ser órgano rector", "Los ROS van directamente al tribunal de control"], "a": 0, "e": "Reparto institucional."}, {"t": "mc", "q": "La verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "vf", "q": "El financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "Una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "mc", "q": "La Recomendación 14 se ocupa de:", "o": ["Servicios de transferencia de dinero o valores", "Los casinos y los juegos de azar en línea", "Abogados y notarios", "Fondos de pensiones"], "a": 0, "e": "Incluye los sistemas informales de remesas."}, {"t": "mc", "q": "Un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "La Recomendación 18 exige a los grupos financieros:", "o": ["Controles internos y políticas a nivel de grupo", "Separar por completo sus filiales extranjeras", "Centralizar todas las cuentas en la matriz", "Auditar sus sucursales cada cinco años"], "a": 0, "e": "Incluye sucursales y filiales en el exterior."}, {"t": "mc", "q": "Según el GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Son nuevas y aún no están reguladas por ley", "Son costosas para las instituciones financieras", "Son ilegales en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "La Recomendación 25 se refiere a la transparencia de:", "o": ["Fideicomisos y otras estructuras jurídicas", "Sociedades anónimas y de responsabilidad limitada", "Cooperativas y asociaciones civiles", "Organizaciones sin fines de lucro"], "a": 0, "e": "Fideicomitente, fiduciario y beneficiarios."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "La Recomendación 24 aborda la transparencia de:", "o": ["Las personas jurídicas y su beneficiario final", "Los fideicomisos y figuras equivalentes", "Las transferencias electrónicas internacionales", "Las operaciones de banca corresponsal"], "a": 0, "e": "La 25 cubre las estructuras jurídicas."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "mc", "q": "La Recomendación 40 se refiere a:", "o": ["Otras formas de cooperación internacional entre autoridades", "El intercambio de información con el sector privado regulado", "La publicación de estadísticas nacionales", "La supervisión de los grupos financieros"], "a": 0, "e": "Cooperación entre UIF, supervisores y autoridades."}, {"t": "mc", "q": "La Recomendación 8 se ocupa de un sector concreto, que es:", "o": ["Las organizaciones sin fines de lucro", "Los casinos y los juegos de azar en línea", "Los agentes inmobiliarios", "Las cooperativas de ahorro"], "a": 0, "e": "Protegerlas del abuso para financiamiento del terrorismo."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "La Recomendación 37 se refiere a:", "o": ["La asistencia legal mutua entre Estados", "La extradición de los investigados", "El congelamiento y decomiso transfronterizo", "El intercambio entre unidades de inteligencia"], "a": 0, "e": "La 38 cubre congelamiento y decomiso, la 39 extradición."}, {"t": "mc", "q": "Venezuela participa en el sistema a través del organismo regional:", "o": ["GAFIC, el Grupo de Acción Financiera del Caribe", "GAFILAT, el de América Latina", "APG, el de Asia y el Pacífico", "MONEYVAL, el organismo del Consejo de Europa"], "a": 0, "e": "Es una confusión muy frecuente."}, {"t": "mc", "q": "La Recomendación 33 exige a los países mantener:", "o": ["Estadísticas sobre la efectividad de su sistema", "Un registro de todas las operaciones en efectivo", "Un listado público de personas sancionadas", "Una base de datos de clientes de alto riesgo"], "a": 0, "e": "Reportes, investigaciones, condenas y decomisos."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la prima y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "Un compañero afirma que, como el GAFI recomienda 5 años de conservación, la aseguradora puede conservar los registros digitales solo 5 años. ¿Qué observación corresponde?", "o": ["La norma de SUDEASEG exige 10 años para digital", "Tiene razón: 5 años bastan para todo soporte", "No existe norma sectorial sobre el plazo", "El GAFI exige 10 años para todos los soportes"], "a": 0, "e": "El estándar internacional es un mínimo; la norma local puede ser más estricta."}, {"t": "mc", "q": "Las Recomendaciones 30 y 31 se ocupan de:", "o": ["Las autoridades de orden público y sus facultades", "El reporte de operaciones sospechosas a la unidad", "La debida diligencia reforzada", "Los fideicomisos extranjeros"], "a": 0, "e": "Responsabilidades y poderes de investigación."}, {"t": "mc", "q": "Si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "¿Qué relación tiene el decomiso con la prevención del delito?", "o": ["Priva a las organizaciones de su lucro", "No tiene relación con la prevención", "Genera más delito al redistribuir bienes", "Es solo una medida de recaudación"], "a": 0, "e": "R.4."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Es siempre el único responsable de los incumplimientos", "No tiene ninguna responsabilidad por ser asesor", "Solo responde si es abogado colegiado"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Según el GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "¿Qué ventaja tiene que las Recomendaciones sean aplicables a todos los países, grandes o pequeños, desarrollados o no?", "o": ["Evita refugios normativos hacia donde migren los fondos", "Obliga a todos los países a usar la misma moneda", "Elimina la soberanía de los países sobre su sistema penal", "Reduce las diferencias entre bancos grandes y pequeños"], "a": 0, "e": "La cadena es tan fuerte como su eslabón más débil."}, {"t": "mc", "q": "La Recomendación 39 se ocupa de:", "o": ["La extradición en delitos de lavado y financiamiento", "La asistencia legal mutua en materia penal entre Estados", "El decomiso sin condena previa", "La cooperación entre supervisores"], "a": 0, "e": "Los países no deben negarla por tratarse de delitos fiscales."}, {"t": "vf", "q": "El GAFILAT es el organismo de estilo GAFI al que pertenece Venezuela.", "a": false, "e": "Pertenece al GAFIC (CFATF)."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "mc", "q": "Un exceso de ROS «defensivos» sin análisis tampoco es deseable porque:", "o": ["Satura a la UIF y reduce su calidad", "Es ilegal reportar sin análisis profundo", "Reduce las primas de la aseguradora", "Aumenta los impuestos de la empresa"], "a": 0, "e": "Calidad frente a cantidad."}, {"t": "mc", "q": "Que el GAFI revise sus recomendaciones periódicamente responde a que:", "o": ["Los métodos del delito evolucionan con el tiempo", "Los países lo exigen cada cinco años", "Las Naciones Unidas lo imponen por tratado", "El sector privado financia las revisiones"], "a": 0, "e": "El estándar se actualiza con las tipologías nuevas."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}]}, {"titulo": "Normativa internacional · modelo 2", "q": [{"t": "mc", "q": "La Recomendación 15 aborda:", "o": ["Nuevas tecnologías y activos virtuales", "Controles internos de las instituciones", "Países de mayor riesgo", "Estadísticas nacionales"], "a": 0, "e": "Exige evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "Las medidas intensificadas deben aplicarse, entre otros casos, a:", "o": ["Relaciones con países de mayor riesgo", "Todos los clientes extranjeros sin excepción", "Clientes que paguen con tarjeta de crédito", "Operaciones realizadas en fin de semana"], "a": 0, "e": "El riesgo determina la intensidad."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades gr
