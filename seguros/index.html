l contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "mc", "q": "Un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su póliza", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "Los factores de riesgo que ordena considerar la norma del sector asegurador son:", "o": ["Clientes, productos, canales, zonas y tecnologías", "Primas, siniestros, reservas y comisiones", "Activos, pasivos, patrimonio, resultados y reservas", "Personal, oficinas, equipos y sistemas"], "a": 0, "e": "Cinco factores expresos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "mc", "q": "Dentro del factor producto, eleva el riesgo que la póliza:", "o": ["Permita rescate anticipado o acumule valor", "Cubra responsabilidad civil obligatoria", "Tenga una suma asegurada baja", "Se renueve automáticamente cada año"], "a": 0, "e": "Los productos con valor de rescate son más atractivos para lavar."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "vf", "q": "Lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven a la aseguradora para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las primas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "mc", "q": "El análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "mc", "q": "Que un tercero sin vínculo aparente pague la prima de un asegurado exige:", "o": ["Identificar al pagador y entender la relación", "Rechazar el pago sin más análisis", "Aceptarlo si el monto es moderado", "Trasladar la póliza a nombre del pagador"], "a": 0, "e": "El origen de los fondos forma parte del conocimiento."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "mc", "q": "Una política interna que limite el pago de primas en efectivo es:", "o": ["Una medida de mitigación razonable", "Una discriminación prohibida al cliente", "Una exigencia literal de la ley", "Una decisión exclusiva del supervisor"], "a": 0, "e": "Medida de control adoptada por riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "mc", "q": "Un asegurado con varias pólizas pequeñas en distintas compañías que suman una cifra elevada muestra:", "o": ["Un posible fraccionamiento entre entidades", "Una estrategia prudente de diversificación", "Un error del sistema de suscripción", "Una conducta irrelevante para el análisis"], "a": 0, "e": "El fraccionamiento también ocurre entre empresas."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "mc", "q": "El rescate anticipado de una póliza poco después de contratarla es señal de alerta porque:", "o": ["Sugiere que el objetivo era mover el dinero, no asegurarse", "Indica insatisfacción con el servicio", "Implica una pérdida económica para la aseguradora emisora", "Demuestra falta de capacidad de pago"], "a": 0, "e": "Patrón típico de colocación e integración."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "vf", "q": "Una aseguradora que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "El intercambio de información entre aseguradoras sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en la póliza"], "a": 0, "e": "Existen mecanismos de coordinació ién informa."}, {"t": "mc", "q": "Para el enfoque basado en riesgo, el uso de efectivo en el sector asegurador:", "o": ["Es un factor que eleva el riesgo y exige controles", "Está prohibido por la norma prudencial del sector", "Es irrelevante si hay recibo de pago", "Solo importa en pólizas de daños"], "a": 0, "e": "El efectivo dificulta la trazabilidad."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "mc", "q": "¿Por qué el seguro de prima única es considerado de mayor riesgo?", "o": ["Permite colocar una suma y rescatarla como lícita", "Es un seguro barato sin documentación exigida", "Se paga mensualmente sin verificar al cliente", "Es obligatorio para cierto tipo de clientes"], "a": 0, "e": "Colocación y recuperación rápidas."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima: porte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "El pago de primas en efectivo fraccionado en varios depósitos sugiere:", "o": ["Estructuración para evitar controles", "Comodidad del cliente con el banco", "Un error del área de cobranzas", "Una práctica comercial habitual"], "a": 0, "e": "Fraccionamiento o pitufeo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "mc", "q": "El cambio frecuente de beneficiarios en una póliza de vida es señal de alerta porque:", "o": ["Puede encubrir el traslado de valor a terceros", "Encarece la administración y el control de la póliza", "Dificulta el cálculo de la reserva", "Retrasa el pago de las comisiones"], "a": 0, "e": "El beneficiario es parte del análisis de riesgo."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "mc", "q": "Un siniestro reclamado poco después de contratar una póliza de alto valor exige:", "o": ["Análisis reforzado por posible fraude o lavado", "Pago inmediato para evitar reclamos", "Cancelación automática del contrato de seguro", "Traslado del caso al reasegurador"], "a": 0, "e": "El fraude también es un ilícito cubierto por el sistema."}]};
const GR=D.groups, ALL=D.all, PASS=0.8;
const app=document.getElementById('app');
let st=null, immediate=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){
  st=null;
  let h=`<h1>${esc(D.titulo)}</h1><p class="mut">${esc(D.sub)}</p>`;
  h+=`<div class="card menu"><h2 style="margin-top:0">Simulacro aleatorio</h2>
      <button class="p" onclick="start(-1)"><b>50 preguntas de todo el temario</b><br><span style="opacity:.85">Se arma distinto cada vez, con ${ALL.length} preguntas disponibles</span></button></div>`;
  GR.forEach((g,gi)=>{
    h+=`<h2>${esc(g.titulo)}</h2><div class="card menu">`;
    g.exams.forEach((e,ei)=>{
      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;
    });
    h+='</div>';
  });
  h+=`<label class="t"><input type="checkbox" id="imm" ${immediate?'checked':''} onchange="immediate=this.checked"> Corregir cada pregunta al contestarla. Desactívalo para simular el examen real y ver la nota solo al final.</label>
      <p class="mut">Verdadero o falso y selección simple. Se aprueba con 80 %, es decir 40 de 50. Al terminar verás la nota y la explicación de cada error.</p>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(gi,ei){
  let qs,titulo;
  if(gi===-1){qs=shuffle(ALL).slice(0,50);titulo='Simulacro aleatorio';}
  else{const e=GR[gi].exams[ei];qs=shuffle(e.q);titulo=e.titulo;}
  qs=qs.map(prep);
  st={titulo,qs,i:0,ans:qs.map(()=>null)};
  render();
}
function pick(k){
  const a=st.ans[st.i];
  if(a&&a.locked)return;
  st.ans[st.i]={sel:k,locked:immediate};
  render();
}
function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
