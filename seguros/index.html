. ¿Qué corresponde?", "o": ["Reclasificarlo y evaluar un ROS; no cabe DD simplificada", "Mantenerlo en bajo hasta la actualización anual de datos", "Cancelar la póliza y devolver la prima a una cuenta indicada", "Informarle que sus movimientos serán revisados por la UNIF"], "a": 0, "e": "Art. 36. La DD simplificada no es válida ante sospechas."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, de estos documentos, el que se computa en días hábiles es:", "o": ["Las declaraciones juradas de intermediarios", "El informe anual del auditor externo", "La autoevaluación de riesgo de la empresa", "Ninguno: todos se cuentan en días continuos"], "a": 0, "e": "Sesenta días hábiles frente a sesenta continuos: trampa de cómputo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plazo de diez días hábiles para coordinar la designación del nuevo oficial se cuenta desde:", "o": ["La ocurrencia de la falta absoluta", "La notificación a la superintendencia", "La siguiente reunión de la junta directiva", "El cierre del mes en que ocurrió"], "a": 0, "e": "Art. 9, num. 6. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo alto actualizó sus datos hace dieciocho meses. La situación:", "o": ["Incumple el máximo de un año", "Cumple el máximo de dos años", "Cumple el máximo de cinco años", "Solo incumple si hubo operaciones"], "a": 0, "e": "Para riesgo alto no puede exceder de un año."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante vacaciones o reposo del oficial de cumplimiento, la empresa debe asegurar la cobertura de sus funciones.", "a": true, "e": "Art. 9, numeral 5. La continuidad es obligatoria."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva firma el compromiso institucional en un acta colectiva única que se actualiza cada tres años.", "a": false, "e": "Arts. 8 y 34: se firma individualmente y se actualiza cada año. Trampa: se cambian la forma y la frecuencia."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿cuál es la función de los «responsables de cumplimiento» en las distintas áreas de la aseguradora?", "o": ["Extender la función de cumplimiento a cada área", "Sustituir al Oficial de Cumplimiento en sus ausencias", "Aprobar pólizas de clientes clasificados como riesgo alto", "Auditar el cumplimiento de la Unidad ante la Junta"], "a": 0, "e": "Arts. 16 y 17. Extienden la función de cumplimiento a las áreas."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento depende y reporta directamente al presidente de la empresa.", "a": false, "e": "Art. 10: depende y reporta a la junta directiva. Trampa: el presidente lo suple, pero no es su superior."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la inscripción del oficial de cumplimiento en el registro de la superintendencia debe renovarse cada:", "o": ["Tres años", "Un año", "Dos años", "Cinco años"], "a": 0, "e": "Art. 12. Con pago parcial de la tasa y actualización de recaudos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿ante quién responde el Oficial de Cumplimiento dentro de la estructura de gobierno de la aseguradora?", "o": ["Ante la Junta Directiva o el órgano equivalente", "Ante el presidente de la aseguradora, de forma exclusiva", "Ante el gerente de la unidad de operaciones comerciales", "Ante SUDEASEG, como funcionario delegado del supervisor"], "a": 0, "e": "Art. 10. Reporta a la Junta Directiva para preservar su independencia."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual aprobado por la junta se remite a la superintendencia dentro de:", "o": ["Treinta días continuos desde la inscripción", "Treinta días hábiles desde su aprobación", "Sesenta días continuos desde la inscripción", "Cuarenta y cinco días previos al cierre"], "a": 0, "e": "Art. 28. Trampa: se mezclan el plazo y el hecho que lo inicia."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un corredor puede llenar y firmar la declaración de origen de fondos si el cliente se lo autoriza verbalmente.", "a": false, "e": "Se prohíbe al intermediario llenar y suscribir la declaración."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los programas de formación que debe cursar el aspirante a oficial de cumplimiento son los que imparte la ONCDOFT.", "a": false, "e": "Art. 11, num. 3: los imparte la Superintendencia de la Actividad Aseguradora. Trampa: en turismo los imparte INATUR."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los reportes sistemáticos mensuales de pólizas y del registro de trabajadores se remiten dentro de:", "o": ["Diez días hábiles tras el fin de cada mes", "Diez días continuos tras el fin de cada mes", "Cinco días hábiles tras el fin de cada mes", "Quince días hábiles tras el fin de cada mes"], "a": 0, "e": "Arts. 76 y 77. Trampa: se cambia la unidad o el número."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un intermediario llena la planilla de un cliente analfabeto y firma por él la declaración de origen de fondos «para ayudar». ¿Qué problema hay?", "o": ["El intermediario tiene prohibido suscribirla", "Es válido con autorización escrita del cliente", "Procede si el cliente no sabe escribir", "Basta que el supervisor comercial lo revise"], "a": 0, "e": "Art. 50. La declaración debe ser personal y real."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial de cumplimiento renuncia de forma intempestiva. La secuencia correcta es:", "o": ["Asume el presidente, aviso en 5 hábiles y nuevo en 10", "Asume el auditor, aviso en 10 hábiles y nuevo en 5", "Asume la unidad, aviso en 5 hábiles y nuevo en 30", "Asume la junta, aviso en 10 continuos y nuevo en 60"], "a": 0, "e": "Falta absoluta: el presidente asume; notificación en cinco días hábiles; designación en diez días hábiles, prorrogable una sola vez."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual lo elabora, diseña y ejecuta:", "o": ["El oficial de cumplimiento", "La junta directiva", "La unidad de auditoría interna", "El presidente de la empresa"], "a": 0, "e": "Art. 29. Trampa: la junta aprueba su informe de ejecución, pero no elabora el plan."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un reasegurador extranjero propone contratar con una aseguradora venezolana. ¿Qué debe revisar la aseguradora para conocerlo?", "o": ["Estados auditados, impuestos y estructura de control", "Solo su nombre y su calificación de riesgo publicada", "Solo el tratado de reaseguro firmado con la cedente", "Únicamente su inscripción ante un regulador extranjero"], "a": 0, "e": "Art. 61. El reaseguro también es un canal de riesgo."}, {"t": "mc", "q": "¿Qué consecuencia puede tener que SUDEASEG considere que el informe del auditor externo no cumple los extremos de la norma?", "o": ["Puede exigir una nueva auditoría y acciones correctivas", "Nada, porque el informe es vinculante para SUDEASEG", "La empresa debe ser liquidada de inmediato por el órgano", "El informe se considera aprobado por silencio administrativo"], "a": 0, "e": "El supervisor puede verificar la exactitud del informe."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando no es posible obtener la huella dactilar, la empresa queda dispensada de cualquier control biométrico.", "a": false, "e": "Art. 45: debe usar otros controles biométricos alternos. Trampa: se convierte la dificultad en dispensa."}, {"t": "mc", "q": "Una aseguradora clasifica a sus clientes en solo dos categorías: riesgo alto y riesgo bajo. ¿Qué observación hace SUDEASEG según su Norma 2024?", "o": ["Los niveles obligatorios son tres: bajo, moderado y alto", "Está bien: la norma permite solo alto y bajo", "Debe tener cinco niveles, con uno crítico y otro muy bajo", "Puede definir sus propios niveles según su política interna"], "a": 0, "e": "La norma fija tres niveles de riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las decisiones del oficial de cumplimiento obligan a todos los empleados desde que él las adopta, sin aprobación posterior.", "a": false, "e": "Art. 10: obligan previa aprobación de la junta directiva. Trampa: se suprime la condición."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la verificación de datos debe incluir los listados publicados y mantenidos por:", "o": ["El Consejo de Seguridad de las Naciones Unidas", "La Unidad Nacional de Inteligencia Financiera", "El Grupo de Acción Financiera del Caribe", "La Oficina Nacional contra la Delincuencia"], "a": 0, "e": "Art. 40, conforme a las recomendaciones del GAFI. Trampa: el GAFI recomienda, pero las listas son del Consejo de Seguridad."}, {"t": "mc", "q": "Según la Guía del GAFI para un enfoque basado en riesgo en el sector de seguros de vida (2018), una persona jurídica nueva, sin historial ni actividad comprobable, solicita contratar un seguro de alta suma con pago en efectivo. ¿Qué alerta presenta?", "o": ["Posible empresa fachada con fondos sin explicar", "Cliente normal que inicia su actividad económica", "Riesgo bajo por tratarse de una persona jurídica", "Operación habitual en el sector asegurador"], "a": 0, "e": "Empresas sin sustancia económica son señal típica."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presupuesto específico que aprueba la junta cubre la materia de riesgos y también el buen gobierno corporativo.", "a": true, "e": "Art. 8, num. 2. Trampa: se cree que solo cubre la prevención."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la información que pidan el Ministerio Público u otros organismos competentes se remite:", "o": ["En el plazo prudencial que indique el supervisor", "Solo con orden judicial expresa", "Dentro de las veinticuatro horas siguientes, en todo caso", "Previa autorización escrita del cliente"], "a": 0, "e": "Art. 84. Deber de colaboración."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe de ejecución del Plan Operativo Anual debe indicar, de cada aspecto de su contenido:", "o": ["El porcentaje de cumplimiento, con soportes", "El costo ejecutado de cada actividad, con facturas", "El responsable de cada actividad y su firma", "La opinión escrita del auditor externo"], "a": 0, "e": "Art. 30. Trampa: los otros datos suenan a control, pero la norma pide porcentaje y soportes de medición."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora designa como Oficial de Cumplimiento al gerente de ventas «mientras consigue otro». ¿Qué problema de fondo presenta?", "o": ["Un conflicto de interés con un cargo de dedicación exclusiva", "Ninguno, si tiene experiencia comercial suficiente en el ramo", "Solo la falta de su inscripción en el registro de oficiales", "Ninguno, si la junta lo designa de forma transitoria"], "a": 0, "e": "Art. 10. El Oficial de Cumplimiento debe tener autonomía funcional y dedicación exclusiva."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un manual aprobado hace cinco años y nunca revisado, pese a cambios de productos y canales, incumple el espíritu de la norma.", "a": true, "e": "Art. 28. El sistema debe actualizarse cuando cambia el perfil de riesgo."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la condición de PEP alcanza a los familiares hasta el cuarto grado de consanguinidad y el segundo de afinidad.", "a": true, "e": "Art. 51. Trampa: es frecuente invertir los grados."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente de riesgo bajo, sin señales de alerta, puede recibir debida diligencia:", "o": ["Simplificada", "Intensificada", "Mejorada", "Ninguna medida"], "a": 0, "e": "Art. 36. Simplificada no significa ausencia de medidas."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva puede negar al oficial la remisión de un reporte cuando lo considere infundado.", "a": false, "e": "Art. 83: no puede negarla. Trampa: se añade una excepción."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el tratamiento de una PEP en un seguro de vida exige, además de la diligencia intensificada:", "o": ["Aprobación de la junta para la relación y el pago", "Autorización escrita del propio cliente PEP", "Notificación previa a la superintendencia", "Constitución de una garantía adicional"], "a": 0, "e": "Art. 51. El nivel más alto de la organización decide."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, durante las vacaciones del Oficial de Cumplimiento, sus funciones deben quedar cubiertas, no suspendidas.", "a": true, "e": "Art. 9, numeral 5. La función es continua."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la debida diligencia simplificada se admite para un cliente de riesgo bajo aunque exista sospecha de LC/FT, si el monto es reducido.", "a": false, "e": "Art. 36: no se permite la simplificada si existen sospechas. Trampa: se agrega una excepción por monto que la norma no tiene."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el expediente de un reasegurador debe incluir estados financieros auditados de, por lo menos:", "o": ["Los tres últimos años", "Los dos últimos años", "Los cinco últimos años", "El último ejercicio cerrado"], "a": 0, "e": "Art. 61, num. 4. Trampa: se cambia el número de años."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, aprobar la designación de los miembros de la unidad de administración de riesgos y de los responsables de cumplimiento corresponde a:", "o": ["La junta directiva", "El oficial de cumplimiento", "El presidente", "La superintendencia"], "a": 0, "e": "Art. 8, numeral 9. Trampa: el oficial los propone (art. 13, num. 12), pero no los aprueba."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los requerimientos del Ministerio Público se atienden en un plazo fijo de cinco días hábiles.", "a": false, "e": "Art. 84: en el plazo prudencial que indique la superintendencia. Trampa: cinco días hábiles es el plazo para notificar la ausencia del oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la renovación del registro del oficial de cumplimiento exige pagar la fracción de la tasa y:", "o": ["Actualizar la documentación", "Aprobar un nuevo examen", "Presentar aval de la junta", "Cursar otro programa académico"], "a": 0, "e": "Art. 12. Trampa: la norma no pide examen ni aval."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente y el oficial de cumplimiento se ubican en el mismo nivel jerárquico, cada uno en el ámbito de sus competencias.", "a": true, "e": "Art. 7. Trampa: se espera que el oficial esté por debajo del presidente."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en una póliza de vida, el beneficiario final debe identificarse:", "o": ["Antes del pago de prestaciones o capitales", "Dentro de los treinta días siguientes al pago", "Solo al momento de emitir la póliza", "Cuando lo requiera la superintendencia"], "a": 0, "e": "Art. 51. Trampa: no basta la identificación inicial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la notificación de la ausencia del oficial de cumplimiento a la superintendencia corresponde a la junta directiva.", "a": false, "e": "Art. 9, num. 4: corresponde al presidente, dentro de cinco días hábiles. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una firma auditó en lo externo dos ejercicios seguidos y la empresa quiere contratarla para el tercero. Lo correcto es que:", "o": ["No puede, por superar el límite consecutivo", "Puede, si la junta aprueba la renovación", "Puede, si cambia al socio que firma", "No puede volver a contratarla jamás"], "a": 0, "e": "No más de dos ejercicios fiscales consecutivos."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el reporte mensual de proveedores debe incluir también a los proveedores de servicios públicos.", "a": false, "e": "Art. 77, num. 3: quedan excluidos. Trampa: se incluye lo que la norma excluye."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe del auditor externo se remite dentro de los sesenta días continuos siguientes al cierre, con el acta de aprobación de la junta.", "a": true, "e": "Art. 72. Trampa: se suele pensar en días hábiles."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las sociedades de corretaje de reaseguros están obligadas a conformar la unidad de administración de riesgos.", "a": false, "e": "Art. 7, num. 3: no están obligadas, pero deben proporcionar la información requerida. Trampa: se confunde con el deber de informar."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las variables de segmentación de riesgo que enumera la norma son taxativas, de modo que la empresa no puede añadir otras.", "a": false, "e": "Art. 23: son enunciativas y no taxativas. Trampa: se invierte el carácter de la lista."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿por qué en seguros de vida y productos de inversión el beneficiario es relevante para la debida diligencia?", "o": ["Quien cobra puede ser distinto del tomador", "Suele ser un familiar cercano del tomador", "Solo se verifica al contratar la póliza", "No recibe fondos directamente del asegurador"], "a": 0, "e": "Art. 51. Se identifica y verifica al beneficiario a más tardar al pagar."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, es familiar comprendido en el concepto de PEP del sector:", "o": ["Un primo hermano de la persona expuesta", "El cónyuge del primo de la persona expuesta", "Un concuñado de la persona expuesta", "Un sobrino político en cuarto grado"], "a": 0, "e": "Hasta cuarto grado de consanguinidad y segundo de afinidad."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un cliente clasificado en riesgo moderado debe recibir debida diligencia:", "o": ["Mejorada", "Simplificada", "Intensificada", "Estándar"], "a": 0, "e": "Trampa: en criptoactivos el riesgo bajo es estándar; en cajas el moderado es controlada."}]}, {"titulo": "Normativa prudencial del sector y sus guías · modelo 3", "q": [{"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si la superintendencia considera que el informe del auditor externo no cumple la norma, puede exigir una nueva auditoría.", "a": true, "e": "Art. 74. Trampa: en criptoactivos se puede exigir el cambio de auditor."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el plazo para remitir el manual a la superintendencia se empieza a contar desde:", "o": ["La inscripción como sujeto obligado", "La aprobación de la junta directiva", "El cierre del ejercicio económico", "La designación del oficial"], "a": 0, "e": "El plazo corre desde la inscripción."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma coloca al oficial de cumplimiento en un nivel jerárquico equiparable al del presidente para:", "o": ["Que pueda objetar decisiones sin presión interna", "Que pueda firmar pólizas en su ausencia", "Igualar su remuneración con la del resto de la gerencia", "Permitirle representar a la empresa"], "a": 0, "e": "Art. 7. Independencia funcional real."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la norma del sector asegurador entró en vigencia con su publicación en la Gaceta Oficial, sin período de vacancia.", "a": true, "e": "Art. 91. Vigencia inmediata desde la publicación."}, {"t": "mc", "q": "¿Qué significa el principio de «autorregulación» en la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["El sujeto obligado diseña, aplica y demuestra sus controles", "El sujeto obligado queda exento de la supervisión de SUDEASEG", "SUDEASEG diseña los controles que cada empresa debe aplicar", "El sujeto obligado decide libremente si cumple la norma"], "a": 0, "e": "El sujeto obligado debe demostrar el cumplimiento."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si no puede verificar un dato aportado por el cliente, la empresa debe enviar de inmediato un reporte a la UNIF, sin análisis previo.", "a": false, "e": "Art. 44: el oficial analiza el caso y notifica a la UNIF si lo considera procedente. Trampa: se elimina el análisis."}, {"t": "mc", "q": "Una aseguradora incumple la Providencia SAA-01-0536-2024 de SUDEASEG en materia de prevención. ¿Qué marco de sanciones puede aplicarse?", "o": ["El de la Ley de la Actividad Aseguradora y el de la LOCDOFT", "El previsto únicamente en la Ley de la Actividad Aseguradora", "El previsto únicamente en la LOCDOFT para el órgano rector", "El del Código de Comercio para las sociedades mercantiles"], "a": 0, "e": "La norma remite expresamente a ambos regímenes."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, revisar y aprobar el Informe Anual del auditor externo corresponde a:", "o": ["La junta directiva", "El presidente", "El oficial de cumplimiento", "La auditoría interna"], "a": 0, "e": "Art. 8, numeral 8. Trampa: el presidente lo conoce (art. 9, num. 10), pero no lo aprueba."}, {"t": "mc", "q": "La reforma de la Ley de la Actividad Aseguradora de 2023 entró en vigencia:", "o": ["A los ciento veinte días continuos de su publicación", "El mismo día de su publicación", "A los treinta días continuos de su publicación oficial", "Al inicio del ejercicio siguiente"], "a": 0, "e": "Vacancia expresa de la ley."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un exministro dejó su cargo hace cuatro años y solicita una póliza. Respecto de su condición:", "o": ["Sigue siendo PEP hasta cumplir cinco años", "Perdió la condición al cesar en el cargo", "Sigue siendo PEP de por vida sin excepción", "Solo es PEP si mantiene un cargo partidista"], "a": 0, "e": "La condición se mantiene cinco años tras el cese."}, {"t": "mc", "q": "Un presidente de una aseguradora dice que «el Oficial de Cumplimiento puede reportar a la UNIF solo si yo lo autorizo». ¿Cuál es la respuesta correcta?", "o": ["No puede impedirlo: no se puede negar la remisión de un ROS", "Tiene razón: el presidente debe autorizar todo reporte", "El Oficial debe pedir permiso previo a SUDEASEG para reportar", "El Oficial debe consultar antes el reporte con el cliente"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, en los documentos de vinculación inicial se obtendrá, siempre que sea posible, la huella del dedo:", "o": ["Pulgar o índice de la mano derecha", "Pulgar o índice de la mano izquierda", "Pulgar de ambas manos del cliente", "Índice o medio de la mano derecha"], "a": 0, "e": "Art. 45: la mano izquierda solo de ser el caso. Trampa: se cambia la mano o el dedo."}, {"t": "vf", "q": "Citar el Decreto-Ley de 2015 como texto vigente sin considerar la reforma de 2023 es un error de actualización normativa.", "a": true, "e": "La reforma de 2023 modificó el régimen vigente."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ¿qué relación hay entre la autoevaluación de riesgo, el manual y el plan operativo?", "o": ["Riesgos identificados, procedimientos y plan de actividades", "Son documentos independientes sin ninguna relación entre sí", "El plan operativo sustituye a la autoevaluación anual", "El manual sustituye al plan operativo de cada ejercicio"], "a": 0, "e": "Arts. 20, 28 y 29. Coherencia del sistema."}, {"t": "mc", "q": "Un cliente PEP solicita un seguro de vida con beneficiarios en el exterior. ¿Qué exige la lógica de la Providencia SAA-01-0536-2024 de SUDEASEG?", "o": ["DD intensificada, beneficiario final y aprobación de Junta", "Aceptación con DD simplificada por ser un seguro de vida", "Rechazo automático por tratarse de un cliente PEP", "Aviso previo a los beneficiarios sobre la condición PEP"], "a": 0, "e": "Seguros de vida con PEP exigen aprobación del nivel más alto."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una aseguradora contrata una empresa externa para que «haga toda la debida diligencia de sus clientes». ¿Qué restricción impone la norma?", "o": ["No tercerizar verificación, beneficiario final ni análisis", "Puede tercerizar todo si el proveedor es de prestigio", "Solo puede tercerizar la identificación del cliente", "La tercerización de la debida diligencia es obligatoria"], "a": 0, "e": "Art. 40. La responsabilidad indelegable es de la aseguradora."}, {"t": "mc", "q": "Una sociedad de corretaje de seguros pregunta si está obligada por la Providencia SAA-01-0536-2024 de SUDEASEG. ¿Qué respuesta es correcta?", "o": ["Sí, con estructura proporcional a su riesgo", "No, porque la norma solo obliga a las empresas de seguros", "No, porque las sociedades de corretaje las supervisa la UNIF", "Sí, pero solo respecto de los siniestros que intermedie"], "a": 0, "e": "Proporcionalidad: obligación sí, estructura según riesgo y tamaño."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe asistir a las actividades de capacitación convocadas por el oficial de cumplimiento.", "a": true, "e": "Art. 9, num. 11. Trampa: se cree que la capacitación es solo para el personal."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el rechazo de un empleado a ascensos o traslados es una conducta que los supervisores deben vigilar.", "a": true, "e": "Art. 66. Trampa: parece una conducta positiva, pero la norma la lista como señal."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una Junta Directiva puede designar al Oficial de Cumplimiento y supervisar su desempeño, pero no puede negarle la remisión de un reporte de actividades sospechosas.", "a": true, "e": "Arts. 8 y 83. Se distingue entre designación/supervisión y la autonomía en el reporte."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un extranjero no residente que contrata una póliza se identifica con:", "o": ["El pasaporte vigente", "La cédula de extranjero vigente", "La cédula de su país de origen", "El RIF y una referencia bancaria"], "a": 0, "e": "Art. 47. Trampa: la cédula laminada es para venezolanos y extranjeros residentes."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los documentos de una persona jurídica no domiciliada deben estar legalizados o apostillados, pero basta una traducción simple al castellano.", "a": false, "e": "Art. 47: traducción por intérprete público. Trampa: la primera mitad es correcta."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, proponer a la junta directiva la designación de los miembros de la unidad y de los responsables de cumplimiento corresponde a:", "o": ["El oficial de cumplimiento", "El presidente", "La auditoría interna", "El área de talento humano"], "a": 0, "e": "Art. 13, numeral 12. Trampa: el presidente propone al oficial (art. 9, num. 7), no a la unidad."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un proveedor externo ofrece verificar identidades, hallar beneficiarios finales y analizar alertas. La empresa puede:", "o": ["Debe realizarlas ella misma, pues no son tercerizables", "Puede tercerizarlas si el proveedor responde por ellas", "Requiere solo la aprobación previa de la junta directiva", "Basta con notificar el contrato a la superintendencia"], "a": 0, "e": "Funciones medulares no tercerizables; la responsabilidad no se delega."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el oficial cita el plazo de conservación de la LOCDOFT para justificar guardar registros digitales solo cinco años. Su error es que:", "o": ["La norma del sector exige diez en digital", "La LOCDOFT exige diez años en digital", "La norma del sector exige tres en digital", "La LOCDOFT no fija plazo de conservación"], "a": 0, "e": "La norma sectorial es más exigente que el mínimo legal."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el informe con los hallazgos del Programa Anual de Evaluación y Control se presenta a la junta directiva con copia a:", "o": ["El oficial de cumplimiento y el presidente", "La superintendencia y la UNIF, por separado", "El auditor externo y la unidad de riesgos", "Los responsables de cumplimiento de cada área"], "a": 0, "e": "Art. 71. Trampa: es un informe interno que la superintendencia verifica en la inspección."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la autoevaluación de riesgo se remite dentro de los sesenta días continuos siguientes al cierre, certificada por el auditor interno.", "a": true, "e": "Art. 20. Trampa: suena a que debe certificarla el auditor externo, que interviene en el informe anual."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el personal mínimo de la unidad de administración de riesgos debe estar a dedicación exclusiva.", "a": true, "e": "Art. 14. Trampa: se cree que la dedicación exclusiva solo se exige al oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el presidente debe asegurar que las unidades de mercadeo y negocios consulten al oficial antes de lanzar un nuevo producto.", "a": true, "e": "Art. 9, numeral 8. Trampa: se cree que esa obligación es solo del oficial."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, un empleado nunca toma vacaciones, recibe regalos frecuentes de clientes y vive por encima de su sueldo. ¿Qué debe hacer el supervisor?", "o": ["Reportar al Oficial por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Conversar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Art. 66. Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, proponer a la junta directiva la designación del oficial de cumplimiento corresponde a:", "o": ["El presidente o quien haga sus veces", "La unidad de administración de riesgos", "El auditor interno de la empresa", "La asamblea de accionistas"], "a": 0, "e": "Art. 9, num. 7. Trampa: la junta designa, pero la propuesta es del presidente."}, {"t": "mc", "q": "SUDEASEG ejerce amplias facultades de supervisión sobre los sujetos obligados mediante su Oficina de Administración de Riesgos de LC/FT/FPADM. ¿Cuál es un efecto práctico?", "o": ["Ordenar ajustes si los mecanismos son insuficientes", "Observar y dejar constancia de la situación en un acta", "Cobrar tasas de supervisión al sujeto obligado", "Recomendar mejoras sin ningún carácter obligatorio"], "a": 0, "e": "Poder correctivo del supervisor."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, ante la falta absoluta del oficial, quien asume sus funciones de forma inmediata es:", "o": ["El presidente o quien haga sus veces", "El auditor interno de la empresa", "Un funcionario designado por el supervisor", "El responsable de cumplimiento más antiguo"], "a": 0, "e": "Art. 9, numeral 6. La función no puede quedar acéfala."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Informe Anual del auditor externo se remite junto con:", "o": ["La certificación del acta de aprobación de la junta", "El dictamen del auditor interno de la empresa", "La opinión escrita del oficial de cumplimiento", "El Plan Operativo Anual del ejercicio siguiente"], "a": 0, "e": "Art. 72. Trampa: el auditor interno certifica la autoevaluación, no este informe."}, {"t": "vf", "q": "La Providencia SAA-01-0530-2024 y la SAA-01-0536-2024 regulan lo mismo: la administración de riesgos de LC/FT/FPADM.", "a": false, "e": "La 0530-2024 trata del Buen Gobierno Corporativo; la 0536-2024 es la norma de riesgos de LC/FT/FPADM."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, las sociedades de corretaje, las financiadoras de primas y la medicina prepagada, respecto de la unidad:", "o": ["No están obligadas a conformarla, pero sí a informar", "Deben conformarla siempre sin excepción", "Están exentas de todo el sistema", "Deben compartir la unidad con una empresa de seguros"], "a": 0, "e": "Art. 7. Proporcionalidad según el tipo de sujeto."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el envío del reporte de actividades sospechosas no acarrea responsabilidad civil ni penal, pero sí puede acarrear responsabilidad administrativa al oficial.", "a": false, "e": "Art. 83: tampoco acarrea responsabilidad administrativa. Trampa: media frase verdadera."}, {"t": "mc", "q": "La Ley de la Actividad Aseguradora ha tenido distintas versiones. ¿Cuál es la lógica correcta de su evolución?", "o": ["Ley 2010, Decreto-Ley 2015 y Reforma 2023, vigente la última", "Ley 2010 y Decreto-Ley 2015, vigente el decreto-ley de 2015", "Decreto-Ley 2015 derogó la Reforma de 2023 por ser especial", "Reforma 2023 derogó solo la Ley de 2010 y mantiene la de 2015"], "a": 0, "e": "Cuidado con citar versiones anteriores como vigentes."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el manual de políticas se remite a la superintendencia solo para su conocimiento.", "a": false, "e": "Art. 28: para su revisión, autorización e implementación. Trampa: se rebaja el trámite."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, cuando no se puede verificar un dato, la notificación a la UNIF debe indicar los datos verdaderos del cliente, si se obtuvieron.", "a": true, "e": "Art. 44. Trampa: se cree que basta señalar el dato dudoso."}, {"t": "mc", "q": "Un compañero cita la Resolución 083.18 para fundamentar una obligación de una aseguradora. El error es que esa resolución:", "o": ["Es del sector bancario, no del asegurador", "Está derogada desde el año 2021", "Es una guía sin carácter obligatorio", "Corresponde al mercado de valores"], "a": 0, "e": "Cada sector tiene su norma; citar la ajena es un error frecuente."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la frecuencia de actualización de los datos se fija según el nivel de riesgo y debe dejarse constancia en el expediente.", "a": true, "e": "Art. 39: para riesgo alto no puede ser mayor a un año. Trampa: se cree que es anual para todos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Programa Anual de Seguimiento, Evaluación y Control lo elaboran y ejecutan:", "o": ["Los responsables de cumplimiento", "La auditoría interna o quien haga sus veces", "El auditor externo inscrito en el registro", "La junta directiva o el órgano equivalente"], "a": 0, "e": "Art. 17, numeral 3. Trampa: la auditoría interna ejecuta otro instrumento, el Programa Anual de Evaluación y Control (art. 71)."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la junta directiva asume la corresponsabilidad del cumplimiento de las normas de prevención.", "a": true, "e": "Art. 8, numeral 12. Trampa: se cree que la responsabilidad recae solo en el oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, los responsables de cumplimiento dejan sus funciones habituales para dedicarse solo a la prevención.", "a": false, "e": "Art. 16: cumplen esas funciones adicionalmente a las propias. Trampa: se confunde con la dedicación exclusiva del oficial."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la prohibición de tercerizar la verificación de datos y la identificación del beneficiario final no admite excepción alguna.", "a": false, "e": "Art. 40: salvo disposición en contrario. Trampa: un absoluto que el texto no tiene."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, la suficiencia de la estructura del sistema de una empresa de seguros puede ser determinada por la superintendencia:", "o": ["Al practicar los procedimientos de inspección", "Al autorizar el manual de políticas", "Al recibir la autoevaluación anual", "Al inscribir al oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2. Trampa: los otros momentos existen, pero no son los que fija el numeral."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, el Plan Operativo Anual y su Informe de Ejecución se remiten, respectivamente:", "o": ["45 días antes del cierre y 30 días después", "30 días antes del cierre y 45 días después", "45 días después del cierre y 30 días antes", "60 días antes del cierre y 60 días después"], "a": 0, "e": "Arts. 29 y 30. Trampa: se cruzan los plazos de los dos instrumentos."}, {"t": "mc", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, una empresa de seguros pequeña pregunta si debe conformar una Unidad de Administración de Riesgos. ¿Qué respuesta interpreta correctamente la norma?", "o": ["Depende de su autoevaluación; SUDEASEG puede ordenarla", "Siempre debe conformarla, sin excepciones por tamaño", "Nunca debe conformarla si tiene menos de cien empleados", "Solo la conforma si SUDEASEG la inspecciona por primera vez"], "a": 0, "e": "Art. 7. Criterio basado en riesgo, con control del supervisor."}, {"t": "vf", "q": "Según la Providencia SAA-01-0536-2024 de SUDEASEG, si la Junta Directiva no está de acuerdo con la remisión de un ROS, puede impedirla.", "a": false, "e": "Art. 83. No puede negar la remisión."}]}]}, {"titulo": "Convenios internacionales: Viena, Palermo, Mérida y otros", "exams": [{"titulo": "Convenios internacionales · modelo 1", "q": [{"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "El Convenio de Financiación del Terrorismo", "La Convención de Viena de 1988", "La Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, de quien ofrece y de quien acepta", "Activa, de quien ofrece el beneficio indebido", "Pasiva, de quien recibe el beneficio indebido", "Extranjera, cuando interviene otro Estado"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "Según la Convención de Palermo, la «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Art. 18, párrafo 9. Requisito clásico de la asistencia y la extradición."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas coordinadas y eficaces contra la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal especial contra la corrupción", "Prohibir las donaciones a partidos políticos"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "Según la Convención de Palermo, la función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Art. 18, párrafo 13. Punto de contacto formal de cada Estado."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando de bienes", "Extradición, asilo, refugio y asistencia judicial recíproca", "Soberanía, jurisdicción, territorio y competencia penal"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}]}, {"titulo": "Convenios internacionales · modelo 2", "q": [{"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "vf", "q": "Según la Convención de Palermo, la asistencia judicial recíproca no puede negarse invocando el secreto bancario.", "a": true, "e": "Art. 18, párrafo 8. Trampa: se cree que el secreto bancario es una causal de denegación."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional y el enriquecimiento ilícito se tipifican con sujeción a la Constitución de cada Estado.", "a": true, "e": "Arts. VIII y IX. Trampa: se cree que son deberes sin reserva."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mérida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), una solicitud de asistencia judicial puede negarse por tratarse de un delito fiscal.", "a": false, "e": "Art. 13. Trampa: el art. 14 dice lo mismo respecto del delito político."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción", "Las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "mc", "q": "Según los datos del Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes para todos los Estados por igual", "Ambos son recomendaciones sin ningún efecto jurídico práctico", "El GAFI aprueba los tratados que firman sus miembros"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito cometido en un solo Estado es transnacional si en otro Estado se realiza una parte sustancial de su:", "o": ["Preparación, planificación, dirección o control", "Financiación, ejecución o encubrimiento", "Investigación, juzgamiento o condena", "Beneficio, reparto o reinversión posterior"], "a": 0, "e": "Art. 3, párrafo 2, literal b. Trampa: las otras listas suenan igual de técnicas."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto terrorista se consume", "Basta que los fondos sean de origen ilícito", "Es necesario que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Penalización, extradición y asistencia técnica únicamente", "Prevención en el sector público y sanciones administrativas", "Cooperación entre unidades de inteligencia y extradición"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Una aseguradora recibe una póliza de alto valor de la esposa de un alto funcionario público. ¿Qué instrumento internacional aporta el marco sobre PEP?", "o": ["Mérida, junto con las Recomendaciones del GAFI", "Viena, por tratarse de seguros de vida", "El Convenio de Financiación del Terrorismo", "Palermo, por ser un delito organizado"], "a": 0, "e": "Mérida (art. 52) exige examen más estricto de cuentas de PEP; el GAFI lo desarrolla en la R.12."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutarlo conforme al derecho interno del Estado requerido", "Aplicar directamente la ley del Estado que lo solicita", "Someter el caso a la Corte Internacional de Justicia", "Obtener antes el consentimiento expreso del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación entre los organismos nacionales de investigación y el sector privado se regula en su artículo:", "o": ["39", "38", "12", "14"], "a": 0, "e": "El 38 trata la cooperación entre organismos nacionales; el 12, el sector privado en la prevención; el 14, las medidas contra el blanqueo."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "Según la Convención de Palermo, si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "Art. 18, párrafo 9. La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "Según los Protocolos de la Convención de Palermo sobre trata de personas y tráfico ilícito de migrantes, el protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "El migrante no consiente y la finalidad es el cruce de frontera", "La trata exige cruzar una frontera y el tráfico de migrantes no", "El tráfico de migrantes protege a la persona y la trata al Estado"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}]}, {"titulo": "Convenios internacionales · modelo 3", "q": [{"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), la tentativa de proveer o recolectar fondos:", "o": ["También constituye delito", "Solo es punible si hubo atentado", "Queda a criterio de cada Estado", "No está prevista en el texto"], "a": 0, "e": "Art. 2, párrafo 4. Trampa: se confunde con que los fondos no necesitan usarse."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "Según la Convención de Palermo, una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito investigado es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado se encuentra prófugo de la justicia"], "a": 0, "e": "Art. 18, párrafo 21. Causales previstas en los tratados."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado sin autorización", "Opinar públicamente sobre una licitación que está en curso", "Reunirse con representantes de empresas privadas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el Estado requerido no puede negar la asistencia amparándose en:", "o": ["El secreto bancario", "La doble incriminación", "Su propio orden público", "La cosa juzgada"], "a": 0, "e": "Art. XVI. Trampa: las otras causales no están excluidas por ese artículo."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "Según la Convención de Palermo, la disposición del producto decomisado se rige, en primer término, por:", "o": ["El derecho interno del Estado que decomisa", "El acuerdo de reparto por mitades entre Estados", "La decisión del Estado que pidió el decomiso", "Las reglas del fondo de las Naciones Unidas"], "a": 0, "e": "Art. 14, párrafo 1. Trampa: la devolución al requirente es una consideración prioritaria, no la regla base."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "Según la Convención de Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Su escrutinio intensificado por la institución", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "Según la Convención de Palermo, la obstrucción de la justicia se penaliza en su artículo:", "o": ["23", "8", "24", "25"], "a": 0, "e": "El 24 protege a los testigos y el 25 a las víctimas. Trampa: artículos vecinos de materia cercana."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "La participación de la sociedad en
