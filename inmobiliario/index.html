bles, pero la evaluación es previa."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "vf", "q": "Según el GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "La información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "vf", "q": "Según el GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la tarifa y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Responde por todo incumplimiento ocurrido durante su gestión", "Responde en lo administrativo, pero no en lo penal ni civil", "Responde la junta directiva, pues el oficial solo recomienda"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "vf", "q": "Las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "vf", "q": "Según el GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Según el GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "vf", "q": "Según el GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Según el GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "mc", "q": "Si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "Según el GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Tanto al comprador como al vendedor", "Solo al comprador, que aporta los fondos", "Solo al vendedor, que recibe los fondos", "Solo a quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "mc", "q": "Según el GAFI, en casinos, la debida diligencia se activa desde transacciones financieras de:", "o": ["USD/EUR 3.000", "USD/EUR 1.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "mc", "q": "Según el GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Según el GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "Según el GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información de una autoridad extranjera por vía no oficial. ¿Qué debe hacer?", "o": ["Canalizarla por mecanismos oficiales", "Responder directamente para colaborar", "Ignorarla por provenir del extranjero", "Informar al cliente de la solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según el GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "El autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "vf", "q": "Según el GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Según el GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "vf", "q": "Que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "vf", "q": "Según el GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "Una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Según el GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "vf", "q": "Según el GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "vf", "q": "Según el GAFI, la unidad de inteligencia financiera debe poder pedir información adicional a los sujetos obligados.", "a": true, "e": "R.29. Trampa: se cree que solo recibe lo que se le envía."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["Cumplimiento técnico y efectividad del sistema", "Solo si el país tiene leyes contra el lavado vigentes", "Solo el número de condenas dictadas por lavado", "Solo el tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "vf", "q": "Según el GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según el GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Un supervisor encuentra que un sujeto obligado ha reportado cero ROS en cinco años pese a un volumen alto de operaciones. ¿Qué lectura es razonable?", "o": ["Posibles fallas de detección o de reporte", "Cartera limpia sin riesgo de lavado", "Mérito que reconoce el supervisor en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "vf", "q": "Según el GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "mc", "q": "Según el GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "vf", "q": "El financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "¿Qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "mc", "q": "Según el GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "vf", "q": "Según el GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según el GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "vf", "q": "Según el GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "mc", "q": "¿Por qué una inmobiliaria es relevante en el riesgo de lavado?", "o": ["Permite colocar e integrar grandes sumas como lícitas", "Porque sus operaciones quedan fuera de todo registro público", "Porque sus clientes suelen ser personas no residentes", "Porque el valor de los inmuebles lo fija la autoridad"], "a": 0, "e": "Sector clásico de integración."}, {"t": "mc", "q": "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según el GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Según el GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "Según el GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "mc", "q": "Según el GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "Según el GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "vf", "q": "Según el GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Según el GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "vf", "q": "Según el GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "mc", "q": "La evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "vf", "q": "Según el GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según el GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "El «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de servicios"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "Un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Son nuevas y aún no están reguladas por ley", "Son costosas para las instituciones financieras", "Son ilegales en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "En una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según el GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "mc", "q": "Las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "Según el GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "vf", "q": "Según el GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Según el GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según el GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Según el GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según el GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según el GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según el GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "vf", "q": "Según el GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según el GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el 55 % de los sectores de APNFD carece de guías para sus matrices de riesgo.", "a": false, "e": "Informe del GAFILAT de 2023: el 55 % cuenta con alguna directriz o guía. Trampa: se invierte el dato."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, una sociedad tiene un socio con 20 % y otro, con 10 %, que dirige de hecho todas las decisiones. Es beneficiario final:", "o": ["Quien ejerce el control efectivo", "Quien tiene el mayor porcentaje", "Ninguno, por no llegar al 25 %", "Ambos, por ser socios de ella"], "a": 0, "e": "25 % del capital o control efectivo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, según las amenazas regionales, el sector inmobiliario ocupa, entre los más vulnerados, el:", "o": ["Tercer lugar, tras el bancario y el automotriz", "Primer lugar, antes que el sector bancario", "Último lugar, tras todos los no financieros", "Segundo lugar, tras el sector de seguros"], "a": 0, "e": "Cuarta Actualización del Informe de Amenazas Regionales."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la certificación de que la estructura accionaria coincide con el libro de accionistas la emite el comisario de la sociedad.", "a": false, "e": "Art. 5, num. 2, lit. c: la emite la junta directiva. Trampa: se cambia el emisor."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, un tasador que interviene en una compraventa de inmuebles:", "o": ["Puede tener en cuenta también la guía", "Queda excluido por no ser un corredor", "Queda excluido por no recibir dinero", "Solo aplica si trabaja para un banco"], "a": 0, "e": "Terminología."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, según el GAFIC, entre 2015 y 2020 se estimó que en los Estados Unidos se legitimaron a través de bienes raíces:", "o": ["USD 2,3 mil millones", "USD 1.100 millones", "USD 626,3 millones", "USD 15 mil millones"], "a": 0, "e": "Reino Unido: 1.100; Canadá: 626,3."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la aplicación de controles bajo el enfoque basado en riesgos no puede ser:", "o": ["Genérica ni reactiva", "Documentada ni medida", "Proporcional ni eficaz", "Específica ni continua"], "a": 0, "e": "Introducción."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una sociedad inmobiliaria presenta un acta extranjera en castellano, sin apostilla. La ONCDOFT:", "o": ["No debe aceptarla sin apostilla o legalización", "Debe aceptarla por estar en castellano", "Debe aceptarla con traducción de intérprete", "Debe aceptarla con certificación de contador"], "a": 0, "e": "Art. 4."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los defectos de una solicitud de anulación se subsanan en un plazo no mayor de cinco días hábiles.", "a": false, "e": "Art. 15: no mayor de quince días hábiles. Trampa: cinco días hábiles es el plazo de la actualización."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la bancarización obligatoria de honorarios tiene como sector prioritario a:", "o": ["Los abogados", "Las inmobiliarias", "Los contadores", "Los tres sectores"], "a": 0, "e": "Eje de gestión de efectivo. Trampa: las inmobiliarias son prioritarias, con los abogados, en el monitoreo in situ."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, las calificaciones de la matriz sectorial deben leerse como:", "o": ["Exposición teórica, no ilícitos confirmados", "Prueba de ilícitos en los sujetos evaluados", "Sanciones administrativas ya aplicables", "Causales de cancelación del registro"], "a": 0, "e": "Sección de resultados."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los factores de riesgo de la matriz son clientes, productos y servicios, zona geográfica y:", "o": ["Canales de envío", "Capital social", "Número de socios", "Tipo de inmueble"], "a": 0, "e": "Sección III.2."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, un sujeto con cierre fiscal distinto al año calendario remite sus estados financieros en los primeros quince días continuos del mes siguiente a su declaración definitiva de impuesto sobre la renta.", "a": true, "e": "Art. 13. Trampa: se cree que todos remiten en abril."}, {"t": "vf", "q": "Según la LOCDOFT, un abogado que compra un inmueble para un cliente en el libre ejercicio puede ser sujeto obligado.", "a": true, "e": "Art. 9, numeral 9, literal a."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación, los empleados del sujeto obligado pueden cerrar las cuentas del cliente con autorización del Ministerio Público.", "a": false, "e": "Art. 15: requiere autorización previa de un juez o jueza competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el único evento de severidad inherente crítica del sector inmobiliario se relaciona con:", "o": ["La gestión de personas expuestas políticamente", "El arrendamiento de locales de bajo valor", "La emisión de avalúos con firma electrónica", "La administración de condominios residenciales"], "a": 0, "e": "Sección IV.3.2."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, en estos sectores la responsabilidad de cumplimiento recae de forma directa sobre el profesional actuante.", "a": true, "e": "Sección II.1."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, el uso de empresas extranjeras para comprar inmuebles puede ser una señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, en 2025, las actividades inmobiliarias representaron del PIB alrededor de:", "o": ["7,55 %", "0,81 %", "25,88 %", "1,60 %"], "a": 0, "e": "Cuadro de materialidad. El 0,81 % corresponde a seguros."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, si la documentación de actualización presenta inconsistencias, el sujeto obligado tiene cinco días hábiles para subsanarla.", "a": true, "e": "Art. 13. Trampa: quince días hábiles es el plazo para subsanar una solicitud de anulación."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las actividades del informe del GAFI de 2007 son indicativas, aunque no concluyentes, de legitimación de capitales.", "a": true, "e": "Tipologías citadas en la guía."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el universo de 333.343 inscritos corresponde a:", "o": ["Los abogados", "Los contadores públicos", "Los agentes inmobiliarios", "Los tres sectores juntos"], "a": 0, "e": "172.024 son contadores y 6.841, afiliados inmobiliarios."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la Recomendación 19 del GAFI, citada en la guía, se refiere a:", "o": ["Medidas respecto de países de mayor riesgo", "Reportes de operaciones sospechosas", "Controles internos en el extranjero", "Personas expuestas políticamente"], "a": 0, "e": "R.18: controles internos; R.20: reportes."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la relación con una persona expuesta políticamente requiere aprobación de la alta gerencia y monitoreo continuo.", "a": true, "e": "Fase I."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, se recomienda a los tres sectores aplicar debida diligencia reforzada a toda operación con PEP y:", "o": ["Transacciones inmobiliarias de alto valor", "Arrendamientos de vivienda de bajo canon", "Toda operación en moneda nacional pagada", "Operaciones entre familiares sin excepción"], "a": 0, "e": "Recomendaciones."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, una inmobiliaria recibe una propuesta de venta por debajo del valor de mercado, con pago urgente en efectivo. Esto presenta:", "o": ["Varias señales de alerta combinadas", "Una operación de riesgo nulo", "Una exención a la debida diligencia", "Un requisito normal de avalúo"], "a": 0, "e": "Discrepancia de precio, prisa y efectivo."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el sector inmobiliario cuenta con veinte cámaras inmobiliarias y cinco capítulos inmobiliarios.", "a": true, "e": "Marco legal nacional. Trampa: se confunde con el número de estados."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las PEP que abusan de su posición presentan un alto riesgo para el sector inmobiliario.", "a": true, "e": "Aplicación del EBR."}, {"t": "vf", "q": "Según la LOCDOFT, una inmobiliaria sin órgano de control sectorial queda libre de reportar actividades sospechosas.", "a": false, "e": "Es sujeto obligado y debe reportar a la UNIF."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el sujeto obligado debe notificar un cambio de domicilio o de estructura accionaria dentro de los:", "o": ["Treinta días continuos siguientes", "Quince días continuos siguientes", "Treinta días hábiles siguientes", "Cinco días hábiles siguientes"], "a": 0, "e": "Art. 12. Trampa: la sustitución del oficial de los regulados se notifica en quince días."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la Fase I de implementación abarca:", "o": ["El segundo y tercer trimestre de 2026", "El primer y segundo trimestre de 2026", "El cuarto trimestre de 2026", "Los cuatro trimestres de 2026"], "a": 0, "e": "Fases de implementación. Trampa: el cuarto trimestre es la Fase II."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, NO es una actividad del profesional inmobiliario descrita en la circular:", "o": ["La emisión de pólizas sobre edificios", "El corretaje de terrenos y viviendas", "El arrendamiento de inmuebles", "Los avalúos y estudios de mercados"], "a": 0, "e": "La circular enumera corretaje, arrendamiento, avalúos, administración y asesoría."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, a diferencia de la banca, los compradores y vendedores de bienes raíces:", "o": ["No suelen mantener una relación duradera con una entidad regulada", "Están obligados a mantener una cuenta abierta por diez años", "Reciben supervisión diaria de una superintendencia propia", "Solo pueden contratar con profesionales del sector público"], "a": 0, "e": "Aplicación del EBR."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la solicitud de inscripción se presenta en físico ante la sede del órgano rector.", "a": false, "e": "Art. 8: mediante los medios electrónicos disponibles. Trampa: se cambia el medio."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, el pago de un inmueble por un tercero sin conexión con la transacción constituye una señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, una prisa anormal por cerrar y un pago en efectivo en una venta rápida se clasifican, respectivamente, como señales:", "o": ["Cualitativa y cuantitativa", "Cuantitativa y cualitativa", "Cualitativas ambas", "Cuantitativas ambas"], "a": 0, "e": "Sección 3."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, a diferencia de los contadores, los agentes inmobiliarios no cuentan con un visado legal de sus actuaciones.", "a": true, "e": "Sección II.1."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la Recomendación 18 del GAFI, citada en la guía, trata sobre:", "o": ["Controles internos y sucursales en el extranjero", "Países de mayor riesgo y contramedidas", "Reportes de operaciones sospechosas", "Beneficiario final de personas jurídicas"], "a": 0, "e": "Sección de referencias internacionales."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, de los tres sectores evaluados, las calificaciones de riesgo de abogados, contadores e inmobiliario son:", "o": ["Alta, moderada y moderada", "Moderada, alta y alta", "Alta, alta y moderada", "Moderada, moderada y alta"], "a": 0, "e": "Secciones IV."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, una propiedad revendida tras una renovación sin fuente de financiación evidente constituye una señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "vf", "q": "Según la LOCDOFT, deben detectarse las transacciones inusuales aun cuando tengan una justificación económica aparente.", "a": true, "e": "Art. 12. Trampa: se cree que la justificación aparente las excluye."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, si la solicitud de anulación tiene defectos, deben subsanarse en un período no mayor a:", "o": ["Quince días hábiles", "Cinco días hábiles", "Treinta días continuos", "Noventa días continuos"], "a": 0, "e": "Art. 15. Trampa: el plazo de actualización es de cinco días hábiles."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la capacitación debe incluir talleres de simulación de casos reales, y no solo clases magistrales.", "a": true, "e": "Fase I."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, un grupo de personas con perfiles similares que compran viviendas sobre plano puede indicar fraude hipotecario organizado.", "a": true, "e": "Sección 3."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la Cámara Inmobiliaria de Venezuela actúa como organismo de autorregulación del sector.", "a": true, "e": "Sección II.1."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, existe una brecha en la percepción del riesgo de FT y FPADM frente a la de legitimación de capitales.", "a": true, "e": "Conclusiones."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, una compra de contado, sin crédito ni banco, resulta más riesgosa porque:", "o": ["Evita instituciones financieras reguladas", "Reduce el precio final de la operación", "Elimina el pago de tributos municipales", "Evita la intervención del registrador"], "a": 0, "e": "Aplicación del EBR."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, entre los métodos señalados de la cadena delictiva, el rol final de los agentes inmobiliarios es:", "o": ["La colocación de fondos en activos tangibles", "La creación de estructuras societarias opacas", "La certificación contable de flujos de caja", "La recepción de reportes de inteligencia"], "a": 0, "e": "Sección I.1.B: estratificación coordinada."}, {"t": "vf", "q": "Según la Guía del GAFILAT para APNFD de 2022, la aparición del cliente en noticias negativas es una señal de alerta del sector inmobiliario.", "a": true, "e": "Tabla 19, literal g."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la designación de nuevos miembros de la junta directiva no requiere actualizar el registro.", "a": false, "e": "Art. 12: debe notificarse dentro de treinta días continuos. Trampa: se piensa solo en domicilio y accionistas."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, un agente detecta que su cliente, recién constituido como empresa, compra un inmueble de lujo mediante un mandatario sin explicar el origen. Corresponde:", "o": ["Aplicar debida diligencia y analizar reportar a la UNIF", "Concluir la venta por tratarse de una persona jurídica", "Advertir a la empresa de que será reportada a la UNIF", "Pedir autorización previa a la Cámara Inmobiliaria"], "a": 0, "e": "Señal de alerta sectorial y deber de RAS."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la fusión de dos sujetos obligados que extingue la personalidad jurídica de uno de ellos puede justificar la anulación.", "a": true, "e": "Art. 14.4."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el poder de representación de una sociedad constituida en el país debe estar autenticado, o bien designarse un factor de comercio inscrito en el Registro Mercantil.", "a": true, "e": "Art. 5, num. 1, lit. b. Trampa: se cree que solo vale el poder."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el registro de actuación profesional de los contadores públicos se identifica como:", "o": ["RUAP", "RUSO", "RNC", "RIF"], "a": 0, "e": "Sección II.2.B. El RUSO es el registro de sujetos obligados."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la ONCDOFT revisa los recaudos extra situ y puede hacer visitas in situ cuando lo estime conveniente.", "a": true, "e": "Art. 9. Trampa: se cree que la visita es obligatoria."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los organismos de autorregulación sustituyen a la ONCDOFT en la supervisión de sus afiliados.", "a": false, "e": "Sección II.1: operan como entidades auxiliares en funciones de supervisión indirecta. Trampa: auxiliar no es sustituto."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, conforme a la Nota Interpretativa de la Recomendación 22, los agentes inmobiliarios deben cumplir la Recomendación 10 respecto de:", "o": ["Compradores y vendedores", "Solo los compradores", "Solo los vendedores", "Solo los arrendatarios"], "a": 0, "e": "Terminología de la guía."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, uno de los accionistas de la inmobiliaria es una sociedad. La declaración debe:", "o": ["Llegar hasta el beneficiario final", "Limitarse a nombrar esa sociedad", "Llegar solo a su junta directiva", "Limitarse a accionistas locales"], "a": 0, "e": "Art. 5.2.b."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, en el sector inmobiliario, la supervisión basada en riesgo ayuda a detectar sobrevaloración de activos y uso injustificado de efectivo.", "a": true, "e": "Sección I."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, la estructura accionaria debe especificar, de cada accionista, su identificación, su porcentaje de participación y:", "o": ["El tipo de acciones o cuotas", "El origen de los fondos aportados", "Su domicilio fiscal vigente", "Su antigüedad como accionista"], "a": 0, "e": "Art. 5, num. 2, lit. a. Trampa: el origen de fondos es de la debida diligencia, no del registro."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, los bienes raíces comerciales pueden ser especialmente vulnerables por la mayor presencia de entidades legales.", "a": true, "e": "Aplicación del EBR."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, según la circular, en el período 2017-2019 las sentencias condenatorias regionales correspondientes a agentes inmobiliarios fueron del:", "o": ["12 %", "29 %", "19 %", "55 %"], "a": 0, "e": "Sobre 25 sentencias condenatorias."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la cifra de USD 1.100 millones legitimados en bienes raíces entre 2015 y 2020 corresponde a:", "o": ["El Reino Unido", "Los Estados Unidos", "Canadá", "Venezuela"], "a": 0, "e": "Estados Unidos: 2,3 mil millones; Canadá: 626,3 millones."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria constituida en Venezuela e inscrita ante la ONCDOFT cambia de domicilio. Debe:", "o": ["Actualizar el registro dentro del plazo de treinta días", "Esperar la siguiente inspección para comunicarlo", "Comunicarlo solo en sus estados financieros anuales", "Solicitar la anulación del registro de la empresa"], "a": 0, "e": "Art. 12."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el acta de asamblea que acredita la junta directiva se admite aunque su período esté vencido.", "a": false, "e": "Art. 5, num. 1, lit. c: sin que se encuentre vencido su período. Trampa: se suprime la condición."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, una sociedad mercantil debe informar su estructura accionaria hasta determinar el beneficiario final.", "a": true, "e": "Art. 5.2."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, las inspecciones in situ aleatorias a sectores de riesgo alto se ubican en:", "o": ["La Fase II, cuarto trimestre de 2026", "La Fase I, segundo trimestre de 2026", "La Fase I, tercer trimestre de 2026", "La Fase II, primer trimestre de 2027"], "a": 0, "e": "Fases de implementación."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la anulación del registro opera de pleno derecho con la sola solicitud del sujeto obligado.", "a": false, "e": "Art. 15: el órgano rector revisa en treinta días continuos, decide y notifica por oficio. Trampa: se suprime la decisión."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria cambia su estructura accionaria y, luego, la ONCDOFT detecta inconsistencias en la actualización. Los plazos son:", "o": ["30 días continuos y 5 hábiles para subsanar", "15 días continuos y 15 hábiles para subsanar", "5 días hábiles y 30 continuos para subsanar", "30 días hábiles y 15 continuos para subsanar"], "a": 0, "e": "Arts. 12 y 13."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un corredor quiere enviar su reporte de sospecha a la Cámara Inmobiliaria para que ella lo tramite. Debe saber que:", "o": ["El reporte se dirige a la UNIF", "La Cámara lo remite a la ONCDOFT", "La Cámara decide si se reporta", "El reporte se dirige al SAREN"], "a": 0, "e": "La CIV agrupa al gremio, pero no recibe reportes."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el sector inmobiliario reportó, al 18 de marzo de 2026, un total de afiliados cercano a:", "o": ["6.841", "172.024", "333.343", "25.000"], "a": 0, "e": "172.024 son contadores y 333.343 abogados."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, las actividades inmobiliarias y las profesionales suman en conjunto cerca del 13 % del PIB de 2025.", "a": true, "e": "Sección de materialidad: 7,55 % y 5,49 %. Trampa: se recuerda solo la cifra inmobiliaria."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, las operaciones con organizaciones sin fines de lucro sin justificar el origen y destino de los fondos son señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, en el Alcance de la Evaluación Nacional de Riesgo 2026, un riesgo relevante del sector es:", "o": ["La omisión de debida diligencia intensificada con PEP", "El exceso de reportes presentados de manera oportuna", "La excesiva supervisión diaria de cada corredor", "El uso obligatorio de cuentas bancarias en bolívares"], "a": 0, "e": "Marco legal nacional."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por enviar divisas en efectivo por correo la impone el órgano rector, no el órgano de control del sujeto obligado.", "a": true, "e": "Art. 23. Trampa: en los arts. 11 a 17 sí multa el órgano de control."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, tras los controles, el evento crítico del sector inmobiliario queda en nivel residual:", "o": ["Significativo", "Aceptable", "Catastrófico", "Crítico"], "a": 0, "e": "Sección IV.3.3."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el evento de riesgo residual significativo del sector inmobiliario equivale a:", "o": ["14 % del total de eventos", "86 % del total de eventos", "9 % del total de eventos", "91 % del total de eventos"], "a": 0, "e": "1 de 7 eventos. Trampa: 86 % son los aceptables; 9 % y 91 % son de contadores."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los órganos y entes de control deben remitir al órgano rector la información de sus sujetos obligados registrados o en proceso de registro.", "a": true, "e": "Art. 17. Trampa: se cree que el registro solo cubre a quienes no tienen órgano de control."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, si el sujeto tiene menos de un año de ejercicio fiscal, debe remitir:", "o": ["Estados financieros acumulados a su última fecha de cierre", "Una carta de exención firmada por su representante legal", "Una proyección a cinco años de sus ingresos estimados", "Únicamente la inscripción en el registro de comercio"], "a": 0, "e": "Art. 4.2.d."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, se percibe que el sector inmobiliario tiene controles de prevención menos estrictos.", "a": true, "e": "Mesa de Investigación del GAFIC."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una solicitud de anulación llega con defectos. El sujeto subsana y la ONCDOFT revisa, respectivamente, en:", "o": ["15 días hábiles y 30 continuos", "5 días hábiles y 15 continuos", "30 días continuos y 15 hábiles", "15 días continuos y 5 hábiles"], "a": 0, "e": "Art. 15."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, puede anularse el registro de quien cambió a una actividad no regulada por leyes de prevención de LC/FT/FPADM.", "a": true, "e": "Art. 14, num. 3. Trampa: se cree que solo procede por cierre o fallecimiento."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, en el sector inmobiliario, el porcentaje de eventos con riesgo residual aceptable es:", "o": ["86 %", "14 %", "91 %", "20 %"], "a": 0, "e": "6 de 7 eventos. El 91 % es de contadores."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la supervisión basada en riesgo sustituye modelos de control de tipo:", "o": ["Formalista", "Tecnológico", "Preventivo", "Proporcional"], "a": 0, "e": "Sección I."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la cifra de afiliados del sector inmobiliario incluye asesores independientes y franquicias.", "a": true, "e": "Sección II.2. Trampa: se cree que solo cuenta personas naturales."}, {"t": "vf", "q": "Según la LOCDOFT, una constructora de oficinas puede ser sujeto obligado aunque no actúe como corredor ni venda por encargo de terceros.", "a": true, "e": "Art. 9, numeral 10, literal b."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, un sujeto regulado por ley especial notifica la sustitución definitiva de su oficial de cumplimiento dentro de:", "o": ["Quince días continuos desde su autorización", "Treinta días continuos desde la renuncia", "Cinco días hábiles desde la designación", "Quince días hábiles desde la renuncia"], "a": 0, "e": "Art. 12. Trampa: los demás cambios se notifican en treinta días."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el certificado de inscripción en el Registro Nacional de Contratistas se exige:", "o": ["Cuando corresponda", "En todos los casos", "Solo a las personas naturales", "Solo a las organizaciones sin fines de lucro"], "a": 0, "e": "Art. 4, num. 2, lit. c. Trampa: no es un requisito general."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar al cliente que fue reportado a la UNIF se duplica en caso de reincidencia.", "a": true, "e": "Art. 14. Trampa: se cree que la reincidencia solo agrava la pena penal."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un comprador no revela la fuente de una compra de alto valor en moneda extranjera. El agente debe:", "o": ["Tratarlo como señal de alerta y profundizar", "Dar por válida la operación por ser en divisas", "Reducir el precio para acelerar el negocio", "Cerrar la venta y omitir toda documentación"], "a": 0, "e": "Sección 3."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el motivo «compraventa sucesiva de un mismo inmueble» representó, en el segundo semestre de 2025:", "o": ["7,41 % de los casos", "42,34 % de los casos", "0,94 % de los casos", "50,00 % de los casos"], "a": 0, "e": "El 0,94 % es la proporción de RAS vinculados a actividades inmobiliarias."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las medidas menos estrictas pueden aplicarse en situaciones de menor riesgo.", "a": true, "e": "Gestión y mitigación."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la acción de inspecciones aleatorias sobre expedientes de debida diligencia tiene como sectores prioritarios:", "o": ["Abogados e inmobiliarias", "Contadores y notarios", "Bancos y aseguradoras", "Casinos y joyerías"], "a": 0, "e": "Ejes estratégicos."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los agentes inmobiliarios y empresas del sector representan, en las sentencias condenatorias estudiadas:", "o": ["12 % de los casos", "40 % de los casos", "14 % de los casos", "50 % de los casos"], "a": 0, "e": "El 40 % es la tipología de testaferros."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, deben inscribirse directamente ante el órgano rector los sujetos obligados:", "o": ["Sin ley especial ni órgano de control propio", "Regulados por la Superintendencia de Valores", "Regulados por la Superintendencia de Bancos", "Con licencia vigente de un órgano sectorial"], "a": 0, "e": "Arts. 1, 2 y 3."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, todas las funciones de un agente inmobiliario, por el solo hecho de serlo, activan los estándares del GAFI.", "a": false, "e": "La circular indica que no todas lo están."}, {"t": "mc", "q": "Según la LOCDOFT, quien tiene como actividad económica la compraventa de bienes raíces se encuadra como sujeto obligado en:", "o": ["El artículo 9, numeral 10", "El artículo 9, numeral 6", "El artículo 7, numeral 12", "El artículo 5, numeral 1"], "a": 0, "e": "Art. 9, numeral 10, literal a, citado en la Circular 001125."}, {"t": "mc", "q": "Según la Guía del GAFILAT para APNFD de 2022, un agente sin acceso a bases privadas para la debida diligencia enfrenta una vulnerabilidad de:", "o": ["Acceso restringido a información abierta", "Exceso de información confidencial", "Doble supervisión prudencial anual", "Sobrerregulación del sector bancario"], "a": 0, "e": "Tabla 18, literal d."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los documentos emitidos en el extranjero pueden presentarse sin apostilla ni legalización si están en castellano.", "a": false, "e": "Art. 4: en todo caso deben apostillarse o legalizarse."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, entre las tipologías inmobiliarias citadas figura el uso inexplicable de:", "o": ["Activos virtuales", "Avalúos públicos", "Cédulas vigentes", "Pagos registrados"], "a": 0, "e": "Sección de tipologías."}, {"t": "mc", "q": "Según la LOCDOFT, un contador en libre ejercicio es sujeto obligado respecto de la compra de un inmueble cuando:", "o": ["Lleva a cabo la transacción para un cliente", "Solo lleva la contabilidad de su propia casa", "Solo imparte clases de contabilidad general", "Solo trabaja como empleado de un ministerio"], "a": 0, "e": "Art. 9, numeral 9, literal a."}, {"t": "mc", "q": "Según la Guía del GAFILAT para APNFD de 2022, la regulación y supervisión de las APNFD se ubica en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Introducción."}, {"t": "vf", "q": "Según la Guía del GAFILAT para APNFD de 2022, los intermediarios y tramitadores informales representan un alto riesgo por su falta de formalización.", "a": true, "e": "Tabla 18."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los pilares de efectividad incluyen priorizar la vigilancia en sujetos con:", "o": ["Alto manejo de efectivo o baja supervisión histórica", "Mayor antigüedad y mayor número de afiliaciones", "Sede en la capital y estructura de una sola oficina", "Bajo volumen y reportes recibidos con regularidad"], "a": 0, "e": "Sección de diagnóstico de 25 IEM."}, {"t": "mc", "q": "Según la Guía del GAFILAT para APNFD de 2022, subvalorar costos o registrar condiciones irreales en promesas de compraventa es una conducta que se vincula con:", "o": ["Intermediarios sin profesionalización", "Controles internos ya documentados", "Supervisión basada en riesgos", "Operaciones de bajo valor catastral"], "a": 0, "e": "Tabla 18."}, {"t": "mc", "q": "Según la LOCDOFT, al ingresar o salir del país debe declararse el dinero o los títulos al portador cuando su monto:", "o": ["Exceda de diez mil dólares", "Exceda de cinco mil dólares", "Iguale o pase de diez mil dólares", "Exceda de quince mil dólares"], "a": 0, "e": "Art. 22. Trampa: la norma dice exceda, no iguale."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el listado de donantes de una organización sin fines de lucro lo emite su junta directiva.", "a": true, "e": "Art. 6, num. 4. Trampa: se espera que lo certifique un contador."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los sujetos obligados con órgano de control propio tramitan su registro directamente ante la ONCDOFT.", "a": false, "e": "Art. 3: el trámite es responsabilidad de su órgano o ente de control. Trampa: se cambia quién tramita."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, en la Fase II, los sectores de riesgo moderado y bajo reciben inspecciones in situ aleatorias.", "a": false, "e": "Reciben supervisión extra situ; las inspecciones in situ aleatorias son para los de riesgo alto. Trampa: se cruzan las dos modalidades."}, {"t": "vf", "q": "Según la Guía del GAFILAT para APNFD de 2022, las APNFD pueden ser supervisadas a través de un supervisor o de un organismo autorregulador apropiado.", "a": true, "e": "Introducción."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, deben inscribirse en el RUSO-ONCDOFT los sujetos obligados cuya actividad está regulada por una ley especial.", "a": false, "e": "Art. 1: el registro directo es para quienes no están regulados por ley especial ni sometidos a un órgano de control. Trampa: se invierte el ámbito."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una persona natural que ejerce como oficial de cumplimiento debe adjuntar constancia de inscripción en el registro de oficiales que lleva:", "o": ["El órgano rector", "La UNIF", "Su órgano de control sectorial", "El colegio profesional respectivo"], "a": 0, "e": "Art. 7, num. 2. Trampa: la constancia del órgano de control es otro requisito (num. 1)."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, según el informe del GAFILAT de 2023, el porcentaje de sectores de APNFD con alguna guía para sus matrices de riesgo es:", "o": ["55 %", "45 %", "52,94 %", "47,06 %"], "a": 0, "e": "Referencias internacionales."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la identificación del beneficiario final exige identificar a quien posea al menos:", "o": ["El 25 % del capital o ejerza el control efectivo", "El 50 % del capital y tenga además la gerencia", "El 10 % del capital sin importar su influencia", "El 75 % del capital y figure en el registro"], "a": 0, "e": "Fase I, tema de beneficiario final."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la guía también puede aplicarse a abogados, prestamistas y tasadores cuando intervienen en la compraventa de inmuebles.", "a": true, "e": "Terminología."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la cifra de afiliados de la Cámara Inmobiliaria reportada al 18-03-2026 es 6.841. La cifra de 6.872 aparece en:", "o": ["La Guía UNIF-DSU-GUIA-2026-005", "La Circular UNIF 001125 de 2024", "La Providencia ONCDOFT-002-2021", "El Plan de Supervisión 2026"], "a": 0, "e": "Marco legal de la guía."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el certificado de registro es electrónico y tiene elementos de seguridad para que terceros verifiquen su autenticidad.", "a": true, "e": "Art. 11. Trampa: se cree que es un oficio en papel."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, aunque Venezuela no es miembro pleno del GAFILAT, los riesgos que este identifica deben integrarse en las evaluaciones locales.", "a": true, "e": "Sección I.1.C."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los documentos emitidos en otro idioma se admiten con una traducción simple, aunque no estén apostillados.", "a": false, "e": "Art. 4: deben estar apostillados o legalizados y con traducción legal. Trampa: se rebajan dos requisitos."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el sector inmobiliario ya no opera bajo un esquema exclusivamente civil o mercantil.", "a": true, "e": "Marco legal nacional."}, {"t": "vf", "q": "Según la Guía del GAFILAT para APNFD de 2022, el pago realizado por terceros es una señal de alerta en el sector inmobiliario.", "a": true, "e": "Tabla 19."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil financiero y operaciones fue el motivo principal de reporte, con mayor peso en el segundo semestre de 2025 que en el primero.", "a": false, "e": "50,00 % en el primer semestre y 42,34 % en el segundo. Trampa: la primera mitad es correcta."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un cliente solicita a la inmobiliaria mantener una gran suma y luego reembolsarla a una cuenta distinta de la original. Se trata de:", "o": ["Una señal de alerta sobre uso de cuentas de clientes", "Un servicio ordinario de administración de propiedad", "Un mecanismo de pago exigido por la autoridad fiscal", "Un trámite propio del registro público inmobiliario"], "a": 0, "e": "Sección 3."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, aplicar debida diligencia reforzada a una transacción con PEP solo es exigible a partir de cierto monto.", "a": false, "e": "La recomendación es sin excepción de montos."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un cliente paga con cheques de varias personas, por encima del precio, y pide devolver la diferencia a otra cuenta. La conducta correcta es:", "o": ["Tratarlo como alertas combinadas y profundizar", "Aceptar, pues hay trazabilidad bancaria", "Devolver la diferencia a la cuenta indicada", "Cerrar la venta y luego consultar a la CIV"], "a": 0, "e": "Sección 3."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, la administración de condominios comerciales y de oficinas forma parte de las actividades del profesional inmobiliario.", "a": true, "e": "Introducción."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, concluida satisfactoriamente la evaluación, se generan credenciales para:", "o": ["El representante legal y el oficial de cumplimiento", "El representante legal y el auditor externo", "Los accionistas y el oficial de cumplimiento", "La junta directiva y el contador público"], "a": 0, "e": "Art. 10, num. 1. Trampa: se cambia uno de los dos titulares."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, un agente dice que la debida diligencia solo aplica al comprador porque «es quien paga». El error es que:", "o": ["La obligación abarca también al vendedor", "La obligación corresponde solo al notario", "El vendedor siempre está exento por ley", "La debida diligencia solo aplica al banco"], "a": 0, "e": "R.10 y Nota Interpretativa R.22."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el órgano rector revisa y valida la información de actualización dentro de treinta días continuos contados desde:", "o": ["La consignación del último recaudo", "La fecha del cambio notificado", "La notificación inicial del sujeto", "El cierre del mes respectivo"], "a": 0, "e": "Art. 13. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, para operaciones de bajo riesgo y perfiles conocidos, los sujetos pueden aplicar debida diligencia:", "o": ["Simplificada", "Reforzada", "Mejorada", "Suspendida"], "a": 0, "e": "Fase I."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, solo es beneficiario final quien posee al menos el 25 % del capital.", "a": false, "e": "También quien ejerce el control efectivo. Trampa: se omite la segunda vía."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, según la guía, los estados más activos del sector incluyen, entre otros:", "o": ["Área Metropolitana, Miranda y Carabobo", "Amazonas, Delta Amacuro y Apure", "Cojedes, Guárico y Portuguesa", "Yaracuy, Sucre y Trujillo"], "a": 0, "e": "Marco legal nacional."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la CIV informó un total de afiliados profesionales y jurídicos de:", "o": ["6.872", "6.841", "20.000", "5.000"], "a": 0, "e": "Marco legal de la guía. Trampa: la Evaluación Sectorial reporta 6.841 al 18-03-2026."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, los estados financieros auditados o certificados del último ejercicio se remiten, si el cierre es el año calendario, en:", "o": ["Los primeros quince días continuos de abril", "Los primeros quince días hábiles de marzo", "Los últimos quince días del mes de abril", "Los primeros treinta días del mes de enero"], "a": 0, "e": "Art. 13. Trampa: se cambia el mes o la unidad."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un cliente que paga con cheques de varios emisores sin explicación presenta la señal de:", "o": ["Pagos con fondos de distintas fuentes", "Administración regular de condominios", "Avalúo vigente de la propiedad vendida", "Financiamiento hipotecario supervisado"], "a": 0, "e": "Sección 3."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el cierre o cese de la actividad económica se acredita, para la anulación, con constancia emitida por:", "o": ["La alcaldía respectiva", "El Registro Mercantil", "El SENIAT", "La cámara del sector"], "a": 0, "e": "Art. 15, num. 2. Trampa: se piensa en el registro o en la autoridad tributaria."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, ante inconsistencias en la actualiz
