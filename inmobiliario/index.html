 16, considera este caso. Se revisan dos expedientes, uno moderado y otro alto. ¿Qué afirmación es correcta?", "o": ["La guía prevé diligencia estándar para riesgo moderado", "Ambos expedientes deben tratarse con diligencia simplificada", "El riesgo alto reduce la frecuencia de revisión"], "a": 0, "e": "La clasificación orienta el grado de diligencia y de seguimiento. El tratamiento moderado no se traslada sin ajustes a perfiles de riesgo alto. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y 16."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. El cliente ofrece pagar un precio muy superior a la tasación y exige cerrar con una prisa anormal. ¿Qué afirmación es correcta?", "o": ["La discrepancia de precio merece investigar su justificación", "La prisa pertenece exclusivamente al análisis de montos", "El avalúo bajo autoriza a concluir sin revisar soportes"], "a": 0, "e": "Precio y comportamiento son señales distintas. Su concurrencia justifica examinar contexto y evidencia, sin equipararla a una prueba de delito. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03, considera este caso. La firma ya documentó a la sociedad y debe analizar una operación específica. ¿Qué afirmación es correcta?", "o": ["CIV-02 apoya la identificación del cliente jurídico", "CIV-02 y CIV-03 son el mismo expediente con nombres distintos", "Completar CIV-02 reemplaza por sí solo el análisis de operación"], "a": 0, "e": "La identidad y la valoración de una operación son piezas complementarias. Un expediente completo sobre la sociedad no explica por sí solo el riesgo del negocio. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. La agencia cuenta con un manual actualizado, pero su personal no sabe reconocer una operación inusual. ¿Qué afirmación es correcta?", "o": ["La formación continua sigue siendo pertinente", "La existencia de un manual elimina la capacitación", "El entrenamiento se limita a la firma de nuevos contratos"], "a": 0, "e": "La eficacia operativa depende de que el personal reconozca patrones y aplique controles. La documentación y la capacidad para usarla son distintas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9, considera este caso. Una corredora piensa disminuir la diligencia frente a un cliente importante y con honorarios reducidos. ¿Qué afirmación es correcta?", "o": ["La importancia comercial no excusa la diligencia", "El prestigio del cliente autoriza reducir controles", "Una comisión pequeña permite omitir las verificaciones"], "a": 0, "e": "Los incentivos comerciales no sustituyen la evaluación de exposición. La independencia del control protege precisamente frente a esos incentivos. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, considera este caso. El responsable distribuye funciones entre diligencia al cliente y reporte de actividades sospechosas. ¿Qué afirmación es correcta?", "o": ["La Recomendación 22 se vincula con DDC y registros de APNFD", "La Recomendación 22 regula el trámite del certificado RUSO", "La Recomendación 23 sustituye la diligencia de la Recomendación 22"], "a": 0, "e": "Las recomendaciones cumplen funciones complementarias. La 22 cubre diligencia y conservación, y la 23 conecta controles y reporte con la actividad cubierta. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, considera este caso. La dirección asigna iguales recursos a expedientes sencillos y a operaciones con exposición mayor, sin revisar sus perfiles. ¿Qué afirmación es correcta?", "o": ["La proporcionalidad admite mayor esfuerzo donde sube el riesgo", "El enfoque exige el mismo esfuerzo para cualquier perfil", "La asignación de recursos se decide antes de conocer el riesgo"], "a": 0, "e": "La guía recoge asignar recursos donde la exposición es mayor. Hace falta identificar y comprender el riesgo antes de concretar las medidas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Un corredor verifica solo al comprador porque es quien paga la comisión. ¿Qué afirmación es correcta?", "o": ["La diligencia comprende también al vendedor", "El vendedor queda cubierto por diligencia hecha al comprador", "El perfil se verifica solo para quien paga al intermediario"], "a": 0, "e": "La guía aplica el conocimiento a ambos extremos de la compraventa. El contrato de honorarios no determina por sí solo a quién debe verificarse. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Se manipula una tasación para que coincida con un precio que el corredor no ha podido justificar. ¿Qué afirmación es correcta?", "o": ["La manipulación de tasación es una señal autónoma", "La coincidencia artificial con el precio neutraliza la señal", "Solo importa el avalúo si el inmueble se financia con hipoteca"], "a": 0, "e": "Un avalúo alterado no es evidencia independiente que explique el precio. Por eso el análisis debe atender a cómo se obtuvo el valor. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, paso 4, considera este caso. Tras agotar titularidad y control por otros medios sin identificar a una persona natural, la agencia decide cómo documentar el caso. ¿Qué afirmación es correcta?", "o": ["La alta dirección opera como último recurso en el procedimiento", "El cargo gerencial se toma como primera y única comprobación", "Basta indicar el nombre de la sociedad y cerrar la revisión"], "a": 0, "e": "La ruta subsidiaria se activa cuando las anteriores no identifican al beneficiario final. Aplicarla de entrada omite los pasos que la preceden. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, paso 4."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02, considera este caso. Se prepara la apertura de un expediente de persona natural y otro de una sociedad. ¿Qué afirmación es correcta?", "o": ["CIV-01 corresponde a persona natural", "CIV-01 sustituye la identificación de la estructura societaria", "CIV-02 se usa exclusivamente para registrar a los fiadores"], "a": 0, "e": "Los anexos responden al tipo de cliente. El de persona jurídica añade información sobre el beneficiario final. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2, considera este caso. La promesa de venta contiene una declaración contractual sobre origen de fondos. ¿Qué afirmación es correcta?", "o": ["La cláusula puede aportar un soporte al expediente", "La firma de la declaración sustituye la verificación", "La cláusula impide pedir documentos adicionales"], "a": 0, "e": "La manifestación contractual y la comprobación son actividades distintas. El documento es una evidencia que debe valorarse con el resto de la información. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Una propiedad se transmite repetidamente en un período breve con aumentos que no explica ninguna mejora. ¿Qué afirmación es correcta?", "o": ["La sucesión rápida de ventas es relevante", "La inscripción de cada venta neutraliza la alerta", "Solo interesa el valor que figure en la última escritura"], "a": 0, "e": "Debe evaluarse el patrón y la explicación económica del precio. La formalidad registral no aclara aumentos que carecen de soporte. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Un cliente pretende pagar parte en criptoactivos, a distancia, preservando el anonimato. ¿Qué afirmación es correcta?", "o": ["El anonimato en esa estructura de pago merece revisión", "Las transferencias digitales quedan fuera de la circular", "La ausencia de reunión física es prueba de ilicitud por sí sola"], "a": 0, "e": "El caso requiere analizar conjuntamente modalidad de pago, falta de identificación y contexto. Una operación remota no se califica únicamente por su canal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3, considera este caso. La agente detecta una señal y quiere acusar directamente al cliente para obtener una reacción. ¿Qué afirmación es correcta?", "o": ["Puede pedir documentos dentro de procedimientos habituales", "Debe revelar que considera remitir un RAS", "Debe sustituir la revisión documental por una acusación directa"], "a": 0, "e": "El análisis se orienta a obtener información y valorar la señal sin alertar al cliente. Confrontarlo no es un método de verificación. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, considera este caso. Una agencia quiere tratar como simplificada cualquier operación sin importar su perfil. ¿Qué afirmación es correcta?", "o": ["La modalidad de diligencia depende del nivel de riesgo", "La modalidad simplificada se elige solo por costo del trámite", "El cliente puede escoger directamente su modalidad"], "a": 0, "e": "La clasificación de riesgo precede al tratamiento. La preferencia comercial de la agencia o del cliente no reemplaza esa evaluación. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Una compradora entrega cheques de distintos emisores, entre ellos un tercero ajeno a la compraventa, sin explicar su relación. ¿Qué afirmación es correcta?", "o": ["La pluralidad de fuentes sin explicación merece análisis", "La validez bancaria de los cheques resuelve la alerta", "La presencia de un tercero prueba por sí sola un delito"], "a": 0, "e": "La revisión busca entender quién paga y con qué justificación. Un instrumento formal no acredita el origen económico ni reemplaza el análisis. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Un cliente adquiere varios inmuebles sin razón aparente y pretende pagar una venta rápida en efectivo. ¿Qué afirmación es correcta?", "o": ["La multiplicidad sin justificación es una alerta", "Cada compra debe aislarse para evitar examinar el patrón", "La modalidad de efectivo convierte el hecho en alerta solo cualitativa"], "a": 0, "e": "La circular reconoce indicadores por la frecuencia o magnitud de operaciones y por la modalidad de pago. El agregado aporta contexto al análisis de cada compra. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes, considera este caso. Un cliente pide mantener una gran suma y reembolsarla luego a una cuenta distinta de la cuenta de origen. ¿Qué afirmación es correcta?", "o": ["La instrucción de devolución a otra cuenta es relevante", "El reembolso elimina la necesidad de entender los fondos", "La orden del cliente convierte el hecho en mero trámite registral"], "a": 0, "e": "El cambio de cuenta puede alterar el destino de los fondos. Una instrucción válida entre partes no despeja por sí sola la señal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, considera este caso. Se compara una compra sin financiación bancaria con otra en la que participa un banco. ¿Qué afirmación es correcta?", "o": ["La ausencia de financiación puede reducir los puntos de control externo", "Sin financiación el riesgo es necesariamente menor", "Con financiación la agencia puede omitir todo análisis"], "a": 0, "e": "La guía señala la exposición que puede surgir al evitar instituciones reguladas. La intervención de otro participante tampoco borra el deber del agente. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, considera este caso. El cliente habitual presenta datos contradictorios y sostiene que solo se verifica al abrir el expediente. ¿Qué afirmación es correcta?", "o": ["Las dudas sobre información previa pueden activar diligencia", "La diligencia se agota al abrir la relación", "La relación habitual impide revisar datos dudosos"], "a": 0, "e": "La guía contempla la diligencia como una actividad que puede reactivarse por nuevos hechos. Haber abierto un expediente no valida inconsistencias posteriores. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal, considera este caso. Un equipo cita como norma venezolana una orientación sectorial del GAFI de 2022. ¿Qué afirmación es correcta?", "o": ["La orientación es una referencia internacional", "La orientación internacional reemplaza la LOCDOFT por sí sola", "La Circular 04043 y la orientación del GAFI son el mismo documento"], "a": 0, "e": "Una guía internacional orienta el enfoque y no se confunde con la fuente nacional que lo aplica. La fecha y autor de ambos instrumentos son diferentes. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Una operación sobre plano concentra compradores con perfiles similares y no existe explicación comercial suficiente. ¿Qué afirmación es correcta?", "o": ["El patrón puede ser indicio de fraude hipotecario organizado", "Toda compra sobre plano constituye fraude hipotecario", "Se descarta el patrón si cada comprador firma por separado"], "a": 0, "e": "La señal se refiere a un patrón de perfiles y operaciones semejantes. Firmas distintas no explican coincidencias ni demuestran el delito. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cualitativas, considera este caso. Una sociedad offshore comparece con accionistas nominales y cambia de titularidad poco antes del cierre. ¿Qué afirmación es correcta?", "o": ["La opacidad sobre quién controla a la sociedad es relevante", "La comparecencia formal del representante acredita el control real", "El cambio se analiza solo si ocurre después de la compraventa"], "a": 0, "e": "La documentación formal de representación no resuelve el control efectivo. Un cambio cercano al cierre puede añadir incertidumbre sobre quién participa. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cualitativas."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Una compradora es una sociedad con accionistas interpuestos y la agente tiene el nombre de su representante. ¿Qué afirmación es correcta?", "o": ["El análisis debe buscar a la persona física que controla finalmente", "La sociedad compradora es siempre el beneficiario final", "Quien redacta el contrato sustituye al beneficiario final al firmarlo"], "a": 0, "e": "Representar, figurar como titular y controlar en última instancia son roles diferentes. La guía exige mirar más allá de la estructura formal. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}]}]}], "all": [{"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "vf", "q": "Según la LOCDOFT, las organizaciones con fines políticos y los grupos de electores son sujetos obligados.", "a": true, "e": "Art. 9, numeral 7. Trampa: se suele pensar solo en actividades económicas."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales no figura:", "o": ["La UNIF", "La Fuerza Armada Nacional Bolivariana", "El Cuerpo de Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26. Trampa: sorprende que la Fuerza Armada sí figure y la UNIF no."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "Según la Recomendación 24 del GAFI, una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Debe declararlos porque exceden el umbral de US$10.000", "No debe declararlos porque el umbral es de US$15.000", "Debe declararlos solo si es extranjero no residente", "No debe declararlos si los fondos son de origen lícito"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "Arts. 1 y 2. El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "Art. 9. La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Según la LOCDOFT, la delincuencia organizada supone la acción u omisión de:", "o": ["Tres o más personas asociadas por cierto tiempo", "Dos o más personas asociadas por cierto tiempo", "Tres o más personas reunidas de forma ocasional", "Cinco o más personas con jerarquía definida"], "a": 0, "e": "Art. 4, numeral 9. Trampa: se cambia el número o se quita la permanencia."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "mc", "q": "Según la LOCDOFT, los documentos deben conservarse por el plazo legal en forma:", "o": ["Física y digital", "Física, y digital si el órgano de control lo exige", "Digital, y física solo para los originales", "Física o digital, a elección del sujeto obligado"], "a": 0, "e": "Art. 10. Trampa: las dos formas son acumulativas, no alternativas."}, {"t": "mc", "q": "Según la LOCDOFT, si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "Arts. 13 y 17. El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "mc", "q": "Según la LOCDOFT, aprobar la vinculación de un cliente PEP corresponde a la alta gerencia; diseñar y aplicar la debida diligencia sobre ese cliente corresponde a:", "o": ["El sujeto obligado, supervisado por su órgano de control", "El órgano de control, en cada operación del cliente", "La UNIF, al recibir el primer reporte del cliente", "La ONCDOFT, mediante una autorización previa"], "a": 0, "e": "Art. 18. Trampa: el órgano de control supervisa, pero quien diseña y aplica los procedimientos es el sujeto obligado."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "La antigüedad del cliente justifica relajar los controles", "La condición de empresa regulada exime de los controles", "La autorización del oficial basta para relajar los controles"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "mc", "q": "Según la LOCDOFT, un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Art. 32, numeral 4. Sanción de carácter reputacional."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Providencia SAA-01-0536-2024 de SUDEASEG", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "mc", "q": "Según la LOCDOFT, la ONCDOFT asesora técnicamente, en las relaciones internacionales sobre la materia, al ministerio con competencia en:", "o": ["Relaciones exteriores", "Planificación y finanzas", "Relaciones interiores y justicia", "Economía y comercio"], "a": 0, "e": "Art. 6, numeral 7. Trampa: la ONCDOFT depende del de relaciones interiores, pero asesora al de relaciones exteriores."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Arts. 13 y 17. Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Art. 9, numeral 10. Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede requerir a los sujetos obligados información sobre transacciones que puedan vincularse con estos delitos, aunque no exista un reporte previo.", "a": true, "e": "Art. 25, numeral 2. Trampa: se cree que solo analiza lo que recibe por reporte."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "Art. 36. La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Según la LOCDOFT, varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Art. 22. Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "vf", "q": "Según la LOCDOFT, la notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Art. 58. Es una garantía procesal."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, dirigir a los cuerpos de policía de investigaciones penales en estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El juez de control"], "a": 0, "e": "Art. 26. Trampa: el juez autoriza medidas, pero no dirige la investigación."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Art. 13. Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un reporte de sospecha", "Aceptarlo con monitoreo reforzado durante el primer año", "Iniciar la relación si el pago es por transferencia", "Pedir el dato en la renovación y vincularlo de inmediato"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "Según la LOCDOFT, dictar normas e instructivos que ayuden a los sujetos obligados a detectar patrones sospechosos corresponde a:", "o": ["Los órganos y entes de control", "La UNIF, mediante sus circulares", "La ONCDOFT, como órgano rector", "El Ministerio Público"], "a": 0, "e": "Art. 8, numeral 10. Trampa: la UNIF emite circulares sobre reportes, pero la ley asigna esta función a los órganos de control."}, {"t": "vf", "q": "Según la LOCDOFT, los representantes en el país de bancos o financiadoras extranjeras quedan sometidos a las disposiciones de la ley.", "a": true, "e": "Art. 20, parte final. Trampa: se cree que la regulación de su país de origen los exime."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la LOCDOFT, vigilar que los sujetos obligados cumplan programas actualizados de capacitación de su personal corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "El Ministerio Público", "Los colegios profesionales"], "a": 0, "e": "Art. 8, numeral 11. Trampa: la ONCDOFT capacita a funcionarios públicos (art. 6, num. 5), no vigila la capacitación del personal de los sujetos obligados."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional en la materia, junto con la organización, control y supervisión a nivel nacional, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio de Relaciones Exteriores", "El Ministerio Público"], "a": 0, "e": "Art. 5. Trampa: la UNIF intercambia con sus homólogas, pero la rectoría de la cooperación es del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar, porque el deber legal no depende del cargo", "Consultar al cliente antes de decidir el reporte", "Dejar constancia interna y abstenerse de reportar", "Renunciar al cargo antes de presentar el reporte"], "a": 0, "e": "Art. 13. La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF coordina con la ONCDOFT y los órganos de control las acciones para promover la adecuada supervisión de los sujetos obligados.", "a": true, "e": "Art. 25, numeral 8. Trampa: se cree que la UNIF no interviene en la supervisión."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo usa cuatro años de pena máxima y la LOCDOFT más de cinco", "Palermo usa cinco años de pena máxima y la LOCDOFT solo cuatro", "Palermo usa diez años y la LOCDOFT no define el concepto", "Palermo y la LOCDOFT usan cuatro años de pena máxima"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No configuran delincuencia organizada, que exige tres o más", "Configuran delincuencia organizada, que exige dos o más", "Configuran delincuencia organizada si actúan con fin de lucro", "No configuran delincuencia organizada salvo que sean extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "Art. 8, numeral 3. La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Según la LOCDOFT, elevar a la ONCDOFT los planteamientos necesarios para prevenir y detectar estos delitos, según su ámbito, es obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados", "La UNIF", "Los oficiales de cumplimiento"], "a": 0, "e": "Art. 8, numeral 8. Trampa: los sujetos obligados se relacionan con su órgano de control, no con el rector por esta vía."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "vf", "q": "Según la LOCDOFT, remitir a la UNIF la información que esta requiera, en los plazos que fije, es también una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 9. Trampa: se cree que solo los sujetos obligados envían información a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Evaluar el riesgo de los productos antes de lanzarlos", "Garantizar la autonomía del oficial frente a la junta", "Mantener la gratuidad de la función de cumplimiento", "Respetar la buena fe contractual con el cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "vf", "q": "Según la LOCDOFT, la ONCDOFT depende jerárquicamente del ministerio con competencia en planificación y finanzas.", "a": false, "e": "Art. 5: depende del ministerio con competencia en relaciones interiores y justicia. Trampa: planificación y finanzas es el ministerio de la UNIF (art. 24)."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, ante indicios de un hecho punible, presenta informes debidamente fundados a:", "o": ["El Ministerio Público", "El juez de control", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 25, numeral 6. Trampa: la UNIF no se dirige al juez; quien solicita medidas judiciales es el fiscal."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Procede si el cliente ya no opera", "Basta la autorización previa de la junta"], "a": 0, "e": "Art. 10. El mínimo legal es de cinco años."}, {"t": "mc", "q": "Según la LOCDOFT, un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable, sin exigir certeza", "Esperar pruebas documentales del origen ilícito", "Consultar al cliente para descartar la sospecha", "Esperar al próximo ciclo de monitoreo"], "a": 0, "e": "Art. 13. El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Según la LOCDOFT, diseñar las directrices para el plan operativo anual de prevención de los órganos de control corresponde a la UNIF.", "a": false, "e": "Art. 6, numeral 2: corresponde a la ONCDOFT. Trampa: se cambia el organismo."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "Según la LOCDOFT, si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "Art. 8, numeral 10. El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF proporciona a la ONCDOFT la información necesaria para el diseño de políticas públicas.", "a": true, "e": "Art. 25, numeral 9. Trampa: se cree que la reserva impide compartirla con el órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, establecer mecanismos para detectar transacciones inusuales o sospechosas, aun con justificación económica aparente, es deber de:", "o": ["Los sujetos obligados", "Los órganos de control", "La UNIF", "La ONCDOFT"], "a": 0, "e": "Art. 12. Trampa: los órganos de control dictan instructivos y supervisan, pero la detección es deber del sujeto obligado."}, {"t": "vf", "q": "Según la LOCDOFT, mantener un registro actualizado de sus sujetos obligados es una obligación de cada órgano o ente de control.", "a": true, "e": "Art. 8, numeral 13. Trampa: se cree que solo el órgano rector lleva registros."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Art. 4, numeral 2. Estructuración para evadir el reporte."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, la política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la Providencia SAA-01-0536-2024 de SUDEASEG es más exigente para digital."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la LOCDOFT, centralizar a nivel nacional los reportes de actividades sospechosas corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 25, numeral 1. Trampa: la ONCDOFT recibe información para políticas públicas, pero no centraliza los reportes."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia del oficial para reportar", "Refuerza el control interno sobre los reportes", "Requiere solo la aprobación previa del supervisor", "Aplica únicamente a los reportes de monto elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "vf", "q": "Según la Recomendación 13 del GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Según la Recomendación 13 del GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 7 del GAFI, la evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipi
