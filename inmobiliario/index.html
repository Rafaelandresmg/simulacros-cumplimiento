inco años, sin multa por el incremento patrimonial"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia favorezca la legitimación de capitales, sin participar en ella, será penado con prisión de:", "o": ["Tres a seis años", "Uno a tres años", "Seis a diez años", "Diez a quince años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluido satisfactoriamente el registro se generan credenciales para:", "o": ["El representante legal y el oficial de cumplimiento", "Los accionistas y el oficial de cumplimiento", "El representante legal y el auditor externo inscrito", "La junta directiva y el contador público colegiado"], "a": 0, "e": "Art. 10, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la LOCDOFT, ¿quién aprueba la vinculación de un cliente que es persona expuesta políticamente?", "o": ["La alta gerencia del sujeto obligado", "El oficial de cumplimiento", "La UNIF", "El área comercial que capta al cliente"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la persona natural que ejerce como oficial de cumplimiento debe consignar, entre otros:", "o": ["Constancia de inscripción en el registro de oficiales de cumplimiento del órgano rector", "Certificado de antecedentes penales emitido por el Ministerio Público en los últimos tres meses", "Título universitario de abogado o de contador público, con su inscripción en el colegio", "Carta de recomendación emitida por la UNIF sobre su desempeño como oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué modalidad de debida diligencia corresponde a un cliente de riesgo moderado?", "o": ["Debida diligencia estándar", "Debida diligencia simplificada", "Debida diligencia intensificada", "Ninguna, basta la declaración de fondos"], "a": 0, "e": "Guía DDC, art. 16, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué calificación de riesgo dio la Evaluación Sectorial 2026 de la ONCDOFT al sector de agentes inmobiliarios?", "o": ["Moderada", "Baja", "Alta", "Muy alta"], "a": 0, "e": "Guía DDC, Antecedentes: Calificación de Riesgo MODERADA."}, {"t": "mc", "q": "Según el artículo 13 de la LOCDOFT, ¿qué hace la UNIF con un reporte de actividad sospechosa?", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo tramita como denuncia penal ante el tribunal de control", "Lo devuelve al sujeto obligado para que investigue al cliente", "Lo publica en su página web para alertar al sector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal, el sujeto obligado solo puede cerrar las cuentas del cliente investigado:", "o": ["Con autorización previa de un juez competente", "Con autorización del oficial de cumplimiento", "Con autorización de la UNIF", "Cuando el cliente lo pida por escrito"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado que reportó a un cliente a la UNIF:", "o": ["No puede revelárselo al cliente ni a terceros", "Debe informárselo al cliente por escrito", "Puede revelárselo si el cliente lo pregunta", "Debe publicarlo en su cartelera interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 10 de la LOCDOFT, ¿por cuánto tiempo mínimo se conservan los documentos de las operaciones?", "o": ["Cinco (5) años", "Diez (10) años", "Tres (3) años", "Quince (15) años"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa y valida la información de actualización dentro de:", "o": ["Treinta (30) días continuos desde el último recaudo", "Cinco (5) días hábiles desde la consignación", "Quince (15) días hábiles desde la solicitud", "Sesenta (60) días continuos desde la solicitud"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 6 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la OSFL que se inscribe en el RUSO debe consignar, además de los requisitos generales:", "o": ["El listado de organizaciones de las que recibe aportaciones o donaciones", "Su declaración del impuesto sobre la renta de los últimos cinco ejercicios", "Un aval bancario por el monto total de los activos de la organización", "La lista nominal de los beneficiarios de todos sus programas sociales"], "a": 0, "e": "Art. 6, num. 4 (requisitos de las OSFL)."}, {"t": "mc", "q": "Según el artículo 11 de la LOCDOFT, ¿qué cuentas no pueden mantener los sujetos obligados?", "o": ["Anónimas, cifradas, innominadas o con nombres ficticios", "En moneda extranjera, salvo autorización del Banco Central", "De personas jurídicas no domiciliadas en el país, sin excepción", "De organizaciones sin fines de lucro, aunque estén registradas"], "a": 0, "e": "Art. 11."}, {"t": "mc", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de cualquier ministerio", "Contrato entre particulares"], "a": 0, "e": "Art. 9, último aparte."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en una inmobiliaria pequeña o un agente independiente, ¿quién es el responsable de cumplimiento?", "o": ["El propio agente inmobiliario, que lleva un registro de decisiones", "Un oficial de cumplimiento que designa y supervisa la propia CIV", "El comité de gestión contra la LC/FT/FPADM de la cámara estadal", "Un auditor externo inscrito en el registro de la ONCDOFT"], "a": 0, "e": "Guía EBR, punto 1.4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿cuál de estos sujetos obligados debe inscribirse en el RUSO conforme a esa circular?", "o": ["La agencia inmobiliaria que maneja fondos para la compra de inmuebles", "La empresa de seguros autorizada y supervisada por la SUDEASEG", "La caja de ahorro inscrita y supervisada por la SUDECA", "La casa de intercambio con licencia de operación de la SUNACRIP"], "a": 0, "e": "Circular 003-2026. Los sujetos con órgano de control propio se registran a través de él (Providencia ONCDOFT-002-2021, art. 3)."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿quiénes deben inscribirse en el RUSO-ONCDOFT?", "o": ["Los sujetos obligados no regulados por ley especial ni sometidos a otro órgano de control", "Solo los bancos y las empresas de seguros, por estar sometidos a un órgano de control propio", "Solo las personas naturales que ejercen como oficiales de cumplimiento en cualquier sector", "Las empresas extranjeras domiciliadas en el país que realicen operaciones en divisas"], "a": 0, "e": "Art. 2. También deben registrarse los designados por leyes especiales o que intervengan en el sistema de cumplimiento."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuándo se remiten los estados financieros del último ejercicio fiscal?", "o": ["En los primeros quince (15) días continuos de abril", "Dentro de los noventa días del cierre del ejercicio", "En la primera quincena de enero de cada año", "Solo cuando se actualice el registro"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en el riesgo inherente, ¿qué rango de puntaje corresponde a la severidad «crítico»?", "o": ["13 a 16, calificación alto", "10 a 12, calificación moderado alto", "17 a 25, calificación muy alto", "6 a 9, calificación moderado"], "a": 0, "e": "Guía EBR, punto 1.2: aceptable 1-5, significativo 6-9, moderado 10-12, crítico 13-16, catastrófico 17-25."}]}]}, {"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las empresas que manejan mucho efectivo figuran entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el riesgo depende solo del monto de cada operación."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales no figura:", "o": ["La UNIF", "La Fuerza Armada Nacional Bolivariana", "El Cuerpo de Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26. Trampa: sorprende que la Fuerza Armada sí figure y la UNIF no."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el certificado electrónico de inscripción en el RUSO-ONCDOFT lo emite:", "o": ["El órgano rector", "El órgano de control sectorial", "La UNIF", "El SAREN"], "a": 0, "e": "Art. 11. Trampa: el registro directo es ante el órgano rector."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por enviar divisas en efectivo por correo la impone el órgano rector, no el órgano de control del sujeto obligado.", "a": true, "e": "Art. 23. Trampa: en los arts. 11 a 17 sí multa el órgano de control."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), los agentes inmobiliarios y empresas del sector representan, en las sentencias condenatorias estudiadas:", "o": ["12 % de los casos", "40 % de los casos", "14 % de los casos", "50 % de los casos"], "a": 0, "e": "El 40 % es la tipología de testaferros."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "vf", "q": "Según la Recomendación 24 del GAFI, una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica en el plan", "Excluye de la matriz el de baja probabilidad", "Excluye de la matriz el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Según la Circular UNIF N° 001125 de 2024, un cliente solicita a la inmobiliaria mantener una gran suma y luego reembolsarla a una cuenta distinta de la original. Se trata de:", "o": ["Una señal de alerta sobre uso de cuentas de clientes", "Un servicio ordinario de administración de propiedad", "Un mecanismo de pago exigido por la autoridad fiscal", "Un trámite propio del registro público inmobiliario"], "a": 0, "e": "Sección 3."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Debe declararlos porque exceden el umbral de US$10.000", "No debe declararlos porque el umbral es de US$15.000", "Debe declararlos solo si es extranjero no residente", "No debe declararlos si los fondos son de origen lícito"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, deben inscribirse en el RUSO-ONCDOFT los sujetos obligados cuya actividad está regulada por una ley especial.", "a": false, "e": "Art. 1: el registro directo es para quienes no están regulados por ley especial ni sometidos a un órgano de control. Trampa: se invierte el ámbito."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la Recomendación 19 del GAFI, citada en la guía, se refiere a:", "o": ["Medidas respecto de países de mayor riesgo", "Reportes de operaciones sospechosas a la UIF", "Controles internos y sucursales en el extranjero", "Personas expuestas políticamente extranjeras"], "a": 0, "e": "R.18: controles internos; R.20: reportes."}, {"t": "vf", "q": "Según la LOCDOFT, las organizaciones con fines políticos y los grupos de electores son sujetos obligados.", "a": true, "e": "Art. 9, numeral 7. Trampa: se suele pensar solo en actividades económicas."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), de los tres sectores evaluados, las calificaciones de riesgo de abogados, contadores e inmobiliario son:", "o": ["Alta, moderada y moderada", "Moderada, alta y alta", "Alta, alta y moderada", "Moderada, moderada y alta"], "a": 0, "e": "Secciones IV."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo relacionado con el cliente:", "o": ["Una sociedad con accionistas nominales o acciones al portador", "Una empresa que cotiza en bolsa con divulgación de información", "Una entidad pública o una empresa del Estado", "Un plan de pensiones sin opción de rescate anticipado"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Circular UNIF N° 001125 de 2024, un cliente paga con cheques de varias personas, por encima del precio, y pide devolver la diferencia a otra cuenta. La conducta correcta es:", "o": ["Tratarlo como alertas combinadas y profundizar", "Aceptar, pues hay trazabilidad bancaria", "Devolver la diferencia a la cuenta indicada", "Cerrar la venta y luego consultar a la CIV"], "a": 0, "e": "Sección 3."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Según la LOCDOFT, deben detectarse las transacciones inusuales aun cuando tengan una justificación económica aparente.", "a": true, "e": "Art. 12. Trampa: se cree que la justificación aparente las excluye."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria cambia su estructura accionaria y, luego, la ONCDOFT detecta inconsistencias en la actualización. Los plazos son:", "o": ["30 días continuos y 5 hábiles para subsanar", "15 días continuos y 15 hábiles para subsanar", "5 días hábiles y 30 continuos para subsanar", "30 días hábiles y 15 continuos para subsanar"], "a": 0, "e": "Arts. 12 y 13."}]}, {"titulo": "Examen integral 2", "q": [{"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "La antigüedad del cliente justifica relajar los controles", "La condición de empresa regulada exime de los controles", "La autorización del oficial basta para relajar los controles"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, puede anularse el registro de quien cambió a una actividad no regulada por leyes de prevención de LC/FT/FPADM.", "a": true, "e": "Art. 14, num. 3. Trampa: se cree que solo procede por cierre o fallecimiento."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la gestión de primera línea es responsable de:", "o": ["Lograr los objetivos y gestionar sus riesgos", "Dar aseguramiento independiente al gobierno", "Aprobar el apetito de riesgo de la entidad", "Auditar los controles de la segunda línea"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: el aseguramiento independiente es de la tercera línea y el apetito lo fija el órgano de gobierno."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Penalización, extradición y asistencia técnica únicamente", "Prevención en el sector público y sanciones administrativas", "Cooperación entre unidades de inteligencia y extradición"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la Recomendación 18 del GAFI, citada en la guía, trata sobre:", "o": ["Controles internos y sucursales en el extranjero", "Países de mayor riesgo y sus contramedidas", "Reportes de operaciones sospechosas a la unidad", "Beneficiario final de las personas jurídicas"], "a": 0, "e": "Sección de referencias internacionales."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, en el Alcance de la Evaluación Nacional de Riesgo 2026, un riesgo relevante del sector es:", "o": ["La omisión de debida diligencia intensificada con PEP", "El exceso de reportes presentados de manera oportuna", "La excesiva supervisión diaria de cada corredor", "El uso obligatorio de cuentas bancarias en bolívares"], "a": 0, "e": "Marco legal nacional."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Según la LOCDOFT, un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Art. 32, numeral 4. Sanción de carácter reputacional."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, deben inscribirse directamente ante el órgano rector los sujetos obligados:", "o": ["Sin ley especial ni órgano de control propio", "Regulados por la Superintendencia de Valores", "Regulados por la Superintendencia de Bancos", "Con licencia vigente de un órgano sectorial"], "a": 0, "e": "Arts. 1, 2 y 3."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto terrorista se consume", "Basta que los fondos sean de origen ilícito", "Es necesario que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el sector inmobiliario ya no opera bajo un esquema exclusivamente civil o mercantil.", "a": true, "e": "Marco legal nacional."}, {"t": "mc", "q": "Según la Convención de Palermo, la «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Art. 18, párrafo 9. Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "Según el plan de supervisión incluido en la Evaluación Sectorial de Riesgos de la ONCDOFT de 2026, la supervisión basada en riesgo sustituye modelos de control de tipo:", "o": ["Formalista", "Tecnológico", "Preventivo", "Proporcional"], "a": 0, "e": "Sección I."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, un agente dice que la debida diligencia solo aplica al comprador porque «es quien paga». El error es que:", "o": ["La obligación abarca también al vendedor", "La obligación corresponde solo al notario", "El vendedor siempre está exento por ley", "La debida diligencia solo aplica al banco"], "a": 0, "e": "R.10 y Nota Interpretativa R.22."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según la Circular UNIF N° 001125 de 2024, el uso de empresas extranjeras para comprar inmuebles puede ser una señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la norma establece un único método obligatorio para calcular el riesgo inherente.", "a": false, "e": "La norma ofrece principios, un marco y un proceso, no un método único de cálculo. Trampa: se confunde un marco de referencia con una metodología cerrada."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las oficinas de registro y de las notarías, que intervienen en la compraventa de inmuebles, es:", "o": ["El Servicio Autónomo de Registros y Notarías", "La ONCDOFT, como órgano rector", "La Cámara Inmobiliaria de Venezuela", "El ministerio con competencia en vivienda"], "a": 0, "e": "Art. 7, numeral 7. Trampa: la Cámara es un gremio y la ONCDOFT es rectora."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, conforme a la Nota Interpretativa de la Recomendación 22, los agentes inmobiliarios deben cumplir la Recomendación 10 respecto de:", "o": ["Compradores y vendedores", "Compradores, que aportan los fondos", "Vendedores, que reciben los fondos", "Arrendatarios y arrendadores"], "a": 0, "e": "Terminología de la guía."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}]}, {"titulo": "Examen integral 3", "q": [{"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), se recomienda a los tres sectores aplicar debida diligencia reforzada a toda operación con PEP y:", "o": ["Transacciones inmobiliarias de alto valor", "Arrendamientos de vivienda de bajo canon", "Toda operación en moneda nacional pagada", "Operaciones entre familiares sin excepción"], "a": 0, "e": "Recomendaciones."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, uno de los accionistas de la inmobiliaria es una sociedad. La declaración debe:", "o": ["Llegar hasta el beneficiario final", "Limitarse a nombrar esa sociedad", "Llegar solo a su junta directiva", "Limitarse a accionistas locales"], "a": 0, "e": "Art. 5.2.b."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, el «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "mc", "q": "Según el plan de supervisión incluido en la Evaluación Sectorial de Riesgos de la ONCDOFT de 2026, la Fase I de implementación abarca:", "o": ["El segundo y tercer trimestre de 2026", "El primer y segundo trimestre de 2026", "El cuarto trimestre de 2026", "Los cuatro trimestres de 2026"], "a": 0, "e": "Fases de implementación. Trampa: el cuarto trimestre es la Fase II."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la Guía del GAFILAT para la construcción de matrices de riesgo de APNFD (2022), la regulación y supervisión de las APNFD se ubica en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Introducción."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una persona natural que ejerce como oficial de cumplimiento debe adjuntar constancia de inscripción en el registro de oficiales que lleva:", "o": ["El órgano rector", "La UNIF", "Su órgano de control sectorial", "El colegio profesional respectivo"], "a": 0, "e": "Art. 7, num. 2. Trampa: la constancia del órgano de control es otro requisito (num. 1)."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "vf", "q": "Según la Circular UNIF N° 001125 de 2024, una propiedad revendida tras una renovación sin fuente de financiación evidente constituye una señal de alerta.", "a": true, "e": "Sección 3."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe ser dinámica: anticipar, detectar y responder a los cambios del contexto.", "a": true, "e": "Apartado 4, principios. Trampa: se cree que la evaluación es un ejercicio único."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "Según la Circular UNIF N° 001125 de 2024, según el Código Civil citado en la circular, los inmuebles situados en Venezuela se rigen por las leyes venezolanas aunque tengan derechos extranjeros.", "a": true, "e": "Art. 10 del Código Civil."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la fusión de dos sujetos obligados que extingue la personalidad jurídica de uno de ellos puede justificar la anulación.", "a": true, "e": "Art. 14.4."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, la experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las Recomendaciones 3 y 36 a 40 del GAFI", "El Convenio de 1999 y la Recomendación 5 del GAFI", "La Convención Interamericana y la Recomendación 12", "Viena y las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo geográfico:", "o": ["Países con niveles significativos de corrupción", "Países con sistemas eficaces según evaluaciones mutuas", "Países con baja delincuencia según fuentes creíbles", "Países con seguimiento ordinario del GAFI"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: los otros son indicadores de menor riesgo o neutros."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), las calificaciones de la matriz sectorial deben leerse como:", "o": ["Exposición teórica, no ilícitos confirmados", "Prueba de ilícitos en los sujetos evaluados", "Sanciones administrativas ya aplicables", "Causales de cancelación del registro"], "a": 0, "e": "Sección de resultados."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la Cámara Inmobiliaria de Venezuela actúa como organismo de autorregulación del sector.", "a": true, "e": "Sección II.1."}]}, {"titulo": "Examen integral 4", "q": [{"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Según la Circular UNIF N° 001125 de 2024, según la circular, el estudio del GAFILAT de 2021 ubicó a los agentes inmobiliarios entre:", "o": ["Las entidades de mayor riesgo", "Las entidades de riesgo nulo", "Las entidades exentas de control", "Los órganos de la supervisión"], "a": 0, "e": "Estudio Integral del Sector de APNFD."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), aplicar debida diligencia reforzada a una transacción con PEP solo es exigible a partir de cierto monto.", "a": false, "e": "La recomendación es sin excepción de montos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Según la Circular UNIF N° 001125 de 2024, un cliente que paga con cheques de varios emisores sin explicación presenta la señal de:", "o": ["Pagos con fondos de distintas fuentes", "Administración regular de condominios", "Avalúo vigente de la propiedad vendida", "Financiamiento hipotecario supervisado"], "a": 0, "e": "Sección 3."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los sujetos obligados con órgano de control propio tramitan su registro directamente ante la ONCDOFT.", "a": false, "e": "Art. 3: el trámite es responsabilidad de su órgano o ente de control. Trampa: se cambia quién tramita."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el órgano rector revisa y valida la información de actualización dentro de treinta días continuos contados desde:", "o": ["La consignación del último recaudo", "La fecha del cambio notificado", "La notificación inicial del sujeto", "El cierre del mes respectivo"], "a": 0, "e": "Art. 13. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las PEP que abusan de su posición presentan un alto riesgo para el sector inmobiliario.", "a": true, "e": "Aplicación del EBR."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una sociedad inmobiliaria presenta un acta extranjera en castellano, sin apostilla. La ONCDOFT:", "o": ["La rechaza mientras no esté apostillada o legalizada", "La acepta por estar redactada en castellano", "La admite con traducción de intérprete público", "La recibe con certificación de un contador"], "a": 0, "e": "Art. 4."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "vf", "q": "Según la Circular UNIF N° 001125 de 2024, todas las funciones de un agente inmobiliario, por el solo hecho de serlo, activan los estándares del GAFI.", "a": false, "e": "La circular indica que no todas lo están."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "vf", "q": "Según la Recomendación 18 del GAFI, un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, ante inconsistencias en la actualización, el sujeto debe subsanar en un plazo de:", "o": ["Cinco días hábiles", "Quince días hábiles", "Treinta días continuos", "Diez días continuos"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, ¿qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "Art. 4, numeral 2. El análisis media entre ambas."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "Art. 36. La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la Cámara Inmobiliaria cuenta con un visado legal de las actuaciones de sus afiliados.", "a": false, "e": "Sección II.1: no cuenta con visado legal; su labor es de sensibilización y buenas prácticas. Trampa: el visado es propio de los contadores."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el seguimiento y la revisión del proceso de gestión del riesgo deben hacerse:", "o": ["En todas sus etapas, de forma planificada", "Al cierre de cada ejercicio económico", "Cuando se materializa un evento de pérdida", "Durante la auditoría externa anual"], "a": 0, "e": "Apartado 6.6. Trampa: limitarlo a un momento contradice el seguimiento continuo."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede requerir a los sujetos obligados información sobre transacciones que puedan vincularse con estos delitos, aunque no exista un reporte previo.", "a": true, "e": "Art. 25, numeral 2. Trampa: se cree que solo analiza lo que recibe por reporte."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Su escrutinio intensificado por la institución", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}]}, {"titulo": "Examen integral 5", "q": [{"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Se integraron las nueve especiales en las cuarenta", "Se redujeron de cuarenta a veinticinco en total", "Se convirtieron en un tratado vinculante para todos", "Se limitaron a las instituciones del sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando de bienes", "Extradición, asilo, refugio y asistencia judicial recíproca", "Soberanía, jurisdicción, territorio y competencia penal"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), los factores de riesgo de la matriz son clientes, productos y servicios, zona geográfica y:", "o": ["Canales de envío", "Capital social", "Número de socios", "Tipo de inmueble"], "a": 0, "e": "Sección III.2."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el poder de representación de una sociedad constituida en el país debe estar autenticado, o bien designarse un factor de comercio inscrito en el Registro Mercantil.", "a": true, "e": "Art. 5, num. 1, lit. b. Trampa: se cree que solo vale el poder."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de operaciones sospechosas debe presentarse con prontitud a la unidad de inteligencia financiera.", "a": true, "e": "R.20. Trampa: se cree que puede esperarse al cierre del mes."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria constituida en Venezuela e inscrita ante la ONCDOFT cambia de domicilio. Debe:", "o": ["Actualizar el registro dentro del plazo de treinta días", "Esperar la siguiente inspección para comunicarlo", "Comunicarlo solo en sus estados financieros anuales", "Solicitar la anulación del registro de la empresa"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventiv
