ón con exención."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}]}, {"titulo": "Enfoque basado en riesgo · modelo 3", "q": [{"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, son ejemplos de factores de mayor riesgo por producto o canal la banca privada y:", "o": ["Las relaciones o transacciones no presenciales", "Las cuentas de nómina de entidades públicas", "Los planes de pensiones de empleados", "Las pólizas de vida de prima baja"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "vf", "q": "Según la LOCDOFT, una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Art. 4, numeral 2. Esa es la secuencia lógica."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la tolerancia al riesgo, frente al apetito, es:", "o": ["La desviación aceptable respecto del apetito", "El riesgo máximo que la entidad puede soportar", "El riesgo que la entidad desea asumir", "El riesgo que queda tras los controles"], "a": 0, "e": "Trampa: el máximo soportable es la capacidad; el deseado, el apetito; el que queda, el residual."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el riesgo se define como:", "o": ["El efecto de la incertidumbre sobre los objetivos", "La probabilidad de que ocurra una pérdida económica", "La suma de las amenazas y vulnerabilidades conocidas", "El daño que causa un evento ya materializado"], "a": 0, "e": "Definición de la norma. Trampa: las otras confunden riesgo con pérdida o con sus componentes."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 6 del GAFI, confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Su monto reducido por cada operación", "El volumen total vendido en el año", "El país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, ¿cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, ¿por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación inusual debe reportarse de inmediato a la unidad de inteligencia, sin análisis previo.", "a": false, "e": "Lo inusual se analiza; se reporta lo que queda sin justificación razonable. Trampa: se salta el análisis."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Según la LOCDOFT, una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "Art. 4, numeral 2. La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, adaptar la gestión del riesgo al contexto externo e interno de la organización corresponde al principio de que sea:", "o": ["Adaptada", "Inclusiva", "Dinámica", "Integrada"], "a": 0, "e": "Apartado 4. Trampa: los otros también son principios, pero no ese."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, los pagos recibidos de terceros desconocidos o no asociados figuran entre los ejemplos de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que basta identificar al titular."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe basarse en la mejor información disponible, considerando sus limitaciones e incertidumbres.", "a": true, "e": "Apartado 4. Trampa: se cree que solo valen datos históricos completos."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Que se decida de forma informada y documentada", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la evaluación del riesgo comprende la identificación, el análisis y:", "o": ["La valoración", "El tratamiento", "La comunicación", "El registro"], "a": 0, "e": "Apartado 6.4. Trampa: el tratamiento viene después de la evaluación."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, entre los principios de la gestión del riesgo figura que esta sea:", "o": ["Integrada en todas las actividades de la organización", "Delegada por completo en el área de cumplimiento", "Realizada cuando lo exija el supervisor del sector", "Limitada a los riesgos de cuantía significativa"], "a": 0, "e": "Apartado 4: integrada, estructurada, adaptada, inclusiva y dinámica. Trampa: delegarla o limitarla contradice la integración."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), rendir cuentas a las partes interesadas por la supervisión de la organización corresponde a:", "o": ["El órgano de gobierno", "La primera línea", "La segunda línea", "La auditoría interna"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: la auditoría interna asegura al órgano de gobierno, pero no rinde cuentas en su lugar."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}]}]}, {"titulo": "Código de Ética de la CIV (2025) · modelos temáticos", "exams": [{"titulo": "Código de Ética de la CIV (2025) · modelo 1", "orden": true, "q": [{"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30, la denuncia debe incluir el número de afiliación cuando sea aplicable.", "a": true, "e": "La salvedad evita exigir el dato cuando no corresponda. Esto no elimina la identificación suficiente de las partes. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33, la admisión o negativa del recurso corresponde al comité de origen en el día hábil siguiente al vencimiento del lapso de interposición.", "a": true, "e": "El control de admisión es anterior a la remisión a la alzada. No se confunde con resolver el fondo del recurso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 11, el deber de lealtad al cliente permite un trato deshonesto hacia la contraparte si ayuda a cerrar el negocio.", "a": false, "e": "La protección de los intereses legítimos debe coexistir con trato justo y honesto hacia todas las partes. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 11."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, el régimen de faltas solo alcanza acciones, aunque el incumplimiento consista en omitir una gestión exigida.", "a": false, "e": "Los afiliados responden también por omisiones contrarias a las normas gremiales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4, una persona jurídica puede ser profesional inmobiliario para efectos del Código.", "a": true, "e": "La definición no se limita a personas naturales y atiende a la participación en el desarrollo inmobiliario de acuerdo con los estatutos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, poner en riesgo intereses del cliente al aceptar un encargo sin competencia es un ejemplo de falta grave.", "a": true, "e": "La clasificación atiende tanto a la falta de pericia como al perjuicio potencial para el cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5, la actualización profesional se limita a cambios legislativos y excluye condiciones del mercado y nuevas tecnologías.", "a": false, "e": "La formación continua comprende esos tres ámbitos porque todos inciden en la competencia profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13, usar información confiada por el cliente para beneficiar a un tercero puede infringir el deber aunque no se divulgue públicamente.", "a": true, "e": "El Código regula tanto revelar como utilizar en beneficio propio o de terceros. La omisión de una publicación no sana el uso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35, la prescripción solo se cuenta desde el hecho y jamás desde que lo conoce el afectado.", "a": false, "e": "El Código contempla como referencia la ocurrencia o el conocimiento por el afectado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20, la cooperación entre profesionales debe respetar los intereses del cliente aunque el reparto se haya acordado.", "a": true, "e": "Un acuerdo económico entre colegas no desplaza el deber frente al cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27, el fallo del Consejo Superior como alzada agota la vía gremial.", "a": true, "e": "Ese carácter se refiere a su función de segunda instancia. No convierte al órgano en receptor de toda primera denuncia. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17, el Código obliga sin excepción a presentar toda oferta exclusivamente por escrito.", "a": false, "e": "La regla exige presentación objetiva, veraz y sin demora. La escritura se señala como preferible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34, una denuncia contra quien integra un órgano de gobierno nacional de la CIV se lleva directamente al Comité Disciplinario Nacional.", "a": true, "e": "La asignación especial evita radicar ese asunto en la estructura estadal por defecto. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9, el contenido digital debe identificar claramente la condición de profesional inmobiliario.", "a": true, "e": "La transparencia digital abarca la veracidad del contenido y también cómo se presenta la persona que ofrece el servicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19, una crítica falsa a otro profesional y la captación de una exclusiva ajena se examinan bajo deberes diferenciados.", "a": true, "e": "El primer hecho afecta competencia leal y respeto. El segundo se relaciona con un mandato exclusivo vigente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, un interés económico de un familiar directo del agente en el proyecto debe revelarse a las partes involucradas.", "a": true, "e": "La regla considera vínculos económicos indirectos por familiares directos o por la empresa del profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27, cada órgano de aplicación puede ejercer indistintamente la misma competencia sancionatoria.", "a": false, "e": "La lista de órganos no uniforma competencias. El Código asigna funciones por instancia y tipo de asunto. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a, solo la comisión debe pactarse por escrito; los gastos y costos quedan fuera del deber.", "a": false, "e": "La exigencia abarca honorarios, comisiones, costos y gastos, con descripción del servicio y forma de cálculo. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43, la juramentación se reserva a la afiliación inicial y excluye la ratificación.", "a": false, "e": "El deber se prevé al afiliarse o ratificarse. Desconocer el Código no exime de cumplirlo. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16, el mandato exclusivo libera al profesional de cooperar con colegas aunque la cooperación favorezca a su cliente.", "a": false, "e": "El mandato exige esfuerzo diligente y cooperación orientada a lograr la negociación en beneficio del cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23, las contribuciones especiales fijadas por la estructura gremial no aparecen entre los deberes con la Cámara.", "a": false, "e": "El artículo incluye el pago puntual de cuotas ordinarias y contribuciones especiales establecidas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32, una decisión disciplinaria puede omitir su fundamento jurídico si identifica a las partes.", "a": false, "e": "La identificación y el fundamento son componentes distintos. La decisión debe contener ambos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38, el deber de divulgar el Código se satisface guardándolo exclusivamente en expedientes reservados.", "a": false, "e": "Debe mantenerse visible en las páginas institucionales y difundirse también mediante formación. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 2, las interacciones con colegas quedan fuera del Código si aún no existe un contrato con el cliente.", "a": false, "e": "La regla ética alcanza al público, colegas, clientes y propia institución. La falta de contrato con un cliente no excluye el trato entre colegas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 2."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10, la orientación sobre eficiencia energética se presta en la medida de las posibilidades del profesional.", "a": true, "e": "El artículo promueve asesoramiento y prácticas sostenibles. El alcance queda vinculado a las posibilidades de quien presta el servicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c, considera este caso. Una firma custodia un depósito y quiere usarlo unos días para gastos de oficina. ¿Qué afirmación es correcta?", "o": ["El depósito se destina al fin pactado", "El uso temporal está permitido si se devuelve el dinero", "El carácter reembolsable permite mezclar destinos"], "a": 0, "e": "El deber fiduciario impide desviar fondos incluso temporalmente. La obligación de informar qué se recibió y desembolsó sigue siendo exigible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 29, considera este caso. El Comité propone mediación y las partes no consiguen acordar. ¿Qué afirmación es correcta?", "o": ["La mediación se promueve antes del procedimiento formal", "La mediación concluye necesariamente con sanción", "El desacuerdo obliga a archivar el asunto"], "a": 0, "e": "La mediación es voluntaria y facilita un acuerdo, pero el desacuerdo deja disponible el procedimiento formal. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 29."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 7–8, considera este caso. Un agente revisa un proceso de recepción de clientes que identifica fraudes, pero discrimina por nacionalidad. ¿Qué afirmación es correcta?", "o": ["El Código exige procurar prevenir su participación en fraudes", "La finalidad antifraude convalida excluir por nacionalidad", "La obligación preventiva solo opera después del cierre"], "a": 0, "e": "La prevención de ilícitos y el trato no discriminatorio operan a la vez. Una política preventiva no justifica el motivo de exclusión descrito. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 7–8."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, considera este caso. El agente quiere representar a las dos partes con intereses contrapuestos y su empresa tiene interés económico en el inmueble. ¿Qué afirmación es correcta?", "o": ["Requiere consentimiento informado y escrito de todas las partes para la doble representación", "Basta obtener el consentimiento verbal del vendedor", "Puede omitir la revelación mientras no cobre la comisión"], "a": 0, "e": "Son dos conflictos distintos. La doble representación exige consentimiento de todas las partes y el interés directo debe revelarse antes de confiar en su juicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33, considera este caso. Una parte quiere apelar una decisión que acaba de notificarse formalmente. ¿Qué afirmación es correcta?", "o": ["El lapso se cuenta desde el día hábil siguiente", "Dispone de cinco días continuos ante el órgano de alzada", "Debe apelarse directamente ante la Junta Directiva de la CIV"], "a": 0, "e": "El recurso se interpone ante el órgano de origen dentro de cinco días hábiles. Una vez admitido se remite a la alzada competente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una agencia prepara publicidad con una imagen antigua y solo tiene autorización verbal. ¿Qué afirmación es correcta?", "o": ["Debe obtener autorización expresa y escrita del legitimado", "La autorización verbal basta si el inmueble existe", "Una imagen engañosa es admisible si fue verdadera en el pasado"], "a": 0, "e": "El permiso para anunciar y la veracidad del material son exigencias distintas. La antigüedad de una foto no excusa inducir a error. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9, considera este caso. Una firma usa IA para redactar anuncios y tratar información de clientes. ¿Qué afirmación es correcta?", "o": ["Debe cuidar la veracidad del contenido generado", "Delegar la redacción libera del deber de veracidad", "Los estándares profesionales se reducen en redes sociales"], "a": 0, "e": "El entorno digital mantiene las exigencias éticas. La automatización añade el deber de cuidar veracidad, privacidad y resultados no discriminatorios. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Se revisan dos casos: captación de una exclusiva ajena y demora injustificada en comunicar que no causó daño significativo. ¿Qué afirmación es correcta?", "o": ["Captar el mandato exclusivo ajeno es un ejemplo de falta grave", "El retraso sin daño significativo siempre implica expulsión", "La captación de una exclusiva ajena es solo descortesía"], "a": 0, "e": "El primero afecta un compromiso contractual conocido. La demora sin daño significativo figura como ejemplo de infracción leve. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13, considera este caso. Tras concluir el contrato, un profesional prepara un archivo de advertencias y datos del antiguo cliente. ¿Qué afirmación es correcta?", "o": ["Conviene dejar por escrito advertencias de especial trascendencia", "La reserva concluye con el último pago del encargo", "Las advertencias relevantes siempre se comunican únicamente de palabra"], "a": 0, "e": "El Código procura constancia escrita para advertencias importantes y mantiene el secreto indefinidamente. Terminar el encargo no permite reutilizar los datos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17, considera este caso. Hay una contraoferta y el propietario acaba de aceptar otra oferta. ¿Qué afirmación es correcta?", "o": ["La presentación de ofertas y contraofertas debe ser objetiva y sin demora", "Solo se comunica una contraoferta si supera el precio inicial", "La promoción continúa por regla hasta protocolizar"], "a": 0, "e": "El deber de informar cubre ofertas y contraofertas. El hecho que activa la suspensión es la aceptación del propietario. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19, considera este caso. Un agente conoce la exclusiva ajena y, además, tiene una queja de mala praxis contra el colega. ¿Qué afirmación es correcta?", "o": ["La negociación del inmueble se canaliza por el mandatario", "Puede captar directamente al cliente si mejora la comisión", "Debe canalizar la queja primero mediante comentarios públicos"], "a": 0, "e": "La exclusiva vigente impide el contacto con intención de captar ese mandato. El canal formal de queja protege la tramitación de la denuncia. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20, considera este caso. Dos profesionales colaboran y piensan negociar el reparto de honorarios después del cierre. ¿Qué afirmación es correcta?", "o": ["El reparto debe fijarse previamente", "El cierre debe ocurrir antes de acordar la proporción", "La colaboración autoriza un reparto unilateral posterior"], "a": 0, "e": "El acuerdo previo evita disputas durante el encargo. La distribución ha de hacerse oportunamente conforme a lo pactado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2, considera este caso. Una empresa afiliada a una Cámara Estadal sostiene que el Código solo obliga a corredores que sean personas naturales. ¿Qué afirmación es correcta?", "o": ["El ámbito incluye personas jurídicas afiliadas", "Se limita a los corredores como personas naturales", "La sede regional excluye la aplicación del Código"], "a": 0, "e": "El factor determinante es la afiliación comprendida en el artículo 2. El Código rige interacciones con clientes, colegas, público e institución. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44, considera este caso. Un afiliado invoca desconocimiento y presenta una regla ética anterior incompatible con el Código. ¿Qué afirmación es correcta?", "o": ["El desconocimiento no excusa su cumplimiento", "La regla anterior prevalece por ser conocida", "La ratificación del afiliado es condición para que rija el Código"], "a": 0, "e": "La vigencia se vincula con la aprobación y publicación por el Consejo Superior. El deber de juramentarse no permite al afiliado escoger una edición previa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 41–42, considera este caso. El Comité enfrenta un vacío procesal y se discute si cabe actualizar el Código antes de cuatro años. ¿Qué afirmación es correcta?", "o": ["LOPA y CPC tienen aplicación supletoria en la sustanciación y decisión", "El plazo de cuatro años impide cualquier revisión anticipada", "El reglamento de RUSO sustituye al Código cuando calla"], "a": 0, "e": "La supletoriedad resuelve vacíos procedimentales. La revisión del texto puede anticiparse por necesidades de la profesión o el mercado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 41–42."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34, considera este caso. Se presentan quejas contra un directivo de un capítulo inmobiliario y contra otro de una Cámara Estadal. ¿Qué afirmación es correcta?", "o": ["La de un directivo del capítulo se lleva al Comité Estadal", "Ambas deben juzgarse primero dentro del mismo órgano del denunciado", "La queja contra el directivo estadal se presenta ante el capítulo"], "a": 0, "e": "El régimen especial desplaza la competencia a la instancia superior para preservar imparcialidad. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30, considera este caso. Un afiliado presenta una denuncia por escrito solo con una frase genérica y sin identificar al denunciado. ¿Qué afirmación es correcta?", "o": ["Se dirige a la Junta Directiva que corresponda", "La denuncia se presenta inicialmente ante la UNIF", "La identidad del denunciado es irrelevante en la solicitud"], "a": 0, "e": "El artículo prevé una denuncia escrita con elementos mínimos que permitan tramitarla. El órgano receptor y la identificación cumplen funciones distintas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b, considera este caso. Una agente fija verbalmente su comisión y solo entregará cuentas al cerrar. ¿Qué afirmación es correcta?", "o": ["Debe pactar por escrito la comisión y su cálculo", "Un resumen verbal único satisface el pacto de honorarios", "Las cuentas solo se presentan después del cierre"], "a": 0, "e": "El pacto de honorarios documenta condiciones y el estado de cuentas muestra movimientos de fondos. Uno no reemplaza al otro. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16, considera este caso. Una inmobiliaria acepta exclusividad sin plazo escrito y deja de promocionar el inmueble. ¿Qué afirmación es correcta?", "o": ["La duración debe determinarse por escrito", "La exclusividad hace opcional la promoción", "El mandato permanece indefinidamente por silencio"], "a": 0, "e": "La exclusividad no es una reserva pasiva del cliente. Va acompañada de duración escrita y diligencia verificable. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32, considera este caso. El Comité necesita interpretar una cuestión de Derecho y ya cuenta con correos de contacto de las partes. ¿Qué afirmación es correcta?", "o": ["Puede pedir opinión no vinculante a Consultoría Jurídica", "Consultoría Jurídica dicta el fallo que obliga al Comité", "La notificación solo puede efectuarse personalmente"], "a": 0, "e": "La opinión apoya la motivación y no desplaza al decisor. El Código prevé la notificación formal electrónica. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27, considera este caso. Se dicta una decisión en primera instancia por un Comité Disciplinario Estadal. ¿Qué afirmación es correcta?", "o": ["La estructura prevé alzada disciplinaria nacional", "El comité estadal actúa como alzada de su propio fallo", "La Consultoría Jurídica reemplaza a la alzada"], "a": 0, "e": "La competencia sigue el nivel que decidió. El Comité Nacional revisa decisiones estadales y el Consejo Superior conoce la alzada que le corresponde frente a decisiones nacionales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12, considera este caso. Un agente propone informar al cliente solo las ventajas de la compra para evitar que desista. ¿Qué afirmación es correcta?", "o": ["Debe exponer riesgos y desventajas relevantes", "La lealtad permite ocultar riesgos al propio cliente", "El asesoramiento se limita a respaldar la decisión del cliente"], "a": 0, "e": "La decisión informada necesita ventajas y riesgos. Proteger los intereses legítimos del cliente no habilita sesgar la información ni tratar injustamente a terceros. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Un anuncio presenta un error menor sin daño y otro usa a sabiendas imágenes engañosas. ¿Qué afirmación es correcta?", "o": ["El primer supuesto encaja en el ejemplo de falta leve", "Todo error publicitario se considera falta muy grave", "La alteración deliberada se trata igual que una inexactitud menor"], "a": 0, "e": "La clasificación atiende a los hechos. El Código diferencia la inexactitud menor sin perjuicio de la publicidad deliberadamente engañosa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5, considera este caso. Una agente recibe un encargo especializado que supera su pericia. ¿Qué afirmación es correcta?", "o": ["Debe abstenerse de aceptar el encargo sin la pericia necesaria", "Advertir su inexperiencia vuelve suficiente la aceptación", "La certificación reemplaza la actualización profesional"], "a": 0, "e": "El deber de competencia incluye tanto el límite al asumir encargos como la formación continua. Una advertencia no aporta la pericia que falta. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una firma toma un video de otro creador y modifica las cifras del inmueble. ¿Qué afirmación es correcta?", "o": ["El material ajeno requiere autorización y crédito", "Dar crédito basta aunque falte autorización", "El estilo publicitario permite variar datos deliberadamente"], "a": 0, "e": "Crédito y autorización son acumulativos. Los metros, estatus u otros hechos no pueden alterarse para mejorar la promoción. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}]}, {"titulo": "Código de Ética de la CIV (2025) · modelo 2", "orden": true, "q": [{"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38, el deber de divulgar el Código se satisface guardándolo exclusivamente en expedientes reservados.", "a": false, "e": "Debe mantenerse visible en las páginas institucionales y difundirse también mediante formación. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35, la prescripción solo se cuenta desde el hecho y jamás desde que lo conoce el afectado.", "a": false, "e": "El Código contempla como referencia la ocurrencia o el conocimiento por el afectado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43, la juramentación se reserva a la afiliación inicial y excluye la ratificación.", "a": false, "e": "El deber se prevé al afiliarse o ratificarse. Desconocer el Código no exime de cumplirlo. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19, una crítica falsa a otro profesional y la captación de una exclusiva ajena se examinan bajo deberes diferenciados.", "a": true, "e": "El primer hecho afecta competencia leal y respeto. El segundo se relaciona con un mandato exclusivo vigente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, el régimen de faltas solo alcanza acciones, aunque el incumplimiento consista en omitir una gestión exigida.", "a": false, "e": "Los afiliados responden también por omisiones contrarias a las normas gremiales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32, una decisión disciplinaria puede omitir su fundamento jurídico si identifica a las partes.", "a": false, "e": "La identificación y el fundamento son componentes distintos. La decisión debe contener ambos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20, la cooperación entre profesionales debe respetar los intereses del cliente aunque el reparto se haya acordado.", "a": true, "e": "Un acuerdo económico entre colegas no desplaza el deber frente al cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, poner en riesgo intereses del cliente al aceptar un encargo sin competencia es un ejemplo de falta grave.", "a": true, "e": "La clasificación atiende tanto a la falta de pericia como al perjuicio potencial para el cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4, una persona jurídica puede ser profesional inmobiliario para efectos del Código.", "a": true, "e": "La definición no se limita a personas naturales y atiende a la participación en el desarrollo inmobiliario de acuerdo con los estatutos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, un colega mandatario con exclusiva puede autorizar por escrito que se anuncie la propiedad.", "a": true, "e": "El propietario no es la única persona autorizante contemplada. El mandato exclusivo permite la autorización expresamente prevista. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23, las contribuciones especiales fijadas por la estructura gremial no aparecen entre los deberes con la Cámara.", "a": false, "e": "El artículo incluye el pago puntual de cuotas ordinarias y contribuciones especiales establecidas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 8, la prohibición de discriminación se aplica a clientes actuales, pero no a quienes todavía solicitan un servicio.", "a": false, "e": "El criterio es la prestación de servicios. Condicionar su acceso por un motivo prohibido cae dentro del ámbito. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 8."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33, la admisión o negativa del recurso corresponde al comité de origen en el día hábil siguiente al vencimiento del lapso de interposición.", "a": true, "e": "El control de admisión es anterior a la remisión a la alzada. No se confunde con resolver el fondo del recurso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17, el Código obliga sin excepción a presentar toda oferta exclusivamente por escrito.", "a": false, "e": "La regla exige presentación objetiva, veraz y sin demora. La escritura se señala como preferible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34, una denuncia contra quien integra un órgano de gobierno nacional de la CIV se lleva directamente al Comité Disciplinario Nacional.", "a": true, "e": "La asignación especial evita radicar ese asunto en la estructura estadal por defecto. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9, el contenido digital debe identificar claramente la condición de profesional inmobiliario.", "a": true, "e": "La transparencia digital abarca la veracidad del contenido y también cómo se presenta la persona que ofrece el servicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, un interés económico de un familiar directo del agente en el proyecto debe revelarse a las partes involucradas.", "a": true, "e": "La regla considera vínculos económicos indirectos por familiares directos o por la empresa del profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27, el fallo del Consejo Superior como alzada agota la vía gremial.", "a": true, "e": "Ese carácter se refiere a su función de segunda instancia. No convierte al órgano en receptor de toda primera denuncia. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 36, para inhibir o recusar se consideran las causales del Código de Procedimiento Civil.", "a": true, "e": "La remisión sirve para decidir la imparcialidad de quienes integran el Comité. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 36."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10, la orientación sobre eficiencia energética se presta en la medida de las posibilidades del profesional.", "a": true, "e": "El artículo promueve asesoramiento y prácticas sostenibles. El alcance queda vinculado a las posibilidades de quien presta el servicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13, usar información confiada por el cliente para beneficiar a un tercero puede infringir el deber aunque no se divulgue públicamente.", "a": true, "e": "El Código regula tanto revelar como utilizar en beneficio propio o de terceros. La omisión de una publicación no sana el uso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27, cada órgano de aplicación puede ejercer indistintamente la misma competencia sancionatoria.", "a": false, "e": "La lista de órganos no uniforma competencias. El Código asigna funciones por instancia y tipo de asunto. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30, la denuncia debe incluir el número de afiliación cuando sea aplicable.", "a": true, "e": "La salvedad evita exigir el dato cuando no corresponda. Esto no elimina la identificación suficiente de las partes. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5, la actualización profesional se limita a cambios legislativos y excluye condiciones del mercado y nuevas tecnologías.", "a": false, "e": "La formación continua comprende esos tres ámbitos porque todos inciden en la competencia profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16, el mandato exclusivo libera al profesional de cooperar con colegas aunque la cooperación favorezca a su cliente.", "a": false, "e": "El mandato exige esfuerzo diligente y cooperación orientada a lograr la negociación en beneficio del cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13, considera este caso. Tras concluir el contrato, un profesional prepara un archivo de advertencias y datos del antiguo cliente. ¿Qué afirmación es correcta?", "o": ["El fin del contrato no extingue la confidencialidad", "La reserva concluye con el último pago del encargo", "Las advertencias relevantes siempre se comunican únicamente de palabra"], "a": 0, "e": "El Código procura constancia escrita para advertencias importantes y mantiene el secreto indefinidamente. Terminar el encargo no permite reutilizar los datos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33, considera este caso. La alzada recibe un expediente tras admitirse una apelación. ¿Qué afirmación es correcta?", "o": ["Su lapso ordinario es de quince días hábiles prorrogables por quince más", "El órgano revisa solo si la decisión fue notificada", "La decisión de alzada tiene un plazo de quince días continuos improrrogables"], "a": 0, "e": "El alcance de la revisión incluye el contenido del fallo. El plazo de alzada se distingue del lapso para interponer el recurso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c, considera este caso. Una firma custodia un depósito y quiere usarlo unos días para gastos de oficina. ¿Qué afirmación es correcta?", "o": ["La firma debe poder rendir cuentas detalladas al cliente", "El uso temporal está permitido si se devuelve el dinero", "El carácter reembolsable permite mezclar destinos"], "a": 0, "e": "El deber fiduciario impide desviar fondos incluso temporalmente. La obligación de informar qué se recibió y desembolsó sigue siendo exigible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30, considera este caso. Un afiliado presenta una denuncia por escrito solo con una frase genérica y sin identificar al denunciado. ¿Qué afirmación es correcta?", "o": ["Debe identificar suficientemente a las partes", "La denuncia se presenta inicialmente ante la UNIF", "La identidad del denunciado es irrelevante en la solicitud"], "a": 0, "e": "El artículo prevé una denuncia escrita con elementos mínimos que permitan tramitarla. El órgano receptor y la identificación cumplen funciones distintas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, considera este caso. El agente quiere representar a las dos partes con intereses contrapuestos y su empresa tiene interés económico en el inmueble. ¿Qué afirmación es correcta?", "o": ["Debe revelar plenamente el interés económico a los involucrados", "Basta obtener el consentimiento verbal del vendedor", "Puede omitir la revelación mientras no cobre la comisión"], "a": 0, "e": "Son dos conflictos distintos. La doble representación exige consentimiento de todas las partes y el interés directo debe revelarse antes de confiar en su juicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 41–42, considera este caso. El Comité enfrenta un vacío procesal y se discute si cabe actualizar el Código antes de cuatro años. ¿Qué afirmación es correcta?", "o": ["Las circunstancias pueden justificar una revisión antes de cuatro años", "El plazo de cuatro años impide cualquier revisión anticipada", "El reglamento de RUSO sustituye al Código cuando calla"], "a": 0, "e": "La supletoriedad resuelve vacíos procedimentales. La revisión del texto puede anticiparse por necesidades de la profesión o el mercado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 41–42."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Un anuncio presenta un error menor sin daño y otro usa a sabiendas imágenes engañosas. ¿Qué afirmación es correcta?", "o": ["El uso deliberado de material engañoso encaja en falta grave", "Todo error publicitario se considera falta muy grave", "La alteración deliberada se trata igual que una inexactitud menor"], "a": 0, "e": "La clasificación atiende a los hechos. El Código diferencia la inexactitud menor sin perjuicio de la publicidad deliberadamente engañosa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17, considera este caso. Hay una contraoferta y el propietario acaba de aceptar otra oferta. ¿Qué afirmación es correcta?", "o": ["La aceptación exige suspender promoción y visitas", "Solo se comunica una contraoferta si supera el precio inicial", "La promoción continúa por regla hasta protocolizar"], "a": 0, "e": "El deber de informar cubre ofertas y contraofertas. El hecho que activa la suspensión es la aceptación del propietario. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16, considera este caso. Una inmobiliaria acepta exclusividad sin plazo escrito y deja de promocionar el inmueble. ¿Qué afirmación es correcta?", "o": ["El mandato exige esfuerzos de promoción demostrables", "La exclusividad hace opcional la promoción", "El mandato permanece indefinidamente por silencio"], "a": 0, "e": "La exclusividad no es una reserva pasiva del cliente. Va acompañada de duración escrita y diligencia verificable. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9, considera este caso. Una firma usa IA para redactar anuncios y tratar información de clientes. ¿Qué afirmación es correcta?", "o": ["Debe proteger la confidencialidad al usar la herramienta", "Delegar la redacción libera del deber de veracidad", "Los estándares profesionales se reducen en redes sociales"], "a": 0, "e": "El entorno digital mantiene las exigencias éticas. La automatización añade el deber de cuidar veracidad, privacidad y resultados no discriminatorios. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27, considera este caso. Se dicta una decisión en primera instancia por un Comité Disciplinario Estadal. ¿Qué afirmación es correcta?", "o": ["El Consejo Superior actúa como alzada de decisiones del Comité Nacional", "El comité estadal actúa como alzada de su propio fallo", "La Consultoría Jurídica reemplaza a la alzada"], "a": 0, "e": "La competencia sigue el nivel que decidió. El Comité Nacional revisa decisiones estadales y el Consejo Superior conoce la alzada que le corresponde frente a decisiones nacionales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33, considera este caso. Una parte quiere apelar una decisión que acaba de notificarse formalmente. ¿Qué afirmación es correcta?", "o": ["La apelación se interpone ante el comité que dictó la decisión", "Dispone de cinco días continuos ante el órgano de alzada", "Debe apelarse directamente ante la Junta Directiva de la CIV"], "a": 0, "e": "El recurso se interpone ante el órgano de origen dentro de cinco días hábiles. Una vez admitido se remite a la alzada competente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34, considera este caso. Se presentan quejas contra un directivo de un capítulo inmobiliario y contra otro de una Cámara Estadal. ¿Qué afirmación es correcta?", "o": ["La de un directivo estadal se lleva al Comité Nacional", "Ambas deben juzgarse primero dentro del mismo órgano del denunciado", "La queja contra el directivo estadal se presenta ante el capítulo"], "a": 0, "e": "El régimen especial desplaza la competencia a la instancia superior para preservar imparcialidad. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 40, considera este caso. Hay una amonestación firme y una suspensión firme impuestas a distintos afiliados. ¿Qué afirmación es correcta?", "o": ["La suspensión se comunica a la estructura gremial", "Ambas deben divulgarse al público general", "La amonestación se notifica a toda la estructura gremial"], "a": 0, "e": "La divulgación es proporcional. La amonestación es privada, la suspensión tiene alcance gremial y la expulsión firme se publica. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 40."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44, considera este caso. Un afiliado invoca desconocimiento y presenta una regla ética anterior incompatible con el Código. ¿Qué afirmación es correcta?", "o": ["La edición de 2025 deroga normativa ética anterior nacional o estadal", "La regla anterior prevalece por ser conocida", "La ratificación del afiliado es condición para que rija el Código"], "a": 0, "e": "La vigencia se vincula con la aprobación y publicación por el Consejo Superior. El deber de juramentarse no permite al afiliado escoger una edición previa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 28, considera este caso. Un afiliado pide orientación antes de actuar en un asunto éticamente dudoso. ¿Qué afirmación es correcta?", "o": ["La consulta se formula con carácter confidencial", "Debe presentar una denuncia contenciosa contra sí mismo", "La consulta se tramita mediante un anuncio al gremio"], "a": 0, "e": "La consulta ética es preventiva. Su vía escrita y confidencial no equivale a iniciar un expediente sancionatorio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 28."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 35–37, considera este caso. Se cuestiona la prescripción y el denunciado integra el Comité que conocería el caso. ¿Qué afirmación es correcta?", "o": ["El miembro denunciado debe inhibirse inmediatamente", "El plazo es el de cinco días hábiles de la apelación", "El miembro puede intervenir hasta que se compruebe la infracción"], "a": 0, "e": "La prescripción limita el inicio de la acción. La inhibición protege la imparcialidad desde la denuncia y se convoca al suplente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 35–37."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Se revisan dos casos: captación de una exclusiva ajena y demora injustificada en comunicar que no causó daño significativo. ¿Qué afirmación es correcta?", "o": ["La demora descrita puede constituir falta leve", "El retraso sin daño significativo siempre implica expulsión", "La captación de una exclusiva ajena es solo descortesía"], "a": 0, "e": "El primero afecta un compromiso contractual conocido. La demora sin daño significativo figura como ejemplo de infracción leve. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una firma toma un video de otro creador y modifica las cifras del inmueble. ¿Qué afirmación es correcta?", "o": ["La información factual debe ser veraz", "Dar crédito basta aunque falte autorización", "El estilo publicitario permite variar datos deliberadamente"], "a": 0, "e": "Crédito y autorización son acumulativos. Los metros, estatus u otros hechos no pueden alterarse para mejorar la promoción. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12, considera este caso. Un agente propone informar al cliente solo las ventajas de la compra para evitar que desista. ¿Qué afirmación es correcta?", "o": ["La lealtad exige trato justo con las demás partes", "La lealtad permite ocultar riesgos al propio cliente", "El asesoramiento se limita a respaldar la decisión del cliente"], "a": 0, "e": "La decisión informada necesita ventajas y riesgos. Proteger los intereses legítimos del cliente no habilita sesgar la información ni tratar injustamente a terceros. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2, considera este caso. Una empresa afiliada a una Cámara Estadal sostiene que el Código solo obliga a corredores que sean personas naturales. ¿Qué afirmación es correcta?", "o": ["También alcanza a las afiliadas por la estructura estadal", "Se limita a los corredores como personas naturales", "La sede regional excluye la aplicación del Código"], "a": 0, "e": "El factor determinante es la afiliación comprendida en el artículo 2. El Código rige interacciones con clientes, colegas, público e institución. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b, considera este caso. Una agente fija verbalmente su comisión y solo entregará cuentas al cerrar. ¿Qué afirmación es correcta?", "o": ["Debe dar cuentas periódicamente y cuando se le soliciten", "Un resumen verbal único satisface el pacto de honorarios", "Las cuentas solo se presentan después del cierre"], "a": 0, "e": "El pacto de honorarios documenta condiciones y el estado de cuentas muestra movimientos de fondos. Uno no reemplaza al otro. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 7–8, considera este caso. Un agente revisa un proceso de recepción de clientes que identifica fraudes, pero discrimina por nacionalidad. ¿Qué afirmación es correcta?", "o": ["El filtro discriminatorio vulnera el deber de atención", "La finalidad antifraude convalida excluir por nacionalidad", "La obligación preventiva solo opera después del cierre"], "a": 0, "e": "La prevención de ilícitos y el trato no discriminatorio operan a la vez. Una política preventiva no justifica el motivo de exclusión descrito. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 7–8."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una agencia prepara publicidad con una imagen antigua y solo tiene autorización verbal. ¿Qué afirmación es correcta?", "o": ["La imagen debe reflejar fielmente el estado real actual", "La autorización verbal basta si el inmueble existe", "Una imagen engañosa es admisible si fue verdadera en el pasado"], "a": 0, "e": "El permiso para anunciar y la veracidad del material son exigencias distintas. La antigüedad de una foto no excusa inducir a error. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 39–40, considera este caso. Se quiere publicar el expediente mientras se investiga y divulgar una expulsión cuando quede definitivamente firme. ¿Qué afirmación es correcta?", "o": ["La expulsión firme es pública", "La publicidad de la expulsión permite publicar el expediente abierto", "Toda sanción firme queda reservada al comité"], "a": 0, "e": "La reserva del procedimiento y la publicidad de ciertas sanciones son reglas distintas. La divulgación depende de firmeza y gravedad. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 39–40."}]}, {"titulo": "Código de Ética de la CIV (2025) · modelo 3", "orden": true, "q": [{"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, el régimen de faltas solo alcanza acciones, aunque el incumplimiento consista en omitir una gestión exigida.", "a": false, "e": "Los afiliados responden también por omisiones contrarias a las normas gremiales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 2, las interacciones con colegas quedan fuera del Código si aún no existe un contrato con el cliente.", "a": false, "e": "La regla ética alcanza al público, colegas, clientes y propia institución. La falta de contrato con un cliente no excluye el trato entre colegas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 2."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35, la prescripción solo se cuenta desde el hecho y jamás desde que lo conoce el afectado.", "a": false, "e": "El Código contempla como referencia la ocurrencia o el conocimiento por el afectado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 35."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16, el mandato exclusivo libera al profesional de cooperar con colegas aunque la cooperación favorezca a su cliente.", "a": false, "e": "El mandato exige esfuerzo diligente y cooperación orientada a lograr la negociación en beneficio del cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 16."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30, la denuncia debe incluir el número de afiliación cuando sea aplicable.", "a": true, "e": "La salvedad evita exigir el dato cuando no corresponda. Esto no elimina la identificación suficiente de las partes. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 30."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13, usar información confiada por el cliente para beneficiar a un tercero puede infringir el deber aunque no se divulgue públicamente.", "a": true, "e": "El Código regula tanto revelar como utilizar en beneficio propio o de terceros. La omisión de una publicación no sana el uso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 13."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 11, el deber de lealtad al cliente permite un trato deshonesto hacia la contraparte si ayuda a cerrar el negocio.", "a": false, "e": "La protección de los intereses legítimos debe coexistir con trato justo y honesto hacia todas las partes. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 11."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33, la admisión o negativa del recurso corresponde al comité de origen en el día hábil siguiente al vencimiento del lapso de interposición.", "a": true, "e": "El control de admisión es anterior a la remisión a la alzada. No se confunde con resolver el fondo del recurso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 36, para inhibir o recusar se consideran las causales del Código de Procedimiento Civil.", "a": true, "e": "La remisión sirve para decidir la imparcialidad de quienes integran el Comité. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 36."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43, la juramentación se reserva a la afiliación inicial y excluye la ratificación.", "a": false, "e": "El deber se prevé al afiliarse o ratificarse. Desconocer el Código no exime de cumplirlo. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 43."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, un colega mandatario con exclusiva puede autorizar por escrito que se anuncie la propiedad.", "a": true, "e": "El propietario no es la única persona autorizante contemplada. El mandato exclusivo permite la autorización expresamente prevista. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4, una persona jurídica puede ser profesional inmobiliario para efectos del Código.", "a": true, "e": "La definición no se limita a personas naturales y atiende a la participación en el desarrollo inmobiliario de acuerdo con los estatutos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 4."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27, cada órgano de aplicación puede ejercer indistintamente la misma competencia sancionatoria.", "a": false, "e": "La lista de órganos no uniforma competencias. El Código asigna funciones por instancia y tipo de asunto. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 26–27."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a, solo la comisión debe pactarse por escrito; los gastos y costos quedan fuera del deber.", "a": false, "e": "La exigencia abarca honorarios, comisiones, costos y gastos, con descripción del servicio y forma de cálculo. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19, una crítica falsa a otro profesional y la captación de una exclusiva ajena se examinan bajo deberes diferenciados.", "a": true, "e": "El primer hecho afecta competencia leal y respeto. El segundo se relaciona con un mandato exclusivo vigente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17, el Código obliga sin excepción a presentar toda oferta exclusivamente por escrito.", "a": false, "e": "La regla exige presentación objetiva, veraz y sin demora. La escritura se señala como preferible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 17."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, poner en riesgo intereses del cliente al aceptar un encargo sin competencia es un ejemplo de falta grave.", "a": true, "e": "La clasificación atiende tanto a la falta de pericia como al perjuicio potencial para el cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, un interés económico de un familiar directo del agente en el proyecto debe revelarse a las partes involucradas.", "a": true, "e": "La regla considera vínculos económicos indirectos por familiares directos o por la empresa del profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32, una decisión disciplinaria puede omitir su fundamento jurídico si identifica a las partes.", "a": false, "e": "La identificación y el fundamento son componentes distintos. La decisión debe contener ambos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10, la orientación sobre eficiencia energética se presta en la medida de las posibilidades del profesional.", "a": true, "e": "El artículo promueve asesoramiento y prácticas sostenibles. El alcance queda vinculado a las posibilidades de quien presta el servicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 10."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 8, la prohibición de discriminación se aplica a c
