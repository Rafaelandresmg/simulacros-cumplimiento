lientes actuales, pero no a quienes todavía solicitan un servicio.", "a": false, "e": "El criterio es la prestación de servicios. Condicionar su acceso por un motivo prohibido cae dentro del ámbito. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 8."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20, la cooperación entre profesionales debe respetar los intereses del cliente aunque el reparto se haya acordado.", "a": true, "e": "Un acuerdo económico entre colegas no desplaza el deber frente al cliente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23, las contribuciones especiales fijadas por la estructura gremial no aparecen entre los deberes con la Cámara.", "a": false, "e": "El artículo incluye el pago puntual de cuotas ordinarias y contribuciones especiales establecidas. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 23."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38, el deber de divulgar el Código se satisface guardándolo exclusivamente en expedientes reservados.", "a": false, "e": "Debe mantenerse visible en las páginas institucionales y difundirse también mediante formación. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 38."}, {"t": "vf", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5, la actualización profesional se limita a cambios legislativos y excluye condiciones del mercado y nuevas tecnologías.", "a": false, "e": "La formación continua comprende esos tres ámbitos porque todos inciden en la competencia profesional. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5, considera este caso. Una agente recibe un encargo especializado que supera su pericia. ¿Qué afirmación es correcta?", "o": ["Debe abstenerse de aceptar el encargo sin la pericia necesaria", "Advertir su inexperiencia vuelve suficiente la aceptación", "La certificación reemplaza la actualización profesional"], "a": 0, "e": "El deber de competencia incluye tanto el límite al asumir encargos como la formación continua. Una advertencia no aporta la pericia que falta. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 5."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20, considera este caso. Dos profesionales colaboran y piensan negociar el reparto de honorarios después del cierre. ¿Qué afirmación es correcta?", "o": ["El reparto debe fijarse previamente", "El cierre debe ocurrir antes de acordar la proporción", "La colaboración autoriza un reparto unilateral posterior"], "a": 0, "e": "El acuerdo previo evita disputas durante el encargo. La distribución ha de hacerse oportunamente conforme a lo pactado. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 20."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19, considera este caso. Un agente conoce la exclusiva ajena y, además, tiene una queja de mala praxis contra el colega. ¿Qué afirmación es correcta?", "o": ["La negociación del inmueble se canaliza por el mandatario", "Puede captar directamente al cliente si mejora la comisión", "Debe canalizar la queja primero mediante comentarios públicos"], "a": 0, "e": "La exclusiva vigente impide el contacto con intención de captar ese mandato. El canal formal de queja protege la tramitación de la denuncia. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 18–19."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 29, considera este caso. El Comité propone mediación y las partes no consiguen acordar. ¿Qué afirmación es correcta?", "o": ["La mediación se promueve antes del procedimiento formal", "La mediación concluye necesariamente con sanción", "El desacuerdo obliga a archivar el asunto"], "a": 0, "e": "La mediación es voluntaria y facilita un acuerdo, pero el desacuerdo deja disponible el procedimiento formal. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 29."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9, considera este caso. Una firma usa IA para redactar anuncios y tratar información de clientes. ¿Qué afirmación es correcta?", "o": ["Debe cuidar la veracidad del contenido generado", "Delegar la redacción libera del deber de veracidad", "Los estándares profesionales se reducen en redes sociales"], "a": 0, "e": "El entorno digital mantiene las exigencias éticas. La automatización añade el deber de cuidar veracidad, privacidad y resultados no discriminatorios. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 9."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Se revisan dos casos: captación de una exclusiva ajena y demora injustificada en comunicar que no causó daño significativo. ¿Qué afirmación es correcta?", "o": ["Captar el mandato exclusivo ajeno es un ejemplo de falta grave", "El retraso sin daño significativo siempre implica expulsión", "La captación de una exclusiva ajena es solo descortesía"], "a": 0, "e": "El primero afecta un compromiso contractual conocido. La demora sin daño significativo figura como ejemplo de infracción leve. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24, considera este caso. Un anuncio presenta un error menor sin daño y otro usa a sabiendas imágenes engañosas. ¿Qué afirmación es correcta?", "o": ["El primer supuesto encaja en el ejemplo de falta leve", "Todo error publicitario se considera falta muy grave", "La alteración deliberada se trata igual que una inexactitud menor"], "a": 0, "e": "La clasificación atiende a los hechos. El Código diferencia la inexactitud menor sin perjuicio de la publicidad deliberadamente engañosa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 24."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2, considera este caso. Una empresa afiliada a una Cámara Estadal sostiene que el Código solo obliga a corredores que sean personas naturales. ¿Qué afirmación es correcta?", "o": ["El ámbito incluye personas jurídicas afiliadas", "Se limita a los corredores como personas naturales", "La sede regional excluye la aplicación del Código"], "a": 0, "e": "El factor determinante es la afiliación comprendida en el artículo 2. El Código rige interacciones con clientes, colegas, público e institución. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 1–2."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44, considera este caso. Un afiliado invoca desconocimiento y presenta una regla ética anterior incompatible con el Código. ¿Qué afirmación es correcta?", "o": ["El desconocimiento no excusa su cumplimiento", "La regla anterior prevalece por ser conocida", "La ratificación del afiliado es condición para que rija el Código"], "a": 0, "e": "La vigencia se vincula con la aprobación y publicación por el Consejo Superior. El deber de juramentarse no permite al afiliado escoger una edición previa. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 43–44."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una agencia prepara publicidad con una imagen antigua y solo tiene autorización verbal. ¿Qué afirmación es correcta?", "o": ["Debe obtener autorización expresa y escrita del legitimado", "La autorización verbal basta si el inmueble existe", "Una imagen engañosa es admisible si fue verdadera en el pasado"], "a": 0, "e": "El permiso para anunciar y la veracidad del material son exigencias distintas. La antigüedad de una foto no excusa inducir a error. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34, considera este caso. Se presentan quejas contra un directivo de un capítulo inmobiliario y contra otro de una Cámara Estadal. ¿Qué afirmación es correcta?", "o": ["La de un directivo del capítulo se lleva al Comité Estadal", "Ambas deben juzgarse primero dentro del mismo órgano del denunciado", "La queja contra el directivo estadal se presenta ante el capítulo"], "a": 0, "e": "El régimen especial desplaza la competencia a la instancia superior para preservar imparcialidad. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 34."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6, considera este caso. Una firma toma un video de otro creador y modifica las cifras del inmueble. ¿Qué afirmación es correcta?", "o": ["El material ajeno requiere autorización y crédito", "Dar crédito basta aunque falte autorización", "El estilo publicitario permite variar datos deliberadamente"], "a": 0, "e": "Crédito y autorización son acumulativos. Los metros, estatus u otros hechos no pueden alterarse para mejorar la promoción. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 6."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12, considera este caso. Un agente propone informar al cliente solo las ventajas de la compra para evitar que desista. ¿Qué afirmación es correcta?", "o": ["Debe exponer riesgos y desventajas relevantes", "La lealtad permite ocultar riesgos al propio cliente", "El asesoramiento se limita a respaldar la decisión del cliente"], "a": 0, "e": "La decisión informada necesita ventajas y riesgos. Proteger los intereses legítimos del cliente no habilita sesgar la información ni tratar injustamente a terceros. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 11–12."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15, considera este caso. El agente quiere representar a las dos partes con intereses contrapuestos y su empresa tiene interés económico en el inmueble. ¿Qué afirmación es correcta?", "o": ["Requiere consentimiento informado y escrito de todas las partes para la doble representación", "Basta obtener el consentimiento verbal del vendedor", "Puede omitir la revelación mientras no cobre la comisión"], "a": 0, "e": "Son dos conflictos distintos. La doble representación exige consentimiento de todas las partes y el interés directo debe revelarse antes de confiar en su juicio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 15."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c, considera este caso. Una firma custodia un depósito y quiere usarlo unos días para gastos de oficina. ¿Qué afirmación es correcta?", "o": ["El depósito se destina al fin pactado", "El uso temporal está permitido si se devuelve el dinero", "El carácter reembolsable permite mezclar destinos"], "a": 0, "e": "El deber fiduciario impide desviar fondos incluso temporalmente. La obligación de informar qué se recibió y desembolsó sigue siendo exigible. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.b–c."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33, considera este caso. Una parte quiere apelar una decisión que acaba de notificarse formalmente. ¿Qué afirmación es correcta?", "o": ["El lapso se cuenta desde el día hábil siguiente", "Dispone de cinco días continuos ante el órgano de alzada", "Debe apelarse directamente ante la Junta Directiva de la CIV"], "a": 0, "e": "El recurso se interpone ante el órgano de origen dentro de cinco días hábiles. Una vez admitido se remite a la alzada competente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 32–33."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 28, considera este caso. Un afiliado pide orientación antes de actuar en un asunto éticamente dudoso. ¿Qué afirmación es correcta?", "o": ["Puede plantear una consulta escrita", "Debe presentar una denuncia contenciosa contra sí mismo", "La consulta se tramita mediante un anuncio al gremio"], "a": 0, "e": "La consulta ética es preventiva. Su vía escrita y confidencial no equivale a iniciar un expediente sancionatorio. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 28."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 35–37, considera este caso. Se cuestiona la prescripción y el denunciado integra el Comité que conocería el caso. ¿Qué afirmación es correcta?", "o": ["El plazo de prescripción previsto es de cinco años", "El plazo es el de cinco días hábiles de la apelación", "El miembro puede intervenir hasta que se compruebe la infracción"], "a": 0, "e": "La prescripción limita el inicio de la acción. La inhibición protege la imparcialidad desde la denuncia y se convoca al suplente. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 35–37."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 39–40, considera este caso. Se quiere publicar el expediente mientras se investiga y divulgar una expulsión cuando quede definitivamente firme. ¿Qué afirmación es correcta?", "o": ["Las actuaciones internas son confidenciales", "La publicidad de la expulsión permite publicar el expediente abierto", "Toda sanción firme queda reservada al comité"], "a": 0, "e": "La reserva del procedimiento y la publicidad de ciertas sanciones son reglas distintas. La divulgación depende de firmeza y gravedad. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 39–40."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 40, considera este caso. Hay una amonestación firme y una suspensión firme impuestas a distintos afiliados. ¿Qué afirmación es correcta?", "o": ["La amonestación permanece en el expediente privado", "Ambas deben divulgarse al público general", "La amonestación se notifica a toda la estructura gremial"], "a": 0, "e": "La divulgación es proporcional. La amonestación es privada, la suspensión tiene alcance gremial y la expulsión firme se publica. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 40."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13, considera este caso. Tras concluir el contrato, un profesional prepara un archivo de advertencias y datos del antiguo cliente. ¿Qué afirmación es correcta?", "o": ["Conviene dejar por escrito advertencias de especial trascendencia", "La reserva concluye con el último pago del encargo", "Las advertencias relevantes siempre se comunican únicamente de palabra"], "a": 0, "e": "El Código procura constancia escrita para advertencias importantes y mantiene el secreto indefinidamente. Terminar el encargo no permite reutilizar los datos. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, arts. 12–13."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33, considera este caso. La alzada recibe un expediente tras admitirse una apelación. ¿Qué afirmación es correcta?", "o": ["Puede confirmar, reformar o revocar", "El órgano revisa solo si la decisión fue notificada", "La decisión de alzada tiene un plazo de quince días continuos improrrogables"], "a": 0, "e": "El alcance de la revisión incluye el contenido del fallo. El plazo de alzada se distingue del lapso para interponer el recurso. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 33."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27, considera este caso. Se dicta una decisión en primera instancia por un Comité Disciplinario Estadal. ¿Qué afirmación es correcta?", "o": ["La estructura prevé alzada disciplinaria nacional", "El comité estadal actúa como alzada de su propio fallo", "La Consultoría Jurídica reemplaza a la alzada"], "a": 0, "e": "La competencia sigue el nivel que decidió. El Comité Nacional revisa decisiones estadales y el Consejo Superior conoce la alzada que le corresponde frente a decisiones nacionales. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 27."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32, considera este caso. El Comité necesita interpretar una cuestión de Derecho y ya cuenta con correos de contacto de las partes. ¿Qué afirmación es correcta?", "o": ["Puede pedir opinión no vinculante a Consultoría Jurídica", "Consultoría Jurídica dicta el fallo que obliga al Comité", "La notificación solo puede efectuarse personalmente"], "a": 0, "e": "La opinión apoya la motivación y no desplaza al decisor. El Código prevé la notificación formal electrónica. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 32."}, {"t": "mc", "q": "Según el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b, considera este caso. Una agente fija verbalmente su comisión y solo entregará cuentas al cerrar. ¿Qué afirmación es correcta?", "o": ["Debe pactar por escrito la comisión y su cálculo", "Un resumen verbal único satisface el pacto de honorarios", "Las cuentas solo se presentan después del cierre"], "a": 0, "e": "El pacto de honorarios documenta condiciones y el estado de cuentas muestra movimientos de fondos. Uno no reemplaza al otro. Fuente: el Código de Ética CIV aprobado el 12 de noviembre de 2025, art. 14.a–b."}]}]}, {"titulo": "RUSO para el sector inmobiliario · modelos temáticos", "exams": [{"titulo": "RUSO para el sector inmobiliario · modelo 1", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la circular prevé que el RUSO brinde herramientas de capacitación sectorial a los sujetos obligados.", "a": true, "e": "El registro combina funciones de información y control con herramientas de autogestión. Eso no altera las vías para remitir reportes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la condición de sujeto obligado solo se verifica después de cerrar el trámite de registro.", "a": false, "e": "La Providencia la lista como requisito del registro. La naturaleza del sujeto se examina al preparar y revisar el expediente. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, en un grupo económico, basta demostrar la existencia de la sociedad matriz sin identificar la relación entre integrantes.", "a": false, "e": "El expediente del grupo pide información sobre vínculos, órganos y representación. La existencia de la matriz es solo un elemento. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, el ámbito incluye ONG y OSFL que recauden o desembolsen fondos para sus actividades benéficas.", "a": true, "e": "La circular contiene supuestos adicionales a las agencias. El examen los distingue para identificar a qué actor corresponde cada requisito. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la actualización observada se subsana en cinco días hábiles contados desde que ocurrió el cambio original.", "a": false, "e": "Los cinco días hábiles comienzan con la notificación de inconsistencias. El hecho original activa el deber de actualizar. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la revisión de la actualización por ONCDOFT tiene su propio lapso desde la consignación del último requisito.", "a": true, "e": "Es el plazo del órgano para validar. El plazo inicial para que el sujeto informe el cambio tiene otro hito. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, los treinta días continuos para actualizar se cuentan desde la fecha de la primera inscripción.", "a": false, "e": "El hecho que activa el cómputo es el cambio, incluso si la inscripción es antigua. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, el intercambio de datos con cámaras equivale a transferirles el registro como autoridad decisoria.", "a": false, "e": "La cooperación sirve para contrastar información. RUSO sigue correspondiendo al órgano rector. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la autoridad puede contrastar información suministrada con unidades de otros organismos públicos.", "a": true, "e": "La validación pretende confirmar autenticidad y veracidad, evitando depender solo de lo declarado por la agencia. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, el literal a exige, además de manejar fondos para comprar inmuebles, que la agencia haga la compra a su propio nombre.", "a": false, "e": "El supuesto se centra en el manejo de fondos en la compra. No añade titularidad propia como condición. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la obligación asumida en la declaración jurada puede comprender otras medidas previstas en la normativa aplicable.", "a": true, "e": "La declaración no agota la prevención en una sola comprobación. Se refiere a diligencia, fondos y demás medidas pertinentes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, los profesionales independientes cumplen el recaudo de credencial aportando la afiliación de un cliente.", "a": false, "e": "La credencial corresponde al profesional que se registra, según el instituto o colegio aplicable. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la Circular DGCJ-002-2026 que quedó sin efecto es un instrumento de septiembre de 2026.", "a": true, "e": "Esa circular no es la Providencia ONCDOFT-002-2021. El año y la clase de instrumento resuelven la confusión. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la documentación de identificación varía según si el sujeto obligado es persona natural o jurídica.", "a": true, "e": "Los recaudos se presentan según corresponda al solicitante. La identificación no se reduce a un formato idéntico para todos. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, hay que acudir presencialmente en todos los casos antes de poder consignar un archivo en el sistema.", "a": false, "e": "La consignación se prevé por vía digital y la asistencia presencial atiende necesidades de acceso. Son mecanismos que cumplen funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3, los sujetos con ente de control propio deben tramitar directamente su anulación aunque ese ente sea responsable de su registro.", "a": false, "e": "La responsabilidad del ente de control abarca las tres actuaciones. La regla no cambia únicamente por tratarse de una anulación. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, el nombramiento del presidente se incluye entre los recaudos de persona jurídica cuando proceda.", "a": true, "e": "La salvedad exige determinar si aplica a la estructura concreta. No se convierte en un documento universal para personas naturales. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la certificación de formalización de una OSFL sustituye la documentación constitutiva de cualquier agencia mercantil.", "a": false, "e": "El recaudo especial corresponde a la OSFL. Las sociedades documentan constitución y representación conforme a su propio supuesto. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la organización de aportes solo se prevé para una empresa ya operativa y nunca para crearla.", "a": false, "e": "En el literal de profesionales independientes también se contemplan los aportes destinados a la creación. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, el órgano tiene que esperar la siguiente renovación anual para aprobar cambios ya validados.", "a": false, "e": "El trámite de actualización concluye con la aprobación de cambios cuando la revisión es satisfactoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, la atención preferente es una medida contemplada para facilitar el acceso al trámite.", "a": true, "e": "La disposición procura evitar exclusión por brecha digital, edad o discapacidad. El apoyo no dispensa la acreditación de requisitos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, los accionistas quedan excluidos del recaudo de RIF cuando ya se aporta el RIF de los miembros de junta.", "a": false, "e": "La circular contempla ambos grupos. Verificar a gestionantes no equivale a verificar a titulares. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la verificación del certificado se extiende a terceros interesados.", "a": true, "e": "Los elementos de seguridad ayudan a corroborar autenticidad. El simple hecho de que un tercero pueda verificarlo no lo convierte en órgano certificador. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 1, el marco de RUSO comprende la anulación además de la inscripción y actualización.", "a": true, "e": "La Providencia regula el ciclo del registro. La Circular 003 desarrolla requisitos de inscripción y actualización para sus destinatarios. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, un cambio relevante de datos de contacto puede requerir actualización.", "a": true, "e": "La enumeración no se limita a cambios de propiedad o estatutos. El contacto también integra la información del registro. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, considera este caso. Una sociedad trata de inscribirse presentando solo el nombre comercial y el correo. ¿Qué afirmación es correcta?", "o": ["La condición de sujeto obligado es un requisito", "El nombre de fantasía sustituye toda identificación", "El registro es un trámite de certificación de marca"], "a": 0, "e": "RUSO registra a personas o entidades obligadas. El dato comercial es insuficiente para satisfacer la identificación exigida. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, revisión de actualización, considera este caso. Una agencia envía progresivamente documentos para actualizar su junta directiva. ¿Qué afirmación es correcta?", "o": ["La ONCDOFT revisa y valida el expediente de actualización", "El plazo corre desde el primer documento incompleto", "La consignación parcial obliga a aprobar de inmediato la actualización"], "a": 0, "e": "Los treinta días continuos de revisión tienen como referencia el último requisito. El plazo del sujeto para actualizar es otro cómputo. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, revisión de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento, considera este caso. La inmobiliaria tiene un responsable formal y prepara la consignación. ¿Qué afirmación es correcta?", "o": ["Ese responsable se encarga de la inscripción", "El responsable carece de papel aunque exista formalmente", "El hecho de tener RIF sustituye la constancia de designación"], "a": 0, "e": "La circular asigna el trámite a quien ejerce el rol cuando existe y exige prueba de su nombramiento además de sus recaudos personales. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final, considera este caso. Un asesor usa la Circular 002-2026 de septiembre para orientar la inscripción inmobiliaria. ¿Qué afirmación es correcta?", "o": ["La 003-2026 deja sin efecto esa circular anterior", "La 002 de 2026 sigue siendo el instructivo aplicable por ser anterior", "La 003 deja sin efecto la Providencia ONCDOFT-002-2021"], "a": 0, "e": "La disposición final alcanza a la Circular DGCJ-002-2026. El número 002 no identifica el mismo instrumento que la Providencia de 2021. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 2–3, requisitos societarios, considera este caso. Una agencia delega la solicitud en su representante y tiene nuevos miembros de la junta. ¿Qué afirmación es correcta?", "o": ["El poder de representación debidamente autenticado es relevante", "Una designación comercial interna sustituye todo poder", "Basta el RIF de los clientes de la agencia"], "a": 0, "e": "El expediente de la persona jurídica acredita facultades del representante e identificación de quienes integran su estructura, según corresponda. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 2–3, requisitos societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 4–5, revisión de la inscripción, considera este caso. Tras cargar el expediente, la agencia trata su acuse de carga como certificación definitiva. ¿Qué afirmación es correcta?", "o": ["La ONCDOFT debe revisar y validar la documentación", "La carga de archivos equivale a aprobar el registro", "Se emite primero el certificado y se verifican después los requisitos"], "a": 0, "e": "La recepción y la validación son fases diferentes. El acuse de entrega no demuestra aprobación ni autenticidad de un certificado. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 4–5, revisión de la inscripción."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos, considera este caso. Un control interno anota juntos los plazos de subsanar un registro nuevo y de informar un cambio de domicilio. ¿Qué afirmación es correcta?", "o": ["La inscripción observada se subsana en diez días hábiles", "Ambos plazos son treinta días desde la notificación", "Los diez días hábiles se aplican al simple cambio de domicilio"], "a": 0, "e": "Distingue una observación de inscripción de un hecho que cambia los datos. Cada uno activa un plazo y un punto de partida diferentes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado, considera este caso. La ONCDOFT concluye favorablemente la evaluación de una inscripción. ¿Qué afirmación es correcta?", "o": ["El resultado se comunica por correo electrónico", "Se requiere que la UNIF emita el certificado", "El registro no prevé comprobación de autenticidad por terceros"], "a": 0, "e": "La evaluación satisfactoria origina un certificado verificable. Una notificación de resultado y el certificado son pasos conectados, con funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios, considera este caso. La información actualizada ha sido validada satisfactoriamente. ¿Qué afirmación es correcta?", "o": ["El órgano rector aprueba los cambios pertinentes", "Una actualización obliga a tramitar ante UNIF un registro independiente", "El solicitante aprueba por sí mismo los cambios al cargar los documentos"], "a": 0, "e": "El resultado es una decisión de la ONCDOFT sobre los datos existentes. La aprobación no es un segundo registro ante otra institución. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, consignación, considera este caso. Una agencia carga sus recaudos y una persona necesita apoyo por dificultades digitales. ¿Qué afirmación es correcta?", "o": ["El trámite prevé consignación digital", "La sola necesidad de asistencia extingue el trámite", "El procedimiento excluye la atención presencial de apoyo"], "a": 0, "e": "La plataforma es el mecanismo de registro. La asistencia facilita el acceso y no sustituye la revisión de la solicitud. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4, consignación."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), arts. 1–3, considera este caso. Una inmobiliaria comprendida como sujeto obligado carece de órgano sectorial de control propio. ¿Qué afirmación es correcta?", "o": ["Tramita su registro directamente ante ONCDOFT", "Debe tramitar directamente ante la UNIF", "La ausencia de supervisor propio elimina el registro"], "a": 0, "e": "La providencia diferencia el trámite directo ante el órgano rector del que se gestiona por un ente de control propio. UNIF no es la ventanilla RUSO. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), arts. 1–3."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios, considera este caso. Una compañía local selecciona los documentos que acreditan su existencia y representación. ¿Qué afirmación es correcta?", "o": ["Corresponde el acta constitutiva inscrita con actualizaciones", "La publicidad de la inmobiliaria sustituye los estatutos", "El certificado de afiliación sustituye la identificación del representante"], "a": 0, "e": "Se verifica tanto la constitución vigente como quién actúa por ella. Un documento comercial o gremial no acredita esos extremos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b, considera este caso. Una agencia maneja fondos para una compra y un abogado independiente compra un inmueble por cuenta de un cliente. ¿Qué afirmación es correcta?", "o": ["La agencia se analiza en el literal a", "El abogado debe inscribirse como agencia por realizar una compra", "El literal b desplaza el literal a para toda compraventa"], "a": 0, "e": "La participación inmobiliaria de ambos no los convierte en la misma categoría. Cada literal describe al actor y la actividad aplicables. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, interoperabilidad, considera este caso. El sistema ya contiene un documento en la base de otro ente estatal consultable por ONCDOFT. ¿Qué afirmación es correcta?", "o": ["La ONCDOFT debe verificar de oficio los datos disponibles", "El interesado solicita la misma certificación de nuevo por regla", "La consulta la realiza únicamente la cámara gremial"], "a": 0, "e": "La interoperabilidad procura evitar duplicación. Se distingue el documento verificable de oficio del faltante que sí debe subsanar el solicitante. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, interoperabilidad."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación, considera este caso. Una Cámara y un ente de control tienen datos necesarios para comprobar el estatus de una inmobiliaria. ¿Qué afirmación es correcta?", "o": ["La circular prevé cooperación con ONCDOFT", "La Cámara reemplaza al órgano rector al decidir el registro", "La coordinación exige duplicar todos los recaudos al administrado"], "a": 0, "e": "El intercambio busca cotejar el estatus y evitar duplicaciones. La cooperación no transfiere la competencia decisoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, grupo económico, considera este caso. Una agencia miembro de un grupo controlado prepara la información sobre su matriz y sus vinculadas. ¿Qué afirmación es correcta?", "o": ["Debe documentar el dato fiscal de la matriz", "El dato fiscal de la matriz se sustituye por el del cliente", "El vínculo con el grupo se acredita solo con su marca comercial"], "a": 0, "e": "La circular busca trazabilidad de quién controla y cómo se vinculan las integrantes. Compartir una marca no acredita estructura ni representación. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, grupo económico."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial, considera este caso. La solicitud inicial presenta un faltante que la administración no puede verificar directamente. ¿Qué afirmación es correcta?", "o": ["Se debe notificar qué falta corregir", "Se aplican cinco días hábiles por tratarse de un faltante inicial", "El lapso se cuenta desde que la agencia subió su primer archivo"], "a": 0, "e": "Los diez días hábiles corresponden a inscripción. El plazo de cinco días se reserva a inconsistencias de la actualización. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez, considera este caso. Una agencia lleva más de un año inscrita y todos sus datos permanecen exactos. ¿Qué afirmación es correcta?", "o": ["La validez no está sujeta a vencimiento anual", "Debe renovarse cada año aunque nada haya cambiado", "La validez indefinida elimina el deber de actualizar"], "a": 0, "e": "El certificado no funciona como una licencia anual. La continuidad depende de que los datos se mantengan exactos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3, considera este caso. Una empresa compara el trámite de una inmobiliaria sin ente de control propio con el de un sujeto supervisado por otro órgano. ¿Qué afirmación es correcta?", "o": ["El sujeto sin ente propio acude al órgano rector", "Ambos tienen que tramitar por la Cámara Inmobiliaria", "El organismo competente cambia únicamente al solicitar anulación"], "a": 0, "e": "La ruta depende de la supervisión que corresponda. La regla comprende registro, actualización y anulación. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias, considera este caso. La ONCDOFT detecta omisiones en una solicitud inicial y analiza cómo comunicarlas. ¿Qué afirmación es correcta?", "o": ["La notificación puede ser electrónica", "Solo se admite el correo postal certificado", "Basta advertir verbalmente que hay un problema sin especificarlo"], "a": 0, "e": "La comunicación debe identificar lo que se pide subsanar y activar el cómputo desde la notificación. El medio puede ser electrónico o presencial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios, considera este caso. Se modifica la estructura accionaria y se reforma el estatuto de una inmobiliaria registrada. ¿Qué afirmación es correcta?", "o": ["La modificación accionaria está prevista como cambio relevante", "Solo el cambio de domicilio activa actualización", "Los estatutos se revisan de nuevo solo al vencer el certificado"], "a": 0, "e": "El registro mantiene vigentes datos sobre la sociedad y su control. Ambos cambios se incluyen en los supuestos que pueden modificar información registrada. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, actualización, considera este caso. Una inmobiliaria cambia el domicilio y sustituye al representante legal. ¿Qué afirmación es correcta?", "o": ["Son cambios que pueden exigir actualizar el registro", "Puede esperar al aniversario del certificado", "El lapso se activa solo tras ser contactada por ONCDOFT"], "a": 0, "e": "La obligación nace del cambio relevante en los datos. El plazo es de treinta días continuos y no depende de que el supervisor advierta primero el cambio. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad, considera este caso. Un gerente presenta al equipo el RUSO como si fuera solo un buzón de RAS. ¿Qué afirmación es correcta?", "o": ["El sistema lleva registro y control", "Su función principal es recibir RAS de la UNIF", "La inscripción reemplaza el sistema interno de prevención"], "a": 0, "e": "La circular vincula el registro con control y apoyo al cumplimiento. Detectar y reportar operaciones requiere su proceso propio. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos, considera este caso. El responsable confunde el plazo del órgano para revisar una actualización con el plazo del solicitante para corregirla. ¿Qué afirmación es correcta?", "o": ["La revisión usa treinta días continuos desde el último recaudo", "El órgano y el solicitante disponen de cinco días hábiles", "La corrección se cuenta desde que el órgano recibió el último recaudo"], "a": 0, "e": "Uno es el tiempo del supervisor para revisar lo consignado y otro el del solicitante para responder a una observación. El hito de cada plazo es distinto. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada, considera este caso. En la inscripción se presenta la declaración jurada en línea de la inmobiliaria. ¿Qué afirmación es correcta?", "o": ["En ella se asume realizar debida diligencia del cliente", "La declaración exonera de identificar el origen de fondos más adelante", "Solo compromete a verificar el destino y excluye el origen"], "a": 0, "e": "La declaración deja constancia del compromiso operativo. Formularla no prueba que la entidad ya haya hecho diligencia en cada expediente. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada."}]}, {"titulo": "RUSO para el sector inmobiliario · modelo 2", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, los treinta días continuos para actualizar se cuentan desde la fecha de la primera inscripción.", "a": false, "e": "El hecho que activa el cómputo es el cambio, incluso si la inscripción es antigua. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, la Circular 003 menciona expresamente la Providencia de RUSO publicada en G.O. 42.118.", "a": true, "e": "La Gaceta identifica la norma de base. La circular desarrolla el trámite para sus destinatarios y conserva su referencia. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, el ámbito incluye ONG y OSFL que recauden o desembolsen fondos para sus actividades benéficas.", "a": true, "e": "La circular contiene supuestos adicionales a las agencias. El examen los distingue para identificar a qué actor corresponde cada requisito. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la documentación de identificación varía según si el sujeto obligado es persona natural o jurídica.", "a": true, "e": "Los recaudos se presentan según corresponda al solicitante. La identificación no se reduce a un formato idéntico para todos. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la condición de sujeto obligado solo se verifica después de cerrar el trámite de registro.", "a": false, "e": "La Providencia la lista como requisito del registro. La naturaleza del sujeto se examina al preparar y revisar el expediente. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, la atención preferente es una medida contemplada para facilitar el acceso al trámite.", "a": true, "e": "La disposición procura evitar exclusión por brecha digital, edad o discapacidad. El apoyo no dispensa la acreditación de requisitos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la autoridad puede contrastar información suministrada con unidades de otros organismos públicos.", "a": true, "e": "La validación pretende confirmar autenticidad y veracidad, evitando depender solo de lo declarado por la agencia. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la organización de aportes solo se prevé para una empresa ya operativa y nunca para crearla.", "a": false, "e": "En el literal de profesionales independientes también se contemplan los aportes destinados a la creación. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la certificación de formalización de una OSFL sustituye la documentación constitutiva de cualquier agencia mercantil.", "a": false, "e": "El recaudo especial corresponde a la OSFL. Las sociedades documentan constitución y representación conforme a su propio supuesto. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3, los sujetos con ente de control propio deben tramitar directamente su anulación aunque ese ente sea responsable de su registro.", "a": false, "e": "La responsabilidad del ente de control abarca las tres actuaciones. La regla no cambia únicamente por tratarse de una anulación. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la circular prevé que el RUSO brinde herramientas de capacitación sectorial a los sujetos obligados.", "a": true, "e": "El registro combina funciones de información y control con herramientas de autogestión. Eso no altera las vías para remitir reportes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, el órgano tiene que esperar la siguiente renovación anual para aprobar cambios ya validados.", "a": false, "e": "El trámite de actualización concluye con la aprobación de cambios cuando la revisión es satisfactoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, el documento extranjero de inscripción debe provenir de la institución competente en materia mercantil.", "a": true, "e": "El soporte busca acreditar existencia con una fuente competente. No basta un certificado gremial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la revisión de la actualización por ONCDOFT tiene su propio lapso desde la consignación del último requisito.", "a": true, "e": "Es el plazo del órgano para validar. El plazo inicial para que el sujeto informe el cambio tiene otro hito. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, hay que acudir presencialmente en todos los casos antes de poder consignar un archivo en el sistema.", "a": false, "e": "La consignación se prevé por vía digital y la asistencia presencial atiende necesidades de acceso. Son mecanismos que cumplen funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, la constancia de designación del responsable debe provenir del sujeto obligado.", "a": true, "e": "El documento acredita quién le atribuyó el rol. No se suple con el documento de identidad del responsable. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la Circular DGCJ-002-2026 que quedó sin efecto es un instrumento de septiembre de 2026.", "a": true, "e": "Esa circular no es la Providencia ONCDOFT-002-2021. El año y la clase de instrumento resuelven la confusión. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 1, el marco de RUSO comprende la anulación además de la inscripción y actualización.", "a": true, "e": "La Providencia regula el ciclo del registro. La Circular 003 desarrolla requisitos de inscripción y actualización para sus destinatarios. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la actualización observada se subsana en cinco días hábiles contados desde que ocurrió el cambio original.", "a": false, "e": "Los cinco días hábiles comienzan con la notificación de inconsistencias. El hecho original activa el deber de actualizar. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la verificación del certificado se extiende a terceros interesados.", "a": true, "e": "Los elementos de seguridad ayudan a corroborar autenticidad. El simple hecho de que un tercero pueda verificarlo no lo convierte en órgano certificador. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la obligación asumida en la declaración jurada puede comprender otras medidas previstas en la normativa aplicable.", "a": true, "e": "La declaración no agota la prevención en una sola comprobación. Se refiere a diligencia, fondos y demás medidas pertinentes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, los accionistas quedan excluidos del recaudo de RIF cuando ya se aporta el RIF de los miembros de junta.", "a": false, "e": "La circular contempla ambos grupos. Verificar a gestionantes no equivale a verificar a titulares. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la falta de actualización por un cambio relevante solo puede dar lugar a advertencias, sin posibilidad de suspensión.", "a": false, "e": "Se identifica como motivo razonable para suspensión. Esa consecuencia no equivale a una renovación periódica. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, los documentos verificables directamente por la Administración y los que no puede comprobar siguen necesariamente el mismo trámite de subsanación.", "a": false, "e": "El supuesto de notificación menciona ausencias que la Administración no puede verificar directamente. La disponibilidad en bases estatales importa. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, un cambio relevante de datos de contacto puede requerir actualización.", "a": true, "e": "La enumeración no se limita a cambios de propiedad o estatutos. El contacto también integra la información del registro. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, corrección de actualización, considera este caso. La ONCDOFT notifica que el archivo de una actualización presenta inconsistencias. ¿Qué afirmación es correcta?", "o": ["El cómputo arranca con la notificación", "Rigen los diez días hábiles de inscripción inicial", "Corresponde contar cinco días continuos desde el cambio"], "a": 0, "e": "La etapa del trámite determina el plazo. Los cinco días hábiles se aplican a inconsistencias de actualización y los diez a la inscripción inicial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, corrección de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios, considera este caso. Una compañía local selecciona los documentos que acreditan su existencia y representación. ¿Qué afirmación es correcta?", "o": ["La identidad vigente de representantes es pertinente", "La publicidad de la inmobiliaria sustituye los estatutos", "El certificado de afiliación sustituye la identificación del representante"], "a": 0, "e": "Se verifica tanto la constitución vigente como quién actúa por ella. Un documento comercial o gremial no acredita esos extremos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado, considera este caso. La ONCDOFT concluye favorablemente la evaluación de una inscripción. ¿Qué afirmación es correcta?", "o": ["El certificado incorpora medios para verificar autenticidad", "Se requiere que la UNIF emita el certificado", "El registro no prevé comprobación de autenticidad por terceros"], "a": 0, "e": "La evaluación satisfactoria origina un certificado verificable. Una notificación de resultado y el certificado son pasos conectados, con funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, revisión de actualización, considera este caso. Una agencia envía progresivamente documentos para actualizar su junta directiva. ¿Qué afirmación es correcta?", "o": ["El plazo de revisión corre desde el último requisito consignado", "El plazo corre desde el primer documento incompleto", "La consignación parcial obliga a aprobar de inmediato la actualización"], "a": 0, "e": "Los treinta días continuos de revisión tienen como referencia el último requisito. El plazo del sujeto para actualizar es otro cómputo. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, revisión de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación, considera este caso. Una Cámara y un ente de control tienen datos necesarios para comprobar el estatus de una inmobiliaria. ¿Qué afirmación es correcta?", "o": ["Se contempla intercambio o consulta en línea de datos", "La Cámara reemplaza al órgano rector al decidir el registro", "La coordinación exige duplicar todos los recaudos al administrado"], "a": 0, "e": "El intercambio busca cotejar el estatus y evitar duplicaciones. La cooperación no transfiere la competencia decisoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos, considera este caso. Un control interno anota juntos los plazos de subsanar un registro nuevo y de informar un cambio de domicilio. ¿Qué afirmación es correcta?", "o": ["El cambio relevante se actualiza en treinta días continuos", "Ambos plazos son treinta días desde la notificación", "Los diez días hábiles se aplican al simple cambio de domicilio"], "a": 0, "e": "Distingue una observación de inscripción de un hecho que cambia los datos. Cada uno activa un plazo y un punto de partida diferentes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, omisión de actualización, considera este caso. Una agencia no notifica un cambio relevante y alega que su certificado carece de fecha de vencimiento. ¿Qué afirmación es correcta?", "o": ["La vigencia indefinida depende de la exactitud declarada", "La falta de vencimiento impide suspender el registro", "La omisión convierte el certificado en renovable automáticamente cada año"], "a": 0, "e": "Suspensión por incumplir el deber de actualizar y caducidad periódica son figuras diferentes. La circular contempla la primera. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, omisión de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, actualización, considera este caso. Una inmobiliaria cambia el domicilio y sustituye al representante legal. ¿Qué afirmación es correcta?", "o": ["El lapso corre desde que ocurren los cambios", "Puede esperar al aniversario del certificado", "El lapso se activa solo tras ser contactada por ONCDOFT"], "a": 0, "e": "La obligación nace del cambio relevante en los datos. El plazo es de treinta días continuos y no depende de que el supervisor advierta primero el cambio. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, actualización."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, considera este caso. Una sociedad trata de inscribirse presentando solo el nombre comercial y el correo. ¿Qué afirmación es correcta?", "o": ["La identificación se documenta según corresponda al solicitante", "El nombre de fantasía sustituye toda identificación", "El registro es un trámite de certificación de marca"], "a": 0, "e": "RUSO registra a personas o entidades obligadas. El dato comercial es insuficiente para satisfacer la identificación exigida. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 4–5, revisión de la inscripción, considera este caso. Tras cargar el expediente, la agencia trata su acuse de carga como certificación definitiva. ¿Qué afirmación es correcta?", "o": ["Puede cotejar la veracidad con otros entes públicos", "La carga de archivos equivale a aprobar el registro", "Se emite primero el certificado y se verifican después los requisitos"], "a": 0, "e": "La recepción y la validación son fases diferentes. El acuse de entrega no demuestra aprobación ni autenticidad de un certificado. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 4–5, revisión de la inscripción."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, sociedad extranjera, considera este caso. Una sociedad mercantil constituida en el extranjero presenta recaudos para inscribirse. ¿Qué afirmación es correcta?", "o": ["También se prevé certificado del Registro Mercantil venezolano", "La inscripción extranjera excluye el certificado venezolano", "El acta de una afiliación gremial venezolana basta por sí sola"], "a": 0, "e": "Son requisitos adicionales para acreditar el origen societario y la documentación mercantil solicitada en Venezuela. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, sociedad extranjera."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, literal a, considera este caso. Una agencia maneja fondos de clientes para comprarles inmuebles y pregunta si basta su afiliación a una Cámara. ¿Qué afirmación es correcta?", "o": ["El trámite registral se hace ante la ONCDOFT", "La afiliación gremial sustituye la inscripción", "La operación se registra únicamente ante la UNIF"], "a": 0, "e": "La circular formula el supuesto mediante la actividad efectivamente realizada. La afiliación y el canal de reportes cumplen otras funciones. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1, literal a."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3, considera este caso. Una empresa compara el trámite de una inmobiliaria sin ente de control propio con el de un sujeto supervisado por otro órgano. ¿Qué afirmación es correcta?", "o": ["Para el otro sujeto, su ente de control es responsable del trámite", "Ambos tienen que tramitar por la Cámara Inmobiliaria", "El organismo competente cambia únicamente al solicitar anulación"], "a": 0, "e": "La ruta depende de la supervisión que corresponda. La regla comprende registro, actualización y anulación. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad, considera este caso. Un gerente presenta al equipo el RUSO como si fuera solo un buzón de RAS. ¿Qué afirmación es correcta?", "o": ["El sistema contempla herramientas de autogestión y capacitación", "Su función principal es recibir RAS de la UNIF", "La inscripción reemplaza el sistema interno de prevención"], "a": 0, "e": "La circular vincula el registro con control y apoyo al cumplimiento. Detectar y reportar operaciones requiere su proceso propio. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios, considera este caso. Se modifica la estructura accionaria y se reforma el estatuto de una inmobiliaria registrada. ¿Qué afirmación es correcta?", "o": ["La reforma estatutaria también se contempla", "Solo el cambio de domicilio activa actualización", "Los estatutos se revisan de nuevo solo al vencer el certificado"], "a": 0, "e": "El registro mantiene vigentes datos sobre la sociedad y su control. Ambos cambios se incluyen en los supuestos que pueden modificar información registrada. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, objeto, considera este caso. Una agencia quiere saber si el instrumento se agota en emitir el certificado inicial. ¿Qué afirmación es correcta?", "o": ["La circular incluye el procedimiento de actualización", "Toda modificación requiere una inscripción inicial nueva", "La circular crea un registro ajeno a ONCDOFT"], "a": 0, "e": "El texto establece dos trámites distintos dentro del mismo registro. Una actualización mantiene y corrige los datos de la inscripción. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1, objeto."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial, considera este caso. La solicitud inicial presenta un faltante que la administración no puede verificar directamente. ¿Qué afirmación es correcta?", "o": ["La subsanación inicial tiene diez días hábiles desde la notificación", "Se aplican cinco días hábiles por tratarse de un faltante inicial", "El lapso se cuenta desde que la agencia subió su primer archivo"], "a": 0, "e": "Los diez días hábiles corresponden a inscripción. El plazo de cinco días se reserva a inconsistencias de la actualización. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 2–3, requisitos societarios, considera este caso. Una agencia delega la solicitud en su representante y tiene nuevos miembros de la junta. ¿Qué afirmación es correcta?", "o": ["El RIF vigente de los miembros de junta es un recaudo aplicable", "Una designación comercial interna sustituye todo poder", "Basta el RIF de los clientes de la agencia"], "a": 0, "e": "El expediente de la persona jurídica acredita facultades del representante e identificación de quienes integran su estructura, según corresponda. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 2–3, requisitos societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada, considera este caso. En la inscripción se presenta la declaración jurada en línea de la inmobiliaria. ¿Qué afirmación es correcta?", "o": ["Incluye determinar el origen y el destino de los fondos", "La declaración exonera de identificar el origen de fondos más adelante", "Solo compromete a verificar el destino y excluye el origen"], "a": 0, "e": "La declaración deja constancia del compromiso operativo. Formularla no prueba que la entidad ya haya hecho diligencia en cada expediente. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento, considera este caso. La inmobiliaria tiene un responsable formal y prepara la consignación. ¿Qué afirmación es correcta?", "o": ["Debe acreditar su designación por el sujeto obligado", "El responsable carece de papel aunque exista formalmente", "El hecho de tener RIF sustituye la constancia de designación"], "a": 0, "e": "La circular asigna el trámite a quien ejerce el rol cuando existe y exige prueba de su nombramiento además de sus recaudos personales. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final, considera este caso. Un asesor usa la Circular 002-2026 de septiembre para orientar la inscripción inmobiliaria. ¿Qué afirmación es correcta?", "o": ["La 003 se dicta en atención a la Providencia de 2021", "La 002 de 2026 sigue siendo el instructivo aplicable por ser anterior", "La 003 deja sin efecto la Providencia ONCDOFT-002-2021"], "a": 0, "e": "La disposición final alcanza a la Circular DGCJ-002-2026. El número 002 no identifica el mismo instrumento que la Providencia de 2021. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez, considera este caso. Una agencia lleva más de un año inscrita y todos sus datos permanecen exactos. ¿Qué afirmación es correcta?", "o": ["La exactitud de los datos condiciona la vigencia", "Debe renovarse cada año aunque nada haya cambiado", "La validez indefinida elimina el deber de actualizar"], "a": 0, "e": "El certificado no funciona como una licencia anual. La continuidad depende de que los datos se mantengan exactos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios, considera este caso. La información actualizada ha sido validada satisfactoriamente. ¿Qué afirmación es correcta?", "o": ["Se notifica la actualización del certificado cuando corresponda", "Una actualización obliga a tramitar ante UNIF un registro independiente", "El solicitante aprueba por sí mismo los cambios al cargar los documentos"], "a": 0, "e": "El resultado es una decisión de la ONCDOFT sobre los datos existentes. La aprobación no es un segundo registro ante otra institución. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias, considera este caso. La ONCDOFT detecta omisiones en una solicitud inicial y analiza cómo comunicarlas. ¿Qué afirmación es correcta?", "o": ["También se contempla notificación presencial", "Solo se admite el correo postal certificado", "Basta advertir verbalmente que hay un problema sin especificarlo"], "a": 0, "e": "La comunicación debe identificar lo que se pide subsanar y activar el cómputo desde la notificación. El medio puede ser electrónico o presencial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b, considera este caso. Una agencia maneja fondos para una compra y un abogado independiente compra un inmueble por cuenta de un cliente. ¿Qué afirmación es correcta?", "o": ["Al abogado le corresponde el supuesto profesional del literal b", "El abogado debe inscribirse como agencia por realizar una compra", "El literal b desplaza el literal a para toda compraventa"], "a": 0, "e": "La participación inmobiliaria de ambos no los convierte en la misma categoría. Cada literal describe al actor y la actividad aplicables. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b."}]}, {"titulo": "RUSO para el sector inmobiliario · modelo 3", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, el ámbito incluye ONG y OSFL que recauden o desembolsen fondos para sus actividades benéficas.", "a": true, "e": "La circular contiene supuestos adicionales a las agencias. El examen los distingue para identificar a qué actor corresponde cada requisito. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, el nombramiento del presidente se incluye entre los recaudos de persona jurídica cuando proceda.", "a": true, "e": "La salvedad exige determinar si aplica a la estructura concreta. No se convierte en un documento universal para personas naturales. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la falta de actualización por un cambio relevante solo puede dar lugar a advertencias, sin posibilidad de suspensión.", "a": false, "e": "Se identifica como motivo razonable para suspensión. Esa consecuencia no equivale a una renovación periódica. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, la atención preferente es una medida contemplada para facilitar el acceso al trámite.", "a": true, "e": "La disposición procura evitar exclusión por brecha digital, edad o discapacidad. El apoyo no dispensa la acreditación de requisitos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la condición de sujeto obligado solo se verifica después de cerrar el trámite de registro.", "a": false, "e": "La Providencia la lista como requisito del registro. La naturaleza del sujeto se examina al preparar y revisar el expediente. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, la constancia de designación del responsable debe provenir del sujeto obligado.", "a": true, "e": "El documento acredita quién le atribuyó el rol. No se suple con el documento de identidad del responsable. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, el documento extranjero de inscripción debe provenir de la institución competente en materia mercantil.", "a": true, "e": "El soporte busca acreditar existencia con una fuente competente. No basta un certificado gremial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, los documentos verificables directamente por la Administración y los que no puede comprobar siguen necesariamente el mismo trámite de subsanación.", "a": false, "e": "El supuesto de notificación menciona ausencias que la Administración no puede verificar directamente. La disponibilidad en bases estatales importa. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la Circular DGCJ-002-2026 que quedó sin efecto es un instrumento de septiembre de 2026.", "a": true, "e": "Esa circular no es la Providencia ONCDOFT-002-2021. El año y la clase de instrumento resuelven la confusión. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, la documentación de identificación varía según si el sujeto obligado es persona natural o jurídica.", "a": true, "e": "Los recaudos se presentan según corresponda al solicitante. La identificación no se reduce a un formato idéntico para todos. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, en un grupo económico, basta demostrar la existencia de la sociedad matriz sin identificar la relación entre integrantes.", "a": false, "e": "El expediente del grupo pide información sobre vínculos, órganos y representación. La existencia de la matriz es solo un elemento. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la organización de aportes solo se prevé para una empresa ya operativa y nunca para crearla.", "a": false, "e": "En el literal de profesionales independientes también se contemplan los aportes destinados a la creación. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, hay que acudir presencialmente en todos los casos antes de poder consignar un archivo en el sistema.", "a": false, "e": "La consignación se prevé por vía digital y la asistencia presencial atiende necesidades de acceso. Son mecanismos que cumplen funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la verificación del certificado se extiende a terceros interesados.", "a": true, "e": "Los elementos de seguridad ayudan a corroborar autenticidad. El simple hecho de que un tercero pueda verificarlo no lo convierte en órgano certificador. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, el literal a exige, además de manejar fondos para comprar inmuebles, que la agencia haga la compra a su propio nombre.", "a": false, "e": "El supuesto se centra en el manejo de fondos en la compra. No añade titularidad propia como condición. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, los profesionales independientes cumplen el recaudo de credencial aportando la afiliación de un cliente.", "a": false, "e": "La credencial corresponde al profesional que se registra, según el instituto o colegio aplicable. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, la actualización observada se subsana en cinco días hábiles contados desde que ocurrió el cambio original.", "a": false, "e": "Los cinco días hábiles comienzan con la notificación de inconsistencias. El hecho original activa el deber de actualizar. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, el órgano tiene que esperar la siguiente renovación anual para aprobar cambios ya validados.", "a": false, "e": "El trámite de actualización concluye con la aprobación de cambios cuando la revisión es satisfactoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la circular prevé que el RUSO brinde herramientas de capacitación sectorial a los sujetos obligados.", "a": true, "e": "El registro combina funciones de información y control con herramientas de autogestión. Eso no altera las vías para remitir reportes. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, la Circular 003 menciona expresamente la Providencia de RUSO publicada en G.O. 42.118.", "a": true, "e": "La Gaceta identifica la norma de base. La circular desarrolla el trámite para sus destinatarios y conserva su referencia. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, los accionistas quedan excluidos del recaudo de RIF cuando ya se aporta el RIF de los miembros de junta.", "a": false, "e": "La circular contempla ambos grupos. Verificar a gestionantes no equivale a verificar a titulares. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, los treinta días continuos para actualizar se cuentan desde la fecha de la primera inscripción.", "a": false, "e": "El hecho que activa el cómputo es el cambio, incluso si la inscripción es antigua. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, la certificación de formalización de una OSFL sustituye la documentación constitutiva de cualquier agencia mercantil.", "a": false, "e": "El recaudo especial corresponde a la OSFL. Las sociedades documentan constitución y representación conforme a su propio supuesto. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, la autoridad puede contrastar información suministrada con unidades de otros organismos públicos.", "a": true, "e": "La validación pretende confirmar autenticidad y veracidad, evitando depender solo de lo declarado por la agencia. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, el intercambio de datos con cámaras equivale a transferirles el registro como autoridad decisoria.", "a": false, "e": "La cooperación sirve para contrastar información. RUSO sigue correspondiendo al órgano rector. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b, considera este caso. Una agencia maneja fondos para una compra y un abogado independiente compra un inmueble por cuenta de un cliente. ¿Qué afirmación es correcta?", "o": ["La agencia se analiza en el literal a", "El abogado debe inscribirse como agencia por realizar una compra", "El literal b desplaza el literal a para toda compraventa"], "a": 0, "e": "La participación inmobiliaria de ambos no los convierte en la misma categoría. Cada literal describe al actor y la actividad aplicables. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 1–2, literales a–b."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios, considera este caso. Se modifica la estructura accionaria y se reforma el estatuto de una inmobiliaria registrada. ¿Qué afirmación es correcta?", "o": ["La modificación accionaria está prevista como cambio relevante", "Solo el cambio de domicilio activa actualización", "Los estatutos se revisan de nuevo solo al vencer el certificado"], "a": 0, "e": "El registro mantiene vigentes datos sobre la sociedad y su control. Ambos cambios se incluyen en los supuestos que pueden modificar información registrada. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, cambios societarios."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad, considera este caso. Un gerente presenta al equipo el RUSO como si fuera solo un buzón de RAS. ¿Qué afirmación es correcta?", "o": ["El sistema lleva registro y control", "Su función principal es recibir RAS de la UNIF", "La inscripción reemplaza el sistema interno de prevención"], "a": 0, "e": "La circular vincula el registro con control y apoyo al cumplimiento. Detectar y reportar operaciones requiere su proceso propio. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, finalidad."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial, considera este caso. La solicitud inicial presenta un faltante que la administración no puede verificar directamente. ¿Qué afirmación es correcta?", "o": ["Se debe notificar qué falta corregir", "Se aplican cinco días hábiles por tratarse de un faltante inicial", "El lapso se cuenta desde que la agencia subió su primer archivo"], "a": 0, "e": "Los diez días hábiles corresponden a inscripción. El plazo de cinco días se reserva a inconsistencias de la actualización. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, subsanación inicial."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada, considera este caso. En la inscripción se presenta la declaración jurada en línea de la inmobiliaria. ¿Qué afirmación es correcta?", "o": ["En ella se asume realizar debida diligencia del cliente", "La declaración exonera de identificar el origen de fondos más adelante", "Solo compromete a verificar el destino y excluye el origen"], "a":
