<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}

button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}

.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}

.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}

</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector inmobiliario", "sub": "34 exámenes de 50 preguntas, 14 de ellos con bloques de verdadero o falso y de selección. Banco general de 831 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Modelo ONCDOFT (RUF): 25 de verdadero o falso y 25 de selección simple, con el artículo citado", "exams": [{"titulo": "Modelo ONCDOFT 1", "orden": true, "q": [{"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), si nadie alcanza el 25 % ni ejerce control por otros medios, se registra como beneficiario final a la persona natural de más alta dirección.", "a": true, "e": "Guía EBR, punto 2.2, paso 4 (último recurso)."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la legitimación de capitales se castiga con prisión de diez a quince años.", "a": true, "e": "LOCDOFT, art. 35."}, {"t": "vf", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal el sujeto obligado puede cerrar las cuentas del cliente investigado sin autorización judicial.", "a": false, "e": "Art. 15: no puede suspender relaciones ni cerrar cuentas sin autorización previa de un juez competente."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la falta de actualización por cambios relevantes no tiene consecuencias sobre el registro.", "a": false, "e": "La circular la considera motivo razonable para suspender el registro."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado solo puede ampliarse mediante una reforma de la propia LOCDOFT.", "a": false, "e": "Art. 9, último aparte: puede extenderse mediante ley o decreto."}, {"t": "vf", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los estados financieros del último ejercicio se remiten en los primeros quince (15) días continuos de abril de cada año.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la calificación de riesgo de los clientes de riesgo alto se actualiza anualmente.", "a": false, "e": "Guía DDC, art. 14: semestralmente para riesgo alto; anualmente para riesgo moderado."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento en un sujeto regulado por ley especial se notifica en noventa (90) días.", "a": false, "e": "Art. 12: en quince (15) días continuos desde su aprobación y autorización por el órgano de control."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas es una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal ni requiere sus formalidades."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el agente inmobiliario puede relajar la debida diligencia cuando los honorarios pactados son bajos.", "a": false, "e": "Guía DDC, art. 9: no puede supeditar la debida diligencia al monto de los honorarios ni a la relevancia del cliente."}, {"t": "vf", "q": "Según el artículo 18 de la LOCDOFT, la vinculación de un cliente PEP debe aprobarla la alta gerencia del sujeto obligado.", "a": true, "e": "Art. 18."}, {"t": "vf", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, las personas naturales y jurídicas cuya actividad económica sea la compraventa de bienes raíces son sujetos obligados.", "a": true, "e": "LOCDOFT, art. 9, num. 10, literal a."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la ONCDOFT debe exigir al sujeto obligado copias certificadas de los datos que ya reposan en bases de datos de otros órganos del Estado.", "a": false, "e": "La circular dispone que la ONCDOFT los verifica de oficio y se abstiene de pedir copias redundantes."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, el certificado del RUSO debe renovarse cada año aunque no haya cambios en los datos del sujeto obligado.", "a": false, "e": "La circular prohíbe exigir renovaciones anuales cuando no varíen los datos; la certificación tiene validez indefinida mientras los datos sean exactos."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, deben inscribirse en el RUSO las agencias inmobiliarias cuando se involucren en el manejo de fondos para la compra de bienes inmuebles.", "a": true, "e": "Circular ONCDOFT-DGCJ 003-2026, ámbito: literal a."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, la venta en efectivo de un inmueble de alto valor sin intervención de prestamistas hipotecarios no es señal de alerta si el comprador es nacional.", "a": false, "e": "Circular 001125, punto 3: es señal de alerta. Trampa: se agrega una excepción que la circular no prevé."}, {"t": "vf", "q": "Según el artículo 17 de la LOCDOFT, se remite a la UNIF la información de las transacciones en efectivo realizadas en el mes anterior.", "a": true, "e": "Art. 17."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en la debida diligencia simplificada se permite verificar la identidad después de establecer la relación profesional.", "a": true, "e": "Guía DDC, art. 16, num. 1."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia contribuya a la legitimación de capitales, sin participar en ella, no tiene responsabilidad penal.", "a": false, "e": "Art. 36: prisión de tres a seis años."}, {"t": "vf", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el cambio a una actividad económica no regulada por la normativa de prevención es causa para pedir la anulación del registro.", "a": true, "e": "Art. 14, num. 3."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los sujetos obligados con un órgano de control propio hacen su registro directamente ante la ONCDOFT.", "a": false, "e": "Art. 3: su registro, actualización y anulación es responsabilidad de su órgano o ente de control."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el beneficiario final es quien posea, directa o indirectamente, el diez por ciento (10 %) o más del capital o de los derechos de voto.", "a": false, "e": "Guía DDC, art. 3: el veinticinco por ciento (25 %) o más."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la debida diligencia se aplica al inicio de la relación, en transacciones ocasionales, ante sospecha de LC/FT y cuando se duda de datos obtenidos antes.", "a": true, "e": "Guía DDC, art. 3 (definición de DDC): cuatro momentos clave."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluida satisfactoriamente la evaluación se generan credenciales para el representante legal y el oficial de cumplimiento.", "a": true, "e": "Art. 10."}, {"t": "vf", "q": "Según el artículo 16 de la LOCDOFT, el sujeto obligado debe establecer por todos los medios posibles la identidad de los terceros intervinientes y del beneficiario final.", "a": true, "e": "Art. 16."}, {"t": "mc", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro de los sujetos obligados con órgano de control propio corresponde a:", "o": ["Su órgano o ente de control", "La UNIF", "El propio sujeto obligado ante el SENIAT", "El Registro Mercantil"], "a": 0, "e": "Art. 3."}, {"t": "mc", "q": "Según el artículo 17 de la LOCDOFT, ¿qué información se remite cada mes a la UNIF?", "o": ["La de las transacciones en efectivo del mes anterior", "La de todos los clientes nuevos incorporados en el mes", "La de los estados financieros mensuales del sujeto", "La de los empleados contratados durante el mes"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según el artículo 12 de la LOCDOFT, los sujetos obligados deben detectar también:", "o": ["Las transacciones en tránsito o cuya cuantía lo amerite", "Solo las transacciones que superen los US$ 10.000 o su equivalente", "Las operaciones de clientes extranjeros no residentes, nada más", "Solo las operaciones en efectivo realizadas en la sede"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 22 de la LOCDOFT, las personas que entren o salgan del país declaran el dinero o títulos al portador que excedan:", "o": ["Diez mil dólares (US$ 10.000) o su equivalente", "Cinco mil dólares (US$ 5.000) o su equivalente", "Quince mil dólares (US$ 15.000) o su equivalente", "Mil dólares (US$ 1.000) o su equivalente"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿qué validez tiene la certificación del RUSO?", "o": ["Indefinida, mientras se mantenga la exactitud de los datos", "Un año, con renovación obligatoria en el mes de abril", "Tres años, con pago de una tasa de renovación del 25 %", "Hasta la próxima inspección in situ que haga la ONCDOFT"], "a": 0, "e": "Circular 003-2026."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cuáles son los cuatro factores de riesgo de la matriz?", "o": ["Cliente, geográfico, servicio profesional y canal de distribución", "Cliente, empleado, proveedor de servicios y accionista mayoritario", "Probabilidad, impacto, amenaza y vulnerabilidad del sector", "Efectivo, divisas, activos virtuales y transferencias externas"], "a": 0, "e": "Guía DDC, art. 11."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena corresponde al delito de legitimación de capitales?", "o": ["Prisión de diez a quince años y multa igual al incremento patrimonial ilícito", "Prisión de seis a diez años y multa igual al doble del incremento patrimonial", "Prisión de tres a seis años y multa de quinientas a mil unidades tributarias", "Prisión de quince a veinticinco años, sin multa por el incremento patrimonial"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia favorezca la legitimación de capitales, sin participar en ella, será penado con prisión de:", "o": ["Tres a seis años", "Uno a tres años", "Seis a diez años", "Diez a quince años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluido satisfactoriamente el registro se generan credenciales para:", "o": ["El representante legal y el oficial de cumplimiento", "Los accionistas y el oficial de cumplimiento", "El representante legal y el auditor externo inscrito", "La junta directiva y el contador público colegiado"], "a": 0, "e": "Art. 10, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la LOCDOFT, ¿quién aprueba la vinculación de un cliente que es persona expuesta políticamente?", "o": ["La alta gerencia del sujeto obligado", "El oficial de cumplimiento", "La UNIF", "El área comercial que capta al cliente"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la persona natural que ejerce como oficial de cumplimiento debe consignar, entre otros:", "o": ["Constancia de inscripción en el registro de oficiales de cumplimiento del órgano rector", "Certificado de antecedentes penales emitido por el Ministerio Público en los últimos tres meses", "Título universitario de abogado o de contador público, con su inscripción en el colegio", "Carta de recomendación emitida por la UNIF sobre su desempeño como oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué modalidad de debida diligencia corresponde a un cliente de riesgo moderado?", "o": ["Debida diligencia estándar", "Debida diligencia simplificada", "Debida diligencia intensificada", "Ninguna, basta la declaración de fondos"], "a": 0, "e": "Guía DDC, art. 16, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué calificación de riesgo dio la Evaluación Sectorial 2026 de la ONCDOFT al sector de agentes inmobiliarios?", "o": ["Moderada", "Baja", "Alta", "Muy alta"], "a": 0, "e": "Guía DDC, Antecedentes: Calificación de Riesgo MODERADA."}, {"t": "mc", "q": "Según el artículo 13 de la LOCDOFT, ¿qué hace la UNIF con un reporte de actividad sospechosa?", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo tramita como denuncia penal ante el tribunal de control", "Lo devuelve al sujeto obligado para que investigue al cliente", "Lo publica en su página web para alertar al sector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal, el sujeto obligado solo puede cerrar las cuentas del cliente investigado:", "o": ["Con autorización previa de un juez competente", "Con autorización del oficial de cumplimiento", "Con autorización de la UNIF", "Cuando el cliente lo pida por escrito"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado que reportó a un cliente a la UNIF:", "o": ["No puede revelárselo al cliente ni a terceros", "Debe informárselo al cliente por escrito", "Puede revelárselo si el cliente lo pregunta", "Debe publicarlo en su cartelera interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 10 de la LOCDOFT, ¿por cuánto tiempo mínimo se conservan los documentos de las operaciones?", "o": ["Cinco (5) años", "Diez (10) años", "Tres (3) años", "Quince (15) años"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa y valida la información de actualización dentro de:", "o": ["Treinta (30) días continuos desde el último recaudo", "Cinco (5) días hábiles desde la consignación", "Quince (15) días hábiles desde la solicitud", "Sesenta (60) días continuos desde la solicitud"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 6 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la OSFL que se inscribe en el RUSO debe consignar, además de los requisitos generales:", "o": ["El listado de organizaciones de las que recibe aportaciones o donaciones", "Su declaración del impuesto sobre la renta de los últimos cinco ejercicios", "Un aval bancario por el monto total de los activos de la organización", "La lista nominal de los beneficiarios de todos sus programas sociales"], "a": 0, "e": "Art. 6, num. 4 (requisitos de las OSFL)."}, {"t": "mc", "q": "Según el artículo 11 de la LOCDOFT, ¿qué cuentas no pueden mantener los sujetos obligados?", "o": ["Anónimas, cifradas, innominadas o con nombres ficticios", "En moneda extranjera, salvo autorización del Banco Central", "De personas jurídicas no domiciliadas en el país, sin excepción", "De organizaciones sin fines de lucro, aunque estén registradas"], "a": 0, "e": "Art. 11."}, {"t": "mc", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de cualquier ministerio", "Contrato entre particulares"], "a": 0, "e": "Art. 9, último aparte."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en una inmobiliaria pequeña o un agente independiente, ¿quién es el responsable de cumplimiento?", "o": ["El propio agente inmobiliario, que lleva un registro de decisiones", "Un oficial de cumplimiento que designa y supervisa la propia CIV", "El comité de gestión contra la LC/FT/FPADM de la cámara estadal", "Un auditor externo inscrito en el registro de la ONCDOFT"], "a": 0, "e": "Guía EBR, punto 1.4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿cuál de estos sujetos obligados debe inscribirse en el RUSO conforme a esa circular?", "o": ["La agencia inmobiliaria que maneja fondos para la compra de inmuebles", "La empresa de seguros autorizada y supervisada por la SUDEASEG", "La caja de ahorro inscrita y supervisada por la SUDECA", "La casa de intercambio con licencia de operación de la SUNACRIP"], "a": 0, "e": "Circular 003-2026. Los sujetos con órgano de control propio se registran a través de él (Providencia ONCDOFT-002-2021, art. 3)."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿quiénes deben inscribirse en el RUSO-ONCDOFT?", "o": ["Los sujetos obligados no regulados por ley especial ni sometidos a otro órgano de control", "Solo los bancos y las empresas de seguros, por estar sometidos a un órgano de control propio", "Solo las personas naturales que ejercen como oficiales de cumplimiento en cualquier sector", "Las empresas extranjeras domiciliadas en el país que realicen operaciones en divisas"], "a": 0, "e": "Art. 2. También deben registrarse los designados por leyes especiales o que intervengan en el sistema de cumplimiento."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuándo se remiten los estados financieros del último ejercicio fiscal?", "o": ["En los primeros quince (15) días continuos de abril", "Dentro de los noventa días del cierre del ejercicio", "En la primera quincena de enero de cada año", "Solo cuando se actualice el registro"], "a": 0, "e": "Art. 13."}]}, {"titulo": "Modelo ONCDOFT 2", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, cuando el sujeto obligado tiene oficial o responsable de cumplimiento, es este quien realiza la inscripción en el RUSO.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, la compra de múltiples bienes inmuebles sin justificación aparente es una señal de alerta del sector inmobiliario.", "a": true, "e": "Circular UNIF-DG-DSU-001125, punto 3, señales cuantitativas."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el beneficiario final es quien posea, directa o indirectamente, el diez por ciento (10 %) o más del capital o de los derechos de voto.", "a": false, "e": "Guía DDC, art. 3: el veinticinco por ciento (25 %) o más."}, {"t": "vf", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), las inconsistencias en la documentación de actualización se subsanan en cinco (5) días hábiles desde la notificación.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 9, numeral 9, de la LOCDOFT, el abogado en libre ejercicio es sujeto obligado cuando realiza para un cliente una compraventa de inmuebles.", "a": true, "e": "LOCDOFT, art. 9, num. 9, literal a."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, la venta en efectivo de un inmueble de alto valor sin intervención de prestamistas hipotecarios no es señal de alerta si el comprador es nacional.", "a": false, "e": "Circular 001125, punto 3: es señal de alerta. Trampa: se agrega una excepción que la circular no prevé."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la calificación de riesgo de los clientes de riesgo alto se actualiza anualmente.", "a": false, "e": "Guía DDC, art. 14: semestralmente para riesgo alto; anualmente para riesgo moderado."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, si la inscripción tiene inconsistencias, el sujeto obligado las subsana en un lapso de diez (10) días hábiles desde la notificación.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado solo puede ampliarse mediante una reforma de la propia LOCDOFT.", "a": false, "e": "Art. 9, último aparte: puede extenderse mediante ley o decreto."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, los cambios de domicilio, estructura accionaria o junta directiva se actualizan en el RUSO dentro de los treinta (30) días continuos.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según el artículo 12 de la LOCDOFT, deben detectarse las transacciones inusuales o sospechosas aun cuando tengan una justificación económica aparente.", "a": true, "e": "Art. 12."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la ONCDOFT debe exigir al sujeto obligado copias certificadas de los datos que ya reposan en bases de datos de otros órganos del Estado.", "a": false, "e": "La circular dispone que la ONCDOFT los verifica de oficio y se abstiene de pedir copias redundantes."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la participación o encubrimiento de legitimación de capitales es falta muy grave sancionada con la expulsión definitiva de la CIV.", "a": true, "e": "Guía DDC, art. 31 (Código de Ética de la CIV, art. 25, literal c)."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas es una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal ni requiere sus formalidades."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ante una señal de alerta el agente debe confrontar de inmediato al cliente para aclarar la operación.", "a": false, "e": "Guía EBR, punto 2.3: no debe confrontarlo; pide documentación adicional como parte de los procedimientos habituales."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro RUSO-ONCDOFT es para los sujetos obligados cuya actividad no está regulada por ley especial ni sometida a otro órgano de control.", "a": true, "e": "Providencia ONCDOFT-002-2021, arts. 1 y 2."}, {"t": "vf", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado no puede revelar al cliente que se reportó información a la UNIF.", "a": true, "e": "Art. 14."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la cláusula contractual de declaración de origen de fondos exonera al agente de hacer la debida diligencia.", "a": false, "e": "Guía EBR, punto 2.1.2: la cláusula no exonera al agente de la debida diligencia."}, {"t": "vf", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, las empresas de construcción de edificaciones, como viviendas y oficinas, son sujetos obligados.", "a": true, "e": "LOCDOFT, art. 9, num. 10, literal b."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, al inscribirse en el RUSO, el agente inmobiliario asume mediante declaración jurada en línea el compromiso de hacer debida diligencia y determinar el origen y destino de los fondos.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según el artículo 11 de la LOCDOFT, un sujeto obligado puede iniciar relaciones con un cliente cuya identidad no esté plenamente determinada si el monto es bajo.", "a": false, "e": "Art. 11: no puede iniciar ni mantener relaciones con personas cuya identidad no pueda determinarse plenamente."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, el certificado del RUSO debe renovarse cada año aunque no haya cambios en los datos del sujeto obligado.", "a": false, "e": "La circular prohíbe exigir renovaciones anuales cuando no varíen los datos; la certificación tiene validez indefinida mientras los datos sean exactos."}, {"t": "vf", "q": "Según el artículo 10 de la LOCDOFT, los sujetos obligados conservan los registros de las operaciones durante un mínimo de cinco (5) años.", "a": true, "e": "LOCDOFT, art. 10."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el expediente de cumplimiento de cada cliente se conserva cinco (5) años desde la finalización de la relación profesional.", "a": true, "e": "Guía DDC, art. 5, conforme al art. 10 de la LOCDOFT."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el agente inmobiliario puede relajar la debida diligencia cuando los honorarios pactados son bajos.", "a": false, "e": "Guía DDC, art. 9: no puede supeditar la debida diligencia al monto de los honorarios ni a la relevancia del cliente."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en el riesgo inherente, ¿qué rango de puntaje corresponde a la severidad «crítico»?", "o": ["13 a 16, calificación alto", "10 a 12, calificación moderado alto", "17 a 25, calificación muy alto", "6 a 9, calificación moderado"], "a": 0, "e": "Guía EBR, punto 1.2: aceptable 1-5, significativo 6-9, moderado 10-12, crítico 13-16, catastrófico 17-25."}, {"t": "mc", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, ¿cuál de estas actividades convierte a una persona en sujeto obligado?", "o": ["La compraventa de bienes raíces", "El arrendamiento de vivienda principal propia", "La administración de condominios residenciales", "La tasación de inmuebles para la banca"], "a": 0, "e": "Art. 9, num. 10, literal a."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuál es causa para solicitar la anulación del registro?", "o": ["La fusión que extingue la personalidad jurídica del solicitante", "La renuncia o sustitución del oficial de cumplimiento designado", "El cambio de domicilio a otro municipio dentro del mismo estado", "La reducción del número de empleados por debajo de cincuenta"], "a": 0, "e": "Art. 14, num. 4."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cada cuánto se actualiza la calificación de un cliente de riesgo alto?", "o": ["Semestralmente", "Anualmente", "Cada dos años", "Solo cuando cambie de domicilio"], "a": 0, "e": "Guía DDC, art. 14."}, {"t": "mc", "q": "Según el artículo 15 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), si la solicitud de anulación tiene defectos, el sujeto obligado los subsana en un plazo no mayor de:", "o": ["Quince (15) días hábiles", "Cinco (5) días hábiles", "Treinta (30) días continuos", "Noventa (90) días continuos"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿en qué plazo se notifican cambios de domicilio, estructura accionaria o junta directiva?", "o": ["Treinta (30) días continuos", "Quince (15) días hábiles", "Cinco (5) días hábiles", "Noventa (90) días continuos"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 16 de la LOCDOFT, el sujeto obligado debe establecer la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "Solo el cliente que firma el documento de la operación", "Solo los clientes extranjeros y los no residentes", "Los proveedores de servicios públicos del sujeto"], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento de un sujeto regulado por ley especial se notifica en:", "o": ["Quince (15) días continuos desde su aprobación por el órgano de control", "Treinta (30) días continuos desde la renuncia del oficial de cumplimiento", "Cinco (5) días hábiles desde su designación por la junta directiva del sujeto", "Noventa (90) días continuos desde la designación del nuevo oficial de cumplimiento"], "a": 0, "e": "Art. 12, último aparte."}, {"t": "mc", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro de los sujetos obligados con órgano de control propio corresponde a:", "o": ["Su órgano o ente de control", "La UNIF", "El propio sujeto obligado ante el SENIAT", "El Registro Mercantil"], "a": 0, "e": "Art. 3."}, {"t": "mc", "q": "Según el artículo 17 de la LOCDOFT, ¿qué información se remite cada mes a la UNIF?", "o": ["La de las transacciones en efectivo del mes anterior", "La de todos los clientes nuevos incorporados en el mes", "La de los estados financieros mensuales del sujeto", "La de los empleados contratados durante el mes"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según el artículo 12 de la LOCDOFT, los sujetos obligados deben detectar también:", "o": ["Las transacciones en tránsito o cuya cuantía lo amerite", "Solo las transacciones que superen los US$ 10.000 o su equivalente", "Las operaciones de clientes extranjeros no residentes, nada más", "Solo las operaciones en efectivo realizadas en la sede"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 22 de la LOCDOFT, las personas que entren o salgan del país declaran el dinero o títulos al portador que excedan:", "o": ["Diez mil dólares (US$ 10.000) o su equivalente", "Cinco mil dólares (US$ 5.000) o su equivalente", "Quince mil dólares (US$ 15.000) o su equivalente", "Mil dólares (US$ 1.000) o su equivalente"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿qué validez tiene la certificación del RUSO?", "o": ["Indefinida, mientras se mantenga la exactitud de los datos", "Un año, con renovación obligatoria en el mes de abril", "Tres años, con pago de una tasa de renovación del 25 %", "Hasta la próxima inspección in situ que haga la ONCDOFT"], "a": 0, "e": "Circular 003-2026."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cuáles son los cuatro factores de riesgo de la matriz?", "o": ["Cliente, geográfico, servicio profesional y canal de distribución", "Cliente, empleado, proveedor de servicios y accionista mayoritario", "Probabilidad, impacto, amenaza y vulnerabilidad del sector", "Efectivo, divisas, activos virtuales y transferencias externas"], "a": 0, "e": "Guía DDC, art. 11."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena corresponde al delito de legitimación de capitales?", "o": ["Prisión de diez a quince años y multa igual al incremento patrimonial ilícito", "Prisión de seis a diez años y multa igual al doble del incremento patrimonial", "Prisión de tres a seis años y multa de quinientas a mil unidades tributarias", "Prisión de quince a veinticinco años, sin multa por el incremento patrimonial"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia favorezca la legitimación de capitales, sin participar en ella, será penado con prisión de:", "o": ["Tres a seis años", "Uno a tres años", "Seis a diez años", "Diez a quince años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluido satisfactoriamente el registro se generan credenciales para:", "o": ["El representante legal y el oficial de cumplimiento", "Los accionistas y el oficial de cumplimiento", "El representante legal y el auditor externo inscrito", "La junta directiva y el contador público colegiado"], "a": 0, "e": "Art. 10, num. 1."}, {"t": "mc", "q": "Según el artículo 18 de la LOCDOFT, ¿quién aprueba la vinculación de un cliente que es persona expuesta políticamente?", "o": ["La alta gerencia del sujeto obligado", "El oficial de cumplimiento", "La UNIF", "El área comercial que capta al cliente"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la persona natural que ejerce como oficial de cumplimiento debe consignar, entre otros:", "o": ["Constancia de inscripción en el registro de oficiales de cumplimiento del órgano rector", "Certificado de antecedentes penales emitido por el Ministerio Público en los últimos tres meses", "Título universitario de abogado o de contador público, con su inscripción en el colegio", "Carta de recomendación emitida por la UNIF sobre su desempeño como oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué modalidad de debida diligencia corresponde a un cliente de riesgo moderado?", "o": ["Debida diligencia estándar", "Debida diligencia simplificada", "Debida diligencia intensificada", "Ninguna, basta la declaración de fondos"], "a": 0, "e": "Guía DDC, art. 16, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué calificación de riesgo dio la Evaluación Sectorial 2026 de la ONCDOFT al sector de agentes inmobiliarios?", "o": ["Moderada", "Baja", "Alta", "Muy alta"], "a": 0, "e": "Guía DDC, Antecedentes: Calificación de Riesgo MODERADA."}, {"t": "mc", "q": "Según el artículo 13 de la LOCDOFT, ¿qué hace la UNIF con un reporte de actividad sospechosa?", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo tramita como denuncia penal ante el tribunal de control", "Lo devuelve al sujeto obligado para que investigue al cliente", "Lo publica en su página web para alertar al sector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal, el sujeto obligado solo puede cerrar las cuentas del cliente investigado:", "o": ["Con autorización previa de un juez competente", "Con autorización del oficial de cumplimiento", "Con autorización de la UNIF", "Cuando el cliente lo pida por escrito"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado que reportó a un cliente a la UNIF:", "o": ["No puede revelárselo al cliente ni a terceros", "Debe informárselo al cliente por escrito", "Puede revelárselo si el cliente lo pregunta", "Debe publicarlo en su cartelera interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 10 de la LOCDOFT, ¿por cuánto tiempo mínimo se conservan los documentos de las operaciones?", "o": ["Cinco (5) años", "Diez (10) años", "Tres (3) años", "Quince (15) años"], "a": 0, "e": "Art. 10."}]}, {"titulo": "Modelo ONCDOFT 3", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, cuando el sujeto obligado tiene oficial o responsable de cumplimiento, es este quien realiza la inscripción en el RUSO.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal el sujeto obligado puede cerrar las cuentas del cliente investigado sin autorización judicial.", "a": false, "e": "Art. 15: no puede suspender relaciones ni cerrar cuentas sin autorización previa de un juez competente."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la calificación de riesgo de los clientes de riesgo alto se actualiza anualmente.", "a": false, "e": "Guía DDC, art. 14: semestralmente para riesgo alto; anualmente para riesgo moderado."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el agente inmobiliario puede relajar la debida diligencia cuando los honorarios pactados son bajos.", "a": false, "e": "Guía DDC, art. 9: no puede supeditar la debida diligencia al monto de los honorarios ni a la relevancia del cliente."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el beneficiario final es quien posea, directa o indirectamente, el diez por ciento (10 %) o más del capital o de los derechos de voto.", "a": false, "e": "Guía DDC, art. 3: el veinticinco por ciento (25 %) o más."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas es una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal ni requiere sus formalidades."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa los recaudos de forma extra situ y puede hacer visitas in situ para verificarlos.", "a": true, "e": "Art. 9."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la cláusula contractual de declaración de origen de fondos exonera al agente de hacer la debida diligencia.", "a": false, "e": "Guía EBR, punto 2.1.2: la cláusula no exonera al agente de la debida diligencia."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la ONCDOFT debe exigir al sujeto obligado copias certificadas de los datos que ya reposan en bases de datos de otros órganos del Estado.", "a": false, "e": "La circular dispone que la ONCDOFT los verifica de oficio y se abstiene de pedir copias redundantes."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los cambios de domicilio, estructura accionaria o junta directiva se notifican dentro de los treinta (30) días continuos siguientes.", "a": true, "e": "Art. 12."}, {"t": "vf", "q": "Según el artículo 18 de la LOCDOFT, la vinculación de un cliente PEP debe aprobarla la alta gerencia del sujeto obligado.", "a": true, "e": "Art. 18."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia contribuya a la legitimación de capitales, sin participar en ella, no tiene responsabilidad penal.", "a": false, "e": "Art. 36: prisión de tres a seis años."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado solo puede ampliarse mediante una reforma de la propia LOCDOFT.", "a": false, "e": "Art. 9, último aparte: puede extenderse mediante ley o decreto."}, {"t": "vf", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, las personas naturales y jurídicas cuya actividad económica sea la compraventa de bienes raíces son sujetos obligados.", "a": true, "e": "LOCDOFT, art. 9, num. 10, literal a."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), si nadie alcanza el 25 % ni ejerce control por otros medios, se registra como beneficiario final a la persona natural de más alta dirección.", "a": true, "e": "Guía EBR, punto 2.2, paso 4 (último recurso)."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, la venta en efectivo de un inmueble de alto valor sin intervención de prestamistas hipotecarios no es señal de alerta si el comprador es nacional.", "a": false, "e": "Circular 001125, punto 3: es señal de alerta. Trampa: se agrega una excepción que la circular no prevé."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, el certificado del RUSO debe renovarse cada año aunque no haya cambios en los datos del sujeto obligado.", "a": false, "e": "La circular prohíbe exigir renovaciones anuales cuando no varíen los datos; la certificación tiene validez indefinida mientras los datos sean exactos."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la debida diligencia se aplica al inicio de la relación, en transacciones ocasionales, ante sospecha de LC/FT y cuando se duda de datos obtenidos antes.", "a": true, "e": "Guía DDC, art. 3 (definición de DDC): cuatro momentos clave."}, {"t": "vf", "q": "Según el artículo 17 de la LOCDOFT, se remite a la UNIF la información de las transacciones en efectivo realizadas en el mes anterior.", "a": true, "e": "Art. 17."}, {"t": "vf", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los estados financieros del último ejercicio se remiten en los primeros quince (15) días continuos de abril de cada año.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 11 de la LOCDOFT, un sujeto obligado puede iniciar relaciones con un cliente cuya identidad no esté plenamente determinada si el monto es bajo.", "a": false, "e": "Art. 11: no puede iniciar ni mantener relaciones con personas cuya identidad no pueda determinarse plenamente."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ante una señal de alerta el agente debe confrontar de inmediato al cliente para aclarar la operación.", "a": false, "e": "Guía EBR, punto 2.3: no debe confrontarlo; pide documentación adicional como parte de los procedimientos habituales."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la falta de actualización por cambios relevantes no tiene consecuencias sobre el registro.", "a": false, "e": "La circular la considera motivo razonable para suspender el registro."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, la UNIF analiza los reportes de actividades sospechosas y, de ser el caso, los remite al Ministerio Público.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el cambio a una actividad económica no regulada por la normativa de prevención es causa para pedir la anulación del registro.", "a": true, "e": "Art. 14, num. 3."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa y valida la información de actualización dentro de:", "o": ["Treinta (30) días continuos desde el último recaudo", "Cinco (5) días hábiles desde la consignación", "Quince (15) días hábiles desde la solicitud", "Sesenta (60) días continuos desde la solicitud"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 6 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la OSFL que se inscribe en el RUSO debe consignar, además de los requisitos generales:", "o": ["El listado de organizaciones de las que recibe aportaciones o donaciones", "Su declaración del impuesto sobre la renta de los últimos cinco ejercicios", "Un aval bancario por el monto total de los activos de la organización", "La lista nominal de los beneficiarios de todos sus programas sociales"], "a": 0, "e": "Art. 6, num. 4 (requisitos de las OSFL)."}, {"t": "mc", "q": "Según el artículo 11 de la LOCDOFT, ¿qué cuentas no pueden mantener los sujetos obligados?", "o": ["Anónimas, cifradas, innominadas o con nombres ficticios", "En moneda extranjera, salvo autorización del Banco Central", "De personas jurídicas no domiciliadas en el país, sin excepción", "De organizaciones sin fines de lucro, aunque estén registradas"], "a": 0, "e": "Art. 11."}, {"t": "mc", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de cualquier ministerio", "Contrato entre particulares"], "a": 0, "e": "Art. 9, último aparte."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en una inmobiliaria pequeña o un agente independiente, ¿quién es el responsable de cumplimiento?", "o": ["El propio agente inmobiliario, que lleva un registro de decisiones", "Un oficial de cumplimiento que designa y supervisa la propia CIV", "El comité de gestión contra la LC/FT/FPADM de la cámara estadal", "Un auditor externo inscrito en el registro de la ONCDOFT"], "a": 0, "e": "Guía EBR, punto 1.4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿cuál de estos sujetos obligados debe inscribirse en el RUSO conforme a esa circular?", "o": ["La agencia inmobiliaria que maneja fondos para la compra de inmuebles", "La empresa de seguros autorizada y supervisada por la SUDEASEG", "La caja de ahorro inscrita y supervisada por la SUDECA", "La casa de intercambio con licencia de operación de la SUNACRIP"], "a": 0, "e": "Circular 003-2026. Los sujetos con órgano de control propio se registran a través de él (Providencia ONCDOFT-002-2021, art. 3)."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿quiénes deben inscribirse en el RUSO-ONCDOFT?", "o": ["Los sujetos obligados no regulados por ley especial ni sometidos a otro órgano de control", "Solo los bancos y las empresas de seguros, por estar sometidos a un órgano de control propio", "Solo las personas naturales que ejercen como oficiales de cumplimiento en cualquier sector", "Las empresas extranjeras domiciliadas en el país que realicen operaciones en divisas"], "a": 0, "e": "Art. 2. También deben registrarse los designados por leyes especiales o que intervengan en el sistema de cumplimiento."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuándo se remiten los estados financieros del último ejercicio fiscal?", "o": ["En los primeros quince (15) días continuos de abril", "Dentro de los noventa días del cierre del ejercicio", "En la primera quincena de enero de cada año", "Solo cuando se actualice el registro"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en el riesgo inherente, ¿qué rango de puntaje corresponde a la severidad «crítico»?", "o": ["13 a 16, calificación alto", "10 a 12, calificación moderado alto", "17 a 25, calificación muy alto", "6 a 9, calificación moderado"], "a": 0, "e": "Guía EBR, punto 1.2: aceptable 1-5, significativo 6-9, moderado 10-12, crítico 13-16, catastrófico 17-25."}, {"t": "mc", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, ¿cuál de estas actividades convierte a una persona en sujeto obligado?", "o": ["La compraventa de bienes raíces", "El arrendamiento de vivienda principal propia", "La administración de condominios residenciales", "La tasación de inmuebles para la banca"], "a": 0, "e": "Art. 9, num. 10, literal a."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuál es causa para solicitar la anulación del registro?", "o": ["La fusión que extingue la personalidad jurídica del solicitante", "La renuncia o sustitución del oficial de cumplimiento designado", "El cambio de domicilio a otro municipio dentro del mismo estado", "La reducción del número de empleados por debajo de cincuenta"], "a": 0, "e": "Art. 14, num. 4."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cada cuánto se actualiza la calificación de un cliente de riesgo alto?", "o": ["Semestralmente", "Anualmente", "Cada dos años", "Solo cuando cambie de domicilio"], "a": 0, "e": "Guía DDC, art. 14."}, {"t": "mc", "q": "Según el artículo 15 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), si la solicitud de anulación tiene defectos, el sujeto obligado los subsana en un plazo no mayor de:", "o": ["Quince (15) días hábiles", "Cinco (5) días hábiles", "Treinta (30) días continuos", "Noventa (90) días continuos"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿en qué plazo se notifican cambios de domicilio, estructura accionaria o junta directiva?", "o": ["Treinta (30) días continuos", "Quince (15) días hábiles", "Cinco (5) días hábiles", "Noventa (90) días continuos"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 16 de la LOCDOFT, el sujeto obligado debe establecer la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "Solo el cliente que firma el documento de la operación", "Solo los clientes extranjeros y los no residentes", "Los proveedores de servicios públicos del sujeto"], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento de un sujeto regulado por ley especial se notifica en:", "o": ["Quince (15) días continuos desde su aprobación por el órgano de control", "Treinta (30) días continuos desde la renuncia del oficial de cumplimiento", "Cinco (5) días hábiles desde su designación por la junta directiva del sujeto", "Noventa (90) días continuos desde la designación del nuevo oficial de cumplimiento"], "a": 0, "e": "Art. 12, último aparte."}, {"t": "mc", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro de los sujetos obligados con órgano de control propio corresponde a:", "o": ["Su órgano o ente de control", "La UNIF", "El propio sujeto obligado ante el SENIAT", "El Registro Mercantil"], "a": 0, "e": "Art. 3."}, {"t": "mc", "q": "Según el artículo 17 de la LOCDOFT, ¿qué información se remite cada mes a la UNIF?", "o": ["La de las transacciones en efectivo del mes anterior", "La de todos los clientes nuevos incorporados en el mes", "La de los estados financieros mensuales del sujeto", "La de los empleados contratados durante el mes"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según el artículo 12 de la LOCDOFT, los sujetos obligados deben detectar también:", "o": ["Las transacciones en tránsito o cuya cuantía lo amerite", "Solo las transacciones que superen los US$ 10.000 o su equivalente", "Las operaciones de clientes extranjeros no residentes, nada más", "Solo las operaciones en efectivo realizadas en la sede"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 22 de la LOCDOFT, las personas que entren o salgan del país declaran el dinero o títulos al portador que excedan:", "o": ["Diez mil dólares (US$ 10.000) o su equivalente", "Cinco mil dólares (US$ 5.000) o su equivalente", "Quince mil dólares (US$ 15.000) o su equivalente", "Mil dólares (US$ 1.000) o su equivalente"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿qué validez tiene la certificación del RUSO?", "o": ["Indefinida, mientras se mantenga la exactitud de los datos", "Un año, con renovación obligatoria en el mes de abril", "Tres años, con pago de una tasa de renovación del 25 %", "Hasta la próxima inspección in situ que haga la ONCDOFT"], "a": 0, "e": "Circular 003-2026."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cuáles son los cuatro factores de riesgo de la matriz?", "o": ["Cliente, geográfico, servicio profesional y canal de distribución", "Cliente, empleado, proveedor de servicios y accionista mayoritario", "Probabilidad, impacto, amenaza y vulnerabilidad del sector", "Efectivo, divisas, activos virtuales y transferencias externas"], "a": 0, "e": "Guía DDC, art. 11."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena corresponde al delito de legitimación de capitales?", "o": ["Prisión de diez a quince años y multa igual al incremento patrimonial ilícito", "Prisión de seis a diez años y multa igual al doble del incremento patrimonial", "Prisión de tres a seis años y multa de quinientas a mil unidades tributarias", "Prisión de quince a veinticinco años, sin multa por el incremento patrimonial"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia favorezca la legitimación de capitales, sin participar en ella, será penado con prisión de:", "o": ["Tres a seis años", "Uno a tres años", "Seis a diez años", "Diez a quince años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluido satisfactoriamente el registro se generan credenciales para:", "o": ["El representante legal y el oficial de cumplimiento", "Los accionistas y el oficial de cumplimiento", "El representante legal y el auditor externo inscrito", "La junta directiva y el contador público colegiado"], "a": 0, "e": "Art. 10, num. 1."}]}, {"titulo": "Modelo ONCDOFT 4", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, deben inscribirse en el RUSO las agencias inmobiliarias cuando se involucren en el manejo de fondos para la compra de bienes inmuebles.", "a": true, "e": "Circular ONCDOFT-DGCJ 003-2026, ámbito: literal a."}, {"t": "vf", "q": "Según el artículo 11 de la LOCDOFT, un sujeto obligado puede iniciar relaciones con un cliente cuya identidad no esté plenamente determinada si el monto es bajo.", "a": false, "e": "Art. 11: no puede iniciar ni mantener relaciones con personas cuya identidad no pueda determinarse plenamente."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el beneficiario final es quien posea, directa o indirectamente, el diez por ciento (10 %) o más del capital o de los derechos de voto.", "a": false, "e": "Guía DDC, art. 3: el veinticinco por ciento (25 %) o más."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, la compra de múltiples bienes inmuebles sin justificación aparente es una señal de alerta del sector inmobiliario.", "a": true, "e": "Circular UNIF-DG-DSU-001125, punto 3, señales cuantitativas."}, {"t": "vf", "q": "Según el artículo 10 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), concluida satisfactoriamente la evaluación se generan credenciales para el representante legal y el oficial de cumplimiento.", "a": true, "e": "Art. 10."}, {"t": "vf", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal el sujeto obligado puede cerrar las cuentas del cliente investigado sin autorización judicial.", "a": false, "e": "Art. 15: no puede suspender relaciones ni cerrar cuentas sin autorización previa de un juez competente."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la cláusula contractual de declaración de origen de fondos exonera al agente de hacer la debida diligencia.", "a": false, "e": "Guía EBR, punto 2.1.2: la cláusula no exonera al agente de la debida diligencia."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas es una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal ni requiere sus formalidades."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el expediente de cumplimiento de cada cliente se conserva cinco (5) años desde la finalización de la relación profesional.", "a": true, "e": "Guía DDC, art. 5, conforme al art. 10 de la LOCDOFT."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento en un sujeto regulado por ley especial se notifica en noventa (90) días.", "a": false, "e": "Art. 12: en quince (15) días continuos desde su aprobación y autorización por el órgano de control."}, {"t": "vf", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), las inconsistencias en la documentación de actualización se subsanan en cinco (5) días hábiles desde la notificación.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 4 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), entre los requisitos generales está consignar estados financieros auditados o certificados por un contador público colegiado.", "a": true, "e": "Art. 4, num. 2, literal d."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la falta de actualización por cambios relevantes no tiene consecuencias sobre el registro.", "a": false, "e": "La circular la considera motivo razonable para suspender el registro."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia contribuya a la legitimación de capitales, sin participar en ella, no tiene responsabilidad penal.", "a": false, "e": "Art. 36: prisión de tres a seis años."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la legitimación de capitales se castiga con prisión de diez a quince años.", "a": true, "e": "LOCDOFT, art. 35."}, {"t": "vf", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado no puede revelar al cliente que se reportó información a la UNIF.", "a": true, "e": "Art. 14."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el agente inmobiliario puede relajar la debida diligencia cuando los honorarios pactados son bajos.", "a": false, "e": "Guía DDC, art. 9: no puede supeditar la debida diligencia al monto de los honorarios ni a la relevancia del cliente."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, si la inscripción tiene inconsistencias, el sujeto obligado las subsana en un lapso de diez (10) días hábiles desde la notificación.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, los cambios de domicilio, estructura accionaria o junta directiva se actualizan en el RUSO dentro de los treinta (30) días continuos.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ante una señal de alerta el agente debe confrontar de inmediato al cliente para aclarar la operación.", "a": false, "e": "Guía EBR, punto 2.3: no debe confrontarlo; pide documentación adicional como parte de los procedimientos habituales."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la ONCDOFT debe exigir al sujeto obligado copias certificadas de los datos que ya reposan en bases de datos de otros órganos del Estado.", "a": false, "e": "La circular dispone que la ONCDOFT los verifica de oficio y se abstiene de pedir copias redundantes."}, {"t": "vf", "q": "Según el artículo 12 de la LOCDOFT, deben detectarse las transacciones inusuales o sospechosas aun cuando tengan una justificación económica aparente.", "a": true, "e": "Art. 12."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la participación o encubrimiento de legitimación de capitales es falta muy grave sancionada con la expulsión definitiva de la CIV.", "a": true, "e": "Guía DDC, art. 31 (Código de Ética de la CIV, art. 25, literal c)."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los sujetos obligados con un órgano de control propio hacen su registro directamente ante la ONCDOFT.", "a": false, "e": "Art. 3: su registro, actualización y anulación es responsabilidad de su órgano o ente de control."}, {"t": "vf", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, las empresas de construcción de edificaciones, como viviendas y oficinas, son sujetos obligados.", "a": true, "e": "LOCDOFT, art. 9, num. 10, literal b."}, {"t": "mc", "q": "Según el artículo 18 de la LOCDOFT, ¿quién aprueba la vinculación de un cliente que es persona expuesta políticamente?", "o": ["La alta gerencia del sujeto obligado", "El oficial de cumplimiento", "La UNIF", "El área comercial que capta al cliente"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según el artículo 7 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la persona natural que ejerce como oficial de cumplimiento debe consignar, entre otros:", "o": ["Constancia de inscripción en el registro de oficiales de cumplimiento del órgano rector", "Certificado de antecedentes penales emitido por el Ministerio Público en los últimos tres meses", "Título universitario de abogado o de contador público, con su inscripción en el colegio", "Carta de recomendación emitida por la UNIF sobre su desempeño como oficial de cumplimiento"], "a": 0, "e": "Art. 7, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué modalidad de debida diligencia corresponde a un cliente de riesgo moderado?", "o": ["Debida diligencia estándar", "Debida diligencia simplificada", "Debida diligencia intensificada", "Ninguna, basta la declaración de fondos"], "a": 0, "e": "Guía DDC, art. 16, num. 2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿qué calificación de riesgo dio la Evaluación Sectorial 2026 de la ONCDOFT al sector de agentes inmobiliarios?", "o": ["Moderada", "Baja", "Alta", "Muy alta"], "a": 0, "e": "Guía DDC, Antecedentes: Calificación de Riesgo MODERADA."}, {"t": "mc", "q": "Según el artículo 13 de la LOCDOFT, ¿qué hace la UNIF con un reporte de actividad sospechosa?", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo tramita como denuncia penal ante el tribunal de control", "Lo devuelve al sujeto obligado para que investigue al cliente", "Lo publica en su página web para alertar al sector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal, el sujeto obligado solo puede cerrar las cuentas del cliente investigado:", "o": ["Con autorización previa de un juez competente", "Con autorización del oficial de cumplimiento", "Con autorización de la UNIF", "Cuando el cliente lo pida por escrito"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 14 de la LOCDOFT, el sujeto obligado que reportó a un cliente a la UNIF:", "o": ["No puede revelárselo al cliente ni a terceros", "Debe informárselo al cliente por escrito", "Puede revelárselo si el cliente lo pregunta", "Debe publicarlo en su cartelera interna"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según el artículo 10 de la LOCDOFT, ¿por cuánto tiempo mínimo se conservan los documentos de las operaciones?", "o": ["Cinco (5) años", "Diez (10) años", "Tres (3) años", "Quince (15) años"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa y valida la información de actualización dentro de:", "o": ["Treinta (30) días continuos desde el último recaudo", "Cinco (5) días hábiles desde la consignación", "Quince (15) días hábiles desde la solicitud", "Sesenta (60) días continuos desde la solicitud"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 6 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la OSFL que se inscribe en el RUSO debe consignar, además de los requisitos generales:", "o": ["El listado de organizaciones de las que recibe aportaciones o donaciones", "Su declaración del impuesto sobre la renta de los últimos cinco ejercicios", "Un aval bancario por el monto total de los activos de la organización", "La lista nominal de los beneficiarios de todos sus programas sociales"], "a": 0, "e": "Art. 6, num. 4 (requisitos de las OSFL)."}, {"t": "mc", "q": "Según el artículo 11 de la LOCDOFT, ¿qué cuentas no pueden mantener los sujetos obligados?", "o": ["Anónimas, cifradas, innominadas o con nombres ficticios", "En moneda extranjera, salvo autorización del Banco Central", "De personas jurídicas no domiciliadas en el país, sin excepción", "De organizaciones sin fines de lucro, aunque estén registradas"], "a": 0, "e": "Art. 11."}, {"t": "mc", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de cualquier ministerio", "Contrato entre particulares"], "a": 0, "e": "Art. 9, último aparte."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en una inmobiliaria pequeña o un agente independiente, ¿quién es el responsable de cumplimiento?", "o": ["El propio agente inmobiliario, que lleva un registro de decisiones", "Un oficial de cumplimiento que designa y supervisa la propia CIV", "El comité de gestión contra la LC/FT/FPADM de la cámara estadal", "Un auditor externo inscrito en el registro de la ONCDOFT"], "a": 0, "e": "Guía EBR, punto 1.4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿cuál de estos sujetos obligados debe inscribirse en el RUSO conforme a esa circular?", "o": ["La agencia inmobiliaria que maneja fondos para la compra de inmuebles", "La empresa de seguros autorizada y supervisada por la SUDEASEG", "La caja de ahorro inscrita y supervisada por la SUDECA", "La casa de intercambio con licencia de operación de la SUNACRIP"], "a": 0, "e": "Circular 003-2026. Los sujetos con órgano de control propio se registran a través de él (Providencia ONCDOFT-002-2021, art. 3)."}, {"t": "mc", "q": "Según el artículo 2 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿quiénes deben inscribirse en el RUSO-ONCDOFT?", "o": ["Los sujetos obligados no regulados por ley especial ni sometidos a otro órgano de control", "Solo los bancos y las empresas de seguros, por estar sometidos a un órgano de control propio", "Solo las personas naturales que ejercen como oficiales de cumplimiento en cualquier sector", "Las empresas extranjeras domiciliadas en el país que realicen operaciones en divisas"], "a": 0, "e": "Art. 2. También deben registrarse los designados por leyes especiales o que intervengan en el sistema de cumplimiento."}, {"t": "mc", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuándo se remiten los estados financieros del último ejercicio fiscal?", "o": ["En los primeros quince (15) días continuos de abril", "Dentro de los noventa días del cierre del ejercicio", "En la primera quincena de enero de cada año", "Solo cuando se actualice el registro"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), en el riesgo inherente, ¿qué rango de puntaje corresponde a la severidad «crítico»?", "o": ["13 a 16, calificación alto", "10 a 12, calificación moderado alto", "17 a 25, calificación muy alto", "6 a 9, calificación moderado"], "a": 0, "e": "Guía EBR, punto 1.2: aceptable 1-5, significativo 6-9, moderado 10-12, crítico 13-16, catastrófico 17-25."}, {"t": "mc", "q": "Según el artículo 9, numeral 10, de la LOCDOFT, ¿cuál de estas actividades convierte a una persona en sujeto obligado?", "o": ["La compraventa de bienes raíces", "El arrendamiento de vivienda principal propia", "La administración de condominios residenciales", "La tasación de inmuebles para la banca"], "a": 0, "e": "Art. 9, num. 10, literal a."}, {"t": "mc", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿cuál es causa para solicitar la anulación del registro?", "o": ["La fusión que extingue la personalidad jurídica del solicitante", "La renuncia o sustitución del oficial de cumplimiento designado", "El cambio de domicilio a otro municipio dentro del mismo estado", "La reducción del número de empleados por debajo de cincuenta"], "a": 0, "e": "Art. 14, num. 4."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cada cuánto se actualiza la calificación de un cliente de riesgo alto?", "o": ["Semestralmente", "Anualmente", "Cada dos años", "Solo cuando cambie de domicilio"], "a": 0, "e": "Guía DDC, art. 14."}, {"t": "mc", "q": "Según el artículo 15 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), si la solicitud de anulación tiene defectos, el sujeto obligado los subsana en un plazo no mayor de:", "o": ["Quince (15) días hábiles", "Cinco (5) días hábiles", "Treinta (30) días continuos", "Noventa (90) días continuos"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), ¿en qué plazo se notifican cambios de domicilio, estructura accionaria o junta directiva?", "o": ["Treinta (30) días continuos", "Quince (15) días hábiles", "Cinco (5) días hábiles", "Noventa (90) días continuos"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 16 de la LOCDOFT, el sujeto obligado debe establecer la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "Solo el cliente que firma el documento de la operación", "Solo los clientes extranjeros y los no residentes", "Los proveedores de servicios públicos del sujeto"], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento de un sujeto regulado por ley especial se notifica en:", "o": ["Quince (15) días continuos desde su aprobación por el órgano de control", "Treinta (30) días continuos desde la renuncia del oficial de cumplimiento", "Cinco (5) días hábiles desde su designación por la junta directiva del sujeto", "Noventa (90) días continuos desde la designación del nuevo oficial de cumplimiento"], "a": 0, "e": "Art. 12, último aparte."}, {"t": "mc", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro de los sujetos obligados con órgano de control propio corresponde a:", "o": ["Su órgano o ente de control", "La UNIF", "El propio sujeto obligado ante el SENIAT", "El Registro Mercantil"], "a": 0, "e": "Art. 3."}]}, {"titulo": "Modelo ONCDOFT 5", "orden": true, "q": [{"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, el certificado del RUSO debe renovarse cada año aunque no haya cambios en los datos del sujeto obligado.", "a": false, "e": "La circular prohíbe exigir renovaciones anuales cuando no varíen los datos; la certificación tiene validez indefinida mientras los datos sean exactos."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, el empleado de un sujeto obligado que por negligencia contribuya a la legitimación de capitales, sin participar en ella, no tiene responsabilidad penal.", "a": false, "e": "Art. 36: prisión de tres a seis años."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), el beneficiario final es quien posea, directa o indirectamente, el diez por ciento (10 %) o más del capital o de los derechos de voto.", "a": false, "e": "Guía DDC, art. 3: el veinticinco por ciento (25 %) o más."}, {"t": "vf", "q": "Según el artículo 14 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el cambio a una actividad económica no regulada por la normativa de prevención es causa para pedir la anulación del registro.", "a": true, "e": "Art. 14, num. 3."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ante una señal de alerta el agente debe confrontar de inmediato al cliente para aclarar la operación.", "a": false, "e": "Guía EBR, punto 2.3: no debe confrontarlo; pide documentación adicional como parte de los procedimientos habituales."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la calificación de riesgo de los clientes de riesgo alto se actualiza anualmente.", "a": false, "e": "Guía DDC, art. 14: semestralmente para riesgo alto; anualmente para riesgo moderado."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la falta de actualización por cambios relevantes no tiene consecuencias sobre el registro.", "a": false, "e": "La circular la considera motivo razonable para suspender el registro."}, {"t": "vf", "q": "Según el artículo 9, numeral 9, de la LOCDOFT, el abogado en libre ejercicio es sujeto obligado cuando realiza para un cliente una compraventa de inmuebles.", "a": true, "e": "LOCDOFT, art. 9, num. 9, literal a."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, cuando el sujeto obligado tiene oficial o responsable de cumplimiento, es este quien realiza la inscripción en el RUSO.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según el artículo 15 de la LOCDOFT, durante una investigación penal el sujeto obligado puede cerrar las cuentas del cliente investigado sin autorización judicial.", "a": false, "e": "Art. 15: no puede suspender relaciones ni cerrar cuentas sin autorización previa de un juez competente."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, al inscribirse en el RUSO, el agente inmobiliario asume mediante declaración jurada en línea el compromiso de hacer debida diligencia y determinar el origen y destino de los fondos.", "a": true, "e": "Circular 003-2026."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la debida diligencia se aplica al inicio de la relación, en transacciones ocasionales, ante sospecha de LC/FT y cuando se duda de datos obtenidos antes.", "a": true, "e": "Guía DDC, art. 3 (definición de DDC): cuatro momentos clave."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los cambios de domicilio, estructura accionaria o junta directiva se notifican dentro de los treinta (30) días continuos siguientes.", "a": true, "e": "Art. 12."}, {"t": "vf", "q": "Según el artículo 12 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la sustitución definitiva del oficial de cumplimiento en un sujeto regulado por ley especial se notifica en noventa (90) días.", "a": false, "e": "Art. 12: en quince (15) días continuos desde su aprobación y autorización por el órgano de control."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgo para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), la cláusula contractual de declaración de origen de fondos exonera al agente de hacer la debida diligencia.", "a": false, "e": "Guía EBR, punto 2.1.2: la cláusula no exonera al agente de la debida diligencia."}, {"t": "vf", "q": "Según el artículo 3 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los sujetos obligados con un órgano de control propio hacen su registro directamente ante la ONCDOFT.", "a": false, "e": "Art. 3: su registro, actualización y anulación es responsabilidad de su órgano o ente de control."}, {"t": "vf", "q": "Según el artículo 9 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), la ONCDOFT revisa los recaudos de forma extra situ y puede hacer visitas in situ para verificarlos.", "a": true, "e": "Art. 9."}, {"t": "vf", "q": "Según el artículo 11 de la LOCDOFT, un sujeto obligado puede iniciar relaciones con un cliente cuya identidad no esté plenamente determinada si el monto es bajo.", "a": false, "e": "Art. 11: no puede iniciar ni mantener relaciones con personas cuya identidad no pueda determinarse plenamente."}, {"t": "vf", "q": "Según el artículo 1 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), el registro RUSO-ONCDOFT es para los sujetos obligados cuya actividad no está regulada por ley especial ni sometida a otro órgano de control.", "a": true, "e": "Providencia ONCDOFT-002-2021, arts. 1 y 2."}, {"t": "vf", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, la ONCDOFT debe exigir al sujeto obligado copias certificadas de los datos que ya reposan en bases de datos de otros órganos del Estado.", "a": false, "e": "La circular dispone que la ONCDOFT los verifica de oficio y se abstiene de pedir copias redundantes."}, {"t": "vf", "q": "Según el artículo 13 de la Providencia ONCDOFT-002-2021 (RUSO-ONCDOFT), los estados financieros del último ejercicio se remiten en los primeros quince (15) días continuos de abril de cada año.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 10 de la LOCDOFT, los sujetos obligados conservan los registros de las operaciones durante un mínimo de cinco (5) años.", "a": true, "e": "LOCDOFT, art. 10."}, {"t": "vf", "q": "Según el artículo 17 de la LOCDOFT, se remite a la UNIF la información de las transacciones en efectivo realizadas en el mes anterior.", "a": true, "e": "Art. 17."}, {"t": "vf", "q": "Según el artículo 9 de la LOCDOFT, la categoría de sujeto obligado solo puede ampliarse mediante una reforma de la propia LOCDOFT.", "a": false, "e": "Art. 9, último aparte: puede extenderse mediante ley o decreto."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, la UNIF analiza los reportes de actividades sospechosas y, de ser el caso, los remite al Ministerio Público.", "a": true, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 17 de la LOCDOFT, ¿qué información se remite cada mes a la UNIF?", "o": ["La de las transacciones en efectivo del mes anterior", "La de todos los clientes nuevos incorporados en el mes", "La de los estados financieros mensuales del sujeto", "La de los empleados contratados durante el mes"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según el artículo 12 de la LOCDOFT, los sujetos obligados deben detectar también:", "o": ["Las transacciones en tránsito o cuya cuantía lo amerite", "Solo las transacciones que superen los US$ 10.000 o su equivalente", "Las operaciones de clientes extranjeros no residentes, nada más", "Solo las operaciones en efectivo realizadas en la sede"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según el artículo 22 de la LOCDOFT, las personas que entren o salgan del país declaran el dinero o títulos al portador que excedan:", "o": ["Diez mil dólares (US$ 10.000) o su equivalente", "Cinco mil dólares (US$ 5.000) o su equivalente", "Quince mil dólares (US$ 15.000) o su equivalente", "Mil dólares (US$ 1.000) o su equivalente"], "a": 0, "e": "Art. 22."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, ¿qué validez tiene la certificación del RUSO?", "o": ["Indefinida, mientras se mantenga la exactitud de los datos", "Un año, con renovación obligatoria en el mes de abril", "Tres años, con pago de una tasa de renovación del 25 %", "Hasta la próxima inspección in situ que haga la ONCDOFT"], "a": 0, "e": "Circular 003-2026."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente para Agentes Inmobiliarios (CIV-ONCDOFT, 2026), ¿cuáles son los cuatro factores de riesgo de la matriz?", "o": ["Cliente, geográfico, servicio profesional y canal de distribución", "Cliente, empleado, proveedor de servicios y accionista mayoritario", "Probabilidad, impacto, amenaza y vulnerabilidad del sector", "Efectivo, divisas, activos virtuales y transferencias externas"], "a": 0, "e": "Guía DDC, art. 11."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena corresponde al delito de legitimación de capitales?", "o": ["Prisión de diez a quince años y multa igual al incremento patrimonial ilícito", "Prisión de seis a diez años y multa igual al doble del incremento patrimonial", "Prisión de tres a seis años y multa de quinientas a mil unidades tributarias", "Prisión de quince a veintic
