<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector inmobiliario", "sub": "20 exámenes de 50 preguntas. Banco de 751 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la bancarización obligatoria de honorarios tiene como sector prioritario a:", "o": ["Los abogados", "Las inmobiliarias", "Los contadores", "Los tres sectores"], "a": 0, "e": "Eje de gestión de efectivo. Trampa: las inmobiliarias son prioritarias, con los abogados, en el monitoreo in situ."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, los defectos de una solicitud de anulación se subsanan en un plazo no mayor de cinco días hábiles.", "a": false, "e": "Art. 15: no mayor de quince días hábiles. Trampa: cinco días hábiles es el plazo de la actualización."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, según las amenazas regionales, el sector inmobiliario ocupa, entre los más vulnerados, el:", "o": ["Tercer lugar, tras el bancario y el automotriz", "Primer lugar, antes que el sector bancario", "Último lugar, tras todos los no financieros", "Segundo lugar, tras el sector de seguros"], "a": 0, "e": "Cuarta Actualización del Informe de Amenazas Regionales."}, {"t": "vf", "q": "Según el GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "Según el GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el 55 % de los sectores de APNFD carece de guías para sus matrices de riesgo.", "a": false, "e": "Informe del GAFILAT de 2023: el 55 % cuenta con alguna directriz o guía. Trampa: se invierte el dato."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, una sociedad tiene un socio con 20 % y otro, con 10 %, que dirige de hecho todas las decisiones. Es beneficiario final:", "o": ["Quien ejerce el control efectivo", "Quien tiene el mayor porcentaje", "Ninguno, por no llegar al 25 %", "Ambos, por ser socios de ella"], "a": 0, "e": "25 % del capital o control efectivo."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la aplicación de controles bajo el enfoque basado en riesgos no puede ser:", "o": ["Genérica ni reactiva", "Documentada ni medida", "Proporcional ni eficaz", "Específica ni continua"], "a": 0, "e": "Introducción."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, Venezuela es miembro pleno del GAFIC y no del GAFILAT.", "a": true, "e": "Sección de antecedentes y contexto regional."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una sociedad inmobiliaria presenta un acta extranjera en castellano, sin apostilla. La ONCDOFT:", "o": ["No debe aceptarla sin apostilla o legalización", "Debe aceptarla por estar en castellano", "Debe aceptarla con traducción de intérprete", "Debe aceptarla con certificación de contador"], "a": 0, "e": "Art. 4."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, un tasador que interviene en una compraventa de inmuebles:", "o": ["Puede tener en cuenta también la guía", "Queda excluido por no ser un corredor", "Queda excluido por no recibir dinero", "Solo aplica si trabaja para un banco"], "a": 0, "e": "Terminología."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la certificación de que la estructura accionaria coincide con el libro de accionistas la emite el comisario de la sociedad.", "a": false, "e": "Art. 5, num. 2, lit. c: la emite la junta directiva. Trampa: se cambia el emisor."}, {"t": "mc", "q": "La verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "mc", "q": "Según el GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, según el GAFIC, entre 2015 y 2020 se estimó que en los Estados Unidos se legitimaron a través de bienes raíces:", "o": ["USD 2,3 mil millones", "USD 1.100 millones", "USD 626,3 millones", "USD 15 mil millones"], "a": 0, "e": "Reino Unido: 1.100; Canadá: 626,3."}]}, {"titulo": "Examen integral 2", "q": [{"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales no figura:", "o": ["La UNIF", "La Fuerza Armada Nacional Bolivariana", "El Cuerpo de Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26. Trampa: sorprende que la Fuerza Armada sí figure y la UNIF no."}, {"t": "vf", "q": "Según el GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según el GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el sujeto obligado debe notificar un cambio de domicilio o de estructura accionaria dentro de los:", "o": ["Treinta días continuos siguientes", "Quince días continuos siguientes", "Treinta días hábiles siguientes", "Cinco días hábiles siguientes"], "a": 0, "e": "Art. 12. Trampa: la sustitución del oficial de los regulados se notifica en quince días."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Solo penalización y extradición", "Solo medidas preventivas del sector público", "Solo la cooperación entre las unidades de inteligencia financiera"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la Recomendación 19 del GAFI, citada en la guía, se refiere a:", "o": ["Medidas respecto de países de mayor riesgo", "Reportes de operaciones sospechosas", "Controles internos en el extranjero", "Personas expuestas políticamente"], "a": 0, "e": "R.18: controles internos; R.20: reportes."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las actividades del informe del GAFI de 2007 son indicativas, aunque no concluyentes, de legitimación de capitales.", "a": true, "e": "Tipologías citadas en la guía."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, se recomienda a los tres sectores aplicar debida diligencia reforzada a toda operación con PEP y:", "o": ["Transacciones inmobiliarias de alto valor", "Arrendamientos de vivienda de bajo canon", "Toda operación en moneda nacional pagada", "Operaciones entre familiares sin excepción"], "a": 0, "e": "Recomendaciones."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, las PEP que abusan de su posición presentan un alto riesgo para el sector inmobiliario.", "a": true, "e": "Aplicación del EBR."}, {"t": "mc", "q": "La «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la relación con una persona expuesta políticamente requiere aprobación de la alta gerencia y monitoreo continuo.", "a": true, "e": "Fase I."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "Según el GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "vf", "q": "Según la LOCDOFT, una inmobiliaria sin órgano de control sectorial queda libre de reportar actividades sospechosas.", "a": false, "e": "Es sujeto obligado y debe reportar a la UNIF."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según el GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, una inmobiliaria recibe una propuesta de venta por debajo del valor de mercado, con pago urgente en efectivo. Esto presenta:", "o": ["Varias señales de alerta combinadas", "Una operación de riesgo nulo", "Una exención a la debida diligencia", "Un requisito normal de avalúo"], "a": 0, "e": "Discrepancia de precio, prisa y efectivo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "mc", "q": "Según el GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "La información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "vf", "q": "Según el GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el universo de 333.343 inscritos corresponde a:", "o": ["Los abogados", "Los contadores públicos", "Los agentes inmobiliarios", "Los tres sectores juntos"], "a": 0, "e": "172.024 son contadores y 6.841, afiliados inmobiliarios."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, el sector inmobiliario cuenta con veinte cámaras inmobiliarias y cinco capítulos inmobiliarios.", "a": true, "e": "Marco legal nacional. Trampa: se confunde con el número de estados."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "vf", "q": "Según el GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}]}, {"titulo": "Examen integral 3", "q": [{"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, existe una brecha en la percepción del riesgo de FT y FPADM frente a la de legitimación de capitales.", "a": true, "e": "Conclusiones."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, entre los métodos señalados de la cadena delictiva, el rol final de los agentes inmobiliarios es:", "o": ["La colocación de fondos en activos tangibles", "La creación de estructuras societarias opacas", "La certificación contable de flujos de caja", "La recepción de reportes de inteligencia"], "a": 0, "e": "Sección I.1.B: estratificación coordinada."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "vf", "q": "Según el GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la designación de nuevos miembros de la junta directiva no requiere actualizar el registro.", "a": false, "e": "Art. 12: debe notificarse dentro de treinta días continuos. Trampa: se piensa solo en domicilio y accionistas."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "vf", "q": "Según el GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, la capacitación debe incluir talleres de simulación de casos reales, y no solo clases magistrales.", "a": true, "e": "Fase I."}, {"t": "mc", "q": "Según el GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "vf", "q": "Según la LOCDOFT, deben detectarse las transacciones inusuales aun cuando tengan una justificación económica aparente.", "a": true, "e": "Art. 12. Trampa: se cree que la justificación aparente las excluye."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "vf", "q": "Según la Guía del GAFILAT para APNFD de 2022, la aparición del cliente en noticias negativas es una señal de alerta del sector inmobiliario.", "a": true, "e": "Tabla 19, literal g."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "vf", "q": "Según la Circular UNIF 001125 de 2024, un grupo de personas con perfiles similares que compran viviendas sobre plano puede indicar fraude hipotecario organizado.", "a": true, "e": "Sección 3."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Según la LOCDOFT, mantener cuentas anónimas o con nombres ficticios se sanciona con multa de:", "o": ["500 a 1.000 U.T.", "300 a 500 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 11. Trampa: 1.000 a 3.000 U.T. es la multa por no identificar al beneficiario final."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, si la solicitud de anulación tiene defectos, deben subsanarse en un período no mayor a:", "o": ["Quince días hábiles", "Cinco días hábiles", "Treinta días continuos", "Noventa días continuos"], "a": 0, "e": "Art. 15. Trampa: el plazo de actualización es de cinco días hábiles."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las R.3 y R.36 a R.40 del GAFI", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, una compra de contado, sin crédito ni banco, resulta más riesgosa porque:", "o": ["Evita instituciones financieras reguladas", "Reduce el precio final de la operación", "Elimina el pago de tributos municipales", "Evita la intervención del registrador"], "a": 0, "e": "Aplicación del EBR."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la Cámara Inmobiliaria de Venezuela actúa como organismo de autorregulación del sector.", "a": true, "e": "Sección II.1."}]}, {"titulo": "Examen integral 4", "q": [{"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, la cifra de USD 1.100 millones legitimados en bienes raíces entre 2015 y 2020 corresponde a:", "o": ["El Reino Unido", "Los Estados Unidos", "Canadá", "Venezuela"], "a": 0, "e": "Estados Unidos: 2,3 mil millones; Canadá: 626,3 millones."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria constituida en Venezuela e inscrita ante la ONCDOFT cambia de domicilio. Debe:", "o": ["Actualizar el registro dentro del plazo de treinta días", "Esperar la siguiente inspección para comunicarlo", "Comunicarlo solo en sus estados financieros anuales", "Solicitar la anulación del registro de la empresa"], "a": 0, "e": "Art. 12."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "vf", "q": "Según el GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, según la circular, en el período 2017-2019 las sentencias condenatorias regionales correspondientes a agentes inmobiliarios fueron del:", "o": ["12 %", "29 %", "19 %", "55 %"], "a": 0, "e": "Sobre 25 sentencias condenatorias."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "Según el Plan de Supervisión 2026 de la ONCDOFT, las inspecciones in situ aleatorias a sectores de riesgo alto se ubican en:", "o": ["La Fase II, cuarto trimestre de 2026", "La Fase I, segundo trimestre de 2026", "La Fase I, tercer trimestre de 2026", "La Fase II, primer trimestre de 2027"], "a": 0, "e": "Fases de implementación."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, el acta de asamblea que acredita la junta directiva se admite aunque su período esté vencido.", "a": false, "e": "Art. 5, num. 1, lit. c: sin que se encuentre vencido su período. Trampa: se suprime la condición."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005, los bienes raíces comerciales pueden ser especialmente vulnerables por la mayor presencia de entidades legales.", "a": true, "e": "Aplicación del EBR."}, {"t": "vf", "q": "Que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "El autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una inmobiliaria cambia su estructura accionaria y, luego, la ONCDOFT detecta inconsistencias en la actualización. Los plazos son:", "o": ["30 días continuos y 5 hábiles para subsanar", "15 días continuos y 15 hábiles para subsanar", "5 días hábiles y 30 continuos para subsanar", "30 días hábiles y 15 continuos para subsanar"], "a": 0, "e": "Arts. 12 y 13."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información de una autoridad extranjera por vía no oficial. ¿Qué debe hacer?", "o": ["Canalizarla por mecanismos oficiales", "Responder directamente para colaborar", "Ignorarla por provenir del extranjero", "Informar al cliente de la solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un corredor quiere enviar su reporte de sospecha a la Cámara Inmobiliaria para que ella lo tramite. Debe saber que:", "o": ["El reporte se dirige a la UNIF", "La Cámara lo remite a la ONCDOFT", "La Cámara decide si se reporta", "El reporte se dirige al SAREN"], "a": 0, "e": "La CIV agrupa al gremio, pero no recibe reportes."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "vf", "q": "Según el GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, una sociedad mercantil debe informar su estructura accionaria hasta determinar el beneficiario final.", "a": true, "e": "Art. 5.2."}, {"t": "mc", "q": "¿Qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "El análisis media entre ambas."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Según la Providencia ONCDOFT-002-2021, la anulación del registro opera de pleno derecho con la sola solicitud del sujeto obligado.", "a": false, "e": "Art. 15: el órgano rector revisa en treinta días continuos, decide y notifica por oficio. Trampa: se suprime la decisión."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "vf", "q": "Según el GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "vf", "q": "Según el GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}]}, {"titulo": "Examen integral 5", "q": [{"t": "mc", "q": "Según el Convenio de 1999, las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "mc", "q": "Un supervisor encuentra que un sujeto obligado ha reportado cero ROS en cinco años pese a un volumen alto de operaciones. ¿Qué lectura es razonable?", "o": ["Posibles fallas de detección o de reporte", "Cartera limpia sin riesgo de lavado", "Mérito que reconoce el supervisor en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "Según el GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, en el sector inmobiliario, el porcentaje de eventos con riesgo residual aceptable es:", "o": ["86 %", "14 %", "91 %", "20 %"], "a": 0, "e": "6 de 7 eventos. El 91 % es de contadores."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar al cliente que fue reportado a la UNIF se duplica en caso de reincidencia.", "a": true, "e": "Art. 14. Trampa: se cree que la reincidencia solo agrava la pena penal."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "mc", "q": "Un plan operativo que se ejecuta en un cincuenta por ciento revela:", "o": ["Una debilidad que exige acciones correctivas", "Un desempeño aceptable del área", "Un plan demasiado conservador", "Una gestión eficiente de los recursos disponibles"], "a": 0, "e": "El informe de ejecución sirve para corregir."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Según el GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según la Circular UNIF 001125 de 2024, un comprador no revela la fuente de una compra de alto valor en moneda extranjera. El agente debe:", "o": ["Tratarlo como señal de alerta y profundizar", "Dar por válida la operación por ser en divisas", "Reducir el precio para acelerar el negocio", "Cerrar la venta y omitir toda documentación"], "a": 0, "e": "Sección 3."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una solicitud de anulación llega con defectos. El sujeto subsana y la ONCDOFT revisa, respectivamente, en:", "o": ["15 días hábiles y 30 continuos", "5 días hábiles y 15 continuos", "30 días continuos y 15 hábiles", "15 días continuos y 5 hábiles"], "a": 0, "e": "Art. 15."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "¿Qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre empresa y cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la cifra de afiliados del sector inmobiliario incluye asesores independientes y franquicias.", "a": true, "e": "Sección II.2. Trampa: se cree que solo cuenta personas naturales."}, {"t": "vf", "q": "Según el GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Según el GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "vf", "q": "Según el GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "vf", "q": "Según el GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "vf", "q": "Según la LOCDOFT, una constructora de oficinas puede ser sujeto obligado aunque no actúe como corredor ni venda por encargo de terceros.", "a": true, "e": "Art. 9, numeral 10, literal b."}, {"t": "vf", "q": "Según el enfoque basado en
