 0, "e": "La declaración deja constancia del compromiso operativo. Formularla no prueba que la entidad ya haya hecho diligencia en cada expediente. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, declaración jurada."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final, considera este caso. Un asesor usa la Circular 002-2026 de septiembre para orientar la inscripción inmobiliaria. ¿Qué afirmación es correcta?", "o": ["La 003-2026 deja sin efecto esa circular anterior", "La 002 de 2026 sigue siendo el instructivo aplicable por ser anterior", "La 003 deja sin efecto la Providencia ONCDOFT-002-2021"], "a": 0, "e": "La disposición final alcanza a la Circular DGCJ-002-2026. El número 002 no identifica el mismo instrumento que la Providencia de 2021. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, disposición final."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, interoperabilidad, considera este caso. El sistema ya contiene un documento en la base de otro ente estatal consultable por ONCDOFT. ¿Qué afirmación es correcta?", "o": ["La ONCDOFT debe verificar de oficio los datos disponibles", "El interesado solicita la misma certificación de nuevo por regla", "La consulta la realiza únicamente la cámara gremial"], "a": 0, "e": "La interoperabilidad procura evitar duplicación. Se distingue el documento verificable de oficio del faltante que sí debe subsanar el solicitante. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, interoperabilidad."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, corrección de actualización, considera este caso. La ONCDOFT notifica que el archivo de una actualización presenta inconsistencias. ¿Qué afirmación es correcta?", "o": ["Corresponde subsanar dentro de cinco días hábiles", "Rigen los diez días hábiles de inscripción inicial", "Corresponde contar cinco días continuos desde el cambio"], "a": 0, "e": "La etapa del trámite determina el plazo. Los cinco días hábiles se aplican a inconsistencias de actualización y los diez a la inscripción inicial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, corrección de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios, considera este caso. Una compañía local selecciona los documentos que acreditan su existencia y representación. ¿Qué afirmación es correcta?", "o": ["Corresponde el acta constitutiva inscrita con actualizaciones", "La publicidad de la inmobiliaria sustituye los estatutos", "El certificado de afiliación sustituye la identificación del representante"], "a": 0, "e": "Se verifica tanto la constitución vigente como quién actúa por ella. Un documento comercial o gremial no acredita esos extremos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 2, requisitos societarios."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3, considera este caso. Una empresa compara el trámite de una inmobiliaria sin ente de control propio con el de un sujeto supervisado por otro órgano. ¿Qué afirmación es correcta?", "o": ["El sujeto sin ente propio acude al órgano rector", "Ambos tienen que tramitar por la Cámara Inmobiliaria", "El organismo competente cambia únicamente al solicitar anulación"], "a": 0, "e": "La ruta depende de la supervisión que corresponda. La regla comprende registro, actualización y anulación. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 3."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, sociedad extranjera, considera este caso. Una sociedad mercantil constituida en el extranjero presenta recaudos para inscribirse. ¿Qué afirmación es correcta?", "o": ["Se prevé el documento de inscripción del registro extranjero competente", "La inscripción extranjera excluye el certificado venezolano", "El acta de una afiliación gremial venezolana basta por sí sola"], "a": 0, "e": "Son requisitos adicionales para acreditar el origen societario y la documentación mercantil solicitada en Venezuela. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, sociedad extranjera."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, objeto, considera este caso. Una agencia quiere saber si el instrumento se agota en emitir el certificado inicial. ¿Qué afirmación es correcta?", "o": ["La circular regula requisitos de inscripción", "Toda modificación requiere una inscripción inicial nueva", "La circular crea un registro ajeno a ONCDOFT"], "a": 0, "e": "El texto establece dos trámites distintos dentro del mismo registro. Una actualización mantiene y corrige los datos de la inscripción. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1, objeto."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez, considera este caso. Una agencia lleva más de un año inscrita y todos sus datos permanecen exactos. ¿Qué afirmación es correcta?", "o": ["La validez no está sujeta a vencimiento anual", "Debe renovarse cada año aunque nada haya cambiado", "La validez indefinida elimina el deber de actualizar"], "a": 0, "e": "El certificado no funciona como una licencia anual. La continuidad depende de que los datos se mantengan exactos. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, validez."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos, considera este caso. El responsable confunde el plazo del órgano para revisar una actualización con el plazo del solicitante para corregirla. ¿Qué afirmación es correcta?", "o": ["La revisión usa treinta días continuos desde el último recaudo", "El órgano y el solicitante disponen de cinco días hábiles", "La corrección se cuenta desde que el órgano recibió el último recaudo"], "a": 0, "e": "Uno es el tiempo del supervisor para revisar lo consignado y otro el del solicitante para responder a una observación. El hito de cada plazo es distinto. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 5–6, lapsos."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 3, grupo económico, considera este caso. Una agencia miembro de un grupo controlado prepara la información sobre su matriz y sus vinculadas. ¿Qué afirmación es correcta?", "o": ["Debe documentar el dato fiscal de la matriz", "El dato fiscal de la matriz se sustituye por el del cliente", "El vínculo con el grupo se acredita solo con su marca comercial"], "a": 0, "e": "La circular busca trazabilidad de quién controla y cómo se vinculan las integrantes. Compartir una marca no acredita estructura ni representación. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 3, grupo económico."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 1, literal a, considera este caso. Una agencia maneja fondos de clientes para comprarles inmuebles y pregunta si basta su afiliación a una Cámara. ¿Qué afirmación es correcta?", "o": ["El manejo de fondos para la compra encaja en el literal", "La afiliación gremial sustituye la inscripción", "La operación se registra únicamente ante la UNIF"], "a": 0, "e": "La circular formula el supuesto mediante la actividad efectivamente realizada. La afiliación y el canal de reportes cumplen otras funciones. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 1, literal a."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), arts. 1–3, considera este caso. Una inmobiliaria comprendida como sujeto obligado carece de órgano sectorial de control propio. ¿Qué afirmación es correcta?", "o": ["Tramita su registro directamente ante ONCDOFT", "Debe tramitar directamente ante la UNIF", "La ausencia de supervisor propio elimina el registro"], "a": 0, "e": "La providencia diferencia el trámite directo ante el órgano rector del que se gestiona por un ente de control propio. UNIF no es la ventanilla RUSO. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), arts. 1–3."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento, considera este caso. La inmobiliaria tiene un responsable formal y prepara la consignación. ¿Qué afirmación es correcta?", "o": ["Ese responsable se encarga de la inscripción", "El responsable carece de papel aunque exista formalmente", "El hecho de tener RIF sustituye la constancia de designación"], "a": 0, "e": "La circular asigna el trámite a quien ejerce el rol cuando existe y exige prueba de su nombramiento además de sus recaudos personales. Fuente: la Circular ONCDOFT-DGCJ 003-2026, pp. 3–4, responsable de cumplimiento."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado, considera este caso. La ONCDOFT concluye favorablemente la evaluación de una inscripción. ¿Qué afirmación es correcta?", "o": ["El resultado se comunica por correo electrónico", "Se requiere que la UNIF emita el certificado", "El registro no prevé comprobación de autenticidad por terceros"], "a": 0, "e": "La evaluación satisfactoria origina un certificado verificable. Una notificación de resultado y el certificado son pasos conectados, con funciones distintas. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, resultado y certificado."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios, considera este caso. La información actualizada ha sido validada satisfactoriamente. ¿Qué afirmación es correcta?", "o": ["El órgano rector aprueba los cambios pertinentes", "Una actualización obliga a tramitar ante UNIF un registro independiente", "El solicitante aprueba por sí mismo los cambios al cargar los documentos"], "a": 0, "e": "El resultado es una decisión de la ONCDOFT sobre los datos existentes. La aprobación no es un segundo registro ante otra institución. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, aprobación de cambios."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4, considera este caso. Una sociedad trata de inscribirse presentando solo el nombre comercial y el correo. ¿Qué afirmación es correcta?", "o": ["La condición de sujeto obligado es un requisito", "El nombre de fantasía sustituye toda identificación", "El registro es un trámite de certificación de marca"], "a": 0, "e": "RUSO registra a personas o entidades obligadas. El dato comercial es insuficiente para satisfacer la identificación exigida. Fuente: la Providencia ONCDOFT-002-2021 (G.O. 42.118), art. 4."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias, considera este caso. La ONCDOFT detecta omisiones en una solicitud inicial y analiza cómo comunicarlas. ¿Qué afirmación es correcta?", "o": ["La notificación puede ser electrónica", "Solo se admite el correo postal certificado", "Basta advertir verbalmente que hay un problema sin especificarlo"], "a": 0, "e": "La comunicación debe identificar lo que se pide subsanar y activar el cómputo desde la notificación. El medio puede ser electrónico o presencial. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 5, notificación de inconsistencias."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, omisión de actualización, considera este caso. Una agencia no notifica un cambio relevante y alega que su certificado carece de fecha de vencimiento. ¿Qué afirmación es correcta?", "o": ["La falta de actualización puede motivar una suspensión", "La falta de vencimiento impide suspender el registro", "La omisión convierte el certificado en renovable automáticamente cada año"], "a": 0, "e": "Suspensión por incumplir el deber de actualizar y caducidad periódica son figuras diferentes. La circular contempla la primera. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, omisión de actualización."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 4, consignación, considera este caso. Una agencia carga sus recaudos y una persona necesita apoyo por dificultades digitales. ¿Qué afirmación es correcta?", "o": ["El trámite prevé consignación digital", "La sola necesidad de asistencia extingue el trámite", "El procedimiento excluye la atención presencial de apoyo"], "a": 0, "e": "La plataforma es el mecanismo de registro. La asistencia facilita el acceso y no sustituye la revisión de la solicitud. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 4, consignación."}, {"t": "mc", "q": "Según la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación, considera este caso. Una Cámara y un ente de control tienen datos necesarios para comprobar el estatus de una inmobiliaria. ¿Qué afirmación es correcta?", "o": ["La circular prevé cooperación con ONCDOFT", "La Cámara reemplaza al órgano rector al decidir el registro", "La coordinación exige duplicar todos los recaudos al administrado"], "a": 0, "e": "El intercambio busca cotejar el estatus y evitar duplicaciones. La cooperación no transfiere la competencia decisoria. Fuente: la Circular ONCDOFT-DGCJ 003-2026, p. 6, cooperación."}]}]}, {"titulo": "UNIF y guías inmobiliarias de LC/FT/FPADM · modelos temáticos", "exams": [{"titulo": "UNIF y guías inmobiliarias de LC/FT/FPADM · modelo 1", "orden": true, "q": [{"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, cuando hay dos personas naturales que controlan conjuntamente, solo interesa la que otorgó poder al representante.", "a": false, "e": "La finalidad es determinar quién posee o controla finalmente. La firma de un poder no define por sí sola qué personas se identifican. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03, la ficha de evaluación de la operación cumple una función distinta de la ficha de identificación del cliente particular.", "a": true, "e": "Una registra el riesgo del negocio y la otra documenta al cliente. Pueden coexistir en el mismo expediente. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, una transacción ocasional figura entre los supuestos que pueden requerir debida diligencia.", "a": true, "e": "El control no depende de establecer una relación permanente. La operación aislada también puede activar verificaciones. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, las alertas cualitativas dependen exclusivamente del desembolso de una suma por encima de un umbral.", "a": false, "e": "El comportamiento y la estructura del cliente pueden encender alertas sin que un monto fijo sea el criterio. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, el análisis sectorial reconoce actividades como avalúo, corretaje y administración de inmuebles.", "a": true, "e": "La enumeración describe actividades del sector. No implica que cada actividad esté cubierta del mismo modo por todos los estándares. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3, la mejor respuesta inicial a una alerta es informar al cliente de la sospecha para que indique qué debe verificarse.", "a": false, "e": "El análisis debe pedir respaldo como parte del procedimiento ordinario. La guía recomienda evitar confrontar al cliente al detectar la señal. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una difícil identificación del beneficiario real pierde importancia porque la compradora presentó su acta constitutiva.", "a": false, "e": "El documento identifica la entidad formal. No necesariamente aclara quién ejerce el control o se beneficia. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una presión anormal para cerrar solo merece análisis una vez formalizada la compraventa.", "a": false, "e": "El comportamiento puede observarse antes del cierre. Esperar a protocolizar pierde la oportunidad de revisar el contexto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la guía relaciona la Recomendación 19 con medidas para países de mayor riesgo.", "a": true, "e": "Esa materia se distingue de los controles internos de la 18 y el reporte de la 20. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, enumerar los servicios de un agente equivale a declarar que todos activan los mismos deberes del GAFI.", "a": false, "e": "La circular distingue el catálogo sectorial del alcance concreto de los estándares. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, el control por otros medios merece revisión aunque no se identifique un titular que alcance el umbral de participación.", "a": true, "e": "La titularidad y el control son vías distintas. Agotar solo la primera puede dejar sin identificar al verdadero controlador. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, la diligencia simplificada equivale a prescindir de verificar la identidad.", "a": false, "e": "Simplificar permite ajustar el alcance o momento conforme al supuesto. No convierte la identidad en irrelevante. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, portada y circular de remisión, 04043 identifica la circular de remisión y 2026-005 identifica la guía que la acompaña.", "a": true, "e": "Confundir ambos identificadores dificulta localizar el pasaje aplicable. Se cita la guía para su metodología y la circular para su remisión. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, portada y circular de remisión."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02, la guía destina CIV-01 a persona jurídica y CIV-02 únicamente a una persona natural sin vínculos empresariales.", "a": false, "e": "CIV-01 corresponde a la persona natural y CIV-02 al cliente jurídico y su beneficiario final. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, el control final puede recaer en una persona física distinta de quien figura como titular inmediato.", "a": true, "e": "La revisión busca el control efectivo en última instancia. Una cadena formal de titularidad puede ocultar quién toma decisiones. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14, la revisión de un cliente de riesgo alto tiene una periodicidad distinta de la de un cliente moderado.", "a": true, "e": "La guía distingue la reevaluación semestral de alto riesgo de la anual para moderado. No son instrucciones intercambiables. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una venta de alto valor en efectivo sin financiación hipotecaria puede constituir una señal cuantitativa.", "a": true, "e": "La forma de financiar y la materialidad se evalúan juntas. No se excluye la alerta por tratarse de un comprador conocido. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, las tipologías recogidas por la guía constituyen una conclusión automática de legitimación de capitales para cualquier operación parecida.", "a": false, "e": "El parecido con una tipología orienta el análisis. La conclusión del caso requiere evaluar hechos y soportes concretos. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes, el receptor del reporte de sospecha pasa a ser el órgano rector del RUSO cuando el intermediario ya tiene certificado.", "a": false, "e": "El canal de reportes sigue siendo la UNIF. El certificado acredita un trámite distinto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la Recomendación 20 se estudia como la regla de identificación de países de mayor riesgo.", "a": false, "e": "La 20 se refiere a reporte de actividades sospechosas. Las medidas sobre países de mayor riesgo se relacionan con la 19. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, la falta de explicación de un precio considerablemente inferior al valor real merece análisis, igual que una sobrevaloración.", "a": true, "e": "La desviación significativa importa en ambas direcciones. El precio menor no elimina el riesgo de ocultar fondos u operaciones. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, una relación inmobiliaria puntual puede aportar menos historial de cliente que una relación bancaria duradera.", "a": true, "e": "La menor continuidad puede limitar el contexto disponible. La guía lo presenta como diferencia relevante al diseñar controles. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción, un procedimiento diseñado para reaccionar solo cuando se presenta una sospecha agota la gestión basada en riesgos.", "a": false, "e": "También se exige conocer la exposición y diseñar controles proporcionados antes de que aparezca el caso. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 5, la conservación del expediente se cuenta siempre desde la primera reunión con el cliente.", "a": false, "e": "La guía refiere el plazo a la finalización de la relación profesional en el supuesto indicado. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 5."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, el abuso de posición por una persona expuesta políticamente puede elevar el riesgo inmobiliario.", "a": true, "e": "La guía identifica la posible utilización de la posición como exposición relevante. La evaluación se apoya en la operación y el perfil. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2, considera este caso. La promesa de venta contiene una declaración contractual sobre origen de fondos. ¿Qué afirmación es correcta?", "o": ["La cláusula puede aportar un soporte al expediente", "La firma de la declaración sustituye la verificación", "La cláusula impide pedir documentos adicionales"], "a": 0, "e": "La manifestación contractual y la comprobación son actividades distintas. El documento es una evidencia que debe valorarse con el resto de la información. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, considera este caso. El cliente habitual presenta datos contradictorios y sostiene que solo se verifica al abrir el expediente. ¿Qué afirmación es correcta?", "o": ["Las dudas sobre información previa pueden activar diligencia", "La diligencia se agota al abrir la relación", "La relación habitual impide revisar datos dudosos"], "a": 0, "e": "La guía contempla la diligencia como una actividad que puede reactivarse por nuevos hechos. Haber abierto un expediente no valida inconsistencias posteriores. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. La agencia cuenta con un manual actualizado, pero su personal no sabe reconocer una operación inusual. ¿Qué afirmación es correcta?", "o": ["La formación continua sigue siendo pertinente", "La existencia de un manual elimina la capacitación", "El entrenamiento se limita a la firma de nuevos contratos"], "a": 0, "e": "La eficacia operativa depende de que el personal reconozca patrones y aplique controles. La documentación y la capacidad para usarla son distintas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes, considera este caso. Un cliente pide mantener una gran suma y reembolsarla luego a una cuenta distinta de la cuenta de origen. ¿Qué afirmación es correcta?", "o": ["La instrucción de devolución a otra cuenta es relevante", "El reembolso elimina la necesidad de entender los fondos", "La orden del cliente convierte el hecho en mero trámite registral"], "a": 0, "e": "El cambio de cuenta puede alterar el destino de los fondos. Una instrucción válida entre partes no despeja por sí sola la señal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Un cliente pretende pagar parte en criptoactivos, a distancia, preservando el anonimato. ¿Qué afirmación es correcta?", "o": ["El anonimato en esa estructura de pago merece revisión", "Las transferencias digitales quedan fuera de la circular", "La ausencia de reunión física es prueba de ilicitud por sí sola"], "a": 0, "e": "El caso requiere analizar conjuntamente modalidad de pago, falta de identificación y contexto. Una operación remota no se califica únicamente por su canal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Una agencia aplica un control idéntico a todas las operaciones y solo lo revisa después de un incidente. ¿Qué afirmación es correcta?", "o": ["Debe conocer su exposición específica", "Un control único posterior cumple el enfoque basado en riesgos", "Toda diferencia entre operaciones debe ignorarse para asegurar uniformidad"], "a": 0, "e": "El enfoque requiere medidas proporcionales y eficaces. Copiar un procedimiento reactivo evita evaluar dónde están los riesgos que el control debe abordar. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, considera este caso. El responsable distribuye funciones entre diligencia al cliente y reporte de actividades sospechosas. ¿Qué afirmación es correcta?", "o": ["La Recomendación 22 se vincula con DDC y registros de APNFD", "La Recomendación 22 regula el trámite del certificado RUSO", "La Recomendación 23 sustituye la diligencia de la Recomendación 22"], "a": 0, "e": "Las recomendaciones cumplen funciones complementarias. La 22 cubre diligencia y conservación, y la 23 conecta controles y reporte con la actividad cubierta. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Una operación sobre plano concentra compradores con perfiles similares y no existe explicación comercial suficiente. ¿Qué afirmación es correcta?", "o": ["El patrón puede ser indicio de fraude hipotecario organizado", "Toda compra sobre plano constituye fraude hipotecario", "Se descarta el patrón si cada comprador firma por separado"], "a": 0, "e": "La señal se refiere a un patrón de perfiles y operaciones semejantes. Firmas distintas no explican coincidencias ni demuestran el delito. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Un cliente adquiere varios inmuebles sin razón aparente y pretende pagar una venta rápida en efectivo. ¿Qué afirmación es correcta?", "o": ["La multiplicidad sin justificación es una alerta", "Cada compra debe aislarse para evitar examinar el patrón", "La modalidad de efectivo convierte el hecho en alerta solo cualitativa"], "a": 0, "e": "La circular reconoce indicadores por la frecuencia o magnitud de operaciones y por la modalidad de pago. El agregado aporta contexto al análisis de cada compra. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, considera este caso. En una compraventa intervienen corredor, tasador y abogado; se discute si el cargo por sí solo define la cobertura. ¿Qué afirmación es correcta?", "o": ["La guía considera otros profesionales vinculados con compraventas", "El título profesional define por sí solo todos los deberes", "La guía se limita a corredores que trabajan dentro de agencias"], "a": 0, "e": "La orientación atiende a la actividad que conecta a cada actor con la operación. No atribuye automáticamente una misma cobertura a todos los servicios de cada título. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Una propiedad se transmite repetidamente en un período breve con aumentos que no explica ninguna mejora. ¿Qué afirmación es correcta?", "o": ["La sucesión rápida de ventas es relevante", "La inscripción de cada venta neutraliza la alerta", "Solo interesa el valor que figure en la última escritura"], "a": 0, "e": "Debe evaluarse el patrón y la explicación económica del precio. La formalidad registral no aclara aumentos que carecen de soporte. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y Circular 04043 de remisión, considera este caso. El agente encuentra un perfil de exposición elevada y posibles elementos de sospecha. ¿Qué afirmación es correcta?", "o": ["La guía orienta a intensificar diligencia ante mayor riesgo", "La intensificación se aplica solo después del RAS", "La calificación alta equivale automáticamente a reportar"], "a": 0, "e": "Riesgo y sospecha son decisiones relacionadas y distintas. El primero orienta la intensidad de las comprobaciones y el segundo exige examinar los hechos. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y Circular 04043 de remisión."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, considera este caso. Una adquisición comercial utiliza varias entidades jurídicas cuya estructura no se entiende. ¿Qué afirmación es correcta?", "o": ["La estructura legal puede elevar la exposición", "La naturaleza comercial reduce siempre el riesgo frente a vivienda", "Solo se revisa la razón social que aparece en el contrato"], "a": 0, "e": "Las estructuras usadas en bienes comerciales pueden dificultar identificar a las personas de control. Una razón social no basta para apreciar toda la exposición. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Se manipula una tasación para que coincida con un precio que el corredor no ha podido justificar. ¿Qué afirmación es correcta?", "o": ["La manipulación de tasación es una señal autónoma", "La coincidencia artificial con el precio neutraliza la señal", "Solo importa el avalúo si el inmueble se financia con hipoteca"], "a": 0, "e": "Un avalúo alterado no es evidencia independiente que explique el precio. Por eso el análisis debe atender a cómo se obtuvo el valor. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y 16, considera este caso. Se revisan dos expedientes, uno moderado y otro alto. ¿Qué afirmación es correcta?", "o": ["La guía prevé diligencia estándar para riesgo moderado", "Ambos expedientes deben tratarse con diligencia simplificada", "El riesgo alto reduce la frecuencia de revisión"], "a": 0, "e": "La clasificación orienta el grado de diligencia y de seguimiento. El tratamiento moderado no se traslada sin ajustes a perfiles de riesgo alto. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y 16."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3 y directrices de RAS, considera este caso. Un analista observa un pago por un tercero y encuentra después documentos que explican su relación con el comprador. ¿Qué afirmación es correcta?", "o": ["La señal inicial justificaba examinar la operación", "La alerta inicial obliga a afirmar que hubo un delito", "La existencia de soportes vuelve innecesario dejar rastro del análisis"], "a": 0, "e": "La alerta dispara revisión. Una conclusión sobre sospecha debe responder al conjunto de hechos y respaldos, sin confundir alerta y prueba. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3 y directrices de RAS."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9, considera este caso. Una corredora piensa disminuir la diligencia frente a un cliente importante y con honorarios reducidos. ¿Qué afirmación es correcta?", "o": ["La importancia comercial no excusa la diligencia", "El prestigio del cliente autoriza reducir controles", "Una comisión pequeña permite omitir las verificaciones"], "a": 0, "e": "Los incentivos comerciales no sustituyen la evaluación de exposición. La independencia del control protege precisamente frente a esos incentivos. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, paso 4, considera este caso. Tras agotar titularidad y control por otros medios sin identificar a una persona natural, la agencia decide cómo documentar el caso. ¿Qué afirmación es correcta?", "o": ["La alta dirección opera como último recurso en el procedimiento", "El cargo gerencial se toma como primera y única comprobación", "Basta indicar el nombre de la sociedad y cerrar la revisión"], "a": 0, "e": "La ruta subsidiaria se activa cuando las anteriores no identifican al beneficiario final. Aplicarla de entrada omite los pasos que la preceden. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, paso 4."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02, considera este caso. Se prepara la apertura de un expediente de persona natural y otro de una sociedad. ¿Qué afirmación es correcta?", "o": ["CIV-01 corresponde a persona natural", "CIV-01 sustituye la identificación de la estructura societaria", "CIV-02 se usa exclusivamente para registrar a los fiadores"], "a": 0, "e": "Los anexos responden al tipo de cliente. El de persona jurídica añade información sobre el beneficiario final. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Una compradora es una sociedad con accionistas interpuestos y la agente tiene el nombre de su representante. ¿Qué afirmación es correcta?", "o": ["El análisis debe buscar a la persona física que controla finalmente", "La sociedad compradora es siempre el beneficiario final", "Quien redacta el contrato sustituye al beneficiario final al firmarlo"], "a": 0, "e": "Representar, figurar como titular y controlar en última instancia son roles diferentes. La guía exige mirar más allá de la estructura formal. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción y directrices de RAS, considera este caso. Una inmobiliaria concluyó su análisis y considera justificado reportar una actividad sospechosa. ¿Qué afirmación es correcta?", "o": ["El destinatario del RAS es la UNIF", "Remitir una actualización al RUSO sustituye el RAS", "La Cámara es el receptor competente por ser gremio del sector"], "a": 0, "e": "La función de inteligencia financiera corresponde a la UNIF. El registro del sujeto y la afiliación gremial no son vías equivalentes de reporte. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción y directrices de RAS."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03, considera este caso. La firma ya documentó a la sociedad y debe analizar una operación específica. ¿Qué afirmación es correcta?", "o": ["CIV-02 apoya la identificación del cliente jurídico", "CIV-02 y CIV-03 son el mismo expediente con nombres distintos", "Completar CIV-02 reemplaza por sí solo el análisis de operación"], "a": 0, "e": "La identidad y la valoración de una operación son piezas complementarias. Un expediente completo sobre la sociedad no explica por sí solo el riesgo del negocio. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal, considera este caso. Un equipo cita como norma venezolana una orientación sectorial del GAFI de 2022. ¿Qué afirmación es correcta?", "o": ["La orientación es una referencia internacional", "La orientación internacional reemplaza la LOCDOFT por sí sola", "La Circular 04043 y la orientación del GAFI son el mismo documento"], "a": 0, "e": "Una guía internacional orienta el enfoque y no se confunde con la fuente nacional que lo aplica. La fecha y autor de ambos instrumentos son diferentes. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, considera este caso. Una agencia quiere tratar como simplificada cualquier operación sin importar su perfil. ¿Qué afirmación es correcta?", "o": ["La modalidad de diligencia depende del nivel de riesgo", "La modalidad simplificada se elige solo por costo del trámite", "El cliente puede escoger directamente su modalidad"], "a": 0, "e": "La clasificación de riesgo precede al tratamiento. La preferencia comercial de la agencia o del cliente no reemplaza esa evaluación. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. El cliente ofrece pagar un precio muy superior a la tasación y exige cerrar con una prisa anormal. ¿Qué afirmación es correcta?", "o": ["La discrepancia de precio merece investigar su justificación", "La prisa pertenece exclusivamente al análisis de montos", "El avalúo bajo autoriza a concluir sin revisar soportes"], "a": 0, "e": "Precio y comportamiento son señales distintas. Su concurrencia justifica examinar contexto y evidencia, sin equipararla a una prueba de delito. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}]}, {"titulo": "UNIF y guías inmobiliarias de LC/FT/FPADM · modelo 2", "orden": true, "q": [{"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02, la guía destina CIV-01 a persona jurídica y CIV-02 únicamente a una persona natural sin vínculos empresariales.", "a": false, "e": "CIV-01 corresponde a la persona natural y CIV-02 al cliente jurídico y su beneficiario final. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la guía relaciona la Recomendación 19 con medidas para países de mayor riesgo.", "a": true, "e": "Esa materia se distingue de los controles internos de la 18 y el reporte de la 20. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la Recomendación 20 se estudia como la regla de identificación de países de mayor riesgo.", "a": false, "e": "La 20 se refiere a reporte de actividades sospechosas. Las medidas sobre países de mayor riesgo se relacionan con la 19. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, el control por otros medios merece revisión aunque no se identifique un titular que alcance el umbral de participación.", "a": true, "e": "La titularidad y el control son vías distintas. Agotar solo la primera puede dejar sin identificar al verdadero controlador. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, cuando hay dos personas naturales que controlan conjuntamente, solo interesa la que otorgó poder al representante.", "a": false, "e": "La finalidad es determinar quién posee o controla finalmente. La firma de un poder no define por sí sola qué personas se identifican. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, la posibilidad de movilizar sumas significativas en una transacción ayuda a explicar la exposición inmobiliaria.", "a": true, "e": "La materialidad de una sola compraventa explica parte del atractivo del sector. No equivale a calificar cada compra de sospechosa. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, enumerar los servicios de un agente equivale a declarar que todos activan los mismos deberes del GAFI.", "a": false, "e": "La circular distingue el catálogo sectorial del alcance concreto de los estándares. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, la diligencia simplificada equivale a prescindir de verificar la identidad.", "a": false, "e": "Simplificar permite ajustar el alcance o momento conforme al supuesto. No convierte la identidad en irrelevante. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, una relación inmobiliaria puntual puede aportar menos historial de cliente que una relación bancaria duradera.", "a": true, "e": "La menor continuidad puede limitar el contexto disponible. La guía lo presenta como diferencia relevante al diseñar controles. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, portada y circular de remisión, 04043 identifica la circular de remisión y 2026-005 identifica la guía que la acompaña.", "a": true, "e": "Confundir ambos identificadores dificulta localizar el pasaje aplicable. Se cita la guía para su metodología y la circular para su remisión. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, portada y circular de remisión."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14, la revisión de un cliente de riesgo alto tiene una periodicidad distinta de la de un cliente moderado.", "a": true, "e": "La guía distingue la reevaluación semestral de alto riesgo de la anual para moderado. No son instrucciones intercambiables. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, la falta de explicación de un precio considerablemente inferior al valor real merece análisis, igual que una sobrevaloración.", "a": true, "e": "La desviación significativa importa en ambas direcciones. El precio menor no elimina el riesgo de ocultar fondos u operaciones. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03, la ficha de evaluación de la operación cumple una función distinta de la ficha de identificación del cliente particular.", "a": true, "e": "Una registra el riesgo del negocio y la otra documenta al cliente. Pueden coexistir en el mismo expediente. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una venta de alto valor en efectivo sin financiación hipotecaria puede constituir una señal cuantitativa.", "a": true, "e": "La forma de financiar y la materialidad se evalúan juntas. No se excluye la alerta por tratarse de un comprador conocido. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, una transacción ocasional figura entre los supuestos que pueden requerir debida diligencia.", "a": true, "e": "El control no depende de establecer una relación permanente. La operación aislada también puede activar verificaciones. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3, la mejor respuesta inicial a una alerta es informar al cliente de la sospecha para que indique qué debe verificarse.", "a": false, "e": "El análisis debe pedir respaldo como parte del procedimiento ordinario. La guía recomienda evitar confrontar al cliente al detectar la señal. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, la participación en determinados programas de ciudadanía por inversión relacionados con inmuebles se menciona como alerta cualitativa.", "a": true, "e": "El elemento señalado se refiere a la estructura del negocio, no a un umbral monetario universal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, el abuso de posición por una persona expuesta políticamente puede elevar el riesgo inmobiliario.", "a": true, "e": "La guía identifica la posible utilización de la posición como exposición relevante. La evaluación se apoya en la operación y el perfil. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una presión anormal para cerrar solo merece análisis una vez formalizada la compraventa.", "a": false, "e": "El comportamiento puede observarse antes del cierre. Esperar a protocolizar pierde la oportunidad de revisar el contexto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, el control final puede recaer en una persona física distinta de quien figura como titular inmediato.", "a": true, "e": "La revisión busca el control efectivo en última instancia. Una cadena formal de titularidad puede ocultar quién toma decisiones. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una difícil identificación del beneficiario real pierde importancia porque la compradora presentó su acta constitutiva.", "a": false, "e": "El documento identifica la entidad formal. No necesariamente aclara quién ejerce el control o se beneficia. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, el análisis sectorial reconoce actividades como avalúo, corretaje y administración de inmuebles.", "a": true, "e": "La enumeración describe actividades del sector. No implica que cada actividad esté cubierta del mismo modo por todos los estándares. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, la compra sin financiación bancaria debe considerarse menos expuesta porque no genera crédito.", "a": false, "e": "La ausencia de financiación puede eliminar puntos de control de entidades reguladas. La deuda y la exposición al uso indebido son cuestiones distintas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes, el receptor del reporte de sospecha pasa a ser el órgano rector del RUSO cuando el intermediario ya tiene certificado.", "a": false, "e": "El canal de reportes sigue siendo la UNIF. El certificado acredita un trámite distinto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, las tipologías recogidas por la guía constituyen una conclusión automática de legitimación de capitales para cualquier operación parecida.", "a": false, "e": "El parecido con una tipología orienta el análisis. La conclusión del caso requiere evaluar hechos y soportes concretos. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. La agencia cuenta con un manual actualizado, pero su personal no sabe reconocer una operación inusual. ¿Qué afirmación es correcta?", "o": ["Reconocer tipologías apoya la detección de casos a analizar", "La existencia de un manual elimina la capacitación", "El entrenamiento se limita a la firma de nuevos contratos"], "a": 0, "e": "La eficacia operativa depende de que el personal reconozca patrones y aplique controles. La documentación y la capacidad para usarla son distintas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, considera este caso. En una compraventa intervienen corredor, tasador y abogado; se discute si el cargo por sí solo define la cobertura. ¿Qué afirmación es correcta?", "o": ["Importa la intervención efectiva en la transacción", "El título profesional define por sí solo todos los deberes", "La guía se limita a corredores que trabajan dentro de agencias"], "a": 0, "e": "La orientación atiende a la actividad que conecta a cada actor con la operación. No atribuye automáticamente una misma cobertura a todos los servicios de cada título. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, considera este caso. Una agencia quiere tratar como simplificada cualquier operación sin importar su perfil. ¿Qué afirmación es correcta?", "o": ["El tratamiento estándar corresponde al perfil moderado", "La modalidad simplificada se elige solo por costo del trámite", "El cliente puede escoger directamente su modalidad"], "a": 0, "e": "La clasificación de riesgo precede al tratamiento. La preferencia comercial de la agencia o del cliente no reemplaza esa evaluación. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, considera este caso. El cliente habitual presenta datos contradictorios y sostiene que solo se verifica al abrir el expediente. ¿Qué afirmación es correcta?", "o": ["La sospecha también figura entre los disparadores", "La diligencia se agota al abrir la relación", "La relación habitual impide revisar datos dudosos"], "a": 0, "e": "La guía contempla la diligencia como una actividad que puede reactivarse por nuevos hechos. Haber abierto un expediente no valida inconsistencias posteriores. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes, considera este caso. Un cliente pide mantener una gran suma y reembolsarla luego a una cuenta distinta de la cuenta de origen. ¿Qué afirmación es correcta?", "o": ["Debe examinarse la justificación de la ruta de los fondos", "El reembolso elimina la necesidad de entender los fondos", "La orden del cliente convierte el hecho en mero trámite registral"], "a": 0, "e": "El cambio de cuenta puede alterar el destino de los fondos. Una instrucción válida entre partes no despeja por sí sola la señal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, uso de cuentas de clientes."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Un cliente pretende pagar parte en criptoactivos, a distancia, preservando el anonimato. ¿Qué afirmación es correcta?", "o": ["La modalidad combina varios rasgos del supuesto de alerta", "Las transferencias digitales quedan fuera de la circular", "La ausencia de reunión física es prueba de ilicitud por sí sola"], "a": 0, "e": "El caso requiere analizar conjuntamente modalidad de pago, falta de identificación y contexto. Una operación remota no se califica únicamente por su canal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3, considera este caso. La agente detecta una señal y quiere acusar directamente al cliente para obtener una reacción. ¿Qué afirmación es correcta?", "o": ["Debe evitar confrontar al cliente por la señal", "Debe revelar que considera remitir un RAS", "Debe sustituir la revisión documental por una acusación directa"], "a": 0, "e": "El análisis se orienta a obtener información y valorar la señal sin alertar al cliente. Confrontarlo no es un método de verificación. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3."}, {"t": "mc", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2, considera este caso. La promesa de venta contiene una declaración contractual sobre origen de fondos. ¿Qué afirmación es correcta?", "o": ["La agencia sigue obligada a efectuar la debida diligencia", "La firma de la declaración sustituye la verificación", "La cláusula impide pedir documentos adicionales"], "a": 0, "e": "La manifestación contractual y la comprobación son actividades distintas. El documento es una evidencia que debe valorarse con el resto de la información. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.1.2."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal, considera este caso. Un equipo cita como norma venezolana una orientación sectorial del GAFI de 2022. ¿Qué afirmación es correcta?", "o": ["El marco legal nacional se examina por separado", "La orientación internacional reemplaza la LOCDOFT por sí sola", "La Circular 04043 y la orientación del GAFI son el mismo documento"], "a": 0, "e": "Una guía internacional orienta el enfoque y no se confunde con la fuente nacional que lo aplica. La fecha y autor de ambos instrumentos son diferentes. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales y marco legal."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y 16, considera este caso. Se revisan dos expedientes, uno moderado y otro alto. ¿Qué afirmación es correcta?", "o": ["El riesgo alto exige una modalidad más intensa", "Ambos expedientes deben tratarse con diligencia simplificada", "El riesgo alto reduce la frecuencia de revisión"], "a": 0, "e": "La clasificación orienta el grado de diligencia y de seguimiento. El tratamiento moderado no se traslada sin ajustes a perfiles de riesgo alto. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y 16."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3 y directrices de RAS, considera este caso. Un analista observa un pago por un tercero y encuentra después documentos que explican su relación con el comprador. ¿Qué afirmación es correcta?", "o": ["La documentación debe valorarse para decidir si subsiste sospecha", "La alerta inicial obliga a afirmar que hubo un delito", "La existencia de soportes vuelve innecesario dejar rastro del análisis"], "a": 0, "e": "La alerta dispara revisión. Una conclusión sobre sospecha debe responder al conjunto de hechos y respaldos, sin confundir alerta y prueba. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3 y directrices de RAS."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, considera este caso. Se compara una compra sin financiación bancaria con otra en la que participa un banco. ¿Qué afirmación es correcta?", "o": ["La existencia de financiación no elimina la diligencia inmobiliaria", "Sin financiación el riesgo es necesariamente menor", "Con financiación la agencia puede omitir todo análisis"], "a": 0, "e": "La guía señala la exposición que puede surgir al evitar instituciones reguladas. La intervención de otro participante tampoco borra el deber del agente. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas, considera este caso. Una compradora entrega cheques de distintos emisores, entre ellos un tercero ajeno a la compraventa, sin explicar su relación. ¿Qué afirmación es correcta?", "o": ["El pago de un tercero sin vínculo es una alerta", "La validez bancaria de los cheques resuelve la alerta", "La presencia de un tercero prueba por sí sola un delito"], "a": 0, "e": "La revisión busca entender quién paga y con qué justificación. Un instrumento formal no acredita el origen económico ni reemplaza el análisis. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cuantitativas."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Una agencia aplica un control idéntico a todas las operaciones y solo lo revisa después de un incidente. ¿Qué afirmación es correcta?", "o": ["Debe adaptar la mitigación a la exposición identificada", "Un control único posterior cumple el enfoque basado en riesgos", "Toda diferencia entre operaciones debe ignorarse para asegurar uniformidad"], "a": 0, "e": "El enfoque requiere medidas proporcionales y eficaces. Copiar un procedimiento reactivo evita evaluar dónde están los riesgos que el control debe abordar. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, considera este caso. Una adquisición comercial utiliza varias entidades jurídicas cuya estructura no se entiende. ¿Qué afirmación es correcta?", "o": ["Corresponde analizar control y participantes reales", "La naturaleza comercial reduce siempre el riesgo frente a vivienda", "Solo se revisa la razón social que aparece en el contrato"], "a": 0, "e": "Las estructuras usadas en bienes comerciales pueden dificultar identificar a las personas de control. Una razón social no basta para apreciar toda la exposición. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, considera este caso. El responsable distribuye funciones entre diligencia al cliente y reporte de actividades sospechosas. ¿Qué afirmación es correcta?", "o": ["La Recomendación 23 incorpora otras medidas para APNFD", "La Recomendación 22 regula el trámite del certificado RUSO", "La Recomendación 23 sustituye la diligencia de la Recomendación 22"], "a": 0, "e": "Las recomendaciones cumplen funciones complementarias. La 22 cubre diligencia y conservación, y la 23 conecta controles y reporte con la actividad cubierta. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves, considera este caso. Un corredor verifica solo al comprador porque es quien paga la comisión. ¿Qué afirmación es correcta?", "o": ["La fuente de la comisión no fija el alcance del control", "El vendedor queda cubierto por diligencia hecha al comprador", "El perfil se verifica solo para quien paga al intermediario"], "a": 0, "e": "La guía aplica el conocimiento a ambos extremos de la compraventa. El contrato de honorarios no determina por sí solo a quién debe verificarse. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y conceptos claves."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, considera este caso. La dirección asigna iguales recursos a expedientes sencillos y a operaciones con exposición mayor, sin revisar sus perfiles. ¿Qué afirmación es correcta?", "o": ["La evaluación precede al diseño de la mitigación", "El enfoque exige el mismo esfuerzo para cualquier perfil", "La asignación de recursos se decide antes de conocer el riesgo"], "a": 0, "e": "La guía recoge asignar recursos donde la exposición es mayor. Hace falta identificar y comprender el riesgo antes de concretar las medidas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción y directrices de RAS, considera este caso. Una inmobiliaria concluyó su análisis y considera justificado reportar una actividad sospechosa. ¿Qué afirmación es correcta?", "o": ["La remisión corresponde al circuito de reportes", "Remitir una actualización al RUSO sustituye el RAS", "La Cámara es el receptor competente por ser gremio del sector"], "a": 0, "e": "La función de inteligencia financiera corresponde a la UNIF. El registro del sujeto y la afiliación gremial no son vías equivalentes de reporte. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción y directrices de RAS."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. El cliente ofrece pagar un precio muy superior a la tasación y exige cerrar con una prisa anormal. ¿Qué afirmación es correcta?", "o": ["La prisa anormal es una señal cualitativa", "La prisa pertenece exclusivamente al análisis de montos", "El avalúo bajo autoriza a concluir sin revisar soportes"], "a": 0, "e": "Precio y comportamiento son señales distintas. Su concurrencia justifica examinar contexto y evidencia, sin equipararla a una prueba de delito. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y Circular 04043 de remisión, considera este caso. El agente encuentra un perfil de exposición elevada y posibles elementos de sospecha. ¿Qué afirmación es correcta?", "o": ["El eventual RAS requiere análisis previo", "La intensificación se aplica solo después del RAS", "La calificación alta equivale automáticamente a reportar"], "a": 0, "e": "Riesgo y sospecha son decisiones relacionadas y distintas. El primero orienta la intensidad de las comprobaciones y el segundo exige examinar los hechos. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción y Circular 04043 de remisión."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta, considera este caso. Se manipula una tasación para que coincida con un precio que el corredor no ha podido justificar. ¿Qué afirmación es correcta?", "o": ["La diferencia afecta el análisis económico de la operación", "La coincidencia artificial con el precio neutraliza la señal", "Solo importa el avalúo si el inmueble se financia con hipoteca"], "a": 0, "e": "Un avalúo alterado no es evidencia independiente que explique el precio. Por eso el análisis debe atender a cómo se obtuvo el valor. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales de alerta."}, {"t": "mc", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cualitativas, considera este caso. Una sociedad offshore comparece con accionistas nominales y cambia de titularidad poco antes del cierre. ¿Qué afirmación es correcta?", "o": ["El cambio repentino de titularidad es otra señal", "La comparecencia formal del representante acredita el control real", "El cambio se analiza solo si ocurre después de la compraventa"], "a": 0, "e": "La documentación formal de representación no resuelve el control efectivo. Un cambio cercano al cierre puede añadir incertidumbre sobre quién participa. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3, señales cualitativas."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9, considera este caso. Una corredora piensa disminuir la diligencia frente a un cliente importante y con honorarios reducidos. ¿Qué afirmación es correcta?", "o": ["El monto de honorarios no fija el nivel de control", "El prestigio del cliente autoriza reducir controles", "Una comisión pequeña permite omitir las verificaciones"], "a": 0, "e": "Los incentivos comerciales no sustituyen la evaluación de exposición. La independencia del control protege precisamente frente a esos incentivos. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 9."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03, considera este caso. La firma ya documentó a la sociedad y debe analizar una operación específica. ¿Qué afirmación es correcta?", "o": ["CIV-03 documenta la evaluación de riesgo de la operación", "CIV-02 y CIV-03 son el mismo expediente con nombres distintos", "Completar CIV-02 reemplaza por sí solo el análisis de operación"], "a": 0, "e": "La identidad y la valoración de una operación son piezas complementarias. Un expediente completo sobre la sociedad no explica por sí solo el riesgo del negocio. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-02 y CIV-03."}]}, {"titulo": "UNIF y guías inmobiliarias de LC/FT/FPADM · modelo 3", "orden": true, "q": [{"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02, la guía destina CIV-01 a persona jurídica y CIV-02 únicamente a una persona natural sin vínculos empresariales.", "a": false, "e": "CIV-01 corresponde a la persona natural y CIV-02 al cliente jurídico y su beneficiario final. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexos CIV-01 y CIV-02."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes, el receptor del reporte de sospecha pasa a ser el órgano rector del RUSO cuando el intermediario ya tiene certificado.", "a": false, "e": "El canal de reportes sigue siendo la UNIF. El certificado acredita un trámite distinto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, directrices de reportes."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una difícil identificación del beneficiario real pierde importancia porque la compradora presentó su acta constitutiva.", "a": false, "e": "El documento identifica la entidad formal. No necesariamente aclara quién ejerce el control o se beneficia. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03, la ficha de evaluación de la operación cumple una función distinta de la ficha de identificación del cliente particular.", "a": true, "e": "Una registra el riesgo del negocio y la otra documenta al cliente. Pueden coexistir en el mismo expediente. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, anexo CIV-03."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 5, la conservación del expediente se cuenta siempre desde la primera reunión con el cliente.", "a": false, "e": "La guía refiere el plazo a la finalización de la relación profesional en el supuesto indicado. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 5."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, una relación inmobiliaria puntual puede aportar menos historial de cliente que una relación bancaria duradera.", "a": true, "e": "La menor continuidad puede limitar el contexto disponible. La guía lo presenta como diferencia relevante al diseñar controles. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3, la mejor respuesta inicial a una alerta es informar al cliente de la sospecha para que indique qué debe verificarse.", "a": false, "e": "El análisis debe pedir respaldo como parte del procedimiento ordinario. La guía recomienda evitar confrontar al cliente al detectar la señal. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la guía relaciona la Recomendación 19 con medidas para países de mayor riesgo.", "a": true, "e": "Esa materia se distingue de los controles internos de la 18 y el reporte de la 20. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, la participación en determinados programas de ciudadanía por inversión relacionados con inmuebles se menciona como alerta cualitativa.", "a": true, "e": "El elemento señalado se refiere a la estructura del negocio, no a un umbral monetario universal. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una presión anormal para cerrar solo merece análisis una vez formalizada la compraventa.", "a": false, "e": "El comportamiento puede observarse antes del cierre. Esperar a protocolizar pierde la oportunidad de revisar el contexto. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, las alertas cualitativas dependen exclusivamente del desembolso de una suma por encima de un umbral.", "a": false, "e": "El comportamiento y la estructura del cliente pueden encender alertas sin que un monto fijo sea el criterio. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, sección 3, una venta de alto valor en efectivo sin financiación hipotecaria puede constituir una señal cuantitativa.", "a": true, "e": "La forma de financiar y la materialidad se evalúan juntas. No se excluye la alerta por tratarse de un comprador conocido. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, sección 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, la compra sin financiación bancaria debe considerarse menos expuesta porque no genera crédito.", "a": false, "e": "La ausencia de financiación puede eliminar puntos de control de entidades reguladas. La deuda y la exposición al uso indebido son cuestiones distintas. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14, la revisión de un cliente de riesgo alto tiene una periodicidad distinta de la de un cliente moderado.", "a": true, "e": "La guía distingue la reevaluación semestral de alto riesgo de la anual para moderado. No son instrucciones intercambiables. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 14."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16, la diligencia simplificada equivale a prescindir de verificar la identidad.", "a": false, "e": "Simplificar permite ajustar el alcance o momento conforme al supuesto. No convierte la identidad en irrelevante. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 16."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales, la Recomendación 20 se estudia como la regla de identificación de países de mayor riesgo.", "a": false, "e": "La 20 se refiere a reporte de actividades sospechosas. Las medidas sobre países de mayor riesgo se relacionan con la 19. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, referencias internacionales."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, el abuso de posición por una persona expuesta políticamente puede elevar el riesgo inmobiliario.", "a": true, "e": "La guía identifica la posible utilización de la posición como exposición relevante. La evaluación se apoya en la operación y el perfil. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, cuando hay dos personas naturales que controlan conjuntamente, solo interesa la que otorgó poder al representante.", "a": false, "e": "La finalidad es determinar quién posee o controla finalmente. La firma de un poder no define por sí sola qué personas se identifican. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología, el control final puede recaer en una persona física distinta de quien figura como titular inmediato.", "a": true, "e": "La revisión busca el control efectivo en última instancia. Una cadena formal de titularidad puede ocultar quién toma decisiones. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, terminología."}, {"t": "vf", "q": "Según la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2, el control por otros medios merece revisión aunque no se identifique un titular que alcance el umbral de participación.", "a": true, "e": "La titularidad y el control son vías distintas. Agotar solo la primera puede dejar sin identificar al verdadero controlador. Fuente: la Guía de Evaluación Basada en Riesgos CIV–ONCDOFT 2026, apartado 2.2."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, la posibilidad de movilizar sumas significativas en una transacción ayuda a explicar la exposición inmobiliaria.", "a": true, "e": "La materialidad de una sola compraventa explica parte del atractivo del sector. No equivale a calificar cada compra de sospechosa. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción, un procedimiento diseñado para reaccionar solo cuando se presenta una sospecha agota la gestión basada en riesgos.", "a": false, "e": "También se exige conocer la exposición y diseñar controles proporcionados antes de que aparezca el caso. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, introducción."}, {"t": "vf", "q": "Según la Circular UNIF-DG-DSU-001125 de 2024, introducción, enumerar los servicios de un agente equivale a declarar que todos activan los mismos deberes del GAFI.", "a": false, "e": "La circular distingue el catálogo sectorial del alcance concreto de los estándares. Fuente: la Circular UNIF-DG-DSU-001125 de 2024, introducción."}, {"t": "vf", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3, una transacción ocasional figura entre los supuestos que pueden requerir debida diligencia.", "a": true, "e": "El control no depende de establecer una relación permanente. La operación aislada también puede activar verificaciones. Fuente: la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, art. 3."}, {"t": "vf", "q": "Según la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos, las tipologías recogidas por la guía constituyen una conclusión automática de legitimación de capitales para cualquier operación parecida.", "a": false, "e": "El parecido con una tipología orienta el análisis. La conclusión del caso requiere evaluar hechos y soportes concretos. Fuente: la Guía UNIF-DSU-GUIA-2026-005 remitida mediante Circular 04043, aplicación del enfoque basado en riesgos."}, {"t": "mc", "q": "Según la Guía de Debida Diligencia del Cliente CIV–ONCDOFT 2026, arts. 14 y
