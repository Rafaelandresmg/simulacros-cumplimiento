ue, "e": "Art. 25, numeral 9. Trampa: se cree que la reserva impide compartirla con el órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, establecer mecanismos para detectar transacciones inusuales o sospechosas, aun con justificación económica aparente, es deber de:", "o": ["Los sujetos obligados", "Los órganos de control", "La UNIF", "La ONCDOFT"], "a": 0, "e": "Art. 12. Trampa: los órganos de control dictan instructivos y supervisan, pero la detección es deber del sujeto obligado."}, {"t": "vf", "q": "Según la LOCDOFT, mantener un registro actualizado de sus sujetos obligados es una obligación de cada órgano o ente de control.", "a": true, "e": "Art. 8, numeral 13. Trampa: se cree que solo el órgano rector lleva registros."}, {"t": "mc", "q": "Según la LOCDOFT, si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "Arts. 13 y 17. El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, la política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la Providencia SAA-01-0536-2024 de SUDEASEG es más exigente para digital."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Procede si el cliente ya no opera", "Basta la autorización previa de la junta"], "a": 0, "e": "Art. 10. El mínimo legal es de cinco años."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la LOCDOFT, centralizar a nivel nacional los reportes de actividades sospechosas corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 25, numeral 1. Trampa: la ONCDOFT recibe información para políticas públicas, pero no centraliza los reportes."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "Según la LOCDOFT, los documentos deben conservarse por el plazo legal en forma:", "o": ["Física y digital", "Física, y digital si el órgano de control lo exige", "Digital, y física solo para los originales", "Física o digital, a elección del sujeto obligado"], "a": 0, "e": "Art. 10. Trampa: las dos formas son acumulativas, no alternativas."}, {"t": "mc", "q": "Según la LOCDOFT, un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable, sin exigir certeza", "Esperar pruebas documentales del origen ilícito", "Consultar al cliente para descartar la sospecha", "Esperar al próximo ciclo de monitoreo"], "a": 0, "e": "Art. 13. El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "vf", "q": "Según la Recomendación 13 del GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Según la Recomendación 13 del GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 7 del GAFI, la evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, cuando el país anfitrión de una filial es menos exigente que el país de origen, la filial debe aplicar:", "o": ["Las medidas del país de origen, en lo que el anfitrión permita", "Las medidas del país anfitrión, por el principio territorial", "Las medidas que elija la filial según su propio riesgo", "Las medidas del país anfitrión, informando a la matriz"], "a": 0, "e": "R.18. Trampa: el principio territorial."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Al comprador y también al vendedor", "Al comprador, que es quien aporta los fondos", "Al vendedor, que es quien recibe los fondos", "A quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "vf", "q": "Según la Recomendación 39 del GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la tarifa y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, el «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, la experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "mc", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 3 del GAFI, el autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "mc", "q": "Según la Recomendación 32 del GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de operaciones sospechosas debe presentarse con prontitud a la unidad de inteligencia financiera.", "a": true, "e": "R.20. Trampa: se cree que puede esperarse al cierre del mes."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["El cumplimiento técnico y la efectividad del sistema", "La existencia de leyes contra el lavado vigentes", "El número de condenas dictadas por lavado", "El tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Según la Recomendación 34 del GAFI, la información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Se integraron las nueve especiales en las cuarenta", "Se redujeron de cuarenta a veinticinco en total", "Se convirtieron en un tratado vinculante para todos", "Se limitaron a las instituciones del sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 5 del GAFI, el financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "Según la Recomendación 9 del GAFI, ¿qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 29 del GAFI, una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "vf", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "vf", "q": "Según la Recomendación 28 del GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Según la Recomendación 37 del GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), Venezuela es miembro pleno del GAFIC y no del GAFILAT.", "a": true, "e": "Sección de antecedentes y contexto regional."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["Que exista sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según la Recomendación 2 del GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Según la Recomendación 16 del GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar no impide compartir información dentro del grupo financiero conforme a la Recomendación 18.", "a": true, "e": "R.21 y su nota interpretativa. Trampa: se cree que la reserva prohíbe todo intercambio interno."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, las medidas intensificadas frente a países de mayor riesgo alcanzan también a personas naturales y jurídicas de esos países, no solo a sus instituciones financieras.", "a": true, "e": "R.19. Trampa: se cree que solo alcanzan a la banca corresponsal."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, cuando el tercero en quien se confía pertenece al mismo grupo financiero, la autoridad puede dar por cumplidos los requisitos si el grupo:", "o": ["Aplica controles de grupo bajo supervisión competente", "Tiene su casa matriz en un país miembro del GAFI", "Firmó un convenio de confidencialidad con el tercero", "Comparte una misma marca comercial en cada país"], "a": 0, "e": "R.17, supuesto de grupo. Trampa: la marca o la sede no sustituyen los controles de grupo supervisados."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, para una persona expuesta políticamente extranjera, establecer el origen de su riqueza y de sus fondos es:", "o": ["Obligatorio en todos los casos", "Obligatorio si la relación es de mayor riesgo", "Facultativo, a criterio del oficial", "Exigible si es un cliente ocasional"], "a": 0, "e": "R.12: para las extranjeras es obligatorio; para las nacionales y de organizaciones internacionales, cuando la relación es de mayor riesgo. Trampa: se aplica la regla de las nacionales."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un reporte", "Aceptarlo con monitoreo posterior durante un año", "Iniciar la relación si el pago es por transferencia", "Exigir una garantía y mantener la relación vigente"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de servicios"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Carecen de regulación legal en todos los países", "Resultan costosas para las instituciones financieras", "Están prohibidas en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, ¿por qué una inmobiliaria es relevante en el riesgo de lavado?", "o": ["Permite integrar grandes sumas con apariencia lícita", "Sus operaciones quedan fuera de todo registro público", "Sus clientes suelen ser personas no residentes", "El valor de los inmuebles lo fija la autoridad"], "a": 0, "e": "Sector clásico de integración."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera debe poder pedir información adicional a los sujetos obligados.", "a": true, "e": "R.29. Trampa: se cree que solo recibe lo que se le envía."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "vf", "q": "Según la Recomendación 11 del GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "mc", "q": "Según la Recomendación 21 del GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, en casinos, la debida diligencia se activa desde transacciones financieras de:", "o": ["USD/EUR 3.000", "USD/EUR 1.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.22."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "vf", "q": "Según la Recomendación 5 del GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Recomendación 14 del GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Según la LOCDOFT, el delito de asociación exige probar que el grupo cometió efectivamente alguno de los delitos para los que se formó.", "a": false, "e": "Art. 37: se pena por el solo hecho de la asociación."}, {"t": "vf", "q": "Según la LOCDOFT, la interceptación de comunicaciones puede autorizarse para fines de investigación penal y de inteligencia preventiva.", "a": false, "e": "Art. 65: únicamente a los fines de investigación penal. Trampa: se amplía la finalidad."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, una remesa vigilada, autorizada por un juez de control de Caracas donde el fiscal inició la investigación, transita por Zulia. La actuación en Zulia:", "o": ["Queda cubierta por la autorización inicial", "Exige autorización del juez de Zulia", "Necesita el aval del Tribunal Supremo", "Requiere una comisión del juez de Caracas"], "a": 0, "e": "Art. 67."}, {"t": "vf", "q": "Según la LOCDOFT, las razones ideológicas o religiosas pueden justificar el financiamiento al terrorismo cuando se prueba que eran el único móvil.", "a": false, "e": "Art. 53, parte final: ninguna circunstancia lo justifica."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que revela la identidad de un agente encubierto queda inhabilitado, tras cumplir la pena, por:", "o": ["Quince años", "Diez años", "Veinte años", "Cinco años"], "a": 0, "e": "Art. 72. Trampa: quince a veinte años es la pena de prisión."}, {"t": "vf", "q": "Según la LOCDOFT, para que haya financiamiento al terrorismo, los fondos deben haberse usado efectivamente en un acto terrorista.", "a": false, "e": "Art. 53: se pena aunque los fondos no se usen ni se consume el acto. Trampa: se agrega un resultado que la ley no exige."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión por legitimación de capitales es de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Trampa: seis a diez es la pena por asociación; quince a veinticinco, la de financiamiento al terrorismo."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la LOCDOFT, incumplir el trámite de autorización de la entrega vigilada se pena con prisión de:", "o": ["Cinco a diez años", "Tres a seis años", "Seis a ocho años", "Ocho a doce años"], "a": 0, "e": "Art. 66, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la identidad falsa autorizada al agente encubierto permite alterar registros y libros públicos para mantenerla.", "a": false, "e": "Art. 70: excluye alterar registros, libros públicos o archivos. Trampa: se invierte la prohibición."}, {"t": "vf", "q": "Según la LOCDOFT, el fiscal puede bloquear por sí mismo las cuentas bancarias de los integrantes del grupo investigado.", "a": false, "e": "Art. 56: debe solicitar autorización al juez de control. Trampa: se elimina el control judicial."}, {"t": "mc", "q": "Según la LOCDOFT, intercambiar información con entidades homólogas extranjeras y suscribir memorandos para ello corresponde a:", "o": ["La UNIF", "El órgano de control", "El Ministerio Público", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 5."}, {"t": "vf", "q": "Según la LOCDOFT, los recursos de la administración de bienes asegurados se destinan primero a resarcir su mantenimiento, y el remanente va al Tesoro Nacional.", "a": false, "e": "Art. 62: el remanente va a un fondo especial para quien acredite derecho. Trampa: la primera mitad es correcta."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para jueces y fiscales en estos delitos corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Colegio de Abogados"], "a": 0, "e": "Art. 6, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, alguien recauda fondos para una organización terrorista, pero el atentado nunca ocurre y el dinero no se usa. Responde:", "o": ["Por financiamiento, de quince a veinticinco años", "Solo por tentativa de financiamiento", "Por nada, al no consumarse el acto terrorista", "Por asociación, de seis a diez años"], "a": 0, "e": "Art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios especiales responden frente al Estado y a terceros agraviados:", "o": ["Administrativa, civil y penalmente", "Civilmente, por los daños probados", "Administrativamente, ante el órgano rector", "Penalmente, solo en caso de dolo"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal solicita un agente encubierto, aunque el caso puede esclarecerse fácilmente con registros bancarios ya disponibles. El juez debería:", "o": ["Negarla por no cumplirse los supuestos legales", "Otorgarla, por tratarse de delito grave", "Otorgarla, pues basta la sospecha fundada", "Remitirla a la policía para que decida"], "a": 0, "e": "Art. 68: imposible o sumamente difícil, u otras medidas inútiles."}, {"t": "mc", "q": "Según la LOCDOFT, se dicta sentencia condenatoria firme por un delito de la ley. Los bienes incautados preventivamente:", "o": ["Se confiscan y destinan a planes de prevención y represión", "Se devuelven al condenado hasta que otro proceso los afecte", "Se decomisan como bienes abandonados", "Pasan al patrimonio del Ministerio Público"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, en el decomiso, si no se promovieron pruebas o el punto es de mero derecho, el juez decide dentro de:", "o": ["Tres días", "Cinco días", "Ocho días", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, no es posible la comparecencia en el Estado requirente de una persona. La ley prevé como alternativa:", "o": ["La videoconferencia", "La declaración jurada escrita", "La detención con fines de traslado", "La sustitución por un testigo referencial"], "a": 0, "e": "Art. 79."}, {"t": "mc", "q": "Según la LOCDOFT, la ley del país de una sucursal extranjera impide aplicar los controles venezolanos. La sucursal debe:", "o": ["Informar a la oficina principal y exigirse el estándar más alto", "Aplicar solo la ley local sin informar a la oficina principal", "Cerrar operaciones de inmediato", "Pedir una excepción a la UNIF"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional contra estos grupos se basa, entre otros lineamientos, en:", "o": ["Privarlos del producto de sus actividades", "Dejar la persecución al Estado de origen", "Unificar los códigos penales de la región", "Sustituir la jurisdicción nacional afectada"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la actividad sospechosa se diferencia de la inusual en que la primera supone:", "o": ["Un análisis que hace presumir fondos ilícitos", "Un monto superior a USD 10.000 en una operación", "Una orden judicial previa de examen", "La condena de alguno de los clientes"], "a": 0, "e": "Art. 4, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo de directivos y empleados exige que hayan tomado parte en el delito de legitimación.", "a": false, "e": "Art. 36: favorecen o contribuyen por imprudencia, impericia o negligencia, sin haber tomado parte en él. Trampa: se invierte un elemento del tipo."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el titular no reclama sus bienes. El fiscal solicita el decomiso por abandono después de:", "o": ["Seis meses de finalizado el proceso", "Un año de finalizado el proceso", "Treinta días de finalizado el proceso", "Cinco años de finalizado el proceso"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, destruir datos acumulados que sirven de evidencia, en beneficio de un grupo criminal, se castiga con prisión de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Tres a seis años"], "a": 0, "e": "Art. 45, numeral 4."}, {"t": "vf", "q": "Según la LOCDOFT, para la devolución de bienes en el procedimiento de decomiso, el interesado debe haber hecho todo lo razonable para impedir su uso ilegal.", "a": true, "e": "Art. 59, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, según la ley, los cuerpos competentes de investigación penal deben:", "o": ["Crear unidades de investigación de estos delitos", "Delegar la investigación en la UNIF", "Rendir cuentas directamente al órgano de control", "Solicitar permiso al órgano rector en cada caso"], "a": 0, "e": "Art. 26, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la documentación bancaria y financiera puede entregarse en asistencia mutua mediante:", "o": ["Copias certificadas de los documentos pertinentes", "Solo informe resumido de la autoridad requerida", "Solo con el consentimiento del titular", "Exclusivamente por la vía de la UNIF"], "a": 0, "e": "Art. 79, numeral 4."}, {"t": "vf", "q": "Según la LOCDOFT, revelar quiénes son los familiares de un agente encubierto también es punible.", "a": true, "e": "Art. 72."}, {"t": "vf", "q": "Según la LOCDOFT, haber sido juzgado en el extranjero, sin cumplir la condena impuesta, no impide por sí solo la aplicación de la jurisdicción extraterritorial.", "a": true, "e": "Art. 73: exige juzgamiento y cumplimiento."}, {"t": "mc", "q": "Según la LOCDOFT, un integrante de un grupo criminal traslada, sin autorización, armas de guerra. La pena es de:", "o": ["Quince a veinticinco años", "Doce a dieciocho años", "Veinticinco a treinta años", "Ocho a doce años"], "a": 0, "e": "Art. 38: agravada por tratarse de armas de guerra."}, {"t": "mc", "q": "Según la LOCDOFT, ensamblar municiones a partir de componentes lícitos, como parte de un grupo criminal:", "o": ["Es fabricación ilícita aunque las piezas sean lícitas", "Es atípico si todas las piezas son de origen lícito", "Solo es tráfico si se llegan a vender", "Es una infracción administrativa aduanera"], "a": 0, "e": "Art. 39."}, {"t": "mc", "q": "Según la LOCDOFT, se encuentra en Venezuela un investigado por un delito de la ley cometido en parte en alta mar. Esa persona:", "o": ["Está sujeta a enjuiciamiento conforme a esta ley", "Solo puede ser extraditada al Estado de bandera", "Queda fuera de la jurisdicción venezolana", "Solo responde si la víctima es venezolana"], "a": 0, "e": "Art. 73, numeral 2."}, {"t": "vf", "q": "Según la LOCDOFT, un delito cometido por una sola persona nunca puede sancionarse conforme a la ley de delincuencia organizada.", "a": false, "e": "Art. 27: también se sancionan los cometidos por una sola persona, conforme al art. 4. Trampa: un adverbio absoluto."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, conservar equipos exclusivamente destinados a fabricar moneda, como parte de un grupo criminal, se pena con:", "o": ["Doce a dieciocho años, aunque no se fabrique", "Doce a dieciocho años, solo si se fabricó", "Ocho a doce años, aunque no se fabrique", "Seis a diez años, solo si se distribuye"], "a": 0, "e": "Art. 51: basta fabricar, custodiar, ocultar o conservar los instrumentos."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la solicitud del Ministerio Público para interceptar o grabar comunicaciones debe ser:", "o": ["Razonada y previa a la autorización", "Verbal, con confirmación posterior", "Reservada y sin motivación escrita", "Conjunta con el órgano rector"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, el agente de operaciones encubiertas se define como un funcionario que:", "o": ["Asume una identidad diferente para infiltrarse", "Vigila desde el exterior sin contacto", "Colabora a cambio de reducción de pena", "Audita en secreto a los sujetos obligados"], "a": 0, "e": "Art. 4, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, una estafa del Código Penal ejecutada por un grupo de delincuencia organizada:", "o": ["Se considera delito de delincuencia organizada", "Sigue siendo solo delito común sin agravación", "Queda absorbida por el delito de asociación", "Solo se castiga con la pena de asociación"], "a": 0, "e": "Art. 27, con el aumento del art. 28."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, sobre las concesiones y autorizaciones de una persona jurídica condenada, el juez:", "o": ["Remite las actuaciones a los órganos competentes", "Las revoca directamente en la misma sentencia", "Carece de toda facultad sobre el asunto", "Las suspende hasta por quince años"], "a": 0, "e": "Art. 32, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, quien, sin pertenecer al grupo criminal, figura como propietario de bienes relacionados con los delitos es:", "o": ["Interpuesta persona", "Íntimo asociado", "Integrante de grupo estructurado", "Tercero de buena fe"], "a": 0, "e": "Art. 4, numeral 13. El íntimo asociado se refiere a las PEP."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal quiere interceptar correos electrónicos de un investigado. Requiere:", "o": ["Autorización del juez de control", "Solo orden motivada del fiscal", "Autorización previa de la ONCDOFT", "Solicitud de la UNIF al operador"], "a": 0, "e": "Art. 64, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, utilizar a un adulto mayor o a una persona en situación de calle para cometer los delitos es una circunstancia agravante.", "a": true, "e": "Art. 29, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir la investigación con violencia en favor de un grupo criminal se pena con seis a ocho años:", "o": ["Sin perjuicio de la pena por las lesiones", "Con absorción de la pena por las lesiones", "Aumentados en la mitad por las lesiones", "Solo si la víctima es funcionario público"], "a": 0, "e": "Art. 45, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, el principio de jurisdicción extraterritorial no se aplica si la persona:", "o": ["Fue juzgada en otro país y cumplió la condena", "Fue investigada antes en otro país", "Fue absuelta por falta de pruebas en primera instancia", "Reside legalmente en otro país"], "a": 0, "e": "Art. 73, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la imprescriptibilidad de la acción penal se extiende a los delitos previstos en esa ley, además de los delitos contra el patrimonio público y los de tráfico ilícito de drogas.", "a": true, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia perturbaría una investigación en curso en Venezuela. Venezuela puede:", "o": ["Diferirla y consultar con el Estado requirente", "Denegarla sin expresar motivo alguno al Estado", "Cumplirla siempre con prioridad", "Archivarla de manera definitiva"], "a": 0, "e": "Art. 82."}, {"t": "mc", "q": "Según la LOCDOFT, en la trata de personas cometida por un grupo criminal contra un adulto que aceptó el traslado, el consentimiento de la víctima:", "o": ["No excluye el delito", "Excluye la responsabilidad penal", "Atenúa la pena a la mitad", "Convierte el hecho en tráfico ilegal"], "a": 0, "e": "Arts. 41 y 42."}, {"t": "vf", "q": "Según la LOCDOFT, el tráfico de órganos y el sicariato tienen el mismo rango de pena.", "a": true, "e": "Arts. 43 y 44: veinticinco a treinta años."}, {"t": "vf", "q": "Según la LOCDOFT, al fijar la sanción de una persona jurídica, el juez considera las consecuencias para la empresa y la necesidad de prevenir nuevos hechos punibles.", "a": true, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales NO figura:", "o": ["El SENIAT", "El CICPC", "La Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "vf", "q": "Según la LOCDOFT, la asistencia judicial recíproca puede denegarse sin motivación cuando afecte la soberanía.", "a": false, "e": "Art. 81: las denegaciones deben ser motivadas. Trampa: la causal existe, pero no dispensa de motivar."}, {"t": "vf", "q": "Según la LOCDOFT, el régimen de personas expuestas políticamente cubre a quienes son, han sido o serán considerados bajo ese perfil.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, para obstruir una investigación en beneficio de un grupo criminal, alguien paga a un funcionario y este acepta. La pena de ambos es de:", "o": ["Doce a dieciocho años", "Ocho a doce años", "Seis a ocho años", "Quince a veinte años"], "a": 0, "e": "Art. 45, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, se absuelve al imputado por sentencia firme. Los bienes incautados:", "o": ["Se restituyen a sus legítimos propietarios", "Quedan con el órgano rector un año", "Se confiscan si había indicios fundados", "Se decomisan de pleno derecho"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios o administradores especiales de bienes incautados los designa:", "o": ["El órgano rector", "El juez de control", "El Ministerio Público", "El órgano de control"], "a": 0, "e": "Art. 57. Trampa: el juez ordena la incautación, pero no designa al depositario."}, {"t": "mc", "q": "Según la LOCDOFT, amenazar a un testigo con un daño grave a su familia, para favorecer a un grupo criminal, se ubica en el tramo de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce
