a dieciocho años", "Diez a quince años"], "a": 0, "e": "Art. 45, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, el grupo formado deliberadamente para la comisión inmediata de un delito se denomina:", "o": ["Grupo estructurado", "Organización terrorista", "Grupo de delincuencia transnacional", "Asociación ilícita simple"], "a": 0, "e": "Art. 4, numeral 12."}, {"t": "mc", "q": "Según la LOCDOFT, la producción de material pornográfico con niños, por un grupo criminal, tiene pena de veinte a veinticinco años, mientras que explotar esa industria con ellos o para ellos tiene:", "o": ["Veinticinco a treinta años", "Diez a quince años", "Quince a veinte años", "La misma pena de veinte a veinticinco"], "a": 0, "e": "Arts. 46 y 49."}, {"t": "mc", "q": "Según la LOCDOFT, el concepto de bienes incluye, a efectos de la ley, los medios que se pretendan utilizar para cometer los delitos:", "o": ["Aunque estén en poder de terceros no partícipes", "Si están en poder de los imputados del caso", "Cuando fueron efectivamente utilizados", "Si se trata de bienes muebles"], "a": 0, "e": "Art. 4, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, la entrega vigilada de remesas ilícitas la solicita el Ministerio Público mediante:", "o": ["Acta razonada ante el juez de control", "Oficio dirigido al órgano rector", "Memorándum a la unidad policial", "Escrito ante la Corte de Apelaciones"], "a": 0, "e": "Art. 66."}, {"t": "mc", "q": "Según la LOCDOFT, el producto de un delito se mezcló con bienes de fuente lícita. Podrá decomisarse:", "o": ["Hasta el valor estimado del producto mezclado", "La totalidad de los bienes mezclados", "Nada, por la imposibilidad de separarlos", "Solo la parte que se pruebe por factura"], "a": 0, "e": "Art. 89, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, vencido sin resultados el plazo de una operación encubierta, el juez, vistos los alegatos del funcionario responsable:", "o": ["Concederá prórroga", "Debe ordenar el cierre definitivo", "Debe remitir a la Corte de Apelaciones", "Puede autorizar solo una nueva operación"], "a": 0, "e": "Art. 67, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, a un funcionario condenado por participar en un delito de la ley se le aplica como pena accesoria la destitución y queda impedido de ejercer funciones públicas:", "o": ["De uno a quince años tras cumplir la pena", "De uno a quince años desde la sentencia", "Por el tiempo que dure la condena", "De manera perpetua y definitiva"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los sufraga, salvo pacto en contrario:", "o": ["El Estado requirente", "El Estado requerido", "Ambos, por partes iguales", "El imputado, si resulta condenado"], "a": 0, "e": "Art. 84."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación, los empleados del sujeto obligado pueden suspender la relación con el cliente con autorización del fiscal.", "a": false, "e": "Art. 15: autorización previa de un juez o jueza competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Según la LOCDOFT, un Estado recibió pruebas de Venezuela para un caso y quiere usarlas en otro distinto. Requiere:", "o": ["El previo consentimiento del Estado venezolano", "Solo informar después a Venezuela", "La autorización de su propio juez", "Nada, si el delito es de la misma especie"], "a": 0, "e": "Art. 80, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, los familiares cercanos de una persona expuesta políticamente incluyen, según la ley:", "o": ["Padres, hermanos, cónyuges, hijos y parientes políticos", "Solo hijos y cónyuges de la persona expuesta", "Solo quienes habiten con la persona expuesta", "Parientes hasta el sexto grado de consanguinidad o afinidad"], "a": 0, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, según la disposición transitoria de la ley, dependía antes de su adecuación de:", "o": ["La Superintendencia del Sector Bancario", "El Ministerio de Relaciones Interiores", "El Banco Central de Venezuela", "La Fiscalía General de la República"], "a": 0, "e": "Disposición transitoria quinta."}, {"t": "mc", "q": "Según la LOCDOFT, las unidades de investigación financiera creadas en los órganos policiales funcionan bajo la coordinación de:", "o": ["El Ministerio Público", "La UNIF", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 78."}, {"t": "mc", "q": "Según la LOCDOFT, la clausura definitiva de una persona jurídica condenada procede en caso de:", "o": ["Comisión intencional de delitos de la ley", "Comisión culposa de delitos de la ley", "Primera infracción administrativa grave", "Omisión de un reporte de sospecha"], "a": 0, "e": "Art. 32, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una causal legal para denegar la asistencia judicial recíproca:", "o": ["Que la solicitud involucre el secreto bancario", "Que menoscabe la soberanía o el orden público", "Que no se ajuste a los requisitos legales", "Que sea contraria al ordenamiento interno"], "a": 0, "e": "Arts. 81 y 87."}, {"t": "mc", "q": "Según la LOCDOFT, la prohibición temporal de transferir o gravar bienes, por mandato judicial, se llama:", "o": ["Aseguramiento preventivo o incautación", "Confiscación", "Decomiso", "Abandono legal o decomiso provisional"], "a": 0, "e": "Art. 4, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, son responsables por hechos punibles cometidos por cuenta de ellas por sus órganos directivos o representantes:", "o": ["Las personas jurídicas, salvo el Estado y sus empresas", "Todas las personas jurídicas, incluso las estatales", "Solo las personas jurídicas del sector financiero", "Solo los directivos, nunca la persona jurídica"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, el poder de otorgar, negar, suspender o cancelar licencias de sujetos obligados corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "La ONCDOFT", "El juez de control competente"], "a": 0, "e": "Art. 8, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, la asistencia judicial recíproca solicitada a Venezuela se presta conforme a los tratados y, en ausencia de ellos:", "o": ["Sobre la base del principio de reciprocidad", "Solo si el TSJ la autoriza expresamente", "Solo con las Recomendaciones del GAFI", "No se presta en ningún supuesto"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la LOCDOFT, si se devuelve el bien en el procedimiento por abandono, los gastos de conservación corren por cuenta de:", "o": ["Su titular", "El órgano rector", "El Ministerio Público", "El servicio especializado"], "a": 0, "e": "Art. 60, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un grupo cobra por sacar del país a migrantes que aceptan pagar, sin cumplir requisitos legales y sin explotarlos después. El hecho encuadra en:", "o": ["Inmigración ilícita y tráfico ilegal, ocho a doce", "Trata de personas, de veinte a veinticinco", "Solo infracción de la ley de migración", "Asociación, de seis a diez años, y nada más"], "a": 0, "e": "Art. 42."}, {"t": "mc", "q": "Según la LOCDOFT, un viajero entra al país con exactamente USD 10.000 en efectivo. Respecto del deber de declarar dispuesto en la ley:", "o": ["No se activa, porque la ley exige exceder esa cifra", "Se activa, porque la cifra se alcanza exactamente", "No se activa, porque solo rige para extranjeros", "Se activa, porque rige al entrar y al salir"], "a": 0, "e": "Art. 22: cuyo monto exceda."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo que debe transcurrir desde la incautación para solicitar el decomiso por titular desconocido es de:", "o": ["Un año", "Seis meses", "Treinta días", "Dos años"], "a": 0, "e": "Art. 58. Los seis meses son del abandono tras absolución, art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, un extranjero comete en el exterior un delito de la ley que atenta contra los intereses patrimoniales de la República. Sobre su enjuiciamiento:", "o": ["Queda sujeto a esta ley venezolana", "Solo procede si es detenido en Venezuela", "Solo procede si su país lo autoriza", "Corresponde solo al Estado del hecho"], "a": 0, "e": "Art. 73, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen para oponerse:", "o": ["Treinta días", "Cinco días", "Ocho días", "Quince días"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, el salvoconducto del testigo que declara en el Estado requirente cubre los actos anteriores a su salida del territorio del Estado requerido.", "a": true, "e": "Art. 83. Trampa: se cree que solo cubre lo que declare."}, {"t": "vf", "q": "Según la LOCDOFT, basta una sola de las condiciones legales, como que otras medidas resultaran inútiles, para que proceda la autorización del agente encubierto, si además existe el delito o la sospecha fundada.", "a": true, "e": "Art. 68: una o varias."}, {"t": "vf", "q": "Según la LOCDOFT, un hecho con pena inferior a cinco años puede ser delito grave si afecta intereses colectivos o difusos.", "a": true, "e": "Art. 4, numeral 10."}, {"t": "vf", "q": "Según la LOCDOFT, los bienes que el juez confisca tras una condena firme por un delito de la ley se destinan a planes y programas de prevención y represión.", "a": true, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por mantener cuentas anónimas o cifradas la impone la UNIF.", "a": false, "e": "Art. 11: la impone el órgano o ente de control del sujeto obligado. Trampa: se cambia el organismo."}, {"t": "mc", "q": "Según la LOCDOFT, al solicitar asistencia a Venezuela debe indicarse, entre otros datos:", "o": ["La autoridad solicitante y el objeto de la investigación", "El presupuesto estimado del proceso en el Estado extranjero", "La opinión favorable de la Interpol", "La aprobación previa del órgano rector"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, si quien revela la identidad del agente encubierto es un funcionario público, la pena es de:", "o": ["Quince a veinte años, más inhabilitación", "Seis a ocho años, más inhabilitación", "Quince a veinte años, sin accesorias", "Ocho a doce años, más destitución"], "a": 0, "e": "Art. 72: inhabilitación por quince años tras cumplir la pena."}, {"t": "vf", "q": "Según la LOCDOFT, los depositarios especiales de bienes incautados se asimilan a funcionarios públicos y responden administrativa, civil y penalmente.", "a": true, "e": "Art. 57. Trampa: se cree que, por ser particulares, solo responden civilmente."}, {"t": "mc", "q": "Según la LOCDOFT, si en un delito de la ley concurre una sola agravante de las previstas, la pena aplicable:", "o": ["Aumenta en un tercio", "Aumenta en la mitad", "Aumenta en una cuarta parte", "Se fija en su límite máximo"], "a": 0, "e": "Art. 29, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos que obtiene el servicio especializado por administrar y enajenar bienes pueden destinarse:", "o": ["A programas de prevención y a su autofinanciamiento", "Solo al pago de la deuda pública nacional vigente", "A indemnizar a los funcionarios actuantes", "A incrementar el situado constitucional"], "a": 0, "e": "Art. 61."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de declarar más de diez mil dólares en efectivo aplica solo al ingresar al país.", "a": false, "e": "Art. 22: al ingresar o salir. Trampa: se recorta el supuesto."}, {"t": "vf", "q": "Según la LOCDOFT, cuando se requiere la comparecencia del agente encubierto, la asume el fiscal que coordinó las acciones.", "a": true, "e": "Art. 71. Trampa: se cree que el agente debe declarar en persona."}, {"t": "mc", "q": "Según la LOCDOFT, la trata de una víctima adulta se castiga con prisión de veinte a veinticinco años y, además, con:", "o": ["La indemnización de gastos de recuperación", "Una multa fija de 3.000 unidades tributarias", "La confiscación de todos los bienes del autor", "La expulsión del territorio si es extranjero"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir el comercio con amenazas, en apoyo de un grupo criminal, se pena con prisión de:", "o": ["Ocho a diez años", "Ocho a doce años", "Seis a ocho años", "Diez a quince años"], "a": 0, "e": "Art. 50."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela puede autorizar el decomiso o la confiscación del producto de los delitos o de:", "o": ["Bienes de valor equivalente al producto", "Solo el bien exacto obtenido del delito", "Todo el patrimonio familiar del imputado", "Solo los bienes situados en el exterior"], "a": 0, "e": "Art. 86, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, las denegaciones de asistencia judicial recíproca deben ser motivadas.", "a": true, "e": "Art. 81, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, quien sin ser policía usa un uniforme policial simulado para cometer un delito de la ley:", "o": ["Incurre en la agravante de la condición simulada", "No agrava porque no es funcionario público", "Solo responde por usurpación de funciones", "Solo agrava si el uniforme es auténtico"], "a": 0, "e": "Art. 29, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la existencia del servicio especializado se exceptúa de la aplicación de:", "o": ["La ley de enajenación de bienes del sector público", "El Código Orgánico Procesal Penal y sus reformas", "La ley que crea la unidad de inteligencia", "La Ley Orgánica de Drogas"], "a": 0, "e": "Disposición transitoria segunda."}, {"t": "mc", "q": "Según la LOCDOFT, para evitar que personas vinculadas a estos delitos adquieran participaciones en sujetos obligados, deben adoptar medidas:", "o": ["Los órganos y entes de control", "El Ministerio Público y sus fiscales", "Los tribunales de control", "Los propios sujetos obligados"], "a": 0, "e": "Art. 21."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión por financiamiento al terrorismo es de:", "o": ["Quince a veinticinco años", "Veinticinco a treinta años", "Diez a quince años", "Veinte a treinta años"], "a": 0, "e": "Art. 53. Trampa: veinticinco a treinta es la del acto terrorista (art. 52)."}, {"t": "vf", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el fiscal solicita el decomiso por abandono al año de finalizado el proceso.", "a": false, "e": "Art. 60: a los seis meses. Trampa: un año es el plazo del art. 58, cuando no se identifica al titular."}, {"t": "mc", "q": "Según la LOCDOFT, el decomiso se distingue de la confiscación porque recae sobre bienes:", "o": ["Abandonados o no reclamados", "Del condenado por sentencia firme", "Afectados por medida temporal", "Adquiridos antes del delito"], "a": 0, "e": "Art. 4, numerales 7 y 8."}, {"t": "mc", "q": "Según la LOCDOFT, quien forma parte de un grupo de delincuencia organizada, por el solo hecho de la asociación, es penado con prisión de:", "o": ["Seis a diez años", "Diez a quince años", "Ocho a doce años", "Cuatro a seis años"], "a": 0, "e": "Art. 37. Trampa: diez a quince es la de legitimación."}, {"t": "mc", "q": "Según la LOCDOFT, en el abandono legal, el lapso para reclamar luego del cartel es de treinta días contados desde:", "o": ["La consignación del cartel", "La publicación de la sentencia", "La orden del tribunal de control", "La incautación del bien"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, usar la ingeniería genética para producir armas biológicas, como parte de un grupo criminal, se pena con:", "o": ["Veinticinco a treinta años", "Ocho a doce años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 40."}, {"t": "vf", "q": "Según la LOCDOFT, para la entrega vigilada basta la autorización del juez de control de la circunscripción donde se inició la investigación.", "a": true, "e": "Art. 67: es válida en todo el territorio nacional. Trampa: se cree que hace falta una por cada circunscripción."}, {"t": "mc", "q": "Según la LOCDOFT, se incautan alimentos perecederos. Para evitar su deterioro, el juez de control, previo inventario y oídos los terceros de buena fe:", "o": ["Puede autorizar su venta o uso con fines sociales", "Debe ordenar su destrucción inmediata y documentada", "Debe esperar la sentencia definitiva", "Los devuelve al imputado en custodia"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, cuando un grupo de delincuencia organizada comete un delito del Código Penal, la pena se incrementa en un tercio.", "a": false, "e": "Art. 28: se incrementa en la mitad. Trampa: se cambia la fracción."}, {"t": "mc", "q": "Según la LOCDOFT, si un banco contribuye intencionalmente a un delito de la ley, para las medidas administrativas el Ministerio Público:", "o": ["Notificará al órgano de control correspondiente", "Decretará directamente su intervención", "Solicitará a la UNIF revocar su licencia", "Esperará la sentencia para informar al rector"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, presentar informes fundados al Ministerio Público cuando haya indicios de un hecho punible corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, si el funcionario participó en un delito de la ley en perjuicio de una alcaldía, la pena se aplica:", "o": ["En su límite máximo", "Aumentada en un tercio", "En su término medio", "Aumentada en la mitad"], "a": 0, "e": "Art. 33: órgano nacional, estadal o municipal."}, {"t": "mc", "q": "Según la LOCDOFT, la dirección de la investigación penal de estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El órgano de control"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones administrativas previstas por incumplir las obligaciones de los sujetos obligados las imponen, por regla general:", "o": ["Los órganos y entes de control", "Los jueces de control", "Los fiscales del Ministerio Público", "La UNIF por vía de reporte"], "a": 0, "e": "Arts. 8, numeral 3, y 10 a 17."}, {"t": "mc", "q": "Según la LOCDOFT, una cajera omite por descuido los controles y con ello facilita, sin intención ni participación, una operación de legitimación. Responde:", "o": ["Por el delito culposo, de tres a seis años", "Como autora de legitimación, diez a quince", "Solo con multa a cargo del supervisor", "Como cómplice, con pena rebajada a la mitad"], "a": 0, "e": "Art. 36: imprudencia, impericia o negligencia."}, {"t": "vf", "q": "Según la LOCDOFT, la Fuerza Armada Nacional Bolivariana figura entre las autoridades principales de policía de investigaciones penales en esta materia.", "a": true, "e": "Art. 26, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, en situación de urgencia, y si los Estados convienen, la solicitud de asistencia puede hacerse:", "o": ["Verbalmente, con confirmación lo antes posible", "Verbalmente, sin confirmación posterior", "Por escrito, solo en original legalizado", "Solo a través del tribunal de control"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, dos socios sin persona jurídica de por medio se conciertan de modo estable para traficar armas. Sobre la noción legal de delincuencia organizada:", "o": ["No alcanzan el mínimo de tres personas", "Bastan dos si hay un beneficio económico", "Se cumple con cualquier concierto estable", "Se requiere un mínimo de cinco integrantes"], "a": 0, "e": "Art. 4, numeral 9."}, {"t": "vf", "q": "Según la LOCDOFT, las normas de alcance extraterritorial pueden dejar de cumplirse por un sujeto obligado que invoque las reglas de otra jurisdicción.", "a": false, "e": "Art. 3: no puede oponerse el cumplimiento respecto de otras jurisdicciones."}, {"t": "mc", "q": "Según la LOCDOFT, quien revele la identidad de un agente encubierto, sin ser funcionario, es penado con prisión de:", "o": ["Seis a ocho años", "Quince a veinte años", "Diez a quince años", "Cuatro a seis años"], "a": 0, "e": "Art. 72. Trampa: quince a veinte es la pena si lo revela un funcionario."}, {"t": "vf", "q": "Según la LOCDOFT, las unidades de investigación financiera de los órganos policiales funcionan bajo la dirección de la UNIF.", "a": false, "e": "Art. 78: bajo la coordinación y dirección del Ministerio Público. Trampa: el nombre hace pensar en la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de la ONCDOFT", "Sentencia de control"], "a": 0, "e": "Art. 9, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la acción penal por los delitos previstos en la ley no prescribe.", "a": true, "e": "Art. 30. Trampa: se espera un plazo de prescripción como en el Código Penal."}, {"t": "vf", "q": "Según la LOCDOFT, la incautación preventiva de bienes la ordena el juez de control, previa solicitud del fiscal del Ministerio Público.", "a": true, "e": "Art. 55. Trampa: se confunde a quien solicita con quien ordena."}, {"t": "vf", "q": "Según la LOCDOFT, las personas jurídicas, incluidos el Estado y sus empresas, responden penalmente por los delitos cometidos por su cuenta.", "a": false, "e": "Art. 31: con exclusión del Estado y sus empresas. Trampa: se elimina la excepción."}, {"t": "mc", "q": "Según la LOCDOFT, coordinar con órganos nacionales e internacionales las operaciones de prevención y represión corresponde, sin perjuicio de otras competencias, a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Fuerza Armada"], "a": 0, "e": "Art. 6, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, el salvoconducto de un testigo que viaja a declarar cesa si, informado de que ya no se requiere su presencia, permanece voluntariamente durante:", "o": ["Quince días consecutivos o el período acordado", "Treinta días consecutivos o el período acordado", "Cinco días consecutivos sin excepción", "Ocho días hábiles sin excepción"], "a": 0, "e": "Art. 83."}, {"t": "mc", "q": "Según la LOCDOFT, las medidas sobre bienes vinculados a delitos de esta ley relacionados con drogas se rigen por:", "o": ["La Ley Orgánica de Drogas", "El Código Penal", "La ley de bienes del sector público", "El Código de Procedimiento Civil"], "a": 0, "e": "Disposición final primera."}, {"t": "mc", "q": "Según la LOCDOFT, que la comisión del delito involucre el espacio geográfico de otro Estado:", "o": ["Es una circunstancia agravante", "Excluye la competencia venezolana", "Obliga a aplicar la ley extranjera", "Es irrelevante para fijar la pena"], "a": 0, "e": "Art. 29, numeral 11."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF depende jerárquicamente de la ONCDOFT.", "a": false, "e": "Art. 24: depende del ministerio con competencia en planificación y finanzas. Trampa: la UNIF contribuye con la ONCDOFT, pero no depende de ella."}, {"t": "mc", "q": "Según la LOCDOFT, tramitar las solicitudes de asistencia judicial recíproca corresponde a:", "o": ["El Ministerio Público, con el ministerio de exteriores", "La ONCDOFT, en coordinación con el ministerio de exteriores", "La UNIF, con su homóloga extranjera", "El TSJ, con el ministerio de interior"], "a": 0, "e": "Art. 77."}, {"t": "vf", "q": "Según la LOCDOFT, un ejecutivo de alto nivel de una corporación propiedad de un gobierno extranjero puede ser persona expuesta políticamente.", "a": true, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva procede sobre bienes empleados en el delito o sobre aquellos respecto de los cuales existan:", "o": ["Elementos de convicción de procedencia ilícita", "Sentencias firmes contra su propietario actual", "Reportes de sospecha enviados a la UNIF", "Denuncias de terceros sin otro respaldo"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, la incidencia de oposición al decomiso no interrumpe el proceso penal.", "a": true, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, brindar asistencia técnica en investigaciones y procesos judiciales de estos delitos es también una obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados no financieros", "Los colegios profesionales", "Las oficinas de cumplimiento"], "a": 0, "e": "Art. 8, numeral 14."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela considerará remitir actuaciones penales a otro Estado cuando estime que ello:", "o": ["Obra en interés de una correcta administración de justicia", "Reduce los costos ordinarios de su sistema de justicia", "Evita que el imputado acceda a medidas cautelares", "Le permite cumplir la evaluación mutua del GAFIC"], "a": 0, "e": "Art. 85."}, {"t": "mc", "q": "Según la LOCDOFT, mientras no se cree el servicio especializado, los bienes incautados quedan a la orden de:", "o": ["El órgano rector", "El tribunal de control", "El Ministerio Público", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, en casos de extrema urgencia, el fiscal puede obtener la autorización judicial por cualquier medio y formalizarla luego por escrito.", "a": true, "e": "Art. 66. Trampa: se cree que siempre debe ser escrita y previa."}, {"t": "vf", "q": "Según la LOCDOFT, el deber de reportar cede si los fondos provienen de una fuente lícita, aunque se sospeche que serán usados para financiar terrorismo.", "a": false, "e": "Art. 13: incluye actividades de fuente lícita."}, {"t": "mc", "q": "Según la LOCDOFT, un delito con pena máxima de cuatro años y seis meses que no afecta intereses colectivos ni difusos:", "o": ["No alcanza el umbral de delito grave de la ley", "Es grave por superar los cuatro años de pena", "Se vuelve grave si lo comete un funcionario", "Califica como grave si media un beneficio"], "a": 0, "e": "Art. 4, numeral 10: más de cinco años. El umbral de cuatro años es de Palermo."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización de una operación encubierta exige que el delito se haya cometido o que exista:", "o": ["Sospecha fundada de un comienzo de ejecución", "Un reporte previo de actividad sospechosa", "Sentencia firme contra algún integrante", "Denuncia formal de una persona agraviada"], "a": 0, "e": "Art. 68."}, {"t": "mc", "q": "Según la LOCDOFT, las pruebas de ADN sobre un investigado, como medida especial, se aplican:", "o": ["Por el Ministerio Público con autorización judicial", "Por orden directa de la policía de investigación", "Solo con el consentimiento del investigado", "Exclusivamente en la fase de juicio oral"], "a": 0, "e": "Art. 64, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia dirigida a Venezuela debe presentarse por escrito:", "o": ["En castellano o idioma aceptado por Venezuela", "En cualquiera de los idiomas de la ONU", "Únicamente en idioma castellano oficial del país", "En el idioma del Estado requirente"], "a": 0, "e": "Art. 80."}, {"t": "vf", "q": "Según la LOCDOFT, financiar a una organización terrorista que opera únicamente en el extranjero también es punible.", "a": true, "e": "Art. 53, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, analizar la información para confirmar actividades sospechosas corresponde a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El CICPC"], "a": 0, "e": "Art. 25, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, quien encarga un homicidio a un sicario recibe la misma pena que el ejecutor.", "a": true, "e": "Art. 44."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo aplicable a directivos y empleados de sujetos obligados alcanza la legitimación de capitales y el financiamiento al terrorismo, pero no cualquier delito de delincuencia organizada.", "a": true, "e": "Art. 36."}, {"t": "vf", "q": "Según la LOCDOFT, una sola persona puede incurrir en delincuencia organizada si actúa como órgano de una persona jurídica o asociativa con la intención de cometer delitos de esa ley.", "a": true, "e": "Art. 4, numeral 9, y art. 27."}, {"t": "mc", "q": "Según la LOCDOFT, quien intenta sin éxito realizar un acto terrorista como terrorista individual enfrenta:", "o": ["La misma pena del consumado, 25 a 30 años", "La pena rebajada por la tentativa", "Solo la pena por financiamiento", "Quince a veinticinco años de prisión"], "a": 0, "e": "Art. 52: realice o trate de realizar."}, {"t": "vf", "q": "Según la LOCDOFT, las empresas privadas de telefonía están obligadas a permitir el uso de sus equipos para las interceptaciones autorizadas.", "a": true, "e": "Art. 65. Trampa: se cree que solo colaboran voluntariamente."}, {"t": "mc", "q": "Según la LOCDOFT, las solicitudes de decomiso de otro Estado se presentan por Venezuela ante:", "o": ["Sus autoridades competentes para que se pronuncien", "La UNIF para su análisis de inteligencia", "El órgano de control del titular de los bienes", "El Estado requirente para su propia ejecución"], "a": 0, "e": "Art. 88."}, {"t": "mc", "q": "Según la LOCDOFT, para que un acto sea terrorista, además del medio empleado debe perseguir, entre otros fines:", "o": ["Intimidar gravemente a una población", "Obtener un beneficio económico directo", "Afectar a más de un Estado a la vez", "Controlar un territorio determinado"], "a": 0, "e": "Art. 4, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, los recursos obtenidos de la administración de bienes asegurados, luego de resarcir sus costos, se mantienen en:", "o": ["Un fondo especial para quien acredite derecho", "La cuenta única del Tesoro Nacional de la República", "El presupuesto del Ministerio Público", "Un fideicomiso del órgano de control"], "a": 0, "e": "Art. 62."}, {"t": "vf", "q": "Según la LOCDOFT, en la incidencia de decomiso, la falta de comparecencia injustificada del opositor permite apelar dentro de cinco días.", "a": false, "e": "Art. 58: se declara desistida la oposición y se decreta el decomiso, sin recurso. Trampa: cinco días es el plazo del fiscal para contestar."}, {"t": "vf", "q": "Según la LOCDOFT, la doble incriminación es requisito general para toda diligencia de asistencia, incluso para recibir un testimonio.", "a": false, "e": "Art. 88: la exige para las solicitudes de decomiso e identificación e incautación allí referidas."}, {"t": "vf", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen quince días para presentarse.", "a": false, "e": "Art. 58: treinta días siguientes a la publicación. Trampa: se cambia el plazo."}, {"t": "vf", "q": "Según la LOCDOFT, cualquier funcionario policial puede infiltrarse como agente encubierto con autorización del juez de control.", "a": false, "e": "Art. 70: solo los funcionarios de unidades especializadas. Trampa: se amplía el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, financiar parcialmente a un terrorista individual, de modo que solo una parte de los fondos vaya a ese fin:", "o": ["Basta para configurar el delito", "Solo es punible por la parte probada", "Excluye el delito si el resto es lícito", "Requiere pertenecer a una organización"], "a": 0, "e": "Art. 53: en su totalidad o en parte."}, {"t": "mc", "q": "Según la LOCDOFT, la obstrucción de la justicia por medio de violencia, en beneficio de un grupo, se pena con prisión de:", "o": ["Seis a ocho años", "Ocho a doce años", "Doce a dieciocho años", "Tres a seis años"], "a": 0, "e": "Art. 45, num. 1. Trampa: ocho a doce es por amenaza; doce a dieciocho, por soborno."}, {"t": "mc", "q": "Según la LOCDOFT, si la ejecución de una solicitud requiere gastos cuantiosos, los Estados:", "o": ["Se consultarán sobre términos y modo de pago", "Los dividen automáticamente por mitades", "Los trasladan siempre al Estado requirente", "Deben rechazar de plano la solicitud"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, el fiscal solicita el decomiso cuando no se ha identificado al titular del bien incautado después de:", "o": ["Un año", "Seis meses", "Dos años", "Tres meses"], "a": 0, "e": "Art. 58. Trampa: se cambia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre terrorista individual y organización terrorista está en que esta última requiere:", "o": ["Tres o más personas con propósito común", "Dos o más personas con propósito común", "Actuar en más de un país", "Una estructura registrada o reconocida"], "a": 0, "e": "Art. 4, numerales 17 y 22."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Según la Convención de Palermo, una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito investigado es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado se encuentra prófugo de la justicia"], "a": 0, "e": "Art. 18, párrafo 21. Causales previstas en los tratados."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutarlo conforme al derecho interno del Estado requerido", "Aplicar directamente la ley del Estado que lo solicita", "Someter el caso a la Corte Internacional de Justicia", "Obtener antes el consentimiento expreso del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Según los Protocolos de la Convención de Palermo sobre trata de personas y tráfico ilícito de migrantes, el protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "El migrante no consiente y la finalidad es el cruce de frontera", "La trata exige cruzar una frontera y el tráfico de migrantes no", "El tráfico de migrantes protege a la persona y la trata al Estado"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para un sujeto obligado venezolano es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado en lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, de quien ofrece y de quien acepta", "Activa, de quien ofrece el beneficio indebido", "Pasiva, de quien recibe el beneficio indebido", "Extranjera, cuando interviene otro Estado"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "Según la Convención de Palermo, la «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Art. 18, párrafo 9. Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "Según la Convención de Palermo, la función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Art. 18, párrafo 13. Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Penalización, extradición y asistencia técnica únicamente", "Prevención en el sector público y sanciones administrativas", "Cooperación entre unidades de inteligencia y extradición"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Según los datos de la Convención Interamericana contra la Corrupción, su entrada en vigor ocurrió en:", "o": ["1997", "1996", "2002", "2005"], "a": 0, "e": "Adoptada en Caracas en 1996. Trampa: 2005 es la entrada en vigor de Mérida."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la Convención de Palermo, la obstrucción de la justicia se penaliza en su artículo:", "o": ["23", "8", "24", "25"], "a": 0, "e": "El 24 protege a los testigos y el 25 a las víctimas. Trampa: artículos vecinos de materia cercana."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "Palermo permite, respecto de la carga de la prueba en el decomiso, que los Estados:", "o": ["Consideren exigir al imputado demostrar el origen lícito", "Deban invertir la carga de la prueba en estos delitos", "Presuman ilícito todo bien de un condenado por delito grave", "Trasladen la prueba del origen al Estado requirente"], "a": 0, "e": "Es una posibilidad que la Convención invita a considerar."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional y el enriquecimiento ilícito se tipifican con sujeción a la Constitución de cada Estado.", "a": true, "e": "Arts. VIII y IX. Trampa: se cree que son deberes sin reserva."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "Según la Convención de Palermo, el principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Art. 16, párrafo 10. Aut dedere aut judicare, presente en varios convenios."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), la responsabilidad de las personas jurídicas debe ser necesariamente penal.", "a": false, "e": "Art. 5: penal, civil o administrativa. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas coordinadas y eficaces contra la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal especial contra la corrupción", "Prohibir las donaciones a partidos políticos"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "mc", "q": "Según la Convención de Palermo, la disposición del producto decomisado se rige, en primer término, por:", "o": ["El derecho interno del Estado que decomisa", "El acuerdo de reparto por mitades entre Estados", "La decisión del Estado que pidió el decomiso", "Las reglas del fondo de las Naciones Unidas"], "a": 0, "e": "Art. 14, párrafo 1. Trampa: la devolución al requirente es una consideración prioritaria, no la regla base."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las Recomendaciones 3 y 36 a 40 del GAFI", "El Convenio de 1999 y la Recomendación 5 del GAFI", "La Convención Interamericana y la Recomendación 12", "Viena y las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Su escrutinio intensificado por la institución", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Según la Convención de Palermo, si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "Art. 18, párrafo 9. La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Según la Convención de Palermo, la asistencia judicial recíproca no puede negarse invocando el secreto bancario.", "a": true, "e": "Art. 18, párrafo 8. Trampa: se cree que el secreto bancario es una causal de denegación."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), la tentativa de proveer o recolectar fondos:", "o": ["También constituye delito", "Solo es punible si hubo atentado", "Queda a criterio de cada Estado", "No está prevista en el texto"], "a": 0, "e": "Art. 2, párrafo 4. Trampa: se confunde con que los fondos no necesitan usarse."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando de bienes", "Extradición, asilo, refugio y asistencia judicial recíproca", "Soberanía, jurisdicción, territorio y competencia penal"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), una solicitud de asistencia judicial puede negarse por tratarse de un delito fiscal.", "a": false, "e": "Art. 13. Trampa: el art. 14 dice lo mismo respecto del delito político."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto terrorista se consume", "Basta que los fondos sean de origen ilícito", "Es necesario que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción", "Las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el Estado requerido no puede negar la asistencia amparándose en:", "o": ["El secreto bancario", "La doble incriminación", "Su propio orden público", "La cosa juzgada"], "a": 0, "e": "Art. XVI. Trampa: las otras causales no están excluidas por ese artículo."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Según los datos del Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "El Convenio de Financiación del Terrorismo", "La Convención de Viena de 1988", "La Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado sin autorización", "Opinar públicamente sobre una licitación que está en curso", "Reunirse con representantes de empresas privadas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación entre los organismos nacionales de investigación y el sector privado se regula en su artículo:", "o": ["39", "38", "12", "14"], "a": 0, "e": "El 38 trata la cooperación entre organismos nacionales; el 12, el sector privado en la prevención; el 14, las medidas contra el blanqueo."}, {"t": "mc", "q": "Según la Convención de Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito cometido en un solo Estado es transnacional si en otro Estado se realiza una parte sustancial de su:", "o": ["Preparación, planificación, dirección o control", "Financiación, ejecución o encubrimiento", "Investigación, juzgamiento o condena", "Beneficio, reparto o reinversión posterior"], "a": 0, "e": "Art. 3, párrafo 2, literal b. Trampa: las otras listas suenan igual de técnicas."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mér
