cinos de materia cercana."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}]}, {"titulo": "Convenios internacionales · modelo 2", "q": [{"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Según los datos del Convenio de 1999 contra la financiación del terrorismo, su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las R.3 y R.36 a R.40 del GAFI", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "vf", "q": "Según la Convención de Palermo, la asistencia judicial recíproca no puede negarse invocando el secreto bancario.", "a": true, "e": "Art. 18, párrafo 8. Trampa: se cree que el secreto bancario es una causal de denegación."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}]}, {"titulo": "Convenios internacionales · modelo 3", "q": [{"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, una solicitud de asistencia judicial puede negarse por tratarse de un delito fiscal.", "a": false, "e": "Art. 13. Trampa: el art. 14 dice lo mismo respecto del delito político."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "vf", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, la responsabilidad de las personas jurídicas debe ser necesariamente penal.", "a": false, "e": "Art. 5: penal, civil o administrativa. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional y el enriquecimiento ilícito se tipifican con sujeción a la Constitución de cada Estado.", "a": true, "e": "Arts. VIII y IX. Trampa: se cree que son deberes sin reserva."}, {"t": "mc", "q": "Según la Convención de Palermo, la disposición del producto decomisado se rige, en primer término, por:", "o": ["El derecho interno del Estado que decomisa", "El acuerdo de reparto por mitades entre Estados", "La decisión del Estado que pidió el decomiso", "Las reglas del fondo de las Naciones Unidas"], "a": 0, "e": "Art. 14, párrafo 1. Trampa: la devolución al requirente es una consideración prioritaria, no la regla base."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Según el Convenio de 1999 contra la financiación del terrorismo, la tentativa de proveer o recolectar fondos:", "o": ["También constituye delito", "Solo es punible si hubo atentado", "Queda a criterio de cada Estado", "No está prevista en el texto"], "a": 0, "e": "Art. 2, párrafo 4. Trampa: se confunde con que los fondos no necesitan usarse."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención de Viena de 1988", "Solo la Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "Según los datos de la Convención Interamericana contra la Corrupción, su entrada en vigor ocurrió en:", "o": ["1997", "1996", "2002", "2005"], "a": 0, "e": "Adoptada en Caracas en 1996. Trampa: 2005 es la entrada en vigor de Mérida."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mérida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes por igual", "Ambos son recomendaciones sin efecto jurídico", "El GAFI aprueba los tratados"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}]}]}, {"titulo": "Enfoque basado en riesgo", "exams": [{"titulo": "Enfoque basado en riesgo · modelo 1", "q": [{"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "¿Cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "¿Por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la tolerancia al riesgo, frente al apetito, es:", "o": ["La desviación aceptable respecto del apetito", "El riesgo máximo que la entidad puede soportar", "El riesgo que la entidad desea asumir", "El riesgo que queda tras los controles"], "a": 0, "e": "Trampa: el máximo soportable es la capacidad; el deseado, el apetito; el que queda, el residual."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "mc", "q": "La figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Una decisión consciente, documentada y del nivel adecuado", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "vf", "q": "Un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el origen de los fondos y el origen de la riqueza son el mismo concepto.", "a": false, "e": "Fondos: de dónde viene el dinero de la operación. Riqueza: cómo se formó el patrimonio total. Trampa: se usan como sinónimos."}, {"t": "mc", "q": "Una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "Compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "El riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "La trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "mc", "q": "Una matriz de riesgo que clasifica a toda la cartera como riesgo bajo probablemente indica:", "o": ["Una metodología mal calibrada", "Una cartera excepcionalmente sana", "Un control interno muy eficaz", "Un supervisor poco exigente"], "a": 0, "e": "La ausencia total de riesgo alto es una señal de alerta metodológica."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}]}, {"titulo": "Enfoque basado en riesgo · modelo 2", "q": [{"t": "mc", "q": "Transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Únicamente su monto reducido por operación", "Únicamente el volumen total vendido del año", "Únicamente el país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "vf", "q": "El supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "mc", "q": "El análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "mc", "q": "El programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el apetito de riesgo lo define el oficial de cumplimiento y lo informa a la junta directiva.", "a": false, "e": "Lo define y aprueba el órgano de dirección. Trampa: se invierte quién decide y quién informa."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}, {"t": "vf", "q": "Lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "vf", "q": "Un sujeto obligado que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "vf", "q": "Quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Un plan operativo que se ejecuta en un cincuenta por ciento revela:", "o": ["Una debilidad que exige acciones correctivas", "Un desempeño aceptable del área", "Un plan demasiado conservador", "Una gestión eficiente de los recursos disponibles"], "a": 0, "e": "El informe de ejecución sirve para corregir."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}]}, {"titulo": "Enfoque basado en riesgo · modelo 3", "q": [{"t": "mc", "q": "Si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una operación inusual debe reportarse de inmediato a la unidad de inteligencia, sin análisis previo.", "a": false, "e": "Lo inusual se analiza; se reporta lo que queda sin justificación razonable. Trampa: se salta el análisis."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "vf", "q": "El sistema de administración de riesgos debe combinar controles preventivos, detectivos y correctivos.", "a": true, "e": "Las tres capas se complementan."}, {"t": "mc", "q": "Si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "mc", "q": "El intercambio de información entre sujetos obligados sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en el contrato"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica", "Excluye el de baja probabilidad", "Excluye el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal d
