<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Investigación penal · LOCDOFT", "sub": "8 exámenes de 50 preguntas, nivel avanzado. Banco de 203 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Exámenes integrales: toda la LOCDOFT mezclada", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "mc", "q": "Según la LOCDOFT, la producción de material pornográfico con niños, por un grupo criminal, tiene pena de veinte a veinticinco años, mientras que explotar esa industria con ellos o para ellos tiene:", "o": ["Veinticinco a treinta años", "Diez a quince años", "Quince a veinte años", "La misma pena de veinte a veinticinco"], "a": 0, "e": "Arts. 46 y 49."}, {"t": "mc", "q": "Según la LOCDOFT, el principio de jurisdicción extraterritorial no se aplica si la persona:", "o": ["Fue juzgada en otro país y cumplió la condena", "Fue investigada antes en otro país", "Fue absuelta por falta de pruebas en primera instancia", "Reside legalmente en otro país"], "a": 0, "e": "Art. 73, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la solicitud del Ministerio Público para interceptar o grabar comunicaciones debe ser:", "o": ["Razonada y previa a la autorización", "Verbal, con confirmación posterior", "Reservada y sin motivación escrita", "Conjunta con el órgano rector"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, para el delito de tráfico de recursos estratégicos, estos son:", "o": ["Los insumos básicos de los procesos productivos", "Solo los hidrocarburos y sus derivados refinados", "Los bienes que declare el órgano rector", "Las divisas y los títulos al portador"], "a": 0, "e": "Art. 34, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la doble incriminación es requisito general para toda diligencia de asistencia, incluso para recibir un testimonio.", "a": false, "e": "Art. 88: la exige para las solicitudes de decomiso e identificación e incautación allí referidas."}, {"t": "mc", "q": "Según la LOCDOFT, un particular revela el domicilio de un agente encubierto. La pena es de:", "o": ["Seis a ocho años", "Quince a veinte años", "Ocho a doce años", "Tres a seis años"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, pueden actuar como agentes encubiertos:", "o": ["Solo funcionarios de unidades especializadas", "Particulares colaboradores autorizados", "Funcionarios de cualquier órgano público", "Empleados de sujetos obligados designados"], "a": 0, "e": "Art. 70."}, {"t": "mc", "q": "Según la LOCDOFT, si la ejecución de una solicitud requiere gastos cuantiosos, los Estados:", "o": ["Se consultarán sobre términos y modo de pago", "Los dividen automáticamente por mitades", "Los trasladan siempre al Estado requirente", "Deben rechazar de plano la solicitud"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, las medidas sobre bienes vinculados a delitos de esta ley relacionados con drogas se rigen por:", "o": ["La Ley Orgánica de Drogas", "El Código Penal", "La ley de bienes del sector público", "El Código de Procedimiento Civil"], "a": 0, "e": "Disposición final primera."}, {"t": "mc", "q": "Según la LOCDOFT, las unidades de investigación financiera creadas en los órganos policiales funcionan bajo la coordinación de:", "o": ["El Ministerio Público", "La UNIF", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 78."}, {"t": "mc", "q": "Según la LOCDOFT, los recursos obtenidos de la administración de bienes asegurados, luego de resarcir sus costos, se mantienen en:", "o": ["Un fondo especial para quien acredite derecho", "La cuenta única del Tesoro Nacional de la República", "El presupuesto del Ministerio Público", "Un fideicomiso del órgano de control"], "a": 0, "e": "Art. 62."}, {"t": "vf", "q": "Según la LOCDOFT, un hecho con pena inferior a cinco años puede ser delito grave si afecta intereses colectivos o difusos.", "a": true, "e": "Art. 4, numeral 10."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir el comercio con amenazas, en apoyo de un grupo criminal, se pena con prisión de:", "o": ["Ocho a diez años", "Ocho a doce años", "Seis a ocho años", "Diez a quince años"], "a": 0, "e": "Art. 50."}, {"t": "mc", "q": "Según la LOCDOFT, para obstruir una investigación en beneficio de un grupo criminal, alguien paga a un funcionario y este acepta. La pena de ambos es de:", "o": ["Doce a dieciocho años", "Ocho a doce años", "Seis a ocho años", "Quince a veinte años"], "a": 0, "e": "Art. 45, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, los bienes que el juez confisca tras una condena firme por un delito de la ley se destinan a planes y programas de prevención y represión.", "a": true, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, el poder de otorgar, negar, suspender o cancelar licencias de sujetos obligados corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "La ONCDOFT", "El juez de control competente"], "a": 0, "e": "Art. 8, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, se incautó un vehículo hace un año y no se ha podido establecer quién es su titular. El fiscal debe:", "o": ["Solicitar su decomiso al tribunal de control", "Solicitar su confiscación en la acusación", "Rematarlo directamente con el órgano rector", "Esperar diez años desde la incautación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la confiscación se define en la ley como:", "o": ["Pena accesoria con privación definitiva", "Medida cautelar temporal sobre bienes", "Privación de bienes abandonados", "Custodia provisional por el órgano rector"], "a": 0, "e": "Art. 4, numeral 7."}, {"t": "mc", "q": "Según la LOCDOFT, el enjuiciamiento de estos delitos se rige por:", "o": ["El COPP, esta ley y demás normas aplicables", "Un procedimiento especial solo de esta ley", "El Código de Enjuiciamiento Criminal de 1962", "Las reglas de la jurisdicción militar"], "a": 0, "e": "Art. 63."}, {"t": "mc", "q": "Según la LOCDOFT, un viajero entra al país con exactamente USD 10.000 en efectivo. Respecto del deber de declarar dispuesto en la ley:", "o": ["No se activa, porque debe excederse esa cifra", "Se activa desde USD 10.000, esa cifra inclusive", "Se activa solo para extranjeros", "Se activa solo al salir del territorio"], "a": 0, "e": "Art. 22: cuyo monto exceda."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "mc", "q": "Según la LOCDOFT, una cajera omite por descuido los controles y con ello facilita, sin intención ni participación, una operación de legitimación. Responde:", "o": ["Por el delito culposo, de tres a seis años", "Como autora de legitimación, diez a quince", "Solo con multa a cargo del supervisor", "Como cómplice, con pena rebajada a la mitad"], "a": 0, "e": "Art. 36: imprudencia, impericia o negligencia."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, para ejecutar una solicitud extranjera de decomiso se requiere:", "o": ["La doble incriminación", "Una sentencia del TSJ", "La extradición previa", "El aval del GAFI"], "a": 0, "e": "Art. 88."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, que la comisión del delito involucre el espacio geográfico de otro Estado:", "o": ["Es una circunstancia agravante", "Excluye la competencia venezolana", "Obliga a aplicar la ley extranjera", "Es irrelevante para fijar la pena"], "a": 0, "e": "Art. 29, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, si un banco contribuye intencionalmente a un delito de la ley, para las medidas administrativas el Ministerio Público:", "o": ["Notificará al órgano de control correspondiente", "Decretará directamente su intervención", "Solicitará a la UNIF revocar su licencia", "Esperará la sentencia para informar al rector"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, coordinar con órganos nacionales e internacionales las operaciones de prevención y represión corresponde, sin perjuicio de otras competencias, a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Fuerza Armada"], "a": 0, "e": "Art. 6, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para jueces y fiscales en estos delitos corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Colegio de Abogados"], "a": 0, "e": "Art. 6, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, un extranjero comete en el exterior un delito de la ley que atenta contra los intereses patrimoniales de la República. Sobre su enjuiciamiento:", "o": ["Queda sujeto a esta ley venezolana", "Solo procede si es detenido en Venezuela", "Solo procede si su país lo autoriza", "Corresponde solo al Estado del hecho"], "a": 0, "e": "Art. 73, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, la asistencia judicial recíproca solicitada a Venezuela se presta conforme a los tratados y, en ausencia de ellos:", "o": ["Sobre la base del principio de reciprocidad", "Solo si el TSJ la autoriza expresamente", "Solo con las Recomendaciones del GAFI", "No se presta en ningún supuesto"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela puede autorizar el decomiso o la confiscación del producto de los delitos o de:", "o": ["Bienes de valor equivalente al producto", "Solo el bien exacto obtenido del delito", "Todo el patrimonio familiar del imputado", "Solo los bienes situados en el exterior"], "a": 0, "e": "Art. 86, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, si la víctima de trata es un adolescente, la pena es de:", "o": ["Veinticinco a treinta años", "Veinte a veinticinco años", "Quince a veinticinco años", "Ocho a doce años"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, quien, sin pertenecer al grupo criminal, figura como propietario de bienes relacionados con los delitos es:", "o": ["Interpuesta persona", "Íntimo asociado", "Integrante de grupo estructurado", "Tercero de buena fe"], "a": 0, "e": "Art. 4, numeral 13. El íntimo asociado se refiere a las PEP."}, {"t": "vf", "q": "Según la LOCDOFT, al fijar la sanción de una persona jurídica, el juez considera las consecuencias para la empresa y la necesidad de prevenir nuevos hechos punibles.", "a": true, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, la sentencia condenatoria de una persona jurídica se publica:", "o": ["Íntegra, en diario de mayor circulación, a su costa", "Solo su dispositivo, en Gaceta, a costa del Estado", "Íntegra, en el portal del órgano rector y sin costo", "Solo si lo solicita alguna de las víctimas"], "a": 0, "e": "Art. 32, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, incumplir el trámite de autorización de la entrega vigilada se pena con prisión de:", "o": ["Cinco a diez años", "Tres a seis años", "Seis a ocho años", "Ocho a doce años"], "a": 0, "e": "Art. 66, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, cuando un delito del Código Penal es cometido por un grupo de delincuencia organizada, la sanción:", "o": ["Se incrementa en la mitad de la pena aplicable", "Se incrementa en un tercio de la pena aplicable", "Se duplica sin excepción alguna", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28. El tercio corresponde a una agravante del art. 29."}, {"t": "vf", "q": "Según la LOCDOFT, utilizar a un adulto mayor o a una persona en situación de calle para cometer los delitos es una circunstancia agravante.", "a": true, "e": "Art. 29, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, si en un delito de la ley concurre una sola agravante de las previstas, la pena aplicable:", "o": ["Aumenta en un tercio", "Aumenta en la mitad", "Aumenta en una cuarta parte", "Se fija en su límite máximo"], "a": 0, "e": "Art. 29, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la entrega vigilada de remesas ilícitas la solicita el Ministerio Público mediante:", "o": ["Acta razonada ante el juez de control", "Oficio dirigido al órgano rector", "Memorándum a la unidad policial", "Escrito ante la Corte de Apelaciones"], "a": 0, "e": "Art. 66."}, {"t": "mc", "q": "Según la LOCDOFT, un depositario especial de bienes incautados lo designa:", "o": ["El órgano rector", "El juez de control", "El fiscal del Ministerio Público", "El propietario de los bienes"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, sobre las concesiones y autorizaciones de una persona jurídica condenada, el juez:", "o": ["Remite las actuaciones a los órganos competentes", "Las revoca directamente en la misma sentencia", "Carece de toda facultad sobre el asunto", "Las suspende hasta por quince años"], "a": 0, "e": "Art. 32, numeral 6."}]}, {"titulo": "Examen integral 2", "q": [{"t": "vf", "q": "Según la LOCDOFT, la Fuerza Armada Nacional Bolivariana figura entre las autoridades principales de policía de investigaciones penales en esta materia.", "a": true, "e": "Art. 26, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, quien sin ser policía usa un uniforme policial simulado para cometer un delito de la ley:", "o": ["Incurre en la agravante de la condición simulada", "No agrava porque no es funcionario público", "Solo responde por usurpación de funciones", "Solo agrava si el uniforme es auténtico"], "a": 0, "e": "Art. 29, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión de quien posee bienes a sabiendas de su origen ilícito se acompaña de una multa equivalente:", "o": ["Al valor del incremento patrimonial ilícito", "Al doble del valor de los bienes poseídos", "A entre 1.000 y 3.000 unidades tributarias", "Al salario de los años de condena impuestos"], "a": 0, "e": "Art. 35. Las multas en U.T. son administrativas."}, {"t": "vf", "q": "Según la LOCDOFT, quien encarga un homicidio a un sicario recibe la misma pena que el ejecutor.", "a": true, "e": "Art. 44."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, financiar parcialmente a un terrorista individual, de modo que solo una parte de los fondos vaya a ese fin:", "o": ["Basta para configurar el delito", "Solo es punible por la parte probada", "Excluye el delito si el resto es lícito", "Requiere pertenecer a una organización"], "a": 0, "e": "Art. 53: en su totalidad o en parte."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, las denegaciones de asistencia judicial recíproca deben ser motivadas.", "a": true, "e": "Art. 81, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, si se devuelve el bien en el procedimiento por abandono, los gastos de conservación corren por cuenta de:", "o": ["Su titular", "El órgano rector", "El Ministerio Público", "El servicio especializado"], "a": 0, "e": "Art. 60, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la documentación bancaria y financiera puede entregarse en asistencia mutua mediante:", "o": ["Copias certificadas de los documentos pertinentes", "Solo informe resumido de la autoridad requerida", "Solo con el consentimiento del titular", "Exclusivamente por la vía de la UNIF"], "a": 0, "e": "Art. 79, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, el producto se transformó en otros bienes. Respecto de estos:", "o": ["Pueden ser objeto de las mismas medidas", "Quedan fuera por haber cambiado de naturaleza", "Solo se afectan si son bienes inmuebles", "Solo cabe multa por el valor equivalente"], "a": 0, "e": "Art. 89, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, un integrante de un grupo criminal traslada, sin autorización, armas de guerra. La pena es de:", "o": ["Quince a veinticinco años", "Doce a dieciocho años", "Veinticinco a treinta años", "Ocho a doce años"], "a": 0, "e": "Art. 38: agravada por tratarse de armas de guerra."}, {"t": "mc", "q": "Según la LOCDOFT, se absuelve al imputado por sentencia firme. Los bienes incautados:", "o": ["Se restituyen a sus legítimos propietarios", "Quedan con el órgano rector un año", "Se confiscan si había indicios fundados", "Se decomisan de pleno derecho"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según la LOCDOFT, una operación es inusual, y no aún sospechosa, cuando:", "o": ["Escapa de la normalidad para el cliente o mercado", "Tras analizarla hace presumir fondos ilícitos", "Ya fue reportada a la unidad de inteligencia", "El Ministerio Público abrió una investigación"], "a": 0, "e": "Art. 4, numerales 2 y 16."}, {"t": "vf", "q": "Según la LOCDOFT, una sola persona puede incurrir en delincuencia organizada si actúa como órgano de una persona jurídica o asociativa con la intención de cometer delitos de esa ley.", "a": true, "e": "Art. 4, numeral 9, y art. 27."}, {"t": "mc", "q": "Según la LOCDOFT, el producto de un delito se mezcló con bienes de fuente lícita. Podrá decomisarse:", "o": ["Hasta el valor estimado del producto mezclado", "La totalidad de los bienes mezclados", "Nada, por la imposibilidad de separarlos", "Solo la parte que se pruebe por factura"], "a": 0, "e": "Art. 89, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización de una operación encubierta exige que el delito se haya cometido o que exista:", "o": ["Sospecha fundada de un comienzo de ejecución", "Un reporte previo de actividad sospechosa", "Sentencia firme contra algún integrante", "Denuncia formal de una persona agraviada"], "a": 0, "e": "Art. 68."}, {"t": "mc", "q": "Según la LOCDOFT, en extrema necesidad y urgencia operativa, para una entrega vigilada el fiscal:", "o": ["Obtiene la autorización por cualquier medio y luego la formaliza", "Actúa sin autorización y la pide dentro de los treinta días", "Sustituye la autorización con su propia acta", "Debe esperar siempre la autorización escrita"], "a": 0, "e": "Art. 66, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, es competente para autorizar la operación encubierta el juez de control:", "o": ["De donde el fiscal inició la investigación", "Del lugar donde actúe el agente encubierto", "Del domicilio del investigado", "Designado por el órgano rector"], "a": 0, "e": "Art. 67."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la multa a la persona jurídica en caso de legitimación equivale a:", "o": ["El valor de los capitales, bienes o haberes", "El doble del valor del incremento ilícito", "De 3.000 a 5.000 unidades tributarias", "Un porcentaje del capital social suscrito"], "a": 0, "e": "Art. 32, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios especiales responden frente al Estado y a terceros agraviados:", "o": ["Administrativa, civil y penalmente", "Solo civilmente por daños probados", "Solo administrativamente ante el rector", "Solo penalmente en caso de dolo"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, los fondos, para la ley, incluyen activos de todo tipo:", "o": ["Con independencia de la licitud de su origen", "Siempre que su origen sea ilícito y conocido", "Solo si están depositados en bancos", "Solo si son tangibles y movibles"], "a": 0, "e": "Art. 4, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, si el funcionario participó en un delito de la ley en perjuicio de una alcaldía, la pena se aplica:", "o": ["En su límite máximo", "Aumentada en un tercio", "En su término medio", "Aumentada en la mitad"], "a": 0, "e": "Art. 33: órgano nacional, estadal o municipal."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "mc", "q": "Según la LOCDOFT, la prohibición temporal de transferir o gravar bienes, por mandato judicial, se llama:", "o": ["Aseguramiento preventivo o incautación", "Confiscación", "Decomiso", "Abandono legal o decomiso provisional"], "a": 0, "e": "Art. 4, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, la existencia del servicio especializado se exceptúa de la aplicación de:", "o": ["La ley de enajenación de bienes del sector público", "El Código Orgánico Procesal Penal y sus reformas", "La ley que crea la unidad de inteligencia", "La Ley Orgánica de Drogas"], "a": 0, "e": "Disposición transitoria segunda."}, {"t": "mc", "q": "Según la LOCDOFT, si quien revela la identidad del agente encubierto es un funcionario público, la pena es de:", "o": ["Quince a veinte años, más inhabilitación", "Seis a ocho años, más inhabilitación", "Quince a veinte años, sin accesorias", "Ocho a doce años, más destitución"], "a": 0, "e": "Art. 72: inhabilitación por quince años tras cumplir la pena."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, el régimen de personas expuestas políticamente cubre a quienes son, han sido o serán considerados bajo ese perfil.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, una remesa vigilada, autorizada por un juez de control de Caracas donde el fiscal inició la investigación, transita por Zulia. La actuación en Zulia:", "o": ["No requiere otra autorización judicial", "Requiere autorización del juez de Zulia", "Requiere aval del Tribunal Supremo", "Requiere una comisión del juez de Caracas"], "a": 0, "e": "Art. 67."}, {"t": "mc", "q": "Según la LOCDOFT, la decisión dictada tras la audiencia oral de decomiso:", "o": ["Es apelable dentro de cinco días", "Es apelable dentro de treinta días", "No admite recurso alguno", "Solo admite recurso de casación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, las pruebas de ADN sobre un investigado, como medida especial, se aplican:", "o": ["Por el Ministerio Público con autorización judicial", "Por orden directa de la policía de investigación", "Solo con el consentimiento del investigado", "Exclusivamente en la fase de juicio oral"], "a": 0, "e": "Art. 64, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, financiar a una organización terrorista que opera únicamente en el extranjero también es punible.", "a": true, "e": "Art. 53, segundo párrafo."}, {"t": "vf", "q": "Según la LOCDOFT, las normas de alcance extraterritorial pueden dejar de cumplirse por un sujeto obligado que invoque las reglas de otra jurisdicción.", "a": false, "e": "Art. 3: no puede oponerse el cumplimiento respecto de otras jurisdicciones."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre terrorista individual y organización terrorista está en que esta última requiere:", "o": ["Tres o más personas con propósito común", "Dos o más personas con propósito común", "Actuar en más de un país", "Una estructura registrada o reconocida"], "a": 0, "e": "Art. 4, numerales 17 y 22."}, {"t": "vf", "q": "Según la LOCDOFT, un ejecutivo de alto nivel de una corporación propiedad de un gobierno extranjero puede ser persona expuesta políticamente.", "a": true, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, según la disposición transitoria de la ley, dependía antes de su adecuación de:", "o": ["La Superintendencia del Sector Bancario", "El Ministerio de Relaciones Interiores", "El Banco Central de Venezuela", "La Fiscalía General de la República"], "a": 0, "e": "Disposición transitoria quinta."}, {"t": "mc", "q": "Según la LOCDOFT, intercambiar información con entidades homólogas extranjeras y suscribir memorandos para ello corresponde a:", "o": ["La UNIF", "El órgano de control", "El Ministerio Público", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, los familiares cercanos de una persona expuesta políticamente incluyen, según la ley:", "o": ["Padres, hermanos, cónyuges, hijos y parientes políticos", "Solo hijos y cónyuges de la persona expuesta", "Solo quienes habiten con la persona expuesta", "Parientes hasta el sexto grado de consanguinidad o afinidad"], "a": 0, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, un abogado en libre ejercicio es sujeto obligado cuando:", "o": ["Realiza transacciones para un cliente en actividades listadas", "Representa a un cliente ante un tribunal en un juicio penal", "Ejerce la profesión en cualquier especialidad", "Está inscrito en el Colegio de Abogados"], "a": 0, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, a un funcionario condenado por participar en un delito de la ley se le aplica como pena accesoria la destitución y queda impedido de ejercer funciones públicas:", "o": ["De uno a quince años tras cumplir la pena", "De uno a quince años desde la sentencia", "Por el tiempo que dure la condena", "De manera perpetua y definitiva"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la LOCDOFT, el decomiso se distingue de la confiscación porque recae sobre bienes:", "o": ["Abandonados o no reclamados", "Del condenado por sentencia firme", "Afectados por medida temporal", "Adquiridos antes del delito"], "a": 0, "e": "Art. 4, numerales 7 y 8."}, {"t": "mc", "q": "Según la LOCDOFT, el producto del delito comprende los bienes obtenidos:", "o": ["Directa o indirectamente de su comisión", "Solo directamente de su comisión", "Solo si constan en dinero o divisas", "Solo después de la imputación formal"], "a": 0, "e": "Art. 4, numeral 20."}]}, {"titulo": "Examen integral 3", "q": [{"t": "mc", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de la ONCDOFT", "Sentencia de control"], "a": 0, "e": "Art. 9, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, tramitar las solicitudes de asistencia judicial recíproca corresponde a:", "o": ["El Ministerio Público, con el ministerio de exteriores", "La ONCDOFT, en coordinación con el ministerio de exteriores", "La UNIF, con su homóloga extranjera", "El TSJ, con el ministerio de interior"], "a": 0, "e": "Art. 77."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la LOCDOFT, se encuentra en Venezuela un investigado por un delito de la ley cometido en parte en alta mar. Esa persona:", "o": ["Está sujeta a enjuiciamiento conforme a esta ley", "Solo puede ser extraditada al Estado de bandera", "Queda fuera de la jurisdicción venezolana", "Solo responde si la víctima es venezolana"], "a": 0, "e": "Art. 73, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, la dirección de la investigación penal de estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El órgano de control"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir la investigación con violencia en favor de un grupo criminal se pena con seis a ocho años:", "o": ["Sin perjuicio de la pena por las lesiones", "Con absorción de la pena por las lesiones", "Aumentados en la mitad por las lesiones", "Solo si la víctima es funcionario público"], "a": 0, "e": "Art. 45, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, para evitar que personas vinculadas a estos delitos adquieran participaciones en sujetos obligados, deben adoptar medidas:", "o": ["Los órganos y entes de control", "El Ministerio Público y sus fiscales", "Los tribunales de control", "Los propios sujetos obligados"], "a": 0, "e": "Art. 21."}, {"t": "mc", "q": "Según la LOCDOFT, según la ley, los cuerpos competentes de investigación penal deben:", "o": ["Crear unidades de investigación de estos delitos", "Delegar la investigación en la UNIF", "Rendir cuentas directamente al órgano de control", "Solicitar permiso al órgano rector en cada caso"], "a": 0, "e": "Art. 26, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un delito con pena máxima de cuatro años y seis meses que no afecta intereses colectivos ni difusos:", "o": ["No es delito grave para esta ley", "Es grave porque supera los cuatro años", "Es grave si lo comete un funcionario", "Es grave si media un beneficio económico"], "a": 0, "e": "Art. 4, numeral 10: más de cinco años. El umbral de cuatro años es de Palermo."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela considerará remitir actuaciones penales a otro Estado cuando estime que ello:", "o": ["Obra en interés de una correcta administración de justicia", "Reduce los costos ordinarios de su sistema de justicia", "Evita que el imputado acceda a medidas cautelares", "Le permite cumplir la evaluación mutua del GAFIC"], "a": 0, "e": "Art. 85."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo que debe transcurrir desde la incautación para solicitar el decomiso por titular desconocido es de:", "o": ["Un año", "Seis meses", "Treinta días", "Dos años"], "a": 0, "e": "Art. 58. Los seis meses son del abandono tras absolución, art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, la legitimación de capitales se castiga con prisión de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Ocho a doce es el art. 34; quince a veinticinco, el art. 53."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, un imputado alega que pasaron veinte años desde una legitimación de capitales. La acción penal:", "o": ["No prescribe", "Prescribió a los quince años", "Prescribe al doble de la pena máxima", "Prescribe solo si no hubo imputación"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, no es posible la comparecencia en el Estado requirente de una persona. La ley prevé como alternativa:", "o": ["La videoconferencia", "La declaración jurada escrita", "La detención con fines de traslado", "La sustitución por un testigo referencial"], "a": 0, "e": "Art. 79."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, quien integra un grupo de delincuencia organizada, aunque no se le pruebe otro delito, responde:", "o": ["Por asociación, de seis a diez años", "Solo si el grupo consumó algún delito", "Por asociación, de ocho a doce años", "Únicamente con pena accesoria"], "a": 0, "e": "Art. 37: por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, el agente de operaciones encubiertas se define como un funcionario que:", "o": ["Asume una identidad diferente para infiltrarse", "Vigila desde el exterior sin contacto", "Colabora a cambio de reducción de pena", "Audita en secreto a los sujetos obligados"], "a": 0, "e": "Art. 4, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, se dicta sentencia condenatoria firme por un delito de la ley. Los bienes incautados preventivamente:", "o": ["Se confiscan y destinan a planes de prevención y represión", "Se devuelven al condenado hasta que otro proceso los afecte", "Se decomisan como bienes abandonados", "Pasan al patrimonio del Ministerio Público"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva de bienes la ordena:", "o": ["El juez de control, previa solicitud fiscal", "El fiscal, con aval del órgano rector", "La policía de investigación, en flagrancia", "El órgano rector, por vía administrativa"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, la imprescriptibilidad de la acción penal se extiende a los delitos previstos en esa ley, además de los delitos contra el patrimonio público y los de tráfico ilícito de drogas.", "a": true, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, alguien recauda fondos para una organización terrorista, pero el atentado nunca ocurre y el dinero no se usa. Responde:", "o": ["Por financiamiento, de quince a veinticinco años", "Solo por tentativa de financiamiento", "Por nada, al no consumarse el acto terrorista", "Por asociación, de seis a diez años"], "a": 0, "e": "Art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional contra estos grupos se basa, entre otros lineamientos, en:", "o": ["Privarlos del producto de sus actividades", "Dejar la persecución al Estado de origen", "Unificar los códigos penales de la región", "Sustituir la jurisdicción nacional afectada"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "mc", "q": "Según la LOCDOFT, brindar asistencia técnica en investigaciones y procesos judiciales de estos delitos es también una obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados no financieros", "Los colegios profesionales", "Las oficinas de cumplimiento"], "a": 0, "e": "Art. 8, numeral 14."}, {"t": "vf", "q": "Según la LOCDOFT, el tráfico de órganos y el sicariato tienen el mismo rango de pena.", "a": true, "e": "Arts. 43 y 44: veinticinco a treinta años."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de todas las transacciones en efectivo del mes anterior se remite a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El Banco Central"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según la LOCDOFT, en el decomiso, si no se promovieron pruebas o el punto es de mero derecho, el juez decide dentro de:", "o": ["Tres días", "Cinco días", "Ocho días", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la ley anterior contra la delincuencia organizada, según la cita de su disposición derogatoria, aparece publicada en:", "o": ["G.O. 5.789 Extraordinario, 26-10-2005", "G.O. 39.912, del 30-04-2012", "G.O. 38.281 Ordinario, del 27-09-2005", "G.O. 41.522, del 12-11-2018"], "a": 0, "e": "Disposición derogatoria única."}, {"t": "vf", "q": "Según la LOCDOFT, haber sido juzgado en el extranjero, sin cumplir la condena impuesta, no impide por sí solo la aplicación de la jurisdicción extraterritorial.", "a": true, "e": "Art. 73: exige juzgamiento y cumplimiento."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva procede sobre bienes empleados en el delito o sobre aquellos respecto de los cuales existan:", "o": ["Elementos de convicción de procedencia ilícita", "Sentencias firmes contra su propietario actual", "Reportes de sospecha enviados a la UNIF", "Denuncias de terceros sin otro respaldo"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo aplicable a directivos y empleados de sujetos obligados alcanza la legitimación de capitales y el financiamiento al terrorismo, pero no cualquier delito de delincuencia organizada.", "a": true, "e": "Art. 36."}, {"t": "mc", "q": "Según la LOCDOFT, el concepto de bienes incluye, a efectos de la ley, los medios que se pretendan utilizar para cometer los delitos:", "o": ["Aunque estén en poder de terceros no partícipes", "Solo si están en poder de los imputados del caso", "Solo si fueron efectivamente utilizados", "Solo si se trata de bienes muebles"], "a": 0, "e": "Art. 4, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, entre las diligencias de asistencia mutua se incluye:", "o": ["Facilitar la comparecencia voluntaria en el Estado requirente", "Trasladar forzosamente testigos al Estado requirente", "Aplicar la ley penal extranjera dentro del territorio nacional", "Ejecutar penas corporales impuestas en el exterior"], "a": 0, "e": "Art. 79, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Según la LOCDOFT, las grabaciones autorizadas de comunicaciones pueden hacerse:", "o": ["Únicamente a fines de investigación penal", "También para fines de supervisión sectorial", "Para fines de inteligencia financiera", "Para cualquier fin de seguridad del Estado"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los sufraga, salvo pacto en contrario:", "o": ["El Estado requirente", "El Estado requerido", "Ambos, por partes iguales", "El imputado, si resulta condenado"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa estatal es usada por sus directivos para legitimar capitales. La responsabilidad penal de la persona jurídica prevista en la ley:", "o": ["No alcanza a la empresa del Estado", "Alcanza a la empresa como a las privadas", "Se traslada al órgano de adscripción", "Solo opera con clausura definitiva"], "a": 0, "e": "Art. 31. Los directivos sí responden individualmente."}, {"t": "mc", "q": "Según la LOCDOFT, dos socios sin persona jurídica de por medio se conciertan de modo estable para traficar armas. Sobre la noción legal de delincuencia organizada:", "o": ["No alcanzan el mínimo de tres personas", "Bastan dos si hay un beneficio económico", "Se cumple con cualquier concierto estable", "Se requiere un mínimo de cinco integrantes"], "a": 0, "e": "Art. 4, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen para oponerse:", "o": ["Treinta días", "Cinco días", "Ocho días", "Quince días"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, revelar quiénes son los familiares de un agente encubierto también es punible.", "a": true, "e": "Art. 72."}, {"t": "mc", "q": "Según la LOCDOFT, en juicio se requiere la comparecencia del agente encubierto que aportó la evidencia. Esa comparecencia la asume:", "o": ["El responsable del Ministerio Público que coordinó", "El propio agente, con rostro cubierto", "El superior policial que dirigió al agente infiltrado", "El juez de control que autorizó"], "a": 0, "e": "Art. 71."}, {"t": "mc", "q": "Según la LOCDOFT, la clausura definitiva de una persona jurídica condenada procede en caso de:", "o": ["Comisión intencional de delitos de la ley", "Comisión culposa de delitos de la ley", "Primera infracción administrativa grave", "Omisión de un reporte de sospecha"], "a": 0, "e": "Art. 32, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el titular no reclama sus bienes. El fiscal solicita el decomiso por abandono después de:", "o": ["Seis meses de finalizado el proceso", "Un año de finalizado el proceso", "Treinta días de finalizado el proceso", "Cinco años de finalizado el proceso"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, la ley del país de una sucursal extranjera impide aplicar los controles venezolanos. La sucursal debe:", "o": ["Informar a la oficina principal y exigirse el estándar más alto", "Aplicar solo la ley local sin informar a la oficina principal", "Cerrar operaciones de inmediato", "Pedir una excepción a la UNIF"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la LOCDOFT, la actividad sospechosa se diferencia de la inusual en que la primera supone:", "o": ["Un análisis que hace presumir fondos ilícitos", "Un monto superior a USD 10.000 en una operación", "Una orden judicial previa de examen", "La condena de alguno de los clientes"], "a": 0, "e": "Art. 4, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, las solicitudes de decomiso de otro Estado se presentan por Venezuela ante:", "o": ["Sus autoridades competentes para que se pronuncien", "La UNIF para su análisis de inteligencia", "El órgano de control del titular de los bienes", "El Estado requirente para su propia ejecución"], "a": 0, "e": "Art. 88."}]}, {"titulo": "Examen integral 4", "q": [{"t": "vf", "q": "Según la LOCDOFT, basta una sola de las condiciones legales, como que otras medidas resultaran inútiles, para que proceda la autorización del agente encubierto, si además existe el delito o la sospecha fundada.", "a": true, "e": "Art. 68: una o varias."}, {"t": "mc", "q": "Según la LOCDOFT, el servicio especializado de administración de bienes depende de:", "o": ["El órgano rector", "El Ministerio Público", "La UNIF", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 54."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una causal legal para denegar la asistencia judicial recíproca:", "o": ["Que la solicitud involucre el secreto bancario", "Que menoscabe la soberanía o el orden público", "Que no se ajuste a los requisitos legales", "Que sea contraria al ordenamiento interno"], "a": 0, "e": "Arts. 81 y 87."}, {"t": "mc", "q": "Según la LOCDOFT, el salvoconducto de un testigo que viaja a declarar cesa si, informado de que ya no se requiere su presencia, permanece voluntariamente durante:", "o": ["Quince días consecutivos o el período acordado", "Treinta días consecutivos o el período acordado", "Cinco días consecutivos sin excepción", "Ocho días hábiles sin excepción"], "a": 0, "e": "Art. 83."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, se incautan alimentos perecederos. Para evitar su deterioro, el juez de control, previo inventario y oídos los terceros de buena fe:", "o": ["Puede autorizar su venta o uso con fines sociales", "Debe ordenar su destrucción inmediata y documentada", "Debe esperar la sentencia definitiva", "Los devuelve al imputado en custodia"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal quiere interceptar correos electrónicos de un investigado. Requiere:", "o": ["Autorización del juez de control", "Solo orden motivada del fiscal", "Autorización previa de la ONCDOFT", "Solicitud de la UNIF al operador"], "a": 0, "e": "Art. 64, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales NO figura:", "o": ["El SENIAT", "El CICPC", "La Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, los capitales objeto del delito de legitimación:", "o": ["Serán decomisados o confiscados", "Pueden ser devueltos tras cumplir la pena", "Solo se afectan por el monto de la multa", "Se reparten entre las víctimas identificadas"], "a": 0, "e": "Art. 35, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, en la trata de personas cometida por un grupo criminal contra un adulto que aceptó el traslado, el consentimiento de la víctima:", "o": ["No excluye el delito", "Excluye la responsabilidad penal", "Atenúa la pena a la mitad", "Convierte el hecho en tráfico ilegal"], "a": 0, "e": "Arts. 41 y 42."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos derivados del producto del delito:", "o": ["Están sujetos a las mismas medidas", "Pertenecen al tercero que los generó", "Están exentos si provienen de inversión lícita", "Solo se afectan por sentencia extranjera"], "a": 0, "e": "Art. 89, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, un juez autoriza una identidad falsa a un agente. Esa autorización:", "o": ["No permite alterar registros públicos", "Permite alterar registros si es necesario", "Permite alterar solo archivos nacionales", "Requiere alterar los libros civiles"], "a": 0, "e": "Art. 70, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, para que un acto sea terrorista, además del medio empleado debe perseguir, entre otros fines:", "o": ["Intimidar gravemente a una población", "Obtener un beneficio económico directo", "Afectar a más de un Estado a la vez", "Controlar un territorio determinado"], "a": 0, "e": "Art. 4, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones a las personas jurídicas se imponen:", "o": ["Por el juez en la sentencia definitiva", "Por el órgano de control en acto motivado", "Por el Ministerio Público en la acusación", "Por el juez de control en la audiencia preliminar"], "a": 0, "e": "Art. 32."}, {"t": "vf", "q": "Según la LOCDOFT, el deber de reportar cede si los fondos provienen de una fuente lícita, aunque se sospeche que serán usados para financiar terrorismo.", "a": false, "e": "Art. 13: incluye actividades de fuente lícita."}, {"t": "mc", "q": "Según la LOCDOFT, en situación de urgencia, y si los Estados convienen, la solicitud de asistencia puede hacerse:", "o": ["Verbalmente, con confirmación lo antes posible", "Verbalmente, sin confirmación posterior", "Por escrito, solo en original legalizado", "Solo a través del tribunal de control"], "a": 0, "e": "Art. 80."}, {"t": "vf", "q": "Según la LOCDOFT, la incidencia de oposición al decomiso no interrumpe el proceso penal.", "a": true, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, las razones ideológicas o religiosas pueden justificar el financiamiento al terrorismo cuando se prueba que eran el único móvil.", "a": false, "e": "Art. 53, parte final: ninguna circunstancia lo justifica."}, {"t": "mc", "q": "Según la LOCDOFT, el grupo formado deliberadamente para la comisión inmediata de un delito se denomina:", "o": ["Grupo estructurado", "Organización terrorista", "Grupo de delincuencia transnacional", "Asociación ilícita simple"], "a": 0, "e": "Art. 4, numeral 12."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia perturbaría una investigación en curso en Venezuela. Venezuela puede:", "o": ["Diferirla y consultar con el Estado requirente", "Denegarla sin expresar motivo alguno al Estado", "Cumplirla siempre con prioridad", "Archivarla de manera definitiva"], "a": 0, "e": "Art. 82."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones administrativas previstas por incumplir las obligaciones de los sujetos obligados las imponen, por regla general:", "o": ["Los órganos y entes de control", "Los jueces de control", "Los fiscales del Ministerio Público", "La UNIF por vía de reporte"], "a": 0, "e": "Arts. 8, numeral 3, y 10 a 17."}, {"t": "mc", "q": "Según la LOCDOFT, al solicitar asistencia a Venezuela debe indicarse, entre otros datos:", "o": ["La autoridad solicitante y el objeto de la investigación", "El presupuesto estimado del proceso en el Estado extranjero", "La opinión favorable de la Interpol", "La aprobación previa del órgano rector"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, son responsables por hechos punibles cometidos por cuenta de ellas por sus órganos directivos o representantes:", "o": ["Las personas jurídicas, salvo el Estado y sus empresas", "Todas las personas jurídicas, incluso las estatales", "Solo las personas jurídicas del sector financiero", "Solo los directivos, nunca la persona jurídica"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según la LOCDOFT, quien intenta sin éxito realizar un acto terrorista como terrorista individual enfrenta:", "o": ["La misma pena del consumado, 25 a 30 años", "La pena rebajada por la tentativa", "Solo la pena por financiamiento", "Quince a veinticinco años de prisión"], "a": 0, "e": "Art. 52: realice o trate de realizar."}, {"t": "mc", "q": "Según la LOCDOFT, usar la ingeniería genética para producir armas biológicas, como parte de un grupo criminal, se pena con:", "o": ["Veinticinco a treinta años", "Ocho a doce años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 40."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, en el abandono legal, el lapso para reclamar luego del cartel es de treinta días contados desde:", "o": ["La consignación del cartel", "La publicación de la sentencia", "La orden del tribunal de control", "La incautación del bien"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos que obtiene el servicio especializado por administrar y enajenar bienes pueden destinarse:", "o": ["A programas de prevención y a su autofinanciamiento", "Solo al pago de la deuda pública nacional vigente", "A indemnizar a los funcionarios actuantes", "A incrementar el situado constitucional"], "a": 0, "e": "Art. 61."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa telefónica se niega a facilitar sus equipos para una interceptación judicialmente autorizada, alegando ser privada. La ley dispone que:", "o": ["Está obligada a permitir su uso", "Solo debe entregar datos históricos", "Puede negarse sin orden del TSJ", "Basta que entregue un informe técnico"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, una estafa del Código Penal ejecutada por un grupo de delincuencia organizada:", "o": ["Se considera delito de delincuencia organizada", "Sigue siendo solo delito común sin agravación", "Queda absorbida por el delito de asociación", "Solo se castiga con la pena de asociación"], "a": 0, "e": "Art. 27, con el aumento del art. 28."}, {"t": "vf", "q": "Según la LOCDOFT, para la devolución de bienes en el procedimiento de decomiso, el interesado debe haber hecho todo lo razonable para impedir su uso ilegal.", "a": true, "e": "Art. 59, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, amenazar a un testigo con un daño grave a su familia, para favorecer a un grupo criminal, se ubica en el tramo de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Diez a quince años"], "a": 0, "e": "Art. 45, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la trata de una víctima adulta se castiga con prisión de veinte a veinticinco años y, además, con:", "o": ["La indemnización de gastos de recuperación", "Una multa fija de 3.000 unidades tributarias", "La confiscación de todos los bienes del autor", "La expulsión del territorio si es extranjero"], "a": 0, "e": "Art. 41."}, {"t": "vf", "q": "Según la LOCDOFT, el delito de asociación exige probar que el grupo cometió efectivamente alguno de los delitos para los que se formó.", "a": false, "e": "Art. 37: se pena por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una finalidad que haga lícita la operación encubierta:", "o": ["Recaudar tributos de bienes del grupo", "Identificar a autores y partícipes", "Efectuar incautaciones e inmovilizaciones", "Evitar la comisión de los delitos"], "a": 0, "e": "Art. 69."}, {"t": "mc", "q": "Según la LOCDOFT, vencido sin resultados el plazo de una operación encubierta, el juez, vistos los alegatos del funcionario responsable:", "o": ["Concederá prórroga", "Debe ordenar el cierre definitivo", "Debe remitir a la Corte de Apelaciones", "Puede autorizar solo una nueva operación"], "a": 0, "e": "Art. 67, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia dirigida a Venezuela debe presentarse por escrito:", "o": ["En castellano o idioma aceptado por Venezuela", "En cualquiera de los idiomas de la ONU", "Únicamente en idioma castellano oficial del país", "En el idioma del Estado requirente"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, presentar informes fundados al Ministerio Público cuando haya indicios de un hecho punible corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, el dinero de la venta anticipada de bienes perecederos incautados:", "o": ["Se resguarda hasta la sentencia firme", "Se reparte entre los órganos actuantes", "Ingresa de inmediato al Tesoro Nacional", "Se entrega al imputado en caución"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, un grupo cobra por sacar del país a migrantes que aceptan pagar, sin cumplir requisitos legales y sin explotarlos después. El hecho encuadra en:", "o": ["Inmigración ilícita y tráfico ilegal, ocho a doce", "Trata de personas, de veinte a veinticinco", "Solo infracción de la ley de migración", "Asociación, de seis a diez años, y nada más"], "a": 0, "e": "Art. 42."}, {"t": "mc", "q": "Según la LOCDOFT, un Estado recibió pruebas de Venezuela para un caso y quiere usarlas en otro distinto. Requiere:", "o": ["El previo consentimiento del Estado venezolano", "Solo informar después a Venezuela", "La autorización de su propio juez", "Nada, si el delito es de la misma especie"], "a": 0, "e": "Art. 80, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, conservar equipos exclusivamente destinados a fabricar moneda, como parte de un grupo criminal, se pena con:", "o": ["Doce a dieciocho años, aunque no se fabrique", "Doce a dieciocho años, solo si se fabricó", "Ocho a doce años, aunque no se fabrique", "Seis a diez años, solo si se distribuye"], "a": 0, "e": "Art. 51: basta fabricar, custodiar, ocultar o conservar los instrumentos."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF depende jerárquicamente, conforme al texto de la ley, del ministerio de:", "o": ["Planificación y finanzas", "Relaciones interiores y justicia", "Relaciones exteriores", "Economía productiva"], "a": 0, "e": "Art. 24. La ONCDOFT depende del de relaciones interiores y justicia."}, {"t": "mc", "q": "Según la LOCDOFT, analizar la información para confirmar actividades sospechosas corresponde a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El CICPC"], "a": 0, "e": "Art. 25, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal solicita un agente encubierto, aunque el caso puede esclarecerse fácilmente con registros bancarios ya disponibles. El juez debería:", "o": ["Negarla por no cumplirse los supuestos legales", "Otorgarla, por tratarse de delito grave", "Otorgarla, pues basta la sospecha fundada", "Remitirla a la policía para que decida"], "a": 0, "e": "Art. 68: imposible o sumamente difícil, u otras medidas inútiles."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Según la LOCDOFT, mientras no se cree el servicio especializado, los bienes incautados quedan a la orden de:", "o": ["El órgano rector", "El tribunal de control", "El Ministerio Público", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 55."}]}]}, {"titulo": "Por tema", "exams": [{"titulo": "Delitos y penas", "q": [{"t": "mc", "q": "Según la LOCDOFT, que la comisión del delito involucre el espacio geográfico de otro Estado:", "o": ["Es una circunstancia agravante", "Excluye la competencia venezolana", "Obliga a aplicar la ley extranjera", "Es irrelevante para fijar la pena"], "a": 0, "e": "Art. 29, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "vf", "q": "Según la LOCDOFT, utilizar a un adulto mayor o a una persona en situación de calle para cometer los delitos es una circunstancia agravante.", "a": true, "e": "Art. 29, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, si en un delito de la ley concurre una sola agravante de las previstas, la pena aplicable:", "o": ["Aumenta en un tercio", "Aumenta en la mitad", "Aumenta en una cuarta parte", "Se fija en su límite máximo"], "a": 0, "e": "Art. 29, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir el comercio con amenazas, en apoyo de un grupo criminal, se pena con prisión de:", "o": ["Ocho a diez años", "Ocho a doce años", "Seis a ocho años", "Diez a quince años"], "a": 0, "e": "Art. 50."}, {"t": "mc", "q": "Según la LOCDOFT, si la víctima de trata es un adolescente, la pena es de:", "o": ["Veinticinco a treinta años", "Veinte a veinticinco años", "Quince a veinticinco años", "Ocho a doce años"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, la producción de material pornográfico con niños, por un grupo criminal, tiene pena de veinte a veinticinco años, mientras que explotar esa industria con ellos o para ellos tiene:", "o": ["Veinticinco a treinta años", "Diez a quince años", "Quince a veinte años", "La misma pena de veinte a veinticinco"], "a": 0, "e": "Arts. 46 y 49."}, {"t": "vf", "q": "Según la LOCDOFT, un hecho con pena inferior a cinco años puede ser delito grave si afecta intereses colectivos o difusos.", "a": true, "e": "Art. 4, numeral 10."}, {"t": "mc", "q": "Según la LOCDOFT, quien, sin pertenecer al grupo criminal, figura como propietario de bienes relacionados con los delitos es:", "o": ["Interpuesta persona", "Íntimo asociado", "Integrante de grupo estructurado", "Tercero de buena fe"], "a": 0, "e": "Art. 4, numeral 13. El íntimo asociado se refiere a las PEP."}, {"t": "mc", "q": "Según la LOCDOFT, una cajera omite por descuido los controles y con ello facilita, sin intención ni participación, una operación de legitimación. Responde:", "o": ["Por el delito culposo, de tres a seis años", "Como autora de legitimación, diez a quince", "Solo con multa a cargo del supervisor", "Como cómplice, con pena rebajada a la mitad"], "a": 0, "e": "Art. 36: imprudencia, impericia o negligencia."}, {"t": "mc", "q": "Según la LOCDOFT, para obstruir una investigación en beneficio de un grupo criminal, alguien paga a un funcionario y este acepta. La pena de ambos es de:", "o": ["Doce a dieciocho años", "Ocho a doce años", "Seis a ocho años", "Quince a veinte años"], "a": 0, "e": "Art. 45, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, cuando un delito del Código Penal es cometido por un grupo de delincuencia organizada, la sanción:", "o": ["Se incrementa en la mitad de la pena aplicable", "Se incrementa en un tercio de la pena aplicable", "Se duplica sin excepción alguna", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28. El tercio corresponde a una agravante del art. 29."}, {"t": "mc", "q": "Según la LOCDOFT, para el delito de tráfico de recursos estratégicos, estos son:", "o": ["Los insumos básicos de los procesos productivos", "Solo los hidrocarburos y sus derivados refinados", "Los bienes que declare el órgano rector", "Las divisas y los títulos al portador"], "a": 0, "e": "Art. 34, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, a un funcionario condenado por participar en un delito de la ley se le aplica como pena accesoria la destitución y queda impedido de ejercer funciones públicas:", "o": ["De uno a quince años tras cumplir la pena", "De uno a quince años desde la sentencia", "Por el tiempo que dure la condena", "De manera perpetua y definitiva"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la LOCDOFT, financiar parcialmente a un terrorista individual, de modo que solo una parte de los fondos vaya a ese fin:", "o": ["Basta para configurar el delito", "Solo es punible por la parte probada", "Excluye el delito si el resto es lícito", "Requiere pertenecer a una organización"], "a": 0, "e": "Art. 53: en su totalidad o en parte."}, {"t": "mc", "q": "Según la LOCDOFT, si el funcionario participó en un delito de la ley en perjuicio de una alcaldía, la pena se aplica:", "o": ["En su límite máximo", "Aumentada en un tercio", "En su término medio", "Aumentada en la mitad"], "a": 0, "e": "Art. 33: órgano nacional, estadal o municipal."}, {"t": "vf", "q": "Según la LOCDOFT, una sola persona puede incurrir en delincuencia organizada si actúa como órgano de una persona jurídica o asociativa con la intención de cometer delitos de esa ley.", "a": true, "e": "Art. 4, numeral 9, y art. 27."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre terrorista individual y organización terrorista está en que esta última requiere:", "o": ["Tres o más personas con propósito común", "Dos o más personas con propósito común", "Actuar en más de un país", "Una estructura registrada o reconocida"], "a": 0, "e": "Art. 4, numerales 17 y 22."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión de quien posee bienes a sabiendas de su origen ilícito se acompaña de una multa equivalente:", "o": ["Al valor del incremento patrimonial ilícito", "Al doble del valor de los bienes poseídos", "A entre 1.000 y 3.000 unidades tributarias", "Al salario de los años de condena impuestos"], "a": 0, "e": "Art. 35. Las multas en U.T. son administrativas."}, {"t": "vf", "q": "Según la LOCDOFT, financiar a una organización terrorista que opera únicamente en el extranjero también es punible.", "a": true, "e": "Art. 53, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, quien sin ser policía usa un uniforme policial simulado para cometer un delito de la ley:", "o": ["Incurre en la agravante de la condición simulada", "No agrava porque no es funcionario público", "Solo responde por usurpación de funciones", "Solo agrava si el uniforme es auténtico"], "a": 0, "e": "Art. 29, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la LOCDOFT, un integrante de un grupo criminal traslada, sin autorización, armas de guerra. La pena es de:", "o": ["Quince a veinticinco años", "Doce a dieciocho años", "Veinticinco a treinta años", "Ocho a doce años"], "a": 0, "e": "Art. 38: agravada por tratarse de armas de guerra."}, {"t": "vf", "q": "Según la LOCDOFT, quien encarga un homicidio a un sicario recibe la misma pena que el ejecutor.", "a": true, "e": "Art. 44."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir la investigación con violencia en favor de un grupo criminal se pena con seis a ocho años:", "o": ["Sin perjuicio de la pena por las lesiones", "Con absorción de la pena por las lesiones", "Aumentados en la mitad por las lesiones", "Solo si la víctima es funcionario público"], "a": 0, "e": "Art. 45, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, el tráfico de órganos y el sicariato tienen el mismo rango de pena.", "a": true, "e": "Arts. 43 y 44: veinticinco a treinta años."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "vf", "q": "Según la LOCDOFT, la imprescriptibilidad de la acción penal se extiende a los delitos previstos en esa ley, además de los delitos contra el patrimonio público y los de tráfico ilícito de drogas.", "a": true, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la LOCDOFT, alguien recauda fondos para una organización terrorista, pero el atentado nunca ocurre y el dinero no se usa. Responde:", "o": ["Por financiamiento, de quince a veinticinco años", "Solo por tentativa de financiamiento", "Por nada, al no consumarse el acto terrorista", "Por asociación, de seis a diez años"], "a": 0, "e": "Art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, quien integra un grupo de delincuencia organizada, aunque no se le pruebe otro delito, responde:", "o": ["Por asociación, de seis a diez años", "Solo si el grupo consumó algún delito", "Por asociación, de ocho a doce años", "Únicamente con pena accesoria"], "a": 0, "e": "Art. 37: por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, la legitimación de capitales se castiga con prisión de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Ocho a doce es el art. 34; quince a veinticinco, el art. 53."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo aplicable a directivos y empleados de sujetos obligados alcanza la legitimación de capitales y el financiamiento al terrorismo, pero no cualquier delito de delincuencia organizada.", "a": true, "e": "Art. 36."}, {"t": "mc", "q": "Según la LOCDOFT, un delito con pena máxima de cuatro años y seis meses que no afecta intereses colectivos ni difusos:", "o": ["No es delito grave para esta ley", "Es grave porque supera los cuatro años", "Es grave si lo comete un funcionario", "Es grave si media un beneficio económico"], "a": 0, "e": "Art. 4, numeral 10: más de cinco años. El umbral de cuatro años es de Palermo."}, {"t": "mc", "q": "Según la LOCDOFT, un imputado alega que pasaron veinte años desde una legitimación de capitales. La acción penal:", "o": ["No prescribe", "Prescribió a los quince años", "Prescribe al doble de la pena máxima", "Prescribe solo si no hubo imputación"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, la ley anterior contra la delincuencia organizada, según la cita de su disposición derogatoria, aparece publicada en:", "o": ["G.O. 5.789 Extraordinario, 26-10-2005", "G.O. 39.912, del 30-04-2012", "G.O. 38.281 Ordinario, del 27-09-2005", "G.O. 41.522, del 12-11-2018"], "a": 0, "e": "Disposición derogatoria única."}, {"t": "mc", "q": "Según la LOCDOFT, dos socios sin persona jurídica de por medio se conciertan de modo estable para traficar armas. Sobre la noción legal de delincuencia organizada:", "o": ["No alcanzan el mínimo de tres personas", "Bastan dos si hay un beneficio económico", "Se cumple con cualquier concierto estable", "Se requiere un mínimo de cinco integrantes"], "a": 0, "e": "Art. 4, numeral 9."}, {"t": "vf", "q": "Según la LOCDOFT, las razones ideológicas o religiosas pueden justificar el financiamiento al terrorismo cuando se prueba que eran el único móvil.", "a": false, "e": "Art. 53, parte final: ninguna circunstancia lo justifica."}, {"t": "mc", "q": "Según la LOCDOFT, conservar equipos exclusivamente destinados a fabricar moneda, como parte de un grupo criminal, se pena con:", "o": ["Doce a dieciocho años, aunque no se fabrique", "Doce a dieciocho años, solo si se fabricó", "Ocho a doce años, aunque no se fabrique", "Seis a diez años, solo si se distribuye"], "a": 0, "e": "Art. 51: basta fabricar, custodiar, ocultar o conservar los instrumentos."}, {"t": "mc", "q": "Según la LOCDOFT, quien intenta sin éxito realizar un acto terrorista como terrorista individual enfrenta:", "o": ["La misma pena del consumado, 25 a 30 años", "La pena rebajada por la tentativa", "Solo la pena por financiamiento", "Quince a veinticinco años de prisión"], "a": 0, "e": "Art. 52: realice o trate de realizar."}, {"t": "mc", "q": "Según la LOCDOFT, la trata de una víctima adulta se castiga con prisión de veinte a veinticinco años y, además, con:", "o":
