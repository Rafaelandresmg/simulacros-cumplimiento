["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "mc", "q": "El intercambio de información entre sujetos obligados sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en el contrato"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica", "Excluye el de baja probabilidad", "Excluye el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "¿Qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "El análisis media entre ambas."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}]};
const GR=D.groups, ALL=D.all, PASS=0.8;
const app=document.getElementById('app');
let st=null, immediate=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){
  st=null;
  let h=`<h1>${esc(D.titulo)}</h1><p class="mut">${esc(D.sub)}</p>`;
  h+=`<div class="card menu"><h2 style="margin-top:0">Simulacro aleatorio</h2>
      <button class="p" onclick="start(-1)"><b>50 preguntas de todo el temario</b><br><span style="opacity:.85">Se arma distinto cada vez, con ${ALL.length} preguntas disponibles</span></button></div>`;
  GR.forEach((g,gi)=>{
    h+=`<h2>${esc(g.titulo)}</h2><div class="card menu">`;
    g.exams.forEach((e,ei)=>{
      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;
    });
    h+='</div>';
  });
  h+=`<label class="t"><input type="checkbox" id="imm" ${immediate?'checked':''} onchange="immediate=this.checked"> Corregir cada pregunta al contestarla. Desactívalo para simular el examen real y ver la nota solo al final.</label>
      <p class="mut">Verdadero o falso y selección simple. Se aprueba con 80 %, es decir 40 de 50. Al terminar verás la nota y la explicación de cada error.</p>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(gi,ei){
  let qs,titulo;
  if(gi===-1){qs=shuffle(ALL).slice(0,50);titulo='Simulacro aleatorio';}
  else{const e=GR[gi].exams[ei];qs=shuffle(e.q);titulo=e.titulo;}
  qs=qs.map(prep);
  st={titulo,qs,i:0,ans:qs.map(()=>null)};
  render();
}
function pick(k){
  const a=st.ans[st.i];
  if(a&&a.locked)return;
  st.ans[st.i]={sel:k,locked:immediate};
  render();
}
function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
