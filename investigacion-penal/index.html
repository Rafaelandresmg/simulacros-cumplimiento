 pese a un volumen alto de operaciones. ¿Qué lectura es razonable?", "o": ["Posibles fallas de detección o de reporte", "Cartera limpia sin riesgo de lavado", "Mérito que reconoce el supervisor en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "Si un ROS se envía con información incompleta o errónea, ¿qué consecuencia tiene?", "o": ["Reduce la utilidad de la inteligencia", "Es preferible a no reportar sin consecuencia alguna", "Se corrige automáticamente por la UIF", "Obliga a archivar el caso sin análisis"], "a": 0, "e": "La calidad importa."}]}]}, {"titulo": "Normativa prudencial: LOCDOFT, delitos, investigación y cooperación", "exams": [{"titulo": "Normativa prudencial · modelo 1", "q": [{"t": "mc", "q": "Según la LOCDOFT, las solicitudes de decomiso de otro Estado se presentan por Venezuela ante:", "o": ["Sus autoridades competentes para que se pronuncien", "La UNIF para su análisis de inteligencia", "El órgano de control del titular de los bienes", "El Estado requirente para su propia ejecución"], "a": 0, "e": "Art. 88."}, {"t": "mc", "q": "Según la LOCDOFT, analizar la información para confirmar actividades sospechosas corresponde a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El CICPC"], "a": 0, "e": "Art. 25, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, el producto del delito comprende los bienes obtenidos:", "o": ["Directa o indirectamente de su comisión", "Solo directamente de su comisión", "Solo si constan en dinero o divisas", "Solo después de la imputación formal"], "a": 0, "e": "Art. 4, numeral 20."}, {"t": "mc", "q": "Según la LOCDOFT, la dirección de la investigación penal de estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El órgano de control"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir la investigación con violencia en favor de un grupo criminal se pena con seis a ocho años:", "o": ["Sin perjuicio de la pena por las lesiones", "Con absorción de la pena por las lesiones", "Aumentados en la mitad por las lesiones", "Solo si la víctima es funcionario público"], "a": 0, "e": "Art. 45, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones administrativas previstas por incumplir las obligaciones de los sujetos obligados las imponen, por regla general:", "o": ["Los órganos y entes de control", "Los jueces de control", "Los fiscales del Ministerio Público", "La UNIF por vía de reporte"], "a": 0, "e": "Arts. 8, numeral 3, y 10 a 17."}, {"t": "vf", "q": "Según la LOCDOFT, las denegaciones de asistencia judicial recíproca deben ser motivadas.", "a": true, "e": "Art. 81, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un Estado recibió pruebas de Venezuela para un caso y quiere usarlas en otro distinto. Requiere:", "o": ["El previo consentimiento del Estado venezolano", "Solo informar después a Venezuela", "La autorización de su propio juez", "Nada, si el delito es de la misma especie"], "a": 0, "e": "Art. 80, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, el grupo formado deliberadamente para la comisión inmediata de un delito se denomina:", "o": ["Grupo estructurado", "Organización terrorista", "Grupo de delincuencia transnacional", "Asociación ilícita simple"], "a": 0, "e": "Art. 4, numeral 12."}, {"t": "vf", "q": "Según la LOCDOFT, el delito de asociación exige probar que el grupo cometió efectivamente alguno de los delitos para los que se formó.", "a": false, "e": "Art. 37: se pena por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, el producto se transformó en otros bienes. Respecto de estos:", "o": ["Pueden ser objeto de las mismas medidas", "Quedan fuera por haber cambiado de naturaleza", "Solo se afectan si son bienes inmuebles", "Solo cabe multa por el valor equivalente"], "a": 0, "e": "Art. 89, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela considerará remitir actuaciones penales a otro Estado cuando estime que ello:", "o": ["Obra en interés de una correcta administración de justicia", "Reduce los costos ordinarios de su sistema de justicia", "Evita que el imputado acceda a medidas cautelares", "Le permite cumplir la evaluación mutua del GAFIC"], "a": 0, "e": "Art. 85."}, {"t": "mc", "q": "Según la LOCDOFT, el concepto de bienes incluye, a efectos de la ley, los medios que se pretendan utilizar para cometer los delitos:", "o": ["Aunque estén en poder de terceros no partícipes", "Solo si están en poder de los imputados del caso", "Solo si fueron efectivamente utilizados", "Solo si se trata de bienes muebles"], "a": 0, "e": "Art. 4, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para jueces y fiscales en estos delitos corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Colegio de Abogados"], "a": 0, "e": "Art. 6, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, para evitar que personas vinculadas a estos delitos adquieran participaciones en sujetos obligados, deben adoptar medidas:", "o": ["Los órganos y entes de control", "El Ministerio Público y sus fiscales", "Los tribunales de control", "Los propios sujetos obligados"], "a": 0, "e": "Art. 21."}, {"t": "mc", "q": "Según la LOCDOFT, para obstruir una investigación en beneficio de un grupo criminal, alguien paga a un funcionario y este acepta. La pena de ambos es de:", "o": ["Doce a dieciocho años", "Ocho a doce años", "Seis a ocho años", "Quince a veinte años"], "a": 0, "e": "Art. 45, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, revelar quiénes son los familiares de un agente encubierto también es punible.", "a": true, "e": "Art. 72."}, {"t": "mc", "q": "Según la LOCDOFT, el enjuiciamiento de estos delitos se rige por:", "o": ["El COPP, esta ley y demás normas aplicables", "Un procedimiento especial solo de esta ley", "El Código de Enjuiciamiento Criminal de 1962", "Las reglas de la jurisdicción militar"], "a": 0, "e": "Art. 63."}, {"t": "vf", "q": "Según la LOCDOFT, basta una sola de las condiciones legales, como que otras medidas resultaran inútiles, para que proceda la autorización del agente encubierto, si además existe el delito o la sospecha fundada.", "a": true, "e": "Art. 68: una o varias."}, {"t": "mc", "q": "Según la LOCDOFT, según la ley, los cuerpos competentes de investigación penal deben:", "o": ["Crear unidades de investigación de estos delitos", "Delegar la investigación en la UNIF", "Rendir cuentas directamente al órgano de control", "Solicitar permiso al órgano rector en cada caso"], "a": 0, "e": "Art. 26, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la incidencia de oposición al decomiso no interrumpe el proceso penal.", "a": true, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos que obtiene el servicio especializado por administrar y enajenar bienes pueden destinarse:", "o": ["A programas de prevención y a su autofinanciamiento", "Solo al pago de la deuda pública nacional vigente", "A indemnizar a los funcionarios actuantes", "A incrementar el situado constitucional"], "a": 0, "e": "Art. 61."}, {"t": "mc", "q": "Según la LOCDOFT, la legitimación de capitales se castiga con prisión de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Ocho a doce es el art. 34; quince a veinticinco, el art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, sobre las concesiones y autorizaciones de una persona jurídica condenada, el juez:", "o": ["Remite las actuaciones a los órganos competentes", "Las revoca directamente en la misma sentencia", "Carece de toda facultad sobre el asunto", "Las suspende hasta por quince años"], "a": 0, "e": "Art. 32, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, la sentencia condenatoria de una persona jurídica se publica:", "o": ["Íntegra, en diario de mayor circulación, a su costa", "Solo su dispositivo, en Gaceta, a costa del Estado", "Íntegra, en el portal del órgano rector y sin costo", "Solo si lo solicita alguna de las víctimas"], "a": 0, "e": "Art. 32, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, incumplir el trámite de autorización de la entrega vigilada se pena con prisión de:", "o": ["Cinco a diez años", "Tres a seis años", "Seis a ocho años", "Ocho a doce años"], "a": 0, "e": "Art. 66, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un juez autoriza una identidad falsa a un agente. Esa autorización:", "o": ["No permite alterar registros públicos", "Permite alterar registros si es necesario", "Permite alterar solo archivos nacionales", "Requiere alterar los libros civiles"], "a": 0, "e": "Art. 70, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un viajero entra al país con exactamente USD 10.000 en efectivo. Respecto del deber de declarar dispuesto en la ley:", "o": ["No se activa, porque debe excederse esa cifra", "Se activa desde USD 10.000, esa cifra inclusive", "Se activa solo para extranjeros", "Se activa solo al salir del territorio"], "a": 0, "e": "Art. 22: cuyo monto exceda."}, {"t": "mc", "q": "Según la LOCDOFT, la documentación bancaria y financiera puede entregarse en asistencia mutua mediante:", "o": ["Copias certificadas de los documentos pertinentes", "Solo informe resumido de la autoridad requerida", "Solo con el consentimiento del titular", "Exclusivamente por la vía de la UNIF"], "a": 0, "e": "Art. 79, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva procede sobre bienes empleados en el delito o sobre aquellos respecto de los cuales existan:", "o": ["Elementos de convicción de procedencia ilícita", "Sentencias firmes contra su propietario actual", "Reportes de sospecha enviados a la UNIF", "Denuncias de terceros sin otro respaldo"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, ensamblar municiones a partir de componentes lícitos, como parte de un grupo criminal:", "o": ["Es fabricación ilícita aunque las piezas sean lícitas", "Es atípico si todas las piezas son de origen lícito", "Solo es tráfico si se llegan a vender", "Es una infracción administrativa aduanera"], "a": 0, "e": "Art. 39."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva de bienes la ordena:", "o": ["El juez de control, previa solicitud fiscal", "El fiscal, con aval del órgano rector", "La policía de investigación, en flagrancia", "El órgano rector, por vía administrativa"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, en extrema necesidad y urgencia operativa, para una entrega vigilada el fiscal:", "o": ["Obtiene la autorización por cualquier medio y luego la formaliza", "Actúa sin autorización y la pide dentro de los treinta días", "Sustituye la autorización con su propia acta", "Debe esperar siempre la autorización escrita"], "a": 0, "e": "Art. 66, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, los fondos, para la ley, incluyen activos de todo tipo:", "o": ["Con independencia de la licitud de su origen", "Siempre que su origen sea ilícito y conocido", "Solo si están depositados en bancos", "Solo si son tangibles y movibles"], "a": 0, "e": "Art. 4, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, las grabaciones autorizadas de comunicaciones pueden hacerse:", "o": ["Únicamente a fines de investigación penal", "También para fines de supervisión sectorial", "Para fines de inteligencia financiera", "Para cualquier fin de seguridad del Estado"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, en el decomiso, si no se promovieron pruebas o el punto es de mero derecho, el juez decide dentro de:", "o": ["Tres días", "Cinco días", "Ocho días", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, la imprescriptibilidad de la acción penal se extiende a los delitos previstos en esa ley, además de los delitos contra el patrimonio público y los de tráfico ilícito de drogas.", "a": true, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, si el funcionario participó en un delito de la ley en perjuicio de una alcaldía, la pena se aplica:", "o": ["En su límite máximo", "Aumentada en un tercio", "En su término medio", "Aumentada en la mitad"], "a": 0, "e": "Art. 33: órgano nacional, estadal o municipal."}, {"t": "mc", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen para oponerse:", "o": ["Treinta días", "Cinco días", "Ocho días", "Quince días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional contra estos grupos se basa, entre otros lineamientos, en:", "o": ["Privarlos del producto de sus actividades", "Dejar la persecución al Estado de origen", "Unificar los códigos penales de la región", "Sustituir la jurisdicción nacional afectada"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Según la LOCDOFT, a un funcionario condenado por participar en un delito de la ley se le aplica como pena accesoria la destitución y queda impedido de ejercer funciones públicas:", "o": ["De uno a quince años tras cumplir la pena", "De uno a quince años desde la sentencia", "Por el tiempo que dure la condena", "De manera perpetua y definitiva"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la LOCDOFT, en juicio se requiere la comparecencia del agente encubierto que aportó la evidencia. Esa comparecencia la asume:", "o": ["El responsable del Ministerio Público que coordinó", "El propio agente, con rostro cubierto", "El superior policial que dirigió al agente infiltrado", "El juez de control que autorizó"], "a": 0, "e": "Art. 71."}, {"t": "vf", "q": "Según la LOCDOFT, un ejecutivo de alto nivel de una corporación propiedad de un gobierno extranjero puede ser persona expuesta políticamente.", "a": true, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, una operación es inusual, y no aún sospechosa, cuando:", "o": ["Escapa de la normalidad para el cliente o mercado", "Tras analizarla hace presumir fondos ilícitos", "Ya fue reportada a la unidad de inteligencia", "El Ministerio Público abrió una investigación"], "a": 0, "e": "Art. 4, numerales 2 y 16."}, {"t": "mc", "q": "Según la LOCDOFT, la producción de material pornográfico con niños, por un grupo criminal, tiene pena de veinte a veinticinco años, mientras que explotar esa industria con ellos o para ellos tiene:", "o": ["Veinticinco a treinta años", "Diez a quince años", "Quince a veinte años", "La misma pena de veinte a veinticinco"], "a": 0, "e": "Arts. 46 y 49."}, {"t": "mc", "q": "Según la LOCDOFT, si quien revela la identidad del agente encubierto es un funcionario público, la pena es de:", "o": ["Quince a veinte años, más inhabilitación", "Seis a ocho años, más inhabilitación", "Quince a veinte años, sin accesorias", "Ocho a doce años, más destitución"], "a": 0, "e": "Art. 72: inhabilitación por quince años tras cumplir la pena."}, {"t": "mc", "q": "Según la LOCDOFT, la solicitud del Ministerio Público para interceptar o grabar comunicaciones debe ser:", "o": ["Razonada y previa a la autorización", "Verbal, con confirmación posterior", "Reservada y sin motivación escrita", "Conjunta con el órgano rector"], "a": 0, "e": "Art. 65."}, {"t": "vf", "q": "Según la LOCDOFT, un hecho con pena inferior a cinco años puede ser delito grave si afecta intereses colectivos o difusos.", "a": true, "e": "Art. 4, numeral 10."}, {"t": "mc", "q": "Según la LOCDOFT, la actividad sospechosa se diferencia de la inusual en que la primera supone:", "o": ["Un análisis que hace presumir fondos ilícitos", "Un monto superior a USD 10.000 en una operación", "Una orden judicial previa de examen", "La condena de alguno de los clientes"], "a": 0, "e": "Art. 4, numeral 2."}]}, {"titulo": "Normativa prudencial · modelo 2", "q": [{"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, dos socios sin persona jurídica de por medio se conciertan de modo estable para traficar armas. Sobre la noción legal de delincuencia organizada:", "o": ["No alcanzan el mínimo de tres personas", "Bastan dos si hay un beneficio económico", "Se cumple con cualquier concierto estable", "Se requiere un mínimo de cinco integrantes"], "a": 0, "e": "Art. 4, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, la ley anterior contra la delincuencia organizada, según la cita de su disposición derogatoria, aparece publicada en:", "o": ["G.O. 5.789 Extraordinario, 26-10-2005", "G.O. 39.912, del 30-04-2012", "G.O. 38.281 Ordinario, del 27-09-2005", "G.O. 41.522, del 12-11-2018"], "a": 0, "e": "Disposición derogatoria única."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la LOCDOFT, en la trata de personas cometida por un grupo criminal contra un adulto que aceptó el traslado, el consentimiento de la víctima:", "o": ["No excluye el delito", "Excluye la responsabilidad penal", "Atenúa la pena a la mitad", "Convierte el hecho en tráfico ilegal"], "a": 0, "e": "Arts. 41 y 42."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, quien sin ser policía usa un uniforme policial simulado para cometer un delito de la ley:", "o": ["Incurre en la agravante de la condición simulada", "No agrava porque no es funcionario público", "Solo responde por usurpación de funciones", "Solo agrava si el uniforme es auténtico"], "a": 0, "e": "Art. 29, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, las medidas sobre bienes vinculados a delitos de esta ley relacionados con drogas se rigen por:", "o": ["La Ley Orgánica de Drogas", "El Código Penal", "La ley de bienes del sector público", "El Código de Procedimiento Civil"], "a": 0, "e": "Disposición final primera."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "vf", "q": "Según la LOCDOFT, financiar a una organización terrorista que opera únicamente en el extranjero también es punible.", "a": true, "e": "Art. 53, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre terrorista individual y organización terrorista está en que esta última requiere:", "o": ["Tres o más personas con propósito común", "Dos o más personas con propósito común", "Actuar en más de un país", "Una estructura registrada o reconocida"], "a": 0, "e": "Art. 4, numerales 17 y 22."}, {"t": "vf", "q": "Según la LOCDOFT, al fijar la sanción de una persona jurídica, el juez considera las consecuencias para la empresa y la necesidad de prevenir nuevos hechos punibles.", "a": true, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, un imputado alega que pasaron veinte años desde una legitimación de capitales. La acción penal:", "o": ["No prescribe", "Prescribió a los quince años", "Prescribe al doble de la pena máxima", "Prescribe solo si no hubo imputación"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, un abogado en libre ejercicio es sujeto obligado cuando:", "o": ["Realiza transacciones para un cliente en actividades listadas", "Representa a un cliente ante un tribunal en un juicio penal", "Ejerce la profesión en cualquier especialidad", "Está inscrito en el Colegio de Abogados"], "a": 0, "e": "Art. 9, numeral 9."}, {"t": "vf", "q": "Según la LOCDOFT, haber sido juzgado en el extranjero, sin cumplir la condena impuesta, no impide por sí solo la aplicación de la jurisdicción extraterritorial.", "a": true, "e": "Art. 73: exige juzgamiento y cumplimiento."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una finalidad que haga lícita la operación encubierta:", "o": ["Recaudar tributos de bienes del grupo", "Identificar a autores y partícipes", "Efectuar incautaciones e inmovilizaciones", "Evitar la comisión de los delitos"], "a": 0, "e": "Art. 69."}, {"t": "mc", "q": "Según la LOCDOFT, coordinar con órganos nacionales e internacionales las operaciones de prevención y represión corresponde, sin perjuicio de otras competencias, a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Fuerza Armada"], "a": 0, "e": "Art. 6, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, la trata de una víctima adulta se castiga con prisión de veinte a veinticinco años y, además, con:", "o": ["La indemnización de gastos de recuperación", "Una multa fija de 3.000 unidades tributarias", "La confiscación de todos los bienes del autor", "La expulsión del territorio si es extranjero"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, un delito con pena máxima de cuatro años y seis meses que no afecta intereses colectivos ni difusos:", "o": ["No es delito grave para esta ley", "Es grave porque supera los cuatro años", "Es grave si lo comete un funcionario", "Es grave si media un beneficio económico"], "a": 0, "e": "Art. 4, numeral 10: más de cinco años. El umbral de cuatro años es de Palermo."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, según la disposición transitoria de la ley, dependía antes de su adecuación de:", "o": ["La Superintendencia del Sector Bancario", "El Ministerio de Relaciones Interiores", "El Banco Central de Venezuela", "La Fiscalía General de la República"], "a": 0, "e": "Disposición transitoria quinta."}, {"t": "mc", "q": "Según la LOCDOFT, mientras no se cree el servicio especializado, los bienes incautados quedan a la orden de:", "o": ["El órgano rector", "El tribunal de control", "El Ministerio Público", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, el tráfico de órganos y el sicariato tienen el mismo rango de pena.", "a": true, "e": "Arts. 43 y 44: veinticinco a treinta años."}, {"t": "mc", "q": "Según la LOCDOFT, la multa a la persona jurídica en caso de legitimación equivale a:", "o": ["El valor de los capitales, bienes o haberes", "El doble del valor del incremento ilícito", "De 3.000 a 5.000 unidades tributarias", "Un porcentaje del capital social suscrito"], "a": 0, "e": "Art. 32, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales NO figura:", "o": ["El SENIAT", "El CICPC", "La Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26."}, {"t": "vf", "q": "Según la LOCDOFT, utilizar a un adulto mayor o a una persona en situación de calle para cometer los delitos es una circunstancia agravante.", "a": true, "e": "Art. 29, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa estatal es usada por sus directivos para legitimar capitales. La responsabilidad penal de la persona jurídica prevista en la ley:", "o": ["No alcanza a la empresa del Estado", "Alcanza a la empresa como a las privadas", "Se traslada al órgano de adscripción", "Solo opera con clausura definitiva"], "a": 0, "e": "Art. 31. Los directivos sí responden individualmente."}, {"t": "mc", "q": "Según la LOCDOFT, no es posible la comparecencia en el Estado requirente de una persona. La ley prevé como alternativa:", "o": ["La videoconferencia", "La declaración jurada escrita", "La detención con fines de traslado", "La sustitución por un testigo referencial"], "a": 0, "e": "Art. 79."}, {"t": "mc", "q": "Según la LOCDOFT, en el abandono legal, el lapso para reclamar luego del cartel es de treinta días contados desde:", "o": ["La consignación del cartel", "La publicación de la sentencia", "La orden del tribunal de control", "La incautación del bien"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, el principio de jurisdicción extraterritorial no se aplica si la persona:", "o": ["Fue juzgada en otro país y cumplió la condena", "Fue investigada antes en otro país", "Fue absuelta por falta de pruebas en primera instancia", "Reside legalmente en otro país"], "a": 0, "e": "Art. 73, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, las unidades de investigación financiera creadas en los órganos policiales funcionan bajo la coordinación de:", "o": ["El Ministerio Público", "La UNIF", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 78."}, {"t": "mc", "q": "Según la LOCDOFT, la decisión dictada tras la audiencia oral de decomiso:", "o": ["Es apelable dentro de cinco días", "Es apelable dentro de treinta días", "No admite recurso alguno", "Solo admite recurso de casación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, el dinero de la venta anticipada de bienes perecederos incautados:", "o": ["Se resguarda hasta la sentencia firme", "Se reparte entre los órganos actuantes", "Ingresa de inmediato al Tesoro Nacional", "Se entrega al imputado en caución"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, si se devuelve el bien en el procedimiento por abandono, los gastos de conservación corren por cuenta de:", "o": ["Su titular", "El órgano rector", "El Ministerio Público", "El servicio especializado"], "a": 0, "e": "Art. 60, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal solicita un agente encubierto, aunque el caso puede esclarecerse fácilmente con registros bancarios ya disponibles. El juez debería:", "o": ["Negarla por no cumplirse los supuestos legales", "Otorgarla, por tratarse de delito grave", "Otorgarla, pues basta la sospecha fundada", "Remitirla a la policía para que decida"], "a": 0, "e": "Art. 68: imposible o sumamente difícil, u otras medidas inútiles."}, {"t": "mc", "q": "Según la LOCDOFT, se absuelve al imputado por sentencia firme. Los bienes incautados:", "o": ["Se restituyen a sus legítimos propietarios", "Quedan con el órgano rector un año", "Se confiscan si había indicios fundados", "Se decomisan de pleno derecho"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, se incautó un vehículo hace un año y no se ha podido establecer quién es su titular. El fiscal debe:", "o": ["Solicitar su decomiso al tribunal de control", "Solicitar su confiscación en la acusación", "Rematarlo directamente con el órgano rector", "Esperar diez años desde la incautación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, el decomiso se distingue de la confiscación porque recae sobre bienes:", "o": ["Abandonados o no reclamados", "Del condenado por sentencia firme", "Afectados por medida temporal", "Adquiridos antes del delito"], "a": 0, "e": "Art. 4, numerales 7 y 8."}, {"t": "mc", "q": "Según la LOCDOFT, quien integra un grupo de delincuencia organizada, aunque no se le pruebe otro delito, responde:", "o": ["Por asociación, de seis a diez años", "Solo si el grupo consumó algún delito", "Por asociación, de ocho a doce años", "Únicamente con pena accesoria"], "a": 0, "e": "Art. 37: por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, es competente para autorizar la operación encubierta el juez de control:", "o": ["De donde el fiscal inició la investigación", "Del lugar donde actúe el agente encubierto", "Del domicilio del investigado", "Designado por el órgano rector"], "a": 0, "e": "Art. 67."}, {"t": "mc", "q": "Según la LOCDOFT, el agente de operaciones encubiertas se define como un funcionario que:", "o": ["Asume una identidad diferente para infiltrarse", "Vigila desde el exterior sin contacto", "Colabora a cambio de reducción de pena", "Audita en secreto a los sujetos obligados"], "a": 0, "e": "Art. 4, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo que debe transcurrir desde la incautación para solicitar el decomiso por titular desconocido es de:", "o": ["Un año", "Seis meses", "Treinta días", "Dos años"], "a": 0, "e": "Art. 58. Los seis meses son del abandono tras absolución, art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, presentar informes fundados al Ministerio Público cuando haya indicios de un hecho punible corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de la ONCDOFT", "Sentencia de control"], "a": 0, "e": "Art. 9, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal quiere interceptar correos electrónicos de un investigado. Requiere:", "o": ["Autorización del juez de control", "Solo orden motivada del fiscal", "Autorización previa de la ONCDOFT", "Solicitud de la UNIF al operador"], "a": 0, "e": "Art. 64, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, quien, sin pertenecer al grupo criminal, figura como propietario de bienes relacionados con los delitos es:", "o": ["Interpuesta persona", "Íntimo asociado", "Integrante de grupo estructurado", "Tercero de buena fe"], "a": 0, "e": "Art. 4, numeral 13. El íntimo asociado se refiere a las PEP."}, {"t": "mc", "q": "Según la LOCDOFT, el servicio especializado de administración de bienes depende de:", "o": ["El órgano rector", "El Ministerio Público", "La UNIF", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 54."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}]}, {"titulo": "Normativa prudencial · modelo 3", "q": [{"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa telefónica se niega a facilitar sus equipos para una interceptación judicialmente autorizada, alegando ser privada. La ley dispone que:", "o": ["Está obligada a permitir su uso", "Solo debe entregar datos históricos", "Puede negarse sin orden del TSJ", "Basta que entregue un informe técnico"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela puede autorizar el decomiso o la confiscación del producto de los delitos o de:", "o": ["Bienes de valor equivalente al producto", "Solo el bien exacto obtenido del delito", "Todo el patrimonio familiar del imputado", "Solo los bienes situados en el exterior"], "a": 0, "e": "Art. 86, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, una estafa del Código Penal ejecutada por un grupo de delincuencia organizada:", "o": ["Se considera delito de delincuencia organizada", "Sigue siendo solo delito común sin agravación", "Queda absorbida por el delito de asociación", "Solo se castiga con la pena de asociación"], "a": 0, "e": "Art. 27, con el aumento del art. 28."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, intercambiar información con entidades homólogas extranjeras y suscribir memorandos para ello corresponde a:", "o": ["La UNIF", "El órgano de control", "El Ministerio Público", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos derivados del producto del delito:", "o": ["Están sujetos a las mismas medidas", "Pertenecen al tercero que los generó", "Están exentos si provienen de inversión lícita", "Solo se afectan por sentencia extranjera"], "a": 0, "e": "Art. 89, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, para el delito de tráfico de recursos estratégicos, estos son:", "o": ["Los insumos básicos de los procesos productivos", "Solo los hidrocarburos y sus derivados refinados", "Los bienes que declare el órgano rector", "Las divisas y los títulos al portador"], "a": 0, "e": "Art. 34, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, si la víctima de trata es un adolescente, la pena es de:", "o": ["Veinticinco a treinta años", "Veinte a veinticinco años", "Quince a veinticinco años", "Ocho a doce años"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones a las personas jurídicas se imponen:", "o": ["Por el juez en la sentencia definitiva", "Por el órgano de control en acto motivado", "Por el Ministerio Público en la acusación", "Por el juez de control en la audiencia preliminar"], "a": 0, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, los recursos obtenidos de la administración de bienes asegurados, luego de resarcir sus costos, se mantienen en:", "o": ["Un fondo especial para quien acredite derecho", "La cuenta única del Tesoro Nacional de la República", "El presupuesto del Ministerio Público", "Un fideicomiso del órgano de control"], "a": 0, "e": "Art. 62."}, {"t": "mc", "q": "Según la LOCDOFT, cuando un delito del Código Penal es cometido por un grupo de delincuencia organizada, la sanción:", "o": ["Se incrementa en la mitad de la pena aplicable", "Se incrementa en un tercio de la pena aplicable", "Se duplica sin excepción alguna", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28. El tercio corresponde a una agravante del art. 29."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios especiales responden frente al Estado y a terceros agraviados:", "o": ["Administrativa, civil y penalmente", "Solo civilmente por daños probados", "Solo administrativamente ante el rector", "Solo penalmente en caso de dolo"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, un depositario especial de bienes incautados lo designa:", "o": ["El órgano rector", "El juez de control", "El fiscal del Ministerio Público", "El propietario de los bienes"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia perturbaría una investigación en curso en Venezuela. Venezuela puede:", "o": ["Diferirla y consultar con el Estado requirente", "Denegarla sin expresar motivo alguno al Estado", "Cumplirla siempre con prioridad", "Archivarla de manera definitiva"], "a": 0, "e": "Art. 82."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF depende jerárquicamente, conforme al texto de la ley, del ministerio de:", "o": ["Planificación y finanzas", "Relaciones interiores y justicia", "Relaciones exteriores", "Economía productiva"], "a": 0, "e": "Art. 24. La ONCDOFT depende del de relaciones interiores y justicia."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización de una operación encubierta exige que el delito se haya cometido o que exista:", "o": ["Sospecha fundada de un comienzo de ejecución", "Un reporte previo de actividad sospechosa", "Sentencia firme contra algún integrante", "Denuncia formal de una persona agraviada"], "a": 0, "e": "Art. 68."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una causal legal para denegar la asistencia judicial recíproca:", "o": ["Que la solicitud involucre el secreto bancario", "Que menoscabe la soberanía o el orden público", "Que no se ajuste a los requisitos legales", "Que sea contraria al ordenamiento interno"], "a": 0, "e": "Arts. 81 y 87."}, {"t": "mc", "q": "Según la LOCDOFT, la confiscación se define en la ley como:", "o": ["Pena accesoria con privación definitiva", "Medida cautelar temporal sobre bienes", "Privación de bienes abandonados", "Custodia provisional por el órgano rector"], "a": 0, "e": "Art. 4, numeral 7."}, {"t": "mc", "q": "Según la LOCDOFT, alguien recauda fondos para una organización terrorista, pero el atentado nunca ocurre y el dinero no se usa. Responde:", "o": ["Por financiamiento, de quince a veinticinco años", "Solo por tentativa de financiamiento", "Por nada, al no consumarse el acto terrorista", "Por asociación, de seis a diez años"], "a": 0, "e": "Art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, para ejecutar una solicitud extranjera de decomiso se requiere:", "o": ["La doble incriminación", "Una sentencia del TSJ", "La extradición previa", "El aval del GAFI"], "a": 0, "e": "Art. 88."}, {"t": "mc", "q": "Según la LOCDOFT, pueden actuar como agentes encubiertos:", "o": ["Solo funcionarios de unidades especializadas", "Particulares colaboradores autorizados", "Funcionarios de cualquier órgano público", "Empleados de sujetos obligados designados"], "a": 0, "e": "Art. 70."}, {"t": "mc", "q": "Según la LOCDOFT, al solicitar asistencia a Venezuela debe indicarse, entre otros datos:", "o": ["La autoridad solicitante y el objeto de la investigación", "El presupuesto estimado del proceso en el Estado extranjero", "La opinión favorable de la Interpol", "La aprobación previa del órgano rector"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, se incautan alimentos perecederos. Para evitar su deterioro, el juez de control, previo inventario y oídos los terceros de buena fe:", "o": ["Puede autorizar su venta o uso con fines sociales", "Debe ordenar su destrucción inmediata y documentada", "Debe esperar la sentencia definitiva", "Los devuelve al imputado en custodia"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, brindar asistencia técnica en investigaciones y procesos judiciales de estos delitos es también una obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados no financieros", "Los colegios profesionales", "Las oficinas de cumplimiento"], "a": 0, "e": "Art. 8, numeral 14."}, {"t": "mc", "q": "Según la LOCDOFT, las pruebas de ADN sobre un investigado, como medida especial, se aplican:", "o": ["Por el Ministerio Público con autorización judicial", "Por orden directa de la policía de investigación", "Solo con el consentimiento del investigado", "Exclusivamente en la fase de juicio oral"], "a": 0, "e": "Art. 64, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, que la comisión del delito involucre el espacio geográfico de otro Estado:", "o": ["Es una circunstancia agravante", "Excluye la competencia venezolana", "Obliga a aplicar la ley extranjera", "Es irrelevante para fijar la pena"], "a": 0, "e": "Art. 29, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, financiar parcialmente a un terrorista individual, de modo que solo una parte de los fondos vaya a ese fin:", "o": ["Basta para configurar el delito", "Solo es punible por la parte probada", "Excluye el delito si el resto es lícito", "Requiere pertenecer a una organización"], "a": 0, "e": "Art. 53: en su totalidad o en parte."}, {"t": "mc", "q": "Según la LOCDOFT, un extranjero comete en el exterior un delito de la ley que atenta contra los intereses patrimoniales de la República. Sobre su enjuiciamiento:", "o": ["Queda sujeto a esta ley venezolana", "Solo procede si es detenido en Venezuela", "Solo procede si su país lo autoriza", "Corresponde solo al Estado del hecho"], "a": 0, "e": "Art. 73, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión de quien posee bienes a sabiendas de su origen ilícito se acompaña de una multa equivalente:", "o": ["Al valor del incremento patrimonial ilícito", "Al doble del valor de los bienes poseídos", "A entre 1.000 y 3.000 unidades tributarias", "Al salario de los años de condena impuestos"], "a": 0, "e": "Art. 35. Las multas en U.T. son administrativas."}, {"t": "mc", "q": "Según la LOCDOFT, para que un acto sea terrorista, además del medio empleado debe perseguir, entre otros fines:", "o": ["Intimidar gravemente a una población", "Obtener un beneficio económico directo", "Afectar a más de un Estado a la vez", "Controlar un territorio determinado"], "a": 0, "e": "Art. 4, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el titular no reclama sus bienes. El fiscal solicita el decomiso por abandono después de:", "o": ["Seis meses de finalizado el proceso", "Un año de finalizado el proceso", "Treinta días de finalizado el proceso", "Cinco años de finalizado el proceso"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "vf", "q": "Según la LOCDOFT, los bienes que el juez confisca tras una condena firme por un delito de la ley se destinan a planes y programas de prevención y represión.", "a": true, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, los familiares cercanos de una persona expuesta políticamente incluyen, según la ley:", "o": ["Padres, hermanos, cónyuges, hijos y parientes políticos", "Solo hijos y cónyuges de la persona expuesta", "Solo quienes habiten con la persona expuesta", "Parientes hasta el sexto grado de consanguinidad o afinidad"], "a": 0, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, se encuentra en Venezuela un investigado por un delito de la ley cometido en parte en alta mar. Esa persona:", "o": ["Está sujeta rídica"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, se dicta sentencia condenatoria firme por un delito de la ley. Los bienes incautados preventivamente:", "o": ["Se confiscan y destinan a planes de prevención y represión", "Se devuelven al condenado hasta que otro proceso los afecte", "Se decomisan como bienes abandonados", "Pasan al patrimonio del Ministerio Público"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, si en un delito de la ley concurre una sola agravante de las previstas, la pena aplicable:", "o": ["Aumenta en un tercio", "Aumenta en la mitad", "Aumenta en una cuarta parte", "Se fija en su límite máximo"], "a": 0, "e": "Art. 29, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la asistencia judicial recíproca solicitada a Venezuela se presta conforme a los tratados y, en ausencia de ellos:", "o": ["Sobre la base del principio de reciprocidad", "Solo si el TSJ la autoriza expresamente", "Solo con las Recomendaciones del GAFI", "No se presta en ningún supuesto"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la LOCDOFT, vencido sin resultados el plazo de una operación encubierta, el juez, vistos los alegatos del funcionario responsable:", "o": ["Concederá prórroga", "Debe ordenar el cierre definitivo", "Debe remitir a la Corte de Apelaciones", "Puede autorizar solo una nueva operación"], "a": 0, "e": "Art. 67, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, el deber de reportar cede si los fondos provienen de una fuente lícita, aunque se sospeche que serán usados para financiar terrorismo.", "a": false, "e": "Art. 13: incluye actividades de fuente lícita."}, {"t": "mc", "q": "Según la LOCDOFT, la entrega vigilada de remesas ilícitas la solicita el Ministerio Público mediante:", "o": ["Acta razonada ante el juez de control", "Oficio dirigido al órgano rector", "Memorándum a la unidad policial", "Escrito ante la Corte de Apelaciones"], "a": 0, "e": "Art. 66."}]}]}, {"titulo": "Convenios internacionales: Viena, Palermo, Mérida y otros", "exams": [{"titulo": "Convenios internacionales · modelo 1", "q": [{"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Solo penalización y extradición", "Solo medidas preventivas del sector público", "Solo la cooperación entre las unidades de inteligencia financiera"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo (2002) se adoptó en el marco de:", "o": ["La OEA, en Bridgetown, Barbados", "La ONU, en Nueva York", "La OEA, en Caracas", "La ONU, en Viena"], "a": 0, "e": "Instrumento regional contra el terrorismo y su financiamiento."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, es decir, quien ofrece y quien acepta", "Solo activa, de quien ofrece el beneficio", "Solo pasiva, es decir, de quien recibe el beneficio", "Solo cuando el funcionario es extranjero"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "El grupo delictivo organizado que define Palermo requiere un número mínimo de:", "o": ["Tres personas", "Dos personas", "Cinco personas", "Cuatro personas"], "a": 0, "e": "Tres o más, actuando concertadamente."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se adoptó en:", "o": ["2003", "1996", "2000", "2005"], "a": 0, "e": "Aprobada por la Asamblea General en 2003."}, {"t": "mc", "q": "El protocolo de Palermo sobre trata de personas se conoc ional y sus protocolos", "La corrupción y la recuperación de activos", "El terrorismo y su financiamiento"], "a": 0, "e": "Es el origen del régimen internacional contra el lavado de activos."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "El Convenio de 1999 pide a los Estados medidas para que las instituciones financieras:", "o": ["Identifiquen clientes y reporten sospechas", "Cierren cuentas de todas las ONG", "Reduzcan montos máximos de transferencia", "Eviten operar con efectivo"], "a": 0, "e": "Art. 18: medidas preventivas de identificación y reporte."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "El nombre completo del instrumento conocido como Convención de Viena de 1988 alude a:", "o": ["El tráfico ilícito de estupefacientes y sustancias sicotrópicas", "La delincuencia organizada de carácter transnacional y sus formas", "La corrupción de funcionarios públicos", "El derecho de los tratados entre Estados"], "a": 0, "e": "Cuidado: hay otras convenciones firmadas en Viena sobre materias distintas."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "mc", "q": "Comparando Palermo con la LOCDOFT en el concepto de delito grave:", "o": ["Palermo usa cuatro años y la ley venezolana más de cinco", "Ambas usan exactamente cuatro años de pena", "Palermo usa cinco años y la ley venezolana cuatro años", "La ley venezolana no define el concepto"], "a": 0, "e": "Es una de las trampas más repetidas."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana contra la Corrupción es conocido como:", "o": ["MESICIC", "GAFIC", "CICAD", "MONEYVAL"], "a": 0, "e": "Mecanismo de Seguimiento de la Implementación de la Convención Interamericana contra la Corrupción."}, {"t": "vf", "q": "La Convención de Mérida pide a los Estados considerar el establecimiento de sistemas de declaración patrimonial de los funcionarios públicos.", "a": true, "e": "Artículo 52 y concordantes del capítulo preventivo."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Cuando un Estado ratifica un tratado de esta materia, debe:", "o": ["Adecuar su legislación interna para poder cumplirlo", "Aplicarlo solo si su constitución repite su contenido", "Esperar la autorización del GAFI", "Someterlo a referendo cada diez años"], "a": 0, "e": "Obligación de adecuación normativa."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "¿Qué instrumento universal aborda de forma específica la recuperación y restitución de activos producto de corrupción?", "o": ["La Convención de Mérida", "La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo"], "a": 0, "e": "Capítulo V de Mérida."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción fue adoptada en 1996 en:", "o": ["Caracas, en el marco de la OEA", "Mérida, México, en el marco de la ONU", "Palermo, Italia, en el marco de la ONU", "Washington, en el marco de la OEA"], "a": 0, "e": "Instrumento regional pionero; no confundir con la de Mérida."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "Del siguiente grupo, el instrumento que NO pertenece al sistema universal de la ONU es:", "o": ["La Convención Interamericana contra la Corrupción", "La Convención de Palermo", "La Convención de Mérida", "El Convenio para la Represión de la Financiación del Terrorismo"], "a": 0, "e": "La Interamericana es de la OEA."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "La función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso stá previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "La Convención de Estrasburgo de 1990, en el ámbito europeo, trata de:", "o": ["Blanqueo, investigación, incautación y decomiso del producto del delito", "Protección de los derechos humanos", "Cooperación aduanera entre Estados", "Reconocimiento y ejecución de sentencias civiles extranjeras"], "a": 0, "e": "Instrumento regional europeo sobre decomiso."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "El artículo 18 de Palermo regula:", "o": ["La asistencia judicial recíproca más amplia posible", "El traslado de personas condenadas entre Estados", "La creación de equipos conjuntos", "La protección de las víctimas"], "a": 0, "e": "Es uno de los artículos más extensos del tratado."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "El artículo 16 de Palermo se refiere a:", "o": ["La extradición entre los Estados parte", "La asistencia judicial recíproca", "La protección de los testigos", "Las técnicas especiales de investigación"], "a": 0, "e": "El 18 regula la asistencia judicial recíproca."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "vf", "q": "La Convención de Viena de 1988 dispone que el secreto bancario no debe ser obstáculo para la asistencia judicial en materia de decomiso.", "a": true, "e": "Viena y los tratados posteriores desalientan invocar el secreto bancario frente a investigaciones penales."}, {"t": "mc", "q": "Palermo prevé los equipos conjuntos de investigación para:", "o": ["Permitir que autoridades de varios Estados trabajen juntas", "Sustituir a los tribunales nacionales", "Crear una policía internacional permanente", "Juzgar los hechos en el territorio de un tercer Estado"], "a": 0, "e": "Herramienta de cooperación operativa."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "vf", "q": "Según el Convenio de 1999, no es necesario que los fondos se hayan utilizado efectivamente para que exista delito.", "a": true, "e": "La consumación es anticipada."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "Palermo contempla la responsabilidad de las personas jurídicas por participación en delitos graves en que intervenga un grupo delictivo organizado. Esto significa que:", "o": ["La empresa responde sin condena de una persona", "Solo los directivos responden penalmente", "La empresa queda exenta si no obtuvo lucro", "La responsabilidad es solo moral"], "a": 0, "e": "Art. 10 de Palermo: responsabilidad penal, civil o administrativa, sin perjuicio de la de las personas naturales."}, {"t": "mc", "q": "Palermo se complementa con un número de protocolos igual a:", "o": ["Tres", "Dos", "Cuatro", "Uno"], "a": 0, "e": "Trata de personas, tráfico de migrantes y armas de fuego."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}]}]}, {"titulo": "Enfoque basado en riesgo", "exams": [{"titulo": "Enfoque basado en riesgo · modelo 1", "q": [{"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "vf", "q": "Compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Un corredor cuyo nivel de vida no guarda relación con sus comisiones debe:", "o": ["Ser objeto de análisis por el área de cumplimiento", "Ser premiado por su desempeño comercial", "Ser cambiado de zona geográfica", "Ser ignorado por tratarse de su vida privada"], "a": 0, "e": "Riesgo interno previsto en la norma."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Una señal de que la cultura de cumplimiento es débil es que:", "o": ["Las excepciones al procedimiento se vuelvan rutina", "El manual se actualice todos los años", "La capacitación sea obligatoria para todo el personal", "La junta reciba informes trimestrales"], "a": 0, "e": "La excepción normalizada erosiona el control."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "mc", "q": "El riesgo interno o de personal se mitiga, entre otras medidas, con:", "o": ["Políticas de conocimiento del empleado y rotación", "Aumento general de los salarios", "Reducción de la plantilla operativa", "Eliminación de los controles duales para agilizar"], "a": 0, "e": "Conoce a tu empleado."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Al evaluar un canal de venta digital, un control compensatorio adecuado es:", "o": ["La verificación reforzada de identidad a distancia", "La reducción del horario de atención", "El aumento del precio del producto", "La limitación de la venta a clientes de la capital"], "a": 0, "e": "Mitigar la ausencia de contacto presencial."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "La evaluación del riesgo de un producto debe incluir, entre otros aspectos:", "o": ["Su liquidez, su forma de pago y su canal de venta", "Su rentabilidad esperada y su cuota de mercado", "El número de competidores que lo ofrecen", "La antigüedad del ramo en la empresa"], "a": 0, "e": "Características que lo hacen atractivo para el delito."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "El riesgo reputacional derivado de un caso de lavado consiste en:", "o": ["La pérdida de confianza de clientes y contrapartes", "El costo de la multa impuesta", "La pérdida de la provisión contable constituida", "El aumento de la morosidad"], "a": 0, "e": "Es distinto del riesgo legal y del financiero."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "mc", "q": "El riesgo asociado a la contratación totalmente digital se mitiga con:", "o": ["Verificación de identidad reforzada y biometría", "Reducción del monto máximo asegurable", "Eliminación del expediente del cliente", "Traslado de la responsabilidad al cliente"], "a": 0, "e": "Medidas compensatorias para la no presencialidad."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "El riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "mc", "q": "El expediente de una alerta descartada debe conservarse porque:", "o": ["Puede ser revisado por el supervisor o la autoridad", "Sirve para calcular las comisiones del área comercial", "Permite renegociar la tarifa del cliente", "Es exigido por la ley tributaria"], "a": 0, "e": "La decisión debe poder auditarse."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su contrato se anula automáticamente", "Su tarifa debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "La «cultura de cumplimiento» en una organización se evidencia principalmente por:", "o": ["El ejemplo de la alta dirección", "El número de manuales de la empresa", "El tamaño del departamento de cumplimiento", "La decoración de las oficinas de la empresa"], "a": 0, "e": "Es práctica, no papel."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "mc", "q": "El presupuesto específico para cumplimiento que aprueba la junta busca:", "o": ["Que el sistema cuente con medios reales", "Reduci
