istro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "vf", "q": "El financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "¿Qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "mc", "q": "Según el GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "vf", "q": "Según el GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según el GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "vf", "q": "Según el GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "mc", "q": "¿Por qué una inmobiliaria es relevante en el riesgo de lavado?", "o": ["Permite colocar e integrar grandes sumas como lícitas", "Porque sus operaciones quedan fuera de todo registro público", "Porque sus clientes suelen ser personas no residentes", "Porque el valor de los inmuebles lo fija la autoridad"], "a": 0, "e": "Sector clásico de integración."}, {"t": "mc", "q": "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según el GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Según el GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "Según el GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "mc", "q": "Según el GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "Según el GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "vf", "q": "Según el GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Según el GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "vf", "q": "Según el GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "mc", "q": "La evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "vf", "q": "Según el GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según el GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un ROS", "Aceptarlo con monitoreo posterior durante un año", "Aceptarlo si el pago se realiza por transferencia", "Aceptarlo y exigir una garantía por el monto asegurado"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "El «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de servicios"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "Un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Son nuevas y aún no están reguladas por ley", "Son costosas para las instituciones financieras", "Son ilegales en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "En una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según el GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "mc", "q": "Las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "Según el GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "vf", "q": "Según el GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Según el GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según el GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Según el GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "vf", "q": "Según el GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "El cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "mc", "q": "Según el GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según el GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "vf", "q": "Según el GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "vf", "q": "Las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según el GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "vf", "q": "Según la LOCDOFT, el fiscal puede bloquear por sí mismo las cuentas bancarias de los integrantes del grupo investigado.", "a": false, "e": "Art. 56: debe solicitar autorización al juez de control. Trampa: se elimina el control judicial."}, {"t": "vf", "q": "Según la LOCDOFT, la identidad falsa autorizada al agente encubierto permite alterar registros y libros públicos para mantenerla.", "a": false, "e": "Art. 70: excluye alterar registros, libros públicos o archivos. Trampa: se invierte la prohibición."}, {"t": "mc", "q": "Según la LOCDOFT, un Estado recibió pruebas de Venezuela para un caso y quiere usarlas en otro distinto. Requiere:", "o": ["El previo consentimiento del Estado venezolano", "Solo informar después a Venezuela", "La autorización de su propio juez", "Nada, si el delito es de la misma especie"], "a": 0, "e": "Art. 80, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal quiere interceptar correos electrónicos de un investigado. Requiere:", "o": ["Autorización del juez de control", "Solo orden motivada del fiscal", "Autorización previa de la ONCDOFT", "Solicitud de la UNIF al operador"], "a": 0, "e": "Art. 64, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, conservar equipos exclusivamente destinados a fabricar moneda, como parte de un grupo criminal, se pena con:", "o": ["Doce a dieciocho años, aunque no se fabrique", "Doce a dieciocho años, solo si se fabricó", "Ocho a doce años, aunque no se fabrique", "Seis a diez años, solo si se distribuye"], "a": 0, "e": "Art. 51: basta fabricar, custodiar, ocultar o conservar los instrumentos."}, {"t": "vf", "q": "Según la LOCDOFT, cuando se requiere la comparecencia del agente encubierto, la asume el fiscal que coordinó las acciones.", "a": true, "e": "Art. 71. Trampa: se cree que el agente debe declarar en persona."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para jueces y fiscales en estos delitos corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Colegio de Abogados"], "a": 0, "e": "Art. 6, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF depende jerárquicamente, conforme al texto de la ley, del ministerio de:", "o": ["Planificación y finanzas", "Relaciones interiores y justicia", "Relaciones exteriores", "Economía productiva"], "a": 0, "e": "Art. 24. La ONCDOFT depende del de relaciones interiores y justicia."}, {"t": "mc", "q": "Según la LOCDOFT, una estafa del Código Penal ejecutada por un grupo de delincuencia organizada:", "o": ["Se considera delito de delincuencia organizada", "Sigue siendo solo delito común sin agravación", "Queda absorbida por el delito de asociación", "Solo se castiga con la pena de asociación"], "a": 0, "e": "Art. 27, con el aumento del art. 28."}, {"t": "vf", "q": "Según la LOCDOFT, la Fuerza Armada Nacional Bolivariana figura entre las autoridades principales de policía de investigaciones penales en esta materia.", "a": true, "e": "Art. 26, numeral 2."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación, los empleados del sujeto obligado pueden suspender la relación con el cliente con autorización del fiscal.", "a": false, "e": "Art. 15: autorización previa de un juez o jueza competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión por financiamiento al terrorismo es de:", "o": ["Quince a veinticinco años", "Veinticinco a treinta años", "Diez a quince años", "Veinte a treinta años"], "a": 0, "e": "Art. 53. Trampa: veinticinco a treinta es la del acto terrorista (art. 52)."}, {"t": "mc", "q": "Según la LOCDOFT, en situación de urgencia, y si los Estados convienen, la solicitud de asistencia puede hacerse:", "o": ["Verbalmente, con confirmación lo antes posible", "Verbalmente, sin confirmación posterior", "Por escrito, solo en original legalizado", "Solo a través del tribunal de control"], "a": 0, "e": "Art. 80."}, {"t": "vf", "q": "Según la LOCDOFT, cualquier funcionario policial puede infiltrarse como agente encubierto con autorización del juez de control.", "a": false, "e": "Art. 70: solo los funcionarios de unidades especializadas. Trampa: se amplía el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, si la ejecución de una solicitud requiere gastos cuantiosos, los Estados:", "o": ["Se consultarán sobre términos y modo de pago", "Los dividen automáticamente por mitades", "Los trasladan siempre al Estado requirente", "Deben rechazar de plano la solicitud"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, amenazar a un testigo con un daño grave a su familia, para favorecer a un grupo criminal, se ubica en el tramo de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Diez a quince años"], "a": 0, "e": "Art. 45, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, un viajero entra al país con exactamente USD 10.000 en efectivo. Respecto del deber de declarar dispuesto en la ley:", "o": ["No se activa, porque debe excederse esa cifra", "Se activa desde USD 10.000, esa cifra inclusive", "Se activa solo para extranjeros", "Se activa solo al salir del territorio"], "a": 0, "e": "Art. 22: cuyo monto exceda."}, {"t": "mc", "q": "Según la LOCDOFT, las pruebas de ADN sobre un investigado, como medida especial, se aplican:", "o": ["Por el Ministerio Público con autorización judicial", "Por orden directa de la policía de investigación", "Solo con el consentimiento del investigado", "Exclusivamente en la fase de juicio oral"], "a": 0, "e": "Art. 64, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, revelar quiénes son los familiares de un agente encubierto también es punible.", "a": true, "e": "Art. 72."}, {"t": "mc", "q": "Según la LOCDOFT, se dicta sentencia condenatoria firme por un delito de la ley. Los bienes incautados preventivamente:", "o": ["Se confiscan y destinan a planes de prevención y represión", "Se devuelven al condenado hasta que otro proceso los afecte", "Se decomisan como bienes abandonados", "Pasan al patrimonio del Ministerio Público"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, al fijar la sanción de una persona jurídica, el juez considera las consecuencias para la empresa y la necesidad de prevenir nuevos hechos punibles.", "a": true, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, el salvoconducto de un testigo que viaja a declarar cesa si, informado de que ya no se requiere su presencia, permanece voluntariamente durante:", "o": ["Quince días consecutivos o el período acordado", "Treinta días consecutivos o el período acordado", "Cinco días consecutivos sin excepción", "Ocho días hábiles sin excepción"], "a": 0, "e": "Art. 83."}, {"t": "mc", "q": "Según la LOCDOFT, una cajera omite por descuido los controles y con ello facilita, sin intención ni participación, una operación de legitimación. Responde:", "o": ["Por el delito culposo, de tres a seis años", "Como autora de legitimación, diez a quince", "Solo con multa a cargo del supervisor", "Como cómplice, con pena rebajada a la mitad"], "a": 0, "e": "Art. 36: imprudencia, impericia o negligencia."}, {"t": "mc", "q": "Según la LOCDOFT, al solicitar asistencia a Venezuela debe indicarse, entre otros datos:", "o": ["La autoridad solicitante y el objeto de la investigación", "El presupuesto estimado del proceso en el Estado extranjero", "La opinión favorable de la Interpol", "La aprobación previa del órgano rector"], "a": 0, "e": "Art. 80."}, {"t": "mc", "q": "Según la LOCDOFT, no es posible la comparecencia en el Estado requirente de una persona. La ley prevé como alternativa:", "o": ["La videoconferencia", "La declaración jurada escrita", "La detención con fines de traslado", "La sustitución por un testigo referencial"], "a": 0, "e": "Art. 79."}, {"t": "mc", "q": "Según la LOCDOFT, un fiscal solicita un agente encubierto, aunque el caso puede esclarecerse fácilmente con registros bancarios ya disponibles. El juez debería:", "o": ["Negarla por no cumplirse los supuestos legales", "Otorgarla, por tratarse de delito grave", "Otorgarla, pues basta la sospecha fundada", "Remitirla a la policía para que decida"], "a": 0, "e": "Art. 68: imposible o sumamente difícil, u otras medidas inútiles."}, {"t": "mc", "q": "Según la LOCDOFT, brindar asistencia técnica en investigaciones y procesos judiciales de estos delitos es también una obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados no financieros", "Los colegios profesionales", "Las oficinas de cumplimiento"], "a": 0, "e": "Art. 8, numeral 14."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, el fiscal solicita el decomiso cuando no se ha identificado al titular del bien incautado después de:", "o": ["Un año", "Seis meses", "Dos años", "Tres meses"], "a": 0, "e": "Art. 58. Trampa: se cambia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, la trata de una víctima adulta se castiga con prisión de veinte a veinticinco años y, además, con:", "o": ["La indemnización de gastos de recuperación", "Una multa fija de 3.000 unidades tributarias", "La confiscación de todos los bienes del autor", "La expulsión del territorio si es extranjero"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la LOCDOFT, mientras no se cree el servicio especializado, los bienes incautados quedan a la orden de:", "o": ["El órgano rector", "El tribunal de control", "El Ministerio Público", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización de una operación encubierta exige que el delito se haya cometido o que exista:", "o": ["Sospecha fundada de un comienzo de ejecución", "Un reporte previo de actividad sospechosa", "Sentencia firme contra algún integrante", "Denuncia formal de una persona agraviada"], "a": 0, "e": "Art. 68."}, {"t": "vf", "q": "Según la LOCDOFT, las denegaciones de asistencia judicial recíproca deben ser motivadas.", "a": true, "e": "Art. 81, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, incumplir el trámite de autorización de la entrega vigilada se pena con prisión de:", "o": ["Cinco a diez años", "Tres a seis años", "Seis a ocho años", "Ocho a doce años"], "a": 0, "e": "Art. 66, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, si un banco contribuye intencionalmente a un delito de la ley, para las medidas administrativas el Ministerio Público:", "o": ["Notificará al órgano de control correspondiente", "Decretará directamente su intervención", "Solicitará a la UNIF revocar su licencia", "Esperará la sentencia para informar al rector"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, a un funcionario condenado por participar en un delito de la ley se le aplica como pena accesoria la destitución y queda impedido de ejercer funciones públicas:", "o": ["De uno a quince años tras cumplir la pena", "De uno a quince años desde la sentencia", "Por el tiempo que dure la condena", "De manera perpetua y definitiva"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "mc", "q": "Según la LOCDOFT, son responsables por hechos punibles cometidos por cuenta de ellas por sus órganos directivos o representantes:", "o": ["Las personas jurídicas, salvo el Estado y sus empresas", "Todas las personas jurídicas, incluso las estatales", "Solo las personas jurídicas del sector financiero", "Solo los directivos, nunca la persona jurídica"], "a": 0, "e": "Art. 31."}, {"t": "vf", "q": "Según la LOCDOFT, las personas jurídicas, incluidos el Estado y sus empresas, responden penalmente por los delitos cometidos por su cuenta.", "a": false, "e": "Art. 31: con exclusión del Estado y sus empresas. Trampa: se elimina la excepción."}, {"t": "mc", "q": "Según la LOCDOFT, si el funcionario participó en un delito de la ley en perjuicio de una alcaldía, la pena se aplica:", "o": ["En su límite máximo", "Aumentada en un tercio", "En su término medio", "Aumentada en la mitad"], "a": 0, "e": "Art. 33: órgano nacional, estadal o municipal."}, {"t": "mc", "q": "Según la LOCDOFT, según la ley, los cuerpos competentes de investigación penal deben:", "o": ["Crear unidades de investigación de estos delitos", "Delegar la investigación en la UNIF", "Rendir cuentas directamente al órgano de control", "Solicitar permiso al órgano rector en cada caso"], "a": 0, "e": "Art. 26, parte final."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF depende jerárquicamente de la ONCDOFT.", "a": false, "e": "Art. 24: depende del ministerio con competencia en planificación y finanzas. Trampa: la UNIF contribuye con la ONCDOFT, pero no depende de ella."}, {"t": "mc", "q": "Según la LOCDOFT, se absuelve al imputado por sentencia firme. Los bienes incautados:", "o": ["Se restituyen a sus legítimos propietarios", "Quedan con el órgano rector un año", "Se confiscan si había indicios fundados", "Se decomisan de pleno derecho"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, el delito de asociación exige probar que el grupo cometió efectivamente alguno de los delitos para los que se formó.", "a": false, "e": "Art. 37: se pena por el solo hecho de la asociación."}, {"t": "vf", "q": "Según la LOCDOFT, el deber de reportar cede si los fondos provienen de una fuente lícita, aunque se sospeche que serán usados para financiar terrorismo.", "a": false, "e": "Art. 13: incluye actividades de fuente lícita."}, {"t": "mc", "q": "Según la LOCDOFT, una remesa vigilada, autorizada por un juez de control de Caracas donde el fiscal inició la investigación, transita por Zulia. La actuación en Zulia:", "o": ["No requiere otra autorización judicial", "Requiere autorización del juez de Zulia", "Requiere aval del Tribunal Supremo", "Requiere una comisión del juez de Caracas"], "a": 0, "e": "Art. 67."}, {"t": "mc", "q": "Según la LOCDOFT, el grupo formado deliberadamente para la comisión inmediata de un delito se denomina:", "o": ["Grupo estructurado", "Organización terrorista", "Grupo de delincuencia transnacional", "Asociación ilícita simple"], "a": 0, "e": "Art. 4, numeral 12."}, {"t": "mc", "q": "Según la LOCDOFT, se incautan alimentos perecederos. Para evitar su deterioro, el juez de control, previo inventario y oídos los terceros de buena fe:", "o": ["Puede autorizar su venta o uso con fines sociales", "Debe ordenar su destrucción inmediata y documentada", "Debe esperar la sentencia definitiva", "Los devuelve al imputado en custodia"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, una sola persona puede incurrir en delincuencia organizada si actúa como órgano de una persona jurídica o asociativa con la intención de cometer delitos de esa ley.", "a": true, "e": "Art. 4, numeral 9, y art. 27."}, {"t": "vf", "q": "Según la LOCDOFT, el tráfico de órganos y el sicariato tienen el mismo rango de pena.", "a": true, "e": "Arts. 43 y 44: veinticinco a treinta años."}, {"t": "mc", "q": "Según la LOCDOFT, si en un delito de la ley concurre una sola agravante de las previstas, la pena aplicable:", "o": ["Aumenta en un tercio", "Aumenta en la mitad", "Aumenta en una cuarta parte", "Se fija en su límite máximo"], "a": 0, "e": "Art. 29, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un grupo cobra por sacar del país a migrantes que aceptan pagar, sin cumplir requisitos legales y sin explotarlos después. El hecho encuadra en:", "o": ["Inmigración ilícita y tráfico ilegal, ocho a doce", "Trata de personas, de veinte a veinticinco", "Solo infracción de la ley de migración", "Asociación, de seis a diez años, y nada más"], "a": 0, "e": "Art. 42."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa estatal es usada por sus directivos para legitimar capitales. La responsabilidad penal de la persona jurídica prevista en la ley:", "o": ["No alcanza a la empresa del Estado", "Alcanza a la empresa como a las privadas", "Se traslada al órgano de adscripción", "Solo opera con clausura definitiva"], "a": 0, "e": "Art. 31. Los directivos sí responden individualmente."}, {"t": "vf", "q": "Según la LOCDOFT, utilizar a un adulto mayor o a una persona en situación de calle para cometer los delitos es una circunstancia agravante.", "a": true, "e": "Art. 29, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, un extranjero comete en el exterior un delito de la ley que atenta contra los intereses patrimoniales de la República. Sobre su enjuiciamiento:", "o": ["Queda sujeto a esta ley venezolana", "Solo procede si es detenido en Venezuela", "Solo procede si su país lo autoriza", "Corresponde solo al Estado del hecho"], "a": 0, "e": "Art. 73, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, quien integra un grupo de delincuencia organizada, aunque no se le pruebe otro delito, responde:", "o": ["Por asociación, de seis a diez años", "Solo si el grupo consumó algún delito", "Por asociación, de ocho a doce años", "Únicamente con pena accesoria"], "a": 0, "e": "Art. 37: por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre terrorista individual y organización terrorista está en que esta última requiere:", "o": ["Tres o más personas con propósito común", "Dos o más personas con propósito común", "Actuar en más de un país", "Una estructura registrada o reconocida"], "a": 0, "e": "Art. 4, numerales 17 y 22."}, {"t": "vf", "q": "Según la LOCDOFT, la incidencia de oposición al decomiso no interrumpe el proceso penal.", "a": true, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la producción de material pornográfico con niños, por un grupo criminal, tiene pena de veinte a veinticinco años, mientras que explotar esa industria con ellos o para ellos tiene:", "o": ["Veinticinco a treinta años", "Diez a quince años", "Quince a veinte años", "La misma pena de veinte a veinticinco"], "a": 0, "e": "Arts. 46 y 49."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia dirigida a Venezuela debe presentarse por escrito:", "o": ["En castellano o idioma aceptado por Venezuela", "En cualquiera de los idiomas de la ONU", "Únicamente en idioma castellano oficial del país", "En el idioma del Estado requirente"], "a": 0, "e": "Art. 80."}, {"t": "vf", "q": "Según la LOCDOFT, la imprescriptibilidad de la acción penal se extiende a los delitos previstos en esa ley, además de los delitos contra el patrimonio público y los de tráfico ilícito de drogas.", "a": true, "e": "Art. 30."}, {"t": "vf", "q": "Según la LOCDOFT, un delito cometido por una sola persona nunca puede sancionarse conforme a la ley de delincuencia organizada.", "a": false, "e": "Art. 27: también se sancionan los cometidos por una sola persona, conforme al art. 4. Trampa: un adverbio absoluto."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional contra estos grupos se basa, entre otros lineamientos, en:", "o": ["Privarlos del producto de sus actividades", "Dejar la persecución al Estado de origen", "Unificar los códigos penales de la región", "Sustituir la jurisdicción nacional afectada"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Según la LOCDOFT, en la trata de personas cometida por un grupo criminal contra un adulto que aceptó el traslado, el consentimiento de la víctima:", "o": ["No excluye el delito", "Excluye la responsabilidad penal", "Atenúa la pena a la mitad", "Convierte el hecho en tráfico ilegal"], "a": 0, "e": "Arts. 41 y 42."}, {"t": "mc", "q": "Según la LOCDOFT, el agente de operaciones encubiertas se define como un funcionario que:", "o": ["Asume una identidad diferente para infiltrarse", "Vigila desde el exterior sin contacto", "Colabora a cambio de reducción de pena", "Audita en secreto a los sujetos obligados"], "a": 0, "e": "Art. 4, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, en casos de extrema urgencia, el fiscal puede obtener la autorización judicial por cualquier medio y formalizarla luego por escrito.", "a": true, "e": "Art. 66. Trampa: se cree que siempre debe ser escrita y previa."}, {"t": "vf", "q": "Según la LOCDOFT, quien encarga un homicidio a un sicario recibe la misma pena que el ejecutor.", "a": true, "e": "Art. 44."}, {"t": "vf", "q": "Según la LOCDOFT, un hecho con pena inferior a cinco años puede ser delito grave si afecta intereses colectivos o difusos.", "a": true, "e": "Art. 4, numeral 10."}, {"t": "vf", "q": "Según la LOCDOFT, las empresas privadas de telefonía están obligadas a permitir el uso de sus equipos para las interceptaciones autorizadas.", "a": true, "e": "Art. 65. Trampa: se cree que solo colaboran voluntariamente."}, {"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales NO figura:", "o": ["El SENIAT", "El CICPC", "La Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, las unidades de investigación financiera creadas en los órganos policiales funcionan bajo la coordinación de:", "o": ["El Ministerio Público", "La UNIF", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 78."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa telefónica se niega a facilitar sus equipos para una interceptación judicialmente autorizada, alegando ser privada. La ley dispone que:", "o": ["Está obligada a permitir su uso", "Solo debe entregar datos históricos", "Puede negarse sin orden del TSJ", "Basta que entregue un informe técnico"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, que la comisión del delito involucre el espacio geográfico de otro Estado:", "o": ["Es una circunstancia agravante", "Excluye la competencia venezolana", "Obliga a aplicar la ley extranjera", "Es irrelevante para fijar la pena"], "a": 0, "e": "Art. 29, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, el principio de jurisdicción extraterritorial no se aplica si la persona:", "o": ["Fue juzgada en otro país y cumplió la condena", "Fue investigada antes en otro país", "Fue absuelta por falta de pruebas en primera instancia", "Reside legalmente en otro país"], "a": 0, "e": "Art. 73, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela considerará remitir actuaciones penales a otro Estado cuando estime que ello:", "o": ["Obra en interés de una correcta administración de justicia", "Reduce los costos ordinarios de su sistema de justicia", "Evita que el imputado acceda a medidas cautelares", "Le permite cumplir la evaluación mutua del GAFIC"], "a": 0, "e": "Art. 85."}, {"t": "mc", "q": "Según la LOCDOFT, la existencia del servicio especializado se exceptúa de la aplicación de:", "o": ["La ley de enajenación de bienes del sector público", "El Código Orgánico Procesal Penal y sus reformas", "La ley que crea la unidad de inteligencia", "La Ley Orgánica de Drogas"], "a": 0, "e": "Disposición transitoria segunda."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, sobre las concesiones y autorizaciones de una persona jurídica condenada, el juez:", "o": ["Remite las actuaciones a los órganos competentes", "Las revoca directamente en la misma sentencia", "Carece de toda facultad sobre el asunto", "Las suspende hasta por quince años"], "a": 0, "e": "Art. 32, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, para evitar que personas vinculadas a estos delitos adquieran participaciones en sujetos obligados, deben adoptar medidas:", "o": ["Los órganos y entes de control", "El Ministerio Público y sus fiscales", "Los tribunales de control", "Los propios sujetos obligados"], "a": 0, "e": "Art. 21."}, {"t": "mc", "q": "Según la LOCDOFT, si quien revela la identidad del agente encubierto es un funcionario público, la pena es de:", "o": ["Quince a veinte años, más inhabilitación", "Seis a ocho años, más inhabilitación", "Quince a veinte años, sin accesorias", "Ocho a doce años, más destitución"], "a": 0, "e": "Art. 72: inhabilitación por quince años tras cumplir la pena."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, los recursos obtenidos de la administración de bienes asegurados, luego de resarcir sus costos, se mantienen en:", "o": ["Un fondo especial para quien acredite derecho", "La cuenta única del Tesoro Nacional de la República", "El presupuesto del Ministerio Público", "Un fideicomiso del órgano de control"], "a": 0, "e": "Art. 62."}, {"t": "mc", "q": "Según la LOCDOFT, la clausura definitiva de una persona jurídica condenada procede en caso de:", "o": ["Comisión intencional de delitos de la ley", "Comisión culposa de delitos de la ley", "Primera infracción administrativa grave", "Omisión de un reporte de sospecha"], "a": 0, "e": "Art. 32, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, se incautó un vehículo hace un año y no se ha podido establecer quién es su titular. El fiscal debe:", "o": ["Solicitar su decomiso al tribunal de control", "Solicitar su confiscación en la acusación", "Rematarlo directamente con el órgano rector", "Esperar diez años desde la incautación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Según la LOCDOFT, un juez autoriza una identidad falsa a un agente. Esa autorización:", "o": ["No permite alterar registros públicos", "Permite alterar registros si es necesario", "Permite alterar solo archivos nacionales", "Requiere alterar los libros civiles"], "a": 0, "e": "Art. 70, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva procede sobre bienes empleados en el delito o sobre aquellos respecto de los cuales existan:", "o": ["Elementos de convicción de procedencia ilícita", "Sentencias firmes contra su propietario actual", "Reportes de sospecha enviados a la UNIF", "Denuncias de terceros sin otro respaldo"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, las medidas sobre bienes vinculados a delitos de esta ley relacionados con drogas se rigen por:", "o": ["La Ley Orgánica de Drogas", "El Código Penal", "La ley de bienes del sector público", "El Código de Procedimiento Civil"], "a": 0, "e": "Disposición final primera."}, {"t": "mc", "q": "Según la LOCDOFT, el decomiso se distingue de la confiscación porque recae sobre bienes:", "o": ["Abandonados o no reclamados", "Del condenado por sentencia firme", "Afectados por medida temporal", "Adquiridos antes del delito"], "a": 0, "e": "Art. 4, numerales 7 y 8."}, {"t": "mc", "q": "Según la LOCDOFT, quien revele la identidad de un agente encubierto, sin ser funcionario, es penado con prisión de:", "o": ["Seis a ocho años", "Quince a veinte años", "Diez a quince años", "Cuatro a seis años"], "a": 0, "e": "Art. 72. Trampa: quince a veinte es la pena si lo revela un funcionario."}, {"t": "mc", "q": "Según la LOCDOFT, la entrega vigilada de remesas ilícitas la solicita el Ministerio Público mediante:", "o": ["Acta razonada ante el juez de control", "Oficio dirigido al órgano rector", "Memorándum a la unidad policial", "Escrito ante la Corte de Apelaciones"], "a": 0, "e": "Art. 66."}, {"t": "mc", "q": "Según la LOCDOFT, un delito con pena máxima de cuatro años y seis meses que no afecta intereses colectivos ni difusos:", "o": ["No es delito grave para esta ley", "Es grave porque supera los cuatro años", "Es grave si lo comete un funcionario", "Es grave si media un beneficio económico"], "a": 0, "e": "Art. 4, numeral 10: más de cinco años. El umbral de cuatro años es de Palermo."}, {"t": "vf", "q": "Según la LOCDOFT, para la devolución de bienes en el procedimiento de decomiso, el interesado debe haber hecho todo lo razonable para impedir su uso ilegal.", "a": true, "e": "Art. 59, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión por legitimación de capitales es de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Trampa: seis a diez es la pena por asociación; quince a veinticinco, la de financiamiento al terrorismo."}, {"t": "mc", "q": "Según la LOCDOFT, el concepto de bienes incluye, a efectos de la ley, los medios que se pretendan utilizar para cometer los delitos:", "o": ["Aunque estén en poder de terceros no partícipes", "Solo si están en poder de los imputados del caso", "Solo si fueron efectivamente utilizados", "Solo si se trata de bienes muebles"], "a": 0, "e": "Art. 4, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, en extrema necesidad y urgencia operativa, para una entrega vigilada el fiscal:", "o": ["Obtiene la autorización por cualquier medio y luego la formaliza", "Actúa sin autorización y la pide dentro de los treinta días", "Sustituye la autorización con su propia acta", "Debe esperar siempre la autorización escrita"], "a": 0, "e": "Art. 66, segundo párrafo."}, {"t": "vf", "q": "Según la LOCDOFT, el régimen de personas expuestas políticamente cubre a quienes son, han sido o serán considerados bajo ese perfil.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, cuando un delito del Código Penal es cometido por un grupo de delincuencia organizada, la sanción:", "o": ["Se incrementa en la mitad de la pena aplicable", "Se incrementa en un tercio de la pena aplicable", "Se duplica sin excepción alguna", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28. El tercio corresponde a una agravante del art. 29."}, {"t": "mc", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el titular no reclama sus bienes. El fiscal solicita el decomiso por abandono después de:", "o": ["Seis meses de finalizado el proceso", "Un año de finalizado el proceso", "Treinta días de finalizado el proceso", "Cinco años de finalizado el proceso"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, quien forma parte de un grupo de delincuencia organizada, por el solo hecho de la asociación, es penado con prisión de:", "o": ["Seis a diez años", "Diez a quince años", "Ocho a doce años", "Cuatro a seis años"], "a": 0, "e": "Art. 37. Trampa: diez a quince es la de legitimación."}, {"t": "vf", "q": "Según la LOCDOFT, cuando un grupo de delincuencia organizada comete un delito del Código Penal, la pena se incrementa en un tercio.", "a": false, "e": "Art. 28: se incrementa en la mitad. Trampa: se cambia la fracción."}, {"t": "mc", "q": "Según la LOCDOFT, un integrante de un grupo criminal traslada, sin autorización, armas de guerra. La pena es de:", "o": ["Quince a veinticinco años", "Doce a dieciocho años", "Veinticinco a treinta años", "Ocho a doce años"], "a": 0, "e": "Art. 38: agravada por tratarse de armas de guerra."}, {"t": "mc", "q": "Según la LOCDOFT, para obstruir una investigación en beneficio de un grupo criminal, alguien paga a un funcionario y este acepta. La pena de ambos es de:", "o": ["Doce a dieciocho años", "Ocho a doce años", "Seis a ocho años", "Quince a veinte años"], "a": 0, "e": "Art. 45, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, la asistencia judicial recíproca solicitada a Venezuela se presta conforme a los tratados y, en ausencia de ellos:", "o": ["Sobre la base del principio de reciprocidad", "Solo si el TSJ la autoriza expresamente", "Solo con las Recomendaciones del GAFI", "No se presta en ningún supuesto"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la LOCDOFT, el poder de otorgar, negar, suspender o cancelar licencias de sujetos obligados corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "La ONCDOFT", "El juez de control competente"], "a": 0, "e": "Art. 8, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la LOCDOFT, en el abandono legal, el lapso para reclamar luego del cartel es de treinta días contados desde:", "o": ["La consignación del cartel", "La publicación de la sentencia", "La orden del tribunal de control", "La incautación del bien"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, si se devuelve el bien en el procedimiento por abandono, los gastos de conservación corren por cuenta de:", "o": ["Su titular", "El órgano rector", "El Ministerio Público", "El servicio especializado"], "a": 0, "e": "Art. 60, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, analizar la información para confirmar actividades sospechosas corresponde a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El CICPC"], "a": 0, "e": "Art. 25, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, para la entrega vigilada basta la autorización del juez de control de la circunscripción donde se inició la investigación.", "a": true, "e": "Art. 67: es válida en todo el territorio nacional. Trampa: se cree que hace falta una por cada circunscripción."}, {"t": "mc", "q": "Según la LOCDOFT, un particular revela el domicilio de un agente encubierto. La pena es de:", "o": ["Seis a ocho años", "Quince a veinte años", "Ocho a doce años", "Tres a seis años"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "Según la LOCDOFT, coordinar con órganos nacionales e internacionales las operaciones de prevención y represión corresponde, sin perjuicio de otras competencias, a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Fuerza Armada"], "a": 0, "e": "Art. 6, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios especiales responden frente al Estado y a terceros agraviados:", "o": ["Administrativa, civil y penalmente", "Solo civilmente por daños probados", "Solo administrativamente ante el rector", "Solo penalmente en caso de dolo"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, financiar parcialmente a un terrorista individual, de modo que solo una parte de los fondos vaya a ese fin:", "o": ["Basta para configurar el delito", "Solo es punible por la parte probada", "Excluye el delito si el resto es lícito", "Requiere pertenecer a una organización"], "a": 0, "e": "Art. 53: en su totalidad o en parte."}, {"t": "vf", "q": "Según la LOCDOFT, un ejecutivo de alto nivel de una corporación propiedad de un gobierno extranjero puede ser persona expuesta políticamente.", "a": true, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, presentar informes fundados al Ministerio Público cuando haya indicios de un hecho punible corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, la documentación bancaria y financiera puede entregarse en asistencia mutua mediante:", "o": ["Copias certificadas de los documentos pertinentes", "Solo informe resumido de la autoridad requerida", "Solo con el consentimiento del titular", "Exclusivamente por la vía de la UNIF"], "a": 0, "e": "Art. 79, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, en el decomiso, si no se promovieron pruebas o el punto es de mero derecho, el juez decide dentro de:", "o": ["Tres días", "Cinco días", "Ocho días", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la prohibición temporal de transferir o gravar bienes, por mandato judicial, se llama:", "o": ["Aseguramiento preventivo o incautación", "Confiscación", "Decomiso", "Abandono legal o decomiso provisional"], "a": 0, "e": "Art. 4, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, es competente para autorizar la operación encubierta el juez de control:", "o": ["De donde el fiscal inició la investigación", "Del lugar donde actúe el agente encubierto", "Del domicilio del investigado", "Designado por el órgano rector"], "a": 0, "e": "Art. 67."}, {"t": "mc", "q": "Según la LOCDOFT, un imputado alega que pasaron veinte años desde una legitimación de capitales. La acción penal:", "o": ["No prescribe", "Prescribió a los quince años", "Prescribe al doble de la pena máxima", "Prescribe solo si no hubo imputación"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según la LOCDOFT, la ley anterior contra la delincuencia organizada, según la cita de su disposición derogatoria, aparece publicada en:", "o": ["G.O. 5.789 Extraordinario, 26-10-2005", "G.O. 39.912, del 30-04-2012", "G.O. 38.281 Ordinario, del 27-09-2005", "G.O. 41.522, del 12-11-2018"], "a": 0, "e": "Disposición derogatoria única."}, {"t": "vf", "q": "Según la LOCDOFT, la doble incriminación es requisito general para toda diligencia de asistencia, incluso para recibir un testimonio.", "a": false, "e": "Art. 88: la exige para las solicitudes de decomiso e identificación e incautación allí referidas."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión de quien posee bienes a sabiendas de su origen ilícito se acompaña de una multa equivalente:", "o": ["Al valor del incremento patrimonial ilícito", "Al doble del valor de los bienes poseídos", "A entre 1.000 y 3.000 unidades tributarias", "Al salario de los años de condena impuestos"], "a": 0, "e": "Art. 35. Las multas en U.T. son administrativas."}, {"t": "mc", "q": "Según la LOCDOFT, usar la ingeniería genética para producir armas biológicas, como parte de un grupo criminal, se pena con:", "o": ["Veinticinco a treinta años", "Ocho a doce años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 40."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos que obtiene el servicio especializado por administrar y enajenar bienes pueden destinarse:", "o": ["A programas de prevención y a su autofinanciamiento", "Solo al pago de la deuda pública nacional vigente", "A indemnizar a los funcionarios actuantes", "A incrementar el situado constitucional"], "a": 0, "e": "Art. 61."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo aplicable a directivos y empleados de sujetos obligados alcanza la legitimación de capitales y el financiamiento al terrorismo, pero no cualquier delito de delincuencia organizada.", "a": true, "e": "Art. 36."}, {"t": "mc", "q": "Según la LOCDOFT, una solicitud de asistencia perturbaría una investigación en curso en Venezuela. Venezuela puede:", "o": ["Diferirla y consultar con el Estado requirente", "Denegarla sin expresar motivo alguno al Estado", "Cumplirla siempre con prioridad", "Archivarla de manera definitiva"], "a": 0, "e": "Art. 82."}, {"t": "vf", "q": "Según la LOCDOFT, la acción penal por los delitos previstos en la ley no prescribe.", "a": true, "e": "Art. 30. Trampa: se espera un plazo de prescripción como en el Código Penal."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por mantener cuentas anónimas o cifradas la impone la UNIF.", "a": false, "e": "Art. 11: la impone el órgano o ente de control del sujeto obligado. Trampa: se cambia el organismo."}, {"t": "mc", "q": "Según la LOCDOFT, el producto de un delito se mezcló con bienes de fuente lícita. Podrá decomisarse:", "o": ["Hasta el valor estimado del producto mezclado", "La totalidad de los bienes mezclados", "Nada, por la imposibilidad de separarlos", "Solo la parte que se pruebe por factura"], "a": 0, "e": "Art. 89, numeral 4."}, {"t": "vf", "q": "Según la LOCDOFT, las normas de alcance extraterritorial pueden dejar de cumplirse por un sujeto obligado que invoque las reglas de otra jurisdicción.", "a": false, "e": "Art. 3: no puede oponerse el cumplimiento respecto de otras jurisdicciones."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones administrativas previstas por incumplir las obligaciones de los sujetos obligados las imponen, por regla general:", "o": ["Los órganos y entes de control", "Los jueces de control", "Los fiscales del Ministerio Público", "La UNIF por vía de reporte"], "a": 0, "e": "Arts. 8, numeral 3, y 10 a 17."}, {"t": "mc", "q": "Según la LOCDOFT, la ley del país de una sucursal extranjera impide aplicar los controles venezolanos. La sucursal debe:", "o": ["Informar a la oficina principal y exigirse el estándar más alto", "Aplicar solo la ley local sin informar a la oficina principal", "Cerrar operaciones de inmediato", "Pedir una excepción a la UNIF"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los sufraga, salvo pacto en contrario:", "o": ["El Estado requirente", "El Estado requerido", "Ambos, por partes iguales", "El imputado, si resulta condenado"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, se encuentra en Venezuela un investigado por un delito de la ley cometido en parte en alta mar. Esa persona:", "o": ["Está sujeta a enjuiciamiento conforme a esta ley", "Solo puede ser extraditada al Estado de bandera", "Queda fuera de la jurisdicción venezolana", "Solo responde si la víctima es venezolana"], "a": 0, "e": "Art. 73, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen para oponerse:", "o": ["Treinta días", "Cinco días", "Ocho días", "Quince días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, quien sin ser policía usa un uniforme policial simulado para cometer un delito de la ley:", "o": ["Incurre en la agravante de la condición simulada", "No agrava porque no es funcionario público", "Solo responde por usurpación de funciones", "Solo agrava si el uniforme es auténtico"], "a": 0, "e": "Art. 29, numeral 2."}, {"t": "vf", "q": "Según la LOCDOFT, para que haya financiamiento al terrorismo, los fondos deben haberse usado efectivamente en un acto terrorista.", "a": false, "e": "Art. 53: se pena aunque los fondos no se usen ni se consume el acto. Trampa: se agrega un resultado que la ley no exige."}, {"t": "mc", "q": "Según la LOCDOFT, la multa a la persona jurídica en caso de legitimación equivale a:", "o": ["El valor de los capitales, bienes o haberes", "El doble del valor del incremento ilícito", "De 3.000 a 5.000 unidades tributarias", "Un porcentaje del capital social suscrito"], "a": 0, "e": "Art. 32, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, en juicio se requiere la comparecencia del agente encubierto que aportó la evidencia. Esa comparecencia la asume:", "o": ["El responsable del Ministerio Público que coordinó", "El propio agente, con rostro cubierto", "El superior policial que dirigió al agente infiltrado", "El juez de control que autorizó"], "a": 0, "e": "Art. 71."}, {"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, vencido sin resultados el plazo de una operación encubierta, el juez, vistos los alegatos del funcionario responsable:", "o": ["Concederá prórroga", "Debe ordenar el cierre definitivo", "Debe remitir a la Corte de Apelaciones", "Puede autorizar solo una nueva operación"], "a": 0, "e": "Art. 67, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, NO es una causal legal para denegar la asistencia judicial recíproca:", "o": ["Que la solicitud involucre el secreto bancario", "Que menoscabe la soberanía o el orden público", "Que no se ajuste a los requisitos legales", "Que sea contraria al ordenamiento interno"], "a": 0, "e": "Arts. 81 y 87."}, {"t": "mc", "q": "Según la LOCDOFT, la actividad sospechosa se diferencia de la inusual en que la primera supone:", "o": ["Un análisis que hace presumir fondos ilícitos", "Un monto superior a USD 10.000 en una operación", "Una orden judicial previa de examen", "La condena de alguno de los clientes"], "a": 0, "e": "Art. 4, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, las solicitudes de decomiso de otro Estado se presentan por Venezuela ante:", "o": ["Sus autoridades competentes para que se pronuncien", "La UNIF para su análisis de inteligencia", "El órgano de control del titular de los bienes", "El Estado requirente para su propia ejecución"], "a": 0, "e": "Art. 88."}, {"t": "vf", "q": "Según la LOCDOFT, basta una sola de las condiciones legales, como que otras medidas resultaran inútiles, para que proceda la autorización del agente encubierto, si además existe el delito o la sospecha fundada.", "a": true, "e": "Art. 68: una o varias."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de declarar más de diez mil dólares en efectivo aplica solo al ingresar al país.", "a": false, "e": "Art. 22: al ingresar o salir. Trampa: se recorta el supuesto."}, {"t": "mc", "q": "Según la LOCDOFT, la solicitud del Ministerio Público para interceptar o grabar comunicaciones debe ser:", "o": ["Razonada y previa a la autorización", "Verbal, con confirmación posterior", "Reservada y sin motivación escrita", "Conjunta con el órgano rector"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, la dirección de la investigación penal de estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El órgano de control"], "a": 0, "e": "Art. 26."}, {"t": "vf", "q": "Según la LOCDOFT, los bienes que el juez confisca tras una condena firme por un delito de la ley se destinan a planes y programas de prevención y represión.", "a": true, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir el comercio con amenazas, en apoyo de un grupo criminal, se pena con prisión de:", "o": ["Ocho a diez años", "Ocho a doce años", "Seis a ocho años", "Diez a quince años"], "a": 0, "e": "Art. 50."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela puede autorizar el decomiso o la confiscación del producto de los delitos o de:", "o": ["Bienes de valor equivalente al producto", "Solo el bien exacto obtenido del delito", "Todo el patrimonio familiar del imputado", "Solo los bienes situados en el exterior"], "a": 0, "e": "Art. 86, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, ensamblar municiones a partir de componentes lícitos, como parte de un grupo criminal:", "o": ["Es fabricación ilícita aunque las piezas sean lícitas", "Es atípico si todas las piezas son de origen lícito", "Solo es tráfico si se llegan a vender", "Es una infracción administrativa aduanera"], "a": 0, "e": "Art. 39."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "mc", "q": "Según la LOCDOFT, dos socios sin persona jurídica de por medio se conciertan de modo estable para traficar armas. Sobre la noción legal de delincuencia organizada:", "o": ["No alcanzan el mínimo de tres personas", "Bastan dos si hay un beneficio económico", "Se cumple con cualquier concierto estable", "Se requiere un mínimo de cinco integrantes"], "a": 0, "e": "Art. 4, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, obstruir la investigación con violencia en favor de un grupo criminal se pena con seis a ocho años:", "o": ["Sin perjuicio de la pena por las lesiones", "Con absorción de la pena por las lesiones", "Aumentados en la mitad por las lesiones", "Solo si la víctima es funcionario público"], "a": 0, "e": "Art. 45, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, la incautación preventiva de bienes la ordena el juez de control, previa solicitud del fiscal del Ministerio Público.", "a": true, "e": "Art. 55. Trampa: se confunde a quien solicita con quien ordena."}, {"t": "mc", "q": "Según la LOCDOFT, intercambiar información con entidades homólogas extranjeras y suscribir memorandos para ello corresponde a:", "o": ["La UNIF", "El órgano de control", "El Ministerio Público", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 5."}, {"t": "vf", "q": "Según la LOCDOFT, financiar a una organización terrorista que opera únicamente en el extranjero también es punible.", "a": true, "e": "Art. 53, segundo párrafo."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo que debe transcurrir desde la incautación para solicitar el decomiso por titular desconocido es de:", "o": ["Un año", "Seis meses", "Treinta días", "Dos años"], "a": 0, "e": "Art. 58. Los seis meses son del abandono tras absolución, art. 60."}, {"t": "vf", "q": "Según la LOCDOFT, los depositarios especiales de bienes incautados se asimilan a funcionarios públicos y responden administrativa, civil y penalmente.", "a": true, "e": "Art. 57. Trampa: se cree que, por ser particulares, solo responden civilmente."}, {"t": "mc", "q": "Según la LOCDOFT, tramitar las solicitudes de asistencia judicial recíproca corresponde a:", "o": ["El Ministerio Público, con el ministerio de exteriores", "La ONCDOFT, en coordinación con el ministerio de exteriores", "La UNIF, con su homóloga extranjera", "El TSJ, con el ministerio de interior"], "a": 0, "e": "Art. 77."}, {"t": "mc", "q": "Según la LOCDOFT, los familiares cercanos de una persona expuesta políticamente incluyen, según la ley:", "o": ["Padres, hermanos, cónyuges, hijos y parientes políticos", "Solo hijos y cónyuges de la persona expuesta", "Solo quienes habiten con la persona expuesta", "Parientes hasta el sexto grado de consanguinidad o afinidad"], "a": 0, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, según la disposición transitoria de la ley, dependía antes de su adecuación de:", "o": ["La Superintendencia del Sector Bancario", "El Ministerio de Relaciones Interiores", "El Banco Central de Venezuela", "La Fiscalía General de la República"], "a": 0, "e": "Disposición transitoria quinta."}, {"t": "mc", "q": "Según la LOCDOFT, quien intenta sin éxito realizar un acto terrorista como terrorista individual enfrenta:", "o": ["La misma pena del consumado, 25 a 30 años", "La pena rebajada por la tentativa", "Solo la pena por financiamiento", "Quince a veinticinco años de prisión"], "a": 0, "e": "Art. 52: realice o trate de realizar."}, {"t": "vf", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen quince días para presentarse.", "a": false, "e": "Art. 58: treinta días siguientes a la publicación. Trampa: se cambia el plazo."}, {"t": "vf", "q": "Según la LOCDOFT, haber sido juzgado en el extranjero, sin cumplir la condena impuesta, no impide por sí solo la aplicación de la jurisdicción extraterritorial.", "a": true, "e": "Art. 73: exige juzgamiento y cumplimiento."}, {"t": "mc", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante:", "o": ["Ley o decreto", "Circular de la UNIF", "Resolución de la ONCDOFT", "Sentencia de control"], "a": 0, "e": "Art. 9, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, alguien recauda fondos para una organización terrorista, pero el atentado nunca ocurre y el dinero no se usa. Responde:", "o": ["Por financiamiento, de quince a veinticinco años", "Solo por tentativa de financiamiento", "Por nada, al no consumarse el acto terrorista", "Por asociación, de seis a diez años"], "a": 0, "e": "Art. 53."}, {"t": "mc", "q": "Según la LOCDOFT, quien, sin pertenecer al grupo criminal, figura como propietario de bienes relacionados con los delitos es:", "o": ["Interpuesta persona", "Íntimo asociado", "Integrante de grupo estructurado", "Tercero de buena fe"], "a": 0, "e": "Art. 4, numeral 13. El íntimo asociado se refiere a las PEP."}, {"t": "mc", "q": "Según la LOCDOFT, destruir datos acumulados que sirven de evidencia, en beneficio de un grupo criminal, se castiga con prisión de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Tres a seis años"], "a": 0, "e": "Art. 45, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, para que un acto sea terrorista, además del medio empleado debe perseguir, entre otros fines:", "o": ["Intimidar gravemente a una población", "Obtener un beneficio económico directo", "Afectar a más de un Estado a la vez", "Controlar un territorio determinado"], "a": 0, "e": "Art. 4, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, las razones ideológicas o religiosas pueden justificar el financiamiento al terrorismo cuando se prueba que eran el único móvil.", "a": false, "e": "Art. 53, parte final: ninguna circunstancia lo justifica."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso
