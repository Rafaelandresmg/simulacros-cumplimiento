e un informe técnico"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "vf", "q": "Según la LOCDOFT, basta una sola de las condiciones legales, como que otras medidas resultaran inútiles, para que proceda la autorización del agente encubierto, si además existe el delito o la sospecha fundada.", "a": true, "e": "Art. 68: una o varias."}, {"t": "vf", "q": "Según la LOCDOFT, el deber de reportar cede si los fondos provienen de una fuente lícita, aunque se sospeche que serán usados para financiar terrorismo.", "a": false, "e": "Art. 13: incluye actividades de fuente lícita."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, los bienes que el juez confisca tras una condena firme por un delito de la ley se destinan a planes y programas de prevención y represión.", "a": true, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, sobre las concesiones y autorizaciones de una persona jurídica condenada, el juez:", "o": ["Remite las actuaciones a los órganos competentes", "Las revoca directamente en la misma sentencia", "Carece de toda facultad sobre el asunto", "Las suspende hasta por quince años"], "a": 0, "e": "Art. 32, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, un depositario especial de bienes incautados lo designa:", "o": ["El órgano rector", "El juez de control", "El fiscal del Ministerio Público", "El propietario de los bienes"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, si un banco contribuye intencionalmente a un delito de la ley, para las medidas administrativas el Ministerio Público:", "o": ["Notificará al órgano de control correspondiente", "Decretará directamente su intervención", "Solicitará a la UNIF revocar su licencia", "Esperará la sentencia para informar al rector"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, la confiscación se define en la ley como:", "o": ["Pena accesoria con privación definitiva", "Medida cautelar temporal sobre bienes", "Privación de bienes abandonados", "Custodia provisional por el órgano rector"], "a": 0, "e": "Art. 4, numeral 7."}, {"t": "mc", "q": "Según la LOCDOFT, los recursos obtenidos de la administración de bienes asegurados, luego de resarcir sus costos, se mantienen en:", "o": ["Un fondo especial para quien acredite derecho", "La cuenta única del Tesoro Nacional de la República", "El presupuesto del Ministerio Público", "Un fideicomiso del órgano de control"], "a": 0, "e": "Art. 62."}, {"t": "mc", "q": "Según la LOCDOFT, la sentencia condenatoria de una persona jurídica se publica:", "o": ["Íntegra, en diario de mayor circulación, a su costa", "Solo su dispositivo, en Gaceta, a costa del Estado", "Íntegra, en el portal del órgano rector y sin costo", "Solo si lo solicita alguna de las víctimas"], "a": 0, "e": "Art. 32, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, el poder de otorgar, negar, suspender o cancelar licencias de sujetos obligados corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "La ONCDOFT", "El juez de control competente"], "a": 0, "e": "Art. 8, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, se incautó un vehículo hace un año y no se ha podido establecer quién es su titular. El fiscal debe:", "o": ["Solicitar su decomiso al tribunal de control", "Solicitar su confiscación en la acusación", "Rematarlo directamente con el órgano rector", "Esperar diez años desde la incautación"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, al fijar la sanción de una persona jurídica, el juez considera las consecuencias para la empresa y la necesidad de prevenir nuevos hechos punibles.", "a": true, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, las medidas sobre bienes vinculados a delitos de esta ley relacionados con drogas se rigen por:", "o": ["La Ley Orgánica de Drogas", "El Código Penal", "La ley de bienes del sector público", "El Código de Procedimiento Civil"], "a": 0, "e": "Disposición final primera."}, {"t": "mc", "q": "Según la LOCDOFT, la multa a la persona jurídica en caso de legitimación equivale a:", "o": ["El valor de los capitales, bienes o haberes", "El doble del valor del incremento ilícito", "De 3.000 a 5.000 unidades tributarias", "Un porcentaje del capital social suscrito"], "a": 0, "e": "Art. 32, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, la decisión dictada tras la audiencia oral de decomiso:", "o": ["Es apelable dentro de cinco días", "Es apelable dentro de treinta días", "No admite recurso alguno", "Solo admite recurso de casación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, si se devuelve el bien en el procedimiento por abandono, los gastos de conservación corren por cuenta de:", "o": ["Su titular", "El órgano rector", "El Ministerio Público", "El servicio especializado"], "a": 0, "e": "Art. 60, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la existencia del servicio especializado se exceptúa de la aplicación de:", "o": ["La ley de enajenación de bienes del sector público", "El Código Orgánico Procesal Penal y sus reformas", "La ley que crea la unidad de inteligencia", "La Ley Orgánica de Drogas"], "a": 0, "e": "Disposición transitoria segunda."}, {"t": "mc", "q": "Según la LOCDOFT, el producto del delito comprende los bienes obtenidos:", "o": ["Directa o indirectamente de su comisión", "Solo directamente de su comisión", "Solo si constan en dinero o divisas", "Solo después de la imputación formal"], "a": 0, "e": "Art. 4, numeral 20."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios especiales responden frente al Estado y a terceros agraviados:", "o": ["Administrativa, civil y penalmente", "Solo civilmente por daños probados", "Solo administrativamente ante el rector", "Solo penalmente en caso de dolo"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, se absuelve al imputado por sentencia firme. Los bienes incautados:", "o": ["Se restituyen a sus legítimos propietarios", "Quedan con el órgano rector un año", "Se confiscan si había indicios fundados", "Se decomisan de pleno derecho"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, la prohibición temporal de transferir o gravar bienes, por mandato judicial, se llama:", "o": ["Aseguramiento preventivo o incautación", "Confiscación", "Decomiso", "Abandono legal o decomiso provisional"], "a": 0, "e": "Art. 4, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, los fondos, para la ley, incluyen activos de todo tipo:", "o": ["Con independencia de la licitud de su origen", "Siempre que su origen sea ilícito y conocido", "Solo si están depositados en bancos", "Solo si son tangibles y movibles"], "a": 0, "e": "Art. 4, numeral 11."}, {"t": "mc", "q": "Según la LOCDOFT, el decomiso se distingue de la confiscación porque recae sobre bienes:", "o": ["Abandonados o no reclamados", "Del condenado por sentencia firme", "Afectados por medida temporal", "Adquiridos antes del delito"], "a": 0, "e": "Art. 4, numerales 7 y 8."}, {"t": "mc", "q": "Según la LOCDOFT, publicado el cartel del procedimiento de decomiso, los interesados tienen para oponerse:", "o": ["Treinta días", "Cinco días", "Ocho días", "Quince días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, en el decomiso, si no se promovieron pruebas o el punto es de mero derecho, el juez decide dentro de:", "o": ["Tres días", "Cinco días", "Ocho días", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa estatal es usada por sus directivos para legitimar capitales. La responsabilidad penal de la persona jurídica prevista en la ley:", "o": ["No alcanza a la empresa del Estado", "Alcanza a la empresa como a las privadas", "Se traslada al órgano de adscripción", "Solo opera con clausura definitiva"], "a": 0, "e": "Art. 31. Los directivos sí responden individualmente."}, {"t": "mc", "q": "Según la LOCDOFT, tras una sentencia absolutoria, el titular no reclama sus bienes. El fiscal solicita el decomiso por abandono después de:", "o": ["Seis meses de finalizado el proceso", "Un año de finalizado el proceso", "Treinta días de finalizado el proceso", "Cinco años de finalizado el proceso"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, para evitar que personas vinculadas a estos delitos adquieran participaciones en sujetos obligados, deben adoptar medidas:", "o": ["Los órganos y entes de control", "El Ministerio Público y sus fiscales", "Los tribunales de control", "Los propios sujetos obligados"], "a": 0, "e": "Art. 21."}, {"t": "mc", "q": "Según la LOCDOFT, se dicta sentencia condenatoria firme por un delito de la ley. Los bienes incautados preventivamente:", "o": ["Se confiscan y destinan a planes de prevención y represión", "Se devuelven al condenado hasta que otro proceso los afecte", "Se decomisan como bienes abandonados", "Pasan al patrimonio del Ministerio Público"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, la clausura definitiva de una persona jurídica condenada procede en caso de:", "o": ["Comisión intencional de delitos de la ley", "Comisión culposa de delitos de la ley", "Primera infracción administrativa grave", "Omisión de un reporte de sospecha"], "a": 0, "e": "Art. 32, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva procede sobre bienes empleados en el delito o sobre aquellos respecto de los cuales existan:", "o": ["Elementos de convicción de procedencia ilícita", "Sentencias firmes contra su propietario actual", "Reportes de sospecha enviados a la UNIF", "Denuncias de terceros sin otro respaldo"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo que debe transcurrir desde la incautación para solicitar el decomiso por titular desconocido es de:", "o": ["Un año", "Seis meses", "Treinta días", "Dos años"], "a": 0, "e": "Art. 58. Los seis meses son del abandono tras absolución, art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, la incautación preventiva de bienes la ordena:", "o": ["El juez de control, previa solicitud fiscal", "El fiscal, con aval del órgano rector", "La policía de investigación, en flagrancia", "El órgano rector, por vía administrativa"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "mc", "q": "Según la LOCDOFT, el concepto de bienes incluye, a efectos de la ley, los medios que se pretendan utilizar para cometer los delitos:", "o": ["Aunque estén en poder de terceros no partícipes", "Solo si están en poder de los imputados del caso", "Solo si fueron efectivamente utilizados", "Solo si se trata de bienes muebles"], "a": 0, "e": "Art. 4, numeral 6."}, {"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, se incautan alimentos perecederos. Para evitar su deterioro, el juez de control, previo inventario y oídos los terceros de buena fe:", "o": ["Puede autorizar su venta o uso con fines sociales", "Debe ordenar su destrucción inmediata y documentada", "Debe esperar la sentencia definitiva", "Los devuelve al imputado en custodia"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la LOCDOFT, la incidencia de oposición al decomiso no interrumpe el proceso penal.", "a": true, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, para la devolución de bienes en el procedimiento de decomiso, el interesado debe haber hecho todo lo razonable para impedir su uso ilegal.", "a": true, "e": "Art. 59, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, el dinero de la venta anticipada de bienes perecederos incautados:", "o": ["Se resguarda hasta la sentencia firme", "Se reparte entre los órganos actuantes", "Ingresa de inmediato al Tesoro Nacional", "Se entrega al imputado en caución"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, los ingresos que obtiene el servicio especializado por administrar y enajenar bienes pueden destinarse:", "o": ["A programas de prevención y a su autofinanciamiento", "Solo al pago de la deuda pública nacional vigente", "A indemnizar a los funcionarios actuantes", "A incrementar el situado constitucional"], "a": 0, "e": "Art. 61."}, {"t": "mc", "q": "Según la LOCDOFT, son responsables por hechos punibles cometidos por cuenta de ellas por sus órganos directivos o representantes:", "o": ["Las personas jurídicas, salvo el Estado y sus empresas", "Todas las personas jurídicas, incluso las estatales", "Solo las personas jurídicas del sector financiero", "Solo los directivos, nunca la persona jurídica"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según la LOCDOFT, en el abandono legal, el lapso para reclamar luego del cartel es de treinta días contados desde:", "o": ["La consignación del cartel", "La publicación de la sentencia", "La orden del tribunal de control", "La incautación del bien"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según la LOCDOFT, el servicio especializado de administración de bienes depende de:", "o": ["El órgano rector", "El Ministerio Público", "La UNIF", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 54."}, {"t": "mc", "q": "Según la LOCDOFT, las sanciones a las personas jurídicas se imponen:", "o": ["Por el juez en la sentencia definitiva", "Por el órgano de control en acto motivado", "Por el Ministerio Público en la acusación", "Por el juez de control en la audiencia preliminar"], "a": 0, "e": "Art. 32."}, {"t": "mc", "q": "Según la LOCDOFT, los capitales objeto del delito de legitimación:", "o": ["Serán decomisados o confiscados", "Pueden ser devueltos tras cumplir la pena", "Solo se afectan por el monto de la multa", "Se reparten entre las víctimas identificadas"], "a": 0, "e": "Art. 35, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, mientras no se cree el servicio especializado, los bienes incautados quedan a la orden de:", "o": ["El órgano rector", "El tribunal de control", "El Ministerio Público", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según la LOCDOFT, las unidades de investigación financiera creadas en los órganos policiales funcionan bajo la coordinación de:", "o": ["El Ministerio Público", "La UNIF", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 78."}, {"t": "mc", "q": "Según la LOCDOFT, la asistencia judicial recíproca solicitada a Venezuela se presta conforme a los tratados y, en ausencia de ellos:", "o": ["Sobre la base del principio de reciprocidad", "Solo si el TSJ la autoriza expresamente", "Solo con las Recomendaciones del GAFI", "No se presta en ningún supuesto"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para jueces y fiscales en estos delitos corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Colegio de Abogados"], "a": 0, "e": "Art. 6, numeral 5."}, {"t": "mc", "q": "Según la LOCDOFT, un extranjero comete en el exterior un delito de la ley que atenta contra los intereses patrimoniales de la República. Sobre su enjuiciamiento:", "o": ["Queda sujeto a esta ley venezolana", "Solo procede si es detenido en Venezuela", "Solo procede si su país lo autoriza", "Corresponde solo al Estado del hecho"], "a": 0, "e": "Art. 73, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, Venezuela puede autorizar el decomiso o la confiscación del producto de los delitos o de:", "o": ["Bienes de valor equivalente al producto", "Solo el bien exacto obtenido del delito", "Todo el patrimonio familiar del imputado", "Solo los bienes situados en el exterior"], "a": 0, "e": "Art. 86, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, si la ejecución de una solicitud requiere gastos cuantiosos, los Estados:", "o": ["Se consultarán sobre términos y modo de pago", "Los dividen automáticamente por mitades", "Los trasladan siempre al Estado requirente", "Deben rechazar de plano la solicitud"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según la LOCDOFT, para ejecutar una solicitud extranjera de decomiso se requiere:", "o": ["La doble incriminación", "Una sentencia del TSJ", "La extradición previa", "El aval del GAFI"], "a": 0, "e": "Art. 88."}, {"t": "mc", "q": "Según la LOCDOFT, coordinar con órganos nacionales e internacionales las operaciones de prevención y represión corresponde, sin perjuicio de otras competencias, a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Fuerza Armada"], "a": 0, "e": "Art. 6, numeral 1."}, {"t": "vf", "q": "Según la LOCDOFT, la doble incriminación es requisito general para toda diligencia de asistencia, incluso para recibir un testimonio.", "a": false, "e": "Art. 88: la exige para las solicitudes de decomiso e identificación e incautación allí referidas."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la LOCDOFT, el principio de jurisdicción extraterritorial no se aplica si la persona:", "o": ["Fue juzgada en otro país y cumplió la condena", "Fue investigada antes en otro país", "Fue absuelta por falta de pruebas en primera instancia", "Reside legalmente en otro país"], "a": 0, "e": "Art. 73, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, intercambiar información con entidades homólogas extranjeras y suscribir memorandos para ello corresponde a:", "o": ["La UNIF", "El órgano de control", "El Ministerio Público", "El sujeto obligado"], "a": 0, "e": "Art. 25, numeral 5."}, {"t": "vf", "q": "Según la LOCDOFT, un ejecutivo de alto nivel de una corporación propiedad de un gobierno extranjero puede ser persona expuesta políticamente.", "a": true, "e": "Art. 4, numeral 19."}, {"t": "mc", "q": "Según la LOCDOFT, un abogado en libre ejercicio es sujeto obligado cuando:", "o": ["Realiza transacciones para un cliente en actividades listadas", "Representa a un cliente ante un tribunal en un juicio penal", "Ejerce la profesión en cualquier especialidad", "Está inscrito en el Colegio de Abogados"], "a": 0, "e": "Art. 9, numeral 9."}, {"t": "vf", "q": "Según la LOCDOFT, las normas de alcance extraterritorial pueden dejar de cumplirse por un sujeto obligado que invoque las reglas de otra jurisdicción.", "a": false, "e": "Art. 3: no puede oponerse el cumplimiento respecto de otras jurisdicciones."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "vf", "q": "Según la LOCDOFT, el régimen de personas expuestas políticamente cubre a quienes son, han sido o serán considerados bajo ese perfil.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, los familiares cercanos de una persona expuesta políticamente incluyen, según la ley:", "o": ["Padres, hermanos, cónyuges, hijos y parientes políticos", "Solo hijos y cónyuges de la persona expuesta", "Solo quienes habiten con la persona expuesta", "Parientes hasta el sexto grado de consanguinidad o afinidad"], "a": 0, "e": "Art. 4, numeral 19."}, {"t": "vf", "q": "Según la LOCDOFT, las denegaciones de asistencia judicial recíproca deben ser motivadas.", "a": true, "e": "Art. 81, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, la documentación bancaria y financiera puede entregarse en asistencia mutua mediante:", "o": ["Copias certificadas de los documentos pertinentes", "Solo informe resumido de la autoridad requerida", "Solo con el consentimiento del titular", "Exclusivamente por la vía de la UNIF"], "a": 0, "e": "Art. 79, numeral 4."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, según la disposición transitoria de la ley, dependía antes de su adecuación de:", "o": ["La Superintendencia del Sector Bancario", "El Ministerio de Relaciones Interiores", "El Banco Central de Venezuela", "La Fiscalía General de la República"], "a": 0, "e": "Disposición transitoria quinta."}, {"t": "mc", "q": "Según la LOCDOFT, el producto de un delito const GR=D.groups, ALL=D.all, PASS=0.8;
const app=document.getElementById('app');
let st=null, immediate=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){
  st=null;
  let h=`<h1>${esc(D.titulo)}</h1><p class="mut">${esc(D.sub)}</p>`;
  h+=`<div class="card menu"><h2 style="margin-top:0">Simulacro aleatorio</h2>
      <button class="p" onclick="start(-1)"><b>50 preguntas de todo el temario</b><br><span style="opacity:.85">Se arma distinto cada vez, con ${ALL.length} preguntas disponibles</span></button></div>`;
  GR.forEach((g,gi)=>{
    h+=`<h2>${esc(g.titulo)}</h2><div class="card menu">`;
    g.exams.forEach((e,ei)=>{
      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;
    });
    h+='</div>';
  });
  h+=`<label class="t"><input type="checkbox" id="imm" ${immediate?'checked':''} onchange="immediate=this.checked"> Corregir cada pregunta al contestarla. Desactívalo para simular el examen real y ver la nota solo al final.</label>
      <p class="mut">Verdadero o falso y selección simple. Se aprueba con 80 %, es decir 40 de 50. Al terminar verás la nota y la explicación de cada error.</p>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(gi,ei){
  let qs,titulo;
  if(gi===-1){qs=shuffle(ALL).slice(0,50);titulo='Simulacro aleatorio';}
  else{const e=GR[gi].exams[ei];qs=shuffle(e.q);titulo=e.titulo;}
  qs=qs.map(prep);
  st={titulo,qs,i:0,ans:qs.map(()=>null)};
  render();
}
function pick(k){
  const a=st.ans[st.i];
  if(a&&a.locked)return;
  st.ans[st.i]={sel:k,locked:immediate};
  render();
}
function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
