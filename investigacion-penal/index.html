ministrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "vf", "q": "Según el GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "vf", "q": "Según el GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "mc", "q": "Según la LOCDOFT, si quien revela la identidad del agente encubierto es un funcionario público, la pena es de:", "o": ["Quince a veinte años, más inhabilitación", "Seis a ocho años, más inhabilitación", "Quince a veinte años, sin accesorias", "Ocho a doce años, más destitución"], "a": 0, "e": "Art. 72: inhabilitación por quince años tras cumplir la pena."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la LOCDOFT, si hay oposición en el decomiso, el fiscal contesta y consigna pruebas dentro de:", "o": ["Cinco días siguientes a su notificación", "Tres días siguientes a su notificación", "Ocho días siguientes a su notificación", "Treinta días siguientes a su notificación"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Según la LOCDOFT, la delincuencia organizada supone la acción u omisión de:", "o": ["Tres o más personas asociadas por cierto tiempo", "Dos o más personas asociadas por cierto tiempo", "Tres o más personas reunidas de forma ocasional", "Cinco o más personas con jerarquía definida"], "a": 0, "e": "Art. 4, numeral 9. Trampa: se cambia el número o se quita la permanencia."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre empresa y cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a un sujeto obligado por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "vf", "q": "Según la LOCDOFT, revelar un reporte al cliente se sanciona con una multa mayor que la de no reportar.", "a": true, "e": "Arts. 13 y 14: 1.000 a 3.000 U.T. frente a 500 a 1.000 U.T. Trampa: se espera que omitir el reporte sea lo más grave."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "mc", "q": "Un sujeto obligado con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "Un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Según la LOCDOFT, los documentos deben conservarse por el plazo legal en forma:", "o": ["Física y digital", "Física, y digital si el órgano de control lo exige", "Digital, y física solo para los originales", "Física o digital, a elección del sujeto obligado"], "a": 0, "e": "Art. 10. Trampa: las dos formas son acumulativas, no alternativas."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "vf", "q": "Según la LOCDOFT, las organizaciones con fines políticos y los grupos de electores son sujetos obligados.", "a": true, "e": "Art. 9, numeral 7. Trampa: se suele pensar solo en actividades económicas."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "vf", "q": "Según la LOCDOFT, no remitir el reporte de transacciones en efectivo se sanciona con la misma multa que no reportar una actividad sospechosa.", "a": true, "e": "Arts. 13 y 17: 500 a 1.000 U.T. en ambos casos. Trampa: se espera una escala distinta."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, mantener cuentas anónimas o con nombres ficticios se sanciona con multa de:", "o": ["500 a 1.000 U.T.", "300 a 500 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 11. Trampa: 1.000 a 3.000 U.T. es la multa por no identificar al beneficiario final."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la tarifa se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "vf", "q": "Según la LOCDOFT, durante una investigación penal, el sujeto obligado puede negar asistencia al cliente investigado para protegerse.", "a": false, "e": "Art. 15: no puede negarle asistencia, suspender la relación ni cerrar cuentas sin autorización de un juez. Trampa: la reacción intuitiva es la prohibida."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, no reportar una actividad sospechosa se sanciona con multa de:", "o": ["500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 13. Trampa: revelar el reporte se castiga más, con 1.000 a 3.000 U.T."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "Según el GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "vf", "q": "Según el GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "La verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, Venezuela es miembro pleno del GAFIC y no del GAFILAT.", "a": true, "e": "Sección de antecedentes y contexto regional."}, {"t": "mc", "q": "Según el GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "mc", "q": "Según el GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "vf", "q": "Según el GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "Según el GAFI, cuando el país anfitrión de una filial es menos exigente que el país de origen, la filial debe aplicar:", "o": ["Las medidas del país de origen, en lo que el anfitrión permita", "Las medidas del país anfitrión, por el principio territorial", "Las medidas que elija la filial según su propio riesgo", "Las medidas del país anfitrión, informando a la matriz"], "a": 0, "e": "R.18. Trampa: el principio territorial."}, {"t": "mc", "q": "Si un ROS se envía con información incompleta o errónea, ¿qué consecuencia tiene?", "o": ["Reduce la utilidad de la inteligencia", "Equivale a no haber reportado", "Anula la protección legal del reportante", "Traslada el análisis al órgano de control"], "a": 0, "e": "La calidad importa."}, {"t": "mc", "q": "Un empleado de un sujeto obligado recibe de un cliente un regalo costoso a cambio de acelerar un trámite. ¿Cómo debe interpretarse?", "o": ["Posible corrupción interna que se reporta al Oficial", "Obsequio normal que puede aceptarse con discreción", "Incentivo aceptable si el trámite es legítimo", "Asunto personal que no concierne a la empresa"], "a": 0, "e": "Prevención de corrupción interna."}, {"t": "mc", "q": "Según el GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "vf", "q": "Según el GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "vf", "q": "Según el GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "mc", "q": "Según el GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "vf", "q": "Según el GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "mc", "q": "Según el GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "mc", "q": "Según el GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "mc", "q": "Según el GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "vf", "q": "Según el GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "La información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "vf", "q": "Según el GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la tarifa y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Responde por todo incumplimiento ocurrido durante su gestión", "Responde en lo administrativo, pero no en lo penal ni civil", "Responde la junta directiva, pues el oficial solo recomienda"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "vf", "q": "Las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "vf", "q": "Según el GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "Según el GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "vf", "q": "Según el GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}]}, {"titulo": "Normativa internacional · modelo 2", "q": [{"t": "mc", "q": "Según el GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "mc", "q": "Si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "Según el GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Tanto al comprador como al vendedor", "Solo al comprador, que aporta los fondos", "Solo al vendedor, que recibe los fondos", "Solo a quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "mc", "q": "Según el GAFI, en casinos, la debida diligencia se activa desde transacciones financieras de:", "o": ["USD/EUR 3.000", "USD/EUR 1.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "mc", "q": "Según el GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Según el GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "Según el GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información de una autoridad extranjera por vía no oficial. ¿Qué debe hacer?", "o": ["Canalizarla por mecanismos oficiales", "Responder directamente para colaborar", "Ignorarla por provenir del extranjero", "Informar al cliente de la solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["La sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según el GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "El autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "vf", "q": "Según el GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Según el GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "vf", "q": "Que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "vf", "q": "Según el GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "Una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "vf", "q": "Según el GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Según el GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "vf", "q": "Según el GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según el GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "vf", "q": "Según el GAFI, la unidad de inteligencia financiera debe poder pedir información adicional a los sujetos obligados.", "a": true, "e": "R.29. Trampa: se cree que solo recibe lo que se le envía."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["Cumplimiento técnico y efectividad del sistema", "Solo si el país tiene leyes contra el lavado vigentes", "Solo el número de condenas dictadas por lavado", "Solo el tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "vf", "q": "Según el GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según el GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Un supervisor encuentra que un sujeto obligado ha reportado cero ROS en cinco años pese a un volumen alto de operaciones. ¿Qué lectura es razonable?", "o": ["Posibles fallas de detección o de reporte", "Cartera limpia sin riesgo de lavado", "Mérito que reconoce el supervisor en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "vf", "q": "Según el GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "mc", "q": "Según el GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["E
