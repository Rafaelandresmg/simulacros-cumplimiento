odelo 2", "q": [{"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el seguimiento y la revisión del proceso de gestión del riesgo deben hacerse:", "o": ["En todas sus etapas, de forma planificada", "Al cierre de cada ejercicio económico", "Cuando se materializa un evento de pérdida", "Durante la auditoría externa anual"], "a": 0, "e": "Apartado 6.6. Trampa: limitarlo a un momento contradice el seguimiento continuo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, entre los principios de la gestión del riesgo figura que esta sea:", "o": ["Integrada en todas las actividades de la organización", "Delegada por completo en el área de cumplimiento", "Realizada cuando lo exija el supervisor del sector", "Limitada a los riesgos de cuantía significativa"], "a": 0, "e": "Apartado 4: integrada, estructurada, adaptada, inclusiva y dinámica. Trampa: delegarla o limitarla contradice la integración."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, las políticas y controles del sujeto obligado deben permitir, además de gestionar los riesgos identificados:", "o": ["Vigilar su aplicación y reforzarlos si hace falta", "Eliminar por completo los riesgos de la cartera", "Trasladar los riesgos residuales al supervisor", "Prescindir de la evaluación del año siguiente"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: no es un enfoque de riesgo cero ni se traslada la responsabilidad."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, los factores humanos y culturales influyen en todos los aspectos de la gestión del riesgo.", "a": true, "e": "Apartado 4. Trampa: se cree que basta un buen modelo técnico."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la gestión de primera línea es responsable de:", "o": ["Lograr los objetivos y gestionar sus riesgos", "Dar aseguramiento independiente al gobierno", "Aprobar el apetito de riesgo de la entidad", "Auditar los controles de la segunda línea"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: el aseguramiento independiente es de la tercera línea y el apetito lo fija el órgano de gobierno."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe basarse en la mejor información disponible, considerando sus limitaciones e incertidumbres.", "a": true, "e": "Apartado 4. Trampa: se cree que solo valen datos históricos completos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo relacionado con el cliente:", "o": ["Una sociedad con accionistas nominales o acciones al portador", "Una empresa que cotiza en bolsa con divulgación de información", "Una entidad pública o una empresa del Estado", "Un plan de pensiones sin opción de rescate anticipado"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["Excluye sin evaluar y empuja a canales informales", "Constituye la mejor práctica que exige el GAFI", "Resulta obligatorio si el sector tiene riesgo alto", "Carece de relevancia para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Su monto reducido por cada operación", "El volumen total vendido en el año", "El país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}]}, {"titulo": "Enfoque basado en riesgo · modelo 3", "q": [{"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, son ejemplos de factores de mayor riesgo por producto o canal la banca privada y:", "o": ["Las relaciones o transacciones no presenciales", "Las cuentas de nómina de entidades públicas", "Los planes de pensiones de empleados", "Las pólizas de vida de prima baja"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el riesgo se define como:", "o": ["El efecto de la incertidumbre sobre los objetivos", "La probabilidad de que ocurra una pérdida económica", "La suma de las amenazas y vulnerabilidades conocidas", "El daño que causa un evento ya materializado"], "a": 0, "e": "Definición de la norma. Trampa: las otras confunden riesgo con pérdida o con sus componentes."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), aportar experiencia, apoyo, seguimiento y cuestionamiento sobre la gestión del riesgo es un rol de:", "o": ["La segunda línea", "La primera línea", "La tercera línea", "El auditor externo"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: la tercera línea da aseguramiento independiente; la primera gestiona el riesgo."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la auditoría interna rinde cuentas al órgano de gobierno y es independiente de la gestión.", "a": true, "e": "Modelo de las tres líneas (2020). Trampa: se cree que depende de la gerencia general."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 19 del GAFI, la diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, el enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "vf", "q": "Según la LOCDOFT, una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Art. 4, numeral 2. Esa es la secuencia lógica."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe ser dinámica: anticipar, detectar y responder a los cambios del contexto.", "a": true, "e": "Apartado 4, principios. Trampa: se cree que la evaluación es un ejercicio único."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "mc", "q": "Según la LOCDOFT, una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "Art. 4, numeral 2. La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, los pagos recibidos de terceros desconocidos o no asociados figuran entre los ejemplos de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que basta identificar al titular."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "vf", "q": "Según la Recomendación 18 del GAFI, un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Según la LOCDOFT, ¿qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "Art. 4, numeral 2. El análisis media entre ambas."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo geográfico:", "o": ["Países con niveles significativos de corrupción", "Países con sistemas eficaces según evaluaciones mutuas", "Países con baja delincuencia según fuentes creíbles", "Países con seguimiento ordinario del GAFI"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: los otros son indicadores de menor riesgo o neutros."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la norma establece un único método obligatorio para calcular el riesgo inherente.", "a": false, "e": "La norma ofrece principios, un marco y un proceso, no un método único de cálculo. Trampa: se confunde un marco de referencia con una metodología cerrada."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la comunicación y consulta con las partes interesadas forma parte del proceso de gestión del riesgo.", "a": true, "e": "Apartado 6.2. Trampa: se cree que es un ejercicio técnico interno sin consulta."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Que se decida de forma informada y documentada", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la evaluación del riesgo comprende la identificación, el análisis y:", "o": ["La valoración", "El tratamiento", "La comunicación", "El registro"], "a": 0, "e": "Apartado 6.4. Trampa: el tratamiento viene después de la evaluación."}]}]}], "all": [{"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "Según la Recomendación 24 del GAFI, una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Debe declararlos porque exceden el umbral de US$10.000", "No debe declararlos porque el umbral es de US$15.000", "Debe declararlos solo si es extranjero no residente", "No debe declararlos si los fondos son de origen lícito"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Según la LOCDOFT, ¿en qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos y la ilicitud está en el destino", "El FT implica siempre grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante el traslado transfronterizo de efectivo", "El lavado solo se comete con fondos del narcotráfico"], "a": 0, "e": "Arts. 4, numeral 11, y 53. Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "Según la LOCDOFT, la delincuencia organizada supone la acción u omisión de:", "o": ["Tres o más personas asociadas por cierto tiempo", "Dos o más personas asociadas por cierto tiempo", "Tres o más personas reunidas de forma ocasional", "Cinco o más personas con jerarquía definida"], "a": 0, "e": "Art. 4, numeral 9. Trampa: se cambia el número o se quita la permanencia."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Arts. 13 y 17. Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "mc", "q": "Según la LOCDOFT, aprobar la vinculación de un cliente PEP corresponde a la alta gerencia; diseñar y aplicar la debida diligencia sobre ese cliente corresponde a:", "o": ["El sujeto obligado, supervisado por su órgano de control", "El órgano de control, en cada operación del cliente", "La UNIF, al recibir el primer reporte del cliente", "La ONCDOFT, mediante una autorización previa"], "a": 0, "e": "Art. 18. Trampa: el órgano de control supervisa, pero quien diseña y aplica los procedimientos es el sujeto obligado."}, {"t": "mc", "q": "Según la LOCDOFT, un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Art. 9, numeral 10. Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Providencia SAA-01-0536-2024 de SUDEASEG", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, las organizaciones con fines políticos y los grupos de electores son sujetos obligados.", "a": true, "e": "Art. 9, numeral 7. Trampa: se suele pensar solo en actividades económicas."}, {"t": "mc", "q": "Según la LOCDOFT, la ONCDOFT asesora técnicamente, en las relaciones internacionales sobre la materia, al ministerio con competencia en:", "o": ["Relaciones exteriores", "Planificación y finanzas", "Relaciones interiores y justicia", "Economía y comercio"], "a": 0, "e": "Art. 6, numeral 7. Trampa: la ONCDOFT depende del de relaciones interiores, pero asesora al de relaciones exteriores."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "vf", "q": "Según la LOCDOFT, la notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Art. 58. Es una garantía procesal."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "La norma del sector bancario se le aplica por analogía", "El órgano rector le fija los deberes caso por caso", "Los deberes nacen al inscribirse en el registro del órgano rector"], "a": 0, "e": "Art. 9. La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede requerir a los sujetos obligados información sobre transacciones que puedan vincularse con estos delitos, aunque no exista un reporte previo.", "a": true, "e": "Art. 25, numeral 2. Trampa: se cree que solo analiza lo que recibe por reporte."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Según la LOCDOFT, varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Art. 22. Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "mc", "q": "Según la LOCDOFT, un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Art. 32, numeral 4. Sanción de carácter reputacional."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}, {"t": "mc", "q": "Según la LOCDOFT, dirigir a los cuerpos de policía de investigaciones penales en estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El juez de control"], "a": 0, "e": "Art. 26. Trampa: el juez autoriza medidas, pero no dirige la investigación."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un reporte de sospecha", "Aceptarlo con monitoreo reforzado durante el primer año", "Iniciar la relación si el pago es por transferencia", "Pedir el dato en la renovación y vincularlo de inmediato"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "Según la LOCDOFT, dictar normas e instructivos que ayuden a los sujetos obligados a detectar patrones sospechosos corresponde a:", "o": ["Los órganos y entes de control", "La UNIF, mediante sus circulares", "La ONCDOFT, como órgano rector", "El Ministerio Público"], "a": 0, "e": "Art. 8, numeral 10. Trampa: la UNIF emite circulares sobre reportes, pero la ley asigna esta función a los órganos de control."}, {"t": "vf", "q": "Según la LOCDOFT, los representantes en el país de bancos o financiadoras extranjeras quedan sometidos a las disposiciones de la ley.", "a": true, "e": "Art. 20, parte final. Trampa: se cree que la regulación de su país de origen los exime."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "Arts. 1 y 2. El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Art. 4, numeral 2. Estructuración para evadir el reporte."}, {"t": "mc", "q": "Según la LOCDOFT, vigilar que los sujetos obligados cumplan programas actualizados de capacitación de su personal corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "El Ministerio Público", "Los colegios profesionales"], "a": 0, "e": "Art. 8, numeral 11. Trampa: la ONCDOFT capacita a funcionarios públicos (art. 6, num. 5), no vigila la capacitación del personal de los sujetos obligados."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Evaluar el riesgo de los productos antes de lanzarlos", "Garantizar la autonomía del oficial frente a la junta", "Mantener la gratuidad de la función de cumplimiento", "Respetar la buena fe contractual con el cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional en la materia, junto con la organización, control y supervisión a nivel nacional, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio de Relaciones Exteriores", "El Ministerio Público"], "a": 0, "e": "Art. 5. Trampa: la UNIF intercambia con sus homólogas, pero la rectoría de la cooperación es del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Art. 13. Son deberes distintos y concurrentes."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF coordina con la ONCDOFT y los órganos de control las acciones para promover la adecuada supervisión de los sujetos obligados.", "a": true, "e": "Art. 25, numeral 8. Trampa: se cree que la UNIF no interviene en la supervisión."}, {"t": "mc", "q": "Según la LOCDOFT, un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "Art. 36. La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo usa cuatro años de pena máxima y la LOCDOFT más de cinco", "Palermo usa cinco años de pena máxima y la LOCDOFT solo cuatro", "Palermo usa diez años y la LOCDOFT no define el concepto", "Palermo y la LOCDOFT usan cuatro años de pena máxima"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Según la LOCDOFT, si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "Art. 8, numeral 10. El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No configuran delincuencia organizada, que exige tres o más", "Configuran delincuencia organizada, que exige dos o más", "Configuran delincuencia organizada si actúan con fin de lucro", "No configuran delincuencia organizada salvo que sean extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Según la LOCDOFT, elevar a la ONCDOFT los planteamientos necesarios para prevenir y detectar estos delitos, según su ámbito, es obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados", "La UNIF", "Los oficiales de cumplimiento"], "a": 0, "e": "Art. 8, numeral 8. Trampa: los sujetos obligados se relacionan con su órgano de control, no con el rector por esta vía."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "vf", "q": "Según la LOCDOFT, remitir a la UNIF la información que esta requiera, en los plazos que fije, es también una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 9. Trampa: se cree que solo los sujetos obligados envían información a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia del oficial para reportar", "Refuerza el control interno sobre los reportes", "Requiere solo la aprobación previa del supervisor", "Aplica únicamente a los reportes de monto elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "vf", "q": "Según la LOCDOFT, la ONCDOFT depende jerárquicamente del ministerio con competencia en planificación y finanzas.", "a": false, "e": "Art. 5: depende del ministerio con competencia en relaciones interiores y justicia. Trampa: planificación y finanzas es el ministerio de la UNIF (art. 24)."}, {"t": "mc", "q": "Según la LOCDOFT, un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar, porque el deber legal no depende del cargo", "Consultar al cliente antes de decidir el reporte", "Dejar constancia interna y abstenerse de reportar", "Renunciar al cargo antes de presentar el reporte"], "a": 0, "e": "Art. 13. La independencia del cargo existe precisamente para esto."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, ante indicios de un hecho punible, presenta informes debidamente fundados a:", "o": ["El Ministerio Público", "El juez de control", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 25, numeral 6. Trampa: la UNIF no se dirige al juez; quien solicita medidas judiciales es el fiscal."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "La antigüedad del cliente justifica relajar los controles", "La condición de empresa regulada exime de los controles", "La autorización del oficial basta para relajar los controles"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "vf", "q": "Según la LOCDOFT, diseñar las directrices para el plan operativo anual de prevención de los órganos de control corresponde a la UNIF.", "a": false, "e": "Art. 6, numeral 2: corresponde a la ONCDOFT. Trampa: se cambia el organismo."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "Art. 8, numeral 3. La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF proporciona a la ONCDOFT la información necesaria para el diseño de políticas públicas.", "a": tr
