<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector investigación penal", "sub": "25 exámenes de 50 preguntas, 5 de ellos con el formato de la prueba de la ONCDOFT. Banco de 830 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Modelo ONCDOFT (RUF): 25 de verdadero o falso y 25 de selección simple, con el artículo citado", "exams": [{"titulo": "Modelo ONCDOFT 1", "orden": true, "q": [{"t": "vf", "q": "Según el artículo 76 de la LOCDOFT, a falta de tratado, la asistencia judicial recíproca se presta con base en el principio de reciprocidad.", "a": true, "e": "Art. 76."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo puede justificarse por razones políticas o ideológicas.", "a": false, "e": "Art. 53: no puede justificarse en ninguna circunstancia."}, {"t": "vf", "q": "Según el artículo 84 de la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los asume el Estado requirente, salvo otro acuerdo.", "a": true, "e": "Art. 84."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la simple adquisición o posesión de bienes producto de un delito no constituye legitimación de capitales.", "a": false, "e": "Art. 35, num. 3: está expresamente incluida."}, {"t": "vf", "q": "Según el artículo 64 de la LOCDOFT, la intercepción de comunicaciones requiere autorización del juez de control.", "a": true, "e": "Art. 64."}, {"t": "vf", "q": "Según el artículo 73 de la LOCDOFT, no se aplica la jurisdicción extraterritorial si el investigado ya fue juzgado en otro país y cumplió la condena.", "a": true, "e": "Art. 73."}, {"t": "vf", "q": "Según el artículo 30 de la LOCDOFT, no prescribe la acción penal de los delitos previstos en esa ley.", "a": true, "e": "Art. 30."}, {"t": "vf", "q": "Según el artículo 81 de la LOCDOFT, las denegaciones de asistencia judicial recíproca no necesitan motivación.", "a": false, "e": "Art. 81: serán motivadas."}, {"t": "vf", "q": "Según el artículo 58 de la LOCDOFT, transcurrido un año desde la incautación sin identificar al titular del bien, el fiscal solicita su decomiso.", "a": true, "e": "Art. 58."}, {"t": "vf", "q": "Según el artículo 31 de la LOCDOFT, el Estado y sus empresas son penalmente responsables como cualquier persona jurídica.", "a": false, "e": "Art. 31: se excluye al Estado y sus empresas."}, {"t": "vf", "q": "Según el artículo 63 de la LOCDOFT, estos delitos se enjuician por un procedimiento especial que excluye el Código Orgánico Procesal Penal.", "a": false, "e": "Art. 63: se sigue el procedimiento del COPP, lo previsto en la ley y demás normas aplicables."}, {"t": "vf", "q": "Según el artículo 27 de la LOCDOFT, son delitos de delincuencia organizada también los del Código Penal y leyes especiales cuando los comete un grupo de delincuencia organizada.", "a": true, "e": "LOCDOFT, art. 27."}, {"t": "vf", "q": "Según el artículo 67 de la LOCDOFT, la autorización de la operación encubierta la da el juez de control de la circunscripción donde el fiscal inició la investigación, y es válida en todo el territorio.", "a": true, "e": "Art. 67."}, {"t": "vf", "q": "Según el artículo 29 de la LOCDOFT, es agravante cometer el delito utilizando a niños, niñas o adolescentes.", "a": true, "e": "Art. 29, num. 1."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la legitimación de capitales se castiga con prisión de diez a quince años y multa equivalente al incremento patrimonial ilícito.", "a": true, "e": "Art. 35."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas no acarrea responsabilidad penal, civil ni administrativa para quien lo suscribe.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 52 de la LOCDOFT, el acto terrorista se castiga con prisión de quince a veinte años.", "a": false, "e": "Art. 52: prisión de veinticinco a treinta años."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo se castiga aunque los fondos no se hayan utilizado efectivamente.", "a": true, "e": "Art. 53."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, los directivos o empleados que por negligencia contribuyan a la legitimación sin participar en ella son penados con prisión de tres a seis años.", "a": true, "e": "Art. 36."}, {"t": "vf", "q": "Según el artículo 28 de la LOCDOFT, cuando un delito lo comete un grupo de delincuencia organizada, la pena se incrementa en un tercio.", "a": false, "e": "Art. 28: se incrementa en la mitad."}, {"t": "vf", "q": "Según el artículo 55 de la LOCDOFT, la incautación preventiva la ordena el juez de control a solicitud del fiscal del Ministerio Público.", "a": true, "e": "Art. 55."}, {"t": "vf", "q": "Según el artículo 60 de la LOCDOFT, tras una sentencia absolutoria, si el titular no reclama el bien en seis meses, el fiscal solicita su decomiso.", "a": true, "e": "Art. 60."}, {"t": "vf", "q": "Según el artículo 72 de la LOCDOFT, revelar la identidad de un agente encubierto se castiga con prisión de seis a ocho años.", "a": true, "e": "Art. 72. Si es funcionario, de quince a veinte años."}, {"t": "vf", "q": "Según el artículo 32 de la LOCDOFT, la clausura definitiva de la persona jurídica procede en caso de comisión intencional de los delitos tipificados en esa ley.", "a": true, "e": "Art. 32, num. 1."}, {"t": "vf", "q": "Según el artículo 33 de la LOCDOFT, el funcionario público que participe en estos delitos queda impedido de ejercer funciones públicas de uno a quince años después de cumplir la pena.", "a": true, "e": "Art. 33."}, {"t": "mc", "q": "Según el artículo 30 de la LOCDOFT, ¿qué acciones penales no prescriben?", "o": ["Las de los delitos previstos en esa ley, contra el patrimonio público y de tráfico de drogas", "Solo las del homicidio por encargo cometido por orden de un grupo de delincuencia organizada", "Solo las de legitimación de capitales y financiamiento al terrorismo, y ninguna otra", "Ninguna: todas las acciones penales de esa ley prescriben a ué pena tiene el funcionario policial o militar que revele la identidad de un agente encubierto?", "o": ["Prisión de quince a veinte años e inhabilitación", "Prisión de seis a ocho años, sin inhabilitación", "Prisión de tres a seis años y multa accesoria", "Destitución del cargo, sin pena privativa de libertad"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "Según el artículo 52 de la LOCDOFT, ¿qué pena tiene quien realice o trate de realizar actos terroristas?", "o": ["Prisión de veinticinco a treinta años", "Prisión de quince a veinticinco años", "Prisión de veinte a veinticinco años", "Prisión de diez a quince años"], "a": 0, "e": "Art. 52."}, {"t": "mc", "q": "Según el artículo 81 de la LOCDOFT, ¿cuál es causa para denegar la asistencia judicial recíproca?", "o": ["Que menoscabe la soberanía, la seguridad o el orden público", "Que el delito investigado sea de cuantía económica reducida", "Que el Estado requirente no sea un país limítrofe con Venezuela", "Que el investigado se encuentre prófugo de la justicia"], "a": 0, "e": "Art. 81, num. 2."}, {"t": "mc", "q": "Según el artículo 68 de la LOCDOFT, la operación encubierta se autoriza, entre otros casos, cuando:", "o": ["La investigación aparezca como imposible o sumamente difícil", "El investigado sea un funcionario público de alto nivel del Estado", "La pena del delito investigado sea menor de cinco años de prisión", "El fiscal lo considere conveniente, sin otra justificación"], "a": 0, "e": "Art. 68, num. 1."}, {"t": "mc", "q": "Según el artículo 58 de la LOCDOFT, ¿cuánto tiempo debe pasar desde la incautación sin identificar al titular para pedir el decomiso?", "o": ["Un año", "Seis meses", "Dos años", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según el artículo 31 de la LOCDOFT, ¿qué personas jurídicas quedan excluidas de responsabilidad?", "o": ["El Estado y sus empresas", "Las organizaciones sin fines de lucro", "Los partidos y organizaciones políticas", "Las sociedades extranjeras"], "a": 0 uencia organizada se castiga por el solo hecho de la asociación.", "a": true, "e": "Art. 37: prisión de seis a diez años."}, {"t": "vf", "q": "Según el artículo 76 de la LOCDOFT, a falta de tratado, la asistencia judicial recíproca se presta con base en el principio de reciprocidad.", "a": true, "e": "Art. 76."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo puede justificarse por razones políticas o ideológicas.", "a": false, "e": "Art. 53: no puede justificarse en ninguna circunstancia."}, {"t": "vf", "q": "Según el artículo 84 de la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los asume el Estado requirente, salvo otro acuerdo.", "a": true, "e": "Art. 84."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la simple adquisición o posesión de bienes producto de un delito no constituye legitimación de capitales.", "a": false, "e": "Art. 35, num. 3: está expresamente incluida."}, {"t": "vf", "q": "Según el artículo 64 de la LOCDOFT, la intercepción de comunicaciones requiere autorización del juez de control.", "a": true, "e": "Art. 64."}, {"t": "vf", "q": "Según el artículo 73 de la LOCDOFT, no se aplica la jurisdicción extraterritorial si el investigado ya fue juzgado en otro país y cumplió la condena.", "a": true, "e": "Art. 73."}, {"t": "vf", "q": "Según el artículo 30 de la LOCDOFT, no prescribe la acción penal de los delitos previstos en esa ley.", "a": true, "e": "Art. 30."}, {"t": "vf", "q": "Según el artículo 81 de la LOCDOFT, las denegaciones de asistencia judicial recíproca no necesitan motivación.", "a": false, "e": "Art. 81: serán motivadas."}, {"t": "vf", "q": "Según el artículo 58 de la LOCDOFT, transcurrido un año desde la incautación sin identificar al titular del bien, el fiscal solicita su decomiso.", "a": true, "e": "Art. 58."}, {"t": "vf", "q": "Según el artículo 31 de la LOCDOFT, el Estado y sus empresas son penalmente responsables como cualquier persona jurídica.", "a": false, "e": "Art. 31: se excluye al Estado y sus empresas."}, {"t": "vf", "q": "Según el artículo 63 de la LOCDOFT, estos delitos se enjuician por un procedimiento especial que excluye el Código Orgánico Procesal Penal.", "a": false, "e": "Art. 63: se sigue el procedimiento del COPP, lo previsto en la ley y demás normas aplicables."}, {"t": "vf", "q": "Según el artículo 27 de la LOCDOFT, son delitos de delincuencia organizada también los del Código Penal y leyes especiales cuando los comete un grupo de delincuencia organizada.", "a": true, "e": "LOCDOFT, art. 27."}, {"t": "vf", "q": "Según el artículo 67 de la LOCDOFT, la autorización de la operación encubierta la da el juez de control de la circunscripción donde el fiscal inició la investigación, y es válida en todo el territorio.", "a": true, "e": "Art. 67."}, {"t": "vf", "q": "Según el artículo 29 de la LOCDOFT, es agravante cometer el delito utilizando a niños, niñas o adolescentes.", "a": true, "e": "Art. 29, num. 1."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la legitimación de capitales se castiga con prisión de diez a quince años y multa equivalente al incremento patrimonial ilícito.", "a": true, "e": "Art. 35."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas no acarrea responsabilidad penal, civil ni administrativa para quien lo suscribe.", "a": true, "e": "Art. 13."}, {"t": "vf", "q": "Según el artículo 52 de la LOCDOFT, el acto terrorista se castiga con prisión de quince a veinte años.", "a": false, "e": "Art. 52: prisión de veinticinco a treinta años."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo se castiga aunque los fondos no se hayan utilizado efectivamente.", "a": true, "e": "Art. 53."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, los directivos o empleados que por negligencia contribuyan a la legitimación sin participar en ella son penados con prisión de tres a seis años.", "a": true, "e": "Art. 36."}, {"t": "vf", "q": "Según el artículo 28 de la LOCDOFT, cuando un delito lo comete un grupo de delincuencia organizada, la pena se incrementa en un tercio.", "a": false, "e": "Art. 28: se incrementa en la mitad."}, {"t": "vf", "q": "Según el artículo 55 de la LOCDOFT, la incautación preventiva la ordena el juez de control a solicitud del fiscal del Ministerio Público.", "a": true, "e": "Art. 55."}, {"t": "mc", "q": "Según el artículo 30 de la LOCDOFT, ¿qué acciones penales no prescriben?", "o": ["Las de los delitos previstos en esa ley, contra el patrimonio público y de tráfico de drogas", "Solo las del homicidio por encargo cometido por orden de un grupo de delincuencia organizada", "Solo las de legitimación de capitales y financiamiento al terrorismo, y ninguna otra", "Ninguna: todas las acciones penales de esa ley prescriben a los quince años del hecho"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según el artículo 45 de la LOCDOFT, obstruir la justicia en beneficio de un grupo de delincuencia organizada destruyendo o alterando evidencias se castiga con prisión de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Tres a seis años"], "a": 0, "e": "Art. 45, num. 4."}, {"t": "mc", "q": "Según el artículo 53 de la LOCDOFT, ¿qué pena tiene el financiamiento al terrorismo?", "o": ["Prisión de quince a veinticinco años", "Prisión de veinticinco a treinta años", "Prisión de diez a quince años", "Prisión de seis a diez años"], "a": 0, "e": "Art. 53. De veinticinco a treinta es la pena del acto terrorista (art. 52)."}, {"t": "mc", "q": "Según el artículo 73 de la LOCDOFT, la jurisdicción extraterritorial no se aplica cuando el investigado:", "o": ["Ya fue juzgado en otro país y cumplió la condena", "Es extranjero y no reside en el territorio nacional", "Cometió el delito en alta mar o en el mar territorial", "Se encuentra en territorio venezolano al ser detenido"], "a": 0, "e": "Art. 73."}, {"t": "mc", "q": "Según el artículo 60 de la LOCDOFT, finalizado el proceso con sentencia absolutoria, ¿en qué plazo sin reclamo del titular se pide el decomiso?", "o": ["Seis meses", "Un año", "Treinta días", "Tres meses"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según el artículo 33 de la LOCDOFT, el funcionario público que participe en estos delitos queda impedido de ejercer funciones públicas por:", "o": ["Uno a quince años después de cumplir la pena", "Cinco años contados desde la sentencia firme", "Diez años contados desde su detención preventiva", "Toda la vida, salvo indulto presidencial"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según el artículo 55 de la LOCDOFT, ante bienes perecederos incautados preventivamente, el fiscal solicita al juez:", "o": ["Su disposición anticipada", "Su destrucción inmediata", "Su devolución al investigado", "Su donación a una OSFL"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según el artículo 56 de la LOCDOFT, durante la investigación el fiscal puede pedir al juez de control:", "o": ["El bloqueo de cuentas y la clausura preventiva de locales vinculados", "El decomiso definitivo de todos los bienes del investigado", "La disolución inmediata de la persona jurídica investigada", "La publicación de la acusación en un diario de circulación nacional"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según el artículo 37 de la LOCDOFT, pertenecer a un grupo de delincuencia organizada se castiga con prisión de:", "o": ["Seis a diez años", "Tres a seis años", "Diez a quince años", "Ocho a doce años"], "a": 0, "e": "Art. 37."}, {"t": "mc", "q": "Según el artículo 84 de la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los asume:", "o": ["El Estado requirente, salvo otro acuerdo", "El Estado requerido, en todos los casos", "Ambos Estados, por partes iguales siempre", "El investigado, si resulta condenado"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según el artículo 28 de la LOCDOFT, si un delito lo comete un grupo de delincuencia organizada, la pena:", "o": ["Se incrementa en la mitad", "Se incrementa en un tercio", "Se duplica", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28."}, {"t": "mc", "q": "Según el artículo 32 de la LOCDOFT, ¿cuál de estas sanciones puede imponer el juez a una persona jurídica?", "o": ["Publicación íntegra de la sentencia a su costa", "Prisión de sus accionistas minoritarios", "Disolución de los sindicatos de la empresa", "Suspensión del pago de salarios"], "a": 0, "e": "Art. 32, num. 4."}, {"t": "mc", "q": "Según el artículo 76 de la LOCDOFT, a falta de tratado, la asistencia judicial recíproca se presta con base en:", "o": ["El principio de reciprocidad", "La cortesía diplomática discrecional", "Una orden de la Corte Penal Internacional", "La solicitud de la INTERPOL"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según el artículo 72 de la LOCDOFT, ¿qué pena tiene el funcionario policial o militar que revele la identidad de un agente encubierto?", "o": ["Prisión de quince a veinte años e inhabilitación", "Prisión de seis a ocho años, sin inhabilitación", "Prisión de tres a seis años y multa accesoria", "Destitución del cargo, sin pena privativa de libertad"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "Según el artículo 52 de la LOCDOFT, ¿qué pena tiene quien realice o trate de realizar actos terroristas?", "o": ["Prisión de veinticinco a treinta años", "Prisión de quince a veinticinco años", "Prisión de veinte a veinticinco años", "Prisión de diez a quince años"], "a": 0, "e": "Art. 52."}, {"t": "mc", "q": "Según el artículo 81 de la LOCDOFT, ¿cuál es causa para denegar la asistencia judicial recíproca?", "o": ["Que menoscabe la soberanía, la seguridad o el orden público", "Que el delito investigado sea de cuantía económica reducida", "Que el Estado requirente no sea un país limítrofe con Venezuela", "Que el investigado se encuentre prófugo de la justicia"], "a": 0, "e": "Art. 81, num. 2."}, {"t": "mc", "q": "Según el artículo 68 de la LOCDOFT, la operación encubierta se autoriza, entre otros casos, cuando:", "o": ["La investigación aparezca como imposible o sumamente difícil", "El investigado sea un funcionario público de alto nivel del Estado", "La pena del delito investigado sea menor de cinco años de prisión", "El fiscal lo considere conveniente, sin otra justificación"], "a": 0, "e": "Art. 68, num. 1."}, {"t": "mc", "q": "Según el artículo 58 de la LOCDOFT, ¿cuánto tiempo debe pasar desde la incautación sin identificar al titular para pedir el decomiso?", "o": ["Un año", "Seis meses", "Dos años", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según el artículo 31 de la LOCDOFT, ¿qué personas jurídicas quedan excluidas de responsabilidad?", "o": ["El Estado y sus empresas", "Las organizaciones sin fines de lucro", "Los partidos y organizaciones políticas", "Las sociedades extranjeras"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según el artículo 70 de la LOCDOFT, ¿quiénes pueden infiltrarse como agentes encubiertos?", "o": ["Los funcionarios de unidades especializadas, previa autorización judicial", "Cualquier particular que colabore con el fiscal y acepte el riesgo", "Los oficiales de cumplimiento de los sujetos obligados, con aviso a la UNIF", "Los funcionarios de la UNIF, sin necesidad de autorización judicial"], "a": 0, "e": "Art. 70."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena tiene la legitimación de capitales?", "o": ["Prisión de diez a quince años", "Prisión de ocho a doce años", "Prisión de seis a diez años", "Prisión de quince a veinticinco años"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, ¿qué pena tiene el empleado que por imprudencia, impericia o negligencia contribuya a la legitimación?", "o": ["Prisión de tres a seis años", "Prisión de uno a tres años", "Solo multa administrativa", "Prisión de seis a diez años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 64 de la LOCDOFT, ¿cuál de estas es una medida especial que requiere autorización del juez de control?", "o": ["La inmovilización de cuentas bancarias", "La solicitud de antecedentes penales", "La citación de testigos", "La revisión de registros públicos"], "a": 0, "e": "Art. 64, num. 2."}, {"t": "mc", "q": "Según el artículo 55 de la LOCDOFT, ¿quién ordena la incautación preventiva de los bienes?", "o": ["El juez de control, a solicitud del fiscal", "El fiscal del Ministerio Público, de oficio", "La UNIF, a solicitud del sujeto obligado", "El órgano rector, por vía administrativa"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según el artículo 29 de la LOCDOFT, ¿cuál es una circunstancia agravante?", "o": ["Cometer el delito contra hospitales o centros asistenciales", "Cometer el delito durante la noche o en días feriados", "Cometer el delito en una zona rural o poco poblada", "Cometer el delito sin violencia ni amenaza contra las personas"], "a": 0, "e": "Art. 29, num. 6."}]}]}, {"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "vf", "q": "Según la LOCDOFT, para que haya financiamiento al terrorismo, los fondos deben haberse usado efectivamente en un acto terrorista.", "a": false, "e": "Art. 53: se pena aunque los fondos no se usen ni se consume el acto. Trampa: se agrega un resultado que la ley no exige."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutarlo conforme al derecho interno del Estado requerido", "Aplicar directamente la ley del Estado que lo solicita", "Someter el caso a la Corte Internacional de Justicia", "Obtener antes el consentimiento expreso del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en estos temas, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "El CICPC"], "a": 0, "e": "Art. 6, numeral 9."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "vf", "q": "Según la LOCDOFT, la interceptación de comunicaciones puede autorizarse para fines de investigación penal y de inteligencia preventiva.", "a": false, "e": "Art. 65: únicamente a los fines de investigación penal. Trampa: se amplía la finalidad."}, {"t": "vf", "q": "Según la Recomendación 24 del GAFI, una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Según la LOCDOFT, incumplir el trámite de autorización de la entrega vigilada se pena con prisión de:", "o": ["Cinco a diez años", "Tres a seis años", "Seis a ocho años", "Ocho a doce años"], "a": 0, "e": "Art. 66, parte final."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "vf", "q": "Según la LOCDOFT, los establecimientos que venden teléfonos celulares nuevos y usados son sujetos obligados.", "a": true, "e": "Art. 9, numeral 10, literal j. Trampa: parece un sector ajeno a la materia."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "vf", "q": "Según la LOCDOFT, las razones ideológicas o religiosas pueden justificar el financiamiento al terrorismo cuando se prueba que eran el único móvil.", "a": false, "e": "Art. 53, parte final: ninguna circunstancia lo justifica."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que revela la identidad de un agente encubierto queda inhabilitado, tras cumplir la pena, por:", "o": ["Quince años", "Diez años", "Veinte años", "Cinco años"], "a": 0, "e": "Art. 72. Trampa: quince a veinte años es la pena de prisión."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "Según la LOCDOFT, una legitimación es cometida por un funcionario público que además se vale de una relación de confianza. El aumento de la pena es:", "o": ["De la mitad, por concurrir dos agravantes", "De un tercio, porque se absorben entre sí", "De dos tercios, un tercio por cada agravante", "Ninguno, al ser ya un delito agravado"], "a": 0, "e": "Art. 29, numerales 2 y 10, y parte final."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "vf", "q": "Según la LOCDOFT, el delito de asociación exige probar que el grupo cometió efectivamente alguno de los delitos para los que se formó.", "a": false, "e": "Art. 37: se pena por el solo hecho de la asociación."}, {"t": "mc", "q": "Según la Convención de Palermo, una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito investigado es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado se encuentra prófugo de la justicia"], "a": 0, "e": "Art. 18, párrafo 21. Causales previstas en los tratados."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Debe declararlos porque exceden el umbral de US$10.000", "No debe declararlos porque el umbral es de US$15.000", "Debe declararlos solo si es extranjero no residente", "No debe declararlos si los fondos son de origen lícito"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica en el plan", "Excluye de la matriz el de baja probabilidad", "Excluye de la matriz el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, ¿cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según la LOCDOFT, la pena de prisión por legitimación de capitales es de:", "o": ["Diez a quince años", "Ocho a doce años", "Quince a veinticinco años", "Seis a diez años"], "a": 0, "e": "Art. 35. Trampa: seis a diez es la pena por asociación; quince a veinticinco, la de financiamiento al terrorismo."}, {"t": "mc", "q": "Según la LOCDOFT, una remesa vigilada, autorizada por un juez de control de Caracas donde el fiscal inició la investigación, transita por Zulia. La actuación en Zulia:", "o": ["Queda cubierta por la autorización inicial", "Exige autorización del juez de Zulia", "Necesita el aval del Tribunal Supremo", "Requiere una comisión del juez de Caracas"], "a": 0, "e": "Art. 67."}]}, {"titulo": "Examen integral 2", "q": [{"t": "mc", "q": "Según la LOCDOFT, no es posible la comparecencia en el Estado requirente de una persona. La ley prevé como alternativa:", "o": ["La videoconferencia", "La declaración jurada escrita", "La detención con fines de traslado", "La sustitución por un testigo referencial"], "a": 0, "e": "Art. 79."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Según la LOCDOFT, un gerente de sujeto obligado conoce el origen ilícito de los fondos y ordena fraccionarlos para ocultarlos. Su conducta se ubica en:", "o": ["La legitimación de capitales dolosa", "El incumplimiento culposo de directivos", "La obstrucción de la justicia", "La sola falta de reporte sancionable con multa"], "a": 0, "e": "Art. 35, numeral 1. El art. 36 exige no haber tomado parte."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente no residente figura entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que solo importan los países de riesgo."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional contra estos grupos se basa, entre otros lineamientos, en:", "o": ["Privarlos del producto de sus actividades", "Dejar la persecución al Estado de origen", "Unificar los códigos penales de la región", "Sustituir la jurisdicción nacional afectada"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "mc", "q": "Según la LOCDOFT, un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Art. 9, numeral 10. Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Según la Convención de Palermo, la obstrucción de la justicia se penaliza en su artículo:", "o": ["23", "8", "24", "25"], "a": 0, "e": "El 24 protege a los testigos y el 25 a las víctimas. Trampa: artículos vecinos de materia cercana."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la LOCDOFT, al decomisar bienes a solicitud de otra parte, Venezuela podrá concertar acuerdos para:", "o": ["Repartir con otras partes el producto o sus fondos", "Entregar todo sin más al Estado que lo requiere", "Destinar todo a reservas internacionales", "Devolver los bienes al condenado extranjero"], "a": 0, "e": "Art. 89, numeral 2."}, {"t": "mc", "q": "Según la LOCDOFT, en un proceso por legitimación, quién puede declarar interpuesta persona a quien aparece como titular de bienes:", "o": ["El juez, a instancia del Ministerio Público", "El fiscal, de oficio y sin intervención judicial", "La UNIF, en su informe de inteligencia", "El órgano rector, al recibir los bienes"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la LOCDOFT, un contador guarda en su caja fuerte dinero de un cliente sabiendo que proviene de una extorsión, sin invertirlo ni transferirlo. Esa conducta:", "o": ["Encaja en la legitimación por custodia", "Es atípica porque no hubo conversión", "Solo configura encubrimiento común", "Es una falta administrativa del gremio"], "a": 0, "e": "Art. 35, numeral 4: el resguardo y la custodia bastan."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, adaptar la gestión del riesgo al contexto externo e interno de la organización corresponde al principio de que sea:", "o": ["Adaptada", "Inclusiva", "Dinámica", "Integrada"], "a": 0, "e": "Apartado 4. Trampa: los otros también son principios, pero no ese."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "Según la LOCDOFT, un tercero pide devolución de un inmueble que compró al imputado justo antes de una incautación previsible, para sustraerlo de ella. El tribunal debería:", "o": ["Negarla, al transferirse para evadir la medida", "Concederla, si acredita el título de propiedad", "Concederla, si pagó un precio de mercado", "Remitir el asunto a la jurisdicción civil"], "a": 0, "e": "Art. 59, numeral 3."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Según la LOCDOFT, la ley del país de una sucursal extranjera impide aplicar los controles venezolanos. La sucursal debe:", "o": ["Informar a la oficina principal y exigirse el estándar más alto", "Aplicar solo la ley local sin informar a la oficina principal", "Cerrar operaciones de inmediato", "Pedir una excepción a la UNIF"], "a": 0, "e": "Art. 20."}, {"t": "vf", "q": "Según la LOCDOFT, el tipo culposo de directivos y empleados exige que hayan tomado parte en el delito de legitimación.", "a": false, "e": "Art. 36: favorecen o contribuyen por imprudencia, impericia o negligencia, sin haber tomado parte en él. Trampa: se invierte un elemento del tipo."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las empresas que manejan mucho efectivo figuran entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el riesgo depende solo del monto de cada operación."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la actividad sospechosa se diferencia de la inusual en que la primera supone:", "o": ["Un análisis que hace presumir fondos ilícitos", "Un monto superior a USD 10.000 en una operación", "Una orden judicial previa de examen", "La condena de alguno de los clientes"], "a": 0, "e": "Art. 4, numeral 2."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "Según los datos de la Convención Interamericana contra la Corrupción, su entrada en vigor ocurrió en:", "o": ["1997", "1996", "2002", "2005"], "a": 0, "e": "Adoptada en Caracas en 1996. Trampa: 2005 es la entrada en vigor de Mérida."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}]}, {"titulo": "Examen integral 3", "q": [{"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios designados para bienes incautados, a los fines de su guarda y custodia, se asimilan a:", "o": ["Funcionarios públicos", "Auxiliares de justicia ad honorem", "Mandatarios del imputado", "Terceros civiles sin responsabilidad penal"], "a": 0, "e": "Art. 57."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), los roles de primera y segunda línea pueden combinarse o separarse según la organización.", "a": true, "e": "Modelo de las tres líneas (2020): no es una estructura rígida. Trampa: se cree que son compartimentos estancos."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "Según la LOCDOFT, para declarar interpuesta persona al titular aparente basta que surjan:", "o": ["Indicios suficientes de adquisición con el producto", "Sentencias firmes contra el titular aparente del bien", "Pruebas plenas de su integración al grupo", "Reportes múltiples de sujetos obligados"], "a": 0, "e": "Art. 55, parte final."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, el «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "vf", "q": "Según la LOCDOFT, un delito cometido por una sola persona nunca puede sancionarse conforme a la ley de delincuencia organizada.", "a": false, "e": "Art. 27: también se sancionan los cometidos por una sola persona, conforme al art. 4. Trampa: un adverbio absoluto."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "Según la LOCDOFT, el opositor no comparece, sin causa justificada, a la audiencia de decomiso. El juez:", "o": ["Declara desistida la oposición y decreta el decomiso, sin recurso", "Declara desistida la oposición, con apelación en cinco días", "Fija una nueva audiencia dentro de ocho días", "Decide conforme a los alegatos escritos previos"], "a": 0, "e": "Art. 58."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "mc", "q": "Según la LOCDOFT, la autorización cuya falta configura el tráfico ilícito de armas debe emanar de:", "o": ["La Fuerza Armada Nacional Bolivariana", "El órgano rector de la ley en la materia", "El Ministerio Público", "El tribunal de control"], "a": 0, "e": "Art. 38."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, conservar equipos exclusivamente destinados a fabricar moneda, como parte de un grupo criminal, se pena con:", "o": ["Doce a dieciocho años, aunque no se fabrique", "Doce a dieciocho años, solo si se fabricó", "Ocho a doce años, aunque no se fabrique", "Seis a diez años, solo si se distribuye"], "a": 0, "e": "Art. 51: basta fabricar, custodiar, ocultar o conservar los instrumentos."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "Según la LOCDOFT, el agente de operaciones encubiertas se define como un funcionario que:", "o": ["Asume una identidad diferente para infiltrarse", "Vigila desde el exterior sin contacto", "Colabora a cambio de reducción de pena", "Audita en secreto a los sujetos obligados"], "a": 0, "e": "Art. 4, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, una estafa del Código Penal ejecutada por un grupo de delincuencia organizada:", "o": ["Se considera delito de delincuencia organizada", "Sigue siendo solo delito común sin agravación", "Queda absorbida por el delito de asociación", "Solo se castiga con la pena de asociación"], "a": 0, "e": "Art. 27, con el aumento del art. 28."}, {"t": "mc", "q": "Según la LOCDOFT, la solicitud del Ministerio Público para interceptar o grabar comunicaciones debe ser:", "o": ["Razonada y previa a la autorización", "Verbal, con confirmación posterior", "Reservada y sin motivación escrita", "Conjunta con el órgano rector"], "a": 0, "e": "Art. 65."}, {"t": "mc", "q": "Según la LOCDOFT, si en la oposición al decomiso se promovieron pruebas, la audiencia oral se celebra dentro de:", "o": ["Ocho días siguientes a publicar el auto", "Tres días siguientes a publicar el auto", "Cinco días siguientes a publicar el auto", "Treinta días siguientes a publicar el auto"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, la experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}]}, {"titulo": "Examen integral 4", "q": [{"t": "mc", "q": "Según la LOCDOFT, amenazar a un testigo con un daño grave a su familia, para favorecer a un grupo criminal, se ubica en el tramo de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Diez a quince años"], "a": 0, "e": "Art. 45, numeral 2."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "Según la LOCDOFT, entre las autoridades principales de policía de investigaciones penales NO figura:", "o": ["El SENIAT", "El CICPC", "La Policía Nacional Bolivariana", "Los cuerpos de inteligencia del Estado"], "a": 0, "e": "Art. 26."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "mc", "q": "Según la LOCDOFT, el comercio ilícito de oro se castiga, con independencia de quien lo cometa, con prisión de:", "o": ["Ocho a doce años", "Diez a quince años", "Seis a diez años", "Doce a dieciocho años"], "a": 0, "e": "Art. 34."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, entre los principios de la gestión del riesgo figura que esta sea:", "o": ["Integrada en todas las actividades de la organización", "Delegada por completo en el área de cumplimiento", "Realizada cuando lo exija el supervisor del sector", "Limitada a los riesgos de cuantía significativa"], "a": 0, "e": "Apartado 4: integrada, estructurada, adaptada, inclusiva y dinámica. Trampa: delegarla o limitarla contradice la integración."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "mc", "q": "Según la LOCDOFT, los depositarios o administradores especiales de bienes incautados los designa:", "o": ["El órgano rector", "El juez de control", "El Ministerio Público", "El órgano de control"], "a": 0, "e": "Art. 57. Trampa: el juez ordena la incautación, pero no designa al depositario."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "Según la LOCDOFT, el intercambio de información con otros países se refiere, entre otros aspectos, a:", "o": ["Tipologías para falsificar pasaportes y documentos", "Las declaraciones tributarias de todo ciudadano", "Los antecedentes electorales de los investigados", "Las cuentas de todos los clientes bancarios"], "a": 0, "e": "Art. 75, numeral 2."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "vf", "q": "Según la LOCDOFT, el régimen de personas expuestas políticamente cubre a quienes son, han sido o serán considerados bajo ese perfil.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas coordinadas y eficaces contra la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal especial contra la corrupción", "Prohibir las donaciones a partidos políticos"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, las políticas y controles del sujeto obligado deben permitir, además de gestionar los riesgos identificados:", "o": ["Vigilar su aplicación y reforzarlos si hace falta", "Eliminar por completo los riesgos de la cartera", "Tras
