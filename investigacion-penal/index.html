ida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes para todos los Estados por igual", "Ambos son recomendaciones sin ningún efecto jurídico práctico", "El GAFI aprueba los tratados que firman sus miembros"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica en el plan", "Excluye de la matriz el de baja probabilidad", "Excluye de la matriz el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, ¿cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, ¿por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación inusual debe reportarse de inmediato a la unidad de inteligencia, sin análisis previo.", "a": false, "e": "Lo inusual se analiza; se reporta lo que queda sin justificación razonable. Trampa: se salta el análisis."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la tolerancia al riesgo, frente al apetito, es:", "o": ["La desviación aceptable respecto del apetito", "El riesgo máximo que la entidad puede soportar", "El riesgo que la entidad desea asumir", "El riesgo que queda tras los controles"], "a": 0, "e": "Trampa: el máximo soportable es la capacidad; el deseado, el apetito; el que queda, el residual."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el apetito de riesgo lo define el oficial de cumplimiento y lo informa a la junta directiva.", "a": false, "e": "Lo define y aprueba el órgano de dirección. Trampa: se invierte quién decide y quién informa."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el origen de los fondos y el origen de la riqueza son el mismo concepto.", "a": false, "e": "Fondos: de dónde viene el dinero de la operación. Riqueza: cómo se formó el patrimonio total. Trampa: se usan como sinónimos."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, adaptar la gestión del riesgo al contexto externo e interno de la organización corresponde al principio de que sea:", "o": ["Adaptada", "Inclusiva", "Dinámica", "Integrada"], "a": 0, "e": "Apartado 4. Trampa: los otros también son principios, pero no ese."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las empresas que manejan mucho efectivo figuran entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el riesgo depende solo del monto de cada operación."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente no residente figura entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que solo importan los países de riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), rendir cuentas a las partes interesadas por la supervisión de la organización corresponde a:", "o": ["El órgano de gobierno", "La primera línea", "La segunda línea", "La auditoría interna"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: la auditoría interna asegura al órgano de gobierno, pero no rinde cuentas en su lugar."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 6 del GAFI, confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, el análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una segmentación adecuada busca grupos homogéneos por dentro y distintos entre sí.", "a": true, "e": "Trampa: se cree que basta con dividir por tipo de persona."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), los roles de primera y segunda línea pueden combinarse o separarse según la organización.", "a": true, "e": "Modelo de las tres líneas (2020): no es una estructura rígida. Trampa: se cree que son compartimentos estancos."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el seguimiento y la revisión del proceso de gestión del riesgo deben hacerse:", "o": ["En todas sus etapas, de forma planificada", "Al cierre de cada ejercicio económico", "Cuando se materializa un evento de pérdida", "Durante la auditoría externa anual"], "a": 0, "e": "Apartado 6.6. Trampa: limitarlo a un momento contradice el seguimiento continuo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la revisión mensual de las alertas que generó el sistema de monitoreo es un control:", "o": ["Detectivo", "Preventivo", "Correctivo", "Disuasivo"], "a": 0, "e": "Trampa: el monitoreo posterior no impide la operación, la descubre."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, entre los principios de la gestión del riesgo figura que esta sea:", "o": ["Integrada en todas las actividades de la organización", "Delegada por completo en el área de cumplimiento", "Realizada cuando lo exija el supervisor del sector", "Limitada a los riesgos de cuantía significativa"], "a": 0, "e": "Apartado 4: integrada, estructurada, adaptada, inclusiva y dinámica. Trampa: delegarla o limitarla contradice la integración."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, las políticas y controles del sujeto obligado deben permitir, además de gestionar los riesgos identificados:", "o": ["Vigilar su aplicación y reforzarlos si hace falta", "Eliminar por completo los riesgos de la cartera", "Trasladar los riesgos residuales al supervisor", "Prescindir de la evaluación del año siguiente"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: no es un enfoque de riesgo cero ni se traslada la responsabilidad."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, los factores humanos y culturales influyen en todos los aspectos de la gestión del riesgo.", "a": true, "e": "Apartado 4. Trampa: se cree que basta un buen modelo técnico."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la gestión de primera línea es responsable de:", "o": ["Lograr los objetivos y gestionar sus riesgos", "Dar aseguramiento independiente al gobierno", "Aprobar el apetito de riesgo de la entidad", "Auditar los controles de la segunda línea"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: el aseguramiento independiente es de la tercera línea y el apetito lo fija el órgano de gobierno."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe basarse en la mejor información disponible, considerando sus limitaciones e incertidumbres.", "a": true, "e": "Apartado 4. Trampa: se cree que solo valen datos históricos completos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo relacionado con el cliente:", "o": ["Una sociedad con accionistas nominales o acciones al portador", "Una empresa que cotiza en bolsa con divulgación de información", "Una entidad pública o una empresa del Estado", "Un plan de pensiones sin opción de rescate anticipado"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["Excluye sin evaluar y empuja a canales informales", "Constituye la mejor práctica que exige el GAFI", "Resulta obligatorio si el sector tiene riesgo alto", "Carece de relevancia para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual puede llegar a cero cuando todos los controles funcionan.", "a": false, "e": "Siempre queda riesgo; por eso se compara con el apetito. Trampa: se confunde control eficaz con riesgo nulo."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Su monto reducido por cada operación", "El volumen total vendido en el año", "El país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, son ejemplos de factores de mayor riesgo por producto o canal la banca privada y:", "o": ["Las relaciones o transacciones no presenciales", "Las cuentas de nómina de entidades públicas", "Los planes de pensiones de empleados", "Las pólizas de vida de prima baja"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el riesgo se define como:", "o": ["El efecto de la incertidumbre sobre los objetivos", "La probabilidad de que ocurra una pérdida económica", "La suma de las amenazas y vulnerabilidades conocidas", "El daño que causa un evento ya materializado"], "a": 0, "e": "Definición de la norma. Trampa: las otras confunden riesgo con pérdida o con sus componentes."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), aportar experiencia, apoyo, seguimiento y cuestionamiento sobre la gestión del riesgo es un rol de:", "o": ["La segunda línea", "La primera línea", "La tercera línea", "El auditor externo"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: la tercera línea da aseguramiento independiente; la primera gestiona el riesgo."}, {"t": "vf", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la auditoría interna rinde cuentas al órgano de gobierno y es independiente de la gestión.", "a": true, "e": "Modelo de las tres líneas (2020). Trampa: se cree que depende de la gerencia general."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 19 del GAFI, la diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, el enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el umbral de propiedad del 25 % para identificar al beneficiario final es una cifra obligatoria fijada por el GAFI.", "a": false, "e": "El GAFI lo menciona como ejemplo; cada país fija el umbral. Trampa: se toma el ejemplo por regla."}, {"t": "vf", "q": "Según la LOCDOFT, una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Art. 4, numeral 2. Esa es la secuencia lógica."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe ser dinámica: anticipar, detectar y responder a los cambios del contexto.", "a": true, "e": "Apartado 4, principios. Trampa: se cree que la evaluación es un ejercicio único."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, entre las variables que pueden aumentar o reducir el riesgo de un cliente está:", "o": ["La regularidad o duración de la relación", "El margen comercial del producto vendido", "La antigüedad del oficial de cumplimiento", "La cuota de mercado de la entidad"], "a": 0, "e": "Nota interpretativa de la R.10: también el propósito de la cuenta y el volumen de activos."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida simplificada admitida:", "o": ["Verificar la identidad después de iniciar la relación", "Omitir la identificación del beneficiario final", "Prescindir del monitoreo de las operaciones", "Dejar de reportar las operaciones sospechosas"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres suprimen una obligación en lugar de aligerarla."}, {"t": "mc", "q": "Según la LOCDOFT, una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "Art. 4, numeral 2. La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, los pagos recibidos de terceros desconocidos o no asociados figuran entre los ejemplos de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que basta identificar al titular."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "vf", "q": "Según la Recomendación 18 del GAFI, un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Según la LOCDOFT, ¿qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual: sin justificación; sospechosa: fuera del perfil", "Inusual: de monto alto; sospechosa: de origen desconocido", "Inusual: se reporta; sospechosa: se analiza y se archiva"], "a": 0, "e": "Art. 4, numeral 2. El análisis media entre ambas."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo geográfico:", "o": ["Países con niveles significativos de corrupción", "Países con sistemas eficaces según evaluaciones mutuas", "Países con baja delincuencia según fuentes creíbles", "Países con seguimiento ordinario del GAFI"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: los otros son indicadores de menor riesgo o neutros."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la norma establece un único método obligatorio para calcular el riesgo inherente.", "a": false, "e": "La norma ofrece principios, un marco y un proceso, no un método único de cálculo. Trampa: se confunde un marco de referencia con una metodología cerrada."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la comunicación y consulta con las partes interesadas forma parte del proceso de gestión del riesgo.", "a": true, "e": "Apartado 6.2. Trampa: se cree que es un ejercicio técnico interno sin consulta."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Que se decida de forma informada y documentada", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, la evaluación del riesgo comprende la identificación, el análisis y:", "o": ["La valoración", "El tratamiento", "La comunicación", "El registro"], "a": 0, "e": "Apartado 6.4. Trampa: el tratamiento viene después de la evaluación."}, {"t": "vf", "q": "Según el artículo 27 de la LOCDOFT, son delitos de delincuencia organizada también los del Código Penal y leyes especiales cuando los comete un grupo de delincuencia organizada.", "a": true, "e": "LOCDOFT, art. 27."}, {"t": "vf", "q": "Según el artículo 28 de la LOCDOFT, cuando un delito lo comete un grupo de delincuencia organizada, la pena se incrementa en un tercio.", "a": false, "e": "Art. 28: se incrementa en la mitad."}, {"t": "vf", "q": "Según el artículo 29 de la LOCDOFT, es agravante cometer el delito utilizando a niños, niñas o adolescentes.", "a": true, "e": "Art. 29, num. 1."}, {"t": "vf", "q": "Según el artículo 30 de la LOCDOFT, no prescribe la acción penal de los delitos previstos en esa ley.", "a": true, "e": "Art. 30."}, {"t": "vf", "q": "Según el artículo 31 de la LOCDOFT, el Estado y sus empresas son penalmente responsables como cualquier persona jurídica.", "a": false, "e": "Art. 31: se excluye al Estado y sus empresas."}, {"t": "vf", "q": "Según el artículo 32 de la LOCDOFT, la clausura definitiva de la persona jurídica procede en caso de comisión intencional de los delitos tipificados en esa ley.", "a": true, "e": "Art. 32, num. 1."}, {"t": "vf", "q": "Según el artículo 33 de la LOCDOFT, el funcionario público que participe en estos delitos queda impedido de ejercer funciones públicas de uno a quince años después de cumplir la pena.", "a": true, "e": "Art. 33."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la legitimación de capitales se castiga con prisión de diez a quince años y multa equivalente al incremento patrimonial ilícito.", "a": true, "e": "Art. 35."}, {"t": "vf", "q": "Según el artículo 35 de la LOCDOFT, la simple adquisición o posesión de bienes producto de un delito no constituye legitimación de capitales.", "a": false, "e": "Art. 35, num. 3: está expresamente incluida."}, {"t": "vf", "q": "Según el artículo 36 de la LOCDOFT, los directivos o empleados que por negligencia contribuyan a la legitimación sin participar en ella son penados con prisión de tres a seis años.", "a": true, "e": "Art. 36."}, {"t": "vf", "q": "Según el artículo 37 de la LOCDOFT, formar parte de un grupo de delincuencia organizada se castiga por el solo hecho de la asociación.", "a": true, "e": "Art. 37: prisión de seis a diez años."}, {"t": "vf", "q": "Según el artículo 52 de la LOCDOFT, el acto terrorista se castiga con prisión de quince a veinte años.", "a": false, "e": "Art. 52: prisión de veinticinco a treinta años."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo se castiga aunque los fondos no se hayan utilizado efectivamente.", "a": true, "e": "Art. 53."}, {"t": "vf", "q": "Según el artículo 53 de la LOCDOFT, el financiamiento al terrorismo puede justificarse por razones políticas o ideológicas.", "a": false, "e": "Art. 53: no puede justificarse en ninguna circunstancia."}, {"t": "vf", "q": "Según el artículo 55 de la LOCDOFT, la incautación preventiva la ordena el juez de control a solicitud del fiscal del Ministerio Público.", "a": true, "e": "Art. 55."}, {"t": "vf", "q": "Según el artículo 58 de la LOCDOFT, transcurrido un año desde la incautación sin identificar al titular del bien, el fiscal solicita su decomiso.", "a": true, "e": "Art. 58."}, {"t": "vf", "q": "Según el artículo 60 de la LOCDOFT, tras una sentencia absolutoria, si el titular no reclama el bien en seis meses, el fiscal solicita su decomiso.", "a": true, "e": "Art. 60."}, {"t": "vf", "q": "Según el artículo 63 de la LOCDOFT, estos delitos se enjuician por un procedimiento especial que excluye el Código Orgánico Procesal Penal.", "a": false, "e": "Art. 63: se sigue el procedimiento del COPP, lo previsto en la ley y demás normas aplicables."}, {"t": "vf", "q": "Según el artículo 64 de la LOCDOFT, la intercepción de comunicaciones requiere autorización del juez de control.", "a": true, "e": "Art. 64."}, {"t": "vf", "q": "Según el artículo 67 de la LOCDOFT, la autorización de la operación encubierta la da el juez de control de la circunscripción donde el fiscal inició la investigación, y es válida en todo el territorio.", "a": true, "e": "Art. 67."}, {"t": "vf", "q": "Según el artículo 72 de la LOCDOFT, revelar la identidad de un agente encubierto se castiga con prisión de seis a ocho años.", "a": true, "e": "Art. 72. Si es funcionario, de quince a veinte años."}, {"t": "vf", "q": "Según el artículo 73 de la LOCDOFT, no se aplica la jurisdicción extraterritorial si el investigado ya fue juzgado en otro país y cumplió la condena.", "a": true, "e": "Art. 73."}, {"t": "vf", "q": "Según el artículo 76 de la LOCDOFT, a falta de tratado, la asistencia judicial recíproca se presta con base en el principio de reciprocidad.", "a": true, "e": "Art. 76."}, {"t": "vf", "q": "Según el artículo 81 de la LOCDOFT, las denegaciones de asistencia judicial recíproca no necesitan motivación.", "a": false, "e": "Art. 81: serán motivadas."}, {"t": "vf", "q": "Según el artículo 84 de la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los asume el Estado requirente, salvo otro acuerdo.", "a": true, "e": "Art. 84."}, {"t": "vf", "q": "Según el artículo 13 de la LOCDOFT, el reporte de actividades sospechosas no acarrea responsabilidad penal, civil ni administrativa para quien lo suscribe.", "a": true, "e": "Art. 13."}, {"t": "mc", "q": "Según el artículo 28 de la LOCDOFT, si un delito lo comete un grupo de delincuencia organizada, la pena:", "o": ["Se incrementa en la mitad", "Se incrementa en un tercio", "Se duplica", "Se aplica en su límite máximo"], "a": 0, "e": "Art. 28."}, {"t": "mc", "q": "Según el artículo 35 de la LOCDOFT, ¿qué pena tiene la legitimación de capitales?", "o": ["Prisión de diez a quince años", "Prisión de ocho a doce años", "Prisión de seis a diez años", "Prisión de quince a veinticinco años"], "a": 0, "e": "Art. 35."}, {"t": "mc", "q": "Según el artículo 36 de la LOCDOFT, ¿qué pena tiene el empleado que por imprudencia, impericia o negligencia contribuya a la legitimación?", "o": ["Prisión de tres a seis años", "Prisión de uno a tres años", "Solo multa administrativa", "Prisión de seis a diez años"], "a": 0, "e": "Art. 36."}, {"t": "mc", "q": "Según el artículo 37 de la LOCDOFT, pertenecer a un grupo de delincuencia organizada se castiga con prisión de:", "o": ["Seis a diez años", "Tres a seis años", "Diez a quince años", "Ocho a doce años"], "a": 0, "e": "Art. 37."}, {"t": "mc", "q": "Según el artículo 53 de la LOCDOFT, ¿qué pena tiene el financiamiento al terrorismo?", "o": ["Prisión de quince a veinticinco años", "Prisión de veinticinco a treinta años", "Prisión de diez a quince años", "Prisión de seis a diez años"], "a": 0, "e": "Art. 53. De veinticinco a treinta es la pena del acto terrorista (art. 52)."}, {"t": "mc", "q": "Según el artículo 52 de la LOCDOFT, ¿qué pena tiene quien realice o trate de realizar actos terroristas?", "o": ["Prisión de veinticinco a treinta años", "Prisión de quince a veinticinco años", "Prisión de veinte a veinticinco años", "Prisión de diez a quince años"], "a": 0, "e": "Art. 52."}, {"t": "mc", "q": "Según el artículo 31 de la LOCDOFT, ¿qué personas jurídicas quedan excluidas de responsabilidad?", "o": ["El Estado y sus empresas", "Las organizaciones sin fines de lucro", "Los partidos y organizaciones políticas", "Las sociedades extranjeras"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Según el artículo 32 de la LOCDOFT, ¿cuál de estas sanciones puede imponer el juez a una persona jurídica?", "o": ["Publicación íntegra de la sentencia a su costa", "Prisión de sus accionistas minoritarios", "Disolución de los sindicatos de la empresa", "Suspensión del pago de salarios"], "a": 0, "e": "Art. 32, num. 4."}, {"t": "mc", "q": "Según el artículo 33 de la LOCDOFT, el funcionario público que participe en estos delitos queda impedido de ejercer funciones públicas por:", "o": ["Uno a quince años después de cumplir la pena", "Cinco años contados desde la sentencia firme", "Diez años contados desde su detención preventiva", "Toda la vida, salvo indulto presidencial"], "a": 0, "e": "Art. 33."}, {"t": "mc", "q": "Según el artículo 55 de la LOCDOFT, ¿quién ordena la incautación preventiva de los bienes?", "o": ["El juez de control, a solicitud del fiscal", "El fiscal del Ministerio Público, de oficio", "La UNIF, a solicitud del sujeto obligado", "El órgano rector, por vía administrativa"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según el artículo 55 de la LOCDOFT, ante bienes perecederos incautados preventivamente, el fiscal solicita al juez:", "o": ["Su disposición anticipada", "Su destrucción inmediata", "Su devolución al investigado", "Su donación a una OSFL"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "Según el artículo 58 de la LOCDOFT, ¿cuánto tiempo debe pasar desde la incautación sin identificar al titular para pedir el decomiso?", "o": ["Un año", "Seis meses", "Dos años", "Treinta días"], "a": 0, "e": "Art. 58."}, {"t": "mc", "q": "Según el artículo 60 de la LOCDOFT, finalizado el proceso con sentencia absolutoria, ¿en qué plazo sin reclamo del titular se pide el decomiso?", "o": ["Seis meses", "Un año", "Treinta días", "Tres meses"], "a": 0, "e": "Art. 60."}, {"t": "mc", "q": "Según el artículo 64 de la LOCDOFT, ¿cuál de estas es una medida especial que requiere autorización del juez de control?", "o": ["La inmovilización de cuentas bancarias", "La solicitud de antecedentes penales", "La citación de testigos", "La revisión de registros públicos"], "a": 0, "e": "Art. 64, num. 2."}, {"t": "mc", "q": "Según el artículo 68 de la LOCDOFT, la operación encubierta se autoriza, entre otros casos, cuando:", "o": ["La investigación aparezca como imposible o sumamente difícil", "El investigado sea un funcionario público de alto nivel del Estado", "La pena del delito investigado sea menor de cinco años de prisión", "El fiscal lo considere conveniente, sin otra justificación"], "a": 0, "e": "Art. 68, num. 1."}, {"t": "mc", "q": "Según el artículo 70 de la LOCDOFT, ¿quiénes pueden infiltrarse como agentes encubiertos?", "o": ["Los funcionarios de unidades especializadas, previa autorización judicial", "Cualquier particular que colabore con el fiscal y acepte el riesgo", "Los oficiales de cumplimiento de los sujetos obligados, con aviso a la UNIF", "Los funcionarios de la UNIF, sin necesidad de autorización judicial"], "a": 0, "e": "Art. 70."}, {"t": "mc", "q": "Según el artículo 72 de la LOCDOFT, ¿qué pena tiene el funcionario policial o militar que revele la identidad de un agente encubierto?", "o": ["Prisión de quince a veinte años e inhabilitación", "Prisión de seis a ocho años, sin inhabilitación", "Prisión de tres a seis años y multa accesoria", "Destitución del cargo, sin pena privativa de libertad"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "Según el artículo 76 de la LOCDOFT, a falta de tratado, la asistencia judicial recíproca se presta con base en:", "o": ["El principio de reciprocidad", "La cortesía diplomática discrecional", "Una orden de la Corte Penal Internacional", "La solicitud de la INTERPOL"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según el artículo 81 de la LOCDOFT, ¿cuál es causa para denegar la asistencia judicial recíproca?", "o": ["Que menoscabe la soberanía, la seguridad o el orden público", "Que el delito investigado sea de cuantía económica reducida", "Que el Estado requirente no sea un país limítrofe con Venezuela", "Que el investigado se encuentre prófugo de la justicia"], "a": 0, "e": "Art. 81, num. 2."}, {"t": "mc", "q": "Según el artículo 84 de la LOCDOFT, los gastos ordinarios de ejecutar una solicitud de asistencia los asume:", "o": ["El Estado requirente, salvo otro acuerdo", "El Estado requerido, en todos los casos", "Ambos Estados, por partes iguales siempre", "El investigado, si resulta condenado"], "a": 0, "e": "Art. 84."}, {"t": "mc", "q": "Según el artículo 30 de la LOCDOFT, ¿qué acciones penales no prescriben?", "o": ["Las de los delitos previstos en esa ley, contra el patrimonio público y de tráfico de drogas", "Solo las del homicidio por encargo cometido por orden de un grupo de delincuencia organizada", "Solo las de legitimación de capitales y financiamiento al terrorismo, y ninguna otra", "Ninguna: todas las acciones penales de esa ley prescriben a los quince años del hecho"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según el artículo 45 de la LOCDOFT, obstruir la justicia en beneficio de un grupo de delincuencia organizada destruyendo o alterando evidencias se castiga con prisión de:", "o": ["Ocho a doce años", "Seis a ocho años", "Doce a dieciocho años", "Tres a seis años"], "a": 0, "e": "Art. 45, num. 4."}, {"t": "mc", "q": "Según el artículo 73 de la LOCDOFT, la jurisdicción extraterritorial no se aplica cuando el inves const GR=D.groups, ALL=D.all, PASS=0.8;
const app=document.getElementById('app');
let st=null, immediate=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){
  st=null;
  let h=`<h1>${esc(D.titulo)}</h1><p class="mut">${esc(D.sub)}</p>`;
  h+=`<div class="card menu"><h2 style="margin-top:0">Simulacro aleatorio</h2>
      <button class="p" onclick="start(-1)"><b>50 preguntas de todo el temario</b><br><span style="opacity:.85">Se arma distinto cada vez, con ${ALL.length} preguntas disponibles</span></button></div>`;
  GR.forEach((g,gi)=>{
    h+=`<h2>${esc(g.titulo)}</h2><div class="card menu">`;
    g.exams.forEach((e,ei)=>{
      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;
    });
    h+='</div>';
  });
  h+=`<label class="t"><input type="checkbox" id="imm" ${immediate?'checked':''} onchange="immediate=this.checked"> Corregir cada pregunta al contestarla. Desactívalo para simular el examen real y ver la nota solo al final.</label>
      <p class="mut">Verdadero o falso y selección simple. Se aprueba con 80 %, es decir 40 de 50. Al terminar verás la nota y la explicación de cada error.</p>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(gi,ei){
  let qs,titulo;
  if(gi===-1){qs=shuffle(ALL).slice(0,50);titulo='Simulacro aleatorio';}
  else{const e=GR[gi].exams[ei];qs=e.orden?e.q.slice():shuffle(e.q);titulo=e.titulo;}
  qs=qs.map(prep);
  st={titulo,qs,i:0,ans:qs.map(()=>null)};
  render();
}
function pick(k){
  const a=st.ans[st.i];
  if(a&&a.locked)return;
  st.ans[st.i]={sel:k,locked:immediate};
  render();
}
function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
