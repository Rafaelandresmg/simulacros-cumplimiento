<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector cajas de ahorro", "sub": "20 exámenes de 50 preguntas. Banco de 750 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Condena penal contra los directivos de las instituciones", "Desaparición del país como miembro del grupo", "Ninguna consecuencia práctica para el país"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "En la arquitectura de la LOCDOFT, ¿qué diferencia a la ONCDOFT de la UNIF?", "o": ["ONCDOFT rige la política; UNIF analiza reportes financieros", "La primera analiza los reportes; la segunda dicta la política nacional", "La primera supervisa a las aseguradoras; la segunda a los bancos", "La primera investiga penalmente; la segunda sanciona administrativamente"], "a": 0, "e": "Son órganos distintos y dependen de ministerios distintos."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, las operaciones sin propósito aparente deben someterse a:", "o": ["Análisis exhaustivo y debida diligencia intensificada", "Una aprobación automática del Consejo de Administración", "Una exención del monitoreo constante sobre el socio", "Un archivo inmediato sin dejar ninguna constancia"], "a": 0, "e": "Art. 72."}, {"t": "mc", "q": "El programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Los responsables de cumplimiento de cada una de las áreas", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Un Estado que ratifica un tratado como Palermo debe, en lo esencial:", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Transferir su competencia penal a la ONU", "Ceder su jurisdicción sobre delitos transnacionales", "Crear un tribunal propio para cada delito"], "a": 0, "e": "Los tratados obligan a incorporar sus disposiciones al derecho interno."}, {"t": "mc", "q": "¿Qué relación tiene el decomiso con la prevención del delito?", "o": ["Priva a las organizaciones de su lucro", "No tiene relación con la prevención", "Genera más delito al redistribuir bienes", "Es solo una medida de recaudación"], "a": 0, "e": "R.4."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la Matriz de Riesgo Sectorial proporcionada por SUDECA debe actualizarse:", "o": ["Semestralmente", "Trimestralmente", "Anualmente", "Mensualmente"], "a": 0, "e": "Punto décimo cuarto."}, {"t": "mc", "q": "El Convenio de Budapest, cuando se menciona en esta materia, trata de:", "o": ["La ciberdelincuencia y la prueba electrónica", "La corrupción en el deporte", "El tráfico de bienes culturales", "La protección de los datos personales en línea"], "a": 0, "e": "Relevante por el delito informático como delito determinante."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "Si la información de un cliente está desactualizada hace años, ¿qué riesgo existe?", "o": ["Que el perfil no refleje la realidad", "Que se genere una multa automática de SUDEASEG", "Que se cancele el contrato por falta de datos", "Ninguno si el cliente paga puntualmente la tarifa"], "a": 0, "e": "El perfil debe actualizarse según riesgo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un riesgo que puede ocurrir de manera reiterada con efectos significativos es riesgo:", "o": ["Alto", "Bajo", "Moderado", "Nulo"], "a": 0, "e": "Art. 4.34."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes", "Juzga a los sujetos obligados que hayan incumplido", "Representa al Estado ante los tribunales"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "mc", "q": "La Recomendación 33 exige a los países mantener:", "o": ["Estadísticas sobre la efectividad de su sistema", "Un registro de todas las operaciones en efectivo", "Un listado público de personas sancionadas", "Una base de datos de clientes de alto riesgo"], "a": 0, "e": "Reportes, investigaciones, condenas y decomisos."}, {"t": "mc", "q": "Un cliente insiste en contratar sin dejar datos de contacto verificables. Eso:", "o": ["Impide completar la diligencia y obliga a no vincularlo", "Es aceptable si deja al menos un número de teléfono", "Se resuelve con una declaración jurada", "Solo importa en contratos de alto valor"], "a": 0, "e": "Sin identificación plena no hay relación."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe anual debe señalar expresamente cualquier incumplimiento y las deficiencias observadas en el programa.", "a": true, "e": "Art. 90."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la designación del Consejo de Vigilancia busca asegurar:", "o": ["La separación de funciones respecto del Consejo de Administración", "La concentración de todas las funciones en una sola autoridad", "La sustitución de la Asamblea por el Consejo de Vigilancia", "La dependencia del Responsable del Consejo de Administración"], "a": 0, "e": "Punto cuarto."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento debe guardar absoluta reserva sobre la información de la materia.", "a": true, "e": "Art. 24."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "La Recomendación 15 aborda:", "o": ["Nuevas tecnologías y activos virtuales", "Controles internos de las instituciones", "Países de mayor riesgo", "Estadísticas nacionales"], "a": 0, "e": "Exige evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, para implementar el programa de cumplimiento tras la capacitación recibida, el plazo fue de:", "o": ["Noventa días consecutivos", "Treinta días consecutivos", "Ciento veinte días hábiles", "Ciento ochenta días hábiles"], "a": 0, "e": "Disposición transitoria."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los factores clásicos de riesgo incluyen clientes, productos o servicios, canales y:", "o": ["Zonas geográficas", "Salarios del personal", "Colores corporativos", "Dividendos repartidos"], "a": 0, "e": "Se añaden tecnologías y otros factores sectoriales."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el incumplimiento de la norma puede dar lugar a sanciones previstas en la ley del sector y en:", "o": ["La LOCDOFT y demás normas de la materia", "La Ley de Tránsito y la de Propiedad Horizontal", "El Código de Comercio y la Ley de Timbre Fiscal", "La Ley del Consumidor y la de Pesca y Acuicultura"], "a": 0, "e": "Art. 91."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los expedientes de asociados y terceros en SIGECAF deben verificarse:", "o": ["Trimestralmente", "Semestralmente", "Mensualmente", "Anualmente"], "a": 0, "e": "Punto décimo sexto."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "La prohibición de enviar divisas por encomiendas busca evitar:", "o": ["El traslado de valores fuera de todo control", "La competencia a la banca tradicional", "El encarecimiento del servicio postal para los usuarios", "La pérdida de paquetes en tránsito"], "a": 0, "e": "Cierra una vía de traslado oculto."}, {"t": "mc", "q": "Evitar un riesgo, en el lenguaje de la gestión, significa:", "o": ["No realizar la actividad que lo genera", "Contratar un seguro que lo cubra", "Reducir su probabilidad con controles", "Aceptarlo y monitorearlo"], "a": 0, "e": "Evitar, mitigar, transferir y aceptar son las cuatro respuestas."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Es siempre el único responsable de los incumplimientos", "No tiene ninguna responsabilidad por ser asesor", "Solo responde si es abogado colegiado"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": [ a en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "La Recomendación 26 trata de:", "o": ["La regulación y supervisión de instituciones financieras", "La creación de la unidad de inteligencia financiera", "La cooperación internacional entre supervisores", "Las sanciones por incumplimiento"], "a": 0, "e": "La 27 define los poderes del supervisor."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las operaciones que igualen o superen un monto especial deben marcarse en el Libro Auxiliar con su declaración de origen. Ese umbral es de:", "o": ["USD 2.000", "USD 1.500", "USD 10.000", "EUR 1.000"], "a": 0, "e": "Punto décimo y décimo quinto."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los factores de riesgo incluyen cantidad de asociados, proveedores, saldos en cuenta, activos y:", "o": ["Ámbito territorial donde operan", "Preferencias personales de sus socios", "Número de ventanas de cada oficina", "Nombre comercial de sus empleadores"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e":
