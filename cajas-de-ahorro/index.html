."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["El cumplimiento técnico y la efectividad del sistema", "La existencia de leyes contra el lavado vigentes", "El número de condenas dictadas por lavado", "El tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Según la Recomendación 34 del GAFI, la información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Se integraron las nueve especiales en las cuarenta", "Se redujeron de cuarenta a veinticinco en total", "Se convirtieron en un tratado vinculante para todos", "Se limitaron a las instituciones del sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 5 del GAFI, el financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "Según la Recomendación 9 del GAFI, ¿qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 29 del GAFI, una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "vf", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "vf", "q": "Según la Recomendación 28 del GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Según la Recomendación 37 del GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), Venezuela es miembro pleno del GAFIC y no del GAFILAT.", "a": true, "e": "Sección de antecedentes y contexto regional."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["Que exista sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según la Recomendación 2 del GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Según la Recomendación 16 del GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar no impide compartir información dentro del grupo financiero conforme a la Recomendación 18.", "a": true, "e": "R.21 y su nota interpretativa. Trampa: se cree que la reserva prohíbe todo intercambio interno."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, las medidas intensificadas frente a países de mayor riesgo alcanzan también a personas naturales y jurídicas de esos países, no solo a sus instituciones financieras.", "a": true, "e": "R.19. Trampa: se cree que solo alcanzan a la banca corresponsal."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, cuando el tercero en quien se confía pertenece al mismo grupo financiero, la autoridad puede dar por cumplidos los requisitos si el grupo:", "o": ["Aplica controles de grupo bajo supervisión competente", "Tiene su casa matriz en un país miembro del GAFI", "Firmó un convenio de confidencialidad con el tercero", "Comparte una misma marca comercial en cada país"], "a": 0, "e": "R.17, supuesto de grupo. Trampa: la marca o la sede no sustituyen los controles de grupo supervisados."}, {"t": "mc", "q": "El GAFI distingue PEP nacionales, extranjeros y de organizaciones internacionales. ¿Qué implicación práctica tiene?", "o": ["El riesgo se evalúa por contexto con medidas reforzadas", "Solo los PEP extranjeros requieren medidas especiales", "Los PEP nacionales están exentos de medidas reforzadas", "Todos reciben exactamente las mismas medidas"], "a": 0, "e": "Interpretación basada en riesgo."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "¿Por qué el GAFI fija un umbral para la declaración de efectivo transfronterizo (R.32)?", "o": ["Dar visibilidad al efectivo, medio para evadir controles", "Cobrar aranceles a los viajeros que ingresan efectivo", "Prohibir el efectivo en el comercio internacional", "Promover el turismo con reglas de declaración claras"], "a": 0, "e": "El umbral máximo es USD/EUR 15.000."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, para una persona expuesta políticamente extranjera, establecer el origen de su riqueza y de sus fondos es:", "o": ["Obligatorio en todos los casos", "Obligatorio si la relación es de mayor riesgo", "Facultativo, a criterio del oficial", "Exigible si es un cliente ocasional"], "a": 0, "e": "R.12: para las extranjeras es obligatorio; para las nacionales y de organizaciones internacionales, cuando la relación es de mayor riesgo. Trampa: se aplica la regla de las nacionales."}, {"t": "mc", "q": "¿Cuál es la naturaleza jurídica de las Recomendaciones del GAFI?", "o": ["Estándares aplicados por evaluación mutua entre pares", "Ley directamente obligatoria en todos los países miembros", "Tratado ratificado por la Asamblea General de la ONU", "Sentencia vinculante de un tribunal internacional"], "a": 0, "e": "No son tratado; su fuerza viene de la evaluación y el seguimiento."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, el beneficiario final puede ser una persona jurídica cuando esta controla al cliente.", "a": false, "e": "Glosario del GAFI: siempre una o más personas naturales. Trampa: el control por una sociedad no agota la búsqueda."}, {"t": "mc", "q": "Un cliente persona jurídica no puede o no quiere revelar quién es su dueño final. ¿Qué indica el GAFI que debe hacer la institución?", "o": ["No iniciar o terminar la relación y evaluar un reporte", "Aceptarlo con monitoreo posterior durante un año", "Iniciar la relación si el pago es por transferencia", "Exigir una garantía y mantener la relación vigente"], "a": 0, "e": "Sin CDD completa no hay relación."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la regulación y supervisión de las actividades y profesiones no financieras está en la Recomendación:", "o": ["28", "22", "23", "10"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026."}, {"t": "mc", "q": "La Recomendación 9 establece que las leyes de secreto financiero:", "o": ["No deben impedir la aplicación de las recomendaciones", "Prevalecen sobre cualquier requerimiento externo", "Solo ceden ante delitos con pena mayor a diez años", "Se aplican únicamente a la banca privada"], "a": 0, "e": "El secreto no puede ser un escudo."}, {"t": "mc", "q": "¿Qué protege la prohibición de revelación (tipping-off) de la R.21?", "o": ["La eficacia de las investigaciones y al reportante", "La reputación comercial de la institución financiera", "Los ingresos fiscales vinculados a las operaciones", "La confidencialidad de los contratos de servicios"], "a": 0, "e": "También protege al reportante."}, {"t": "mc", "q": "Un país exige declarar por encima de US$10.000. ¿Es compatible con el GAFI, que fija un máximo de 15.000?", "o": ["Sí: el estándar es un máximo y se puede endurecer", "No: solo se admite el máximo de USD/EUR 15.000", "Solo si es país del Caribe miembro del GAFIC", "No: debe coincidir exactamente con el umbral del GAFI"], "a": 0, "e": "Más estricto es compatible."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la Recomendación 1 exige evaluar también el riesgo de financiamiento de la proliferación.", "a": true, "e": "R.1, reforma de 2020: referido al incumplimiento o evasión de las sanciones de la R.7. Trampa: se cree que solo cubre legitimación y terrorismo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente actúa mediante apoderado. ¿Qué debe identificar la institución además del cliente?", "o": ["Al apoderado, su poder y a quien representa", "Solo al apoderado que firma el contrato", "Solo al mandante, sin verificar al apoderado", "No debe identificar a nadie más si hay poder notariado"], "a": 0, "e": "Se identifica a quien actúa y a quien le pertenece."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de las nuevas tecnologías y los activos virtuales (R.15)?", "o": ["Pueden ofrecer anonimato y velocidad transfronteriza", "Carecen de regulación legal en todos los países", "Resultan costosas para las instituciones financieras", "Están prohibidas en la mayoría de los países"], "a": 0, "e": "Se deben evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, ¿por qué una inmobiliaria es relevante en el riesgo de lavado?", "o": ["Permite integrar grandes sumas con apariencia lícita", "Sus operaciones quedan fuera de todo registro público", "Sus clientes suelen ser personas no residentes", "El valor de los inmuebles lo fija la autoridad"], "a": 0, "e": "Sector clásico de integración."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, para probar que un bien es producto del delito hace falta una condena previa por el delito determinante.", "a": false, "e": "Nota interpretativa de la R.3. Trampa: se añade un requisito."}, {"t": "vf", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera debe poder pedir información adicional a los sujetos obligados.", "a": true, "e": "R.29. Trampa: se cree que solo recibe lo que se le envía."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, la intención y el conocimiento exigidos para el delito de legitimación pueden inferirse de circunstancias fácticas objetivas.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que hace falta prueba directa."}, {"t": "vf", "q": "Según la Recomendación 11 del GAFI, los registros obtenidos en la debida diligencia se conservan cinco años contados desde que se obtuvieron.", "a": false, "e": "R.11: desde el fin de la relación o la fecha de la operación ocasional. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, los registros de las transacciones deben conservarse al menos cinco años contados desde:", "o": ["La conclusión de cada transacción", "El fin de la relación comercial", "La apertura de la cuenta del cliente", "La remisión del reporte a la unidad"], "a": 0, "e": "R.11. Trampa: el fin de la relación es el punto de partida para los registros de debida diligencia."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, cuando el sujeto obligado cree razonablemente que aplicar la debida diligencia alertaría al cliente sospechoso, puede:", "o": ["No completarla y presentar el reporte de sospecha", "Completarla y posponer el reporte de sospecha", "Cerrar la relación e informar el motivo al cliente", "Pedir al supervisor que la realice en su lugar"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: parece que la debida diligencia nunca puede omitirse."}, {"t": "mc", "q": "Según la Recomendación 21 del GAFI, la protección frente a responsabilidad por reportar de buena fe se mantiene:", "o": ["Aunque no se sepa cuál era el delito ni si ocurrió", "Solo si después se confirma el delito determinante", "Solo si el reporte lo firmó el oficial designado", "Aunque el reporte se haya hecho con mala fe"], "a": 0, "e": "R.21. Trampa: se condiciona la protección al resultado."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, el criterio de umbral admite que los delitos determinantes sean, como mínimo, los castigados con pena máxima de más de:", "o": ["Un año de prisión", "Cuatro años de prisión", "Cinco años de prisión", "Seis meses de prisión"], "a": 0, "e": "Nota interpretativa de la R.3. Trampa: cuatro años es Palermo; más de cinco, la LOCDOFT; seis meses es el criterio para sistemas de pena mínima."}, {"t": "mc", "q": "El GAFI se creó en 1989 por iniciativa del G7 con el propósito original de:", "o": ["Combatir el lavado de dinero del narcotráfico", "Regular el sistema bancario internacional", "Supervisar los tipos de cambio mundiales", "Fiscalizar los paraísos fiscales"], "a": 0, "e": "El mandato se amplió luego a financiamiento del terrorismo y proliferación."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, en casinos, la debida diligencia se activa desde transacciones financieras de:", "o": ["USD/EUR 3.000", "USD/EUR 1.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.22."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, toda organización sin fines de lucro debe tratarse como de alto riesgo de financiamiento al terrorismo.", "a": false, "e": "R.8: enfoque focalizado y proporcional sobre las que estén en riesgo."}, {"t": "vf", "q": "Según la Recomendación 5 del GAFI, el financiamiento del terrorismo solo es delito si los fondos se vinculan con un acto terrorista concreto.", "a": false, "e": "R.5: también financiar a organizaciones o a terroristas individuales, sin vínculo con un acto específico. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según la Recomendación 14 del GAFI, respecto de los agentes de un servicio de transferencia de dinero o valores, el estándar admite que:", "o": ["El proveedor mantenga una lista actualizada de ellos", "Operen sin registro si el proveedor tiene licencia", "Solo los supervise el país de origen de los fondos", "Queden fuera del programa de prevención del proveedor"], "a": 0, "e": "R.14: licencia o registro del agente, o lista actualizada accesible a las autoridades. Trampa: la alternativa no los libera de control."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un país con buenas leyes pero pocos resultados obtendrá, previsiblemente:", "o": ["Buen cumplimiento técnico y baja efectividad", "Mala calificación en ambas dimensiones", "Buena efectividad y mal cumplimiento técnico", "La exclusión inmediata del GAFI"], "a": 0, "e": "Es el caso típico que la metodología busca detectar."}, {"t": "vf", "q": "Las Recomendaciones del GAFI son directamente aplicables como ley en cualquier país sin necesidad de incorporarlas a su derecho interno.", "a": false, "e": "Deben ser implementadas por cada país mediante sus leyes y regulaciones."}, {"t": "vf", "q": "Para el GAFI, la función de cumplimiento debe contar con acceso oportuno a la información de clientes y operaciones.", "a": true, "e": "Sin acceso no hay control posible."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, una jurisdicción puede exigir a sus sujetos obligados medidas más estrictas que las del estándar internacional.", "a": true, "e": "El estándar fija mínimos."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control del efectivo en frontera solo puede hacerse mediante un sistema de declaración escrita de todos los viajeros.", "a": false, "e": "R.32: declaración o revelación a requerimiento. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Un país tiene leyes completas contra el lavado pero casi no investiga ni condena. ¿Cómo lo evaluaría el GAFI?", "o": ["Cumplimiento técnico alto y efectividad baja", "Cumplimiento técnico y efectividad altos por tener leyes", "No evaluable hasta que existan condenas firmes", "Cumplimiento técnico bajo por falta de resultados"], "a": 0, "e": "La efectividad mide resultados."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, mantener actualizado el Manual de Administración de Riesgo corresponde a:", "o": ["La Superintendencia de Cajas de Ahorro", "El responsable de cumplimiento principal", "El consejo de administración de la caja", "La asamblea general de asociados"], "a": 0, "e": "Art. 84. Trampa: en otros sectores lo actualiza cada sujeto obligado."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, no puede ser auxiliar quien tenga con las máximas autoridades parentesco hasta:", "o": ["Cuarto grado de consanguinidad o segundo de afinidad", "Primer grado de consanguinidad o primero de afinidad", "Segundo grado de consanguinidad o tercero de afinidad", "Sexto grado de consanguinidad o cuarto de afinidad"], "a": 0, "e": "Art. 28.1."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los expedientes de asociados y terceros en SIGECAF deben verificarse:", "o": ["Trimestralmente", "Semestralmente", "Mensualmente", "Anualmente"], "a": 0, "e": "Punto décimo sexto."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, si detecta falsedad en los datos de un asociado, la caja remite un RAS a la UNIF sin informar a la Superintendencia.", "a": false, "e": "Art. 55: informa por oficio a la Superintendencia la suspensión temporal y avisa al responsable de cumplimiento. Trampa: se cambia el destinatario."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la Matriz de Riesgo Sectorial proporcionada por SUDECA debe actualizarse:", "o": ["Semestralmente", "Trimestralmente", "Anualmente", "Mensualmente"], "a": 0, "e": "Punto décimo cuarto."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los formularios pueden sustituir a los libros del Responsable de Cumplimiento.", "a": false, "e": "Punto décimo: son complementarios y no los sustituyen."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un asociado cuyo riesgo es moderado debe recibir diligencia:", "o": ["Controlada", "Mejorada", "Simplificada", "Estándar"], "a": 0, "e": "Art. 39. Trampa: otras normas usan mejorada."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, las personas que presten servicio directa o indirectamente a las asociaciones civiles pueden ser sujetos obligados.", "a": true, "e": "Art. 2.d."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, ante una investigación, la falta de libros actualizados lleva a presumir que:", "o": ["La omisión es intencional para encubrir un ilícito", "La asociación no tuvo operación alguna ese ejercicio", "El Consejo de Vigilancia carece de responsabilidad", "La falta fue causada siempre por un error del sistema"], "a": 0, "e": "Punto décimo primero."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la constancia de registro es requisito indispensable para gestionar:", "o": ["Certificaciones de solvencia y autorizaciones de inversión", "Tarjetas de crédito personales de cada uno de los socios", "Licencias de conducir para los miembros de los consejos", "Permisos de construcción de las viviendas de los socios"], "a": 0, "e": "Punto séptimo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, garantizar el cumplimiento del Plan Anual de Actividades mediante su seguimiento y evaluación corresponde a:", "o": ["El presidente del consejo de vigilancia", "La asamblea de asociados", "El presidente del consejo de administración", "La División de Inspección de SUDECA"], "a": 0, "e": "Art. 22, literal g. Trampa: el consejo de administración incluye el plan en su PAA, pero no garantiza su ejecución."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, se detecta que un proveedor no actúa aparentemente por cuenta propia y, más tarde, que su actividad es sospechosa. Corresponde, en orden:", "o": ["Intensificar y luego RAS y recomendar cesar", "Reportar y luego aplicar diligencia estándar", "Cesar y luego solicitar autorización judicial", "Continuar y consignar el caso en la asamblea"], "a": 0, "e": "Art. 66."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el responsable de cumplimiento puede desempeñar sus funciones en cualquier sede, aunque no sea el domicilio del sujeto obligado.", "a": false, "e": "Art. 25: donde el sujeto obligado tenga su domicilio, asiento principal de sus actividades. Trampa: se suprime el lugar."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las operaciones que igualen o superen un monto especial deben marcarse en el Libro Auxiliar con su declaración de origen. Ese umbral es de:", "o": ["USD 2.000", "USD 1.500", "USD 10.000", "EUR 1.000"], "a": 0, "e": "Punto décimo y décimo quinto."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Registro Individual de proveedores persona jurídica debe asentar al dueño real para evitar empresas fachada.", "a": true, "e": "Punto décimo segundo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, falta de forma absoluta el Responsable y su ausencia no ha sido suplida. El aviso lo hace:", "o": ["El presidente de Administración, en 7 hábiles", "El presidente de Vigilancia, en 7 hábiles", "El presidente de Administración, en 15 continuos", "La asamblea de asociados, en 30 continuos"], "a": 0, "e": "Art. 21.f."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, determinada una actividad sospechosa de un proveedor, el responsable debe remitir el RAS y:", "o": ["Recomendar al Consejo de Administración cesar operaciones", "Comunicar al proveedor las razones del reporte a la UNIF", "Publicar el nombre del proveedor en la cartelera interna", "Cancelar el reporte si el proveedor devuelve lo cobrado"], "a": 0, "e": "Art. 66."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, integran la estructura del SIAR la asamblea, los consejos de administración y vigilancia, el responsable y:", "o": ["El auxiliar del responsable de cumplimiento", "El auditor externo de la superintendencia", "El oficial designado por la Unidad Nacional", "El representante del Ministerio Público"], "a": 0, "e": "Art. 19."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, los sujetos deben abstenerse de contratar con personas anónimas o con nombres ficticios.", "a": true, "e": "Art. 56."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, si sospecha falsedad en los datos de un proveedor, el responsable de cumplimiento termina por sí mismo el contrato.", "a": false, "e": "Art. 69: informa al consejo de administración la necesidad de no continuar o concluir la contratación. Trampa: se cambia quién decide."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las controversias sobre el desempeño del Responsable de Cumplimiento se dirimen ante:", "o": ["SUDECA", "La UNIF", "El Consejo de Administración", "El Ministerio Público"], "a": 0, "e": "Punto quinto."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la autoevaluación de riesgo debe remitirse cada año a la División de Inspección.", "a": false, "e": "Art. 33: se mantiene a su disposición. Trampa: en seguros sí se remite."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Responsable de Cumplimiento debe asistir obligatoriamente a las jornadas de formación que imparta SUDECA.", "a": true, "e": "Punto décimo tercero."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la separación de elementos en grupos homogéneos según un atributo se denomina:", "o": ["Segmentación", "Mitigación", "Tipología", "Efectividad"], "a": 0, "e": "Art. 4.37."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento debe recibir formación y capacitación:", "o": ["Una vez al año como mínimo programado", "Una vez cada cinco años como máximo", "Solo cuando ocurra una inspección", "Solo al ser electo por la asamblea"], "a": 0, "e": "Art. 78.6."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, conocer las actividades, operaciones y riesgos potenciales del sujeto obligado es la primera atribución del responsable de cumplimiento principal.", "a": true, "e": "Art. 22, literal a. Trampa: se cree que solo debe conocer las operaciones reportadas."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el proyecto de Plan Anual se presenta a la División dentro de:", "o": ["Treinta días continuos siguientes al cierre", "Sesenta días hábiles siguientes al cierre", "Quince días hábiles previos al cierre", "Noventa días continuos previos al cierre"], "a": 0, "e": "Art. 76."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Código de Ética en este sector, a diferencia de otros, lo diseña:", "o": ["La Superintendencia de Cajas de Ahorro", "El Consejo de Administración de la caja", "El Consejo de Vigilancia de la caja", "La asamblea general de los asociados"], "a": 0, "e": "Art. 81."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la providencia entró en vigencia a partir de su publicación en la Gaceta Oficial.", "a": true, "e": "Disposición final. Trampa: la norma de turismo de 2026 tiene una vacatio de 60 días."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la autoevaluación de riesgo se actualiza una vez al año o cuando:", "o": ["Varíen los factores que influyen en su nivel de riesgo", "Lo solicite por escrito la asamblea de asociados", "Se elija un nuevo consejo de administración", "La UNIF publique una nueva circular"], "a": 0, "e": "Art. 33. Trampa: el cambio de directivos actualiza el compromiso institucional, no la autoevaluación."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Plan Anual de Actividades lo elabora el responsable de cumplimiento principal durante el último trimestre del año anterior a su ejecución.", "a": true, "e": "Art. 76. Trampa: se cree que se elabora al cierre del ejercicio."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, en ausencia absoluta del responsable de cumplimiento principal, lo suple el presidente del consejo de administración.", "a": false, "e": "Art. 30: lo suple su suplente, si su ubicación lo permite. Trampa: se aplica la lógica de seguros."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el responsable auxiliar sirve de enlace con:", "o": ["El responsable de cumplimiento principal", "La División de Inspección de SUDECA", "El consejo de administración", "La UNIF"], "a": 0, "e": "Art. 29, numeral 1. Trampa: el auxiliar no se relaciona directamente con el supervisor ni con la UNIF."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un riesgo que puede ocurrir de manera reiterada con efectos significativos es riesgo:", "o": ["Alto", "Bajo", "Moderado", "Nulo"], "a": 0, "e": "Art. 4.34."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe trimestral de ejecución del Plan Anual debe indicar:", "o": ["El porcentaje de cumplimiento de cada aspecto", "El número de reportes remitidos a la UNIF", "El monto ejecutado de cada partida del plan", "La lista de los asociados ya capacitados"], "a": 0, "e": "Art. 76. Trampa: las otras cifras suenan a indicadores, pero la norma pide porcentaje de cumplimiento."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe anual debe señalar expresamente cualquier incumplimiento y las deficiencias observadas en el programa.", "a": true, "e": "Art. 90."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, suscribir y enviar el reporte de actividad sospechosa no acarrea responsabilidad contra el sujeto obligado.", "a": true, "e": "Arts. 4.31 y 73."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, las supervisiones se inician de oficio mediante acto dictado por:", "o": ["El Superintendente de Cajas de Ahorro", "El presidente del Consejo de Vigilancia", "La Unidad Nacional de Inteligencia Financiera", "La asamblea ordinaria de los asociados"], "a": 0, "e": "Art. 8."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, si la verificación detecta falsedad en los datos de un asociado, el sujeto informará a SUDECA:", "o": ["La suspensión temporal y lo comunicará al responsable", "El retiro definitivo y lo publicará en la cartelera", "La exclusión inmediata y lo avisará a su empleador", "La expulsión sumaria y lo notificará a la asamblea"], "a": 0, "e": "Art. 55."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el plazo de conservación de los reportes de actividades sospechosas se cuenta desde su remisión a la UNIF.", "a": true, "e": "Art. 70. Trampa: se espera que corra desde la detección de la operación."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la Providencia entró en vigencia a los ciento ochenta días de su publicación.", "a": false, "e": "Disposición final: desde su publicación. Trampa: ciento ochenta días es el plazo transitorio para ajustar las actividades."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los libros que debe llevar el Responsable son el Libro de Actas, los de Registros de Operaciones y:", "o": ["Los Auxiliares Supervisorios y de Control de Riesgos", "Los de Inventario General de la Superintendencia", "Los Diarios Mayores del Consejo de Administración", "Los de Asistencia de los Empleados de cada Proveedor"], "a": 0, "e": "Punto décimo."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la información de actividades en el SIGECAF se actualiza cada mes.", "a": true, "e": "Art. 74. Trampa: se suele pensar en una frecuencia trimestral."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, un dinero en efectivo que queda de un día para otro sin depositar ni justificar se opone a:", "o": ["El registro de depósitos diarios del Libro Auxiliar", "La libre disposición de los fondos de cada asociado", "La autorización general otorgada por la asamblea", "El derecho de cada proveedor a cobrar en efectivo"], "a": 0, "e": "Punto décimo, numeral 3."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Plan Anual de Actividades, con las observaciones de la División, se aprueba en:", "o": ["La asamblea ordinaria o extraordinaria", "El consejo de administración de la caja", "El consejo de vigilancia de la caja", "La División de Inspección de SUDECA"], "a": 0, "e": "Art. 76. Trampa: la División observa y recomienda, pero no aprueba."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un riesgo que luego de aplicar políticas se determina como improbable y de impacto mínimo es riesgo:", "o": ["Bajo", "Moderado", "Alto", "Crítico"], "a": 0, "e": "Art. 4.35."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el plan de trabajo del Responsable debe ser presentado por el Consejo de Administración ante:", "o": ["La Asamblea General Extraordinaria u Ordinaria", "La Unidad Nacional de Inteligencia Financiera", "El Tribunal Supremo de Justicia en cada caso", "La Federación de los Colegios de Contadores"], "a": 0, "e": "Punto noveno."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, en la clasificación de PEP de la providencia, el Nivel 1 corresponde a:", "o": ["Representantes de organismos internacionales", "Personas que ocupan un cargo a nivel nacional", "Funcionarios que ocupan un cargo estatal", "Funcionarios que ocupan un cargo municipal"], "a": 0, "e": "Art. 61. Trampa: se espera que el nivel 1 sea el cargo nacional."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Registro Individual debe asentar del asociado su perfil económico, que comprende:", "o": ["El origen de los fondos y el ahorro esperado", "Sus viajes personales y sus redes sociales", "Sus preferencias políticas y su religión", "El historial clínico de sus familiares"], "a": 0, "e": "Punto décimo segundo."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, un retiro de USD 2.000 exactos se registra en el Libro Auxiliar. Respecto del umbral especial:", "o": ["Se marca con su declaración de origen", "No se marca, porque debe superar el monto", "Se marca solo si es en efectivo y en bolívares", "No se marca, porque el umbral es USD 10.000"], "a": 0, "e": "Puntos décimo y décimo quinto: igualen o superen."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, los mecanismos de supervisión son las inspecciones in situ y extra situ, pero no pueden combinarse.", "a": false, "e": "Art. 10: in situ, extra situ y una combinación de ambas. Trampa: se cierra la alternativa."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, los fondos de fuente legal requieren indagar con mayor minuciosidad para determinar si pueden financiar terrorismo.", "a": true, "e": "Art. 45.4."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el compromiso institucional lo firman solo los miembros del consejo de administración.", "a": false, "e": "Art. 23: lo firman los miembros de los consejos de administración y de vigilancia. Trampa: se excluye a un consejo."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Consejo de Administración puede remover al Responsable de Cumplimiento de sus funciones de prevención.", "a": false, "e": "Punto quinto."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la herramienta tecnológica para la supervisión documentada del sector es:", "o": ["SIGECAF", "SIVECOC", "RUSO", "SIAR"], "a": 0, "e": "Art. 4.41. SIVECOC es de turismo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los responsables auxiliares para las áreas de riesgo los designa:", "o": ["El responsable de cumplimiento principal", "La División de Inspección y Prevención", "El presidente del Consejo de Administración", "La Unidad Nacional de Inteligencia"], "a": 0, "e": "Arts. 22.e y 26."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, las atribuciones del responsable de cumplimiento principal las ejerce el presidente del consejo de vigilancia.", "a": true, "e": "Art. 22. Trampa: se espera que sea el presidente del consejo de administración."}, {"t": "mc", "q": "Según la Providencia le auxiliar de cada área", "La División de Inspección de SUDECA"], "a": 0, "e": "Art. 22, literal l. Trampa: la División supervisa, pero no remite reportes a la UNIF."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la matriz de riesgo que SUDECA remite a los sujetos requiere aprobación previa de:", "o": ["La ONCDOFT", "La UNIF", "La asamblea", "El Consejo de Vigilancia"], "a": 0, "e": "Art. 38."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, las señales de alerta las define cada caja, sin referencia a las circulares de la UNIF.", "a": false, "e": "Art. 71: las informa la Superintendencia conforme a las circulares de la UNIF. Trampa: se cambia la fuente."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un asociado hace un aporte voluntario y luego pide un retiro. Debe suscribir, respectivamente, una declaración de:", "o": ["Origen y destino de los fondos", "Destino y origen de los fondos", "Origen de fondos en ambos casos", "Destino de fondos en ambos casos"], "a": 0, "e": "Arts. 49, 85 y 86."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un exfuncionario nacional cesó hace tres años y solicita asociarse. Debe tratarse como:", "o": ["PEP de nivel 2, hasta cinco años tras cesar", "PEP de nivel 1, hasta cinco años tras cesar", "Asociado común, pues ya cesó en el cargo", "PEP de nivel 2, por toda su vida"], "a": 0, "e": "Arts. 60 y 61."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, coadyuvar para que la supervisión extra situ y la inspección in situ permitan identificar y segmentar los riesgos es obligación del presidente del consejo de administración.", "a": true, "e": "Art. 21, literal d. Trampa: se cree que la supervisión solo involucra al responsable."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una alcaldesa, una gobernadora y una representante ante un organismo internacional son PEP, respectivamente, de nivel:", "o": ["4, 3 y 1", "3, 4 y 2", "1, 2 y 4", "2, 3 y 1"], "a": 0, "e": "Art. 61."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el capacitador del programa anual lo elige libremente cada caja, sin intervención de la Superintendencia.", "a": false, "e": "Art. 77: se coordina con la División de Inspección y Prevención y debe estar inscrito en el Registro Único de Facilitadores. Trampa: se suprime la coordinación."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe anual lo presenta el responsable de cumplimiento a la Superintendencia y a la asamblea:", "o": ["A través del consejo de administración", "Directamente, sin ningún intermediario", "A través del consejo de vigilancia", "A través de un auditor externo"], "a": 0, "e": "Art. 89. Trampa: el responsable preside el consejo de vigilancia, pero el canal es el de administración."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los documentos que acreditan una operación cuentan su lapso de conservación desde:", "o": ["La ejecución de la operación", "El fin de la relación del asociado", "La aprobación del plan anual", "La última asamblea celebrada"], "a": 0, "e": "Arts. 44 y 70."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el plazo para implementar el programa de cumplimiento es de noventa días consecutivos contados desde la publicación de la Providencia.", "a": false, "e": "Disposición transitoria: desde el día hábil siguiente a la capacitación recibida de la Superintendencia. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Consejo de Administración redacta su propio manual distinto al entregado por el regulador, convencido de que debe hacerlo. Debe saber que el manual lo elabora:", "o": ["La Superintendencia de Cajas de Ahorro", "El Consejo de Administración de la caja", "El Presidente del Consejo de Vigilancia", "La asamblea, en reunión extraordinaria"], "a": 0, "e": "Art. 82."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el responsable de cumplimiento auxiliar no necesita ser asociado si tiene título de educación superior.", "a": false, "e": "Art. 27, num. 1: debe ser asociado. Trampa: se convierte en alternativo un requisito acumulativo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la Declaración de Destino de los Fondos se pide al asociado cuando:", "o": ["Tramita un préstamo o retira sus haberes", "Realiza un aporte voluntario a la caja", "Se afilia por primera vez a la caja", "Actualiza sus datos de identificación"], "a": 0, "e": "Art. 85. Trampa: la de origen se pide en los aportes voluntarios (art. 86)."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento ejerce esa función sin menoscabo de sus funciones principales.", "a": true, "e": "Art. 4.32."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Programa Anual de Capacitación lo elabora el presidente del consejo de administración.", "a": false, "e": "Art. 21, lit. e: lo elabora el responsable de cumplimiento principal; el presidente del consejo de administración lo incluye en el Plan Anual de Actividades. Trampa: se confunde elaborar con incluir."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, al responsable de cumplimiento auxiliar lo designa la asamblea de asociados.", "a": false, "e": "Art. 26: lo designa el responsable de cumplimiento principal y consta en acta. Trampa: se cambia quién designa."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Responsable de Cumplimiento queda sujeto a responsabilidades administrativas y penales por omisiones en esta materia.", "a": true, "e": "Punto décimo primero."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, difundir estrategias comunicacionales de sensibilización dirigidas a los consejos, empleados y asociados corresponde al presidente del consejo de administración.", "a": false, "e": "Art. 22, literal i: corresponde al presidente del consejo de vigilancia. Trampa: se cambia de consejo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la descripción de métodos usados por la delincuencia organizada se denomina:", "o": ["Tipología", "Segmentación", "Mitigante", "Efectividad"], "a": 0, "e": "Art. 4.44."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe anual de gestión en la materia se presenta a los asociados en asamblea ordinaria convocada por el consejo de vigilancia.", "a": false, "e": "Art. 22, lit. h: la convoca el consejo de administración; el informe recoge la gestión del consejo de vigilancia. Trampa: se cambia quién convoca."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la matriz de cada sujeto obligado es consolidada por la División y remitida a la ONCDOFT.", "a": true, "e": "Art. 38. Trampa: se cree que va a la UNIF."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, al riesgo moderado le corresponde una diligencia:", "o": ["Controlada", "Intensificada", "Simplificada", "Mejorada"], "a": 0, "e": "Art. 39. Trampa: otras normas usan mejorada."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un proveedor que aparentemente no actúa por cuenta propia debe ser sometido a:", "o": ["Debida diligencia intensificada y monitoreo constante", "Debida diligencia simplificada sin ningún monitoreo", "Una solicitud de autorización a su propio empleador", "Una consulta pública en la asamblea de los asociados"], "a": 0, "e": "Art. 66."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, no puede ser responsable de cumplimiento auxiliar quien sea pariente de un directivo en tercer grado de afinidad.", "a": false, "e": "Art. 28: la incompatibilidad llega al segundo grado de afinidad. Trampa: se va un grado más allá del límite."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la identidad de quienes dirigen o controlan al sujeto obligado puede estar disponible públicamente.", "a": true, "e": "Arts. 44 y 48. Trampa: se cree que esa información es reservada."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, una PEP de una organización internacional está sujeta a las mismas medidas que las PEP nacionales.", "a": true, "e": "Art. 60."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los eventos de riesgo del sector son evaluados y publicados por la Superintendencia:", "o": ["Anualmente", "Semestralmente", "Trimestralmente", "Cada dos años"], "a": 0, "e": "Art. 31. Trampa: se cambia la frecuencia."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el compromiso institucional se actualiza una vez al año o cuando cambian los miembros directivos o empleados.", "a": true, "e": "Art. 23. Trampa: se suele recordar solo la regla anual."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el informe anual se presenta solo a la Superintendencia, no a la asamblea de asociados.", "a": false, "e": "Art. 89: se presenta a la Superintendencia y a la asamblea de asociados. Trampa: se excluye un destinatario."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Programa Anual de Formación y Capacitación es un documento separado que no forma parte del Plan Anual de Actividades.", "a": false, "e": "Art. 77: debe incluirse en el Plan Anual de Actividades. Trampa: se separan dos instrumentos que van juntos."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la matriz sectorial y los expedientes en SIGECAF se actualizan y verifican, respectivamente:", "o": ["Semestral y trimestralmente", "Trimestral y semestralmente", "Anual y mensualmente", "Mensual y anualmente"], "a": 0, "e": "Puntos décimo cuarto y décimo sexto."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, las estadísticas de los reportes de actividades sospechosas pueden solicitarse al sujeto obligado de forma mensual.", "a": true, "e": "Art. 7.10."}, {"t": "vf", "q": "Según la Providencia o tercero."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la falta temporal o absoluta del responsable no suplida debe notificarse dentro de:", "o": ["Siete días hábiles", "Cinco días continuos", "Quince días hábiles", "Treinta días continuos"], "a": 0, "e": "Art. 21.f."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento debe guardar absoluta reserva sobre la información de la materia.", "a": true, "e": "Art. 24."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, cada caja redacta libremente su manual de prevención, sin seguir el que dicta la Superintendencia.", "a": false, "e": "Art. 45: adopta el manual dictado por la Superintendencia. Trampa: se invierte la obligación."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, las referencias bancarias o personales del expediente del trabajador deben tener una vigencia mínima de:", "o": ["Tres meses", "Seis meses", "Un mes", "Un año"], "a": 0, "e": "Art. 59, num. 3. Trampa: se cambia el período."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los registros de capacitación se resguardan por un mínimo de diez años, contados desde:", "o": ["La realización de la capacitación", "El ingreso del trabajador", "El egreso del trabajador", "La aprobación del programa anual"], "a": 0, "e": "Art. 79. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el órgano que supervisa a las asociaciones de ahorro en esta materia es:", "o": ["La Superintendencia de Cajas de Ahorro", "La Superintendencia de la Actividad Aseguradora", "La Superintendencia de las Instituciones Bancarias", "La Superintendencia Nacional de Valores"], "a": 0, "e": "Arts. 2 y 5."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una caja guarda sus registros siete años, y sus constancias de capacitación cuatro. Esa práctica:", "o": ["Incumple ambos plazos, que son de diez años", "Cumple ambos plazos, por exceder los mínimos", "Incumple solo el plazo de la capacitación", "Incumple solo el plazo de los registros"], "a": 0, "e": "Arts. 44, 70 y 79."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una asociación con 5.000 asociados se ubica en el rango de segmentación:", "o": ["Entre 1.001 y 9.999 asociados", "Menos de 1.000 asociados", "Más de 10.000 asociados", "Más de 50.000 asociados"], "a": 0, "e": "Art. 34."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los documentos de identificación de proveedores se conservan en físico por diez años, contados desde:", "o": ["El día en que finaliza la relación", "El día en que se inicia la relación", "La última actualización del expediente", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 70. Trampa: los de operaciones se cuentan desde su ejecución."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las asociaciones son consideradas sujetos obligados en la LOCDOFT según:", "o": ["El artículo 9, numeral 6", "El artículo 7, numeral 12", "El artículo 5, numeral 2", "El artículo 9, numeral 10"], "a": 0, "e": "Tercer considerando."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una operación inusual que, analizada, se presume que involucra fondos ilegales es:", "o": ["Actividad sospechosa", "Riesgo residual", "Falta administrativa", "Operación ordinaria"], "a": 0, "e": "Art. 4.1."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la declaración jurada de origen y destino la suscriben los miembros de los consejos y:", "o": ["Los vinculados a la asociación", "Los funcionarios de la UNIF", "Los inspectores de SUDECA", "Los tribunales competentes"], "a": 0, "e": "Art. 4.11."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, toda inducción o capacitación debe constar en un documento denominado:", "o": ["Declaración de conocimiento", "Compromiso institucional", "Planilla de proveedores", "Declaración de destino"], "a": 0, "e": "Arts. 75 y 80."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, analizar operaciones inusuales y remitir el reporte a la UNIF corresponde al:", "o": ["Responsable de Cumplimiento", "Consejo de Administración", "Asociado que la detectó", "Proveedor de sistemas"], "a": 0, "e": "Art. 22.k."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el manual debe contener la lista de señales de alerta, que puede transmitirse:", "o": ["Entre asociaciones civiles del mismo sector", "Solo a los proveedores del sector privado", "Solo a las personas reportadas ante la UNIF", "Únicamente a los medios de comunicación"], "a": 0, "e": "Art. 83.12."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la Superintendencia puede revisar mediante sistemas remotos los archivos y sistemas informáticos de los sujetos obligados.", "a": true, "e": "Art. 18."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los inspectores de la División deben elaborar, sobre la ejecución del programa de cumplimiento:", "o": ["Un Informe de Administración de Riesgos de LC/FT/FPADM", "Un Reporte de Actividad Sospechosa por cada hallazgo", "Un Plan Anual de Actividades para la asociación", "Una matriz de riesgo aprobada por la ONCDOFT"], "a": 0, "e": "Art. 16. Trampa: los otros documentos existen, pero los elaboran otros."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, las operaciones inusuales detectadas en las inspecciones internas deben informarse al ente de control.", "a": true, "e": "Art. 87. Trampa: se suele pensar que solo se informan a la UNIF."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la planilla de identificación del asociado es un formato:", "o": ["Único, suministrado por la División de Inspección", "Libre, diseñado por cada consejo de administración", "Único, suministrado por la UNIF a cada caja", "Libre, aprobado por la asamblea de asociados"], "a": 0, "e": "Art. 51. Trampa: se cambia quién lo suministra o su carácter único."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la condición de PEP se mantiene hasta tres años después de la entrega o cese del cargo.", "a": false, "e": "Art. 60: cinco años. Trampa: se cambia el período."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el beneficiario final debe identificarse plenamente en préstamos, inversiones y:", "o": ["Pagos a proveedores", "Actas de asamblea", "Solicitudes de empleo", "Pagos de condominio"], "a": 0, "e": "Punto décimo sexto."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, si la ejecución de las inspecciones internas tuvo limitaciones, estas deben constar en el informe anual de resultados.", "a": true, "e": "Art. 88. Trampa: se cree que el informe solo recoge hallazgos."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el registro de las declaraciones de conocimiento del código de ética y del manual lo lleva el presidente del consejo de vigilancia.", "a": false, "e": "Art. 21, lit. c: lo lleva el presidente del consejo de administración. Trampa: se cambia de consejo."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, en la clasificación de PEP de la providencia, el Nivel 3 agrupa a los funcionarios con cargo a nivel local.", "a": false, "e": "Art. 61: el Nivel 3 es estatal; el local es el Nivel 4. Trampa: se corre un nivel."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, elaborar el manual de políticas de los sujetos obligados corresponde a la División de Inspección, en coordinación con el ente rector.", "a": true, "e": "Art. 7, num. 1. Trampa: se espera que lo elabore cada caja."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un asociado es mencionado en un periódico por presunto delito. Esto conlleva:", "o": ["Indagación previa, sin reporte automático", "Reporte automático dentro de 24 horas", "Suspensión inmediata de la asociación", "Ninguna acción, al no haber sentencia"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el plazo transitorio para ajustar las actividades y operaciones a la Providencia es de:", "o": ["Ciento ochenta días consecutivos", "Noventa días consecutivos", "Ciento ochenta días hábiles", "Sesenta días continuos"], "a": 0, "e": "Disposición transitoria. Trampa: noventa días es el plazo para implementar el programa tras la capacitación."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, una situación inusual que finalmente no se reportó como sospechosa debe constar también en el Libro de Actas.", "a": true, "e": "Punto décimo, numeral 1."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los controles profundos sobre un área específica se denominan:", "o": ["Fiscalizaciones tópicas", "Auditorías financieras", "Asambleas ordinarias", "Informes de gestión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la inducción al personal que tiene contacto directo con proveedores debe contemplar las políticas:", "o": ["Conozca a su empleado y conozca a su proveedor", "Conozca a su asociado y conozca a su empleador", "Conozca a su directivo y conozca a su asociado", "Conozca a su proveedor y conozca a su empleador"], "a": 0, "e": "Art. 78, num. 5. Trampa: todas son políticas de la Providencia, pero solo ese par figura en el numeral."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el RAS es un informe administrativo y por eso su envío sí puede acarrear responsabilidad administrativa.", "a": false, "e": "Art. 73: no acarrea responsabilidad civil, penal ni administrativa. Trampa: la primera parte es correcta."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, en caso de ausencia absoluta del responsable principal, se suplirá con:", "o": ["Su suplente, cuando su ubicación geográfica lo permita", "Un funcionario nombrado directamente por la UNIF", "El presidente del Consejo de Administración de la caja", "El asociado con el mayor monto de aportes acumulados"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, se sospecha falsedad en los datos de un nuevo proveedor y, en otro caso, se detecta falsedad en los de un asociado. Corresponde, respectivamente:", "o": ["Advertir no continuar; informar suspensión a SUDECA", "Informar suspensión a SUDECA; advertir no continuar", "Reportar a la UNIF en ambos casos sin más análisis", "Continuar con ambos hasta recibir instrucciones"], "a": 0, "e": "Arts. 55 y 69."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, en el Libro de Actas deben asentarse las situaciones inusuales:", "o": ["Aunque no lleguen a reportarse como sospechosas", "Solo si fueron confirmadas por una sentencia firme", "Solo cuando superen el umbral de cinco mil dólares", "Únicamente si el asociado autoriza su asiento"], "a": 0, "e": "Punto décimo, numeral 1."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el sujeto obligado puede añadir información a la planilla de identificación del asociado, sin modificar su información original.", "a": true, "e": "Art. 51. Trampa: se cree que un formato único no admite adiciones."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un sujeto reacciona a los tres días a un indicio de vinculación con terrorismo, alegando actuar sin demora. Su actuación:", "o": ["Incumple el máximo de veinticuatro horas", "Cumple el máximo de setenta y dos horas", "Incumple el máximo de cuarenta y ocho horas", "Cumple, porque la norma no fija un plazo"], "a": 0, "e": "Arts. 4.39 y 36."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, informar oportunamente a los asociados los puntos considerados por el responsable de cumplimiento es obligación del presidente del consejo de administración.", "a": true, "e": "Art. 21, literal b. Trampa: se espera que lo haga el propio responsable."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, como herramientas de control extra situ se consideran, entre otras:", "o": ["La fiscalización del vaciado de la matriz y el seguimiento posinspección", "La inspección física de cada expediente en la sede de la asociación", "La entrevista personal con cada uno de los asociados inscritos", "La revisión presencial de los libros durante una asamblea ordinaria"], "a": 0, "e": "Art. 12."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento es:", "o": ["El Presidente del Consejo de Vigilancia", "El Presidente del Consejo de Administración", "El contador contratado por la asociación", "El asociado con mayor antigüedad inscrita"], "a": 0, "e": "Arts. 4.32 y 22. Trampa: no es un oficial contratado."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, a un proveedor en zona fronteriza se le aplica debida diligencia intensificada verificando sus antecedentes en:", "o": ["Listas de sanciones como ONU y OFAC", "Registros escolares de la localidad", "Encuestas de opinión de los socios", "Directorios telefónicos regionales"], "a": 0, "e": "Punto décimo segundo."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, si una operación no consta en los libros, a efectos de supervisión:", "o": ["Se considera no controlada y acarrea sanciones", "Se considera válida mientras exista una factura", "Se presume aprobada por la asamblea de socios", "Se entiende exenta por no estar en el registro"], "a": 0, "e": "Punto décimo primero."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la declaración de origen de los fondos se pide a los proveedores después de contratarlos.", "a": false, "e": "Art. 86: se pide antes de contratar. Trampa: se invierte el momento."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la ejecución del Plan Anual se informa a la División con frecuencia:", "o": ["Trimestral", "Mensual", "Semestral", "Anual"], "a": 0, "e": "Art. 76."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el beneficiario final de un proveedor persona jurídica incluye a las personas naturales que ejercen su control por participación accionaria u otro medio.", "a": true, "e": "Art. 67. Trampa: se piensa solo en el accionista mayoritario."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los reportes de actividades sospechosas cuentan su lapso de conservación desde:", "o": ["Su remisión a la UNIF", "La detección de la alerta", "La aprobación del informe", "El inicio del ejercicio"], "a": 0, "e": "Arts. 44 y 70."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la expresión «sin demora» debe interpretarse como un lapso máximo de:", "o": ["Veinticuatro horas", "Cuarenta y ocho horas", "Setenta y dos horas", "Cinco días hábiles"], "a": 0, "e": "Art. 4.39."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el reporte de actividad sospechosa implica una denuncia y requiere sus formalidades.", "a": false, "e": "Arts. 4.31 y 73."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, si se sospecha falsedad en los datos de un nuevo proveedor, el responsable debe:", "o": ["Informar al consejo la necesidad de no continuar", "Contratar al proveedor y revisar luego el caso", "Llamar a la Fiscalía antes de hacer otro análisis", "Advertir al proveedor de la sospecha detectada"], "a": 0, "e": "Art. 69."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, vigilar la adecuada implementación, funcionamiento y actualización del SIAR corresponde a:", "o": ["El presidente del consejo de vigilancia", "El presidente del consejo de administración", "La asamblea de asociados", "La División de Inspección de SUDECA"], "a": 0, "e": "Art. 22, literal b. Trampa: la asamblea vela por que los demás cumplan (art. 20), pero no vigila el SIAR."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, el responsable de cumplimiento auxiliar aplica y supervisa las políticas en toda la asociación, sin limitarse a un área.", "a": false, "e": "Art. 29: dentro del área asignada. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, para implementar el programa de cumplimiento tras la capacitación recibida, el plazo fue de:", "o": ["Noventa días consecutivos", "Treinta días consecutivos", "Ciento veinte días hábiles", "Ciento ochenta días hábiles"], "a": 0, "e": "Disposición transitoria."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, en una investigación, una caja no tiene sus libros al día y alega que usa formularios. La consecuencia es que:", "o": ["Se presume la omisión intencional del ilícito", "Los formularios suplen los libros sin efecto", "Solo se considera un error de forma", "Se concede un plazo de veinte días"], "a": 0, "e": "Puntos décimo y décimo primero."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el capacitador del Programa Anual de Formación debe estar inscrito en:", "o": ["El Registro Único de Facilitadores del órgano rector", "El SIGECAF de la Superintendencia de Cajas de Ahorro", "El registro de proveedores de la propia asociación", "El Registro Unificado de Sujetos Obligados"], "a": 0, "e": "Art. 77. Trampa: el SIGECAF es el sistema de declaración de actividades."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, garantizar el cumplimiento de las auditorías relacionadas con la materia corresponde al responsable de cumplimiento principal.", "a": true, "e": "Art. 22, literal m. Trampa: se cree que es función del consejo de administración."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, en el expediente de cada asociado debe constar que conoció el contenido del manual.", "a": true, "e": "Art. 82."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la condición de PEP se extiende a los familiares hasta el cuarto grado de consanguinidad y segundo de afinidad y al círculo de colaboradores inmediatos.", "a": true, "e": "Art. 60. Trampa: se suele olvidar a los colaboradores."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, hacer cumplir el código de ética, el compromiso institucional y el manual corresponde a:", "o": ["El presidente del consejo de vigilancia", "El presidente del consejo de administración", "El responsable auxiliar de cada área", "La asamblea de asociados"], "a": 0, "e": "Art. 22, literal d. Trampa: el presidente de administración lleva el registro de las declaraciones (art. 21, lit. c), pero no hace cumplir los instrumentos."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los sujetos obligados tuvieron para ajustarse a la norma, desde su publicación:", "o": ["Ciento ochenta días consecutivos", "Noventa días consecutivos", "Sesenta días consecutivos", "Trescientos días consecutivos"], "a": 0, "e": "Disposición transitoria."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "vf", "q": "Según la Convención de Palermo, el blanqueo debe tipificarse en el derecho interno exigiendo el carácter transnacional del hecho.", "a": false, "e": "Art. 34, párrafo 2: se tipifica con independencia del carácter transnacional. Trampa: se confunde el ámbito de aplicación del tratado con el tipo penal interno."}, {"t": "mc", "q": "Según la Convención de Palermo, la obstrucción de la justicia se penaliza en su artículo:", "o": ["23", "8", "24", "25"], "a": 0, "e": "El 24 protege a los testigos y el 25 a las víctimas. Trampa: artículos vecinos de materia cercana."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas coordinadas y eficaces contra la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal especial contra la corrupción", "Prohibir las donaciones a partidos políticos"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, la entrega vigilada se decide caso por caso y la remesa ilícita puede sustituirse total o parcialmente.", "a": true, "e": "Art. 11, párrafos 2 y 3. Trampa: se cree que la remesa debe circular intacta."}, {"t": "mc", "q": "Según la Convención de Palermo, la «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Art. 18, párrafo 9. Requisito clásico de la asistencia y la extradición."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Que un Estado no extradite a sus nacionales, según estos convenios, obliga a:", "o": ["Juzgarlo internamente por el mismo hecho", "Expulsarlo hacia un tercer país que lo reclame", "Suspender la investigación", "Entregar solo sus bienes"], "a": 0, "e": "Es la contrapartida de la no extradición de nacionales."}, {"t": "vf", "q": "Según la Convención de Mérida, la doble incriminación se cumple solo si ambos Estados denominan el delito de la misma manera.", "a": false, "e": "Art. 43, párrafo 2: basta que la conducta sea delito en ambos. Trampa: se exige identidad de nombre."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), el Convenio se aplica aunque el delito se cometa en un solo Estado, por un nacional que se encuentra en él.", "a": false, "e": "Art. 3: se excluye ese supuesto puramente interno si ningún otro Estado tiene base para ejercer jurisdicción. Trampa: se omite el elemento internacional."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado sin autorización", "Opinar públicamente sobre una licitación que está en curso", "Reunirse con representantes de empresas privadas"], "a": 0, "e": "Artículo 18."}, {"t": "vf", "q": "Según la Convención de Palermo, un grupo estructurado puede ser uno formado fortuitamente para cometer de inmediato un delito.", "a": false, "e": "Art. 2, literal c: es el no formado fortuitamente. Trampa: la LOCDOFT define grupo estructurado al revés."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, los delitos de tráfico pueden considerarse delitos fiscales o políticos para negar la cooperación.", "a": false, "e": "Art. 3, párrafo 10. Trampa: se invierte la regla."}, {"t": "mc", "q": "Según la Convención de Mérida, la responsabilidad de las personas jurídicas se regula en su artículo:", "o": ["26", "10", "23", "31"], "a": 0, "e": "Trampa: el artículo 10 es el de Palermo."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación internacional y la recuperación de activos ocupan, respectivamente, los capítulos:", "o": ["IV y V", "III y IV", "V y VI", "II y III"], "a": 0, "e": "El II es prevención; el III, penalización; el VI, asistencia técnica."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las consideraciones políticas o ideológicas frente a estos delitos:", "o": ["No pueden justificarlos en ninguna circunstancia", "Pueden atenuar la pena si el móvil es político", "Impiden la extradición del autor en todo caso", "Excluyen la responsabilidad de las organizaciones"], "a": 0, "e": "Art. 6."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad en materia de sanciones financieras obligan a los Estados a:", "o": ["Congelar fondos de personas y entidades designadas", "Expulsar a los designados del territorio nacional", "Suspender relaciones diplomáticas", "Cerrar sus fronteras terrestres"], "a": 0, "e": "Base de las sanciones financieras dirigidas."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "El delito que define el Convenio de 1999 se consuma cuando una persona:", "o": ["Provee o recolecta fondos con intención de uso terrorista", "Participa materialmente en el atentado", "Pertenece a una organización prohibida", "Difunde propaganda a favor de organizaciones terroristas"], "a": 0, "e": "Artículo 2 del Convenio."}, {"t": "mc", "q": "Según la Convención de Palermo, una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito investigado es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado se encuentra prófugo de la justicia"], "a": 0, "e": "Art. 18, párrafo 21. Causales previstas en los tratados."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Si Venezuela ratificó Palermo, el efecto para un sujeto obligado venezolano es que:", "o": ["Su normativa interna debe reflejar esos compromisos", "Debe aplicar el tratado e
