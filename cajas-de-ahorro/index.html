0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "El artículo 18 del Convenio de 1999 pide a los Estados exigir a las instituciones financieras:", "o": ["Identificar clientes y reportar operaciones sospechosas", "Limitar las transferencias internacionales", "Cerrar las cuentas de todas las organizaciones benéficas", "Depositar reservas en el banco central"], "a": 0, "e": "Medidas preventivas de corte antilavado."}, {"t": "mc", "q": "La diferencia esencial entre un convenio y una recomendación del GAFI es que el convenio:", "o": ["Obliga jurídicamente al Estado que lo ratifica", "Se aplica solo a las instituciones financieras", "Puede modificarse por decisión del GAFI", "Tiene vigencia limitada a cinco años"], "a": 0, "e": "Fuerza vinculante frente a estándar."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Serán siempre delitos políticos", "Quedarán sujetos a la discreción del requerido", "Solo se extraditarán entre países vecinos"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno de funcionarios públicos extranjeros es una conducta que los Estados deben tipificar.", "a": true, "e": "Art. 16, párrafo 1."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "Según Palermo, los Estados deben instituir un régimen interno de reglamentación y supervisión que incluya:", "o": ["Identificación de clientes y reporte de sospechosas", "Aprobación judicial de toda transacción financiera", "Prohibición de operaciones de más de cierto monto", "Autorización de la ONU para cada transferencia"], "a": 0, "e": "Art. 7 de Palermo: bancos e instituciones financieras no bancarias; cooperación e intercambio de información."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "mc", "q": "El Convenio de Budapest, cuando se menciona en esta materia, trata de:", "o": ["La ciberdelincuencia y la prueba electrónica", "La corrupción en el deporte", "El tráfico de bienes culturales", "La protección de los datos personales en línea"], "a": 0, "e": "Relevante por el delito informático como delito determinante."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Palermo contempla la responsabilidad de las personas jurídicas por participación en delitos graves en que intervenga un grupo delictivo organizado. Esto significa que:", "o": ["La empresa responde sin condena de una persona", "Solo los directivos responden penalmente", "La empresa queda exenta si no obtuvo lucro", "La responsabilidad es solo moral"], "a": 0, "e": "Art. 10 de Palermo: responsabilidad penal, civil o administrativa, sin perjuicio de la de las personas naturales."}, {"t": "mc", "q": "Palermo se complementa con un número de protocolos igual a:", "o": ["Tres", "Dos", "Cuatro", "Uno"], "a": 0, "e": "Trata de personas, tráfico de migrantes y armas de fuego."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "El artículo 16 de Palermo se refiere a:", "o": ["La extradición entre los Estados parte", "La asistencia judicial recíproca", "La protección de los testigos", "Las técnicas especiales de investigación"], "a": 0, "e": "El 18 regula la asistencia judicial recíproca."}, {"t": "vf", "q": "Según el Convenio de 1999, no es necesario que los fondos se hayan utilizado efectivamente para que exista delito.", "a": true, "e": "La consumación es anticipada."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "El artículo 18 de Palermo regula:", "o": ["La asistencia judicial recíproca más amplia posible", "El traslado de personas condenadas entre Estados", "La creación de equipos conjuntos", "La protección de las víctimas"], "a": 0, "e": "Es uno de los artículos más extensos del tratado."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana contra la Corrupción es conocido como:", "o": ["MESICIC", "GAFIC", "CICAD", "MONEYVAL"], "a": 0, "e": "Mecanismo de Seguimiento de la Implementación de la Convención Interamericana contra la Corrupción."}, {"t": "mc", "q": "Palermo obliga a penalizar la participación en un grupo delictivo organizado en su artículo:", "o": ["5", "6", "8", "23"], "a": 0, "e": "El 6 penaliza el blanqueo y el 8 la corrupción."}, {"t": "mc", "q": "Según el Convenio de 1999, comete delito de financiación del terrorismo quien:", "o": ["Provee o recolecta fondos sabiendo su uso terrorista", "Comete personalmente el acto terrorista con sus fondos", "Solo quien recibe fondos de origen ilícito", "Solo quien traslada efectivo por una frontera"], "a": 0, "e": "Art. 2: basta la intención o el conocimiento del uso de los fondos."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se conoce como Convención de:", "o": ["Mérida", "Palermo", "Viena", "Caracas"], "a": 0, "e": "Adoptada en 2003; el nombre proviene de la ciudad mexicana donde se abrió a firma."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}]}]}, {"titulo": "Enfoque basado en riesgo", "exams": [{"titulo": "Enfoque basado en riesgo · modelo 1", "q": [{"t": "mc", "q": "La integración del área de cumplimiento en el diseño de productos busca:", "o": ["Identificar riesgos antes de salir al mercado", "Retrasar el lanzamiento de la competencia", "Aumentar el precio final del producto", "Sustituir al área de mercadeo"], "a": 0, "e": "Cumplimiento desde el diseño."}, {"t": "mc", "q": "Un corredor cuyo nivel de vida no guarda relación con sus comisiones debe:", "o": ["Ser objeto de análisis por el área de cumplimiento", "Ser premiado por su desempeño comercial", "Ser cambiado de zona geográfica", "Ser ignorado por tratarse de su vida privada"], "a": 0, "e": "Riesgo interno previsto en la norma."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para en sí mismo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Una señal de que la cultura de cumplimiento es débil es que:", "o": ["Las excepciones al procedimiento se vuelvan rutina", "El manual se actualice todos los años", "La capacitación sea obligatoria para todo el personal", "La junta reciba informes trimestrales"], "a": 0, "e": "La excepción normalizada erosiona el control."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Únicamente su monto reducido por operación", "Únicamente el volumen total vendido del año", "Únicamente el país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Para un cliente de riesgo bajo, la frecuencia de actualización:", "o": ["Puede ser mayor, siempre que esté justificada", "Debe ser igual a la del riesgo alto", "No es necesaria en ningún caso", "La fija el intermediario que captó al cliente"], "a": 0, "e": "Proporcionalidad documentada."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su contrato se anula automáticamente", "Su tarifa debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "Si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "mc", "q": "Lo contrario del enfoque basado en riesgo es un enfoque:", "o": ["De cumplimiento uniforme y formalista", "De supervisión consolidada", "De debida diligencia continua para toda la cartera", "De gestión por procesos"], "a": 0, "e": "El modelo de «misma medida para todos» desperdicia recursos."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica", "Excluye el de baja probabilidad", "Excluye el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}, {"t": "mc", "q": "Un asegurado que contrata una suma muy superior a su capacidad económica declarada:", "o": ["Genera una alerta sobre el origen de los fondos", "Demuestra previsión financiera", "Debe recibir un descuento comercial por fidelidad", "Solo interesa al área actuarial"], "a": 0, "e": "Incoherencia entre perfil y operación."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "El riesgo reputacional derivado de un caso de lavado consiste en:", "o": ["La pérdida de confianza de clientes y contrapartes", "El costo de la multa impuesta", "La pérdida de la provisión contable constituida", "El aumento de la morosidad"], "a": 0, "e": "Es distinto del riesgo legal y del financiero."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}]}, {"titulo": "Enfoque basado en riesgo · modelo 2", "q": [{"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "El expediente de una alerta descartada debe conservarse porque:", "o": ["Puede ser revisado por el supervisor o la autoridad", "Sirve para calcular las comisiones del área comercial", "Permite renegociar la tarifa del cliente", "Es exigido por la ley tributaria"], "a": 0, "e": "La decisión debe poder auditarse."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la autoevaluación identifica un riesgo nuevo y no se modifica ningún control. Falta:", "o": ["Un plan de mitigación con responsables", "Un reporte de sospecha sobre el riesgo", "Una nueva calificación de los auditores", "Una inspección del órgano supervisor"], "a": 0, "e": "La evaluación debe traducirse en acciones."}, {"t": "mc", "q": "La evaluación del riesgo de un producto debe incluir, entre otros aspectos:", "o": ["Su liquidez, su forma de pago y su canal de venta", "Su rentabilidad esperada y su cuota de mercado", "El número de competidores que lo ofrecen", "La antigüedad del ramo en la empresa"], "a": 0, "e": "Características que lo hacen atractivo para el delito."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Que la empresa conozca el propósito de la relación con el cliente permite:", "o": ["Detectar después lo que no encaja con ese propósito", "Ofrecerle productos adicionales de la cartera", "Reducir el plazo de emisión del contrato", "Justificar un aumento de la tarifa"], "a": 0, "e": "El propósito es la vara para medir lo inusual."}, {"t": "mc", "q": "El riesgo interno o de personal se mitiga, entre otras medidas, con:", "o": ["Políticas de conocimiento del empleado y rotación", "Aumento general de los salarios", "Reducción de la plantilla operativa", "Eliminación de los controles duales para agilizar"], "a": 0, "e": "Conoce a tu empleado."}, {"t": "mc", "q": "El riesgo asociado a la contratación totalmente digital se mitiga con:", "o": ["Verificación de identidad reforzada y biometría", "Reducción del monto máximo asegurable", "Eliminación del expediente del cliente", "Traslado de la responsabilidad al cliente"], "a": 0, "e": "Medidas compensatorias para la no presencialidad."}, {"t": "mc", "q": "Un cliente insiste en contratar sin dejar datos de contacto verificables. Eso:", "o": ["Impide completar la diligencia y obliga a no vincularlo", "Es aceptable si deja al menos un número de teléfono", "Se resuelve con una declaración jurada", "Solo importa en contratos de alto valor"], "a": 0, "e": "Sin identificación plena no hay relación."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "vf", "q": "Quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Evitar un riesgo, en el lenguaje de la gestión, significa:", "o": ["No realizar la actividad que lo genera", "Contratar un seguro que lo cubra", "Reducir su probabilidad con controles", "Aceptarlo y monitorearlo"], "a": 0, "e": "Evitar, mitigar, transferir y aceptar son las cuatro respuestas."}, {"t": "mc", "q": "¿Qué significa aplicar un enfoque basado en riesgo (EBR)?", "o": ["Más medidas a mayor riesgo, simplificadas a menor", "Aplicar controles uniformes sin considerar el riesgo", "Eliminar controles ante riesgos bajos sin monitoreo", "Concentrar controles en las operaciones de mayor monto"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la metodología de riesgos se apoya, además del GAFI, en las normas:", "o": ["ISO 31000 e ISO 31010", "ISO 9001 e ISO 14001", "NIIF 9 y NIIF 17", "ISO 27001 e ISO 22301"], "a": 0, "e": "Sección introductoria."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "El análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "mc", "q": "Pagar una indemnización a una cuenta distinta de la del asegurado requiere:", "o": ["Verificar la instrucción y la relación con el titular", "Ejecutarla siempre que el asegurado la pida por escrito", "Rechazarla siempre sin análisis", "Dividir el pago en varias partes"], "a": 0, "e": "El destino de los fondos también se controla."}, {"t": "mc", "q": "Dentro del factor cliente, un elemento que eleva el riesgo es:", "o": ["Que el cliente sea una persona expuesta políticamente", "Que el cliente pague por transferencia bancaria", "Que el cliente tenga domicilio en la capital", "Que el cliente contrate varios ramos"], "a": 0, "e": "La exposición política es factor reconocido."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, ante un riesgo mayor corresponde aplicar medidas:", "o": ["Intensificadas", "Simplificadas", "Opcionales", "Suspendidas"], "a": 0, "e": "Principio de proporcionalidad."}, {"t": "mc", "q": "La ponderación de los factores en una matriz de riesgo debe:", "o": ["Justificarse con criterios documentados", "Asignarse al azar para evitar sesgos", "Copiarse de otra empresa del sector", "Fijarla el auditor externo cada año"], "a": 0, "e": "La metodología debe ser explicable al supervisor."}, {"t": "vf", "q": "Un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "vf", "q": "El supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "mc", "q": "Si la empresa no sabe a qué se dedica un cliente, lo que ocurre es que:", "o": ["No puede evaluar si sus operaciones son coherentes", "Debe clasificarlo automáticamente como riesgo bajo", "Puede aceptarlo con una tarifa mayor", "Debe trasladar el análisis al proveedor"], "a": 0, "e": "Sin conocimiento no hay monitoreo posible."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "Frente a un hallazgo del auditor, la respuesta adecuada incluye:", "o": ["Un plan con responsable, acción y fecha", "Una nota explicando que es un criterio discutible", "El archivo del hallazgo por no ser material", "La espera a la próxima auditoría"], "a": 0, "e": "Los hallazgos se cierran con acciones verificables."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "vf", "q": "Lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Una matriz de riesgo que clasifica a toda la cartera como riesgo bajo probablemente indica:", "o": ["Una metodología mal calibrada", "Una cartera excepcionalmente sana", "Un control interno muy eficaz", "Un supervisor poco exigente"], "a": 0, "e": "La ausencia total de riesgo alto es una señal de alerta metodológica."}, {"t": "mc", "q": "La debida diligencia simplificada corresponde al riesgo:", "o": ["Bajo", "Moderado", "Alto", "Crítico"], "a": 0, "e": "Y nunca ante sospecha."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "mc", "q": "¿Qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual y sospechosa son lo mismo en toda norma", "Sospechosa es la de monto alto; inusual la de monto bajo", "Inusual se reporta siempre; sospechosa solo se analiza"], "a": 0, "e": "El análisis media entre ambas."}, {"t": "mc", "q": "Una medida típica de la debida diligencia intensificada es:", "o": ["Verificar el origen de los fondos y de la riqueza", "Solicitar una copia adicional de la cédula de identidad", "Cobrar una tarifa más elevada", "Reducir la suma asegurada ofrecida"], "a": 0, "e": "Se profundiza en el conocimiento, no en el precio."}, {"t": "mc", "q": "Un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Un plan de mitigación debe indicar, para cada riesgo identificado:", "o": ["El control, el responsable y el plazo", "El monto de la pérdida esperada", "La tarifa que compensa ese riesgo", "El número de clientes afectados"], "a": 0, "e": "Sin responsable y plazo no hay gestión."}, {"t": "mc", "q": "Cuando el riesgo residual queda por encima del apetito definido, corresponde:", "o": ["Reforzar controles o no asumir la operación", "Aceptarlo y documentarlo sin más", "Aumentar el apetito de riesgo declarado", "Trasladar la decisión al cliente"], "a": 0, "e": "El apetito se respeta o se revisa formalmente."}, {"t": "mc", "q": "Al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Rechazarlas como clientes por el principio de prudencia", "Tratarlas siempre como riesgo bajo", "Exigirles una garantía bancaria"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "mc", "q": "Si dos analistas aplican la misma metodología y obtienen resultados muy distintos, el problema es:", "o": ["Que la metodología no es suficientemente objetiva", "Que uno de los dos no está capacitado", "Que el cliente cambió de perfil", "Que el sistema informático tiene un error técnico"], "a": 0, "e": "La consistencia es un atributo de la metodología."}]}, {"titulo": "Enfoque basado en riesgo · modelo 3", "q": [{"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "mc", "q": "La trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "mc", "q": "¿Por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "Al evaluar un canal de venta digital, un control compensatorio adecuado es:", "o": ["La verificación reforzada de identidad a distancia", "La reducción del horario de atención", "El aumento del precio del producto", "La limitación de la venta a clientes de la capital"], "a": 0, "e": "Mitigar la ausencia de contacto presencial."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "¿Qué exige la Recomendación 1 del GAFI a los países?", "o": ["Evaluar riesgos y aplicar enfoque basado en riesgo", "Aplicar el mismo control a todos los clientes", "Prohibir el uso de efectivo en el sistema financiero", "Crear una unidad de inteligencia en cada banco"], "a": 0, "e": "Base del sistema."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "El indicador más útil para medir la salud del sistema de prevención es:", "o": ["La calidad del análisis de las alertas generadas", "El número de páginas que tiene el manual vigente", "La cantidad de personal del área", "El presupuesto ejecutado en el año"], "a": 0, "e": "Calidad del proceso, no insumos."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Aplicar el enfoque basado en riesgo a un cliente que es APNFD implica:", "o": ["Considerar el riesgo propio de su actividad", "Asignarle automáticamente riesgo alto", "Eximirlo de la debida diligencia", "Prohibirle contratar servicios"], "a": 0, "e": "Riesgo evaluado caso a caso."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "vf", "q": "El EBR permite que, ante riesgos menores demostrados, se apliquen medidas simplificadas, pero no la eliminación total de controles.", "a": true, "e": "Hay excepciones limitadas; la regla es simplificar."}, {"t": "mc", "q": "La figura del «riesgo aceptado» exige, para ser legítima:", "o": ["Una decisión consciente, documentada y del nivel adecuado", "Que nadie en la empresa lo conozca", "Que el supervisor del sector lo apruebe por escrito", "Que el cliente firme una exoneración"], "a": 0, "e": "Aceptar riesgo no es ignorarlo."}, {"t": "mc", "q": "¿Cuál es el propósito del reporte de operaciones sospechosas (R.20)?", "o": ["Dar a la UIF información para detectar patrones", "Denunciar penalmente a las personas sospechosas", "Sancionar administrativamente al cliente reportado", "Cobrar impuestos sobre operaciones inusuales"], "a": 0, "e": "El ROS es insumo de inteligencia."}, {"t": "mc", "q": "El riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "El plan operativo anual en materia de prevención debe contener:", "o": ["Actividades, responsables, plazos y recursos", "Las metas comerciales del ejercicio", "El listado de clientes de alto riesgo", "Las tarifas aprobadas por el supervisor"], "a": 0, "e": "Instrumento de gestión, no declarativo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "El sistema de administración de riesgos debe combinar controles preventivos, detectivos y correctivos.", "a": true, "e": "Las tres capas se complementan."}, {"t": "mc", "q": "¿Qué significa «conoce a tu empleado» como principio de cumplimiento?", "o": ["Seleccionar y vigilar al personal", "Evaluar la estatura profesional del candidato", "Limitar el sueldo de los empleados clave", "Evitar nuevas contrataciones en cumplimiento"], "a": 0, "e": "Riesgo interno."}, {"t": "mc", "q": "La rotación de funciones sensibles y el disfrute obligatorio de vacaciones sirven para:", "o": ["Detectar irregularidades que requieren presencia continua", "Reducir los costos laborales que soporta la empresa", "Mejorar el clima organizacional", "Cumplir la normativa laboral únicamente"], "a": 0, "e": "Control clásico contra el fraude interno."}, {"t": "mc", "q": "Transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["No es EBR: excluye y empuja a canales informales", "Es la mejor práctica y la exige el GAFI", "Es obligatorio cuando el sector tiene riesgo alto", "Es irrelevante para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "Un plan operativo que se ejecuta en un cincuenta por ciento revela:", "o": ["Una debilidad que exige acciones correctivas", "Un desempeño aceptable del área", "Un plan demasiado conservador", "Una gestión eficiente de los recursos disponibles"], "a": 0, "e": "El informe de ejecución sirve para corregir."}, {"t": "mc", "q": "¿Cuál es un riesgo de que las OSFL sean tratadas como sospechosas en bloque?", "o": ["Limitar su acceso a servicios y desviar flujos", "Reducir la recaudación de impuestos de esas entidades", "Aumentar la inversión extranjera en esos sectores", "Ninguno, porque la medida es proporcional al riesgo"], "a": 0, "e": "La R.8 pide un enfoque focalizado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "mc", "q": "Una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis. El problema es que:", "o": ["No puede demostrar que el riesgo sea menor", "La diligencia simplificada está prohibida", "Solo el supervisor puede aplicarla al segmento", "El segmento debió pasar a diligencia ampliada"], "a": 0, "e": "La simplificación se sustenta en un análisis documentado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Si la información de un cliente está desactualizada hace años, ¿qué riesgo existe?", "o": ["Que el perfil no refleje la realidad", "Que se genere una multa automática de SUDEASEG", "Que se cancele el contrato por falta de datos", "Ninguno si el cliente paga puntualmente la tarifa"], "a": 0, "e": "El perfil debe actualizarse según riesgo."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "vf", "q": "Un sujeto obligado que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente de bajo riesgo comienza a mover montos diez veces mayores a su perfil, con explicación verbal coherente. Lo correcto es:", "o": ["Revisar su perfil y examinar las operaciones", "Mantenerlo igual por su calificación vigente", "Reportarlo de inmediato sin ningún análisis", "Terminar la relación antes de examinar"], "a": 0, "e": "El perfil es dinámico; la explicación debe corroborarse."}, {"t": "mc", "q": "Documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "mc", "q": "El intercambio de información entre sujetos obligados sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en el contrato"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "mc", "q": "Dentro del factor tecnológico, eleva el riesgo el uso de:", "o": ["Medios que permiten anonimato o fragmentación", "Firmas electrónicas certificadas", "Sistemas de monitoreo automatizados de operaciones", "Bases de datos centralizadas"], "a": 0, "e": "La tecnología puede reducir o aumentar riesgo según su uso."}, {"t": "mc", "q": "El programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Si el sistema de monitoreo no cubre un producto nuevo, la consecuencia práctica es:", "o": ["Un punto ciego donde no se detectan alertas", "Un ahorro de recursos justificado", "Una mejora en la velocidad del sistema", "Una reducción del riesgo residual"], "a": 0, "e": "La cobertura del monitoreo es parte del control."}, {"t": "mc", "q": "Una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "vf", "q": "Compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}]}]}], "all": [{"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la tarifa se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "Según la LOCDOFT, el traslado de efectivo por frontera se controla mediante:", "o": ["Una declaración obligatoria por encima de un umbral", "Una autorización previa otorgada por el órgano rector", "Una prohibición total de llevar efectivo", "Un impuesto a la salida de divisas"], "a": 0, "e": "Declaración, no prohibición."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada empresa", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "mc", "q": "Según la LOCDOFT, no conservar documentos durante el plazo legal se sanciona con:", "o": ["300 a 500 U.T.", "500 a 1.000 U.T.", "1.000 a 3.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las tarifas de servicios", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el registro unificado de sujetos obligados se identifica como:", "o": ["RUSO-ONCDOFT", "RUAP-ONCDOFT", "RIF-ONCDOFT", "SIAR-ONCDOFT"], "a": 0, "e": "G.O. 42.118. El RUAP es el registro de actuación de los contadores."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "Según el Decreto 3.656, el objeto de la UNIF es centralizar, procesar y analizar:", "o": ["Los reportes de actividades sospechosas", "Las declaraciones de impuestos del país", "Las licencias de los sujetos obligados", "Los registros mercantiles de empresas"], "a": 0, "e": "Art. 2 del Decreto de Adecuación, G.O. 41.522."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Si la UNIF pide información a un sujeto obligado sobre un cliente, el sujeto obligado debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "Según la LOCDOFT, no aplicar medidas especiales sobre operaciones con territorios de regulación insuficiente se sanciona con:", "o": ["3.000 a 5.000 U.T.", "1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T."], "a": 0, "e": "Art. 19."}, {"t": "mc", "q": "Un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Un sujeto obligado con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "Según la LOCDOFT, el destinatario de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Arts. 13, 24 y 25 en concordancia con el Decreto 3.656."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre empresa y cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un contr
