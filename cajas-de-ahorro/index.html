n nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, la protección frente a responsabilidad por el reporte alcanza al sujeto obligado, pero no a sus empleados.", "a": false, "e": "Art. 13: al sujeto obligado, a sus empleados y a quien lo suscribe. Trampa: se recorta el alcance."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Art. 14. Reserva de la investigación."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la LOCDOFT, las sucursales en el exterior aplican el estándar del país donde operan, aunque sea menos exigente.", "a": false, "e": "Art. 20: se les exige el estándar más alto. Trampa: el principio territorial."}, {"t": "mc", "q": "Según la LOCDOFT, un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Art. 32, numeral 4. Sanción de carácter reputacional."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede suscribir memorandos de entendimiento con unidades homólogas de otros países.", "a": true, "e": "Art. 25, numeral 5. Trampa: se cree que solo el órgano rector o la cancillería pueden hacerlo."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Providencia SAA-01-0536-2024 de SUDEASEG", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "vf", "q": "Según la LOCDOFT, todos los hoteles y centros de turismo son sujetos obligados.", "a": false, "e": "Art. 9, numeral 5: los autorizados a realizar operaciones de cambio de divisas. Trampa: se quita la condición."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según la LOCDOFT, el órgano de control de las organizaciones con fines políticos es:", "o": ["El Consejo Nacional Electoral", "El Ministerio de Relaciones Interiores", "La Asamblea Nacional de la República", "El Tribunal Supremo de Justicia"], "a": 0, "e": "Art. 7, numeral 16. Trampa: el ministerio de relaciones interiores es órgano de control, pero de otros sujetos."}, {"t": "mc", "q": "Según la LOCDOFT, la ONCDOFT asesora técnicamente, en las relaciones internacionales sobre la materia, al ministerio con competencia en:", "o": ["Relaciones exteriores", "Planificación y finanzas", "Relaciones interiores y justicia", "Economía y comercio"], "a": 0, "e": "Art. 6, numeral 7. Trampa: la ONCDOFT depende del de relaciones interiores, pero asesora al de relaciones exteriores."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "Según la LOCDOFT, la diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Arts. 13 y 17. Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "vf", "q": "Según la LOCDOFT, la prohibición de revelar alcanza también el hecho de haber entregado información a otras autoridades competentes.", "a": true, "e": "Art. 14. Trampa: se cree que solo cubre el reporte a la UNIF."}, {"t": "vf", "q": "Según la LOCDOFT, la confiscación es una pena accesoria, mientras que el decomiso recae sobre bienes abandonados o no reclamados.", "a": true, "e": "Art. 4, numerales 7 y 8. Trampa: suelen usarse como sinónimos."}, {"t": "vf", "q": "Según la LOCDOFT, cuando una persona jurídica contribuye intencionalmente a estos delitos, el Ministerio Público notifica al órgano de control para las medidas administrativas.", "a": true, "e": "Art. 31. Trampa: se cree que la vía penal excluye la administrativa."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control pueden intercambiar la información que obtienen con otras autoridades legalmente facultadas para ello.", "a": true, "e": "Art. 8, numeral 7. Trampa: se cree que la reserva impide todo intercambio entre autoridades."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "vf", "q": "Según la LOCDOFT, un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "Art. 13. El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "mc", "q": "Según la LOCDOFT, elaborar el análisis situacional que sirve de fundamento a las políticas públicas del Estado en la materia corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 6, numeral 3. Trampa: la UNIF analiza casos; el análisis situacional para las políticas es del órgano rector."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "mc", "q": "Según la Metodología de evaluación del GAFI, un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "vf", "q": "Según la LOCDOFT, el concepto de fondos comprende solo los activos de origen ilícito.", "a": false, "e": "Art. 4, numeral 11: con independencia de la licitud o ilicitud de su origen. Trampa: se restringe el concepto."}, {"t": "vf", "q": "Según la LOCDOFT, la categoría de sujeto obligado puede extenderse a otros actores mediante providencia del órgano rector.", "a": false, "e": "Art. 9, parte final: mediante ley o decreto. Trampa: se rebaja el rango del instrumento."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Art. 9, numeral 10. Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un delito es grave cuando su pena excede de cinco años de prisión o cuando:", "o": ["Afecta intereses colectivos y difusos", "Lo comete un funcionario público", "Se comete en más de un Estado", "Produce un daño patrimonial alto"], "a": 0, "e": "Art. 4, numeral 10. Trampa: se recuerda la pena y se olvida el segundo supuesto."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF puede requerir a los sujetos obligados información sobre transacciones que puedan vincularse con estos delitos, aunque no exista un reporte previo.", "a": true, "e": "Art. 25, numeral 2. Trampa: se cree que solo analiza lo que recibe por reporte."}, {"t": "vf", "q": "Según la Recomendación 8 del GAFI, una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "vf", "q": "Según la LOCDOFT, la correspondencia comercial se conserva cinco años contados desde su fecha de emisión.", "a": false, "e": "Art. 10, numeral 4: después de concluida la relación comercial. Trampa: se cambia el hecho que inicia el plazo."}, {"t": "mc", "q": "Según la LOCDOFT, diseñar programas de capacitación para funcionarios del Poder Judicial y del Ministerio Público corresponde a:", "o": ["La ONCDOFT", "La UNIF", "La Defensa Pública", "El Tribunal Supremo"], "a": 0, "e": "Art. 6, numeral 5. Trampa: se piensa en la UNIF por su perfil técnico."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "vf", "q": "Según la LOCDOFT, el aseguramiento preventivo de bienes puede ordenarlo el órgano de control del sujeto obligado.", "a": false, "e": "Art. 4, numeral 4: por mandato del tribunal competente. Trampa: se cambia la autoridad."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es un órgano desconcentrado que depende del ministerio con competencia en relaciones interiores y justicia.", "a": false, "e": "Art. 24: del ministerio de planificación y finanzas. Trampa: relaciones interiores y justicia es el ministerio del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Como coautor del delito, por el cargo que ocupa", "Por la vía civil, pero no por la vía penal", "Ante el órgano de control, pero no ante el juez"], "a": 0, "e": "Art. 36. La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "mc", "q": "Según la LOCDOFT, varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Art. 22. Se vigila el propósito de evitar la ocultación."}, {"t": "vf", "q": "Según la LOCDOFT, el grupo estructurado es el formado deliberadamente para la comisión inmediata de un delito.", "a": true, "e": "Art. 4, numeral 12. Trampa: Palermo lo define al revés, como el no formado fortuitamente."}, {"t": "vf", "q": "Según la LOCDOFT, la notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Art. 58. Es una garantía procesal."}, {"t": "vf", "q": "Según la LOCDOFT, otorgar, suspender o cancelar licencias de los sujetos obligados es atribución del órgano rector.", "a": false, "e": "Art. 8, numeral 4: de los órganos y entes de control. Trampa: se cambia el sujeto."}, {"t": "mc", "q": "Según la LOCDOFT, dirigir a los cuerpos de policía de investigaciones penales en estos delitos corresponde a:", "o": ["El Ministerio Público", "La ONCDOFT", "La UNIF", "El juez de control"], "a": 0, "e": "Art. 26. Trampa: el juez autoriza medidas, pero no dirige la investigación."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "vf", "q": "Según la LOCDOFT, una actividad es sospechosa por el solo hecho de ser compleja o no convencional, sin necesidad de análisis.", "a": false, "e": "Art. 4, numeral 2: la que, después de analizada, haga presumir fondos ilícitos. Trampa: se omite el análisis."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "Art. 6. La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Según la LOCDOFT, entre los profesionales en libre ejercicio que pueden ser sujetos obligados no se menciona a:", "o": ["Los ingenieros", "Los economistas", "Los administradores", "Los contadores"], "a": 0, "e": "Art. 9, numeral 9: abogados, administradores, economistas y contadores. Trampa: se suele pensar solo en abogados y contadores."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Art. 13. Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "Según la LOCDOFT, adoptar e implementar las medidas y directrices de la ONCDOFT es una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 1. Trampa: se cree que los órganos de control actúan con independencia del rector."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un reporte de sospecha", "Aceptarlo con monitoreo reforzado durante el primer año", "Iniciar la relación si el pago es por transferencia", "Pedir el dato en la renovación y vincularlo de inmediato"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Según la LOCDOFT, los países o territorios que exigen atención especial son dados a conocer a los sujetos obligados por:", "o": ["Los órganos y entes de control", "La UNIF, mediante circular", "El órgano rector, cada año", "El Banco Central de Venezuela"], "a": 0, "e": "Art. 19, parte final. Trampa: se piensa en la UNIF por ser quien recibe los reportes."}, {"t": "mc", "q": "Según la LOCDOFT, dictar normas e instructivos que ayuden a los sujetos obligados a detectar patrones sospechosos corresponde a:", "o": ["Los órganos y entes de control", "La UNIF, mediante sus circulares", "La ONCDOFT, como órgano rector", "El Ministerio Público"], "a": 0, "e": "Art. 8, numeral 10. Trampa: la UNIF emite circulares sobre reportes, pero la ley asigna esta función a los órganos de control."}, {"t": "vf", "q": "Según la LOCDOFT, los representantes en el país de bancos o financiadoras extranjeras quedan sometidos a las disposiciones de la ley.", "a": true, "e": "Art. 20, parte final. Trampa: se cree que la regulación de su país de origen los exime."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Según la LOCDOFT, vigilar que los sujetos obligados cumplan programas actualizados de capacitación de su personal corresponde a:", "o": ["Los órganos y entes de control", "La UNIF", "El Ministerio Público", "Los colegios profesionales"], "a": 0, "e": "Art. 8, numeral 11. Trampa: la ONCDOFT capacita a funcionarios públicos (art. 6, num. 5), no vigila la capacitación del personal de los sujetos obligados."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, la cooperación internacional en la materia, junto con la organización, control y supervisión a nivel nacional, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio de Relaciones Exteriores", "El Ministerio Público"], "a": 0, "e": "Art. 5. Trampa: la UNIF intercambia con sus homólogas, pero la rectoría de la cooperación es del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar, porque el deber legal no depende del cargo", "Consultar al cliente antes de decidir el reporte", "Dejar constancia interna y abstenerse de reportar", "Renunciar al cargo antes de presentar el reporte"], "a": 0, "e": "Art. 13. La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF coordina con la ONCDOFT y los órganos de control las acciones para promover la adecuada supervisión de los sujetos obligados.", "a": true, "e": "Art. 25, numeral 8. Trampa: se cree que la UNIF no interviene en la supervisión."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo usa cuatro años de pena máxima y la LOCDOFT más de cinco", "Palermo usa cinco años de pena máxima y la LOCDOFT solo cuatro", "Palermo usa diez años y la LOCDOFT no define el concepto", "Palermo y la LOCDOFT usan cuatro años de pena máxima"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No configuran delincuencia organizada, que exige tres o más", "Configuran delincuencia organizada, que exige dos o más", "Configuran delincuencia organizada si actúan con fin de lucro", "No configuran delincuencia organizada salvo que sean extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede aplicar la otra si es más exigente que la de su sector", "Debe aplicar la del sector bancario como norma supletoria", "Puede aplicar la otra con autorización de su órgano de control"], "a": 0, "e": "Art. 8, numeral 3. La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Según la LOCDOFT, los órganos de control deben evitar que personas vinculadas a estos delitos adquieran participaciones en el capital de los sujetos obligados.", "a": true, "e": "Art. 21. Trampa: se cree que el control se limita a los clientes."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Según la LOCDOFT, elevar a la ONCDOFT los planteamientos necesarios para prevenir y detectar estos delitos, según su ámbito, es obligación de:", "o": ["Los órganos y entes de control", "Los sujetos obligados", "La UNIF", "Los oficiales de cumplimiento"], "a": 0, "e": "Art. 8, numeral 8. Trampa: los sujetos obligados se relacionan con su órgano de control, no con el rector por esta vía."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Según la LOCDOFT, representar a la República en el exterior en esta materia, previa coordinación con la cancillería, corresponde a:", "o": ["La ONCDOFT", "La UNIF", "El Ministerio Público", "La Procuraduría"], "a": 0, "e": "Art. 6, numeral 9. Trampa: la UNIF intercambia con sus homólogas, pero no representa a la República."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "vf", "q": "Según la LOCDOFT, remitir a la UNIF la información que esta requiera, en los plazos que fije, es también una obligación de los órganos de control.", "a": true, "e": "Art. 8, numeral 9. Trampa: se cree que solo los sujetos obligados envían información a la UNIF."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la LOCDOFT, recibido un reporte de actividad sospechosa, la UNIF:", "o": ["Lo analiza y, de ser el caso, lo remite al Ministerio Público", "Lo remite de inmediato y sin análisis al Ministerio Público", "Lo analiza y, de ser el caso, lo remite al órgano rector", "Lo analiza y ordena la inmovilización de los fondos"], "a": 0, "e": "Art. 13. Trampa: la remisión no es automática ni va al órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, el funcionario que participa en estos delitos queda impedido de ejercer funciones públicas, tras cumplir la pena, por:", "o": ["Uno a quince años", "Cinco a diez años", "Uno a cinco años", "Diez a quince años"], "a": 0, "e": "Art. 33. Trampa: diez a quince años es la pena de prisión por legitimación de capitales."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Evaluar el riesgo de los productos antes de lanzarlos", "Garantizar la autonomía del oficial frente a la junta", "Mantener la gratuidad de la función de cumplimiento", "Respetar la buena fe contractual con el cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "vf", "q": "Según la LOCDOFT, la ONCDOFT depende jerárquicamente del ministerio con competencia en planificación y finanzas.", "a": false, "e": "Art. 5: depende del ministerio con competencia en relaciones interiores y justicia. Trampa: planificación y finanzas es el ministerio de la UNIF (art. 24)."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Según la LOCDOFT, la UNIF, ante indicios de un hecho punible, presenta informes debidamente fundados a:", "o": ["El Ministerio Público", "El juez de control", "La ONCDOFT", "El órgano de control"], "a": 0, "e": "Art. 25, numeral 6. Trampa: la UNIF no se dirige al juez; quien solicita medidas judiciales es el fiscal."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Procede si el cliente ya no opera", "Basta la autorización previa de la junta"], "a": 0, "e": "Art. 10. El mínimo legal es de cinco años."}, {"t": "mc", "q": "Según la LOCDOFT, un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable, sin exigir certeza", "Esperar pruebas documentales del origen ilícito", "Consultar al cliente para descartar la sospecha", "Esperar al próximo ciclo de monitoreo"], "a": 0, "e": "Art. 13. El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Según la LOCDOFT, diseñar las directrices para el plan operativo anual de prevención de los órganos de control corresponde a la UNIF.", "a": false, "e": "Art. 6, numeral 2: corresponde a la ONCDOFT. Trampa: se cambia el organismo."}, {"t": "vf", "q": "Según la LOCDOFT, la debida diligencia sobre personas expuestas políticamente alcanza a quienes lo son, lo han sido o lo serán.", "a": true, "e": "Art. 18. Trampa: sorprende que incluya a quienes aún no ocupan el cargo."}, {"t": "mc", "q": "Según la LOCDOFT, si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "Art. 8, numeral 10. El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Con medidas reforzadas por tratarse de envíos al exterior", "Con medidas simplificadas por no perseguir fines de lucro", "Con reporte de cada envío a la unidad de inteligencia"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "vf", "q": "Según la LOCDOFT, la publicación de la sentencia contra una persona jurídica se hace a costa del Estado.", "a": false, "e": "Art. 32, numeral 4: a costa de la persona jurídica. Trampa: se cambia quién paga."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF proporciona a la ONCDOFT la información necesaria para el diseño de políticas públicas.", "a": true, "e": "Art. 25, numeral 9. Trampa: se cree que la reserva impide compartirla con el órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, establecer mecanismos para detectar transacciones inusuales o sospechosas, aun con justificación económica aparente, es deber de:", "o": ["Los sujetos obligados", "Los órganos de control", "La UNIF", "La ONCDOFT"], "a": 0, "e": "Art. 12. Trampa: los órganos de control dictan instructivos y supervisan, pero la detección es deber del sujeto obligado."}, {"t": "vf", "q": "Según la LOCDOFT, mantener un registro actualizado de sus sujetos obligados es una obligación de cada órgano o ente de control.", "a": true, "e": "Art. 8, numeral 13. Trampa: se cree que solo el órgano rector lleva registros."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Art. 4, numeral 2. Estructuración para evadir el reporte."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, la política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de transacciones en efectivo comprende:", "o": ["Todas las realizadas en el mes anterior", "Las que superen diez mil dólares en el mes", "Las realizadas en el trimestre anterior", "Las que el oficial considere inusuales"], "a": 0, "e": "Art. 17. Trampa: la ley no fija monto; los parámetros se coordinan con el órgano de control."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, debe establecerse por todos los medios posibles la verdadera identidad de:", "o": ["Los terceros intervinientes y el beneficiario final", "El beneficiario final, pero no de los intervinientes", "Los accionistas con más de la mitad del capital", "Los apoderados y los representantes legales"], "a": 0, "e": "Art. 16. Trampa: se omite a los terceros intervinientes."}, {"t": "mc", "q": "Según la LOCDOFT, si la ley extranjera impide aplicar los controles en una sucursal, esta debe:", "o": ["Informar a la oficina principal", "Cerrar sus operaciones en ese país", "Aplicar solo la ley de ese país", "Informar a la UNIF venezolana"], "a": 0, "e": "Art. 20. Trampa: la ley no ordena cerrar ni reportar a la UNIF."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la Providencia SAA-01-0536-2024 de SUDEASEG es más exigente para digital."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Según la LOCDOFT, entre los órganos de control figuran el Banco Central de Venezuela y el SENIAT.", "a": true, "e": "Art. 7, numerales 3 y 6. Trampa: se piensa solo en las superintendencias."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la LOCDOFT, centralizar a nivel nacional los reportes de actividades sospechosas corresponde a:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Art. 25, numeral 1. Trampa: la ONCDOFT recibe información para políticas públicas, pero no centraliza los reportes."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos que acreditan una operación se cuenta desde:", "o": ["La ejecución de la operación", "El fin de la relación comercial", "La remisión del reporte mensual", "El cierre del ejercicio económico"], "a": 0, "e": "Art. 10, numeral 2. Trampa: el fin de la relación rige para los documentos de identificación."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "¿Qué interpretación correcta se debe dar a que la LOCDOFT incluya a las OSFL como sujetos obligados?", "o": ["Se reconoce su vulnerabilidad con deberes proporcionales", "Se les considera delincuentes por su actividad", "Se les prohíbe operar sin una autorización especial previa", "Quedan exentas de reportar a la UNIF"], "a": 0, "e": "Coherente con R.8."}, {"t": "vf", "q": "Según la Recomendación 37 del GAFI, sin doble incriminación, un país debe prestar igualmente la asistencia que no implique medidas coercitivas.", "a": true, "e": "R.37. Trampa: se cree que la doble incriminación bloquea toda cooperación."}, {"t": "vf", "q": "Según la Recomendación 32 del GAFI, el control transfronterizo de la Recomendación 32 abarca los instrumentos negociables al portador.", "a": true, "e": "R.32. Trampa: se piensa solo en billetes."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, figurar en la lista de jurisdicciones bajo mayor monitoreo implica un llamado a aplicar contramedidas.", "a": false, "e": "Ese llamado corresponde a las jurisdicciones de alto riesgo sujetas a un llamado a la acción. Trampa: se confunden las dos listas."}, {"t": "mc", "q": "La Recomendación 3 obliga a los países a:", "o": ["Tipificar el lavado de activos conforme a Viena y Palermo", "Crear una unidad de inteligencia financiera", "Establecer un umbral para el efectivo transfronterizo", "Regular a los casinos y agentes inmobiliarios"], "a": 0, "e": "El delito de lavado y sus delitos determinantes."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, la evaluación de riesgo de un producto o tecnología nuevos debe hacerse:", "o": ["Antes de su lanzamiento o uso", "Dentro del primer año de uso", "Al recibir la primera alerta", "Cuando el supervisor lo pida"], "a": 0, "e": "R.15. Trampa: los plazos posteriores suenan razonables, pero la evaluación es previa."}, {"t": "mc", "q": "Según el glosario de las Recomendaciones del GAFI, en una cadena de tres sociedades, la última es propiedad de un fideicomiso y el fideicomitente es una persona natural. ¿Quién es el beneficiario final?", "o": ["La persona natural que controla en última instancia", "La primera sociedad de la cadena de propiedad", "El fideicomiso, por ser el último titular formal", "El notario que protocolizó los documentos"], "a": 0, "e": "Se «levanta el velo» hasta la persona natural."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "Para el GAFI, el «de-risking» o rechazo masivo de sectores completos:", "o": ["No es un enfoque basado en riesgo y debe evitarse", "Es la respuesta recomendada ante riesgo alto", "Solo se admite para organizaciones sin fines de lucro", "Es obligatorio en países de la lista gris"], "a": 0, "e": "Empuja la actividad a canales informales."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la cooperación en extradición se regula en la Recomendación:", "o": ["39", "37", "38", "40"], "a": 0, "e": "La 37 es asistencia legal; la 38, congelamiento y decomiso."}, {"t": "vf", "q": "Según la Recomendación 13 del GAFI, un banco puede mantener corresponsalía con un banco pantalla si la alta gerencia lo aprueba.", "a": false, "e": "R.13: está prohibido iniciar o continuar esas relaciones. Trampa: la aprobación de la alta gerencia vale para corresponsales ordinarios."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, la definición de persona expuesta políticamente no alcanza a funcionarios de rango medio o inferior.", "a": true, "e": "Glosario del GAFI. Trampa: se suele creer que todo funcionario público lo es."}, {"t": "mc", "q": "Según la Recomendación 13 del GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 7 del GAFI, la evasión de sanciones mediante terceros o empresas pantalla exige a las instituciones:", "o": ["Mirar más allá del titular formal de la cuenta", "Revisar solo las listas una vez al año", "Confiar en la declaración jurada del cliente", "Limitarse a los clientes extranjeros"], "a": 0, "e": "Control efectivo y beneficiario final."}, {"t": "mc", "q": "Las calificaciones de cumplimiento técnico de una recomendación van de:", "o": ["Cumplida a no cumplida, con grados intermedios", "Aprobado y reprobado únicamente", "Una escala de cero a cien puntos porcentuales", "Verde, amarillo y rojo"], "a": 0, "e": "Cumplida, mayormente cumplida, parcialmente cumplida y no cumplida."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un contador queda sujeto a debida diligencia cuando, para un cliente:", "o": ["Prepara o realiza operaciones de las actividades listadas", "Presta cualquier servicio profesional que sea remunerado", "Audita los estados financieros de una empresa", "Lleva la contabilidad interna de su empleador"], "a": 0, "e": "R.22. Trampa: no alcanza a toda la profesión ni a los profesionales empleados internamente."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un comerciante de piedras preciosas queda sujeto a debida diligencia cuando realiza con un cliente:", "o": ["Transacciones en efectivo desde USD/EUR 15.000", "Cualquier venta a crédito desde USD/EUR 1.000", "Transacciones con tarjeta desde USD/EUR 10.000", "Exportaciones de cualquier monto o modalidad"], "a": 0, "e": "R.22."}, {"t": "mc", "q": "Según la Recomendación 38 del GAFI, la asistencia para congelar y decomisar a pedido de otro país se regula en la Recomendación:", "o": ["38", "37", "39", "4"], "a": 0, "e": "R.38."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Según la Recomendación 25 del GAFI, un fideicomiso extranjero opaco plantea un problema regulado principalmente en la Recomendación:", "o": ["25", "24", "13", "19"], "a": 0, "e": "R.25: transparencia de estructuras jurídicas."}, {"t": "mc", "q": "El sistema de evaluación del GAFI combina dos dimensiones, que son:", "o": ["Cumplimiento técnico y efectividad", "Cumplimiento técnico y recaudación", "Efectividad y número de condenas", "Supervisión y sanción administrativa"], "a": 0, "e": "Dos metodologías complementarias."}, {"t": "vf", "q": "Según la Recomendación 4 del GAFI, el decomiso debe poder recaer sobre bienes de valor equivalente al producto del delito.", "a": true, "e": "R.4. Trampa: se cree que solo alcanza al bien contaminado."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, a una persona expuesta políticamente nacional se le aplican siempre las mismas medidas reforzadas que a una extranjera.", "a": false, "e": "R.12: a las nacionales y de organizaciones internacionales, cuando la relación sea de mayor riesgo. Trampa: se borra la distinción."}, {"t": "vf", "q": "Según las Recomendaciones del GAFI, las normas internacionales fijan mínimos, y las normas locales pueden ser más estrictas, pero no más laxas.", "a": true, "e": "Principio de mínimos de los estándares internacionales."}, {"t": "mc", "q": "La Recomendación 5 obliga a tipificar como delito autónomo:", "o": ["El financiamiento del terrorismo", "El enriquecimiento ilícito del funcionario", "La asociación para delinquir", "El contrabando de efectivo"], "a": 0, "e": "Conforme al Convenio de 1999."}, {"t": "mc", "q": "Según la Recomendación 12 del GAFI, las exigencias para personas expuestas políticamente se extienden a:", "o": ["Sus familiares y sus asociados cercanos", "Sus familiares, pero no sus asociados", "Sus empleadores y sus subordinados", "Sus socios, pero no sus familiares"], "a": 0, "e": "R.12. Trampa: se recorta uno de los dos grupos."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, el congelamiento sin demora de fondos de personas designadas por terrorismo está en la Recomendación:", "o": ["6", "5", "7", "4"], "a": 0, "e": "La 5 tipifica el FT; la 7 trata la proliferación; la 4, el decomiso."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, un sujeto obligado confía en otra entidad para la identificación de clientes. La responsabilidad final:", "o": ["Sigue siendo de quien confía en el tercero", "Pasa por completo al tercero que identifica", "Se reparte por mitades entre ambos sujetos", "Se traslada al supervisor que lo autorizó"], "a": 0, "e": "R.17."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, las sanciones financieras dirigidas de la Recomendación 6 se apoyan en las resoluciones del Consejo de Seguridad:", "o": ["1267 y 1373", "1718 y 2231", "1540 y 1718", "1373 y 2231"], "a": 0, "e": "R.6: la 1267 con sus sucesoras y la 1373. Trampa: 1718 y 2231 son de proliferación, R.7."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, cuando el país anfitrión de una filial es menos exigente que el país de origen, la filial debe aplicar:", "o": ["Las medidas del país de origen, en lo que el anfitrión permita", "Las medidas del país anfitrión, por el principio territorial", "Las medidas que elija la filial según su propio riesgo", "Las medidas del país anfitrión, informando a la matriz"], "a": 0, "e": "R.18. Trampa: el principio territorial."}, {"t": "mc", "q": "La inclusión financiera, en el marco del GAFI, se concilia con la prevención mediante:", "o": ["Medidas simplificadas para riesgos demostradamente bajos", "La exención total para operaciones pequeñas", "La eliminación de la identificación del cliente", "La prohibición de ofrecer productos a personas de bajos ingresos"], "a": 0, "e": "Proporcionalidad, no exención."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, cuando se identifica un riesgo menor, el país está obligado a permitir medidas simplificadas.", "a": false, "e": "R.1: puede permitirlas. Ante riesgo mayor, las medidas intensificadas sí son exigibles. Trampa: se convierte una facultad en deber."}, {"t": "mc", "q": "Según la Recomendación 22 del GAFI, un agente inmobiliario debe aplicar la debida diligencia:", "o": ["Al comprador y también al vendedor", "Al comprador, que es quien aporta los fondos", "Al vendedor, que es quien recibe los fondos", "A quien le pague sus honorarios"], "a": 0, "e": "Nota interpretativa de la R.22. Trampa: se suele pensar solo en quien aporta los fondos."}, {"t": "vf", "q": "Según la Recomendación 39 del GAFI, un país que no extradita a sus nacionales cumple el estándar con solo negar la solicitud.", "a": false, "e": "R.39: debe someter el caso a sus autoridades para el enjuiciamiento. Trampa: se omite la obligación alternativa."}, {"t": "mc", "q": "¿Qué comprende la debida diligencia con el cliente (CDD) según el GAFI?", "o": ["Identificar y verificar cliente y beneficiario final", "Solicitar únicamente un documento de identidad vigente", "Cobrar la tarifa y archivar la solicitud firmada", "Informar a la UNIF cada vez que se abre una relación"], "a": 0, "e": "R.10."}, {"t": "mc", "q": "¿Qué implica la banca corresponsal (R.13) como riesgo?", "o": ["Operar para clientes de otro banco sin conocerlos", "Ser un servicio gratuito entre bancos del mismo grupo", "Ser un servicio digital sin intervención humana", "Realizarse solo entre bancos del mismo país"], "a": 0, "e": "Requiere conocer al banco respondiente."}, {"t": "mc", "q": "Cuando el GAFI pide un enfoque «proporcional», quiere decir que las medidas:", "o": ["Se gradúan según el riesgo y el tamaño del sujeto", "Son iguales para todos los sujetos obligados", "Se aplican solo a las entidades grandes", "Dependen del presupuesto del supervisor"], "a": 0, "e": "Proporcionalidad frente a uniformidad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, el «oficial de cumplimiento a nivel gerencial» que pide el estándar busca garantizar:", "o": ["Autoridad suficiente dentro de la organización", "Un costo laboral menor para la entidad regulada", "La rotación periódica del cargo", "La representación legal de la empresa"], "a": 0, "e": "Jerarquía y acceso a la información."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "vf", "q": "Según la Recomendación 3 del GAFI, cuando la responsabilidad penal de las personas jurídicas no es posible, el estándar acepta la civil o administrativa.", "a": true, "e": "Nota interpretativa de la R.3. Trampa: se cree que solo vale la penal."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "mc", "q": "¿Por qué el GAFI se ocupa de la transparencia de las personas jurídicas (R.24)?", "o": ["Las sociedades opacas permiten ocultar al verdadero dueño", "Las sociedades deben pagar más impuestos al Estado", "Las sociedades son menos eficientes que las personas", "El GAFI no regula la transparencia societaria"], "a": 0, "e": "Beneficiario final transparente."}, {"t": "mc", "q": "Según la Metodología de evaluación del GAFI, la experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Suspensión de la membresía hasta la próxima ronda", "Sanciones económicas impuestas por el propio GAFI", "Multas a los sujetos obligados peor calificados"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "¿Qué estrategia del GAFI busca evitar que las OSFL sean usadas para el FT sin dañar su labor legítima?", "o": ["Enfoque focalizado y proporcional sin dañar su labor", "Prohibir su funcionamiento hasta ser evaluadas", "Ignorarlas por no tener fines de lucro", "Sancionar a todas por el riesgo de unas pocas"], "a": 0, "e": "R.8."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}]}, {"titulo": "Normativa internacional · modelo 2", "q": [{"t": "vf", "q": "Según las Recomendaciones del GAFI, la secretaría del GAFI forma parte de la estructura de las Naciones Unidas.", "a": false, "e": "Tiene sede en la OCDE, en París. Trampa: se asocia con la ONU por los convenios que el estándar pide ratificar."}, {"t": "mc", "q": "Según la Recomendación 15 del GAFI, una institución detecta que un producto nuevo tiene riesgo alto no previsto. Lo correcto es:", "o": ["Evaluar y mitigar el riesgo antes de lanzarlo", "Lanzarlo y reforzar los controles después", "Consultar al supervisor antes de evaluarlo", "Limitar su venta a clientes antiguos"], "a": 0, "e": "Recomendación 15: evaluación previa."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el cumplimiento se evalúa solo por la existencia de manuales y políticas escritas.", "a": false, "e": "Se evalúa también por la efectividad y la cultura."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de sospecha procede aunque la operación parezca involucrar únicamente asuntos fiscales.", "a": true, "e": "Nota interpretativa de la R.20. Trampa: se suele creer que lo tributario queda fuera."}, {"t": "vf", "q": "Según la Recomendación 17 del GAFI, al delegar la debida diligencia en un tercero, este puede encargarse también del monitoreo continuo de la relación.", "a": false, "e": "R.17: la delegación cubre identificar al cliente, al beneficiario final y el propósito de la relación. Trampa: se amplía el alcance."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, un país logra cumplimiento técnico alto pero sus reportes no generan casos. Esa deficiencia se mide principalmente en:", "o": ["Los resultados inmediatos de efectividad", "El puntaje de las 40 Recomendaciones", "La lista de contramedidas del GAFI", "El anexo de cumplimiento técnico"], "a": 0, "e": "Metodología de evaluación: efectividad frente a cumplimiento técnico."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "vf", "q": "La ONCDOFT y la UNIF dependen de distintos ministerios: relaciones interiores y justicia, y planificación y finanzas, respectivamente.", "a": true, "e": "Distinción institucional clásica."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "La Recomendación 28 se refiere a la supervisión de:", "o": ["Las APNFD, incluido el sector de casinos", "La banca de inversión transfronteriza", "Las aseguradoras de vida exclusivamente", "Las unidades de inteligencia financiera"], "a": 0, "e": "Los casinos deben ser objeto de régimen de supervisión."}, {"t": "vf", "q": "Según la Recomendación 35 del GAFI, las sanciones por incumplir deben poder aplicarse a la persona jurídica, pero no a sus directores.", "a": false, "e": "R.35: también a directores y alta gerencia. Trampa: se excluye a las personas naturales."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Las Recomendaciones 6 y 7 se refieren, respectivamente, a sanciones financieras dirigidas sobre:", "o": ["Terrorismo y proliferación de armas", "Corrupción y narcotráfico", "Trata de personas y contrabando", "Evasión fiscal y contrabando"], "a": 0, "e": "Dos regímenes de congelamiento distintos."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, si no se puede completar la debida diligencia, el estándar indica:", "o": ["No iniciar la relación y considerar un reporte", "Abrir la cuenta con límites de monto", "Aceptar al cliente con garantía adicional", "Posponer la verificación por un año"], "a": 0, "e": "No hay relación sin identificación."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, un cliente ocasional paga USD 12.000 en una sola operación con un sujeto no bancario, sin otras señales. El umbral general de debida diligencia para ocasionales es de:", "o": ["USD/EUR 15.000", "USD/EUR 10.000", "USD/EUR 1.000", "USD/EUR 3.000"], "a": 0, "e": "R.10. USD 10.000 es la cifra de declaración de la LOCDOFT."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, la exigencia de identificar al beneficiario final de personas jurídicas como política de país está en la Recomendación:", "o": ["24", "25", "10", "12"], "a": 0, "e": "La 25 trata las estructuras jurídicas."}, {"t": "mc", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas por proliferación de armas están en la Recomendación:", "o": ["7", "6", "2", "8"], "a": 0, "e": "R.7."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, que un cliente sea PEP implica por sí mismo que haya cometido un delito.", "a": false, "e": "Implica mayor riesgo, no culpabilidad."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, para las transferencias electrónicas, el umbral a partir del cual se exige información verificada del originador es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "R.16 y su nota interpretativa."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, para los proveedores de servicios de activos virtuales, el umbral de operaciones ocasionales que activa la debida diligencia es de:", "o": ["USD/EUR 1.000", "USD/EUR 3.000", "USD/EUR 10.000", "USD/EUR 15.000"], "a": 0, "e": "Nota interpretativa de la R.15. Trampa: USD/EUR 15.000 es el umbral general de la R.10."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 3 del GAFI, el autolavado, es decir, que el autor del delito previo lave su propio producto:", "o": ["Debe poder sancionarse salvo que lo impidan principios internos", "Queda absorbido por la pena del delito determinante cometido", "Se sanciona cuando interviene un tercero ajeno al delito previo", "Debe sancionarse con una pena menor que la del delito previo"], "a": 0, "e": "El estándar admite la excepción por principios fundamentales."}, {"t": "mc", "q": "Según la Recomendación 32 del GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia del cliente solo es exigible al iniciar la relación comercial y no ante operaciones ocasionales.", "a": false, "e": "R.10: también en ocasionales sobre el umbral, transferencias, sospecha y dudas sobre los datos previos. Trampa: se reduce el alcance."}, {"t": "vf", "q": "Según la Recomendación 20 del GAFI, el reporte de operaciones sospechosas debe presentarse con prontitud a la unidad de inteligencia financiera.", "a": true, "e": "R.20. Trampa: se cree que puede esperarse al cierre del mes."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la debida diligencia debe aplicarse también a los clientes existentes, según materialidad y riesgo.", "a": true, "e": "R.10. Trampa: se cree que la norma nueva solo rige para clientes nuevos."}, {"t": "mc", "q": "¿Qué mide una evaluación mutua del GAFI o de un organismo regional como el GAFIC?", "o": ["El cumplimiento técnico y la efectividad del sistema", "La existencia de leyes contra el lavado vigentes", "El número de condenas dictadas por lavado", "El tamaño del sector financiero del país"], "a": 0, "e": "Se evalúa existencia de normas y resultados."}, {"t": "mc", "q": "Según la Recomendación 34 del GAFI, la información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}, {"t": "mc", "q": "Según la Recomendación 29 del GAFI, la unidad de inteligencia financiera es el centro nacional para:", "o": ["Recibir y analizar reportes y difundir los resultados", "Recibir reportes e investigar penalmente los casos", "Analizar reportes y sancionar a quienes no reportan", "Recibir reportes y congelar los fondos reportados"], "a": 0, "e": "R.29. Trampa: investigar, sancionar y congelar corresponden a otras autoridades."}, {"t": "mc", "q": "Según la Recomendación 3 del GAFI, un país tipifica el lavado pero no alcanza delitos determinantes suficientes. El problema es de la Recomendación:", "o": ["3", "1", "4", "20"], "a": 0, "e": "R.3."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Se integraron las nueve especiales en las cuarenta", "Se redujeron de cuarenta a veinticinco en total", "Se convirtieron en un tratado vinculante para todos", "Se limitaron a las instituciones del sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "vf", "q": "Según la Recomendación 23 del GAFI, un abogado debe reportar la sospecha aunque la información esté amparada por el secreto profesional.", "a": false, "e": "Nota interpretativa de la R.23: no está obligado cuando la información está sujeta a secreto o privilegio profesional. Trampa: se elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar un reporte puede establecerse por una circular interna del sujeto obligado, sin base legal.", "a": false, "e": "R.21: debe estar prohibido por ley. Trampa: se rebaja la fuente."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 5 del GAFI, el financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "mc", "q": "Según la Recomendación 9 del GAFI, ¿qué impide a una institución financiera invocar el secreto profesional o bancario frente a las autoridades en materia de LC/FT?", "o": ["El principio de que el secreto no frene la prevención", "El derecho del cliente a la privacidad de sus datos", "La falta de un tratado entre países para compartir datos", "La necesidad de orden judicial en todos los casos"], "a": 0, "e": "R.9."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "Según la Recomendación 12 del GAFI, una persona expuesta políticamente extranjera exige medidas reforzadas sin necesidad de que el análisis de riesgo lo determine caso por caso.", "a": true, "e": "R.12: las PEP nacionales y de organizaciones internacionales se tratan según riesgo."}, {"t": "mc", "q": "Según la Recomendación 6 del GAFI, frente a una designación por sanciones, la institución debe:", "o": ["Congelar los fondos y notificar a la autoridad", "Avisar al cliente para que retire sus fondos", "Transferir los fondos al banco central", "Cerrar la cuenta y devolver el saldo"], "a": 0, "e": "Congelar, no transferir ni devolver."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 29 del GAFI, una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Administrativa o policial, pero no judicial", "Administrativa o mixta, pero no policial", "Policial o judicial, pero no administrativa"], "a": 0, "e": "Existen varios modelos válidos."}, {"t": "vf", "q": "Según la Recomendación 7 del GAFI, las sanciones financieras dirigidas sobre proliferación buscan impedir el financiamiento de programas de armas de destrucción masiva.", "a": true, "e": "Es el objeto de la Recomendación 7."}, {"t": "vf", "q": "Según la Recomendación 28 del GAFI, un casino puede quedar supervisado únicamente por un organismo autorregulador del sector.", "a": false, "e": "R.28: los casinos requieren licencia y supervisión de una autoridad competente; el organismo autorregulador se admite para las demás actividades no financieras. Trampa: se extiende la opción."}, {"t": "mc", "q": "Según la Recomendación 37 del GAFI, un país no debe negar la asistencia legal mutua por el solo motivo de que el delito:", "o": ["Involucre también asuntos fiscales", "Tenga una pena inferior a un año", "Esté ya juzgado en su territorio", "Sea de naturaleza militar"], "a": 0, "e": "R.37. Trampa: las otras causales pueden ser legítimas según el derecho interno."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "Según la Recomendación 16 del GAFI, los datos del originador que acompañan una transferencia transfronteriza sobre el umbral incluyen su nombre, su número de cuenta y:", "o": ["Su dirección u otro identificador admitido", "El origen declarado de los fondos enviados", "El propósito económico de la transferencia", "Su ocupación y su nivel de ingresos"], "a": 0, "e": "Nota interpretativa de la R.16: dirección, número de identidad, número de cliente o fecha y lugar de nacimiento. Trampa: origen y propósito son de la debida diligencia, no viajan con la transferencia."}]}, {"titulo": "Normativa internacional · modelo 3", "q": [{"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), Venezuela es miembro pleno del GAFIC y no del GAFILAT.", "a": true, "e": "Sección de antecedentes y contexto regional."}, {"t": "mc", "q": "Entre los supuestos que activan la debida diligencia según la Recomendación 10 está:", "o": ["Que exista sospecha de lavado, sin importar el umbral", "Que el cliente sea extranjero no residente", "Que la operación supere el millón de dólares", "Que el cliente opere por medios digitales"], "a": 0, "e": "La sospecha siempre activa la CDD."}, {"t": "vf", "q": "Según la Recomendación 2 del GAFI, la cooperación nacional debe asegurar la compatibilidad de las exigencias de prevención con las normas de protección de datos.", "a": true, "e": "R.2. Trampa: se cree que la protección de datos queda fuera del estándar."}, {"t": "mc", "q": "Según las Recomendaciones del GAFI, en la metodología de evaluación, la efectividad de cada resultado inmediato se califica como:", "o": ["Alta, sustancial, moderada o baja", "Cumplida, mayormente cumplida o no cumplida", "Satisfactoria, aceptable o deficiente", "Verde, amarilla o roja, según el riesgo"], "a": 0, "e": "Trampa: la escala de cumplida a no cumplida es la del cumplimiento técnico."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, un país solo puede aplicar contramedidas a otro cuando el GAFI haga un llamado expreso.", "a": false, "e": "R.19: también con independencia de cualquier llamado del GAFI. Trampa: la palabra solo."}, {"t": "mc", "q": "Cuando la ley de un país extranjero impide aplicar las medidas del grupo, la institución debe:", "o": ["Aplicar medidas adicionales e informar al supervisor", "Cerrar su filial en ese país de inmediato", "Aplicar la ley local sin informar de ello a nadie", "Trasladar los clientes a la casa matriz"], "a": 0, "e": "Se gestiona el riesgo y se informa."}, {"t": "vf", "q": "Según la Recomendación 16 del GAFI, en una transferencia electrónica inferior al umbral de minimis no hace falta incluir dato alguno del originador.", "a": false, "e": "Nota interpretativa de la R.16: se incluyen nombres y números de cuenta; lo que se dispensa es verificarlos, salvo sospecha. Trampa: se confunde no verificar con no incluir."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, la prohibición de revelar no impide compartir información dentro del grupo financiero conforme a la Recomendación 18.", "a": true, "e": "R.21 y su nota interpretativa. Trampa: se cree que la reserva prohíbe todo intercambio interno."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "vf", "q": "Según la Recomendación 19 del GAFI, las medidas intensificadas frente a países de mayor riesgo alcanzan también a personas naturales y jurídicas de esos países, no solo a sus instituciones financieras.", "a": true, "e": "R.19. Trampa: se cree que solo alcanzan a la banca corresponsal."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, cuando el tercero en quien se confía pertenece al mismo grupo financiero, la autoridad puede dar por cumplidos los requisitos si el grupo:", "o": ["Aplica controles de grupo bajo supervisión competente", "Tiene
