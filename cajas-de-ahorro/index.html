n esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "El lavado de activos proveniente del narcotráfico", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "mc", "q": "Palermo contempla la responsabilidad de las personas jurídicas por participación en delitos graves en que intervenga un grupo delictivo organizado. Esto significa que:", "o": ["La empresa responde sin condena de una persona", "Solo los directivos responden penalmente", "La empresa queda exenta si no obtuvo lucro", "La responsabilidad es solo moral"], "a": 0, "e": "Art. 10 de Palermo: responsabilidad penal, civil o administrativa, sin perjuicio de la de las personas naturales."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "mc", "q": "Sobre el enriquecimiento ilícito, la Convención de Mérida:", "o": ["Pide considerar tipificarlo: patrimonio injustificado", "Lo prohíbe por ser contrario al debido proceso", "Lo obliga como delito en todas las legislaciones", "Lo limita a funcionarios extranjeros"], "a": 0, "e": "Art. 20: cada Estado considerará adoptar medidas para tipificarlo."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "La relación entre el Convenio de 1999 y la Recomendación 5 del GAFI es que:", "o": ["La recomendación exige tipificar conforme a ese convenio", "El convenio deroga a la recomendación", "Son instrumentos sin relación entre sí", "La recomendación sustituye al convenio en los países miembros"], "a": 0, "e": "El estándar remite al tratado."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "El encubrimiento en Mérida sanciona a quien:", "o": ["Retiene o ayuda a ocultar bienes sabiendo su origen", "Se niega a declarar como testigo", "Omite denunciar un hecho de corrupción", "Publica información reservada del proceso penal"], "a": 0, "e": "Artículo 24."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "Según el Convenio de 1999, comete delito de financiación del terrorismo quien:", "o": ["Provee o recolecta fondos sabiendo su uso terrorista", "Comete personalmente el acto terrorista con sus fondos", "Solo quien recibe fondos de origen ilícito", "Solo quien traslada efectivo por una frontera"], "a": 0, "e": "Art. 2: basta la intención o el conocimiento del uso de los fondos."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo (2002) se adoptó en el marco de:", "o": ["Doble incriminación", "La ONU, en Nueva York", "Nueva York, en el marco de las Naciones Unidas", "La ONU, en Viena"], "a": 0, "e": "Instrumento regional contra el terrorismo y su financiamiento."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "Para que Palermo se aplique se requiere, por regla general:", "o": ["Carácter transnacional y un grupo delictivo organizado", "Que el delito tenga una pena máxima mayor a diez años", "Que intervenga un funcionario público", "Que el delito se cometa con violencia"], "a": 0, "e": "Ambos elementos, salvo las excepciones del propio texto."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción fue adoptada en 1996 en:", "o": ["Caracas, en el marco de la OEA", "El lavado de activos proveniente del narcotráfico", "Palermo, Italia, en el marco de la ONU", "Washington, en el marco de la OEA"], "a": 0, "e": "Instrumento regional pionero; no confundir con la de Mérida."}, {"t": "mc", "q": "Palermo incluye normas sobre corrupción porque:", "o": ["Facilita la actuación de los grupos organizados", "La corrupción es un delito exclusivo de funcionarios", "Reemplaza a la Convención de Mérida", "Solo se aplica a delitos económicos"], "a": 0, "e": "Art. 8 de Palermo tipifica la corrupción vinculada al crimen organizado; Mérida la desarrolla ampliamente."}, {"t": "mc", "q": "La Convención de Estrasburgo de 1990, en el ámbito europeo, trata de:", "o": ["Blanqueo, investigación, incautación y decomiso del producto del delito", "Protección de los derechos humanos", "Cooperación aduanera entre Estados", "Reconocimiento y ejecución de sentencias civiles extranjeras"], "a": 0, "e": "Instrumento regional europeo sobre decomiso."}]}]}, {"titulo": "Enfoque basado en riesgo", "exams": [{"titulo": "Enfoque basado en riesgo · modelo 1", "q": [{"t": "mc", "q": "El programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Los responsables de cumplimiento de cada una de las áreas", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "mc", "q": "Un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los factores clásicos de riesgo incluyen clientes, productos o servicios, canales y:", "o": ["Zonas geográficas", "Salarios del personal", "Colores corporativos", "Dividendos repartidos"], "a": 0, "e": "Se añaden tecnologías y otros factores sectoriales."}, {"t": "mc", "q": "Un cliente insiste en contratar sin dejar datos de contacto verificables. Eso:", "o": ["Impide completar la diligencia y obliga a no vincularlo", "Es aceptable si deja al menos un número de teléfono", "Se resuelve con una declaración jurada", "Solo importa en contratos de alto valor"], "a": 0, "e": "Sin identificación plena no hay relación."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "Evitar un riesgo, en el lenguaje de la gestión, significa:", "o": ["No realizar la actividad que lo genera", "Contratar un seguro que lo cubra", "Reducir su probabilidad con controles", "Aceptarlo y monitorearlo"], "a": 0, "e": "Evitar, mitigar, transferir y aceptar son las cuatro respuestas."}, {"t": "mc", "q": "Si la información de un cliente está desactualizada hace años, ¿qué riesgo existe?", "o": ["Que el perfil no refleje la realidad", "Que se genere una multa automática de SUDEASEG", "Que se cancele el contrato por falta de datos", "Ninguno si el cliente paga puntualmente la tarifa"], "a": 0, "e": "El perfil debe actualizarse según riesgo."}, {"t": "mc", "q": "Un cliente acepta asumir la penalización por cancelar anticipadamente sin discutirla. Eso:", "o": ["Es señal de alerta: el costo no le importa", "Es normal en clientes con liquidez", "Indica buena fe contractual", "Carece de relevancia para el análisis"], "a": 0, "e": "La indiferencia al costo es un indicador clásico."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "mc", "q": "Si la empresa no sabe a qué se dedica un cliente, lo que ocurre es que:", "o": ["No puede evaluar si sus operaciones son coherentes", "Debe clasificarlo automáticamente como riesgo bajo", "Puede aceptarlo con una tarifa mayor", "Debe trasladar el análisis al proveedor"], "a": 0, "e": "Sin conocimiento no hay monitoreo posible."}, {"t": "mc", "q": "Una medida típica de la debida diligencia intensificada es:", "o": ["Verificar el origen de los fondos y de la riqueza", "Solicitar una copia adicional de la cédula de identidad", "Cobrar una tarifa más elevada", "Reducir la suma asegurada ofrecida"], "a": 0, "e": "Se profundiza en el conocimiento, no en el precio."}, {"t": "mc", "q": "¿Por qué las normas de LC/FT insisten en conocer el «propósito y naturaleza de la relación»?", "o": ["Permite construir el perfil y detectar lo inusual", "Facilita la venta cruzada de productos", "Permite cobrar una tarifa ajustada al riesgo", "Cumple una exigencia estadística de la UNIF"], "a": 0, "e": "Sin perfil no hay operaciones «inusuales»."}, {"t": "mc", "q": "La debida diligencia simplificada implica:", "o": ["Menos intensidad, nunca ausencia de medidas", "No identificar al cliente", "Omitir el expediente del cliente", "Renunciar al monitoreo de operaciones"], "a": 0, "e": "Simplificar no es eximir."}, {"t": "mc", "q": "Una operación inusual es aquella que:", "o": ["Se aparta del perfil o carece de lógica económica", "Supera el umbral de reporte sistemático", "Proviene de un cliente extranjero", "Se realiza en efectivo, sea cual sea su monto"], "a": 0, "e": "La referencia es el perfil, no el monto."}, {"t": "mc", "q": "El intercambio de información entre sujetos obligados sobre señales de alerta:", "o": ["Debe canalizarse por los mecanismos que prevé la norma", "Está prohibido en cualquier circunstancia por la norma", "Puede hacerse libremente entre oficiales", "Lo autoriza el cliente en el contrato"], "a": 0, "e": "Existen mecanismos de coordinación previstos."}, {"t": "mc", "q": "Documentar la metodología de la matriz de riesgo es necesario porque:", "o": ["El supervisor exigirá entender cómo se llegó al resultado", "La norma impone un modelo único obligatorio", "El cliente puede solicitar que se revise su clasificación", "El auditor externo la diseña cada año"], "a": 0, "e": "Explicabilidad del modelo."}, {"t": "vf", "q": "Un sujeto obligado que no reporta ninguna operación sospechosa en varios años, con alto volumen, debe revisar su sistema de detección.", "a": true, "e": "El cero sostenido es un indicador de alerta."}, {"t": "mc", "q": "Un plan de mitigación debe indicar, para cada riesgo identificado:", "o": ["El control, el responsable y el plazo", "El monto de la pérdida esperada", "La tarifa que compensa ese riesgo", "El número de clientes afectados"], "a": 0, "e": "Sin responsable y plazo no hay gestión."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "mc", "q": "Un asegurado que contrata una suma muy superior a su capacidad económica declarada:", "o": ["Genera una alerta sobre el origen de los fondos", "Demuestra previsión financiera", "Debe recibir un descuento comercial por fidelidad", "Solo interesa al área actuarial"], "a": 0, "e": "Incoherencia entre perfil y operación."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "vf", "q": "Si los controles de una empresa son débiles, su riesgo residual se acerca a su riesgo inherente.", "a": true, "e": "Un control que no funciona no reduce riesgo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "El riesgo inherente de una actividad se define como:", "o": ["El riesgo propio antes de aplicar controles", "El riesgo que permanece tras los controles", "El riesgo que el supervisor detecta", "El riesgo reputacional de un incidente"], "a": 0, "e": "Punto de partida del análisis."}, {"t": "mc", "q": "La concentración de la cartera en un solo tipo de cliente o producto:", "o": ["Aumenta el riesgo y exige controles específicos", "Reduce el riesgo al simplificar la operación", "Es irrelevante para el análisis de riesgo", "Solo interesa al área actuarial"], "a": 0, "e": "La concentración amplifica el impacto."}, {"t": "mc", "q": "Reducir el número de alertas subiendo arbitrariamente los umbrales:", "o": ["Oculta el riesgo en lugar de gestionarlo", "Es una buena práctica de eficiencia", "Lo exige la norma cuando hay exceso", "Mejora la calidad del monitoreo"], "a": 0, "e": "Se maquilla el indicador, no el riesgo."}, {"t": "mc", "q": "El riesgo asociado a la contratación totalmente digital se mitiga con:", "o": ["Verificación de identidad reforzada y biometría", "Reducción del monto máximo asegurable", "Eliminación del expediente del cliente", "Traslado de la responsabilidad al cliente"], "a": 0, "e": "Medidas compensatorias para la no presencialidad."}, {"t": "mc", "q": "El apetito de riesgo de una organización expresa:", "o": ["Cuánto riesgo está dispuesta a asumir de forma consciente", "La cantidad de clientes que la empresa puede atender al año", "El margen de utilidad que persigue", "El número de productos que ofrece"], "a": 0, "e": "Decisión de la alta dirección."}, {"t": "mc", "q": "¿Qué significa «conoce a tu empleado» como principio de cumplimiento?", "o": ["Seleccionar y vigilar al personal", "Evaluar la estatura profesional del candidato", "Limitar el sueldo de los empleados clave", "Evitar nuevas contrataciones en cumplimiento"], "a": 0, "e": "Riesgo interno."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "mc", "q": "Si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "La debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Dentro del factor cliente, un elemento que eleva el riesgo es:", "o": ["Que el cliente sea una persona expuesta políticamente", "Que el cliente pague por transferencia bancaria", "Que el cliente tenga domicilio en la capital", "Que el cliente contrate varios ramos"], "a": 0, "e": "La exposición política es factor reconocido."}, {"t": "mc", "q": "El análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "mc", "q": "Pagar una indemnización a una cuenta distinta de la del asegurado requiere:", "o": ["Verificar la instrucción y la relación con el titular", "Ejecutarla siempre que el asegurado la pida por escrito", "Rechazarla siempre sin análisis", "Dividir el pago en varias partes"], "a": 0, "e": "El destino de los fondos también se controla."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "El riesgo reputacional derivado de un caso de lavado consiste en:", "o": ["La pérdida de confianza de clientes y contrapartes", "El costo de la multa impuesta", "La pérdida de la provisión contable constituida", "El aumento de la morosidad"], "a": 0, "e": "Es distinto del riesgo legal y del financiero."}]}, {"titulo": "Enfoque basado en riesgo · modelo 2", "q": [{"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su contrato se anula automáticamente", "Su tarifa debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "Lo contrario del enfoque basado en riesgo es un enfoque:", "o": ["De cumplimiento uniforme y formalista", "De supervisión consolidada", "De debida diligencia continua para toda la cartera", "De gestión por procesos"], "a": 0, "e": "El modelo de «misma medida para todos» desperdicia recursos."}, {"t": "vf", "q": "El sistema de administración de riesgos debe combinar controles preventivos, detectivos y correctivos.", "a": true, "e": "Las tres capas se complementan."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "vf", "q": "Un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "El orden lógico del proceso de detección es:", "o": ["Alerta, análisis y decisión de reportar", "Reporte, análisis y archivo", "Análisis, archivo y alerta", "Reporte inmediato sin análisis previo"], "a": 0, "e": "El análisis media entre la alerta y el reporte."}, {"t": "mc", "q": "Una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Para un cliente de riesgo bajo, la frecuencia de actualización:", "o": ["Puede ser mayor, siempre que esté justificada", "Debe ser igual a la del riesgo alto", "No es necesaria en ningún caso", "La fija el intermediario que captó al cliente"], "a": 0, "e": "Proporcionalidad documentada."}, {"t": "mc", "q": "Aplicar el enfoque basado en riesgo a un cliente que es APNFD implica:", "o": ["Considerar el riesgo propio de su actividad", "Asignarle automáticamente riesgo alto", "Eximirlo de la debida diligencia", "Prohibirle contratar servicios"], "a": 0, "e": "Riesgo evaluado caso a caso."}, {"t": "mc", "q": "El expediente de una alerta descartada debe conservarse porque:", "o": ["Puede ser revisado por el supervisor o la autoridad", "Sirve para calcular las comisiones del área comercial", "Permite renegociar la tarifa del cliente", "Es exigido por la ley tributaria"], "a": 0, "e": "La decisión debe poder auditarse."}, {"t": "mc", "q": "El riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "Una capacitación eficaz en la materia debe:", "o": ["Adaptarse al rol de cada área y evaluarse", "Ser idéntica para todo el personal de la empresa", "Dictarse una sola vez al ingresar", "Limitarse al área de cumplimiento"], "a": 0, "e": "Contenido diferenciado y medición de resultados."}, {"t": "mc", "q": "Una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "mc", "q": "Dentro del factor tecnológico, eleva el riesgo el uso de:", "o": ["Medios que permiten anonimato o fragmentación", "Firmas electrónicas certificadas", "Sistemas de monitoreo automatizados de operaciones", "Bases de datos centralizadas"], "a": 0, "e": "La tecnología puede reducir o aumentar riesgo según su uso."}, {"t": "mc", "q": "¿Qué diferencia hay entre una operación inusual y una sospechosa?", "o": ["Inusual: fuera del perfil; sospechosa: sin justificación", "Inusual y sospechosa son lo mismo en toda norma", "Sospechosa es la de monto alto; inusual la de monto bajo", "Inusual se reporta siempre; sospechosa solo se analiza"], "a": 0, "e": "El análisis media entre ambas."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "mc", "q": "El indicador más útil para medir la salud del sistema de prevención es:", "o": ["La calidad del análisis de las alertas generadas", "El número de páginas que tiene el manual vigente", "La cantidad de personal del área", "El presupuesto ejecutado en el año"], "a": 0, "e": "Calidad del proceso, no insumos."}, {"t": "mc", "q": "¿Qué significa aplicar un enfoque basado en riesgo (EBR)?", "o": ["Más medidas a mayor riesgo, simplificadas a menor", "Aplicar controles uniformes sin considerar el riesgo", "Eliminar controles ante riesgos bajos sin monitoreo", "Concentrar controles en las operaciones de mayor monto"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "vf", "q": "Compartir con o es", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "mc", "q": "Dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Un plan operativo que se ejecuta en un cincuenta por ciento revela:", "o": ["Una debilidad que exige acciones correctivas", "Un desempeño aceptable del área", "Un plan demasiado conservador", "Una gestión eficiente de los recursos disponibles"], "a": 0, "e": "El informe de ejecución sirve para corregir."}, {"t": "mc", "q": "La evaluación del riesgo de un producto debe incluir, entre otros aspectos:", "o": ["Su liquidez, su forma de pago y su canal de venta", "Su rentabilidad esperada y su cuota de mercado", "El número de competidores que lo ofrecen", "La antigüedad del ramo en la empresa"], "a": 0, "e": "Características que lo hacen atractivo para el delito."}, {"t": "vf", "q": "Lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "El control dual en operaciones sensibles consiste en:", "o": ["Que dos personas intervengan en el mismo proceso", "Que el sistema registre dos veces la operación", "Que el cliente firme por duplicado", "Que la operación se revise al año siguiente"], "a": 0, "e": "Reduce el riesgo de actuación individual indebida."}, {"t": "mc", "q": "Ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Un control detectivo típico en esta materia es:", "o": ["El monitoreo de operaciones y sus alertas", "La verificación de identidad al contratar", "La prohibición de cuentas anónimas", "La capacitación anual del personal"], "a": 0, "e": "Actúa después de ocurrida la operación."}, {"t": "mc", "q": "Que el área comercial participe en la decisión de reportar una alerta:", "o": ["Compromete la independencia del análisis", "Enriquece el análisis con su conocimiento", "Es obligatorio según la norma del sector", "Acelera el envío del reporte a la UNIF"], "a": 0, "e": "El área de negocio aporta información, no decide el reporte."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, ontexto, no solo por origen."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "Según la LOCDOFT, las facultades de organización, control y supervisión de la materia corresponden a:", "o": ["La ONCDOFT", "La UNIF", "El BCV", "El SENIAT"], "a": 0, "e": "Art. 5."}, {"t": "mc", "q": "Un sujeto obligado con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "mc", "q": "La evaluación nacional de riesgos sirve principalmente para que:", "o": ["El país y sus sectores enfoquen recursos donde más riesgo hay", "Cada empresa copie su contenido en su manual", "Se publiquen los nombres de los sujetos que han sido reportados", "Se fijen las multas aplicables por incumplimiento"], "a": 0, "e": "Es el insumo del enfoque basado en riesgo a nivel país."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "Siempre existe norma sectorial para todo el país", "Debe esperar a que se dicte la norma prudencial de su sector", "Solo responden los sectores con superintendencia"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Quien dicta las normas prudenciales para el sector bancario venezolano es:", "o": ["La Superintendencia de las Instituciones del Sector Bancario", "La Superintendencia Nacional de Valores", "La Superintendencia de la Actividad Aseguradora del país", "El Banco Central de Venezuela"], "a": 0, "e": "SUDEBAN para la banca; SUNAVAL para valores."}, {"t": "mc", "q": "El enfoque basado en riesgo implica, en esencia:", "o": ["Más controles a mayor riesgo y medidas simplificadas a menor riesgo", "El mismo nivel de control para todos los clientes por igual", "Eliminar controles donde el riesgo nunca se haya materializado", "Concentrar todos los controles en las operaciones de alto monto"], "a": 0, "e": "Lógica de proporcionalidad."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Las multas que la LOCDOFT prevé para los sujetos obligados se expresan en:", "o": ["Unidades tributarias", "Salarios mínimos mensuales", "Dólares de los Estados Unidos", "Petros o criptoactivos soberanos"], "a": 0, "e": "El régimen sancionatorio se expresa en U.T."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "mc", "q": "Un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "La LOCDOFT exige conservar los soportes para que, años después, se pueda:", "o": ["Reconstruir la operación y acreditarla ante la autoridad", "Justificar el pago de los impuestos del ejercicio fiscal", "Demostrar la rentabilidad del contrato", "Acreditar la antigüedad del cliente"], "a": 0, "e": "Trazabilidad probatoria."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre empresa y cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "La corrupción se vincula con el lavado de activos porque:", "o": ["Los fondos ilícitos necesitan legitimarse para poder usarse", "Ambos delitos requieren organizaciones de tres o más personas", "El lavado es un elemento del tipo penal de corrupción", "La corrupción solo ocurre con fondos en efectivo"], "a": 0, "e": "La corrupción es delito determinante del lavado."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "mc", "q": "Si la UNIF pide información a un sujeto obligado sobre un cliente, el sujeto obligado debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "Un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "La condición de PEP de un cliente debe revisarse:", "o": ["De forma periódica, porque los cargos cambian", "Solo al momento de aceptarlo como cliente", "Solo si el cliente lo informa por escrito", "Solo cuando lo exija la superintendencia"], "a": 0, "e": "El perfil debe mantenerse actualizado."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada empresa", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "mc", "q": "Según la LOCDOFT, la condición de sujeto obligado nace de:", "o": ["Estar bajo el control de un órgano o ente de control", "Tener un volumen de operaciones elevado", "Operar con clientes extranjeros", "Estar inscrito en el registro mercantil de su domicilio"], "a": 0, "e": "Definición legal del término."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}, {"t": "mc", "q": "Según el Decreto 3.656, el objeto de la UNIF es centralizar, procesar y analizar:", "o": ["Los reportes de actividades sospechosas", "Las declaraciones de impuestos del país", "Las licencias de los sujetos obligados", "Los registros mercantiles de empresas"], "a": 0, "e": "Art. 2 del Decreto de Adecuación, G.O. 41.522."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "La «colocación» en el lavado de activos consiste en:", "o": ["Introducir el producto del delito al sistema financiero", "Ocultar el origen mediante transferencias sucesivas", "Reincorporar los fondos blanqueados con apariencia lícita", "Cobrar un reclamo con documentos falsos"], "a": 0, "e": "Primera etapa; suele involucrar efectivo."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "¿Por qué el decomiso es una herramienta clave contra el crimen organizado?", "o": ["Priva a las organizaciones de su lucro y capacidad operativa", "Sustituye por completo a la pena privativa de libertad", "Financia los programas de trabajo de la ONCDOFT", "Se aplica sin necesidad de un proceso penal previo"], "a": 0, "e": "Privar al delito de su lucro."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Diferir una solicitud de asistencia, en lugar de negarla, sirve para:", "o": ["No entorpecer una investigación nacional en curso", "Cobrar los gastos del trámite por adelantado", "Esperar a que prescriba la acción penal", "Obtener reciprocidad del otro Estado"], "a": 0, "e": "Es una figura distinta de la denegación."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la LOCDOFT, los agentes cuya actividad principal es la intermediación de bienes raíces son:", "o": ["Sujetos obligados", "Órganos de control", "Usuarios ocasionales", "Entes de autorregulación"], "a": 0, "e": "Art. 9, numeral 10, literal a."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un reporte con información incompleta o errónea enviado a la UNIF:", "o": ["Reduce la utilidad de la inteligencia y es un incumplimiento", "Es preferible a no reportar y no tiene consecuencia alguna", "La UNIF lo corrige de oficio sin mayor trámite alguno", "Obliga a la UNIF a archivarlo sin análisis de ningún tipo"], "a": 0, "e": "La calidad del reporte importa."}, {"t": "mc", "q": "¿Por qué las normas exigen capacitación periódica al personal?", "o": ["Es la primera línea de detección de señales de alerta", "Es un requisito de acreditación que fija el supervisor", "Reduce las tarifas que se pagan a los proveedores", "Lo exige expresamente el Código de Comercio vigente"], "a": 0, "e": "Un sistema sin personal capacitado no detecta."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a un sujeto obligado por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "La protección legal a quien reporta de buena fe existe porque sin ella:", "o": ["Nadie reportaría por temor a represalias", "Los reportes serían siempre anónimos", "El cliente podría exigir una indemnización", "La UNIF no podría analizar los casos"], "a": 0, "e": "Objetivo: no inhibir el reporte."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}, {"t": "mc", "q": "Según la LOCDOFT, el destinatario de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Arts. 13, 24 y 25 en concordancia con el Decreto 3.656."}, {"t": "mc", "q": "La «estratificación» en el lavado de activos consiste en:", "o": ["Muchas operaciones para distanciar los fondos de su origen", "Introducir el efectivo ilícito en el sistema financiero", "Reincorporar los fondos blanqueados a la economía formal", "Fraccionar depósitos para evadir el reporte de efectivo"], "a": 0, "e": "Colocación, estratificación e integración."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las tarifas de servicios", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "El sector turismo cuenta con un regulador propio en esta materia, que es:", "o": ["El Ministerio del Poder Popular para el Turismo", "La Superintendencia de la Actividad Aseguradora", "La Comisión Nacional de Casinos", "La Superintendencia de Valores"], "a": 0, "e": "El ministerio del sector ejerce la supervisión."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el registro unificado de sujetos obligados se identifica como:", "o": ["RUSO-ONCDOFT", "RUAP-ONCDOFT", "RIF-ONCDOFT", "SIAR-ONCDOFT"], "a": 0, "e": "G.O. 42.118. El RUAP es el registro de actuación de los contadores."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "Las sanciones a las personas jurídicas de la LOCDOFT buscan:", "o": ["Evitar que la estructura societaria sirva de escudo", "Sustituir la pena que corresponde a las personas naturales", "Recaudar fondos para el órgano rector", "Castigar a los accionistas minoritarios"], "a": 0, "e": "Responsabilidad propia de la persona jurídica."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "La figura del «órgano rector» en la LOCDOFT existe para:", "o": ["Coordinar la política nacional contra estos delitos", "Centralizar los reportes de operaciones sospechosas", "Sustituir a las superintendencias sectoriales", "Dictar sentencias contra personas jurídicas"], "a": 0, "e": "Rectoría, coordinación, registro y lineamientos."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "mc", "q": "La imprescriptibilidad de la acción penal en la LOCDOFT significa que:", "o": ["El Estado puede perseguir el delito sin límite de tiempo", "La pena nunca se extingue ni con la muerte", "Los bienes que fueron decomisados no se devuelven jamás", "El proceso penal no puede sobreseers
