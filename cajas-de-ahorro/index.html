ol, no una absolución."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Según la LOCDOFT, los agentes cuya actividad principal es la intermediación de bienes raíces son:", "o": ["Sujetos obligados", "Órganos de control", "Usuarios ocasionales", "Entes de autorregulación"], "a": 0, "e": "Art. 9, numeral 10, literal a."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Según la LOCDOFT, la cuantía de una transacción sospechosa, para el deber de atención y reporte, es:", "o": ["Indiferente", "Relevante desde USD 10.000", "Relevante desde 1.000 U.T.", "Fijada por cada entidad"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "Según la LOCDOFT, la inmovilización preventiva de una cuenta durante la investigación la autoriza:", "o": ["El juez de control, a solicitud fiscal", "La UNIF, por un reporte de sospecha", "El órgano de control del banco", "El fiscal, por decisión propia"], "a": 0, "e": "Arts. 56 y 64."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "El decomiso de bienes en la LOCDOFT se distingue de la multa en que el decomiso:", "o": ["Recae sobre bienes vinculados al delito", "Se paga en unidades tributarias", "Lo impone el órgano de control", "Se aplica solo a personas naturales"], "a": 0, "e": "Multa es sanción pecuniaria; decomiso recae sobre el producto o instrumento."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "Siempre existe norma sectorial para todo el país", "Debe esperar a que se dicte la norma prudencial de su sector", "Solo responden los sectores con superintendencia"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Según la LOCDOFT, las facultades de organización, control y supervisión de la materia corresponden a:", "o": ["La ONCDOFT", "La UNIF", "El BCV", "El SENIAT"], "a": 0, "e": "Art. 5."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "mc", "q": "Según la LOCDOFT, el reporte de todas las transacciones en efectivo del mes anterior se remite a:", "o": ["La UNIF", "El Ministerio Público", "La ONCDOFT", "El Banco Central"], "a": 0, "e": "Art. 17."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "vf", "q": "Según la LOCDOFT, la multa por revelar un reporte a un cliente la impone el juez penal en la sentencia.", "a": false, "e": "Art. 14: la impone el órgano o ente de control."}, {"t": "mc", "q": "Según la LOCDOFT, la vinculación de un cliente persona expuesta políticamente debe aprobarla:", "o": ["La alta gerencia del sujeto obligado", "El órgano de control sectorial", "La UNIF antes de cada operación", "El oficial de cumplimiento en solitario"], "a": 0, "e": "Art. 18."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Según la LOCDOFT, enviar títulos valores al portador por una oficina de encomiendas se sanciona por:", "o": ["El órgano rector, con 1.000 a 3.000 U.T.", "El órgano de control, con 500 a 1.000 U.T.", "El juez de control, con prisión de 3 a 6 años", "El SENIAT, con el comiso de la encomienda"], "a": 0, "e": "Art. 23."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "mc", "q": "Según la LOCDOFT, un sujeto obligado envía un reporte de actividad sospechosa. Quien evalúa si inicia investigación penal es:", "o": ["El Ministerio Público, si la UNIF se lo remite", "La UNIF, por ser la receptora del reporte", "El órgano de control del sujeto obligado", "La ONCDOFT, como órgano rector"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "La razón por la que los notarios y registradores figuran como sujetos obligados es que:", "o": ["Intervienen en actos que transfieren bienes de alto valor", "Reciben pagos en efectivo de parte de sus usuarios", "Dependen del Ministerio de Justicia", "Emiten documentos con fe pública"], "a": 0, "e": "El traspaso de inmuebles y sociedades es vía típica de integración."}, {"t": "mc", "q": "Según la LOCDOFT, un banco alega secreto bancario ante una solicitud extranjera de incautación de documentos. En el régimen de cooperación:", "o": ["El secreto bancario no permite negarse", "Prevalece salvo orden de la Sala Plena", "Prevalece si el cliente es venezolano", "Solo cede con doble autorización ministerial"], "a": 0, "e": "Art. 87."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo de conservación de los documentos de identificación del cliente se cuenta desde:", "o": ["El día en que finaliza la relación", "La fecha en que fueron recibidos", "La última operación del cliente", "El reporte anual al supervisor"], "a": 0, "e": "Art. 10, numeral 1."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "vf", "q": "Según la LOCDOFT, ser PEP implica por sí mismo que el cliente debe ser rechazado.", "a": false, "e": "La condición de PEP eleva el riesgo y exige medidas reforzadas; no implica ilicitud ni rechazo automático."}, {"t": "vf", "q": "Según la LOCDOFT, un reporte de actividad sospechosa equivale a una denuncia penal y debe cumplir sus formalidades.", "a": false, "e": "Art. 13: no es una denuncia penal."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "Según la LOCDOFT, la no identificación plena del beneficiario final se sanciona con:", "o": ["1.000 a 3.000 U.T.", "500 a 1.000 U.T.", "300 a 500 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 16."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Según la LOCDOFT, en el curso de una investigación por legitimación, el banco desea cerrar la cuenta del investigado. Para hacerlo necesita:", "o": ["Autorización previa de un juez competente", "Autorización previa de la UNIF", "Solo la decisión del oficial de cumplimiento", "Notificar al cliente con treinta días"], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Según la LOCDOFT, además del bloqueo de cuentas, el fiscal puede pedir durante la investigación:", "o": ["La clausura preventiva de locales vinculados", "La disolución de la sociedad vinculada", "La revocatoria de licencias sectoriales", "La confiscación inmediata del local"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede sustituirla libremente cuando la otra sea más exigente", "Debe aplicar siempre la del sector bancario", "Puede elegir la que prefiera cada año"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a un sujeto obligado por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Según la LOCDOFT, el bloqueo preventivo de cuentas en investigaciones contra grupos criminales recae sobre cuentas:", "o": ["De alguno de los integrantes investigados", "De cualquier cliente del mismo banco", "Únicamente de las personas jurídicas", "Solo de quienes estén ya condenados"], "a": 0, "e": "Art. 56."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Según la LOCDOFT, la multa por revelar un reporte, en caso de reincidencia:", "o": ["Se duplica", "Se triplica", "Aumenta en un tercio", "Se convierte en prisión"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes los préstamos hipotecarios del banco"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Del siguiente grupo, el instrumento que NO pertenece al sistema universal de la ONU es:", "o": ["La Convención Interamericana contra la Corrupción", "La Convención de Palermo", "La Convención de Mérida", "El Convenio para la Represión de la Financiación del Terrorismo"], "a": 0, "e": "La Interamericana es de la OEA."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes por igual", "Ambos son recomendaciones sin efecto jurídico", "El GAFI aprueba los tratados"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "Un Estado que ratifica un tratado como Palermo debe, en lo esencial:", "o": ["Adecuar su legislación interna y cooperar con otros Estados", "Transferir su competencia penal a la ONU", "Ceder su jurisdicción sobre delitos transnacionales", "Crear un tribunal propio para cada delito"], "a": 0, "e": "Los tratados obligan a incorporar sus disposiciones al derecho interno."}, {"t": "mc", "q": "El artículo 8 de Palermo obliga a penalizar:", "o": ["La corrupción de funcionarios públicos", "El tráfico de estupefacientes", "El financiamiento del terrorismo", "El contrabando de armas"], "a": 0, "e": "Mérida desarrolla con mucho más detalle esta materia."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo (2002) se adoptó en el marco de:", "o": ["La OEA, en Bridgetown, Barbados", "La ONU, en Nueva York", "La OEA, en Caracas", "La ONU, en Viena"], "a": 0, "e": "Instrumento regional contra el terrorismo y su financiamiento."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo data de:", "o": ["1999", "1997", "2001", "2005"], "a": 0, "e": "Adoptado por la Asamblea General en diciembre de 1999."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "El blanqueo del producto del delito se penaliza en Palermo en el artículo:", "o": ["6", "5", "7", "12"], "a": 0, "e": "El artículo 7 fija las medidas preventivas y de supervisión."}, {"t": "mc", "q": "¿Qué exige Mérida a las instituciones financieras respecto de las cuentas de personas expuestas políticamente?", "o": ["Un examen más estricto de esas cuentas", "Cerrarlas de inmediato", "Prohibir su apertura en el exterior", "Informar al funcionario sobre su monitoreo"], "a": 0, "e": "Art. 52: debida diligencia reforzada para quienes desempeñan o han desempeñado funciones públicas prominentes."}, {"t": "mc", "q": "La protección específica de los denunciantes se recoge en Mérida en el artículo:", "o": ["33", "32", "30", "25"], "a": 0, "e": "Protege a quien denuncia de buena fe."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, la entrega vigilada se contempla en su artículo:", "o": ["11", "3", "5", "7"], "a": 0, "e": "El 3 tipifica; el 5, decomiso; el 7, asistencia."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "Para Palermo, un «delito grave» es el que tiene una pena privativa de libertad máxima de al menos:", "o": ["Cuatro años", "Dos años", "Cinco años", "Diez años"], "a": 0, "e": "Art. 2 b) de Palermo. La LOCDOFT habla de más de cinco años."}, {"t": "mc", "q": "Para que Palermo se aplique se requiere, por regla general:", "o": ["Carácter transnacional y un grupo delictivo organizado", "Que el delito tenga una pena máxima mayor a diez años", "Que intervenga un funcionario público", "Que el delito se cometa con violencia"], "a": 0, "e": "Ambos elementos, salvo las excepciones del propio texto."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "vf", "q": "La Convención de Mérida pide a los Estados considerar el establecimiento de sistemas de declaración patrimonial de los funcionarios públicos.", "a": true, "e": "Artículo 52 y concordantes del capítulo preventivo."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "Siempre involucra menores de edad", "Solo se aplica a fronteras marítimas", "Exige la participación de al menos un funcionario público"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "La «doble incriminación» puede impedir la cooperación cuando:", "o": ["La conducta no es delito en el Estado requerido", "El delito tiene penas distintas en cada país", "Los Estados no comparten frontera", "El investigado tiene doble nacionalidad"], "a": 0, "e": "Requisito clásico de la asistencia y la extradición."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando", "Extradición, asilo y refugio", "Soberanía, jurisdicción y territorio"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, es decir, quien ofrece y quien acepta", "Solo activa, de quien ofrece el beneficio", "Solo pasiva, es decir, de quien recibe el beneficio", "Solo cuando el funcionario es extranjero"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "Una solicitud de asistencia puede denegarse, entre otras razones, cuando:", "o": ["Afecta la soberanía, la seguridad o el orden público", "El delito es de cuantía reducida", "El Estado requirente no es un país limítrofe", "El investigado está prófugo"], "a": 0, "e": "Causales previstas en los tratados."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se adoptó en:", "o": ["2003", "1996", "2000", "2005"], "a": 0, "e": "Aprobada por la Asamblea General en 2003."}, {"t": "mc", "q": "El protocolo de Palermo sobre trata de personas se conoce como:", "o": ["Protocolo de Palermo contra la trata, en especial de mujeres y niños", "Protocolo de Nueva York sobre el trabajo forzoso y la servidumbre", "Protocolo adicional sobre explotación laboral", "Protocolo de Ginebra sobre migración"], "a": 0, "e": "Es el primer instrumento universal con definición de trata."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "La Convención de Estrasburgo de 1990, en el ámbito europeo, trata de:", "o": ["Blanqueo, investigación, incautación y decomiso del producto del delito", "Protección de los derechos humanos", "Cooperación aduanera entre Estados", "Reconocimiento y ejecución de sentencias civiles extranjeras"], "a": 0, "e": "Instrumento regional europeo sobre decomiso."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "mc", "q": "Palermo prevé los equipos conjuntos de investigación para:", "o": ["Permitir que autoridades de varios Estados trabajen juntas", "Sustituir a los tribunales nacionales", "Crear una policía internacional permanente", "Juzgar los hechos en el territorio de un tercer Estado"], "a": 0, "e": "Herramienta de cooperación operativa."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "Un delito es transnacional para Palermo cuando, entre otros supuestos:", "o": ["Se comete en más de un Estado", "Lo comete un extranjero en territorio nacional", "Los fondos se depositan en un banco extranjero", "La víctima tiene otra nacionalidad"], "a": 0, "e": "También: preparación en otro Estado, grupo que opera en varios, o efectos sustanciales en otro."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regul ón firmada en Viena en 1969", "La de 1988 derogó a la de 1969", "Ambas regulan exactamente lo mismo"], "a": 0, "e": "Trampa clásica por coincidencia de ciudad."}, {"t": "mc", "q": "El umbral de pena que Palermo usa para definir «delito grave» es:", "o": ["Privación de libertad máxima de al menos cuatro años", "Pena mínima de cuatro años de prisión", "Privación de libertad máxima de al menos cinco años", "Cualquier pena privativa de libertad"], "a": 0, "e": "Se mide por el máximo de la pena, no por el mínimo."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "mc", "q": "Según el Convenio de 1999, las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bien ito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "Según Palermo, los Estados deben instituir un régimen interno de reglamentación y supervisión que incluya:", "o": ["Identificación de clientes y reporte de sospechosas", "Aprobación judicial de toda transacción financiera", "Prohibición de operaciones de más de cierto monto", "Autorización de la ONU para cada transferencia"], "a": 0, "e": "Art. 7 de Palermo: bancos e instituciones financieras no bancarias; cooperación e intercambio de información."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "mc", "q": "El Convenio de Budapest, cuando se menciona en esta materia, trata de:", "o": ["La ciberdelincuencia y la prueba electrónica", "La corrupción en el deporte", "El tráfico de bienes culturales", "La protección de los datos personales en línea"], "a": 0, "e": "Relevante por el delito informático como delito determinante."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "mc", "q": "Según la Convención de Mérida, las medidas preventivas de blanqueo para instituciones financieras están en su artículo:", "o": ["14", "23", "31", "46"], "a": 0, "e": "El 23 tipifica el blanqueo; el 31, embargo y decomiso; el 46, asistencia."}, {"t": "mc", "q": "Palermo contempla la responsabilidad de las personas jurídicas por participación en delitos graves en que intervenga un grupo delictivo organizado. Esto significa que:", "o": ["La empresa responde sin condena de una persona", "Solo los directivos responden penalmente", "La empresa queda exenta si no obtuvo lucro", "La responsabilidad es solo moral"], "a": 0, "e": "Art. 10 de Palermo: responsabilidad penal, civil o administrativa, sin perjuicio de la de las personas naturales."}, {"t": "mc", "q": "Palermo se complementa con un número de protocolos igual a:", "o": ["Tres", "Dos", "Cuatro", "Uno"], "a": 0, "e": "Trata de personas, tráfico de migrantes y armas de fuego."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "mc", "q": "Según la Convención de Palermo, las técnicas especiales de investigación, como vigilancia electrónica y operaciones encubiertas, se tratan en su artículo:", "o": ["20", "18", "16", "5"], "a": 0, "e": "El 18 es asistencia judicial; el 16, extradición."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "El artículo 16 de Palermo se refiere a:", "o": ["La extradición entre los Estados parte", "La asistencia judicial recíproca", "La protección de los testigos", "Las técnicas especiales de investigación"], "a": 0, "e": "El 18 regula la asistencia judicial recíproca."}, {"t": "vf", "q": "Según el Convenio de 1999, no es necesario que los fondos se hayan utilizado efectivamente para que exista delito.", "a": true, "e": "La consumación es anticipada."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención Interamericana contra la Corrupción", "Solo las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según el Convenio de 1999 para la represión de la financiación del terrorismo, para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto se haya consumado", "Se requiere que los fondos sean de origen ilícito", "Se requiere que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "mc", "q": "Entre las técnicas especiales que Palermo contempla figuran:", "o": ["La entrega vigilada y las operaciones encubiertas", "El allanamiento sin orden judicial", "La detención preventiva indefinida", "El interrogatorio bajo juramento del imputado"], "a": 0, "e": "También la vigilancia electrónica, con las garantías internas."}, {"t": "mc", "q": "El artículo 18 de Palermo regula:", "o": ["La asistencia judicial recíproca más amplia posible", "El traslado de personas condenadas entre Estados", "La creación de equipos conjuntos", "La protección de las víctimas"], "a": 0, "e": "Es uno de los artículos más extensos del tratado."}, {"t": "mc", "q": "Mérida contiene medidas preventivas sobre el sector público como:", "o": ["Códigos de conducta, mérito y transparencia", "Reducción del gasto público", "Privatización de empresas estatales", "Eliminación de controles administrativos"], "a": 0, "e": "Capítulo II: arts. 5 a 14, incluyendo contratación pública, información pública y participación de la sociedad."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana contra la Corrupción es conocido como:", "o": ["MESICIC", "GAFIC", "CICAD", "MONEYVAL"], "a": 0, "e": "Mecanismo de Seguimiento de la Implementación de la Convención Interamericana contra la Corrupción."}, {"t": "mc", "q": "Palermo obliga a penalizar la participación en un grupo delictivo organizado en su artículo:", "o": ["5", "6", "8", "23"], "a": 0, "e": "El 6 penaliza el blanqueo y el 8 la corrupción."}, {"t": "mc", "q": "Según el Convenio de 1999, comete delito de financiación del terrorismo quien:", "o": ["Provee o recolecta fondos sabiendo su uso terrorista", "Comete personalmente el acto terrorista con sus fondos", "Solo quien recibe fondos de origen ilícito", "Solo quien traslada efectivo por una frontera"], "a": 0, "e": "Art. 2: basta la intención o el conocimiento del uso de los fondos."}, {"t": "mc", "q": "La Convención de las Naciones Unidas contra la Corrupción se conoce como Convención de:", "o": ["Mérida", "Palermo", "Viena", "Caracas"], "a": 0, "e": "Adoptada en 2003; el nombre proviene de la ciudad mexicana donde se abrió a firma."}, {"t": "vf", "q": "Los tratados de esta materia no crean tribunales internacionales para juzgar el lavado: la competencia sigue siendo de los Estados.", "a": true, "e": "La cooperación no sustituye la jurisdicción nacional."}, {"t": "mc", "q": "La integración del área de cumplimiento en el diseño de productos busca:", "o": ["Identificar riesgos antes de salir al mercado", "Retrasar el lanzamiento de la competencia", "Aumentar el precio final del producto", "Sustituir al área de mercadeo"], "a": 0, "e": "Cumplimiento desde el diseño."}, {"t": "mc", "q": "Un corredor cuyo nivel de vida no guarda relación con sus comisiones debe:", "o": ["Ser objeto de análisis por el área de cumplimiento", "Ser premiado por su desempeño comercial", "Ser cambiado de zona geográfica", "Ser ignorado por tratarse de su vida privada"], "a": 0, "e": "Riesgo interno previsto en la norma."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "mc", "q": "La «cultura de cumplimiento» en una organización se evidencia principalmente por:", "o": ["El ejemplo de la alta dirección", "El número de manuales de la empresa", "El tamaño del departamento de cumplimiento", "La decoración de las oficinas de la empresa"], "a": 0, "e": "Es práctica, no papel."}, {"t": "mc", "q": "El presupuesto específico para cumplimiento que aprueba la junta busca:", "o": ["Que el sistema cuente con medios reales", "Reducir el gasto general de la empresa", "Financiar la expansión comercial", "Cubrir las multas del supervisor"], "a": 0, "e": "Sin recursos el sistema es nominal."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Varios asegurados sin relación aparente que comparten dirección y teléfono sugieren:", "o": ["El uso de testaferros o una estructura común", "Un error de digitación de datos en el sistema", "Una campaña comercial en esa zona", "Un grupo familiar numeroso"], "a": 0, "e": "Coincidencias de datos como señal de alerta."}, {"t": "vf", "q": "Una operación inusual debe ser analizada, y solo se reporta como sospechosa si el análisis no encuentra una explicación razonable.", "a": true, "e": "Esa es la secuencia lógica."}, {"t": "vf", "q": "El canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Los controles preventivos se diferencian de los detectivos en que los primeros:", "o": ["Impiden que el riesgo se materialice", "Descubren el hecho después de ocurrido", "Corrigen las consecuencias del hecho", "Documentan el proceso para auditoría"], "a": 0, "e": "Prevenir, detectar y corregir son categorías distintas."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "mc", "q": "Un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Una señal de que la cultura de cumplimiento es débil es que:", "o": ["Las excepciones al procedimiento se vuelvan rutina", "El manual se actualice todos los años", "La capacitación sea obligatoria para todo el personal", "La junta reciba informes trimestrales"], "a": 0, "e": "La excepción normalizada erosiona el control."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Únicamente su monto reducido por operación", "Únicamente el volumen total vendido del año", "Únicamente el país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Para un cliente de riesgo bajo, la frecuencia de actualización:", "o": ["Puede ser mayor, siempre que esté justificada", "Debe ser igual a la del riesgo alto", "No es necesaria en ningún caso", "La fija el intermediario que captó al cliente"], "a": 0, "e": "Proporcionalidad documentada."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su contrato se anula automáticamente", "Su tarifa debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "mc", "q": "Si la función de cumplimiento depende del área comercial, el problema es que:", "o": ["Pierde la independencia necesaria para objetar negocios", "Aumenta su carga administrativa", "Se duplican los reportes al supervisor", "Se encarece la estructura administrativa de la empresa"], "a": 0, "e": "Conflicto de interés estructural."}, {"t": "mc", "q": "Las tipologías publicadas por organismos internacionales sirven al sujeto obligado para:", "o": ["Alimentar sus señales de alerta con casos reales", "Fijar los umbrales de sus reportes periódicos", "Clasificar a sus clientes por nacionalidad", "Determinar las tarifas de los productos"], "a": 0, "e": "Insumo de detección."}, {"t": "mc", "q": "Clasificar a todos los clientes extranjeros como de riesgo alto sin más análisis es:", "o": ["Una regla rígida que no constituye enfoque basado en riesgo", "La mejor práctica reconocida por los organismos internacionales", "Una exigencia de la norma del sector", "Un criterio neutral y proporcional"], "a": 0, "e": "El riesgo se evalúa por factores concurrentes."}, {"t": "mc", "q": "Lo contrario del enfoque basado en riesgo es un enfoque:", "o": ["De cumplimiento uniforme y formalista", "De supervisión consolidada", "De debida diligencia continua para toda la cartera", "De gestión por procesos"], "a": 0, "e": "El modelo de «misma medida para todos» desperdicia recursos."}, {"t": "mc", "q": "Un modelo de riesgo que nunca se valida contra resultados reales:", "o": ["Puede estar clasificando mal sin que nadie lo note", "Es preferible por su estabilidad en el tiempo", "Cumple igualmente con la norma del sector", "No necesita documentación adicional"], "a": 0, "e": "Los modelos se calibran con la experiencia."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un indicador clave muestra que las alertas tardan meses en analizarse. El riesgo más directo es:", "o": ["Reportar tardíamente operaciones sospechosas", "Calificar a la baja el riesgo inherente", "Exceder el presupuesto de cumplimiento", "Duplicar las evaluaciones de auditoría"], "a": 0, "e": "La expeditud es parte de la efectividad."}, {"t": "mc", "q": "La segunda línea de defensa está integrada, entre otros, y su cuota de mercado", "El número de competidores que lo ofrecen", "La antigüedad del ramo en la empresa"], "a": 0, "e": "Características que lo hacen atractivo para el delito."}, {"t": "mc", "q": "La primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "mc", "q": "Un sujeto obligado quiere priorizar sus recursos de cumplimiento. El criterio correcto es:", "o": ["El nivel de riesgo de cada segmento de su cartera", "El volumen de tarifas de cada línea", "La antigüedad de los clientes en la empresa", "La ubicación geográfica de sus oficinas"], "a": 0, "e": "El riesgo, no el negocio, ordena el esfuerzo."}, {"t": "mc", "q": "La ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "vf", "q": "El enfoque basado en riesgo no reduce el deber de reportar: lo ordena mejor, dirigiendo el esfuerzo donde el riesgo es mayor.", "a": true, "e": "Es un método de asignación, no una exención."}, {"t": "mc", "q": "Que la empresa conozca el propósito de la relación con el cliente permite:", "o": ["Detectar después lo que no encaja con ese propósito", "Ofrecerle productos adicionales de la cartera", "Reducir el plaz }, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "vf", "q": "El supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "mc", "q": "Si la empresa no sabe a qué se dedica un cliente, lo que ocurre es que:", "o": ["No puede evaluar si sus operaciones son coherentes", "Debe clasificarlo automáticamente como riesgo bajo", "Puede aceptarlo con una tarifa mayor", "Debe trasladar el análisis al proveedor"], "a": 0, "e": "Sin conocimiento no hay monitoreo posible."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "Frente a un hallazgo del auditor, la respuesta adecuada incluye:", "o": ["Un plan con responsable, acción y fecha", "Una nota explicando que es un criterio discutible", "El archivo del hallazgo por no ser material", "La espera a la próxima auditoría"], "a": 0, "e": "Los hallazgos se cierran con acciones verificables."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la tipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contr function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
