e del Consejo de Administración de la caja", "El asociado con el mayor monto de aportes acumulados"], "a": 0, "e": "Art. 30."}, {"t": "mc", "q": "Según el GAFI, el papel de la unidad de inteligencia financiera se regula en la Recomendación:", "o": ["29", "21", "15", "22"], "a": 0, "e": "Providencia 054-2022."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "Siempre involucra menores de edad", "Solo se aplica a fronteras marítimas", "Exige la participación de al menos un funcionario público"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "mc", "q": "Un control detectivo típico en esta materia es:", "o": ["El monitoreo de operaciones y sus alertas", "La verificación de identidad al contratar", "La prohibición de cuentas anónimas", "La capacitación anual del personal"], "a": 0, "e": "Actúa después de ocurrida la operación."}, {"t": "mc", "q": "Si ninguna persona natural alcanza el umbral de participación, el estándar indica:", "o": ["Identificar a quien ejerza el control por otros medios", "Registrar a la propia sociedad como beneficiario final", "Suspender la relación comercial", "Aceptar al representante legal como tal"], "a": 0, "e": "Enfoque en cascada hasta llegar a una persona natural."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Las tipologías publicadas por el GAFI y los organismos regionales sirven para:", "o": ["Reconocer patrones y mejorar la detección", "Fijar los umbrales de reporte de cada país", "Determinar las penas aplicables al delito", "Clasificar a los países por nivel de riesgo"], "a": 0, "e": "Casos reales que alimentan las señales de alerta."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "Las medidas intensificadas deben aplicarse, entre otros casos, a:", "o": ["Relaciones con países de mayor riesgo", "Todos los clientes extranjeros sin excepción", "Clientes que paguen con tarjeta de crédito", "Operaciones realizadas en fin de semana"], "a": 0, "e": "El riesgo determina la intensidad."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las controversias sobre el desempeño del Responsable de Cumplimiento se dirimen ante:", "o": ["SUDECA", "La UNIF", "El Consejo de Administración", "El Ministerio Público"], "a": 0, "e": "Punto quinto."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las operaciones de PEP o sus vinculados se registran en:", "o": ["Los Libros de Registros de Operaciones", "La cartelera informativa de la asociación", "El expediente del proveedor principal", "Los archivos del empleador de la caja"], "a": 0, "e": "Punto décimo, numeral 2."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, ante una investigación, la falta de libros actualizados lleva a presumir que:", "o": ["La omisión es intencional para encubrir un ilícito", "La asociación no tuvo operación alguna ese ejercicio", "El Consejo de Vigilancia carece de responsabilidad", "La falta fue causada siempre por un error del sistema"], "a": 0, "e": "Punto décimo primero."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "¿Qué debe hacerse al aprobar la relación con un PEP según el GAFI?", "o": ["Alta gerencia, origen de riqueza y vigilancia", "Aplicar la misma diligencia que a otro cliente", "Cerrar la cuenta por el riesgo que representa", "Aprobación de un empleado del área comercial"], "a": 0, "e": "R.12."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la mención de un asociado en un medio de comunicación:", "o": ["No genera reporte automático sin indagación previa", "Obliga a remitir de inmediato el reporte a la UNIF", "Implica cerrar su cuenta sin realizar ningún análisis", "Debe ser informada al asociado mencionado antes de todo"], "a": 0, "e": "Art. 41."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, promover la cultura de cumplimiento, de manera conjunta con el Responsable, es obligación de:", "o": ["El Consejo de Administración", "El proveedor de servicios", "La Unidad de Inteligencia", "Cada empleador asociado"], "a": 0, "e": "Punto tercero."}, {"t": "mc", "q": "El control dual en operaciones sensibles consiste en:", "o": ["Que dos personas intervengan en el mismo proceso", "Que el sistema registre dos veces la operación", "Que el cliente firme por duplicado", "Que la operación se revise al año siguiente"], "a": 0, "e": "Reduce el riesgo de actuación individual indebida."}]}]}, {"titulo": "Normativa nacional: LOCDOFT, UNIF y ONCDOFT", "exams": [{"titulo": "Normativa nacional · modelo 1", "q": [{"t": "mc", "q": "La prohibición de enviar divisas por encomiendas busca evitar:", "o": ["El traslado de valores fuera de todo control", "La competencia a la banca tradicional", "El encarecimiento del servicio postal para los usuarios", "La pérdida de paquetes en tránsito"], "a": 0, "e": "Cierra una vía de traslado oculto."}, {"t": "mc", "q": "Que la reincidencia duplique la multa por violar la confidencialidad demuestra que la ley:", "o": ["Agrava la sanción cuando la falta se repite", "Perdona la primera infracción cometida", "Convierte la falta en delito automáticamente", "Traslada la sanción al cliente afectado"], "a": 0, "e": "Lógica de agravación por reiteración."}, {"t": "mc", "q": "En la arquitectura de la LOCDOFT, ¿qué diferencia a la ONCDOFT de la UNIF?", "o": ["ONCDOFT rige la política; UNIF analiza reportes financieros", "La primera analiza los reportes; la segunda dicta la política nacional", "La primera supervisa a las aseguradoras; la segunda a los bancos", "La primera investiga penalmente; la segunda sanciona administrativamente"], "a": 0, "e": "Son órganos distintos y dependen de ministerios distintos."}, {"t": "vf", "q": "Según la LOCDOFT, el Ministerio del Poder Popular para el Turismo actúa como órgano de control de su sector.", "a": true, "e": "Art. 7, numeral 12, citado en el instructivo UNIF de marzo de 2024."}, {"t": "vf", "q": "Según la LOCDOFT, revelar a un cliente que fue objeto de un reporte vulnera el deber de confidencialidad.", "a": true, "e": "Art. 14, citado en la Providencia 054-2022."}, {"t": "vf", "q": "Avisar al cliente que se presentó un ROS en su contra viola el deber de confidencialidad que la LOCDOFT sanciona.", "a": true, "e": "El «tipping-off» está prohibido."}, {"t": "vf", "q": "Según la LOCDOFT, la actuación de una sola persona puede sancionarse como delincuencia organizada cuando actúa como órgano de una persona jurídica o asociativa para esos fines.", "a": true, "e": "Es un supuesto especial previsto por la ley."}, {"t": "mc", "q": "Si una operación en efectivo supera el umbral del reporte periódico, el sujeto obligado debe:", "o": ["Reportarla y además evaluar si hay sospecha", "Reportarla y dar por cerrado el análisis", "Analizarla sin reportarla si es un cliente conocido", "Pedir autorización del cliente para reportarla"], "a": 0, "e": "El reporte objetivo no sustituye el análisis subjetivo."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Una fundación sin fines de lucro pregunta ante quién debe registrarse como sujeto obligado no financiero. La respuesta es:", "o": ["Ante la ONCDOFT, como órgano rector", "Ante la UNIF, que lleva el registro nacional", "Ante SUDEASEG, por recibir donaciones", "Ante el registro mercantil de su domicilio"], "a": 0, "e": "La ONCDOFT lleva el registro de los sujetos obligados no financieros."}, {"t": "mc", "q": "Un sujeto obligado destruye expedientes a los tres años para ahorrar espacio. Esto:", "o": ["Incumple el plazo mínimo legal de conservación", "Es válido si digitalizó los documentos", "Es válido si el cliente ya no opera", "Es válido con la autorización previa de la junta directiva"], "a": 0, "e": "El mínimo legal es de cinco años."}, {"t": "mc", "q": "Una PEP extranjera quiere contratar con un sujeto obligado venezolano. El tratamiento adecuado es:", "o": ["Debida diligencia reforzada y aprobación de alta gerencia", "Rechazo automático por ser extranjera", "Tratamiento ordinario si cuenta con visa y pasaporte vigentes", "Aprobación del área comercial únicamente"], "a": 0, "e": "Los PEP extranjeros son de riesgo elevado por estándar internacional."}, {"t": "mc", "q": "Un grupo de delincuencia organizada comete un delito del Código Penal. Según la LOCDOFT:", "o": ["Se trata como delincuencia organizada con pena agravada", "Se juzga como delito común sin agravante de ninguna clase", "Se remite a la UNIF para que califique el delito primero", "Se juzga como delito común con una atenuante por el grupo"], "a": 0, "e": "La ley califica como delincuencia organizada los delitos de otras leyes cometidos por el grupo."}, {"t": "mc", "q": "Según la LOCDOFT, las facultades de organización, control y supervisión de la materia corresponden a:", "o": ["La ONCDOFT", "La UNIF", "El BCV", "El SENIAT"], "a": 0, "e": "Art. 5."}, {"t": "mc", "q": "Un sujeto obligado con cero reportes en cinco años y alto volumen de operaciones. La lectura razonable es:", "o": ["Posibles fallas de detección o de cultura de reporte", "Indicio de una cartera con riesgo realmente bajo", "Mérito que el supervisor debe reconocer en inspección", "Resultado normal y esperable en el sector"], "a": 0, "e": "Cero reportes es un indicador de alerta para el supervisor."}, {"t": "mc", "q": "La LOCDOFT fija el marco general y cada superintendencia dicta su norma sectorial. Si una providencia sectorial contradijera a la ley, prevalece:", "o": ["La ley, por jerarquía normativa", "La providencia, por ser norma especial", "La más reciente de las dos en el tiempo", "La que elija el órgano de control"], "a": 0, "e": "Una providencia administrativa no puede contradecir una ley orgánica."}, {"t": "vf", "q": "La LOCDOFT prohíbe el envío de divisas en efectivo o títulos al portador por correos públicos o encomiendas.", "a": true, "e": "Medida contra el traslado oculto de capitales."}, {"t": "mc", "q": "La evaluación nacional de riesgos sirve principalmente para que:", "o": ["El país y sus sectores enfoquen recursos donde más riesgo hay", "Cada empresa copie su contenido en su manual", "Se publiquen los nombres de los sujetos que han sido reportados", "Se fijen las multas aplicables por incumplimiento"], "a": 0, "e": "Es el insumo del enfoque basado en riesgo a nivel país."}, {"t": "mc", "q": "Un sujeto obligado detecta que el beneficiario final de un cliente es un funcionario de alto rango. Debe:", "o": ["Reclasificar el riesgo y aplicar las medidas de PEP", "Ignorarlo, porque el cliente contratante es una empresa", "Cerrar la relación de inmediato", "Informarlo al funcionario involucrado"], "a": 0, "e": "La condición PEP se mira en el beneficiario final, no solo en el titular."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "vf", "q": "La política de cumplimiento puede ser tercerizada por completo, incluida la decisión de aceptar al cliente, si el proveedor es de prestigio.", "a": false, "e": "La responsabilidad final es del sujeto obligado y hay funciones indelegables."}, {"t": "mc", "q": "Un tribunal ordena la publicación de la sentencia contra una empresa en un diario nacional. La finalidad es:", "o": ["Añadir un reproche público al patrimonial", "Informar a los acreedores del concurso", "Cumplir un requisito de notificación procesal", "Permitir que terceros se opongan al fallo"], "a": 0, "e": "Sanción de carácter reputacional."}, {"t": "mc", "q": "Una empresa alega que su sector no tiene norma prudencial propia, así que no tiene deberes. Es incorrecto porque:", "o": ["La LOCDOFT le impone deberes aunque no haya norma sectorial", "Siempre existe norma sectorial para todo el país", "Debe esperar a que se dicte la norma prudencial de su sector", "Solo responden los sectores con superintendencia"], "a": 0, "e": "La ley obliga; la norma sectorial detalla."}, {"t": "mc", "q": "Quien dicta las normas prudenciales para el sector bancario venezolano es:", "o": ["La Superintendencia de las Instituciones del Sector Bancario", "La Superintendencia Nacional de Valores", "La Superintendencia de la Actividad Aseguradora del país", "El Banco Central de Venezuela"], "a": 0, "e": "SUDEBAN para la banca; SUNAVAL para valores."}, {"t": "mc", "q": "El enfoque basado en riesgo implica, en esencia:", "o": ["Más controles a mayor riesgo y medidas simplificadas a menor riesgo", "El mismo nivel de control para todos los clientes por igual", "Eliminar controles donde el riesgo nunca se haya materializado", "Concentrar todos los controles en las operaciones de alto monto"], "a": 0, "e": "Lógica de proporcionalidad."}, {"t": "vf", "q": "Un cliente puede convertirse en PEP después de haber sido aceptado, y el sujeto obligado debe detectarlo y reclasificarlo.", "a": true, "e": "Por eso el monitoreo es continuo."}, {"t": "mc", "q": "Las multas que la LOCDOFT prevé para los sujetos obligados se expresan en:", "o": ["Unidades tributarias", "Salarios mínimos mensuales", "Dólares de los Estados Unidos", "Petros o criptoactivos soberanos"], "a": 0, "e": "El régimen sancionatorio se expresa en U.T."}, {"t": "mc", "q": "La inclusión de los clubes y asociaciones deportivas, cuando aplica, responde a que:", "o": ["Mueven patrocinios y traspasos de alto valor", "Reciben subsidios y aportes del Estado", "Tienen muchos afiliados", "Operan en varios municipios"], "a": 0, "e": "Riesgo por flujos internacionales y valoración opaca."}, {"t": "mc", "q": "Un sujeto obligado identifica que un cliente figura en una lista de sanciones por vínculos con terrorismo. Debe:", "o": ["Congelar, reportar y no informar al cliente", "Suspender la relación y notificar al cliente el motivo", "Continuar la relación hasta recibir orden judicial", "Esperar a la próxima actualización de datos para decidir"], "a": 0, "e": "Las sanciones financieras dirigidas exigen acción inmediata y reserva."}, {"t": "vf", "q": "El enfoque basado en riesgo permite no aplicar ninguna medida a los clientes de riesgo bajo.", "a": false, "e": "Permite medidas simplificadas, no la ausencia de monitoreo."}, {"t": "mc", "q": "La LOCDOFT exige conservar los soportes para que, años después, se pueda:", "o": ["Reconstruir la operación y acreditarla ante la autoridad", "Justificar el pago de los impuestos del ejercicio fiscal", "Demostrar la rentabilidad del contrato", "Acreditar la antigüedad del cliente"], "a": 0, "e": "Trazabilidad probatoria."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Un auditor interno certifica la autoevaluación de riesgo, pero nadie analizó los productos nuevos. El principio vulnerado es:", "o": ["Enfoque basado en riesgo: evaluar productos antes de lanzarlos", "Autonomía funcional del Oficial de Cumplimiento ante la Junta", "Gratuidad de la función de cumplimiento en la empresa", "Buena fe contractual entre empresa y cliente"], "a": 0, "e": "Los productos nuevos alteran el perfil de riesgo."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "mc", "q": "La asistencia judicial recíproca puede denegarse, entre otros casos, cuando:", "o": ["Afecta la soberanía o el orden público del Estado", "El delito tiene pena menor a diez años", "El solicitante no es país del continente", "El investigado ya fue absuelto en otro país"], "a": 0, "e": "Son causales clásicas de denegación."}, {"t": "mc", "q": "Un oficial de cumplimiento cree que reportar a un cliente importante le costará el puesto. Lo correcto es:", "o": ["Reportar: el deber legal no depende del cargo", "Consultarlo con el cliente antes de decidir", "Dejar constancia interna y no reportar", "Renunciar antes de presentar el reporte"], "a": 0, "e": "La independencia del cargo existe precisamente para esto."}, {"t": "vf", "q": "Una evaluación de riesgos que no se actualiza ante nuevos productos, clientes o canales pierde su utilidad como herramienta de gestión.", "a": true, "e": "El riesgo es dinámico."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "mc", "q": "La corrupción se vincula con el lavado de activos porque:", "o": ["Los fondos ilícitos necesitan legitimarse para poder usarse", "Ambos delitos requieren organizaciones de tres o más personas", "El lavado es un elemento del tipo penal de corrupción", "La corrupción solo ocurre con fondos en efectivo"], "a": 0, "e": "La corrupción es delito determinante del lavado."}, {"t": "mc", "q": "Un sujeto obligado conserva los registros por tres años. Según la LOCDOFT y el GAFI, el plazo mínimo es de:", "o": ["Cinco años", "Cuatro años", "Siete años", "Diez años"], "a": 0, "e": "La LOCDOFT y el GAFI (R.11) fijan cinco años; la norma de SUDEASEG 2024 es más exigente para digital."}, {"t": "mc", "q": "Si la UNIF pide información a un sujeto obligado sobre un cliente, el sujeto obligado debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "Un sujeto obligado recibe una citación del Ministerio Público sobre un cliente y, además, detecta una operación sospechosa nueva. Debe:", "o": ["Responder la citación y presentar el reporte a la UNIF", "Responder solo la citación, que absorbe el reporte", "Presentar solo el reporte, que absorbe la citación", "Esperar el resultado del proceso penal"], "a": 0, "e": "Son deberes distintos y concurrentes."}, {"t": "mc", "q": "La condición de PEP de un cliente debe revisarse:", "o": ["De forma periódica, porque los cargos cambian", "Solo al momento de aceptarlo como cliente", "Solo si el cliente lo informa por escrito", "Solo cuando lo exija la superintendencia"], "a": 0, "e": "El perfil debe mantenerse actualizado."}, {"t": "mc", "q": "La obligación de conservar registros en la LOCDOFT tiene como propósito central:", "o": ["Reconstruir operaciones y aportar evidencia a las autoridades", "Cumplir las normas contables de archivo de la empresa", "Facilitar las auditorías fiscales que realiza el SENIAT", "Respaldar la defensa comercial de la propia empresa"], "a": 0, "e": "La trazabilidad documental sostiene las investigaciones."}, {"t": "mc", "q": "La UNIF intercambia información con unidades de otros países. Eso se apoya en:", "o": ["La cooperación internacional entre unidades de inteligencia", "Un tratado bilateral con cada empresa", "La autorización previa y expresa del cliente afectado", "La publicación de los reportes recibidos"], "a": 0, "e": "Los acuerdos entre UIF permiten el intercambio seguro."}, {"t": "mc", "q": "Según la LOCDOFT, la condición de sujeto obligado nace de:", "o": ["Estar bajo el control de un órgano o ente de control", "Tener un volumen de operaciones elevado", "Operar con clientes extranjeros", "Estar inscrito en el registro mercantil de su domicilio"], "a": 0, "e": "Definición legal del término."}, {"t": "vf", "q": "Una autoevaluación de riesgo de un sujeto obligado que ignora por completo el riesgo del país y de su sector está incompleta.", "a": true, "e": "El contexto nacional y sectorial forma parte del análisis."}]}, {"titulo": "Normativa nacional · modelo 2", "q": [{"t": "mc", "q": "Según el Decreto 3.656, el objeto de la UNIF es centralizar, procesar y analizar:", "o": ["Los reportes de actividades sospechosas", "Las declaraciones de impuestos del país", "Las licencias de los sujetos obligados", "Los registros mercantiles de empresas"], "a": 0, "e": "Art. 2 del Decreto de Adecuación, G.O. 41.522."}, {"t": "vf", "q": "Una estructura de varias sociedades interpuestas sin razón económica aparente es señal de alerta que debe analizarse.", "a": true, "e": "Las estructuras opacas son un medio típico de ocultar al beneficiario final."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "La LOCDOFT prohíbe mantener relaciones con personas cuya identidad no pueda determinarse. La razón de fondo es:", "o": ["Sin identificar al cliente no hay control posible", "La ley protege el secreto bancario", "Las operaciones anónimas pagan más impuestos", "El registro mercantil lo exige"], "a": 0, "e": "La identificación es la base de todo el sistema."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "mc", "q": "La «colocación» en el lavado de activos consiste en:", "o": ["Introducir el producto del delito al sistema financiero", "Ocultar el origen mediante transferencias sucesivas", "Reincorporar los fondos blanqueados con apariencia lícita", "Cobrar un reclamo con documentos falsos"], "a": 0, "e": "Primera etapa; suele involucrar efectivo."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "mc", "q": "Un sujeto obligado pequeño dice que «por su tamaño no necesita enfoque basado en riesgo». La respuesta correcta es:", "o": ["La proporcionalidad ajusta medidas, pero no exime del enfoque", "Tiene razón: los sujetos obligados pequeñas quedan exentas", "Debe copiar el manual de un sujeto obligado de mayor tamaño", "Solo debe aplicarlo si atiende clientes que sean extranjeros"], "a": 0, "e": "Proporcionalidad no es exención."}, {"t": "vf", "q": "Un sujeto obligado que desconoce las circulares vigentes de la UNIF corre el riesgo de presentar reportes que no cumplen la forma exigida.", "a": true, "e": "La forma del reporte también es parte del deber."}, {"t": "mc", "q": "Un empleado afirma que el ROS «es una denuncia penal» y que, si no hay delito, el reportante responde. Según la LOCDOFT:", "o": ["Es incorrecto: el ROS no es denuncia ni genera responsabilidad", "Es correcto: si no se prueba el delito, el sujeto obligado responde civilmente", "Es correcto solo para el Oficial de Cumplimiento que lo firma", "Es incorrecto, pero el reportante responde si el monto era menor al umbral"], "a": 0, "e": "El ROS parte de una sospecha; la ley protege al reportante para no inhibir el reporte."}, {"t": "mc", "q": "Un empleado reporta internamente una operación y su jefe le ordena no escalarla. Lo correcto es:", "o": ["Dejar constancia y escalarla al oficial de cumplimiento", "Acatar la orden que le dio su superior jerárquico", "Avisar al cliente de la situación", "Esperar a la auditoría anual"], "a": 0, "e": "El deber legal está por encima de la instrucción interna."}, {"t": "mc", "q": "¿Por qué el decomiso es una herramienta clave contra el crimen organizado?", "o": ["Priva a las organizaciones de su lucro y capacidad operativa", "Sustituye por completo a la pena privativa de libertad", "Financia los programas de trabajo de la ONCDOFT", "Se aplica sin necesidad de un proceso penal previo"], "a": 0, "e": "Privar al delito de su lucro."}, {"t": "mc", "q": "Una persona jurídica que comete intencionalmente delitos de la LOCDOFT puede enfrentar, como sanción más grave:", "o": ["La clausura definitiva", "La suspensión temporal de actividades por un año", "La amonestación pública únicamente", "La intervención de su junta directiva por SUDEASEG"], "a": 0, "e": "Además: multa, prohibición de actividades, decomiso y publicación de sentencia."}, {"t": "vf", "q": "Conservar los soportes solo en papel, cuando la norma sectorial exige también respaldo digital por más tiempo, deja al sujeto obligado en incumplimiento.", "a": true, "e": "Se aplica el plazo más exigente."}, {"t": "mc", "q": "Un exfuncionario condenado por delitos de la LOCDOFT, tras cumplir su pena, enfrenta como pena accesoria:", "o": ["Inhabilitación para cargos públicos y para contratar con el Estado", "Pérdida definitiva de la nacionalidad venezolana por condena", "Multa equivalente al valor de los bienes que se decomisen", "Prohibición de salida del país durante cinco años más"], "a": 0, "e": "La ley prevé destitución e inhabilitación."}, {"t": "mc", "q": "Diferir una solicitud de asistencia, en lugar de negarla, sirve para:", "o": ["No entorpecer una investigación nacional en curso", "Cobrar los gastos del trámite por adelantado", "Esperar a que prescriba la acción penal", "Obtener reciprocidad del otro Estado"], "a": 0, "e": "Es una figura distinta de la denegación."}, {"t": "mc", "q": "El Registro Unificado de Sujetos Obligados fue creado para que el órgano rector pueda:", "o": ["Conocer y supervisar a los sujetos no financieros", "Cobrar un tributo anual a los sujetos obligados", "Sustituir el registro mercantil de las empresas", "Autorizar cada operación de los sujetos obligados"], "a": 0, "e": "La ONCDOFT lo usa para intercambio de información, cooperación y supervisión."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la LOCDOFT, los agentes cuya actividad principal es la intermediación de bienes raíces son:", "o": ["Sujetos obligados", "Órganos de control", "Usuarios ocasionales", "Entes de autorregulación"], "a": 0, "e": "Art. 9, numeral 10, literal a."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "mc", "q": "Un sujeto obligado recibe una solicitud de información del Ministerio Público sobre un cliente. Frente al cliente debe:", "o": ["Responder a la autoridad y no informar al cliente", "Avisar al cliente antes de responder", "Solicitar autorización del cliente para entregar los datos", "Informar al cliente luego de entregar la información"], "a": 0, "e": "Reserva de la investigación."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Un sujeto obligado considera que un cliente es «de confianza» y relaja sus controles. El error es que:", "o": ["La confianza no sustituye la debida diligencia documentada", "Puede hacerlo si el cliente tiene más de diez años", "Puede hacerlo si el cliente es otra empresa regulada", "Puede hacerlo con autorización del oficial"], "a": 0, "e": "Los controles se aplican por riesgo, no por simpatía."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Dos personas se asocian por tiempo prolongado para cometer estafas con ánimo de lucro. Según la definición de la LOCDOFT:", "o": ["No alcanzan el mínimo legal de tres integrantes", "Constituyen delincuencia organizada, que exige dos o más personas", "Constituyen delincuencia organizada si actúan con fin de lucro", "Constituyen delincuencia organizada si son extranjeros"], "a": 0, "e": "El mínimo legal es tres personas."}, {"t": "mc", "q": "Un sujeto obligado no financiero en Venezuela queda bajo la supervisión de la ONCDOFT cuando:", "o": ["No tiene un órgano de control sectorial propio", "Factura menos de un monto fijado cada año", "Opera solo en una entidad federal del país", "Lo solicita en forma voluntaria y por escrito"], "a": 0, "e": "Evaluación Sectorial ONCDOFT 2026: doble rol de ente rector y supervisor de no financieros."}, {"t": "mc", "q": "La razón de que la ley alcance a quienes comercializan vehículos, naves y aeronaves es que:", "o": ["Son bienes de alto valor fáciles de usar para integrar fondos", "Sus vendedores manejan información personal de los clientes", "El Estado controla su matriculación", "Pagan impuestos elevados"], "a": 0, "e": "Bienes de alto valor y alta liquidez."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "vf", "q": "Según la LOCDOFT, el reporte de actividades sospechosas exige que el sujeto obligado haya comprobado antes el delito.", "a": false, "e": "El reporte se apoya en la sospecha; la investigación corresponde a las autoridades."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Un empleado nunca toma vacaciones, recibe regalos de clientes y vive por encima de su sueldo. El supervisor debe:", "o": ["Reportarlo al Oficial de Cumplimiento por posible complicidad", "Registrarlo como buen desempeño en su evaluación anual", "Hablar con el empleado y dar por cerrado el asunto", "Esperar a la auditoría externa del siguiente ejercicio fiscal"], "a": 0, "e": "Esos son indicadores internos de riesgo."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Un reporte con información incompleta o errónea enviado a la UNIF:", "o": ["Reduce la utilidad de la inteligencia y es un incumplimiento", "Es preferible a no reportar y no tiene consecuencia alguna", "La UNIF lo corrige de oficio sin mayor trámite alguno", "Obliga a la UNIF a archivarlo sin análisis de ningún tipo"], "a": 0, "e": "La calidad del reporte importa."}, {"t": "mc", "q": "¿Por qué las normas exigen capacitación periódica al personal?", "o": ["Es la primera línea de detección de señales de alerta", "Es un requisito de acreditación que fija el supervisor", "Reduce las tarifas que se pagan a los proveedores", "Lo exige expresamente el Código de Comercio vigente"], "a": 0, "e": "Un sistema sin personal capacitado no detecta."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "Si una circular del supervisor fija un criterio nuevo sobre reportes, el sujeto obligado debe:", "o": ["Ajustar sus procedimientos y dejar constancia", "Esperar a que se publique en Gaceta Oficial", "Aplicarla solo si la junta directiva la aprueba", "Ignorarla si contradice su manual interno"], "a": 0, "e": "El manual se ajusta al criterio del supervisor."}, {"t": "mc", "q": "Una autoridad extranjera solicita información a un sujeto obligado por vía informal. Lo correcto es:", "o": ["Canalizarla por los mecanismos oficiales de cooperación", "Responder de inmediato para colaborar con esa autoridad", "Ignorarla por provenir de una autoridad del extranjero", "Informar al cliente de que existe esa solicitud"], "a": 0, "e": "La cooperación sigue canales formales."}, {"t": "mc", "q": "Un viajero lleva US$12.000 en efectivo y sale del país. Según la LOCDOFT:", "o": ["Declararlos: exceden el umbral legal de US$10.000", "No debe declararlos porque el umbral es US$15.000", "Debe declararlos solo si es extranjero", "Debe declararlos solo si viaja a un destino de riesgo"], "a": 0, "e": "La LOCDOFT fija US$10.000; el GAFI recomienda un máximo de 15.000."}, {"t": "mc", "q": "Un agente inmobiliario pregunta cuál es su marco si no hay superintendencia del sector. La respuesta es:", "o": ["La LOCDOFT, el registro ante la ONCDOFT y el estándar del GAFI", "Ninguno, mientras no exista una superintendencia del sector", "Solo el Código Civil y el registro mercantil", "La norma del sector bancario por analogía"], "a": 0, "e": "Es una APNFD; sus deberes vienen de la ley y del órgano rector."}, {"t": "vf", "q": "La LOCDOFT permite extender la condición de sujeto obligado a otros actores mediante ley o decreto.", "a": true, "e": "La ley prevé expresamente la ampliación de la categoría."}, {"t": "vf", "q": "La LOCDOFT impone deberes de prevención, pero la investigación y el ejercicio de la acción penal corresponden al Ministerio Público.", "a": true, "e": "Separación entre prevención administrativa y persecución penal."}, {"t": "mc", "q": "Un colega sostiene que la ley vigente contra la delincuencia organizada es la de 2005. La respuesta correcta es:", "o": ["Fue derogada por la LOCDOFT de 2012 (G.O. 39.912)", "Sigue vigente y la LOCDOFT solo la complementa", "Fue derogada por la Norma de SUDEASEG de 2024", "Sigue vigente para el sector financiero"], "a": 0, "e": "Una ley posterior sobre la misma materia deroga a la anterior; además la derogación es expresa."}, {"t": "mc", "q": "La protección legal a quien reporta de buena fe existe porque sin ella:", "o": ["Nadie reportaría por temor a represalias", "Los reportes serían siempre anónimos", "El cliente podría exigir una indemnización", "La UNIF no podría analizar los casos"], "a": 0, "e": "Objetivo: no inhibir el reporte."}, {"t": "mc", "q": "La diferencia entre el registro de sujetos obligados y el registro de facilitadores es que el primero inscribe:", "o": ["Empresas y personas con deberes de prevención", "Capacitadores acreditados en la materia", "Operaciones sospechosas reportadas", "Clientes de alto riesgo del sistema"], "a": 0, "e": "Uno registra obligados, el otro a quienes los capacitan."}]}, {"titulo": "Normativa nacional · modelo 3", "q": [{"t": "mc", "q": "Según la LOCDOFT, el destinatario de los reportes de actividades sospechosas es:", "o": ["La UNIF", "La ONCDOFT", "El órgano de control", "El Ministerio Público"], "a": 0, "e": "Arts. 13, 24 y 25 en concordancia con el Decreto 3.656."}, {"t": "mc", "q": "La «estratificación» en el lavado de activos consiste en:", "o": ["Muchas operaciones para distanciar los fondos de su origen", "Introducir el efectivo ilícito en el sistema financiero", "Reincorporar los fondos blanqueados a la economía formal", "Fraccionar depósitos para evadir el reporte de efectivo"], "a": 0, "e": "Colocación, estratificación e integración."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "mc", "q": "Una casa de empeño y una joyería preguntan si tienen deberes de prevención. Lo correcto es:", "o": ["Sí: el comercio de metales y piedras preciosas es sector alcanzado", "No: solamente las instituciones financieras están alcanzadas", "Sí, pero solo si operan con clientes extranjeros", "No, salvo que superen cierto patrimonio"], "a": 0, "e": "Figura entre las actividades sensibles."}, {"t": "mc", "q": "La incautación preventiva de un bien durante la investigación tiene como fin:", "o": ["Evitar que desaparezca antes de la decisión final", "Transferirlo de inmediato al Estado", "Garantizar el pago de las costas", "Compensar a las víctimas de forma anticipada"], "a": 0, "e": "Medida cautelar, no definitiva."}, {"t": "mc", "q": "Los casinos y salas de bingo en Venezuela son supervisados en esta materia por:", "o": ["La Comisión Nacional de Casinos, Salas de Bingo y Máquinas Traganíqueles", "La Superintendencia de Bancos", "El Ministerio de Turismo", "La Superintendencia Nacional de Valores y sus intendencias"], "a": 0, "e": "Es el órgano de control del sector de juegos."}, {"t": "vf", "q": "Según la LOCDOFT, un sujeto obligado puede mantener cuentas anónimas o con nombres ficticios si el cliente es de riesgo bajo.", "a": false, "e": "Están prohibidas sin excepción por nivel de riesgo."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las tarifas de servicios", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "Un cliente pide que no se registre su operación «porque es un favor personal». El empleado debe:", "o": ["Negarse: todo debe quedar registrado", "Aceptar si el monto es reducido", "Consultarlo con el área comercial", "Registrarlo a nombre de otro cliente"], "a": 0, "e": "No hay operaciones fuera de registro."}, {"t": "mc", "q": "La LOCDOFT castiga con más pena al legitimador que al directivo negligente porque:", "o": ["Uno actúa con dolo y el otro por falta de cuidado", "Uno es funcionario y el otro particular", "Uno es reincidente y el otro primario", "Uno es una persona natural y el otro una persona jurídica"], "a": 0, "e": "La diferencia es el elemento subjetivo del tipo."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "mc", "q": "Un sujeto obligado dice cumplir porque «tiene manual», pero un supervisor comprueba que nadie lo aplica. El concepto afectado es:", "o": ["La efectividad del sistema y no solo el cumplimiento técnico", "La prescripción de la acción administrativa del supervisor", "La proporcionalidad de las sanciones aplicables al sujeto", "La doble incriminación en la cooperación internacional"], "a": 0, "e": "El GAFI evalúa cumplimiento técnico y efectividad."}, {"t": "mc", "q": "El sector turismo cuenta con un regulador propio en esta materia, que es:", "o": ["El Ministerio del Poder Popular para el Turismo", "La Superintendencia de la Actividad Aseguradora", "La Comisión Nacional de Casinos", "La Superintendencia de Valores"], "a": 0, "e": "El ministerio del sector ejerce la supervisión."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Un oficial de cumplimiento pregunta qué órgano lleva el Registro Único de Facilitadores que acredita a quienes dictan la capacitación. Es:", "o": ["La ONCDOFT", "La UNIF", "SUDEASEG", "El Ministerio de Educación"], "a": 0, "e": "El RUF lo lleva el órgano rector; la norma sectorial exige facilitadores inscritos allí."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el registro unificado de sujetos obligados se identifica como:", "o": ["RUSO-ONCDOFT", "RUAP-ONCDOFT", "RIF-ONCDOFT", "SIAR-ONCDOFT"], "a": 0, "e": "G.O. 42.118. El RUAP es el registro de actuación de los contadores."}, {"t": "mc", "q": "Un Oficial de Cumplimiento duda de reportar «porque no está 100% seguro» de que la operación sea delictiva. El criterio correcto es:", "o": ["Reportar ante sospecha razonable: la certeza es de la justicia", "Esperar pruebas documentales del origen ilícito de los fondos", "Consultar al cliente para descartar la sospecha que existe", "Esperar al próximo ciclo de monitoreo para confirmarla"], "a": 0, "e": "El estándar es de sospecha, no de prueba."}, {"t": "mc", "q": "La exigencia de que la Junta Directiva apruebe las políticas y asuma el compromiso institucional se explica porque:", "o": ["La cultura de cumplimiento depende de la alta dirección", "La Junta ejecuta las operaciones de control diarias", "La Junta sustituye al Oficial de Cumplimiento ante SUDEASEG", "La ley exige que la Junta firme cada ROS"], "a": 0, "e": "El ejemplo y los recursos vienen de arriba."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si debe reportar operaciones de sus intermediarios. Lo correcto es:", "o": ["Sí: la conducta del intermediario forma parte de su riesgo", "No: el intermediario reporta por su cuenta", "Solo cuando el intermediario sea una persona jurídica", "Solo si lo pide la superintendencia"], "a": 0, "e": "El sujeto obligado responde por su canal."}, {"t": "mc", "q": "Las sanciones a las personas jurídicas de la LOCDOFT buscan:", "o": ["Evitar que la estructura societaria sirva de escudo", "Sustituir la pena que corresponde a las personas naturales", "Recaudar fondos para el órgano rector", "Castigar a los accionistas minoritarios"], "a": 0, "e": "Responsabilidad propia de la persona jurídica."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Un abogado asesora un divorcio; otro constituye sociedades y administra fondos de su cliente. Según la LOCDOFT, es sujeto obligado:", "o": ["Solo el segundo, por realizar actividades de riesgo definidas en la ley", "Ambos, porque la profesión de abogado es de por sí sujeto obligado", "Solo el primero, porque maneja información sensible del cliente", "Ninguno, porque los abogados están protegidos por el secreto profesional"], "a": 0, "e": "Las profesiones liberales son sujetos obligados únicamente cuando realizan las transacciones que la ley enumera."}, {"t": "mc", "q": "Varios familiares viajan juntos y cada uno lleva US$9.500. La señal de alerta que se presenta es:", "o": ["Posible fraccionamiento para evadir la declaración", "Viaje familiar sin ninguna relevancia para la ley", "Operación de riesgo bajo por estar por debajo del umbral", "Prueba de que los viajeros son personas expuestas políticamente"], "a": 0, "e": "Se vigila el propósito de evitar la ocultación."}, {"t": "mc", "q": "Desde la lógica de la LOCDOFT y del GAFI, una ONG que envía fondos al exterior debe ser tratada:", "o": ["Con atención proporcional a su riesgo, sin presumir ilicitud", "Como presunto vehículo de financiamiento y sujeta a rechazo", "Como cliente exento, por no tener fines de lucro", "Como cliente de riesgo alto automáticamente en todos los casos"], "a": 0, "e": "La vulnerabilidad de las OSFL exige un enfoque basado en riesgo, no prohibitivo."}, {"t": "vf", "q": "Una donación pequeña de fuente lícita puede estar vinculada al financiamiento del terrorismo.", "a": true, "e": "Por eso el FT no se detecta solo por monto u origen."}, {"t": "mc", "q": "En Venezuela, el documento que fija prioridades y metas del Estado en la materia por varios años se conoce como:", "o": ["Plan Nacional contra la LC/FT/FPADM", "Informe de evaluación mutua", "Autoevaluación de riesgo sectorial", "Manual de políticas del sujeto obligado"], "a": 0, "e": "El plan nacional articula la respuesta del Estado."}, {"t": "mc", "q": "La figura del «órgano rector» en la LOCDOFT existe para:", "o": ["Coordinar la política nacional contra estos delitos", "Centralizar los reportes de operaciones sospechosas", "Sustituir a las superintendencias sectoriales", "Dictar sentencias contra personas jurídicas"], "a": 0, "e": "Rectoría, coordinación, registro y lineamientos."}, {"t": "mc", "q": "Una guía o lineamiento emitido por el supervisor, frente a la norma, tiene valor de:", "o": ["Criterio de interpretación y buena práctica", "Norma de rango superior a la providencia", "Documento sin ninguna relevancia", "Sustituto de la autoevaluación de riesgo"], "a": 0, "e": "Las guías orientan la aplicación."}, {"t": "mc", "q": "Un auditor externo pide acceso a los ROS enviados a la UNIF. Lo procedente es:", "o": ["Negarlo: por confidencialidad no accede a esos casos", "Entregarlos con autorización de la Junta Directiva", "Entregarlos con copia a SUDEASEG", "Entregarlos con datos de clientes sustituidos por códigos"], "a": 0, "e": "La reserva protege las investigaciones."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Una sucursal en un país cuya ley impide aplicar los controles de la LOCDOFT debe:", "o": ["Aplicar el estándar más alto e informar al órgano de control", "Aplicar el estándar local para no violar la ley extranjera", "Aplicar el estándar más bajo para evitar un conflicto legal", "Suspender la sucursal hasta que la ley extranjera cambie"], "a": 0, "e": "La sucursal no puede ser un vacío normativo."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "mc", "q": "Un bien incautado preventivamente permanece sin reclamo y sin titular identificado. Según la LOCDOFT, tras el plazo legal:", "o": ["El fiscal solicita el decomiso tras notificar por cartel", "El bien se devuelve al último poseedor que fue conocido", "La ONCDOFT lo subasta directamente sin intervención judicial", "La incautación caduca y el bien queda libre para su dueño"], "a": 0, "e": "El procedimiento con cartel garantiza el derecho de los interesados."}, {"t": "vf", "q": "Reportar de forma defensiva sin análisis, en exceso, es deseable porque nunca perjudica.", "a": false, "e": "Satura a la UIF y reduce la calidad de la inteligencia."}, {"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "mc", "q": "La imprescriptibilidad de la acción penal en la LOCDOFT significa que:", "o": ["El Estado puede perseguir el delito sin límite de tiempo", "La pena nunca se extingue ni con la muerte", "Los bienes que fueron decomisados no se devuelven jamás", "El proceso penal no puede sobreseerse"], "a": 0, "e": "Afecta a la acción penal, no a otras instituciones."}, {"t": "mc", "q": "El decomiso de bienes en la LOCDOFT se distingue de la multa en que el decomiso:", "o": ["Recae sobre bienes vinculados al delito", "Se paga en unidades tributarias", "Lo impone el órgano de control", "Se aplica solo a personas naturales"], "a": 0, "e": "Multa es sanción pecuniaria; decomiso recae sobre el producto o instrumento."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Respecto del concepto de «delito grave», la LOCDOFT y la Convención de Palermo difieren en que:", "o": ["Palermo: pena máxima de 4 años; LOCDOFT: más de 5 años", "Palermo usa cinco años; la LOCDOFT usa cuatro", "Palermo exige diez años; la LOCDOFT no define el concepto", "Ambos usan cuatro años pero difieren en el tipo de delito"], "a": 0, "e": "Trampa clásica de comparación."}, {"t": "mc", "q": "Una Junta Directiva dice que el Oficial de Cumplimiento solo reportará a la UNIF si ella lo autoriza. Esto:", "o": ["Vulnera la independencia: la Junta no puede vetar un ROS", "Es válido como parte del control interno de los reportes", "Es válido si cuenta con la aprobación previa de SUDEASEG", "Es válido solo para los reportes de monto poco elevado"], "a": 0, "e": "Derecho-deber de reportar sin veto."}, {"t": "mc", "q": "Un sujeto obligado pregunta si puede aplicar la norma de otro sector por ser más clara. Lo correcto es:", "o": ["Debe aplicar la de su sector y puede tomar la otra como referencia", "Puede sustituirla libremente cuando la otra sea más exigente", "Debe aplicar siempre la del sector bancario", "Puede elegir la que prefiera cada año"], "a": 0, "e": "La norma propia es obligatoria; otras sirven de buena práctica."}, {"t": "vf", "q": "Según la LOCDOFT, ser PEP implica por sí mismo que el cliente debe ser rechazado.", "a": false, "e": "La condición de PEP eleva el riesgo y exige medidas reforzadas; no implica ilicitud ni rechazo automático."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "vf", "q": "La acción penal de los delitos previstos en la LOCDOFT no prescribe.", "a": true, "e": "Característica reforzada del régimen."}, {"t": "mc", "q": "Para la LOCDOFT, que una conducta sea delito en otro país pero no en Venezuela afecta sobre todo:", "o": ["La cooperación internacional y el decomiso solicitado", "La validez del contrato de servicios", "El plazo de conservación de los registros y soportes", "La obligación de identificar al cliente"], "a": 0, "e": "Es el problema de la doble incriminación."}, {"t": "mc", "q": "La LOCDOFT sanciona a directivos y empleados que favorecen el lavado por imprudencia o negligencia, sin haber participado. La razón de política criminal es:", "o": ["Incentivar controles efectivos y deber de cuidado", "Presumir que todo empleado conoce el origen ilícito de los fondos", "Sustituir la responsabilidad de la persona jurídica", "Equiparar la culpa con el dolo para efectos de la pena"], "a": 0, "e": "La responsabilidad por culpa busca controles reales."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la tarifa se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "Según la LOCDOFT, el traslado de efectivo por frontera se controla mediante:", "o": ["Una declaración obligatoria por encima de un umbral", "Una autorización previa otorgada por el órgano rector", "Una prohibición total de llevar efectivo", "Un impuesto a la salida de divisas"], "a": 0, "e": "Declaración, no prohibición."}, {"t": "vf", "q": "Una política escrita pero sin recursos, capacitación ni seguimiento cumple formalmente pero falla en lo sustantivo.", "a": true, "e": "Los reguladores evalúan efectividad."}, {"t": "mc", "q": "La razón por la que los notarios y registradores figuran como sujetos obligados es que:", "o": ["Intervienen en actos que transfieren bienes de alto valor", "Reciben pagos en efectivo de parte de sus usuarios", "Dependen del Ministerio de Justicia", "Emiten documentos con fe pública"], "a": 0, "e": "El traspaso de inmuebles y sociedades es vía típica de integración."}]}]}, {"titulo": "Normativa internacional: las 40 Recomendaciones del GAFI", "exams": [{"titulo": "Normativa internacional · modelo 1", "q": [{"t": "mc", "q": "La Recomendación 33 exige a los países mantener:", "o": ["Estadísticas sobre la efectividad de su sistema", "Un registro de todas las operaciones en efectivo", "Un listado público de personas sancionadas", "Una base de datos de clientes de alto riesgo"], "a": 0, "e": "Reportes, investigaciones, condenas y decomisos."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes", "Juzga a los sujetos obligados que hayan incumplido", "Representa al Estado ante los tribunales"], "a": 0, "e": "Separación de funciones."}, {"t": "mc", "q": "Un compañero afirma que el Oficial de Cumplimiento es responsable penal de todo incumplimiento de la empresa. ¿Qué matiz debe hacerse?", "o": ["Depende de su conducta; la alta dirección también responde", "Es siempre el único responsable de los incumplimientos", "No tiene ninguna responsabilidad por ser asesor", "Solo responde si es abogado colegiado"], "a": 0, "e": "Responsabilidad compartida según roles."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "La experiencia de una evaluación mutua con resultados deficientes puede llevar a:", "o": ["Seguimiento reforzado y costos reputacionales", "Condena penal contra los directivos de las instituciones", "Desaparición del país como miembro del grupo", "Ninguna consecuencia práctica para el país"], "a": 0, "e": "Presión entre pares y consecuencias reales."}, {"t": "mc", "q": "La Recomendación 12 ordena medidas adicionales respecto de:", "o": ["Personas expuestas políticamente", "Bancos corresponsales extranjeros", "Transferencias electrónicas", "Activos virtuales"], "a": 0, "e": "PEP nacionales, extranjeros y de organismos internacionales."}, {"t": "mc", "q": "La Recomendación 15 aborda:", "o": ["Nuevas tecnologías y activos virtuales", "Controles internos de las instituciones", "Países de mayor riesgo", "Estadísticas nacionales"], "a": 0, "e": "Exige evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "El GAFI recomienda que las sanciones financieras dirigidas se apliquen:", "o": ["Sin demora, apenas se produce la designación", "Tras una decisión judicial en cada caso", "Al cierre del ejercicio contable siguiente", "Solo si el designado es residente del país"], "a": 0, "e": "La inmediatez es esencial para que sirvan."}, {"t": "mc", "q": "¿Qué relación tiene el decomiso con la prevención del delito?", "o": ["Priva a las organizaciones de su lucro", "No tiene relación con la prevención", "Genera más delito al redistribuir bienes", "Es solo una medida de recaudación"], "a": 0, "e": "R.4."}, {"t": "mc", "q": "La Recomendación 19 se refiere a:", "o": ["Países de mayor riesgo identificados por el GAFI", "Organizaciones sin fines de lucro", "El beneficiario final de las personas jurídicas", "Protección de los denunciantes"], "a": 0, "e": "Contramedidas proporcionales al riesgo del país."}, {"t": "mc", "q": "Un grupo financiero debe compartir información entre sus miembros para prevención. El estándar lo:", "o": ["Permite y lo exige con salvaguardas de confidencialidad", "Prohíbe por razones de protección de datos", "Permite solo entre entidades ubicadas en el mismo país", "Exige únicamente si lo pide el supervisor"], "a": 0, "e": "Políticas a nivel de grupo."}, {"t": "mc", "q": "Venezuela participa en el sistema a través del organismo regional:", "o": ["GAFIC, el Grupo de Acción Financiera del Caribe", "GAFILAT, el de América Latina", "APG, el de Asia y el Pacífico", "MONEYVAL, el organismo del Consejo de Europa"], "a": 0, "e": "Es una confusión muy frecuente."}, {"t": "mc", "q": "La Recomendación 8 se ocupa de un sector concreto, que es:", "o": ["Las organizaciones sin fines de lucro", "Los casinos y los juegos de azar en línea", "Los agentes inmobiliarios", "Las cooperativas de ahorro"], "a": 0, "e": "Protegerlas del abuso para financiamiento del terrorismo."}, {"t": "mc", "q": "Una UIF puede ser, según los modelos reconocidos internacionalmente:", "o": ["Administrativa, policial, judicial o mixta", "Únicamente administrativa y autónoma", "Siempre parte del banco s o recomendaciones para corregir irregularidades", "Sentencias penales por los delitos que detecte la inspección", "Nombramientos directos de los miembros de los dos consejos", "Decisiones sobre los salarios fijados por el empleador"], "a": 0, "e": "Art. 7.11."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la cartelera informativa debe contener, entre otros:", "o": ["La constancia de registro vigente del Responsable", "Los nombres de los asociados reportados a la UNIF", "Los saldos individuales de cada uno de los socios", "Las contraseñas de acceso al sistema SIGECAF"], "a": 0, "e": "Punto octavo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la atención especial sobre nuevas tecnologías se justifica cuando estas:", "o": ["Dificultan la verificación de la identidad del asociado", "Facilitan la impresión de documentos en la oficina", "Permiten atender a los socios con mejor cortesía", "Reducen el costo del papel utilizado en la caja"], "a": 0, "e": "Art. 43."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, los fondos de fuente legal requieren indagar con mayor minuciosidad para determinar si pueden financiar terrorismo.", "a": true, "e": "Art. 45.4."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la constancia de registro es requisito indispensable para gestionar:", "o": ["Certificaciones de solvencia y autorizaciones de inversión", "Tarjetas de crédito personales de cada uno de los socios", "Licencias de conducir para los miembros de los consejos", "Permisos de construcción de las viviendas de los socios"], "a": 0, "e": "Punto séptimo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, iniciar, sustanciar y decidir los procedimientos por incumplimiento corresponde a:", "o": ["La División de Inspección y Prevención", "La asamblea ordinaria de los asociados", "El Consejo de Vigilancia de la caja", "El empleador de los asociados"], "a": 0, "e": "Art. 7.12."}, {"t": "mc", "q": "Seg aborda de forma específica la recuperación y restitución de activos producto de corrupción?", "o": ["La Convención de Mérida", "La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo"], "a": 0, "e": "Capítulo V de Mérida."}, {"t": "mc", "q": "El principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Comparando Palermo con la LOCDOFT en el concepto de delito grave:", "o": ["Palermo usa cuatro años y la ley venezolana más de cinco", "Ambas usan exactamente cuatro años de pena", "Palermo usa cinco años y la ley venezolana cuatro años", "La ley venezolana no define el concepto"], "a": 0, "e": "Es una de las trampas más repetidas."}, {"t": "mc", "q": "El objeto declarado de la Convención de Palermo es:", "o": ["Promover la cooperación para prevenir y combatir el crimen organizado", "Unificar los códigos penales de todos los Estados parte del tratado", "Crear un tribunal penal internacional del crimen", "Regular la extradición de nacionales"], "a": 0, "e": "Artículo 1 de la Convención."}, {"t": "mc", "q": "El Convenio de 1999 pide a los Estados medidas para que las instituciones financieras:", "o": ["Identifiquen clientes y reporten sospechas", "Cierren cuentas de todas las ONG", "Reduzcan montos máximos de transferencia", "Eviten operar con efectivo"], "a": 0, "e": "Art. 18: medidas preventivas de identificación y reporte."}, {"t": "mc", "q": "Ordenados cronológicamente, los instrumentos son:", "o": ["Viena 1988, Interamericana 1996, FT 1999, Palermo 2000, Mérida 2003", "Interamericana 1996, Viena 1988, Palermo 2000, FT 1999, Mérida 2003", "Viena 1988, Palermo 2000, Interamericana 1996, Mérida 2003, FT 1999", "FT 1999, Viena 1988, Interamericana 1996, Mérida 2003, Palermo 2000"], "a": 0, "e": "El orden cronológico es una pregunta trampa habitual."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "Siempre involucra menores de edad", "Solo se aplica a fronteras marítimas", "Exige la participación de al menos un funcionario público"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "mc", "q": "En Mérida, la recuperación de activos se considera:", "o": ["Un principio fundamental de la Convención", "Una opción solo a pedido de partes privadas", "Un tema reservado a la Convención de Palermo", "Una medida solo de carácter administrativo"], "a": 0, "e": "Capítulo V; art. 51: los Estados cooperarán y se prestarán asistencia en esta materia."}, {"t": "mc", "q": "Según Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "Las resoluciones del Consejo de Seguridad sobre proliferación se vinculan en el estándar con:", "o": ["La Recomendación 7 del GAFI", "La Recomendación 8 del GAFI", "La Convención de Palermo", "La Convención de Mérida"], "a": 0, "e": "Sanciones dirigidas sobre financiamiento de la proliferación."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "mc", "q": "El artículo 5 de Mérida pide a los Estados:", "o": ["Políticas y prácticas coordinadas de prevención de la corrupción", "Tipificar el soborno transnacional de funcionarios", "Crear un tribunal anticorrupción", "Prohibir las donaciones políticas"], "a": 0, "e": "Abre el capítulo preventivo."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}]}, {"titulo": "Convenios internacionales · modelo 3", "q": [{"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "Solo el Convenio de Financiación del Terrorismo", "Solo la Convención de Viena de 1988", "Solo la Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "El protocolo de Palermo sobre trata de personas se conoce como:", "o": ["Protocolo de Palermo contra la trata, en especial de mujeres y niños", "Protocolo de Nueva York sobre el trabajo forzoso y la servidumbre", "Protocolo adicional sobre explotación laboral", "Protocolo de Ginebra sobre migración"], "a": 0, "e": "Es el primer instrumento universal con definición de trata."}, {"t": "vf", "q": "Según el Convenio de 1999, no es necesario que los fondos se hayan utilizado efectivamente para que exista delito.", "a": true, "e": "La consumación es anticipada."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "mc", "q": "Si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "La Convención de Viena de 1988 es la Convención de las Naciones Unidas contra:", "o": ["Tráfico ilícito de estupefacientes y sicotrópicos", "La delincuencia organizada transnacional y sus protocolos", "La corrupción y la recuperación de activos", "El terrorismo y su financiamiento"], "a": 0, "e": "Es el origen del régimen internacional contra el lavado de activos."}, {"t": "mc", "q": "Del siguiente grupo, el instrumento que NO pertenece al sistema universal de la ONU es:", "o": ["La Convención Interamericana contra la Corrupción", "La Convención de Palermo", "La Convención de Mérida", "El Convenio para la Represión de la Financiación del Terrorismo"], "a": 0, "e": "La Interamericana es de la OEA."}, {"t": "mc", "q": "¿Qué busca Palermo con las normas sobre decomiso e incautación del producto del delito?", "o": ["Quitar a la organización sus ganancias y capacidad", "Sustituir las penas privativas de libertad", "Financiar a los órganos judiciales de cada país", "Evitar procesos penales largos"], "a": 0, "e": "Arts. 12 y 13: decomiso interno y cooperación internacional para decomisar."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "Del siguiente grupo, el que NO trata de corrupción es:", "o": ["La Convención de Viena de 1988", "La Convención de Mérida", "La Convención Interamericana de 1996", "El capítulo II de la UNCAC"], "a": 0, "e": "Viena 1988 es de estupefacientes."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo decl
