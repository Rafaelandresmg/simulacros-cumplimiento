n lugar de la ley", "Queda sujeta a la jurisdicción de la ONU", "Debe remitir sus reportes también a las Naciones Unidas"], "a": 0, "e": "El tratado se proyecta a través del derecho interno."}, {"t": "mc", "q": "¿Cuál de estas obligaciones de Palermo se relaciona directamente con el lavado de activos?", "o": ["Tipificar el blanqueo del producto del delito", "Crear tribunales especializados en cada país", "Prohibir el uso de efectivo internacional", "Crear una policía regional común"], "a": 0, "e": "Art. 6 de Palermo: penalizar el blanqueo; art. 7: medidas de prevención y regulación."}, {"t": "vf", "q": "Según la Convención de Palermo, el grupo estructurado requiere funciones formalmente definidas y continuidad de sus miembros.", "a": false, "e": "Art. 2, literal c: no las requiere. Trampa: se añaden requisitos."}, {"t": "vf", "q": "Según la Convención de Mérida, los Estados considerarán el decomiso sin condena cuando el autor no pueda ser enjuiciado por muerte, fuga o ausencia.", "a": true, "e": "Art. 54, párrafo 1, literal c. Trampa: se cree que el tratado exige siempre sentencia condenatoria."}, {"t": "mc", "q": "Según los datos del Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), su entrada en vigor ocurrió en:", "o": ["2002", "1999", "2001", "2003"], "a": 0, "e": "Trampa: 1999 es la adopción; 2001, los atentados que aceleraron su ratificación."}, {"t": "mc", "q": "El soborno de funcionarios públicos extranjeros está previsto en Mérida porque:", "o": ["La corrupción transnacional distorsiona el comercio mundial", "Los funcionarios extranjeros no gozan de inmunidad diplomática", "Solo así puede haber extradición", "Lo exige la Organización Mundial del Comercio"], "a": 0, "e": "Artículo 16 de la Convención."}, {"t": "mc", "q": "Según la Convención de Palermo, la disposición del producto decomisado se rige, en primer término, por:", "o": ["El derecho interno del Estado que decomisa", "El acuerdo de reparto por mitades entre Estados", "La decisión del Estado que pidió el decomiso", "Las reglas del fondo de las Naciones Unidas"], "a": 0, "e": "Art. 14, párrafo 1. Trampa: la devolución al requirente es una consideración prioritaria, no la regla base."}, {"t": "mc", "q": "Según la Convención de Mérida, cuando lo decomisado proviene de malversación de fondos públicos, el Estado requerido debe:", "o": ["Restituirlo al Estado parte requirente", "Repartirlo por mitades con el requirente", "Destinarlo a un fondo de las Naciones Unidas", "Conservarlo y compensar sus propios gastos"], "a": 0, "e": "Art. 57, párrafo 3, literal a. Trampa: el reparto es propio de otros convenios."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "La Convención de Mérida pide a los Estados prever medidas de protección para:", "o": ["Testigos, peritos y denunciantes", "Solo los funcionarios investigados", "Los bienes decomisados", "Los registros electrónicos de cuentas"], "a": 0, "e": "Arts. 32 y 33 sobre protección de testigos y de denunciantes."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), la responsabilidad de las personas jurídicas debe ser necesariamente penal.", "a": false, "e": "Art. 5: penal, civil o administrativa. Trampa: se cierra la alternativa."}, {"t": "mc", "q": "Un oficial de cumplimiento invoca la Convención de Palermo para exigir un recaudo a un cliente. Lo correcto es que:", "o": ["El fundamento inmediato es la ley y la norma sectorial", "El tratado se aplica directamente al cliente", "El cliente puede invocar el tratado en su contra", "El tratado deroga la norma sectorial"], "a": 0, "e": "Los tratados obligan al Estado; al cliente lo obliga la norma interna."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "vf", "q": "Según la Convención de Mérida, para que haya delito de corrupción es necesario que se cause daño patrimonial al Estado.", "a": false, "e": "Art. 3, párrafo 2. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), la tentativa de proveer o recolectar fondos:", "o": ["También constituye delito", "Solo es punible si hubo atentado", "Queda a criterio de cada Estado", "No está prevista en el texto"], "a": 0, "e": "Art. 2, párrafo 4. Trampa: se confunde con que los fondos no necesitan usarse."}, {"t": "vf", "q": "Según la Convención de Mérida, el plazo de prescripción de los delitos de corrupción debe ser amplio y poder suspenderse si el imputado elude la justicia.", "a": true, "e": "Art. 29. Trampa: se cree que el tratado no se ocupa de la prescripción."}, {"t": "mc", "q": "Mérida exige la existencia de un órgano u órganos encargados de:", "o": ["Prevenir la corrupción y aplicar las políticas", "Juzgar a los funcionarios acusados", "Administrar los bienes que hayan sido decomisados", "Representar al Estado ante la ONU"], "a": 0, "e": "Artículo 6: órgano de prevención con independencia."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito con pena máxima de cuatro años es grave, a diferencia de la LOCDOFT, que exige:", "o": ["Más de cinco años de pena", "Más de seis años de pena", "Al menos tres años de pena", "Igualmente cuatro años"], "a": 0, "e": "Art. 2 de Palermo y art. 4, numeral 10, de la LOCDOFT."}, {"t": "mc", "q": "Según la Convención de Palermo, la función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Art. 18, párrafo 13. Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "Según los Protocolos de la Convención de Palermo sobre trata de personas y tráfico ilícito de migrantes, el protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "El migrante no consiente y la finalidad es el cruce de frontera", "La trata exige cruzar una frontera y el tráfico de migrantes no", "El tráfico de migrantes protege a la persona y la trata al Estado"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "vf", "q": "Según la Convención de Palermo, la falta de doble incriminación obliga al Estado requerido a negar la asistencia judicial.", "a": false, "e": "Art. 18, párrafo 9: puede negarla, pero también puede prestarla. Trampa: la facultad se vuelve obligación."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "Según la Convención de Mérida, la cooperación entre los organismos nacionales de investigación y el sector privado se regula en su artículo:", "o": ["39", "38", "12", "14"], "a": 0, "e": "El 38 trata la cooperación entre organismos nacionales; el 12, el sector privado en la prevención; el 14, las medidas contra el blanqueo."}, {"t": "mc", "q": "El Convenio de 1999 dispone que estos delitos, para efectos de extradición:", "o": ["No se considerarán delitos políticos", "Se considerarán delitos políticos conexos", "No se considerarán delitos comunes", "Se considerarán delitos de orden militar"], "a": 0, "e": "Artículo 14: cláusula de despolitización."}, {"t": "mc", "q": "Según la Convención de Palermo, los delitos determinantes del blanqueo deben incluir, además de los delitos graves, los de sus artículos:", "o": ["5, 8 y 23", "5, 6 y 7", "8, 12 y 16", "6, 18 y 20"], "a": 0, "e": "Art. 6, párrafo 2, literal b: participación en grupo, corrupción y obstrucción de la justicia."}, {"t": "mc", "q": "Los capítulos centrales de la Convención de Mérida abarcan:", "o": ["Prevención, penalización, cooperación y recuperación de activos", "Penalización, extradición y asistencia técnica únicamente", "Prevención en el sector público y sanciones administrativas", "Cooperación entre unidades de inteligencia y extradición"], "a": 0, "e": "Estructura característica del tratado."}, {"t": "mc", "q": "Palermo permite, respecto de la carga de la prueba en el decomiso, que los Estados:", "o": ["Consideren exigir al imputado demostrar el origen lícito", "Deban invertir la carga de la prueba en estos delitos", "Presuman ilícito todo bien de un condenado por delito grave", "Trasladen la prueba del origen al Estado requirente"], "a": 0, "e": "Es una posibilidad que la Convención invita a considerar."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "vf", "q": "Según la Convención de Mérida, el abuso de funciones es una figura que cada Estado considerará tipificar.", "a": true, "e": "Art. 19. Trampa: se cree que todas las figuras del capítulo III son obligatorias."}, {"t": "mc", "q": "Según la Convención de Palermo, el protocolo adoptado en 2001, un año después de la Convención, es el de:", "o": ["Armas de fuego", "Trata de personas", "Tráfico de migrantes", "Bienes culturales"], "a": 0, "e": "Trampa: los de trata y de migrantes se adoptaron junto con la Convención, en 2000."}, {"t": "mc", "q": "Una red de tres personas opera en Venezuela y mueve fondos hacia otro país para delitos graves con fines de lucro. ¿Qué tratado se aplica con mayor propiedad?", "o": ["Convención de Palermo", "Convención de Viena", "Convención de Mérida", "Convenio de Financiación del Terrorismo"], "a": 0, "e": "Palermo trata la delincuencia organizada transnacional y el blanqueo del producto del delito."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "mc", "q": "La participación de la sociedad en la lucha contra la corrupción, según Mérida, implica:", "o": ["Acceso a la información y protección de quien denuncia", "El derecho a juzgar directamente a los funcionarios", "La elección popular de los fiscales", "La fiscalización privada de los tribunales"], "a": 0, "e": "Artículo 13."}, {"t": "vf", "q": "Para que se configure el delito de financiación del terrorismo del Convenio de 1999 es necesario que los fondos se hayan utilizado efectivamente en un acto terrorista.", "a": false, "e": "No es necesario: basta proveer o recolectar los fondos con esa intención o conocimiento."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional se regula en su artículo:", "o": ["VIII", "IX", "VI", "XI"], "a": 0, "e": "Art. VIII."}, {"t": "vf", "q": "Según la Convención de Palermo, la Convención se aplica al blanqueo transnacional aunque no intervenga un grupo delictivo organizado.", "a": false, "e": "Art. 3: delitos transnacionales que entrañen la participación de un grupo. Trampa: distinto es el tipo penal interno, que no exige grupo."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "mc", "q": "¿Cuál combinación de instrumentos permite fundamentar la tipificación del lavado de activos de delitos graves y su cooperación internacional?", "o": ["Palermo y las Recomendaciones 3 y 36 a 40 del GAFI", "El Convenio de 1999 y la Recomendación 5 del GAFI", "La Convención Interamericana y la Recomendación 12", "Viena y las normas de la Unión Europea"], "a": 0, "e": "El tratado obliga jurídicamente; las Recomendaciones detallan la implementación."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), las medidas de identificación de clientes y reporte para el sector financiero están en su artículo:", "o": ["18", "2", "8", "12"], "a": 0, "e": "El 8 trata identificación y congelamiento de fondos; el 12, asistencia."}, {"t": "vf", "q": "Según la Convención de Viena de 1988, el conocimiento y la intención exigidos por los delitos pueden inferirse de las circunstancias objetivas del caso.", "a": true, "e": "Art. 3, párrafo 3. Trampa: se cree que hace falta prueba directa."}, {"t": "mc", "q": "Mérida dedica un artículo específico al sector privado para:", "o": ["Promover normas contables y de auditoría y códigos de conducta", "Prohibir las donaciones económicas entre empresas privadas", "Imponer un impuesto anticorrupción", "Nacionalizar sectores estratégicos"], "a": 0, "e": "Artículo 12."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el Estado requerido no puede negar la asistencia amparándose en:", "o": ["El secreto bancario", "La doble incriminación", "Su propio orden público", "La cosa juzgada"], "a": 0, "e": "Art. XVI. Trampa: las otras causales no están excluidas por ese artículo."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Su escrutinio intensificado por la institución", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "vf", "q": "La Convención de Mérida regula únicamente medidas penales y no incluye prevención.", "a": false, "e": "Incluye un capítulo completo de medidas preventivas (políticas, órganos, sector público, sector privado, sociedad y lavado)."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Mérida contempla, respecto de las consecuencias de los actos de corrupción:", "o": ["Anular contratos o revocar concesiones obtenidas con corrupción", "Indemnizar automáticamente a los competidores", "Nacionalizar a la empresa involucrada", "Prohibir de por vida toda contratación con el sector público"], "a": 0, "e": "Artículo 34."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Según la Convención de Palermo, si la conducta investigada solo es delito en Venezuela pero no en el país que recibe una solicitud de asistencia, un obstáculo común es la falta de:", "o": ["Doble incriminación", "Reciprocidad fiscal", "Extraterritorialidad", "Prescripción"], "a": 0, "e": "Art. 18, párrafo 9. La doble incriminación es condición habitual en cooperación; la LOCDOFT la exige para el decomiso a solicitud de otro Estado."}, {"t": "mc", "q": "Según la Convención de Palermo y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2000 y 2003", "2000 y 2001", "1999 y 2002", "2003 y 2005"], "a": 0, "e": "Trampa: 2003 y 2005 son las fechas de Mérida; 1999 y 2002, las del Convenio contra la financiación del terrorismo."}, {"t": "mc", "q": "Según la Convención de Mérida, el enriquecimiento ilícito se trata como una figura:", "o": ["Que cada Estado considerará tipificar", "De tipificación obligatoria y sin reserva", "Prohibida por la presunción de inocencia", "Reservada a funcionarios internacionales"], "a": 0, "e": "Art. 20."}, {"t": "mc", "q": "Según la Convención de Palermo, para que exista grupo delictivo organizado debe perseguirse, directa o indirectamente:", "o": ["Un beneficio económico u otro de orden material", "Un fin político, religioso o ideológico declarado", "La comisión de delitos en más de un Estado", "El control territorial de alguna zona del país"], "a": 0, "e": "Art. 2, literal a."}, {"t": "vf", "q": "Según la Convención de Palermo, los Estados considerarán prever la mitigación de la pena o la inmunidad judicial para quien coopere de forma sustancial.", "a": true, "e": "Art. 26, párrafos 2 y 3. Trampa: se cree que el tratado no admite beneficios para los partícipes."}, {"t": "mc", "q": "Según la Convención de Mérida, el secreto bancario, como obstáculo a las investigaciones penales internas, se trata en su artículo:", "o": ["40", "31", "46", "52"], "a": 0, "e": "El 31 es decomiso; el 46, asistencia judicial; el 52, prevención de transferencias."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "El artículo 2 de Palermo define, entre otros conceptos:", "o": ["Grupo delictivo organizado, delito grave y producto del delito", "Terrorismo, corrupción, narcotráfico y contrabando de bienes", "Extradición, asilo, refugio y asistencia judicial recíproca", "Soberanía, jurisdicción, territorio y competencia penal"], "a": 0, "e": "Es el artículo de definiciones."}, {"t": "vf", "q": "Según la Convención de Palermo, un Estado puede excluir el autolavado si así lo exigen los principios fundamentales de su derecho interno.", "a": true, "e": "Art. 6, párrafo 2, literal e. Trampa: se cree que el autolavado debe castigarse siempre."}, {"t": "vf", "q": "Según la Convención de Mérida, la protección de los denunciantes es una medida de adopción obligatoria.", "a": false, "e": "Art. 33: cada Estado considerará incorporarla. La de testigos, peritos y víctimas del art. 32 sí es un deber, dentro de sus posibilidades."}, {"t": "mc", "q": "Un caso de un funcionario que recibe sobornos de una red transnacional y los invierte en inmuebles involucra, a la vez:", "o": ["Mérida, Palermo y el estándar antilavado", "El Convenio de Financiación del Terrorismo", "La Convención de Viena de 1988", "La Convención Interamericana de 1996"], "a": 0, "e": "Corrupción, crimen organizado y lavado se superponen."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "El artículo 7 de Palermo exige a los Estados establecer un régimen interno que incluya:", "o": ["Identificación del cliente, registros y reporte de sospechas", "Un impuesto especial sobre las transacciones financieras", "La prohibición de operaciones en efectivo", "Un registro público de todas las cuentas"], "a": 0, "e": "Es el germen convencional de las obligaciones preventivas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal (Nassau, 1992) se vincula con:", "o": ["La cooperación judicial entre Estados americanos", "El control de precursores químicos", "El decomiso del producto del terrorismo únicamente", "Los registros de armas de fuego"], "a": 0, "e": "Es un instrumento de la OEA sobre asistencia mutua."}, {"t": "mc", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), para que el hecho sea delito:", "o": ["No se requiere que los fondos se hayan usado", "Se requiere que el acto terrorista se consume", "Basta que los fondos sean de origen ilícito", "Es necesario que el autor integre la organización"], "a": 0, "e": "Art. 2, párrafo 3."}, {"t": "mc", "q": "Según la Convención de Mérida, de las siguientes figuras, es de tipificación obligatoria:", "o": ["La obstrucción de la justicia", "El enriquecimiento ilícito", "El tráfico de influencias", "El soborno en el sector privado"], "a": 0, "e": "Art. 25. Las otras tres son figuras que el Estado considerará tipificar: arts. 20, 18 y 21."}, {"t": "mc", "q": "Según la Convención Interamericana contra la Corrupción, el enriquecimiento ilícito se regula en su artículo:", "o": ["IX", "VI", "VIII", "XIV"], "a": 0, "e": "El VI son actos de corrupción; el VIII, soborno transnacional; el XIV, asistencia."}, {"t": "vf", "q": "Los convenios de esta materia promueven que los Estados consideren compartir los bienes decomisados con quienes cooperaron.", "a": true, "e": "Reparto de activos como incentivo a la cooperación."}, {"t": "mc", "q": "Los artículos 12 y 13 de Palermo tratan de:", "o": ["Decomiso interno y cooperación internacional para decomisar", "Extradición y traslado internacional de personas condenadas", "Protección de testigos y víctimas", "Técnicas especiales de investigación"], "a": 0, "e": "Decomiso nacional y su dimensión internacional."}, {"t": "vf", "q": "Palermo, Viena y Mérida son tratados universales de las Naciones Unidas; la Convención Interamericana contra la Corrupción es un tratado regional de la OEA.", "a": true, "e": "Distinción de ámbito: universal frente a regional."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "Un delito es «transnacional» para Palermo, entre otros supuestos, si:", "o": ["Se planifica sustancialmente en otro Estado", "Es cometido por un extranjero en cualquier lugar", "Afecta a una persona de otra nacionalidad", "Se comete con dinero depositado en un banco extranjero"], "a": 0, "e": "Art. 3: más de un Estado, preparación o dirección en otro, grupo con actividades en varios Estados, o efectos sustanciales en otro."}, {"t": "vf", "q": "Según la Convención de Mérida, el soborno pasivo del funcionario extranjero es de tipificación obligatoria, igual que el activo.", "a": false, "e": "Art. 16: el párrafo 1, activo, es obligatorio; el párrafo 2, pasivo, se considerará. Trampa: se iguala lo que el texto distingue."}, {"t": "mc", "q": "¿Cuál tratado es el más adecuado para analizar una organización de narcotraficantes que lava sus ganancias y corrompe a funcionarios?", "o": ["Palermo, con apoyo de Viena y Mérida", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción", "Las Recomendaciones del GAFI"], "a": 0, "e": "Combina crimen organizado, narcotráfico, lavado y corrupción."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, el control de las sustancias usadas con frecuencia para fabricar estupefacientes está en su artículo:", "o": ["12", "11", "17", "5"], "a": 0, "e": "El 11 es entrega vigilada; el 17, tráfico por mar; el 5, decomiso."}, {"t": "vf", "q": "Viena 1988 estableció que el secreto bancario no puede invocarse para negar la asistencia judicial en materia de decomiso.", "a": true, "e": "Principio que luego recogen Palermo, Mérida y el GAFI."}, {"t": "mc", "q": "Según la Convención de Palermo, la responsabilidad de las personas jurídicas puede ser:", "o": ["Penal, civil o administrativa, según cada Estado", "Exclusivamente penal en todos los Estados parte", "Exclusivamente civil en todos los Estados parte", "Solo aplicable a las entidades del sector bancario"], "a": 0, "e": "Art. 10."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "vf", "q": "La Convención de Palermo se aplica a cualquier delito de orden interno, aunque no tenga elemento transnacional.", "a": false, "e": "Se aplica a delitos de carácter transnacional en que intervenga un grupo delictivo organizado."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutarlo conforme al derecho interno del Estado requerido", "Aplicar directamente la ley del Estado que lo solicita", "Someter el caso a la Corte Internacional de Justicia", "Obtener antes el consentimiento expreso del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "Mérida obliga a penalizar el soborno de funcionarios públicos en su vertiente:", "o": ["Activa y pasiva, de quien ofrece y de quien acepta", "Activa, de quien ofrece el beneficio indebido", "Pasiva, de quien recibe el beneficio indebido", "Extranjera, cuando interviene otro Estado"], "a": 0, "e": "Ambas modalidades."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo de 2002 se adoptó en:", "o": ["Bridgetown, Barbados, en el marco de la OEA", "Caracas, en el marco de la OEA", "Nueva York, en el marco de las Naciones Unidas", "Viena, en el marco de la ONU"], "a": 0, "e": "Instrumento regional posterior a 2001."}, {"t": "vf", "q": "Un Estado puede ser parte de la Convención de Palermo sin haber ratificado todos sus protocolos.", "a": true, "e": "Los protocolos se ratifican por separado, pero requieren ser parte de la Convención."}, {"t": "mc", "q": "Cuando un país amplía su delito de lavado a todos los delitos graves y no solo al narcotráfico, ¿qué tratado sigue en esencia?", "o": ["La Convención de Palermo", "La Convención de Viena", "El Convenio de Financiación del Terrorismo", "La Convención Interamericana contra la Corrupción"], "a": 0, "e": "Palermo extendió el lavado a los productos de todos los delitos graves."}, {"t": "mc", "q": "La protección de testigos y peritos en Mérida tiene por fin:", "o": ["Evitar represalias para quienes aportan información", "Garantizar su remuneración por declarar", "Permitir declaraciones anónimas sin control judicial", "Eximirlos de responsabilidad penal"], "a": 0, "e": "Artículo 32."}, {"t": "vf", "q": "La Convención Interamericana contra la Corrupción fue el primer instrumento internacional en la materia, de ámbito regional.", "a": true, "e": "Antecede a la Convención de Mérida de la ONU."}, {"t": "vf", "q": "Según la Convención de Palermo, la asistencia judicial recíproca no puede negarse invocando el secreto bancario.", "a": true, "e": "Art. 18, párrafo 8. Trampa: se cree que el secreto bancario es una causal de denegación."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, el soborno transnacional y el enriquecimiento ilícito se tipifican con sujeción a la Constitución de cada Estado.", "a": true, "e": "Arts. VIII y IX. Trampa: se cree que son deberes sin reserva."}, {"t": "mc", "q": "Entre los protocolos que complementan la Convención de Palermo se encuentra el de:", "o": ["Trata de personas, especialmente mujeres y niños", "Financiación del terrorismo y armas nucleares", "Corrupción de funcionarios públicos extranjeros", "Narcotráfico marítimo y precursores químicos"], "a": 0, "e": "Tres protocolos: trata de personas, tráfico ilícito de migrantes y armas de fuego."}, {"t": "mc", "q": "Viena 1988 obliga a tipificar el lavado respecto del producto de:", "o": ["Los delitos de tráfico de drogas", "Cualquier delito grave", "Los delitos de corrupción pública", "Los delitos de terrorismo"], "a": 0, "e": "Su alcance es limitado al narcotráfico; Palermo lo amplía."}, {"t": "vf", "q": "Según la Convención de Palermo, cada Estado está obligado a crear una unidad de inteligencia financiera.", "a": false, "e": "Art. 7, párrafo 1, literal b: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la Convención de Palermo, el principio «extraditar o juzgar» significa que el Estado que no extradita:", "o": ["Debe someter el caso a sus propias autoridades", "Puede archivar el caso sin consecuencias", "Debe entregar al requerido a un tercer Estado", "Pierde su jurisdicción sobre el hecho"], "a": 0, "e": "Art. 16, párrafo 10. Aut dedere aut judicare, presente en varios convenios."}, {"t": "mc", "q": "Ordena cronológicamente los tratados: Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo.", "o": ["Viena (1988), FT (1999), Palermo (2000), Mérida (2003)", "Viena (1988), Palermo (2000), FT (1999), Mérida (2003)", "FT (1999), Viena (1988), Palermo (2000), Mérida (2003)", "Viena (1988), Mérida (2003), Palermo (2000), FT (1999)"], "a": 0, "e": "Es una trampa frecuente de orden cronológico."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), los Estados considerarán medidas para vigilar el transporte transfronterizo de efectivo.", "a": true, "e": "Art. 18, párrafo 2, literal b. Trampa: se cree que ese control solo viene del GAFI."}, {"t": "vf", "q": "Según el Convenio Internacional para la Represión de la Financiación del Terrorismo (1999), una solicitud de asistencia judicial puede negarse por tratarse de un delito fiscal.", "a": false, "e": "Art. 13. Trampa: el art. 14 dice lo mismo respecto del delito político."}, {"t": "mc", "q": "Según la Convención de Palermo, un «grupo delictivo organizado» es el integrado por:", "o": ["Tres o más personas que actúan concertadas para delitos graves", "Dos o más personas que se asocian para un solo delito", "Cinco o más personas con jerarquía y estructura formal", "Cualquier asociación que cometa delitos de forma habitual"], "a": 0, "e": "Art. 2 de Palermo: tres o más personas, existente durante cierto tiempo, con ánimo de beneficio económico u otro."}, {"t": "mc", "q": "La Convención Interamericana contra la Corrupción incluye, entre sus figuras:", "o": ["El soborno transnacional y el enriquecimiento ilícito", "El lavado de activos proveniente del narcotráfico", "El financiamiento del terrorismo", "La trata de personas"], "a": 0, "e": "Artículos VIII y IX de la Convención."}, {"t": "mc", "q": "¿Qué relación tiene el Convenio de 1999 con las Recomendaciones del GAFI?", "o": ["La R.5 exige tipificar ese delito", "El GAFI lo reemplaza por la R.6", "No tienen relación alguna", "El GAFI lo declara voluntario para países caribeños"], "a": 0, "e": "R.5 sobre el delito de financiamiento del terrorismo; R.6, sanciones financieras dirigidas."}, {"t": "vf", "q": "Según la Convención Interamericana contra la Corrupción, para aplicarla se requiere que los actos de corrupción produzcan perjuicio patrimonial al Estado.", "a": false, "e": "Art. XII. Trampa: se añade un requisito."}, {"t": "mc", "q": "Según los datos de la Convención Interamericana contra la Corrupción, su entrada en vigor ocurrió en:", "o": ["1997", "1996", "2002", "2005"], "a": 0, "e": "Adoptada en Caracas en 1996. Trampa: 2005 es la entrada en vigor de Mérida."}, {"t": "mc", "q": "Un compañero confunde la Convención de Mérida con la Interamericana contra la Corrupción. ¿Qué diferencia fundamental existe?", "o": ["La primera es universal; la segunda, regional", "La primera es regional y la segunda universal", "Ambas son de la OEA, de años distintos", "Ambas son de la ONU, de ámbitos distintos"], "a": 0, "e": "Mérida 2003, ONU; Interamericana 1996, OEA, adoptada en Caracas."}, {"t": "mc", "q": "La Convención Interamericana sobre Asistencia Mutua en Materia Penal se adoptó en:", "o": ["Nassau, en 1992", "Caracas, en 1996", "Managua, en 1999", "Lima, en 2005"], "a": 0, "e": "Instrumento regional de cooperación judicial."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes para todos los Estados por igual", "Ambos son recomendaciones sin ningún efecto jurídico práctico", "El GAFI aprueba los tratados que firman sus miembros"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "La relación entre los convenios y el enfoque basado en riesgo es que los convenios:", "o": ["Fijan obligaciones y el enfoque ordena su aplicación", "Prohíben aplicar un enfoque basado en riesgo a los sujetos", "Sustituyen al enfoque en los países parte", "Solo aplican a países de alto riesgo"], "a": 0, "e": "Complementariedad entre tratado y método."}, {"t": "vf", "q": "Según la Convención de Mérida, cada Estado está obligado a establecer una unidad de inteligencia financiera.", "a": false, "e": "Art. 58: considerará establecerla. Trampa: se convierte en deber una invitación a considerar."}, {"t": "mc", "q": "Según la Convención de Mérida y sus datos de adopción, fue aprobada por la Asamblea General y entró en vigor, respectivamente, en:", "o": ["2003 y 2005", "2000 y 2003", "2003 y 2004", "1996 y 1997"], "a": 0, "e": "Trampa: 2000 y 2003 son Palermo; 1996 y 1997, la Interamericana."}, {"t": "mc", "q": "Según los datos de la Convención de Viena de 1988, su entrada en vigor ocurrió en:", "o": ["1990", "1988", "1989", "1991"], "a": 0, "e": "Trampa: 1988 es el año de adopción y 1989, el de la creación del GAFI."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "vf", "q": "Según la Convención de Palermo, un delito es transnacional si se comete en un solo Estado pero tiene efectos sustanciales en otro.", "a": true, "e": "Art. 3, párrafo 2, literal d."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "mc", "q": "Según la Convención de Palermo, un delito cometido en un solo Estado es transnacional si en otro Estado se realiza una parte sustancial de su:", "o": ["Preparación, planificación, dirección o control", "Financiación, ejecución o encubrimiento", "Investigación, juzgamiento o condena", "Beneficio, reparto o reinversión posterior"], "a": 0, "e": "Art. 3, párrafo 2, literal b. Trampa: las otras listas suenan igual de técnicas."}, {"t": "mc", "q": "Además del número de integrantes, Palermo exige que el grupo:", "o": ["Exista durante cierto tiempo y actúe concertadamente", "Tenga una estructura jerárquica formal", "Cuente con armas y medios de transporte", "Opere de forma simultánea en al menos tres países"], "a": 0, "e": "No se exige estructura formal ni continuidad de la composición."}, {"t": "vf", "q": "Un mismo Estado puede ser parte a la vez de la Convención Interamericana contra la Corrupción y de la Convención de Mérida.", "a": true, "e": "Los instrumentos regionales y universales son compatibles."}, {"t": "mc", "q": "La disposición de los bienes decomisados, según Palermo, puede incluir:", "o": ["Su devolución al Estado requirente o a víctimas legítimas", "Su destrucción obligatoria en todos los casos", "Su reparto a partes iguales entre los Estados intervinientes", "Su entrega a las Naciones Unidas"], "a": 0, "e": "Artículo 14 de la Convención."}, {"t": "mc", "q": "¿Cuál de estas figuras forma parte de los delitos que Mérida pide tipificar?", "o": ["Soborno, malversación y tráfico de influencias", "Contrabando de combustible", "Evasión de tributos aduaneros", "Piratería de obras audiovisuales y programas"], "a": 0, "e": "Arts. 15 a 25 de Mérida, entre ellos el blanqueo del producto del delito."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, una alerta se cierra porque el cliente explicó verbalmente el origen de los fondos. El problema es:", "o": ["La explicación no fue verificada ni documentada", "Las explicaciones verbales están prohibidas", "El cliente no puede explicar sus operaciones", "La alerta debía reportarse sin analizar"], "a": 0, "e": "Verificación y soporte documental."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la opinión de auditoría independiente sobre el sistema de prevención sirve principalmente para:", "o": ["Validar el diseño y la operación de controles", "Sustituir la evaluación propia de riesgos", "Reemplazar la función del oficial designado", "Cumplir la debida diligencia de clientes"], "a": 0, "e": "Tercera línea."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, en una persona jurídica, si nadie alcanza el porcentaje de propiedad de referencia, se identifica a quien ejerce el control por otros medios y, en su defecto, al alto directivo.", "a": true, "e": "Nota interpretativa de la R.10: cascada de tres pasos. Trampa: se cree que sin accionista mayoritario no hay beneficiario final."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente no residente figura entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que solo importan los países de riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el oficial de cumplimiento, como segunda línea, es el dueño del riesgo de cada operación.", "a": false, "e": "El dueño del riesgo es la primera línea, que origina la operación. Trampa: se traslada la responsabilidad a quien vigila."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la debida diligencia intensificada corresponde al riesgo:", "o": ["Alto", "Moderado", "Bajo", "Indeterminado"], "a": 0, "e": "Incluye medidas sobre origen de fondos y aprobación superior."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, antes de lanzar un producto nuevo, el sujeto obligado debe:", "o": ["Identificar y evaluar sus riesgos", "Notificar el producto a la UNIF", "Reportar a sus primeros clientes", "Esperar una inspección sectorial"], "a": 0, "e": "Recomendación 15 y normas sectoriales."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual copiado de otra entidad del mismo sector, aunque esté bien redactado:", "o": ["No refleja los riesgos propios de la entidad", "Cumple porque pertenece al mismo sector", "Cumple si lo aprueba la junta directiva", "Solo falla si contiene errores de forma"], "a": 0, "e": "Evaluación propia."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una matriz de riesgo debe reflejar las características propias del sujeto obligado.", "a": true, "e": "No se copia de otra entidad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un indicador clave de riesgo, a diferencia de uno de desempeño, mide:", "o": ["La exposición que puede materializarse", "El cumplimiento de las metas de gestión", "El gasto ejecutado por el área", "La satisfacción de los clientes"], "a": 0, "e": "Trampa: el número de capacitaciones dictadas es desempeño; el porcentaje de expedientes vencidos de alto riesgo es exposición."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, tras un cambio de ley que afecta productos de la entidad, la evaluación de riesgos:", "o": ["Debe revisarse sin esperar el ciclo periódico", "Debe esperar el siguiente ciclo periódico", "Solo se revisa si ocurre una pérdida", "Solo se revisa si el supervisor lo ordena"], "a": 0, "e": "Actualización por eventos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la matriz de riesgo, una vez aprobada por la junta, no debe modificarse hasta el siguiente ejercicio.", "a": false, "e": "Se actualiza ante cambios relevantes de productos, clientes, canales o normas. Trampa: se confunde aprobación con inmovilidad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, la ausencia de una metodología escrita para clasificar clientes implica que:", "o": ["Las decisiones no pueden justificarse ante el supervisor", "La empresa puede clasificar a sus clientes con mayor libertad", "El riesgo se reduce por simplificación", "La clasificación la define cada vendedor"], "a": 0, "e": "Sin método documentado no hay enfoque defendible."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el riesgo se define como:", "o": ["El efecto de la incertidumbre sobre los objetivos", "La probabilidad de que ocurra una pérdida económica", "La suma de las amenazas y vulnerabilidades conocidas", "El daño que causa un evento ya materializado"], "a": 0, "e": "Definición de la norma. Trampa: las otras confunden riesgo con pérdida o con sus componentes."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, el análisis de una alerta debe dejar constancia, como mínimo, de:", "o": ["Qué se revisó, qué se concluyó y quién decidió", "El nombre del cliente y la fecha", "El monto de la operación que originó la alerta", "La firma del gerente comercial"], "a": 0, "e": "Trazabilidad de la decisión."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las medidas de prevención deben ser proporcionales a los riesgos identificados.", "a": true, "e": "Es la esencia del enfoque."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, ante un riesgo mayor, las medidas intensificadas son obligatorias; ante uno menor, las simplificadas son facultativas.", "a": true, "e": "R.1 y su nota interpretativa. Trampa: se cree que ambas tienen la misma fuerza."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), aportar experiencia, apoyo, seguimiento y cuestionamiento sobre la gestión del riesgo es un rol de:", "o": ["La segunda línea", "La primera línea", "La tercera línea", "El auditor externo"], "a": 0, "e": "Modelo de las tres líneas (2020). Trampa: la tercera línea da aseguramiento independiente; la primera gestiona el riesgo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la evaluación de riesgos debe actualizarse:", "o": ["Periódicamente y ante cambios relevantes", "Solo cuando ocurra una sanción firme", "Una vez, al constituir la empresa", "Cada diez años como plazo fijo"], "a": 0, "e": "El riesgo cambia con productos, clientes y tecnologías."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe ser dinámica: anticipar, detectar y responder a los cambios del contexto.", "a": true, "e": "Apartado 4, principios. Trampa: se cree que la evaluación es un ejercicio único."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, un cliente clasificado como de riesgo bajo realiza una operación incoherente con su perfil. Corresponde:", "o": ["Analizar, reclasificar y considerar el reporte", "Mantener la clasificación hasta el año siguiente", "Aumentar el límite de su contrato", "Solicitar una referencia bancaria adicional"], "a": 0, "e": "El perfil es dinámico."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un manual excelente que el personal no aplica evidencia una falla de:", "o": ["Efectividad", "Redacción", "Formato", "Vigencia"], "a": 0, "e": "El cumplimiento formal no equivale a mitigar el riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una operación puede ser sospechosa aunque su monto sea coherente con el perfil del cliente.", "a": true, "e": "La sospecha puede venir de la contraparte, el destino o la forma. Trampa: se cree que solo importa el monto."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 18 del GAFI, un sujeto obligado decide que el oficial de cumplimiento reporte al gerente de ventas. Esto:", "o": ["Vulnera la independencia exigida por la norma", "Agiliza la aprobación de nuevos clientes", "Cumple con la estructura mínima requerida", "Es válido si lo aprueba el auditor externo"], "a": 0, "e": "El reporte es a la junta directiva."}, {"t": "vf", "q": "Cuando la CDD no puede completarse, el GAFI contempla no abrir la cuenta o terminar la relación y evaluar el reporte de operación sospechosa.", "a": true, "e": "Es la regla de la R.10."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, dejar de ofrecer un producto por su riesgo es una forma de mitigar ese riesgo.", "a": false, "e": "Es evitarlo. Mitigar es reducirlo con controles mientras se mantiene la actividad. Trampa: se confunden dos respuestas."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad califica igual a todos sus clientes para simplificar la gestión. El defecto principal es:", "o": ["Falta de segmentación por riesgo", "Exceso de controles compensatorios", "Duplicidad del riesgo residual", "Falta de un manual actualizado"], "a": 0, "e": "Sin segmentación no se asignan recursos según el riesgo."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la segunda línea de defensa está integrada, entre otros, por:", "o": ["La función de cumplimiento y gestión de riesgos", "La fuerza de ventas y el área comercial de la empresa", "La auditoría interna independiente", "El auditor externo contratado"], "a": 0, "e": "Diseña políticas y vigila su aplicación."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una debilidad en los controles que puede ser aprovechada para legitimar es:", "o": ["Una vulnerabilidad", "Una amenaza", "Una consecuencia", "Un riesgo residual"], "a": 0, "e": "Trampa: la amenaza es la persona o actividad con potencial de causar daño."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las medidas simplificadas no proceden cuando existe sospecha de legitimación de capitales.", "a": true, "e": "Regla recogida también en la Providencia 044-2021 de SUNACRIP."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo geográfico:", "o": ["Países con niveles significativos de corrupción", "Países con sistemas eficaces según evaluaciones mutuas", "Países con baja delincuencia según fuentes creíbles", "Países con seguimiento ordinario del GAFI"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: los otros son indicadores de menor riesgo o neutros."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el programa anual de seguimiento, evaluación y control tiene por objeto:", "o": ["Verificar que los controles funcionan en la práctica", "Sustituir a la auditoría interna de la empresa", "Evaluar al personal para su promoción", "Fijar las metas de venta del año"], "a": 0, "e": "Prueba de efectividad de los controles."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, la clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "Según la Recomendación 10 del GAFI, es un ejemplo de medida intensificada:", "o": ["Exigir que el primer pago venga de una cuenta bancaria del cliente", "Reducir la frecuencia de actualización de los datos del cliente", "Inferir el propósito de la relación por el tipo de producto", "Verificar la identidad con posterioridad a la vinculación"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son medidas simplificadas."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, son ejemplos de factores de mayor riesgo por producto o canal la banca privada y:", "o": ["Las relaciones o transacciones no presenciales", "Las cuentas de nómina de entidades públicas", "Los planes de pensiones de empleados", "Las pólizas de vida de prima baja"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, las políticas y controles del sujeto obligado deben permitir, además de gestionar los riesgos identificados:", "o": ["Vigilar su aplicación y reforzarlos si hace falta", "Eliminar por completo los riesgos de la cartera", "Trasladar los riesgos residuales al supervisor", "Prescindir de la evaluación del año siguiente"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: no es un enfoque de riesgo cero ni se traslada la responsabilidad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la decisión de aceptar un riesgo alto por encima del apetito definido corresponde a:", "o": ["La alta dirección, con constancia documentada", "El ejecutivo de cuenta que atiende al cliente", "El supervisor sectorial en cada operación", "La auditoría externa en su informe anual"], "a": 0, "e": "Gobierno del riesgo."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, un oficial de cumplimiento propone revisar primero los expedientes de riesgo alto. Esa decisión:", "o": ["Es coherente con el enfoque basado en riesgo", "Discrimina a un grupo de clientes", "Debe autorizarla el supervisor", "Contradice el principio de igualdad entre clientes"], "a": 0, "e": "Asignación de esfuerzo según riesgo."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, la frecuencia e intensidad del monitoreo continuo pueden reducirse para clientes de riesgo menor.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el monitoreo debe ser igual para todos."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, un sujeto obligado documenta sus controles pero nunca prueba si funcionan. El riesgo es:", "o": ["Tener cumplimiento formal sin efectividad real", "Incurrir en un gasto administrativo excesivo", "Duplicar el trabajo de la auditoría externa", "Retrasar la emisión de los contratos"], "a": 0, "e": "La distinción entre forma y efectividad es central."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, cuando la información para evaluar un riesgo es insuficiente, lo prudente es:", "o": ["Tratarlo como mayor hasta poder evaluarlo", "Tratarlo como menor hasta tener datos", "Excluirlo de la matriz por no ser medible", "Trasladar su evaluación al supervisor"], "a": 0, "e": "Trampa: la falta de datos no prueba riesgo bajo; las medidas simplificadas exigen riesgo menor demostrado."}, {"t": "mc", "q": "Según la Recomendación 18 del GAFI, el riesgo de contagio en un grupo económico significa que:", "o": ["El incumplimiento de una filial afecta al grupo entero", "Las pérdidas se reparten entre accionistas", "Los clientes migran a otra filial", "El supervisor inspecciona solo una de las empresas"], "a": 0, "e": "Por eso se exigen políticas a nivel de grupo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de dos riesgos con igual puntaje total, uno de alta probabilidad y bajo impacto y otro inverso, la matriz bien usada:", "o": ["Permite priorizarlos con criterio cualitativo", "Obliga a tratarlos de forma idéntica en el plan", "Excluye de la matriz el de baja probabilidad", "Excluye de la matriz el de bajo impacto"], "a": 0, "e": "El puntaje no sustituye el juicio."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la gestión del riesgo debe basarse en la mejor información disponible, considerando sus limitaciones e incertidumbres.", "a": true, "e": "Apartado 4. Trampa: se cree que solo valen datos históricos completos."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, negar servicios a toda una categoría de clientes sin analizar su riesgo individual se conoce como:", "o": ["De-risking", "Estructuración", "Colocación", "Integración"], "a": 0, "e": "El enfoque exige gestionar el riesgo, no evitarlo en bloque."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, la norma establece un único método obligatorio para calcular el riesgo inherente.", "a": false, "e": "La norma ofrece principios, un marco y un proceso, no un método único de cálculo. Trampa: se confunde un marco de referencia con una metodología cerrada."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una alerta se cierra porque el cliente es antiguo y aporta mucho negocio. El cierre es:", "o": ["Deficiente, por no analizar la operación", "Correcto, por la antigüedad del cliente", "Correcto, si lo aprueba el área comercial", "Deficiente, solo si después hay sanción"], "a": 0, "e": "Los criterios comerciales no reemplazan el análisis."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una red criminal que busca dónde colocar fondos es una vulnerabilidad del sujeto obligado.", "a": false, "e": "Es una amenaza. La vulnerabilidad es lo que la amenaza puede explotar. Trampa: se intercambian los conceptos."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, las operaciones sospechosas deben reportarse aunque el cliente esté calificado como de bajo riesgo.", "a": true, "e": "La calificación no exime del reporte."}, {"t": "mc", "q": "Según el modelo de las tres líneas del Instituto de Auditores Internos (IIA), la primera línea de defensa en el modelo de tres líneas corresponde a:", "o": ["Las áreas de negocio que ejecutan las operaciones", "La función de cumplimiento y de gestión de riesgos", "La auditoría interna de la empresa", "El supervisor del sector"], "a": 0, "e": "Quien origina el riesgo lo gestiona primero."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "vf", "q": "Según la norma ISO 31000 de gestión del riesgo, los factores humanos y culturales influyen en todos los aspectos de la gestión del riesgo.", "a": true, "e": "Apartado 4. Trampa: se cree que basta un buen modelo técnico."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la auditoría interna pertenece a la segunda línea de defensa.", "a": false, "e": "Es la tercera línea. Trampa: se confunde con la función de cumplimiento."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo que se mide sin considerar los controles es el:", "o": ["Inherente", "Residual", "Neto", "Tolerado"], "a": 0, "e": "El residual es el que queda tras los controles."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el supervisor debe revisar las evaluaciones de riesgo que elaboran los sujetos obligados.", "a": true, "e": "Notas interpretativas de las R.26 y R.28. Trampa: se cree que el supervisor solo mira los controles."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad que aplicó todas las medidas razonables no puede, por definición, ser utilizada para legitimar.", "a": false, "e": "Guías del GAFI: no es un enfoque de cero fallas. Trampa: se confunde gestionar el riesgo con eliminarlo."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo se entiende como función de tres factores:", "o": ["Amenaza, vulnerabilidad y consecuencia", "Probabilidad, impacto y apetito de riesgo", "Cliente, producto y canal", "Inherente, residual y tolerado"], "a": 0, "e": "Guía del GAFI sobre evaluación nacional de riesgos. Trampa: cliente, producto y canal son factores de riesgo del sujeto obligado, no los componentes del concepto."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, los factores de riesgo deben combinarse: un solo factor bajo no determina por sí la calificación.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el país o el monto bastan."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, las exenciones de requisitos solo proceden en circunstancias limitadas y con riesgo bajo comprobado.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que el estándar no admite exención alguna."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, compartir con otra empresa el hecho de que se reportó a un cliente concreto vulnera la confidencialidad del reporte.", "a": true, "e": "La reserva alcanza también a terceros del sector."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo residual resulta de:", "o": ["El riesgo inherente menos el efecto de los controles", "El riesgo inherente más el apetito de riesgo aprobado", "La probabilidad menos el impacto estimado", "El apetito de riesgo menos la tolerancia"], "a": 0, "e": "Trampa: apetito y tolerancia son límites de decisión, no componentes del cálculo."}, {"t": "mc", "q": "Según la Recomendación 8 del GAFI, al aplicar el enfoque basado en riesgo a las organizaciones sin fines de lucro, lo adecuado es:", "o": ["Analizar su actividad real y el destino de sus fondos", "Aplicarles medidas simplificadas por su fin social", "Exigirles una garantía bancaria por cada envío", "Clasificarlas según el monto de sus donaciones"], "a": 0, "e": "Medidas focalizadas y proporcionales."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el riesgo de financiamiento del terrorismo puede evaluarse con los mismos indicadores de monto que el de legitimación.", "a": false, "e": "Usa montos bajos y fondos de origen lícito; importan el destino y la contraparte. Trampa: se trasladan los indicadores de un riesgo a otro."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, contratar a un proveedor para verificar identidades es, como respuesta al riesgo:", "o": ["Una mitigación que no traslada la responsabilidad", "Una transferencia que traslada la responsabilidad", "Una aceptación del riesgo por parte del proveedor", "Una forma de evitar el riesgo de identificación"], "a": 0, "e": "R.17 y reglas de tercerización. Trampa: el contrato no transfiere la responsabilidad regulatoria."}, {"t": "mc", "q": "Según la norma ISO 31000 de gestión del riesgo, el seguimiento y la revisión del proceso de gestión del riesgo deben hacerse:", "o": ["En todas sus etapas, de forma planificada", "Al cierre de cada ejercicio económico", "Cuando se materializa un evento de pérdida", "Durante la auditoría externa anual"], "a": 0, "e": "Apartado 6.6. Trampa: limitarlo a un momento contradice el seguimiento continuo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el apetito de riesgo lo define el oficial de cumplimiento y lo informa a la junta directiva.", "a": false, "e": "Lo define y aprueba el órgano de dirección. Trampa: se invierte quién decide y quién informa."}, {"t": "mc", "q": "Una institución rechaza a todos los clientes de un sector por considerarlo riesgoso, sin evaluar caso a caso («de-risking»). ¿Qué crítica hace el GAFI?", "o": ["Excluye sin evaluar y empuja a canales informales", "Constituye la mejor práctica que exige el GAFI", "Resulta obligatorio si el sector tiene riesgo alto", "Carece de relevancia para el sistema de prevención"], "a": 0, "e": "El GAFI desalienta el rechazo indiscriminado."}, {"t": "mc", "q": "Según la LOCDOFT, una operación sospechosa, frente a la inusual, es la que:", "o": ["Tras el análisis carece de justificación razonable", "Tiene un monto mayor que la media histórica del cliente", "Involucra a una persona jurídica", "Se realiza fuera del horario habitual"], "a": 0, "e": "Art. 4, numeral 2. La sospecha es el resultado del análisis."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, es un ejemplo de factor de mayor riesgo relacionado con el cliente:", "o": ["Una sociedad con accionistas nominales o acciones al portador", "Una empresa que cotiza en bolsa con divulgación de información", "Una entidad pública o una empresa del Estado", "Un plan de pensiones sin opción de rescate anticipado"], "a": 0, "e": "Nota interpretativa de la R.10. Trampa: las otras tres son ejemplos de menor riesgo."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, las empresas que manejan mucho efectivo figuran entre los ejemplos de clientes de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que el riesgo depende solo del monto de cada operación."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, las políticas y controles para gestionar los riesgos deben ser aprobados por:", "o": ["La alta gerencia", "El oficial de cumplimiento", "El auditor interno", "El supervisor del sector"], "a": 0, "e": "Nota interpretativa de la R.1. Trampa: el oficial propone y vigila, pero no aprueba."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, el canal de distribución es un factor de riesgo en sí mismo y debe evaluarse, no solo el cliente final.", "a": true, "e": "Intermediarios y corredores forman parte del análisis."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la cantidad de reportes de sospecha enviados, por sí sola:", "o": ["No demuestra la calidad del sistema", "Demuestra la efectividad del sistema", "Debe aumentar todos los años", "Debe mantenerse en cero en lo posible"], "a": 0, "e": "Importa la calidad y utilidad."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la concentración de clientes en una zona con alta incidencia delictiva debe llevar, ante todo, a:", "o": ["Ajustar controles según esa exposición", "Salir de la zona sin análisis alguno", "Ignorarla si los clientes son antiguos", "Reportar a todos los clientes de la zona"], "a": 0, "e": "Gestionar, no evitar en bloque."}, {"t": "vf", "q": "Según la Metodología de evaluación del GAFI, el supervisor puede concluir que una empresa incumple aunque tenga todos los documentos, si los controles no operan.", "a": true, "e": "Se evalúa la efectividad."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un cliente calificado de bajo riesgo queda fuera del monitoreo continuo.", "a": false, "e": "Se reduce su intensidad, no se suprime. Trampa: se confunde menos con nada."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, en las fases clásicas de la legitimación, comprar bienes de lujo con fondos ya estratificados corresponde a:", "o": ["Integración", "Colocación", "Estratificación", "Estructuración"], "a": 0, "e": "Etapa final del proceso."}, {"t": "vf", "q": "Según la Recomendación 21 del GAFI, quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según la Recomendación 17 del GAFI, transferir un riesgo mediante un contrato con un tercero:", "o": ["No traslada la responsabilidad regulatoria", "Elimina por completo el riesgo asumido", "Exime del deber de reportar", "Sustituye la debida diligencia propia"], "a": 0, "e": "La responsabilidad frente al supervisor permanece."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), la inspección in situ debe limitarse a revisar que existan los documentos.", "a": false, "e": "Debe auditar la calidad de los controles y el conocimiento real de los riesgos."}, {"t": "vf", "q": "Según la Recomendación 1 del GAFI, la evaluación de riesgos del sujeto obligado debe estar documentada y disponible para las autoridades.", "a": true, "e": "Nota interpretativa de la R.1. Trampa: se cree que es un documento interno reservado."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, el origen de los fondos y el origen de la riqueza son el mismo concepto.", "a": false, "e": "Fondos: de dónde viene el dinero de la operación. Riqueza: cómo se formó el patrimonio total. Trampa: se usan como sinónimos."}, {"t": "mc", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control que bloquea la operación con una persona listada antes de ejecutarla es:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "a": 0, "e": "Trampa: sería detectivo si la coincidencia se revisara después de ejecutada."}, {"t": "vf", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, los pagos recibidos de terceros desconocidos o no asociados figuran entre los ejemplos de mayor riesgo.", "a": true, "e": "Nota interpretativa de la R.10. Trampa: se cree que basta identificar al titular."}, {"t": "mc", "q": "Según la Recomendación 19 del GAFI, ante un país identificado con deficiencias en prevención, el enfoque indica:", "o": ["Aplicar medidas intensificadas y contramedidas proporcionales", "Prohibir toda operación con sus nacionales y residentes", "Mantener las medidas ordinarias", "Trasladar la decisión al cliente"], "a": 0, "e": "Proporcionalidad incluso en riesgo alto."}, {"t": "mc", "q": "Según la Recomendación 11 del GAFI, la trazabilidad de una decisión de no reportar una alerta exige:", "o": ["Documentar el análisis y sus fundamentos", "Borrar la alerta del sistema", "Informar al cliente del descarte", "Esperar la validación del supervisor"], "a": 0, "e": "Las decisiones negativas también se documentan."}, {"t": "mc", "q": "Según las Recomendaciones 6 y 19 del GAFI, la diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un control bien diseñado se considera eficaz aunque no se haya probado su funcionamiento.", "a": false, "e": "Diseño y eficacia operativa se evalúan por separado. Trampa: se da por probado lo que solo está escrito."}, {"t": "mc", "q": "Según la Recomendación 1 del GAFI, el enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 1 del GAFI, una matriz de riesgo que no considera el canal digital de una empresa que vende en línea:", "o": ["Está desactualizada frente a su operación real", "Cumple igualmente con la norma", "Puede mantenerse si el volumen es bajo", "Solo debe corregirse en la próxima inspección"], "a": 0, "e": "La matriz debe reflejar la operación actual."}, {"t": "vf", "q": "Según la Evaluación Sectorial de Riesgos de abogados, contadores y agentes inmobiliarios de la ONCDOFT (2026), debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, aplicar medidas simplificadas equivale a quedar exento de la debida diligencia.", "a": false, "e": "Simplificar es reducir la intensidad, no suprimir. Trampa: se confunde simplificación con exención."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, fraccionar depósitos para no alcanzar un umbral de reporte ocurre típicamente en la fase de:", "o": ["Colocación", "Estratificación", "Integración", "Repatriación"], "a": 0, "e": "Trampa: la estructuración es una técnica, no una fase; sirve para introducir el efectivo."}, {"t": "vf", "q": "Según la Recomendación 10 del GAFI, rechazar a un cliente por no poder completar su identificación es un caso de de-risking.", "a": false, "e": "Es la consecuencia que prevé la R.10. El de-risking es cortar categorías completas sin evaluar el riesgo individual. Trampa: se confunden un rechazo fundado y uno en bloque."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, una entidad aplica diligencia simplificada a un segmento sin haber documentado el análisis  en riesgo, un sujeto obligado de bajo riesgo queda eximido de todo control.", "a": false, "e": "El menor riesgo admite medidas más ligeras, no su ausencia."}, {"t": "vf", "q": "Según la Recomendación 15 del GAFI, lanzar un producto nuevo sin evaluar previamente su riesgo de LC/FT contradice el enfoque basado en riesgo.", "a": true, "e": "La evaluación es previa al lanzamiento."}, {"t": "mc", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, de estos pares, el que une correctamente factor y ejemplo es:", "o": ["Canal: venta no presencial por intermediarios", "Producto: residencia en zona fronteriza", "Geográfico: pagos de terceros no relacionados", "Cliente: uso de plataformas sin contacto"], "a": 0, "e": "Trampa: la residencia es factor geográfico; los pagos de terceros, de producto u operación; las plataformas, de canal."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, la asignación de recursos de cumplimiento debe concentrarse donde los riesgos identificados son mayores.", "a": true, "e": "Orientación del GAFI citada en la Guía UNIF-DSU-GUIA-2026-005."}, {"t": "vf", "q": "Según las guías del GAFI sobre el enfoque basado en riesgo, un riesgo residual dentro del apetito elimina la necesidad de seguimiento.", "a": false, "e": "El seguimiento continúa."}, {"t": "vf", "q": "Según la Recomendación 18 del GAFI, un control que existe en el manual pero que el sistema no ejecuta es, en términos de riesgo, un control inexistente.", "a": true, "e": "Se evalúa lo que opera, no lo que está escrito."}, {"t": "mc", "q": "Según la nota interpretativa de la Recomendación 10 del GAFI, dentro del factor canal, eleva el riesgo que la contratación sea:", "o": ["No presencial, sin contacto directo con el cliente", "Realizada en la oficina principal", "Hecha por un intermediario inscrito en el registro oficial", "Documentada en formato digital"], "a": 0, "e": "La no presencialidad dificulta la verificación."}, {"t": "mc", "q": "Según la LO function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.t==='vf')return {q:q.q,o:['Verdadero','Falso'],c:[q.a?0:1],e:q.e};
  const idx=shuffle(q.o.map((_,i)=>i));
  return {q:q.q,o:idx.map(i=>q.o[i]),c:[idx.indexOf(q.a)],e:q.e};
}
function menu(){

      h+=`<button onclick="start(${gi},${ei})"><b>${esc(e.titulo)}</b><br><span class="tag">${e.q.length} preguntas · aprueba con 40</span></button>`;

    h+='</div>';
  });

}
function start(gi,ei){

function pick(k){

function ok(q,a){return a&&q.c.includes(a.sel)}
function render(){
  const q=st.qs[st.i],a=st.ans[st.i],n=st.qs.length,show=immediate&&a&&a.locked;
  let h=`<div class="mut">${esc(st.titulo)} · pregunta ${st.i+1} de ${n}</div><div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>`;
  h+=`<div class="card"><b>${esc(q.q)}</b>`;
  q.o.forEach((o,k)=>{
    let cl='opt';
    if(show){if(q.c.includes(k))cl+=' ok';else if(a.sel===k)cl+=' bad'}
    h+=`<div class="${cl}" onclick="pick(${k})"><input type="radio" ${a&&a.sel===k?'checked':''} style="margin-top:5px" onclick="event.preventDefault()"><span>${esc(o)}</span></div>`;
  });
  if(show)h+=`<div class="ex"><b>${ok(q,a)?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)}</div>`;
  h+=`</div><div class="row"><button onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button>`;
  h+=st.i<n-1?`<button class="p" onclick="go(1)">Siguiente</button>`:`<button class="p" onclick="finish()">Finalizar</button>`;
  h+=`<button onclick="menu()">Salir</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function go(d){st.i+=d;render()}
function finish(){
  const n=st.qs.length;let s=0;
  st.qs.forEach((q,i)=>{if(ok(q,st.ans[i]))s++});
  const p=s/n,pass=p>=PASS;
  let h=`<h1>Resultado</h1><div class="card"><div class="big ${pass?'pass':'fail'}">${Math.round(p*100)} %</div>
    <div>${s} de ${n} correctas · <b>${pass?'APROBADO':'NO APROBADO'}</b> (mínimo ${Math.ceil(n*PASS)} aciertos, 80 %)</div>
    <div class="row"><button class="p" onclick="menu()">Volver al menú</button></div></div><h2>Revisión de errores</h2>`;
  let any=false;
  st.qs.forEach((q,i)=>{
    const a=st.ans[i];if(ok(q,a))return;any=true;
    h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>
      <div style="margin-top:8px">Tu respuesta: ${a?esc(q.o[a.sel]):'<i>sin responder</i>'}</div>
      <div class="pass">Correcta: ${esc(q.o[q.c[0]])}</div><div class="ex">${esc(q.e)}</div></div>`;
  });
  if(!any)h+='<div class="card">Sin errores. Examen perfecto.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
menu();
</script></body></html>
