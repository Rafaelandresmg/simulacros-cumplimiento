<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulacros · Cumplimiento LC/FT/FPADM</title>
<style>
:root{--bg:#f6f5f1;--fg:#1f2328;--card:#fff;--mut:#6b7280;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d9d7cf}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e6e1;--card:#202328;--mut:#9aa1ab;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#363a41}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 72px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:16px;margin:26px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:9px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px}
.menu button:hover{border-color:var(--ac)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--bad);background:rgba(185,28,28,.12)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:14px}.ex{margin-top:11px;padding:10px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.09);font-size:15px;border-radius:0 8px 8px 0}
.big{font-size:42px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}label.t{font-size:14px;color:var(--mut);display:block;margin-top:14px}
.tag{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"titulo": "Simulacros · Cumplimiento LC/FT/FPADM · Sector cajas de ahorro", "sub": "20 exámenes de 50 preguntas. Banco de 750 preguntas. Se aprueba con 80 %.", "groups": [{"titulo": "Exámenes integrales: todo el temario mezclado", "exams": [{"titulo": "Examen integral 1", "q": [{"t": "mc", "q": "Una empleada comenta fuera de la empresa que se envió un reporte sobre un cliente. La falla cometida es:", "o": ["Violación de la confidencialidad del reporte", "Incumplimiento del deber de capacitación", "Omisión del deber de identificación del cliente", "Falta de aprobación de la alta gerencia"], "a": 0, "e": "La confidencialidad protege al reportante y la investigación."}, {"t": "mc", "q": "Las Recomendaciones del GAFI fueron revisadas en 2012 con el efecto de que:", "o": ["Las nueve especiales se integraron en las cuarenta", "Se redujeron de cuarenta a veinticinco", "Se convirtieron en un tratado vinculante para los países", "Se limitaron al sector bancario"], "a": 0, "e": "Antes de 2012 el esquema era 40 + 9."}, {"t": "mc", "q": "El decomiso solicitado por otro Estado, en el esquema convencional, exige:", "o": ["Ejecutar la decisión conforme al derecho interno del requerido", "Aplicar directamente la ley del requirente", "Someter el caso a la Corte Internacional de Justicia", "Obtener el consentimiento del afectado"], "a": 0, "e": "El Estado requerido aplica su propio procedimiento."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, una calificación baja del país del cliente no anula el riesgo alto que derive del producto o de la actividad.", "a": true, "e": "Los factores se combinan."}, {"t": "vf", "q": "Según la LOCDOFT, la UNIF es el órgano que ejerce la acción penal y dirige la investigación de los delitos de delincuencia organizada.", "a": false, "e": "Eso corresponde al Ministerio Público con apoyo de los cuerpos policiales; la UNIF produce inteligencia financiera."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Consejo de Administración vota remover al Responsable por desacuerdo con su gestión. Esa decisión:", "o": ["No procede: la controversia se dirime ante SUDECA", "Procede: basta la mayoría del Consejo", "Procede: basta la aprobación de la asamblea", "No procede: se dirime ante la jurisdicción penal"], "a": 0, "e": "Punto quinto."}, {"t": "mc", "q": "La integración del área de cumplimiento en el diseño de productos busca:", "o": ["Identificar riesgos antes de salir al mercado", "Retrasar el lanzamiento de la competencia", "Aumentar el precio final del producto", "Sustituir al área de mercadeo"], "a": 0, "e": "Cumplimiento desde el diseño."}, {"t": "mc", "q": "La Convención Interamericana contra el Terrorismo (2002) se adoptó en el marco de:", "o": ["La OEA, en Bridgetown, Barbados", "La ONU, en Nueva York", "La OEA, en Caracas", "La ONU, en Viena"], "a": 0, "e": "Instrumento regional contra el terrorismo y su financiamiento."}, {"t": "mc", "q": "Venezuela participa en el sistema a través del organismo regional:", "o": ["GAFIC, el Grupo de Acción Financiera del Caribe", "GAFILAT, el de América Latina", "APG, el de Asia y el Pacífico", "MONEYVAL, el organismo del Consejo de Europa"], "a": 0, "e": "Es una confusión muy frecuente."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la declaración jurada de origen y destino la suscriben los miembros de los consejos y:", "o": ["Los vinculados a la asociación", "Los funcionarios de la UNIF", "Los inspectores de SUDECA", "Los tribunales competentes"], "a": 0, "e": "Art. 4.11."}, {"t": "mc", "q": "Del siguiente grupo, el instrumento que NO pertenece al sistema universal de la ONU es:", "o": ["La Convención Interamericana contra la Corrupción", "La Convención de Palermo", "La Convención de Mérida", "El Convenio para la Represión de la Financiación del Terrorismo"], "a": 0, "e": "La Interamericana es de la OEA."}, {"t": "mc", "q": "El artículo 8 de Palermo obliga a penalizar:", "o": ["La corrupción de funcionarios públicos", "El tráfico de estupefacientes", "El financiamiento del terrorismo", "El contrabando de armas"], "a": 0, "e": "Mérida desarrolla con mucho más detalle esta materia."}, {"t": "mc", "q": "Un Estado que ratifica un tratado como Palermo debe, en lo esencial:", "o": ["Adecuar su legislación interna y cooperar con otros Estados", "Transferir su competencia penal a la ONU", "Ceder su jurisdicción sobre delitos transnacionales", "Crear un tribunal propio para cada delito"], "a": 0, "e": "Los tratados obligan a incorporar sus disposiciones al derecho interno."}, {"t": "mc", "q": "Según la Convención de Viena de 1988, los delitos determinantes del blanqueo que ella exige tipificar son:", "o": ["Los de tráfico ilícito de estupefacientes", "Todos los delitos graves de cada Estado", "Los de corrupción de funcionarios públicos", "Los de terrorismo y su financiamiento"], "a": 0, "e": "Art. 3. Palermo amplía a delitos graves."}, {"t": "mc", "q": "La Recomendación 27 establece que los supervisores deben tener:", "o": ["Facultades adecuadas de inspección y sanción", "Capacidad de ejercer la acción penal", "Competencia para congelar fondos sin juez", "Autoridad sobre otros países de la región"], "a": 0, "e": "Poderes efectivos de supervisión."}, {"t": "mc", "q": "El presupuesto específico para cumplimiento que aprueba la junta busca:", "o": ["Que el sistema cuente con medios reales", "Reducir el gasto general de la empresa", "Financiar la expansión comercial", "Cubrir las multas del supervisor"], "a": 0, "e": "Sin recursos el sistema es nominal."}, {"t": "mc", "q": "La «cultura de cumplimiento» en una organización se evidencia principalmente por:", "o": ["El ejemplo de la alta dirección", "El número de manuales de la empresa", "El tamaño del departamento de cumplimiento", "La decoración de las oficinas de la empresa"], "a": 0, "e": "Es práctica, no papel."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una PEP que representa a un organismo internacional se ubica en el:", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 0, "e": "Art. 61."}, {"t": "mc", "q": "La verificación de identidad puede completarse después de iniciar la relación cuando:", "o": ["El riesgo se gestiona y la interrupción sería innecesaria", "El cliente lo solicita expresamente", "El monto de la operación resulta particularmente elevado", "La institución tiene poco personal"], "a": 0, "e": "Excepción acotada y gestionada por riesgo."}, {"t": "mc", "q": "¿Qué diferencia existe entre los tratados internacionales y las Recomendaciones del GAFI?", "o": ["Los tratados vinculan al Estado parte; el GAFI fija estándares", "Ambos son tratados vinculantes por igual", "Ambos son recomendaciones sin efecto jurídico", "El GAFI aprueba los tratados"], "a": 0, "e": "Los tratados obligan jurídicamente al ratificarlos; las Recomendaciones operan por evaluación y presión entre pares."}, {"t": "mc", "q": "La diferencia entre una UIF y un cuerpo policial es que la UIF:", "o": ["Produce inteligencia financiera, no instruye el proceso", "Dicta medidas cautelares sobre los bienes", "Juzga a los sujetos obligados que hayan incumplido", "Representa al Estado ante los tribunales"], "a": 0, "e": "Separación de funciones."}, {"t": "vf", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, debe evaluarse el riesgo por la actividad concreta y no por el perfil genérico del profesional.", "a": true, "e": "Pilar de segmentación funcional."}, {"t": "mc", "q": "Venezuela forma parte, como miembro, del grupo regional de estilo GAFI conocido como:", "o": ["GAFIC (Grupo de Acción Financiera del Caribe)", "GAFILAT (Grupo de Acción Financiera de Latinoamérica)", "MENAFATF (Medio Oriente y norte de África)", "APG (Grupo de Asia y el Pacífico)"], "a": 0, "e": "Trampa habitual: no es GAFILAT."}, {"t": "mc", "q": "Un cliente de riesgo bajo comienza a realizar operaciones incompatibles con su perfil. Lo adecuado es:", "o": ["Reclasificarlo y aplicar debida diligencia intensificada", "Mantener su clasificación hasta la próxima actualización anual", "Cerrar su relación de inmediato sin análisis", "Notificarle la reclasificación para que justifique los movimientos"], "a": 0, "e": "El perfil de riesgo es dinámico."}, {"t": "vf", "q": "Confundir a un cliente con un homónimo sancionado y bloquearlo sin verificar es un error que también genera riesgo para la empresa.", "a": true, "e": "La verificación evita daños al cliente legítimo."}, {"t": "mc", "q": "Entre los mecanismos de recuperación, Mérida prevé la recuperación directa, que permite:", "o": ["Que un Estado demande en los tribunales de otro", "Que la ONU decomise los bienes", "Que el banco devuelva los fondos de oficio", "Que el Estado confisque sin proceso"], "a": 0, "e": "Artículo 53."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, una situación inusual que finalmente no se reportó como sospechosa debe constar también en el Libro de Actas.", "a": true, "e": "Punto décimo, numeral 1."}, {"t": "vf", "q": "Aunque el supervisor cambie según el sector, el destinatario del reporte de actividades sospechosas es siempre la UNIF.", "a": true, "e": "La centralización del reporte es una característica del sistema."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Responsable de Cumplimiento debe asistir obligatoriamente a las jornadas de formación que imparta SUDECA.", "a": true, "e": "Punto décimo tercero."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los reportes de actividades sospechosas cuentan su lapso de conservación desde:", "o": ["Su remisión a la UNIF", "La detección de la alerta", "La aprobación del informe", "El inicio del ejercicio"], "a": 0, "e": "Arts. 44 y 70."}, {"t": "vf", "q": "Para la LOCDOFT, el delito de financiamiento al terrorismo se configura aunque los fondos nunca lleguen a emplearse.", "a": true, "e": "La conducta típica es proveer, recolectar o administrar los fondos."}, {"t": "mc", "q": "Un cliente nuevo se niega a revelar quién controla su sociedad. Aplicando la lógica de la LOCDOFT y de las normas de debida diligencia, lo correcto es:", "o": ["No iniciar la relación y evaluar un ROS", "Aceptarlo con un monitoreo reforzado durante el primer año", "Aceptarlo si el pago de la tarifa se realiza por transferencia", "Aceptarlo y solicitar la información en la siguiente renovación"], "a": 0, "e": "Sin identificación plena y beneficiario final no se puede iniciar ni mantener la relación."}, {"t": "mc", "q": "El capítulo V de Mérida, sobre recuperación de activos, se considera:", "o": ["Un principio fundamental de la Convención", "Una disposición opcional para los Estados", "Una recomendación sin efecto jurídico", "Una materia remitida a tratados bilaterales"], "a": 0, "e": "Artículo 51: lo declara principio fundamental."}, {"t": "mc", "q": "Según la LOCDOFT, el plazo mínimo de conservación de un reporte de actividad sospechosa se cuenta desde:", "o": ["Su remisión", "El cierre de la investigación", "El fin de la relación comercial", "La detección de la operación"], "a": 0, "e": "Art. 10, numeral 3."}, {"t": "mc", "q": "La Recomendación 26 trata de:", "o": ["La regulación y supervisión de instituciones financieras", "La creación de la unidad de inteligencia financiera", "La cooperación internacional entre supervisores", "Las sanciones por incumplimiento"], "a": 0, "e": "La 27 define los poderes del supervisor."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, ante una investigación, la falta de libros actualizados lleva a presumir que:", "o": ["La omisión es intencional para encubrir un ilícito", "La asociación no tuvo operación alguna ese ejercicio", "El Consejo de Vigilancia carece de responsabilidad", "La falta fue causada siempre por un error del sistema"], "a": 0, "e": "Punto décimo primero."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, mover fondos por varias cuentas y jurisdicciones para romper su rastro corresponde a:", "o": ["Estratificación", "Colocación", "Integración", "Reintegración"], "a": 0, "e": "Segunda fase."}, {"t": "mc", "q": "Un corredor cuyo nivel de vida no guarda relación con sus comisiones debe:", "o": ["Ser objeto de análisis por el área de cumplimiento", "Ser premiado por su desempeño comercial", "Ser cambiado de zona geográfica", "Ser ignorado por tratarse de su vida privada"], "a": 0, "e": "Riesgo interno previsto en la norma."}, {"t": "mc", "q": "Palermo contempla en su artículo 10 la responsabilidad de:", "o": ["Las personas jurídicas", "Los funcionarios públicos", "Los menores de edad", "Los Estados parte"], "a": 0, "e": "Puede ser penal, civil o administrativa según el sistema jurídico."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los expedientes de asociados y terceros en SIGECAF deben verificarse:", "o": ["Trimestralmente", "Semestralmente", "Mensualmente", "Anualmente"], "a": 0, "e": "Punto décimo sexto."}, {"t": "vf", "q": "Cuando un negocio importante obliga a saltarse controles, el problema no es el control sino la decisión de saltarlo.", "a": true, "e": "La presión comercial es un riesgo en sí mismo."}, {"t": "mc", "q": "Según la LOCDOFT, el objeto declarado de la ley comprende prevenir, investigar, perseguir, tipificar y sancionar estos delitos conforme a:", "o": ["La Constitución y los tratados ratificados", "Las 40 Recomendaciones del GAFI y sus notas", "El reglamento del órgano rector", "Las resoluciones de la ONCDOFT"], "a": 0, "e": "Art. 1."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la promoción de la cultura de cumplimiento, en conjunto con el Responsable, es obligación del:", "o": ["Presidente del Consejo de Administración", "Auxiliar de la División de Inspección", "Proveedor de sistemas de la asociación", "Representante del empleador público"], "a": 0, "e": "Art. 21.a."}, {"t": "mc", "q": "Las Recomendaciones 22 y 23 extienden las medidas preventivas a:", "o": ["Las actividades y profesiones no financieras designadas", "Los bancos centrales y la banca pública", "Las aseguradoras de daños patrimoniales y fianzas", "Las bolsas de valores y sus corredores"], "a": 0, "e": "Casinos, inmobiliarias, metales, abogados, notarios, contadores y fiduciarios."}, {"t": "mc", "q": "La figura del «umbral» en el estándar del GAFI sirve para:", "o": ["Definir cuándo se activa una obligación concreta", "Fijar el monto máximo de una operación", "Determinar la pena aplicable al delito de lavado", "Calcular la multa por incumplimiento"], "a": 0, "e": "Activa deberes, no prohíbe operaciones."}, {"t": "mc", "q": "Quien supervisa en materia de prevención al mercado de valores venezolano es:", "o": ["La Superintendencia Nacional de Valores", "La Superintendencia de Bancos", "La Comisión Nacional de Casinos y Salas de Bingo", "La Bolsa de Valores de Caracas"], "a": 0, "e": "SUNAVAL dicta y supervisa en su sector."}, {"t": "mc", "q": "Elevar el apetito de riesgo para que la cartera «quepa» dentro de él es:", "o": ["Una forma de ocultar el problema en lugar de gestionarlo", "Una decisión legítima que corresponde a la gerencia comercial", "Una práctica recomendada en mercados pequeños", "Una exigencia del supervisor en inspecciones"], "a": 0, "e": "El indicador se ajusta al riesgo, no al revés."}, {"t": "mc", "q": "La Recomendación 1 exige a los países, como punto de partida:", "o": ["Evaluar sus riesgos y aplicar enfoque basado en riesgo", "Crear un registro público de beneficiarios finales", "Tipificar el lavado con pena mínima de cinco años", "Prohibir las operaciones en efectivo"], "a": 0, "e": "Es la recomendación cabecera del sistema."}, {"t": "vf", "q": "La notificación por cartel antes del decomiso de un bien sin titular identificado protege el derecho de defensa de posibles interesados.", "a": true, "e": "Es una garantía procesal."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la constancia de registro es requisito indispensable para gestionar:", "o": ["Certificaciones de solvencia y autorizaciones de inversión", "Tarjetas de crédito personales de cada uno de los socios", "Licencias de conducir para los miembros de los consejos", "Permisos de construcción de las viviendas de los socios"], "a": 0, "e": "Punto séptimo."}]}, {"titulo": "Examen integral 2", "q": [{"t": "mc", "q": "Según la LOCDOFT, un empleado comenta a un cliente que su operación está siendo examinada, sin llegar a mencionar reporte alguno. Esa conducta:", "o": ["Viola también el deber de confidencialidad", "No viola nada, pues aún no había reporte", "Solo es falta si el cliente huye", "Solo la sanciona el código de ética"], "a": 0, "e": "Art. 14."}, {"t": "mc", "q": "Las medidas intensificadas deben aplicarse, entre otros casos, a:", "o": ["Relaciones con países de mayor riesgo", "Todos los clientes extranjeros sin excepción", "Clientes que paguen con tarjeta de crédito", "Operaciones realizadas en fin de semana"], "a": 0, "e": "El riesgo determina la intensidad."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, el riesgo que permanece después de aplicar los controles es el:", "o": ["Residual", "Inherente", "Bruto", "Potencial"], "a": 0, "e": "Se compara con el apetito de riesgo."}, {"t": "mc", "q": "El secreto bancario o profesional frente a una solicitud de la autoridad en esta materia:", "o": ["No puede invocarse para negar la información", "Prevalece siempre sobre el deber de informar", "Solo cede ante una orden del Presidente", "Depende del monto de la operación"], "a": 0, "e": "El estándar internacional y la ley lo resuelven así."}, {"t": "vf", "q": "Las Recomendaciones del GAFI aplican el principio de que las instituciones financieras no deben llevar cuentas anónimas ni con nombres ficticios.", "a": true, "e": "Regla contenida en la Recomendación 10."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, las inspecciones pueden ser generales o por tópicos y persiguen identificar:", "o": ["Sujetos que requieran mayor esfuerzo de supervisión", "Asociados con mayor capacidad de ahorro personal", "Empleadores con mejores beneficios sociales", "Proveedores que ofrezcan los precios más bajos"], "a": 0, "e": "Art. 11."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un cliente fracciona pagos justo por debajo de un umbral interno. La señal apunta a:", "o": ["Estructuración para evitar controles", "Planificación financiera ordinaria", "Integración de fondos ya legitimados", "Debida diligencia simplificada"], "a": 0, "e": "Tipología de fraccionamiento."}, {"t": "mc", "q": "Entre las medidas que Viena 1988 introduce destaca:", "o": ["El decomiso del producto del delito y la cooperación", "La creación de unidades de inteligencia financiera", "El registro de beneficiarios finales", "La declaración de efectivo en frontera"], "a": 0, "e": "Decomiso, extradición y asistencia judicial recíproca."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, los fondos de fuente legal requieren indagar con mayor minuciosidad para determinar si pueden financiar terrorismo.", "a": true, "e": "Art. 45.4."}, {"t": "mc", "q": "Las circulares de la UNIF dirigidas a los sujetos obligados suelen tratar, entre otros temas:", "o": ["Formatos, plazos y contenido de los reportes", "El monto de las tarifas de servicios", "La designación de los jueces competentes", "El régimen tributario de los sujetos"], "a": 0, "e": "Son instrucciones operativas del receptor de los reportes."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el expediente del trabajador debe incluir referencias con una vigencia mínima de:", "o": ["Tres meses", "Seis meses", "Un año", "Un mes"], "a": 0, "e": "Art. 59."}, {"t": "mc", "q": "Un Estado extranjero pide a Venezuela decomisar bienes de un investigado. La LOCDOFT exige, entre otros requisitos:", "o": ["Que la conducta sea delito en ambos países", "Que el investigado sea venezolano", "Que los bienes estén en el país solicitante", "Que medie una sentencia del país requerido"], "a": 0, "e": "Doble incriminación."}, {"t": "mc", "q": "Un directivo aprueba operaciones sin leer los informes de cumplimiento y por ello pasa un caso de lavado. Puede responder:", "o": ["Por su falta de cuidado, aunque no participara", "Solo si recibió un beneficio económico", "Solo si firmó personalmente la operación", "En ningún caso, por no ser autor del delito"], "a": 0, "e": "La ley prevé la responsabilidad por imprudencia o negligencia."}, {"t": "mc", "q": "Según la Providencia ONCDOFT-002-2021, el registro unificado de sujetos obligados se identifica como:", "o": ["RUSO-ONCDOFT", "RUAP-ONCDOFT", "RIF-ONCDOFT", "SIAR-ONCDOFT"], "a": 0, "e": "G.O. 42.118. El RUAP es el registro de actuación de los contadores."}, {"t": "mc", "q": "Para un cliente de riesgo bajo, la frecuencia de actualización:", "o": ["Puede ser mayor, siempre que esté justificada", "Debe ser igual a la del riesgo alto", "No es necesaria en ningún caso", "La fija el intermediario que captó al cliente"], "a": 0, "e": "Proporcionalidad documentada."}, {"t": "vf", "q": "Que el dinero provenga de un banco regulado elimina por sí solo el riesgo de lavado de la operación.", "a": false, "e": "El lavado suele pasar por entidades reguladas; hay que analizar origen y propósito."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los controles profundos sobre un área específica se denominan:", "o": ["Fiscalizaciones tópicas", "Auditorías financieras", "Asambleas ordinarias", "Informes de gestión"], "a": 0, "e": "Art. 14."}, {"t": "vf", "q": "La Convención de Mérida pide a los Estados considerar el establecimiento de sistemas de declaración patrimonial de los funcionarios públicos.", "a": true, "e": "Artículo 52 y concordantes del capítulo preventivo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, si la verificación detecta falsedad en los datos de un asociado, el sujeto informará a SUDECA:", "o": ["La suspensión temporal y lo comunicará al responsable", "El retiro definitivo y lo publicará en la cartelera", "La exclusión inmediata y lo avisará a su empleador", "La expulsión sumaria y lo notificará a la asamblea"], "a": 0, "e": "Art. 55."}, {"t": "mc", "q": "El «embargo preventivo» o aseguramiento en Palermo consiste en:", "o": ["Prohibir temporalmente transferir o disponer de bienes", "Transferir la propiedad de los bienes al Estado de inmediato", "Vender los bienes y conservar el precio", "Entregar los bienes a la víctima"], "a": 0, "e": "Medida cautelar previa al decomiso."}, {"t": "mc", "q": "¿Qué exige el GAFI sobre las transferencias electrónicas (R.16)?", "o": ["Incluir datos de ordenante y beneficiario", "Ser gratuitas para el cliente que las ordena", "Estar prohibidas por encima de un monto fijo", "Realizarse solo entre cuentas del mismo país"], "a": 0, "e": "Trazabilidad."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la declaración de actividades en el SIGECAF debe actualizarse:", "o": ["Mensualmente", "Trimestralmente", "Semestralmente", "Anualmente"], "a": 0, "e": "Art. 74."}, {"t": "mc", "q": "Para Palermo, un «delito grave» es el que tiene una pena privativa de libertad máxima de al menos:", "o": ["Cuatro años", "Dos años", "Cinco años", "Diez años"], "a": 0, "e": "Art. 2 b) de Palermo. La LOCDOFT habla de más de cinco años."}, {"t": "mc", "q": "La figura del «delito determinante» en el lavado significa:", "o": ["El delito previo que genera los fondos ilícitos", "El delito más grave del concurso", "El delito que se comete en el territorio extranjero", "El delito que prescribe en último lugar"], "a": 0, "e": "El lavado es un delito derivado."}, {"t": "mc", "q": "La Convención de Mérida se distingue de Palermo y Viena en que:", "o": ["Se centra en corrupción y restitución de activos", "Solo trata de narcotráfico transnacional", "Solo se aplica a personas jurídicas", "Solo regula la extradición de funcionarios"], "a": 0, "e": "Es el primer instrumento universal anticorrupción."}, {"t": "mc", "q": "Para un país, figurar en las listas del GAFI suele traducirse en:", "o": ["Mayor costo y fricción en sus operaciones externas", "La suspensión automática de su moneda nacional", "Pérdida de su asiento en la ONU", "Prohibición de recibir remesas"], "a": 0, "e": "El efecto es reputacional y financiero."}, {"t": "mc", "q": "El protocolo sobre tráfico ilícito de migrantes se distingue de la trata porque:", "o": ["El migrante consiente el traslado y no hay explotación posterior", "Siempre involucra menores de edad", "Solo se aplica a fronteras marítimas", "Exige la participación de al menos un funcionario público"], "a": 0, "e": "Consentimiento y finalidad de explotación son los criterios."}, {"t": "mc", "q": "Según la Convención de Palermo, la tipificación de la participación en un grupo delictivo organizado se ubica en su artículo:", "o": ["5", "6", "8", "12"], "a": 0, "e": "El 6 es blanqueo; el 8, corrupción; el 12, decomiso."}, {"t": "vf", "q": "Según la Providencia SCA-001-2025 de SUDECA, la providencia entró en vigencia a partir de su publicación en la Gaceta Oficial.", "a": true, "e": "Disposición final. Trampa: la norma de turismo de 2026 tiene una vacatio de 60 días."}, {"t": "mc", "q": "Una señal de que la cultura de cumplimiento es débil es que:", "o": ["Las excepciones al procedimiento se vuelvan rutina", "El manual se actualice todos los años", "La capacitación sea obligatoria para todo el personal", "La junta reciba informes trimestrales"], "a": 0, "e": "La excepción normalizada erosiona el control."}, {"t": "mc", "q": "Un cliente de riesgo alto presenta documentos con datos inconsistentes que no se pueden verificar. Lo correcto es:", "o": ["Analizar el caso y evaluar la notificación a la UNIF", "Aceptar los documentos y reclasificar el riesgo", "Archivar la solicitud sin más trámite", "Informarle que sus documentos serán revisados por SUDEASEG"], "a": 0, "e": "La falta de veracidad de datos es señal para análisis y eventual reporte."}, {"t": "mc", "q": "La diferencia entre el reporte periódico de operaciones en efectivo y el reporte de actividad sospechosa es que el primero:", "o": ["Se envía por regla y el segundo por análisis", "Se envía por sospecha y el segundo por regla", "Ambos se envían ante cualquier operación", "Ambos se envían solo a la superintendencia"], "a": 0, "e": "Reportes sistemáticos frente a ROS."}, {"t": "mc", "q": "Para que Palermo se aplique se requiere, por regla general:", "o": ["Carácter transnacional y un grupo delictivo organizado", "Que el delito tenga una pena máxima mayor a diez años", "Que intervenga un funcionario público", "Que el delito se cometa con violencia"], "a": 0, "e": "Ambos elementos, salvo las excepciones del propio texto."}, {"t": "mc", "q": "Un cliente cambia de actividad económica y no se actualiza su perfil. El efecto es:", "o": ["Su clasificación de riesgo deja de ser válida", "Su contrato se anula automáticamente", "Su tarifa debe recalcularse de inmediato", "Su expediente pasa al archivo pasivo"], "a": 0, "e": "La información desactualizada invalida el análisis."}, {"t": "vf", "q": "Entregar a la autoridad información incompleta sobre un cliente investigado puede constituir un incumplimiento en sí mismo.", "a": true, "e": "La calidad y la integridad de la respuesta forman parte del deber."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, si un control reduce mucho la probabilidad pero el impacto sigue siendo catastrófico, el riesgo residual debe:", "o": ["Evaluarse frente al apetito y la tolerancia", "Darse por mitigado de manera automática", "Igualarse siempre al riesgo inherente", "Excluirse de la matriz de la entidad"], "a": 0, "e": "Probabilidad e impacto se valoran en conjunto."}, {"t": "mc", "q": "Según la Convención de Mérida, el capítulo dedicado a la recuperación de activos es el:", "o": ["V", "II", "III", "IV"], "a": 0, "e": "El II es prevención; el III, penalización; el IV, cooperación."}, {"t": "mc", "q": "Dentro del factor geográfico, eleva el riesgo que el cliente opere en:", "o": ["Jurisdicciones con deficiencias reconocidas en prevención", "Países que tengan tratados de doble tributación suscritos", "Ciudades con alta densidad poblacional", "Zonas con muchas sucursales bancarias"], "a": 0, "e": "Se usan las listas y evaluaciones disponibles."}, {"t": "vf", "q": "Una misma tecnología puede reducir el riesgo cuando sirve al monitoreo y aumentarlo cuando facilita el anonimato.", "a": true, "e": "El análisis debe ser concreto."}, {"t": "mc", "q": "La Recomendación 29 ordena a cada país:", "o": ["Establecer una unidad de inteligencia financiera", "Crear un tribunal especializado en lavado", "Designar un fiscal nacional anticorrupción", "Mantener un registro público de cuentas"], "a": 0, "e": "Centro nacional de recepción y análisis."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la política «Conozca a su Empleador» exige identificar:", "o": ["A quienes ejercen la titularidad del empleador", "A los clientes habituales del empleador", "A los vecinos de la sede del empleador", "A los proveedores de la competencia"], "a": 0, "e": "Art. 47."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un producto de bajo monto, pero que permite pagos anónimos a terceros, debe calificarse considerando:", "o": ["Su anonimato además del monto reducido", "Únicamente su monto reducido por operación", "Únicamente el volumen total vendido del año", "Únicamente el país de su proveedor externo"], "a": 0, "e": "El anonimato incrementa el riesgo inherente."}, {"t": "mc", "q": "El enfoque basado en riesgo parte de la idea de que los recursos de control:", "o": ["Son limitados y deben asignarse donde más riesgo hay", "Deben repartirse por igual entre todos los clientes", "Los fija el supervisor para cada empresa", "Dependen del tamaño del capital social"], "a": 0, "e": "Eficiencia y proporcionalidad."}, {"t": "mc", "q": "Si la norma local es más laxa que el estándar del GAFI, lo que ocurre es que:", "o": ["El país puede ser calificado como no cumplidor", "El estándar se adapta a la norma local", "Los sujetos obligados quedan exentos", "La diferencia la resuelve el sector privado"], "a": 0, "e": "Las evaluaciones mutuas detectan esas brechas."}, {"t": "mc", "q": "Los proveedores de servicios de activos virtuales, según el GAFI, deben:", "o": ["Registrarse o licenciarse y cumplir las medidas preventivas", "Quedar prohibidos en todas las jurisdicciones evaluadas", "Operar sin identificar a sus usuarios", "Reportar solo a su casa matriz"], "a": 0, "e": "Se les aplican las obligaciones de las instituciones financieras."}, {"t": "mc", "q": "La supervisión basada en riesgo implica que el supervisor:", "o": ["Asigna su esfuerzo según el riesgo de cada supervisado", "Inspecciona a todos con la misma frecuencia", "Solo actúa cuando recibe una denuncia", "Delega la supervisión en firmas de auditores privados"], "a": 0, "e": "El mismo principio aplicado al supervisor."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, se detecta que un proveedor no actúa aparentemente por cuenta propia y, más tarde, que su actividad es sospechosa. Corresponde, en orden:", "o": ["Intensificar y luego RAS y recomendar cesar", "Reportar y luego aplicar diligencia estándar", "Cesar y luego solicitar autorización judicial", "Continuar y consignar el caso en la asamblea"], "a": 0, "e": "Art. 66."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, en una investigación, una caja no tiene sus libros al día y alega que usa formularios. La consecuencia es que:", "o": ["Se presume la omisión intencional del ilícito", "Los formularios suplen los libros sin efecto", "Solo se considera un error de forma", "Se concede un plazo de veinte días"], "a": 0, "e": "Puntos décimo y décimo primero."}, {"t": "mc", "q": "La función de la red de autoridades centrales en la cooperación internacional es:", "o": ["Canalizar y agilizar las solicitudes entre Estados", "Juzgar los casos transnacionales", "Fijar las penas que resultan aplicables en cada país", "Supervisar a los sujetos obligados"], "a": 0, "e": "Punto de contacto formal de cada Estado."}, {"t": "mc", "q": "La información que el supervisor entrega al sector sobre tendencias y señales se denomina:", "o": ["Retroalimentación, prevista en la Recomendación 34", "La autoevaluación nacional de riesgos del país", "Informe de evaluación mutua", "Plan de acción del país"], "a": 0, "e": "Guía y retroalimentación."}]}, {"titulo": "Examen integral 3", "q": [{"t": "mc", "q": "¿Por qué se dice que seguir el dinero es clave en la lucha contra el crimen organizado?", "o": ["Persiguen lucro y su patrimonio es vulnerable", "El dinero es ilegal por naturaleza", "Es una tradición de la investigación penal", "Es más barato que investigar a las personas"], "a": 0, "e": "Decomiso y trazabilidad."}, {"t": "mc", "q": "Palermo prevé los equipos conjuntos de investigación para:", "o": ["Permitir que autoridades de varios Estados trabajen juntas", "Sustituir a los tribunales nacionales", "Crear una policía internacional permanente", "Juzgar los hechos en el territorio de un tercer Estado"], "a": 0, "e": "Herramienta de cooperación operativa."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, los «gatekeepers» son profesionales que:", "o": ["Controlan el acceso a recursos o decisiones", "Vigilan las sedes de los entes reguladores", "Custodian físicamente el dinero en efectivo", "Auditan únicamente a las empresas públicas"], "a": 0, "e": "Notarios, abogados y contadores, entre otros."}, {"t": "vf", "q": "Los organismos regionales de estilo GAFI aplican las mismas cuarenta recomendaciones en su región.", "a": true, "e": "Comparten estándar y metodología."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los factores clásicos de riesgo incluyen clientes, productos o servicios, canales y:", "o": ["Zonas geográficas", "Salarios del personal", "Colores corporativos", "Dividendos repartidos"], "a": 0, "e": "Se añaden tecnologías y otros factores sectoriales."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la frecuencia e intensidad de las supervisiones se determina considerando, entre otros:", "o": ["La clasificación de riesgo y los incrementos inusuales", "La cantidad de sillas de la sede de cada asociación", "El número de hijos de los miembros de los consejos", "La edad promedio de los asociados de la caja"], "a": 0, "e": "Art. 13."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, los formularios pueden sustituir a los libros del Responsable de Cumplimiento.", "a": false, "e": "Punto décimo: son complementarios y no los sustituyen."}, {"t": "mc", "q": "Un caso de lavado de dinero proveniente exclusivamente del narcotráfico, ¿en qué tratado universal tiene su primera base de tipificación?", "o": ["Convención de Viena de 1988", "Convención de Palermo de 2000", "Convención de Mérida de 2003", "Convenio de la Financiación del Terrorismo de 1999"], "a": 0, "e": "Viena 1988 fue el primer tratado en exigir la tipificación del lavado, limitado al producto del tráfico ilícito de drogas."}, {"t": "mc", "q": "El riesgo reputacional derivado de un caso de lavado consiste en:", "o": ["La pérdida de confianza de clientes y contrapartes", "El costo de la multa impuesta", "La pérdida de la provisión contable constituida", "El aumento de la morosidad"], "a": 0, "e": "Es distinto del riesgo legal y del financiero."}, {"t": "mc", "q": "La matriz de riesgo combina habitualmente dos dimensiones, que son:", "o": ["Probabilidad e impacto", "Tarifa y morosidad", "Antigüedad y volumen", "Solvencia y liquidez"], "a": 0, "e": "Cada riesgo se ubica según ambas."}, {"t": "mc", "q": "Según el GAFI, el transporte físico transfronterizo de efectivo se aborda en la Recomendación:", "o": ["32", "16", "15", "33"], "a": 0, "e": "R.32."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la matriz de riesgo que SUDECA remite a los sujetos requiere aprobación previa de:", "o": ["La ONCDOFT", "La UNIF", "La asamblea", "El Consejo de Vigilancia"], "a": 0, "e": "Art. 38."}, {"t": "mc", "q": "Un delito es transnacional para Palermo cuando, entre otros supuestos:", "o": ["Se comete en más de un Estado", "Lo comete un extranjero en territorio nacional", "Los fondos se depositan en un banco extranjero", "La víctima tiene otra nacionalidad"], "a": 0, "e": "También: preparación en otro Estado, grupo que opera en varios, o efectos sustanciales en otro."}, {"t": "mc", "q": "Según el GAFI, un banco venezolano abre una relación con un banco extranjero sin evaluar sus controles. El incumplimiento se ubica en la Recomendación:", "o": ["13", "14", "17", "19"], "a": 0, "e": "R.13: corresponsalía."}, {"t": "mc", "q": "Cuando la UNIF considera que un ROS tiene indicios suficientes, lo que corresponde es:", "o": ["Remitir la información al Ministerio Público", "Dictar una medida preventiva de congelamiento", "Devolverlo al sujeto obligado para ampliar datos", "Remitirlo a la ONCDOFT para su juzgamiento"], "a": 0, "e": "El Ministerio Público es titular de la acción penal."}, {"t": "mc", "q": "Una empresa privada contribuye intencionalmente a la comisión de delitos de delincuencia organizada. Según la LOCDOFT:", "o": ["Responder civil, administrativa y penalmente como persona jurídica", "Responden únicamente sus directivos como personas naturales", "Responde solo en lo administrativo ante su órgano de control", "Responde solo cuando el delito llegue a consumarse del todo"], "a": 0, "e": "La responsabilidad de personas jurídicas está prevista expresamente."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el Responsable de Cumplimiento debe recibir formación y capacitación:", "o": ["Una vez al año como mínimo programado", "Una vez cada cinco años como máximo", "Solo cuando ocurra una inspección", "Solo al ser electo por la asamblea"], "a": 0, "e": "Art. 78.6."}, {"t": "mc", "q": "La Recomendación 36 pide a los países:", "o": ["Ratificar e implementar los convenios internacionales", "Crear un tribunal regional contra el lavado de activos", "Armonizar sus códigos penales con el GAFI", "Suscribir acuerdos bilaterales con el GAFI"], "a": 0, "e": "Viena, Palermo, Mérida y el Convenio de 1999."}, {"t": "mc", "q": "La Recomendación 4 se ocupa de:", "o": ["Decomiso y medidas provisionales", "Delito de financiamiento del terrorismo", "Organizaciones sin fines de lucro", "Debida diligencia reforzada"], "a": 0, "e": "Permite privar al delito de sus activos."}, {"t": "mc", "q": "La diferencia entre una lista de sanciones y una lista de países de riesgo es que la primera:", "o": ["Obliga a congelar fondos de designados concretos", "Clasifica a las jurisdicciones según su sistema legal", "Es elaborada por el sector privado", "Tiene carácter meramente orientativo"], "a": 0, "e": "Obligación directa frente a criterio de riesgo."}, {"t": "vf", "q": "La ONCDOFT, como órgano rector, define lineamientos y coordina la política nacional sin sustituir a los órganos de control sectoriales.", "a": true, "e": "Cada órgano cumple una función distinta."}, {"t": "mc", "q": "La ley venezolana vigente contra la delincuencia organizada y el financiamiento al terrorismo se publicó en:", "o": ["G.O. 39.912 del 30-04-2012", "G.O. 38.281 del 27-09-2005", "G.O. 41.522 del 12-11-2018", "G.O. 42.118 del 03-05-2021"], "a": 0, "e": "La 41.522 es el decreto de la UNIF y la 42.118 trae la Providencia ONCDOFT-002-2021."}, {"t": "vf", "q": "Un monto bajo exime al sujeto obligado de analizar una operación cuando concurren señales de alerta como el fraccionamiento.", "a": false, "e": "El análisis depende del patrón y del perfil; el fraccionamiento usa montos bajos justamente para evadir controles."}, {"t": "vf", "q": "Según la LOCDOFT, la obligación de atención especial a operaciones inusuales alcanza también a fondos que aparentan tener origen lícito.", "a": true, "e": "Lo dice expresamente el deber de atención."}, {"t": "mc", "q": "El mecanismo de seguimiento de la Convención Interamericana se identifica como:", "o": ["MESICIC", "MONEYVAL", "GAFIC", "MESECVI"], "a": 0, "e": "MESECVI corresponde a otra convención interamericana."}, {"t": "mc", "q": "La Recomendación 15 aborda:", "o": ["Nuevas tecnologías y activos virtuales", "Controles internos de las instituciones", "Países de mayor riesgo", "Estadísticas nacionales"], "a": 0, "e": "Exige evaluar riesgos antes de lanzar productos."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, a mayor nivel de riesgo, los métodos para verificar identidad y datos deben ser:", "o": ["Más intensificados, pormenorizados o estrictos", "Más simples, breves y de carácter opcional", "Idénticos para todos sin ninguna diferencia", "Suspendidos hasta recibir una inspección"], "a": 0, "e": "Art. 40."}, {"t": "mc", "q": "Respecto de Mérida, la Convención Interamericana contra la Corrupción es:", "o": ["Anterior en el tiempo y de alcance regional", "Posterior y de alcance universal", "Un protocolo adicional de aquella", "Un instrumento que no guarda relación con ella"], "a": 0, "e": "1996 frente a 2003; OEA frente a ONU."}, {"t": "vf", "q": "El financiamiento del terrorismo puede provenir de fuentes lícitas y de montos reducidos.", "a": true, "e": "Por eso el monitoreo no puede basarse solo en el monto."}, {"t": "vf", "q": "Según la LOCDOFT, los abogados en libre ejercicio pueden ser sujetos obligados cuando actúan por sus clientes en la compraventa de inmuebles.", "a": true, "e": "Art. 9, numeral 9."}, {"t": "vf", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el Consejo de Administración puede remover al Responsable de Cumplimiento de sus funciones de prevención.", "a": false, "e": "Punto quinto."}, {"t": "mc", "q": "Entre las medidas de Viena 1988, ¿cuál se vincula directamente con la lucha contra el lavado?", "o": ["Decomiso del producto y de los bienes derivados", "La regulación de pasaportes y visados", "La creación de unidades de inteligencia financiera", "La fijación de umbrales de declaración de efectivo"], "a": 0, "e": "Viena regula decomiso, extradición y asistencia judicial; las UIF y los umbrales vienen de estándares posteriores."}, {"t": "mc", "q": "Si la UNIF pide información a un sujeto obligado sobre un cliente, el sujeto obligado debe:", "o": ["Entregarla y no informar al cliente", "Pedir autorización al cliente primero", "Entregar solo lo que considere relevante", "Exigir una orden judicial previa"], "a": 0, "e": "Deber de colaboración y reserva."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, los controles se califican como eficaces solo porque existen en el manual. Con ello se sobreestima:", "o": ["La reducción del riesgo residual", "El riesgo inherente de los clientes", "La probabilidad de los eventos", "El apetito de riesgo de la junta"], "a": 0, "e": "El efecto del control depende de su operación real."}, {"t": "mc", "q": "El tono desde la alta dirección influye en el sistema porque:", "o": ["El personal replica la conducta que ve arriba", "La ley lo exige expresamente como requisito", "Reduce el costo de la capacitación", "Sustituye la necesidad de controles"], "a": 0, "e": "La cultura se construye con el ejemplo."}, {"t": "mc", "q": "La Convención de Estrasburgo de 1990, en el ámbito europeo, trata de:", "o": ["Blanqueo, investigación, incautación y decomiso del producto del delito", "Protección de los derechos humanos", "Cooperación aduanera entre Estados", "Reconocimiento y ejecución de sentencias civiles extranjeras"], "a": 0, "e": "Instrumento regional europeo sobre decomiso."}, {"t": "mc", "q": "Un cliente fracciona operaciones justo por debajo del umbral del reporte periódico. Eso:", "o": ["Es señal de alerta que exige análisis y posible ROS", "Es legítimo porque respeta el umbral", "Solo importa si supera el umbral anual", "Se resuelve cobrando una comisión mayor por el servicio"], "a": 0, "e": "Estructuración para evadir el reporte."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el expediente del asociado, empleado o proveedor debe:", "o": ["Mantenerse actualizado y revisarse anualmente", "Revisarse una sola vez, al inicio de la relación", "Remitirse cada mes a la Unidad de Inteligencia", "Eliminarse al concluir cada ejercicio económico"], "a": 0, "e": "Art. 40."}, {"t": "mc", "q": "Los Convenios de Ginebra, a diferencia de los anteriores, regulan:", "o": ["El derecho internacional humanitario en conflictos armados", "El lavado de activos transfronterizo", "La corrupción de funcionarios de organismos internacionales", "El tráfico de estupefacientes"], "a": 0, "e": "No pertenecen a esta materia: distractor frecuente."}, {"t": "mc", "q": "Un cambio que obliga a revisar la autoevaluación antes del plazo ordinario es:", "o": ["El lanzamiento de un canal de venta digital", "La contratación de un nuevo mensajero", "El cambio de proveedor de papelería", "La renovación del mobiliario de oficina"], "a": 0, "e": "Nuevos canales alteran el perfil de riesgo."}, {"t": "mc", "q": "La importancia histórica de Viena 1988 para el sistema actual es que:", "o": ["Dio origen al delito de lavado en el derecho internacional", "Creó el Grupo de Acción Financiera Internacional", "Estableció las primeras cuarenta recomendaciones", "Fundó la Oficina de las Naciones Unidas contra la Droga"], "a": 0, "e": "El GAFI nace en 1989, un año después, impulsado en parte por ella."}, {"t": "mc", "q": "Según la LOCDOFT, las asociaciones civiles, como las cajas de ahorro, tienen la condición de:", "o": ["Sujetos obligados", "Órganos de control", "Entes rectores", "Terceros exentos"], "a": 0, "e": "Art. 9, numeral 6, citado por la Circular SCA-DS-001-2026."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, llevar los registros de declaraciones de conocimiento del Código de Ética corresponde al:", "o": ["Presidente del Consejo de Administración", "Auxiliar de la División de Inspección", "Proveedor de servicios contables", "Representante del empleador"], "a": 0, "e": "Art. 21.c."}, {"t": "mc", "q": "¿Qué busca la cooperación internacional en LC/FT (R.36 a R.40)?", "o": ["Asistencia mutua, extradición, congelamiento y decomiso", "Reemplazar a los tribunales nacionales en delitos graves", "Prohibir el intercambio de información financiera", "Cobrar tasas por las solicitudes de cooperación"], "a": 0, "e": "El delito es transnacional."}, {"t": "vf", "q": "Una buena práctica es revisar el perfil de riesgo del cliente también cuando cambia su actividad, su domicilio o su estructura de propiedad.", "a": true, "e": "Son eventos disparadores de revisión."}, {"t": "mc", "q": "La Providencia SAA-01-0536-2024 aparece en la G.O. Extraordinaria N° 6.835. ¿Qué indica esto sobre su vigencia?", "o": ["Es la vigente desde 2024 y derogó la de 2021", "Es una norma antigua reemplazada en 2024", "Está derogada por la Reforma de 2023", "Es un proyecto aún no vigente"], "a": 0, "e": "Norma vigente."}, {"t": "mc", "q": "El Convenio Internacional para la Represión de la Financiación del Terrorismo es de:", "o": ["1999", "1988", "2000", "2003"], "a": 0, "e": "Adoptado por la Asamblea General de la ONU en diciembre de 1999."}, {"t": "vf", "q": "Según el enfoque basado en riesgo del GAFI, un control compensatorio puede justificar que se omita la evaluación del riesgo inherente.", "a": false, "e": "Primero se mide lo inherente."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, la Matriz de Riesgo Sectorial proporcionada por SUDECA debe actualizarse:", "o": ["Semestralmente", "Trimestralmente", "Anualmente", "Mensualmente"], "a": 0, "e": "Punto décimo cuarto."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, una operación inusual que, analizada, se presume que involucra fondos ilegales es:", "o": ["Actividad sospechosa", "Riesgo residual", "Falta administrativa", "Operación ordinaria"], "a": 0, "e": "Art. 4.1."}]}, {"titulo": "Examen integral 4", "q": [{"t": "mc", "q": "El riesgo asociado a la contratación totalmente digital se mitiga con:", "o": ["Verificación de identidad reforzada y biometría", "Reducción del monto máximo asegurable", "Eliminación del expediente del cliente", "Traslado de la responsabilidad al cliente"], "a": 0, "e": "Medidas compensatorias para la no presencialidad."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, un retiro de USD 2.000 exactos se registra en el Libro Auxiliar. Respecto del umbral especial:", "o": ["Se marca con su declaración de origen", "No se marca, porque debe superar el monto", "Se marca solo si es en efectivo y en bolívares", "No se marca, porque el umbral es USD 10.000"], "a": 0, "e": "Puntos décimo y décimo quinto: igualen o superen."}, {"t": "mc", "q": "La Recomendación 35 exige que existan sanciones que sean:", "o": ["Eficaces, proporcionales y disuasivas", "Exclusivamente penales y privativas de libertad", "Iguales para todos los sectores regulados", "Fijadas en dólares de los Estados Unidos"], "a": 0, "e": "Fórmula clásica del estándar."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el incumplimiento de la norma puede dar lugar a sanciones previstas en la ley del sector y en:", "o": ["La LOCDOFT y demás normas de la materia", "La Ley de Tránsito y la de Propiedad Horizontal", "El Código de Comercio y la Ley de Timbre Fiscal", "La Ley del Consumidor y la de Pesca y Acuicultura"], "a": 0, "e": "Art. 91."}, {"t": "mc", "q": "Evitar un riesgo, en el lenguaje de la gestión, significa:", "o": ["No realizar la actividad que lo genera", "Contratar un seguro que lo cubra", "Reducir su probabilidad con controles", "Aceptarlo y monitorearlo"], "a": 0, "e": "Evitar, mitigar, transferir y aceptar son las cuatro respuestas."}, {"t": "mc", "q": "Según el GAFI, la conservación mínima de registros de operaciones y de debida diligencia es de:", "o": ["Cinco años", "Tres años", "Diez años", "Siete años"], "a": 0, "e": "R.11."}, {"t": "mc", "q": "Según la LOCDOFT, un cliente acusa al banco de haberlo perjudicado con un reporte de sospecha hecho según la ley. El reporte:", "o": ["No acarrea responsabilidad penal, civil ni administrativa", "Acarrea responsabilidad civil si el reporte fue infundado", "Solo protege al oficial que lo firma", "Solo protege a la entidad, no a sus empleados"], "a": 0, "e": "Art. 13."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, los factores de riesgo incluyen cantidad de asociados, proveedores, saldos en cuenta, activos y:", "o": ["Ámbito territorial donde operan", "Preferencias personales de sus socios", "Número de ventanas de cada oficina", "Nombre comercial de sus empleadores"], "a": 0, "e": "Art. 31."}, {"t": "mc", "q": "Mérida pide a las instituciones financieras, respecto de las cuentas de altos funcionarios extranjeros:", "o": ["Un escrutinio intensificado de esas cuentas", "Su cierre automático al detectarlas", "Su reporte semanal al banco central", "Su exención del régimen de debida diligencia"], "a": 0, "e": "Artículo 52, antecedente convencional del tratamiento de PEP."}, {"t": "vf", "q": "Palermo cuenta con protocolos sobre trata de personas, tráfico ilícito de migrantes y armas de fuego.", "a": true, "e": "Son sus tres protocolos complementarios."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, promover la cultura de cumplimiento, de manera conjunta con el Responsable, es obligación de:", "o": ["El Consejo de Administración", "El proveedor de servicios", "La Unidad de Inteligencia", "Cada empleador asociado"], "a": 0, "e": "Punto tercero."}, {"t": "mc", "q": "Viena 1988 prevé la entrega vigilada como técnica especial, que consiste en:", "o": ["Dejar pasar un cargamento bajo control para identificar la red", "Entregar al detenido a otro Estado requirente", "Decomisar la mercancía en el punto de entrada", "Vigilar las cuentas bancarias del investigado durante un año"], "a": 0, "e": "Técnica especial de investigación recogida luego por Palermo."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, toda inducción o capacitación debe constar en un documento denominado:", "o": ["Declaración de conocimiento", "Compromiso institucional", "Planilla de proveedores", "Declaración de destino"], "a": 0, "e": "Arts. 75 y 80."}, {"t": "mc", "q": "El agravante por pertenecer a un grupo de delincuencia organizada responde a que:", "o": ["La estructura multiplica la capacidad de daño", "Los grupos siempre actúan con violencia", "Los miembros suelen ser extranjeros", "La ley presume reincidencia en el grupo"], "a": 0, "e": "El reproche mayor es por la organización."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, el formato único de identificación del asociado se denomina:", "o": ["Planilla de Identificación del asociado o asociada", "Declaración Jurada de Patrimonio del Empleador", "Ficha General de Proveedores de la Asociación", "Registro Único de Asociados ante la ONCDOFT"], "a": 0, "e": "Art. 51."}, {"t": "vf", "q": "Para operaciones ocasionales, el GAFI fija un umbral por encima del cual debe aplicarse CDD, salvo sospecha, en cuyo caso aplica siempre.", "a": true, "e": "La sospecha elimina la excepción."}, {"t": "mc", "q": "El artículo 14 de Mérida se ocupa de:", "o": ["Medidas para prevenir el blanqueo de dinero", "La penalización del soborno nacional y extranjero", "La recuperación directa de bienes", "La asistencia técnica entre Estados"], "a": 0, "e": "Conecta la corrupción con el sistema antilavado."}, {"t": "mc", "q": "La Recomendación 18 exige a los grupos financieros:", "o": ["Controles internos y políticas a nivel de grupo", "Separar por completo sus filiales extranjeras", "Centralizar todas las cuentas en la matriz", "Auditar sus sucursales cada cinco años"], "a": 0, "e": "Incluye sucursales y filiales en el exterior."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las operaciones que igualen o superen un monto especial deben marcarse en el Libro Auxiliar con su declaración de origen. Ese umbral es de:", "o": ["USD 2.000", "USD 1.500", "USD 10.000", "EUR 1.000"], "a": 0, "e": "Punto décimo y décimo quinto."}, {"t": "mc", "q": "Un empleado de un sujeto obligado recibe de un cliente un regalo costoso a cambio de acelerar un trámite. ¿Cómo debe interpretarse?", "o": ["Posible corrupción interna que se reporta al Oficial", "Obsequio normal que puede aceptarse con discreción", "Incentivo aceptable si el trámite es legítimo", "Asunto personal que no concierne a la empresa"], "a": 0, "e": "Prevención de corrupción interna."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, el plan de trabajo del Responsable debe ser presentado por el Consejo de Administración ante:", "o": ["La Asamblea General Extraordinaria u Ordinaria", "La Unidad Nacional de Inteligencia Financiera", "El Tribunal Supremo de Justicia en cada caso", "La Federación de los Colegios de Contadores"], "a": 0, "e": "Punto noveno."}, {"t": "mc", "q": "La autoevaluación de riesgo debe actualizarse, como mínimo:", "o": ["Anualmente y cuando cambie el perfil de riesgo", "Cada cinco años con la renovación del manual", "Solo cuando lo pida la superintendencia", "Cada vez que se designe un nuevo oficial"], "a": 0, "e": "Periodicidad y eventos disparadores."}, {"t": "mc", "q": "Un sujeto obligado quiere saber si la evaluación nacional de riesgos lo obliga. Lo correcto es que:", "o": ["Debe considerarla al construir su propia autoevaluación", "Puede ignorarla cuando su propio riesgo interno resulte bajo", "La sustituye por completo en su análisis", "Solo le aplica si es del sector bancario"], "a": 0, "e": "El riesgo país alimenta el riesgo de cada sujeto."}, {"t": "mc", "q": "Las medidas simplificadas de debida diligencia proceden cuando:", "o": ["El riesgo identificado es menor y no hay sospecha", "El cliente tiene más de cinco años de relación", "El monto está por debajo del umbral legal", "El cliente es una persona jurídica nacional"], "a": 0, "e": "Riesgo demostrado, no antigüedad ni monto."}, {"t": "mc", "q": "Un cliente insiste en contratar sin dejar datos de contacto verificables. Eso:", "o": ["Impide completar la diligencia y obliga a no vincularlo", "Es aceptable si deja al menos un número de teléfono", "Se resuelve con una declaración jurada", "Solo importa en contratos de alto valor"], "a": 0, "e": "Sin identificación plena no hay relación."}, {"t": "vf", "q": "La clasificación de riesgo de un cliente no es definitiva: debe revisarse ante nueva información o comportamiento inusual.", "a": true, "e": "Monitoreo continuo."}, {"t": "mc", "q": "El blanqueo del producto del delito en Mérida se tipifica en el artículo:", "o": ["23", "14", "20", "31"], "a": 0, "e": "El 14 es preventivo; el 23 es el tipo penal."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, la falta temporal o absoluta del responsable no suplida debe notificarse dentro de:", "o": ["Siete días hábiles", "Cinco días continuos", "Quince días hábiles", "Treinta días continuos"], "a": 0, "e": "Art. 21.f."}, {"t": "vf", "q": "Quien reporta de buena fe una operación sospechosa, aunque resulte infundada, debe estar protegido de responsabilidad.", "a": true, "e": "Evita que el miedo inhiba el reporte."}, {"t": "mc", "q": "Según el Convenio de 1999, los delitos de financiación del terrorismo no se consideran, para extradición, delitos:", "o": ["Políticos", "Fiscales", "Comunes", "Militares"], "a": 0, "e": "Art. 14: se «despolitizan» para evitar que se niegue la extradición."}, {"t": "mc", "q": "La malversación o peculado en Mérida consiste en que el funcionario:", "o": ["Desvíe bienes que se le confiaron por razón del cargo", "Reciba un obsequio de escaso valor", "Omita declarar su patrimonio al inicio de su gestión", "Contrate a un familiar en su despacho"], "a": 0, "e": "Artículo 17."}, {"t": "mc", "q": "Los resultados inmediatos que evalúa la metodología de efectividad son:", "o": ["Once", "Cuarenta", "Nueve", "Veinte"], "a": 0, "e": "Once resultados inmediatos."}, {"t": "mc", "q": "Que la empresa conozca el propósito de la relación con el cliente permite:", "o": ["Detectar después lo que no encaja con ese propósito", "Ofrecerle productos adicionales de la cartera", "Reducir el plazo de emisión del contrato", "Justificar un aumento de la tarifa"], "a": 0, "e": "El propósito es la vara para medir lo inusual."}, {"t": "mc", "q": "Para la LOCDOFT, la diferencia esencial entre un órgano de control y el órgano rector es que el primero:", "o": ["Supervisa a su sector y el segundo fija la política nacional", "Fija la política nacional y el segundo supervisa a los sectores", "Recibe los reportes y el segundo los analiza", "Juzga penalmente y el segundo sanciona"], "a": 0, "e": "Órganos de control por sector; ONCDOFT como rectoría."}, {"t": "mc", "q": "Una persona declara su efectivo al salir del país pero su origen resulta dudoso. Declarar:", "o": ["No legaliza los fondos ni impide una investigación", "Cierra cualquier investigación posterior", "Obliga a la autoridad a devolver el dinero", "Exime de toda responsabilidad penal al portador del dinero"], "a": 0, "e": "La declaración es un control, no una absolución."}, {"t": "vf", "q": "Según la LOCDOFT, el decomiso a solicitud de otro Estado requiere que medie doble incriminación.", "a": true, "e": "Principio de cooperación con límite de doble incriminación."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, falta de forma absoluta el Responsable y su ausencia no ha sido suplida. El aviso lo hace:", "o": ["El presidente de Administración, en 7 hábiles", "El presidente de Vigilancia, en 7 hábiles", "El presidente de Administración, en 15 continuos", "La asamblea de asociados, en 30 continuos"], "a": 0, "e": "Art. 21.f."}, {"t": "mc", "q": "El tráfico de influencias que Mérida pide considerar tipificar consiste en:", "o": ["Usar la influencia real o supuesta para obtener un beneficio", "Negociar contratos en nombre del Estado", "Opinar públicamente sobre una licitación en curso", "Reunirse con representantes de empresas"], "a": 0, "e": "Artículo 18."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el Informe de Evaluación Mutua de Venezuela se publicó en:", "o": ["Marzo de 2023", "Enero de 2019", "Junio de 2021", "Octubre de 2025"], "a": 0, "e": "Identificó brechas en las Recomendaciones 22, 23 y 28."}, {"t": "mc", "q": "¿Cuál es el riesgo de depender de un único indicador, como el monto de la operación, para detectar el lavado?", "o": ["Se pierden patrones como fraccionamiento y terceros", "Se generan demasiados reportes de operaciones", "El sistema se vuelve muy costoso de mantener", "Se reduce el número de clientes atendidos"], "a": 0, "e": "Los criminales adaptan sus operaciones."}, {"t": "mc", "q": "Según el GAFI, las contramedidas frente a países de mayor riesgo, cuando el GAFI las llama, se fundan en la Recomendación:", "o": ["19", "13", "1", "21"], "a": 0, "e": "R.19."}, {"t": "mc", "q": "El riesgo interno o de personal se mitiga, entre otras medidas, con:", "o": ["Políticas de conocimiento del empleado y rotación", "Aumento general de los salarios", "Reducción de la plantilla operativa", "Eliminación de los controles duales para agilizar"], "a": 0, "e": "Conoce a tu empleado."}, {"t": "mc", "q": "Según el enfoque basado en riesgo del GAFI, un nuevo canal digital sin contacto presencial aumenta sobre todo el factor de riesgo de:", "o": ["Canales de distribución", "Zona geográfica", "Tipo de persona", "Actividad económica"], "a": 0, "e": "El canal no presencial dificulta verificar identidad."}, {"t": "mc", "q": "La finalidad que Palermo atribuye al grupo delictivo organizado es:", "o": ["Obtener un beneficio económico u otro beneficio material", "Desestabilizar al gobierno legítimo de un Estado parte", "Controlar un territorio determinado", "Imponer una ideología por la fuerza"], "a": 0, "e": "El ánimo de lucro distingue al crimen organizado del terrorismo."}, {"t": "mc", "q": "¿Qué es el financiamiento de la proliferación de armas de destrucción masiva (FPADM)?", "o": ["Proveer fondos o servicios para armas de destrucción masiva", "Financiar guerras convencionales entre Estados", "Un tipo de lavado asociado a delitos fiscales", "Un delito informático contra instituciones financieras"], "a": 0, "e": "R.7."}, {"t": "mc", "q": "Según la LOCDOFT, los agentes cuya actividad principal es la intermediación de bienes raíces son:", "o": ["Sujetos obligados", "Órganos de control", "Usuarios ocasionales", "Entes de autorregulación"], "a": 0, "e": "Art. 9, numeral 10, literal a."}, {"t": "mc", "q": "¿En qué se diferencia el financiamiento del terrorismo del lavado de activos?", "o": ["En el FT los fondos pueden ser lícitos; la ilicitud está en el destino", "El FT siempre implica grandes sumas de origen ilícito comprobado", "El FT solo ocurre mediante traslado transfronterizo de efectivo", "El lavado solo se comete con fondos que provienen del narcotráfico"], "a": 0, "e": "Exige monitoreo por destino y contexto, no solo por origen."}, {"t": "mc", "q": "Un analista decide no revisar una operación inusual porque «el monto es bajo». Según el criterio de la LOCDOFT:", "o": ["El deber de atención no depende de la cuantía", "Tiene razón: solo se analizan operaciones superiores a US$10.000", "Tiene razón si el cliente es de riesgo bajo en el sistema", "Solo debe revisarla si la UNIF se lo solicita expresamente"], "a": 0, "e": "El deber aplica independientemente de la cuantía y aun cuando los fondos parezcan lícitos."}, {"t": "vf", "q": "La responsabilidad de la persona jurídica en Palermo existe sin perjuicio de la responsabilidad penal de las personas naturales que cometieron el delito.", "a": true, "e": "Son responsabilidades concurrentes."}, {"t": "vf", "q": "Según la LOCDOFT, el Estado y sus empresas están excluidos de la responsabilidad penal atribuida a las personas jurídicas por estos delitos.", "a": true, "e": "La exclusión opera para el Estado y sus empresas."}]}, {"titulo": "Examen integral 5", "q": [{"t": "mc", "q": "La Convención Interamericana contra la Corrupción se adoptó en:", "o": ["Caracas, en 1996, en el marco de la OEA", "Mérida, en 2003, en el marco de la ONU", "Palermo, en 2000, en el marco de la ONU", "Washington, en 1994, en el marco de la OEA"], "a": 0, "e": "Es el primer instrumento internacional anticorrupción."}, {"t": "mc", "q": "Un exceso de ROS «defensivos» sin análisis tampoco es deseable porque:", "o": ["Satura a la UIF y reduce su calidad", "Es ilegal reportar sin análisis profundo", "Reduce las tarifas de la empresa", "Aumenta los impuestos de la empresa"], "a": 0, "e": "Calidad frente a cantidad."}, {"t": "mc", "q": "Una persona viaja con US$9.800 y otra con US$12.000. ¿Quién debe declarar según la LOCDOFT?", "o": ["La que lleva US$12.000", "La que lleva US$9.800", "Ambas por ir en el mismo vuelo", "Ninguna, por ser inferiores a US$15.000"], "a": 0, "e": "Umbral: más de US$10.000."}, {"t": "mc", "q": "El umbral máximo que el GAFI fija para la declaración de efectivo en frontera es:", "o": ["Quince mil dólares o euros", "Diez mil dólares o euros", "Tres mil dólares o euros", "Veinte mil dólares o euros"], "a": 0, "e": "La LOCDOFT es más estricta con diez mil."}, {"t": "mc", "q": "Según la LOCDOFT, cerrar una cuenta sin autorización judicial durante una investigación penal se sanciona, por el órgano de control, con:", "o": ["1.000 a 3.000 U.T.", "300 a 500 U.T.", "500 a 1.000 U.T.", "3.000 a 5.000 U.T."], "a": 0, "e": "Art. 15."}, {"t": "mc", "q": "¿Qué recomendación del GAFI exhorta a ratificar e implementar Viena, Palermo, Mérida y el Convenio de Financiación del Terrorismo?", "o": ["R.36", "R.10", "R.20", "R.29"], "a": 0, "e": "R.36: instrumentos internacionales."}, {"t": "mc", "q": "El nombre completo del instrumento conocido como Convención de Viena de 1988 alude a:", "o": ["El tráfico ilícito de estupefacientes y sustancias sicotrópicas", "La delincuencia organizada de carácter transnacional y sus formas", "La corrupción de funcionarios públicos", "El derecho de los tratados entre Estados"], "a": 0, "e": "Cuidado: hay otras convenciones firmadas en Viena sobre materias distintas."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, un riesgo que puede ocurrir de manera reiterada con efectos significativos es riesgo:", "o": ["Alto", "Bajo", "Moderado", "Nulo"], "a": 0, "e": "Art. 4.34."}, {"t": "vf", "q": "Según el Convenio de 1999, los fondos utilizados para financiar pueden ser de origen lícito o ilícito.", "a": true, "e": "Art. 1: definición amplia de fondos."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, presentar a los asociados el informe anual de gestión en la materia es función de:", "o": ["El Presidente del Consejo de Vigilancia", "El inspector asignado por la División", "El proveedor de mayor monto del año", "El funcionario de enlace de la UNIF"], "a": 0, "e": "Art. 22.h."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, la inconsistencia entre perfil y operaciones es:", "o": ["El principal motivo de reporte", "Un motivo sin relevancia alguna", "Una causa de exención de reporte", "Un requisito del registro mercantil"], "a": 0, "e": "42,34 % en el segundo semestre de 2025 y 50 % en el primero."}, {"t": "mc", "q": "Un sistema que genera miles de alertas y ninguna se analiza indica:", "o": ["Un problema de calibración y de recursos", "Un control interno muy robusto", "Un cliente especialmente riesgoso en la cartera", "Una cartera bien segmentada"], "a": 0, "e": "Las alertas sin análisis no son control."}, {"t": "mc", "q": "El mecanismo de examen de la aplicación de Mérida consiste en:", "o": ["Revisiones entre pares de los Estados parte", "Inspecciones sorpresivas de la ONU", "Sanciones económicas por incumplimiento", "Auditorías de firmas privadas contratadas"], "a": 0, "e": "Modelo de revisión por pares."}, {"t": "mc", "q": "La Recomendación 32 regula:", "o": ["El transporte transfronterizo de efectivo", "La elaboración de estadísticas nacionales", "La orientación a los sujetos obligados", "El régimen de sanciones aplicables"], "a": 0, "e": "Declaración o divulgación en frontera."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, para implementar el programa de cumplimiento tras la capacitación recibida, el plazo fue de:", "o": ["Noventa días consecutivos", "Treinta días consecutivos", "Ciento veinte días hábiles", "Ciento ochenta días hábiles"], "a": 0, "e": "Disposición transitoria."}, {"t": "mc", "q": "Comparando Palermo con la LOCDOFT en el concepto de delito grave:", "o": ["Palermo usa cuatro años y la ley venezolana más de cinco", "Ambas usan exactamente cuatro años de pena", "Palermo usa cinco años y la ley venezolana cuatro años", "La ley venezolana no define el concepto"], "a": 0, "e": "Es una de las trampas más repetidas."}, {"t": "mc", "q": "Según la Circular SCA-DS-001-2026 de SUDECA, las operaciones de PEP o sus vinculados se registran en:", "o": ["Los Libros de Registros de Operaciones", "La cartelera informativa de la asociación", "El expediente del proveedor principal", "Los archivos del empleador de la caja"], "a": 0, "e": "Punto décimo, numeral 2."}, {"t": "mc", "q": "Según la Evaluación Sectorial de la ONCDOFT de 2026, el impacto del riesgo puede categorizarse, en su nivel máximo, como:", "o": ["Catastrófico", "Moderado", "Significativo", "Aceptable"], "a": 0, "e": "Escala: aceptable, significativo, moderado, crítico y catastrófico."}, {"t": "vf", "q": "Una organización sin fines de lucro que figura como sujeto obligado debe ser tratada con enfoque basado en riesgo y no con una presunción de ilicitud.", "a": true, "e": "El estándar internacional pide medidas focalizadas y proporcionales, no la exclusión del sector."}, {"t": "mc", "q": "Si la empresa no sabe a qué se dedica un cliente, lo que ocurre es que:", "o": ["No puede evaluar si sus operaciones son coherentes", "Debe clasificarlo automáticamente como riesgo bajo", "Pue ipología número uno en sentencias de la región es:", "o": ["El uso de testaferros", "El contrabando de oro", "El fraude de seguros", "La venta de vehículos"], "a": 0, "e": "Representa el 40 % según la Cuarta Actualización de Amenazas Regionales."}, {"t": "mc", "q": "Un sujeto obligado no financiero no está inscrito en el registro del órgano rector. La consecuencia principal es:", "o": ["Queda en incumplimiento y expuesto a sanción", "Pierde su personalidad jurídica de pleno derecho", "Debe cerrar hasta inscribirse", "No tiene consecuencia alguna"], "a": 0, "e": "El registro es obligatorio para los sujetos alcanzados."}, {"t": "mc", "q": "El sector de criptoactivos en Venezuela ha sido regulado en esta materia por:", "o": ["La Superintendencia Nacional de Criptoactivos", "La Superintendencia de Bancos", "El Banco Central de Venezuela", "La Superintendencia Nacional de Valores del país"], "a": 0, "e": "SUNACRIP dictó providencias sobre prevención y reportes."}, {"t": "mc", "q": "Una matriz de riesgo que clasifica a toda la cartera como riesgo bajo probablemente indica:", "o": ["Una metodología mal calibrada", "Una cartera excepcionalmente sana", "Un control interno muy eficaz", "Un supervisor poco exigente"], "a": 0, "e": "La ausencia total de riesgo alto es una señal de alerta metodológica."}, {"t": "mc", "q": "Según la Providencia SCA-001-2025 de SUDECA, se sospecha falsedad en los datos de un nuevo proveedor y, en otro caso, se detecta falsedad en los de un asociado. Corresponde, respectivamente:", "o": ["Advertir no continuar; informar suspensión a SUDECA", "Informar suspensión a SUDECA; advertir no continuar", "Reportar a la UNIF en ambos casos sin más análisis", "Continuar con ambos hasta recibir instrucciones"], "a": 0, "e": "Arts. 55 y 69."}, {"t": "vf", "q": "Según el GAFI, el deber de reportar sospechas incluye las operaciones intentadas, sin importar su monto.", "a": true, "e": "R.20 y su nota interpretativa."}, {"t": "mc", "q": "El artículo 5 de Mérida pid
